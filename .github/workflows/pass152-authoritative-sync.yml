name: Pass 152 Authoritative Repository Sync

on:
  push:
    branches:
      - copilot/release-complete-hhs-pass-152-nucleus
    paths:
      - .github/workflows/pass152-authoritative-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass152-authoritative-sync
  cancel-in-progress: false

jobs:
  extract-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZIP_URL: "https://www.dropbox.com/scl/fi/q6iqw3yotlv9w1yeyft56/hhs_pass_152_universal_elastic_closure_invariant_full_inherited_pass_history_nucleus.zip?rlkey=shz59o5fblq1g6xrsd5c7snkp&dl=1"
      ZIP_NAME: hhs_pass_152_universal_elastic_closure_invariant_full_inherited_pass_history_nucleus.zip
      ZIP_SIZE: "57645575"
      ZIP_SHA256: 8836e352396e440f8bfe9fa0e8f7dae3aa4f3bbb636ca5a80bca8c9efe6646c3
      MANIFEST_COUNT: "3410"

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and verify authoritative archive
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/$ZIP_NAME"
          curl -L --fail --retry 5 --retry-delay 3 "$ZIP_URL" -o "$zip_path"
          actual_size="$(stat -c '%s' "$zip_path")"
          actual_sha="$(sha256sum "$zip_path" | awk '{print $1}')"
          test "$actual_size" = "$ZIP_SIZE"
          test "$actual_sha" = "$ZIP_SHA256"
          printf 'ZIP_PATH=%s\n' "$zip_path" >> "$GITHUB_ENV"
          printf 'archive_size=%s\narchive_sha256=%s\n' "$actual_size" "$actual_sha"

      - name: Audit archive safety, extract with Unix permissions, and verify manifest
        shell: bash
        run: |
          set -euo pipefail
          extract_dir="$RUNNER_TEMP/pass152-extracted"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          python - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile

          zip_path = pathlib.Path(os.environ["ZIP_PATH"])
          extract_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pass152-extracted"

          # Security audit pass
          with zipfile.ZipFile(zip_path) as archive:
              for info in archive.infolist():
                  path = pathlib.PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {info.filename}")
                  unix_mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(unix_mode):
                      raise SystemExit(f"symlink entry rejected: {info.filename}")

          # Extract and restore Unix permissions (including execute bits)
          with zipfile.ZipFile(zip_path) as archive:
              archive.extractall(extract_dir)
              for info in archive.infolist():
                  unix_mode = (info.external_attr >> 16) & 0xFFFF
                  if unix_mode:
                      extracted_path = extract_dir / info.filename
                      if extracted_path.exists():
                          os.chmod(extracted_path, stat.S_IMODE(unix_mode))

          # Determine archive root
          entries = list(extract_dir.iterdir())
          root = entries[0] if len(entries) == 1 and entries[0].is_dir() else extract_dir

          # Verify manifest
          manifest_path = root / "PASS_152_FILE_MANIFEST.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          files = manifest.get("files", [])
          expected_count = int(os.environ["MANIFEST_COUNT"])
          if manifest.get("count") != expected_count or len(files) != expected_count:
              raise SystemExit(f"manifest count mismatch: declared={manifest.get('count')} actual={len(files)}")
          for index, entry in enumerate(files, 1):
              relative = pathlib.PurePosixPath(entry["path"])
              if relative.is_absolute() or ".." in relative.parts:
                  raise SystemExit(f"unsafe manifest path: {entry['path']}")
              file_path = root.joinpath(*relative.parts)
              if not file_path.is_file():
                  raise SystemExit(f"missing manifest file: {entry['path']}")
              if file_path.stat().st_size != entry["size"]:
                  raise SystemExit(f"size mismatch: {entry['path']}")
              digest = hashlib.sha256(file_path.read_bytes()).hexdigest()
              if digest != entry["sha256"]:
                  raise SystemExit(f"sha256 mismatch: {entry['path']}")

          pathlib.Path(os.environ["RUNNER_TEMP"], "pass152-root.txt").write_text(str(root), encoding="utf-8")
          print(f"manifest_verified={len(files)}/{expected_count}")
          PY
          extracted_root="$(cat "$RUNNER_TEMP/pass152-root.txt")"
          printf 'EXTRACTED_ROOT=%s\n' "$extracted_root" >> "$GITHUB_ENV"
          echo "manifest_verified=$MANIFEST_COUNT/$MANIFEST_COUNT"

      - name: Upload authoritative tree as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass152-authoritative-tree
          path: ${{ env.EXTRACTED_ROOT }}/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
