name: Pass 219 I148 Pass 178 Cumulative Binding

on:
  push:
    branches:
      - agent/pass219-iteration148-pass178-exact-physics-reconciliation
    paths:
      - 'hhs_runtime/include/hhs_pass219_inherited_pass178_1_48.*'
      - 'hhs_runtime/c/hhs_pass219_inherited_pass178_1_48.inc'
      - 'hhs_runtime/hhs_pass219_cumulative_pass_membrane_i148_pass178.py'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'contracts/pass219/PASS_219_GLOBAL_CANONICAL_DEFAULTS_1_0.json'
      - 'hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h'
      - 'hhs_runtime/c/hhs_pass219_global_canonical_defaults_1_0.inc'
      - 'tests/pass219/test_pass219_inherited_pass178_1_48.*'
      - 'tests/pass219/test_pass219_global_canonical_defaults_1_0.*'
      - 'evidence/pass178/i148/PASS_219_I148_PASS178_EXACT_PHYSICS_NUCLEUS_RECEIPT_INDEX.json'
      - '.github/workflows/pass219-i148-pass178-cumulative-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i148-pass178-cumulative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass178-cumulative-i148:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: '0'
      HHS_COGNITION_AUTO_TICK: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency-scoped packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install pytest 'cryptography>=46.0,<47.0' 'fastapi>=0.128,<1.0' 'pydantic>=2.7,<3.0'
      - name: Verify frozen Pass 178 nucleus evidence
        run: |
          git merge-base --is-ancestor 1f63e08370d0e3c54390a7b4b3bec8ef042ddfa3 HEAD
          test "$(git hash-object evidence/pass178/i148/PASS_219_I148_PASS178_EXACT_PHYSICS_NUCLEUS_RECEIPT_INDEX.json)" = "1b74415c302f81e5fa424b8cf7e1d4daa036c529"
          grep -F '"workflow_run_id": 33626761513' evidence/pass178/i148/PASS_219_I148_PASS178_EXACT_PHYSICS_NUCLEUS_RECEIPT_INDEX.json
          grep -F '"conclusion": "success"' evidence/pass178/i148/PASS_219_I148_PASS178_EXACT_PHYSICS_NUCLEUS_RECEIPT_INDEX.json
      - name: Build inherited exact runtime shared library
        run: |
          timeout 600s make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
      - name: Compile cumulative Python surfaces
        run: |
          python -m py_compile hhs_runtime/hhs_pass219_cumulative_pass_membrane_i148_pass178.py hhs_runtime/pass178/exact.py hhs_runtime/pass178/constraints.py hhs_runtime/pass178/relativity.py hhs_runtime/pass178/quantum.py hhs_runtime/pass178/render.py hhs_runtime/pass178/runtime.py
      - name: Run complete current Pass 178 Python conformance
        run: |
          PYTHONPATH="$PWD" python -m pytest -q tests/test_hhs_pass178_exact_algebra.py tests/test_hhs_pass178_relativity.py tests/test_hhs_pass178_quantum.py tests/test_hhs_pass178_abi_replay.py tests/test_hhs_pass178_browser.py
      - name: Build and run Pass 178 native ABI conformance
        run: |
          set -euo pipefail
          make -C native_projects/hhs_pass178_exact_physics clean all
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -Ihhs_runtime/include tests/native/pass178_physics_conformance.c native_projects/hhs_pass178_exact_physics/src/hhs178_physics.c -o /tmp/pass178-native
          /tmp/pass178-native
      - name: Run I148 cumulative membrane
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          from hhs_runtime.hhs_pass219_cumulative_pass_membrane_i148_pass178 import execute_pass178_membrane_preflight
          r=execute_pass178_membrane_preflight()
          assert r["ok"] is True
          assert r["census"]["wired_floor"]==178
          assert r["census"]["binding_count"]==43
          assert r["census"]["terminal_completion_claimed"] is False
          assert r["exact_binding"]["complete_historical_constraint_corpus"] is False
          print(r["classification"])
          PY
      - name: Preserve global canonical defaults and multimodal generalization
        run: |
          python tools/validate_pass219_global_canonical_defaults.py
          python tools/validate_pass219_multimodal_optimization_generalization.py
          python tools/hhs_multimodal_optimization_generalizer.py validate-all
      - name: Compile aggregate exact ABI and Pass 178 C/C++ conformance
        run: |
          mkdir -p /tmp/pass219-i148
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -c hhs_runtime/c/hhs_runtime_exact_abi.c -o /tmp/pass219-i148/exact.o
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass186_x64_vm81_q144/include -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_vm81_q144_abi.c -o /tmp/pass219-i148/pass186.o
          gcc -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_registers.S -o /tmp/pass219-i148/registers.o
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass178_1_48.c /tmp/pass219-i148/exact.o /tmp/pass219-i148/pass186.o /tmp/pass219-i148/registers.o -o /tmp/pass219-i148/pass178-c
          /tmp/pass219-i148/pass178-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass178_1_48.cpp /tmp/pass219-i148/exact.o /tmp/pass219-i148/pass186.o /tmp/pass219-i148/registers.o -o /tmp/pass219-i148/pass178-cpp
          /tmp/pass219-i148/pass178-cpp
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.c /tmp/pass219-i148/exact.o /tmp/pass219-i148/pass186.o /tmp/pass219-i148/registers.o -o /tmp/pass219-i148/defaults-c
          /tmp/pass219-i148/defaults-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.cpp /tmp/pass219-i148/exact.o /tmp/pass219-i148/pass186.o /tmp/pass219-i148/registers.o -o /tmp/pass219-i148/defaults-cpp
          /tmp/pass219-i148/defaults-cpp
      - name: Assert nonterminal authority boundary
        run: |
          grep -F 'terminal_pass178_completion_claimed() noexcept { return false; }' hhs_runtime/include/hhs_pass219_inherited_pass178_1_48.hpp
          grep -F 'repair_forward_required() noexcept { return true; }' hhs_runtime/include/hhs_pass219_inherited_pass178_1_48.hpp
          grep -F 'complete_historical_constraint_corpus() noexcept { return false; }' hhs_runtime/include/hhs_pass219_inherited_pass178_1_48.hpp
          grep -F '#define HHS_EXACT_PASS219_GLOBAL_DEFAULT_WIRED_FLOOR 178U' hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h
          grep -F '#define HHS_EXACT_PASS219_GLOBAL_DEFAULT_BINDING_COUNT 43U' hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h
      - name: Emit exact-head cumulative nonterminal receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p evidence/pass178/i148
          PYTHONPATH="$PWD" python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from hhs_runtime.hash72_checkpoint import make_hash72_witness
          from hhs_runtime.hhs_pass219_cumulative_pass_membrane_i148_pass178 import execute_pass178_membrane_preflight
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          preflight=execute_pass178_membrane_preflight()
          payload={"schema":"PASS_219_I148_PASS178_CUMULATIVE_VALIDATION_RECEIPT_V1","repository":"danonbrez/Holofractal_Harmonicode","branch":"agent/pass219-iteration148-pass178-exact-physics-reconciliation","head_sha":head,"tree_sha":tree,"workflow_run_id":int(os.environ["RUN_ID"]),"workflow_run_attempt":int(os.environ["RUN_ATTEMPT"]),"classification":"HHS_PASS178_I148_CUMULATIVE_NONTERMINAL_VERIFIED","preflight":preflight,"global_census":{"wired_ceiling":218,"wired_floor":178,"binding_count":43},"closure":{"cumulative_pass178_binding_added":True,"terminal_pass178_completion":False,"repair_forward_required":True,"complete_historical_constraint_corpus":False,"merge_performed":False,"authoritative_main_verification":False,"deployment_performed":False}}
          receipt=make_hash72_witness("pass178:i148:cumulative",payload,width=72).digest
          lanes=[make_hash72_witness("pass178:i148:cumulative:previous",{"head":head,"receipt":receipt},width=72).digest,make_hash72_witness("pass178:i148:cumulative:change",{"tree":tree,"receipt":receipt},width=72).digest,make_hash72_witness("pass178:i148:cumulative:receipt",payload,width=72).digest]
          payload["receipt_hash72"]=receipt;payload["archive_hash216"]="".join(lanes)
          Path("evidence/pass178/i148/PASS_219_I148_PASS178_CUMULATIVE_VALIDATION_RECEIPT.json").write_text(json.dumps(payload,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"classification":payload["classification"],"head":head,"receipt_hash72":receipt,"archive_hash216":payload["archive_hash216"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i148-pass178-cumulative-binding
          path: evidence/pass178/i148/PASS_219_I148_PASS178_CUMULATIVE_VALIDATION_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
