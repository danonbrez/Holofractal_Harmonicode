name: Pass 219 SPI Computational Determinism v8

on:
  push:
    branches:
      - 'agent/pass219-spi-scalar-projection-registry-v1-*'
    paths:
      - 'hhs_spi_computational_determinism_invariant_v1.py'
      - 'hhs_spi_computational_determinism_invariant_v2.py'
      - 'hhs_spi_computational_determinism_invariant_tests_v2.py'
      - 'hhs_spi_scalar_projection_registry_v8.py'
      - 'hhs_spi_scalar_projection_registry_tests_v8.py'
      - 'contracts/pass219/PASS_219_SPI_COMPUTATIONAL_DETERMINISM_INVARIANT_V1.md'
      - '.github/workflows/pass219-spi-computational-determinism-v8.yml'
  pull_request:
    paths:
      - 'hhs_spi_computational_determinism_invariant_v1.py'
      - 'hhs_spi_computational_determinism_invariant_v2.py'
      - 'hhs_spi_computational_determinism_invariant_tests_v2.py'
      - 'hhs_spi_scalar_projection_registry_v8.py'
      - 'hhs_spi_scalar_projection_registry_tests_v8.py'
      - 'contracts/pass219/PASS_219_SPI_COMPUTATIONAL_DETERMINISM_INVARIANT_V1.md'
      - '.github/workflows/pass219-spi-computational-determinism-v8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-computational-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile determinism invariant stack
        run: |
          python -m py_compile \
            hhs_spi_computational_determinism_invariant_v1.py \
            hhs_spi_computational_determinism_invariant_v2.py \
            hhs_spi_computational_determinism_invariant_tests_v2.py \
            hhs_spi_scalar_projection_registry_v8.py \
            hhs_spi_scalar_projection_registry_tests_v8.py

      - name: Run computational determinism positive and negative tests
        run: python hhs_spi_computational_determinism_invariant_tests_v2.py

      - name: Validate registry v8
        run: |
          python hhs_spi_scalar_projection_registry_v8.py --validate
          python hhs_spi_scalar_projection_registry_tests_v8.py

      - name: Regress validated registry v7 and octonion lift unchanged
        run: |
          python hhs_spi_octonion_dimensional_lift_tests_v1.py
          python hhs_spi_scalar_projection_registry_v7.py --validate
          python hhs_spi_scalar_projection_registry_tests_v7.py

      - name: Regress inherited RML2 and RML4 gyroscope geometry
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_phase_geometry_learning.py \
            tests/pass219/test_pass219_dynamic_octonion_gyroscope.py

      - name: Verify advance-or-halt determinism law
        run: |
          python - <<'PY'
          from hhs_spi_computational_determinism_invariant_v1 import (
              DETERMINISM_INVARIANT_ID,
              HALT_REASONS,
              OUTCOMES,
          )
          from hhs_spi_computational_determinism_invariant_v2 import (
              SELECTION_RULE_V2,
              reference_determinism_witness,
          )
          witness = reference_determinism_witness()
          assert all(witness['invariants'].values()), witness['invariants']
          assert DETERMINISM_INVARIANT_ID in witness['task']['invariant_ids']
          assert tuple(witness['task']['outcome_domain']) == OUTCOMES == ('ADVANCE', 'HALT')
          assert witness['selection_rule'] == list(SELECTION_RULE_V2)
          assert witness['advance']['outcome'] == 'ADVANCE'
          assert witness['advance']['candidate_receipt_used_for_selection'] is False
          assert witness['advance']['semantic_label_used_for_selection'] is False
          assert witness['closed_halt']['outcome'] == 'HALT'
          assert witness['closed_halt']['halt_reason'] == 'CLOSED'
          assert witness['null_branch_halt']['halt_reason'] == 'NULL_BRANCH'
          assert witness['duplicate_identity_halt']['halt_reason'] == 'QUARANTINED'
          assert set(HALT_REASONS) == {
              'CLOSED','REJECTED','QUARANTINED','NULL_BRANCH','RESOURCE_BOUNDED','STABLE_UNRESOLVED'
          }
          assert witness['invariants']['discretionary_refusal_absent'] is True
          print('computational determinism / advance-or-halt law: PASS')
          PY

      - name: Regress frozen SPI corpus evidence
        run: |
          python hhs_spi_scalar_projection_corpus_reconciliation_v2.py --validate
          python - <<'PY'
          from pathlib import Path
          from hhs_spi_scalar_projection_corpus_reconciliation_v2 import reconciliation_manifest_v2
          data = reconciliation_manifest_v2(Path('.'))
          assert data['resolved_candidate_counts'] == {
              'MISSING_PROJECTION': 0,
              'PROVEN': 429,
              'SYMBOLIC': 43,
              'UNSUPPORTED_DOMAIN': 0,
          }
          assert data['manifest_sha256'] == '481c0bb0264ad0771344ae068624dcfd7c9c5ba853a8c7963ad9a22971389aee'
          assert data['scalar_value_complete'] is False
          print(data['manifest_sha256'])
          PY

      - name: Emit deterministic v8 evidence
        run: |
          mkdir -p /tmp/pass219_spi_computational_determinism
          python - <<'PY' > /tmp/pass219_spi_computational_determinism/computational_determinism_v2.json
          import json
          from hhs_spi_computational_determinism_invariant_v2 import reference_determinism_witness
          print(json.dumps(reference_determinism_witness(), indent=2, sort_keys=True, ensure_ascii=False))
          PY
          python hhs_spi_scalar_projection_registry_v8.py --manifest > /tmp/pass219_spi_computational_determinism/spi_registry_v8.json
          python - <<'PY'
          import json
          from pathlib import Path
          witness = json.loads(Path('/tmp/pass219_spi_computational_determinism/computational_determinism_v2.json').read_text(encoding='utf-8'))
          registry = json.loads(Path('/tmp/pass219_spi_computational_determinism/spi_registry_v8.json').read_text(encoding='utf-8'))
          assert all(witness['invariants'].values())
          assert registry['validation']['ok'] is True
          assert registry['validation']['changed_predecessor_proof_ids'] == []
          print(json.dumps({
              'task_receipt_sha256': witness['task']['task_receipt_sha256'],
              'advance_receipt_sha256': witness['advance']['decision_receipt_sha256'],
              'closed_halt_receipt_sha256': witness['closed_halt']['decision_receipt_sha256'],
              'determinism_witness_sha256': witness['witness_receipt_sha256'],
              'registry_v8_manifest_sha256': registry['manifest_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload computational determinism evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass219-spi-computational-determinism-v8
          path: /tmp/pass219_spi_computational_determinism
          if-no-files-found: error
