name: Pass 195 Kimi K3 Content Engine

on:
  push:
    paths:
      - "hhs_backend/runtime/hhs_kimi_k3_content_engine_v1.py"
      - "hhs_backend/runtime/hhs_kimi_k3_content_engine_v2.py"
      - "hhs_backend/api/kimi_k3_content_routes.py"
      - "hhs_backend/runtime/hhs_capability_provider_registry_v1.py"
      - "hhs_backend/visual_server.py"
      - "applications/storybook_reel_studio/kimi-content-engine.js"
      - "applications/storybook_reel_studio/index.html"
      - "tests/test_hhs_kimi_k3_content_engine_v1.py"
      - "tests/test_hhs_pass195_i131_repair_v2.py"
      - "docs/pass195/**"
      - "deploy/digitalocean/hhs-kimi-k3.env.example"
      - ".github/workflows/pass195-kimi-k3-content-engine.yml"
  pull_request:
    paths:
      - "hhs_backend/runtime/hhs_kimi_k3_content_engine_v1.py"
      - "hhs_backend/runtime/hhs_kimi_k3_content_engine_v2.py"
      - "hhs_backend/api/kimi_k3_content_routes.py"
      - "hhs_backend/runtime/hhs_capability_provider_registry_v1.py"
      - "hhs_backend/visual_server.py"
      - "applications/storybook_reel_studio/kimi-content-engine.js"
      - "applications/storybook_reel_studio/index.html"
      - "tests/test_hhs_kimi_k3_content_engine_v1.py"
      - "tests/test_hhs_pass195_i131_repair_v2.py"
      - "docs/pass195/**"
      - "deploy/digitalocean/hhs-kimi-k3.env.example"
      - ".github/workflows/pass195-kimi-k3-content-engine.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prove immutable Pass 195 V1 provenance
        run: test "$(git hash-object hhs_backend/runtime/hhs_kimi_k3_content_engine_v1.py)" = "ea7041c026e63445034c7161268faafe436cd2d1"
      - name: Compile Pass 195 Python surfaces
        run: |
          python -m py_compile hhs_backend/runtime/hhs_kimi_k3_content_engine_v1.py
          python -m py_compile hhs_backend/runtime/hhs_kimi_k3_content_engine_v2.py
          python -m py_compile hhs_backend/api/kimi_k3_content_routes.py
          python -m py_compile tests/test_hhs_kimi_k3_content_engine_v1.py
          python -m py_compile tests/test_hhs_pass195_i131_repair_v2.py
      - name: Validate Storybook Studio integration
        run: node --check applications/storybook_reel_studio/kimi-content-engine.js
      - name: Run Pass 195 historical and I131 repair tests
        run: |
          python -m unittest -v \
            tests.test_hhs_kimi_k3_content_engine_v1 \
            tests.test_hhs_pass195_i131_repair_v2
