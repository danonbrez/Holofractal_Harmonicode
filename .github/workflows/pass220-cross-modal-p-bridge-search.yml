name: Pass 220 Cross Modal P Bridge Search
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_cross_modal_p_bridge_search_v1.py"
      - "tests/pass220/test_pass220_cross_modal_p_bridge_search_v1.py"
      - ".github/workflows/pass220-cross-modal-p-bridge-search.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-bridge-search:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Exact bounded cross-modal P route regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_cross_modal_p_bridge_search_v1.py
