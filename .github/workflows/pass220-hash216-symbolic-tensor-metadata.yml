name: Pass 220 Hash216 Symbolic Tensor Metadata
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_hash216_symbolic_tensor_metadata_v1.py"
      - "tests/pass220/test_pass220_hash216_symbolic_tensor_metadata_v1.py"
      - ".github/workflows/pass220-hash216-symbolic-tensor-metadata.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-symbolic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Ordered symbolic P metadata with inherited Hash216 ancestry
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_hash216_symbolic_tensor_metadata_v1.py
