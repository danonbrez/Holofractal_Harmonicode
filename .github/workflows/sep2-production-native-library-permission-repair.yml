name: September 2 Production Native Runtime Permission Repair

on:
  push:
    branches:
      - agent/sep2-production-native-library-permission-repair
    paths:
      - 'deployment/digitalocean/guarded_auto_update/normalize-service-permissions.py'
      - 'tests/test_hhs_production_service_permissions_v2.py'
      - 'tests/test_hhs_production_native_runtime_permissions_v3.py'
      - 'tests/test_hhs_guarded_auto_update_contract_v1.py'
      - '.github/workflows/sep2-production-native-library-permission-repair.yml'
      - 'docs/operations/restart/SEP2_PRODUCTION_NATIVE_LIBRARY_PERMISSION_REPAIR_RESTART.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scoped-production-permission-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Parse repaired permission normalizer
        run: python -m py_compile deployment/digitalocean/guarded_auto_update/normalize-service-permissions.py

      - name: Validate production permission boundary
        run: |
          pytest -q --tb=short \
            tests/test_hhs_production_service_permissions_v2.py \
            tests/test_hhs_production_native_runtime_permissions_v3.py

      - name: Validate guarded deployment contract
        run: pytest -q --tb=short tests/test_hhs_guarded_auto_update_contract_v1.py

      - name: Validate inherited Pass 202 deployment identity
        run: |
          grep -F 'HHS_PRODUCTION_CHECKOUT_PERMISSION_RECEIPT_V2' deployment/digitalocean/guarded_auto_update/normalize-service-permissions.py
          grep -F 'runtime_library_readable' deployment/digitalocean/guarded_auto_update/normalize-service-permissions.py
          grep -F 'HHS_ROLLBACK_BOUNDARY_HEALTHY=1' deployment/digitalocean/guarded_auto_update/install.sh

      - name: Emit repair validation receipt
        run: |
          mkdir -p artifacts/operations/sep2-production-native-library-permission-repair
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          normalizer = Path('deployment/digitalocean/guarded_auto_update/normalize-service-permissions.py')
          payload = {
              'schema': 'HHS_SEP2_PRODUCTION_NATIVE_LIBRARY_PERMISSION_REPAIR_VALIDATION_V1',
              'repository_sha': head,
              'source_sha256': hashlib.sha256(normalizer.read_bytes()).hexdigest(),
              'dependency_scoped_tests': [
                  'tests/test_hhs_production_service_permissions_v2.py',
                  'tests/test_hhs_production_native_runtime_permissions_v3.py',
                  'tests/test_hhs_guarded_auto_update_contract_v1.py',
              ],
              'production_failure_repaired': 'hhs service user denied read/traverse access to generated hhs_runtime/builds/libhhs_runtime.so boundary during recovery',
              'result': 'PASS',
          }
          Path('artifacts/operations/sep2-production-native-library-permission-repair/validation.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sep2-production-native-library-permission-repair-${{ github.sha }}
          path: artifacts/operations/sep2-production-native-library-permission-repair/validation.json
          if-no-files-found: error
          retention-days: 30
