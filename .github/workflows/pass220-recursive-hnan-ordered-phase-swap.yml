name: Pass 220 Recursive HNAN Ordered Phase Swap
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_recursive_hnan_ordered_phase_swap_v1.py"
      - "tests/pass220/test_pass220_recursive_hnan_ordered_phase_swap_v1.py"
      - ".github/workflows/pass220-recursive-hnan-ordered-phase-swap.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ordered-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify recursive ordered HNAN phase witnesses
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_recursive_hnan_ordered_phase_swap_v1.py
