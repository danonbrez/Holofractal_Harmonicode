name: Pass 211 Evidence Freeze

on:
  push:
    branches:
      - agent/pass211-bigint-hfc-carrier
    paths:
      - '.github/workflows/pass211-evidence-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass211-bigint-hfc-carrier
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence dependencies
        run: python -m pip install --disable-pip-version-check sympy
      - name: Generate and validate evidence
        run: |
          python tools/generate_pass211_bigint_hfc_evidence.py
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('evidence/pass211/PASS_211_BIGINT_HFC_REFERENCE_VECTORS.json').read_text())
          summary = evidence['suite_summary']
          assert summary['pass133_roundtrips'] == summary['pass133_corpus_size'] == 11
          assert summary['single_bit_corrections'] == summary['single_bit_samples'] == 512
          assert summary['combined_erasure_recoveries'] == summary['combined_erasure_expected'] == 144
          assert summary['anchored_cell_1000_exact'] is True
          assert summary['fresh_projection_self_agreement'] is True
          assert summary['strict_claim_boundary_preserved'] is True
          assert summary['runtime_verified'] is True
          PY
      - name: Freeze generated reference vectors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name hhs-pass211-evidence-freeze
          git config user.email hhs-pass211-evidence-freeze@users.noreply.github.com
          git add evidence/pass211/PASS_211_BIGINT_HFC_REFERENCE_VECTORS.json
          if git diff --cached --quiet; then
            echo PASS211_EVIDENCE_ALREADY_FROZEN
            exit 0
          fi
          git commit -m "test(pass211): freeze BigInt HFC reference evidence"
          git push origin HEAD:agent/pass211-bigint-hfc-carrier
