name: Pass 220 Registry Aware P Modality Bridge
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_registry_aware_p_modality_bridge_v1.py"
      - "tests/pass220/test_pass220_registry_aware_p_modality_bridge_v1.py"
      - ".github/workflows/pass220-registry-aware-p-modality-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Native provider registry and exact typed codec regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_registry_aware_p_modality_bridge_v1.py
