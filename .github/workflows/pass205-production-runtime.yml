name: Pass 205 Production Continuation Runtime

on:
  pull_request:
    paths:
      - 'hhs_runtime/c/hhs_pass205_continuation.h'
      - 'hhs_runtime/c/hhs_pass205_continuation.c'
      - 'hhs_python/runtime/__init__.py'
      - 'hhs_python/runtime/hhs_pass205_continuation_bridge.py'
      - 'hhs_python/runtime/hhs_pass205_native_freshness_guard.py'
      - 'hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py'
      - 'hhs_backend/runtime/hhs_pass205_governed_continuation_v2.py'
      - 'hhs_backend/runtime/hhs_pass205_retrieval_order_v1.py'
      - 'hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py'
      - 'hhs_backend/runtime/live_fastapi_workflow_v1.py'
      - 'hhs_backend/production_server.py'
      - 'hhs_backend/api/pass205_continuation_routes.py'
      - 'hhs_backend/api/a0_pass205_transport_bootstrap.py'
      - 'hhs_backend/api/a_pass205_governed_bootstrap.py'
      - 'deployment/digitalocean/pass205_state/**'
      - 'bin/post_compile'
      - 'tests/test_hhs_pass205_continuation_runtime_v1.py'
      - 'tests/test_hhs_pass205_native_freshness_guard_v1.py'
      - 'tests/test_hhs_pass205_state_deployment_v1.py'
      - 'tests/test_hhs_pass205_governed_continuation_v2.py'
      - 'tests/test_hhs_pass205_transport_and_retrieval_v1.py'
      - 'tests/test_hhs_pass205_bounded_authority_status_v1.py'
      - 'scripts/pass205_production_validation.py'
      - 'docs/pass205/**'
      - 'evidence/pass205/**'
      - '.github/workflows/pass205-production-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'hhs_runtime/c/hhs_pass205_continuation.h'
      - 'hhs_runtime/c/hhs_pass205_continuation.c'
      - 'hhs_python/runtime/__init__.py'
      - 'hhs_python/runtime/hhs_pass205_continuation_bridge.py'
      - 'hhs_python/runtime/hhs_pass205_native_freshness_guard.py'
      - 'hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py'
      - 'hhs_backend/runtime/hhs_pass205_governed_continuation_v2.py'
      - 'hhs_backend/runtime/hhs_pass205_retrieval_order_v1.py'
      - 'hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py'
      - 'hhs_backend/runtime/live_fastapi_workflow_v1.py'
      - 'hhs_backend/production_server.py'
      - 'hhs_backend/api/pass205_continuation_routes.py'
      - 'hhs_backend/api/a0_pass205_transport_bootstrap.py'
      - 'hhs_backend/api/a_pass205_governed_bootstrap.py'
      - 'deployment/digitalocean/pass205_state/**'
      - 'bin/post_compile'
      - 'tests/test_hhs_pass205_continuation_runtime_v1.py'
      - 'tests/test_hhs_pass205_native_freshness_guard_v1.py'
      - 'tests/test_hhs_pass205_state_deployment_v1.py'
      - 'tests/test_hhs_pass205_governed_continuation_v2.py'
      - 'tests/test_hhs_pass205_transport_and_retrieval_v1.py'
      - 'tests/test_hhs_pass205_bounded_authority_status_v1.py'
      - 'scripts/pass205_production_validation.py'
      - 'docs/pass205/**'
      - 'evidence/pass205/**'
      - '.github/workflows/pass205-production-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONFAULTHANDLER: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  validate-pass205-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HHS_PASS205_DB: ${{ runner.temp }}/pass205-continuation.sqlite3
    steps:
      - name: Checkout exact tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install inherited runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate deployment shell surfaces
        run: |
          bash -n bin/post_compile
          bash -n deployment/digitalocean/pass205_state/install.sh

      - name: Compile Pass 205 Python surfaces
        run: |
          python -m py_compile \
            hhs_python/runtime/__init__.py \
            hhs_python/runtime/hhs_pass205_continuation_bridge.py \
            hhs_python/runtime/hhs_pass205_native_freshness_guard.py \
            hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py \
            hhs_backend/runtime/hhs_pass205_governed_continuation_v2.py \
            hhs_backend/runtime/hhs_pass205_retrieval_order_v1.py \
            hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py \
            hhs_backend/runtime/live_fastapi_workflow_v1.py \
            hhs_backend/production_server.py \
            hhs_backend/api/pass205_continuation_routes.py \
            hhs_backend/api/a0_pass205_transport_bootstrap.py \
            hhs_backend/api/a_pass205_governed_bootstrap.py \
            scripts/pass205_production_validation.py \
            tests/test_hhs_pass205_continuation_runtime_v1.py \
            tests/test_hhs_pass205_native_freshness_guard_v1.py \
            tests/test_hhs_pass205_state_deployment_v1.py \
            tests/test_hhs_pass205_governed_continuation_v2.py \
            tests/test_hhs_pass205_transport_and_retrieval_v1.py \
            tests/test_hhs_pass205_bounded_authority_status_v1.py

      - name: Build inherited canonical C ABI
        run: make c-abi

      - name: Build Pass 205 native continuation ABI
        run: |
          python - <<'PY'
          from hhs_python.runtime.hhs_pass205_continuation_bridge import build_native_library
          print(build_native_library(force=True))
          PY
          nm -D hhs_runtime/builds/libhhs_pass205_continuation.so | grep -E 'hhs_pass205_q_address|hhs_pass205_apply_delta|hhs_pass205_project_sparse|hhs_pass205_build_token'

      - name: Run focused Pass 205 repair tests
        run: |
          python -m pytest -q \
            tests/test_hhs_pass205_native_freshness_guard_v1.py \
            tests/test_hhs_pass205_state_deployment_v1.py \
            tests/test_hhs_pass205_governed_continuation_v2.py \
            tests/test_hhs_pass205_transport_and_retrieval_v1.py \
            tests/test_hhs_pass205_bounded_authority_status_v1.py

      - name: Run Pass 205 production tests
        run: python -m pytest -q tests/test_hhs_pass205_continuation_runtime_v1.py

      - name: Run existing Pass 205 design tests
        run: |
          mkdir -p evidence/pass205-ci
          python scripts/pass205_multimodal_continuation_design_validation.py \
            --ticks 120 \
            --seeds 1,72,216,5184,1259713 \
            --output evidence/pass205-ci/PASS205_MULTIMODAL_CONTINUATION_DESIGN_VALIDATION_RECEIPT.json
          python scripts/pass205_gpu_translation_design_validation.py \
            --output evidence/pass205-ci/PASS205_GPU_TRANSLATION_DESIGN_VALIDATION_RECEIPT.json

      - name: Execute hosted Pass 205 production validation
        run: |
          python scripts/pass205_production_validation.py \
            --db "${HHS_PASS205_DB}" \
            --evidence evidence/pass205-ci/PASS205_PRODUCTION_VALIDATION_RECEIPT.json

      - name: Verify hosted federation uses governed singleton
        run: |
          python - <<'PY'
          from hhs_backend.application_ide_server import app
          from hhs_backend.api import pass205_continuation_routes as routes
          from hhs_backend.runtime.hhs_pass205_governed_continuation_v2 import GovernedPass205ContinuationRuntime

          assert isinstance(routes.PASS205_CONTINUATION_RUNTIME, GovernedPass205ContinuationRuntime)
          paths = {str(getattr(route, 'path', '')) for route in app.router.routes}
          assert '/api/runtime/continuation/advance' in paths
          assert '/api/runtime/continuation/transport' in paths
          status = routes.PASS205_CONTINUATION_RUNTIME.status()
          assert status['vm81_admission_required_before_persistence']
          assert status['replay_reconstructs_ordered_deltas']
          PY

      - name: Run inherited Pass 204 tests
        env:
          HHS_PASS190_CAPABILITY_SECRET: pass205-ci-secret
        run: python -m pytest -q tests/test_hhs_pass204_open_cloud_mainframe_v1.py

      - name: Run inherited Pass 203 tests
        env:
          HHS_PASS190_CAPABILITY_SECRET: pass205-ci-secret
        run: python -m pytest -q tests/test_hhs_pass203_hydrated_mainframe_v1.py

      - name: Run inherited Pass 201 federation tests
        run: python -m unittest -v tests.test_hhs_pass201_public_api_federation_v1

      - name: Run inherited Pass 202 guarded deployment tests
        run: python -m pytest -q tests/test_hhs_guarded_auto_update_contract_v1.py

      - name: Verify Pass 205 closure markers
        run: |
          grep -Fq 'HHS_PASS_205_DETERMINISTIC_MULTIMODAL_CONTINUATION_RUNTIME_VERIFIED' evidence/pass205-ci/PASS205_PRODUCTION_VALIDATION_RECEIPT.json
          grep -Fq '1259712' evidence/pass205-ci/PASS205_PRODUCTION_VALIDATION_RECEIPT.json
          grep -Fq 'gpu_may_commit_hash72' hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py
          grep -Fq '/api/runtime/continuation/studio' hhs_backend/api/pass205_continuation_routes.py
          grep -Fq 'vm81_admission_required_before_persistence' hhs_backend/runtime/hhs_pass205_governed_continuation_v2.py
          grep -Fq 'decimal-string' hhs_backend/api/a0_pass205_transport_bootstrap.py

      - name: Upload Pass 205 production evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass205-production-continuation-runtime
          path: evidence/pass205-ci/*.json
          if-no-files-found: error
          retention-days: 30