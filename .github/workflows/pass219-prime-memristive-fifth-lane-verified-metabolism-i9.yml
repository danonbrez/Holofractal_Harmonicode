name: Pass 219 Prime Memristive Fifth Lane Verified Metabolism I9

on:
  push:
    branches:
      - agent/pass219-prime-memristive-fifth-lane-i9-20260912
    paths:
      - contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_VERIFIED_METABOLISM_I9.md
      - hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_8.hpp
      - tests/pass219/test_pass219_prime_memristive_fifth_lane_1_8.cpp
      - .github/workflows/pass219-prime-memristive-fifth-lane-verified-metabolism-i9.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out I9 branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Verify I9 verified-metabolism authority contract
        run: |
          python - <<'PY'
          from pathlib import Path
          header = Path('hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_8.hpp').read_text()
          contract = Path('contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_VERIFIED_METABOLISM_I9.md').read_text()
          holo4 = Path('hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h').read_text()
          assert '#define HHS_EXACT_PASS219_HOLO4_LANE_COUNT UINT32_C(4)' in holo4
          for needle in (
              'verified_outcome_only{true}',
              'speculative_reinforcement{false}',
              'local_metabolic_state_only{true}',
              'budget_replenishment_only{true}',
              'bounded_decay_only{true}',
              'duplicate_verdict_replay{false}',
              'canonical_mutation_authority{false}',
              'canonical_hash72_authority{false}',
              'canonical_hash216_authority{false}',
              'canonical_persistence_authority{false}',
              'floating_point_authority{false}',
              'requires_inherited_vm81_hash216_admission{true}',
              'class PrimeLaneVerifiedOutcomeMetabolismV9',
              'apply_verified_outcome(',
              'HHS_PASS219_PRIME_LANE_METABOLIC_REWARD',
          ):
              assert needle in header, needle
          for needle in (
              'verified_outcome_only = true',
              'speculative_reinforcement = false',
              'duplicate_verdict_replay = false',
              'A speculative prefetch, candidate score, route rank, or I8 hydration hop cannot by itself produce metabolic credit.',
              'VM81 / Hash216',
              'HHS_EXACT_PASS219_HOLO4_LANE_COUNT = 4',
          ):
              assert needle in contract, needle
          print('prime_memristive_fifth_lane_i9_contract_gate=PASS')
          PY

      - name: Build inherited exact ABI
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_holo4_state_init'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_hash216_transition_init'

      - name: Run inherited I8 budgeted hydration benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_7.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i8
          /tmp/test-pass219-prime-memristive-fifth-lane-i8

      - name: Run I9 exact verified-outcome metabolism benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_8.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i9
          /tmp/test-pass219-prime-memristive-fifth-lane-i9

      - name: Verify inherited four-lane authority remains green
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_core_holographic_four_lane_1_24.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-core-holo4
          /tmp/test-core-holo4
