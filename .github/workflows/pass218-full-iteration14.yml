name: Pass 218 Full Iteration 14

on:
  push:
    branches:
      - agent/pass218-full-iteration14-multi-operator-maintenance-authorization
  pull_request:
    paths:
      - 'hhs_runtime/pass218/**'
      - 'hhs_backend/runtime_os_pass218_approval_i14.py'
      - 'hhs_backend/runtime_os_application_server.py'
      - 'hhs_gui/**'
      - 'scripts/pass218_iteration12_operational_validation.py'
      - 'scripts/pass218_iteration14_approval_validation.py'
      - 'tests/pass218/**'
      - 'tests/test_hhs_pass146_boundary_constructed_network_security_v1.py'
      - 'docs/pass218/**'
      - '.github/workflows/pass218-full-iteration14.yml'

permissions:
  contents: read

jobs:
  multi-party-maintenance-approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HHS_PASS218_I12_NAMESPACE: /hhs/pass218/i14/ci/${{ github.run_id }}

    steps:
      - name: Check out Iteration 14 candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped Python packages
        run: python -m pip install --upgrade pytest cryptography fastapi uvicorn httpx

      - name: Compile I14 and cumulative RuntimeOS bindings
        run: |
          python -m py_compile hhs_runtime/pass218/*.py
          python -m py_compile hhs_backend/runtime_os_pass218_authority_i13.py
          python -m py_compile hhs_backend/runtime_os_pass218_approval_i14.py
          python -m py_compile hhs_backend/runtime_os_application_server.py
          python -m py_compile scripts/pass218_iteration12_operational_validation.py
          python -m py_compile scripts/pass218_iteration14_approval_validation.py

      - name: Enforce no authoritative float literals in I14
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for path in (
              Path('hhs_runtime/pass218/approval_i14.py'),
              Path('hhs_backend/runtime_os_pass218_approval_i14.py'),
          ):
              tree = ast.parse(path.read_text('utf-8'))
              floats = [node for node in ast.walk(tree) if isinstance(node, ast.Constant) and isinstance(node.value, float)]
              assert not floats, f'{path}: authoritative float literal(s) found'
          print('PASS218_I14_NO_FLOAT_LITERAL_AUTHORITY=1')
          PY

      - name: Preserve Iterations 1 through 14
        run: |
          pytest -q tests/pass218/test_pass218_iteration1_genesis_curriculum.py
          pytest -q tests/pass218/test_pass218_iteration2_grammar_narrative_hydration.py
          pytest -q tests/pass218/test_pass218_iteration3_source_transaction_membrane.py
          pytest -q tests/pass218/test_pass218_iteration4_vector_vm5184_staging.py
          pytest -q tests/pass218/test_pass218_iteration5_promotion_admission_proof.py
          pytest -q tests/pass218/test_pass218_iteration6_canonical_commit_boundary.py
          pytest -q tests/pass218/test_pass218_iteration7_durable_canonical_persistence.py
          pytest -q tests/pass218/test_pass218_iteration8_runtime_os_lifecycle.py
          pytest -q tests/pass218/test_pass218_iteration9_multiprocess_canonical_ownership.py
          pytest -q tests/pass218/test_pass218_iteration10_distributed_canonical_ownership.py
          pytest -q tests/pass218/test_pass218_iteration11_distributed_operational_hardening.py
          pytest -q tests/pass218/test_pass218_iteration12_production_authority_maintenance.py
          pytest -q tests/pass218/test_pass218_iteration13_authority_observability_orchestration.py
          pytest -q tests/pass218/test_pass218_iteration13_runtime_os_control_plane.py
          pytest -q tests/pass218/test_pass218_iteration14_multi_party_approval.py
          pytest -q tests/pass218/test_pass218_iteration14_runtime_os_status.py
          pytest -q tests/pass218/test_pass218_iteration14_persistent_revocation.py

      - name: Re-prove inherited Pass 146 signed-envelope surface
        run: pytest -q tests/test_hhs_pass146_boundary_constructed_network_security_v1.py

      - name: Preserve crawler and RuntimeOS production root
        run: |
          pytest -q tests/pass218/test_repository_native_creative_writing_crawler.py
          pytest -q tests/test_runtime_os_production_root.py

      - name: Install RuntimeOS dependencies
        working-directory: hhs_gui
        run: npm install --no-audit --no-fund

      - name: Typecheck and build RuntimeOS
        working-directory: hhs_gui
        run: npm run build:strict

      - name: Verify I14 RuntimeOS projection is read-only
        run: |
          python - <<'PY'
          from pathlib import Path
          panel = Path('hhs_gui/runtime_os/workspace/ApprovalStatusPanel.tsx').read_text('utf-8')
          workspace = Path('hhs_gui/runtime_os/workspace/HHSProductWorkspace.tsx').read_text('utf-8')
          server = Path('hhs_backend/runtime_os_application_server.py').read_text('utf-8')
          approval = Path('hhs_backend/runtime_os_pass218_approval_i14.py').read_text('utf-8')
          assert '/api/runtime/pass218/authority/approval/status' in panel
          assert 'ApprovalStatusPanel' in workspace
          assert 'install_pass218_i14_approval_control_plane' in server
          assert '/api/runtime/pass218/authority/approval/revocations/record' in approval
          assert 'preflight_rechecks_recorded_revocations' in approval
          assert '/evaluate' not in panel
          assert '/preflight' not in panel
          assert '/revocations/record' not in panel
          print('PASS218_I14_RUNTIME_OS_READ_ONLY_PROJECTION=1')
          PY

      - name: Re-prove real I12 operational substrate
        run: PYTHONPATH="$PWD" python scripts/pass218_iteration12_operational_validation.py

      - name: Prove real I14 multi-party approval composition
        run: PYTHONPATH="$PWD" python scripts/pass218_iteration14_approval_validation.py

      - name: Upload I12 and I14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass218-iteration14-multi-party-approval-evidence
          path: |
            .i12-evidence
            .i14-evidence
          if-no-files-found: warn
          include-hidden-files: true
