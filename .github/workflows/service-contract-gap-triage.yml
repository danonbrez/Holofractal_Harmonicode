name: Service contract gap triage
on:
  pull_request:
    paths:
      - 'hhs_runtime/hhs_service_contract_gap_triage_v1.py'
      - 'tests/pass220/test_hhs_service_contract_gap_triage_v1.py'
      - '.github/workflows/service-contract-gap-triage.yml'
  push:
    branches: [main]
    paths:
      - 'hhs_runtime/hhs_service_contract_gap_triage_v1.py'
      - 'tests/pass220/test_hhs_service_contract_gap_triage_v1.py'
      - '.github/workflows/service-contract-gap-triage.yml'
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile hhs_runtime/hhs_service_contract_gap_triage_v1.py
      - run: PYTHONPATH=. python -m unittest tests/pass220/test_hhs_service_contract_gap_triage_v1.py
