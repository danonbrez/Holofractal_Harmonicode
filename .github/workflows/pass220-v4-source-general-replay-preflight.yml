name: Pass 220 V4 Source-General Replay Preflight

on:
  pull_request:
    paths:
      - 'tools/pass220/pass220_v4_source_general_replay_preflight.c'
      - 'hhs_runtime/hhs_pass220_v4_ordered_gate_obligations_v1.py'
      - 'tests/pass220/test_pass220_v4_ordered_gate_obligations_v1.py'
      - 'evidence/pass220/PASS220_V4_40_GATE_REPLAY_PREFLIGHT_37946520150.json'
      - 'tools/pass220/pass220_v4_native_hnan_phase_order_preflight.c'
      - 'tests/pass220/test_pass220_v4_source_general_replay_preflight.py'
      - '.github/workflows/pass220-v4-source-general-replay-preflight.yml'
      - 'contracts/pass220/PASS_220_ORDERED_PHASE_CHAIN_V4_20261009.harmonicode'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-general-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      HHS_DISABLE_C_AUTOBUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test requirements
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run exact source/occurrence inventory and fail-closed witness tests
        run: python -m pytest -q tests/pass220/test_pass220_v4_source_general_replay_preflight.py -k 'not test_native_hold_replay_and_compiler_evidence_not_canonical_commit'
      - name: Build preexisting Runtime C ABI
        run: make c-abi
      - name: Compile native source-general replay preflight
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Inative_projects/hhs_pass159_harmonicode_toolchain/include \
            -Inative_projects/hhs_pass159_harmonicode_toolchain/src \
            -Ihhs_runtime/include \
            tools/pass220/pass220_v4_source_general_replay_preflight.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm -pthread \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" \
            -o /tmp/pass220-v4-source-general-preflight
      - name: Execute real Pass159 HOLD, deterministic replay and compiler parity
        run: |
          set -euo pipefail
          mkdir -p artifacts/pass220/v4-source-general
          /tmp/pass220-v4-source-general-preflight contracts/pass220/PASS_220_ORDERED_PHASE_CHAIN_V4_20261009.harmonicode \
            | tee artifacts/pass220/v4-source-general/replay_preflight.txt
          grep -Fx "native_source_preflight=PASS" artifacts/pass220/v4-source-general/replay_preflight.txt
          grep -Fx "canonical_vm81_admission_verified=0" artifacts/pass220/v4-source-general/replay_preflight.txt
          grep -Fx "all_40_gate_truth_witnesses_verified=0" artifacts/pass220/v4-source-general/replay_preflight.txt
      - name: Enforce exact 40-occurrence inventory and receipt identity
        run: python -m pytest -q tests/pass220/test_pass220_v4_source_general_replay_preflight.py
      - name: Changed outer-chain gate source must fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          data=Path("contracts/pass220/PASS_220_ORDERED_PHASE_CHAIN_V4_20261009.harmonicode").read_bytes()
          assert b"==x==-y*(" in data
          Path("/tmp/pass220-v4-swap-chain.harmonicode").write_bytes(
              data.replace(b"==x==-y*(",b"==-y==x*(",1))
          PY
          if /tmp/pass220-v4-source-general-preflight /tmp/pass220-v4-swap-chain.harmonicode > /tmp/pass220-v4-swap-chain.out 2>&1; then
            exit 1
          fi
          grep -Fx P220_V4_SOURCE_OCCURRENCES_INVALID /tmp/pass220-v4-swap-chain.out
          ! grep -Fq native_source_preflight=PASS /tmp/pass220-v4-swap-chain.out
          echo V4_MUTATED_OUTER_CHAIN_FAILS_CLOSED
      - name: Mandatory exact-source native HNAN 15-rule/Jordan preflight
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tools/pass220/pass220_v4_native_hnan_phase_order_preflight.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm -pthread \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" \
            -o /tmp/pass220-v4-hnan-combined
          /tmp/pass220-v4-hnan-combined \
            contracts/pass220/PASS_220_ORDERED_PHASE_CHAIN_V4_20261009.harmonicode \
            | tee artifacts/pass220/v4-source-general/hnan_preflight.txt
          grep -Fx hnan_15_rule_mask=0x7FFF artifacts/pass220/v4-source-general/hnan_preflight.txt
          grep -Fx hnan_xy_yx_reverse=REJECTED_SOURCE_ORDER artifacts/pass220/v4-source-general/hnan_preflight.txt
          grep -Fx hnan_zw_wz_commutation=REJECTED artifacts/pass220/v4-source-general/hnan_preflight.txt
          grep -Fx 40_boolean_truth_witnesses=UNRESOLVED artifacts/pass220/v4-source-general/hnan_preflight.txt
      - name: Bind actual Replay and HNAN run evidence into one candidate-only preflight
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          root=Path('artifacts/pass220/v4-source-general')
          source=Path('contracts/pass220/PASS_220_ORDERED_PHASE_CHAIN_V4_20261009.harmonicode').read_bytes()
          replay=(root/'replay_preflight.txt').read_text()
          hnan=(root/'hnan_preflight.txt').read_text()
          digest=sha256(source).hexdigest()
          assert 'source_sha256='+digest in replay
          assert 'gate_occurrences=40' in replay
          assert 'native_source_preflight=PASS' in replay
          assert 'hnan_15_rule_mask=0x7FFF' in hnan
          assert 'v4_source_identity=VERIFIED' in hnan
          assert 'v4_gate_occurrence_count=40' in hnan
          assert 'v4_hnan_native_preflight=PASS' in hnan
          assert 'global_gate_proof_status=UNRESOLVED' in replay
          assert '40_boolean_truth_witnesses=UNRESOLVED' in hnan
          record={
              'schema':'HHS_PASS220_V4_COMBINED_NONCANONICAL_PREFLIGHT_V1',
              'source_sha256':digest,'source_bytes':len(source),'gate_occurrences':40,
              'native_replay_observed':True,'native_hnan_15_rules_verified':True,
              'phase_order_negative_tests_passed':True,
              'all_40_boolean_truth_witnesses_verified':False,
              'signed_vm81_admission_verified':False,
              'canonical_hash72_hash216_transition_verified':False,
              'authority':'CANDIDATE_ONLY',
          }
          (root/'combined_preflight.json').write_text(json.dumps(record,sort_keys=True,indent=2)+'\n')
          print('V4_REPLAY_HNAN_COMBINED_NONCANONICAL_PREFLIGHT_PASS')
          PY
      - name: Require source-bound 40-gate two-copy proof-obligation compilation
        run: |
          set -euo pipefail
          python -m hhs_runtime.hhs_pass220_v4_ordered_gate_obligations_v1 \
            --source contracts/pass220/PASS_220_ORDERED_PHASE_CHAIN_V4_20261009.harmonicode \
            --native-receipt evidence/pass220/PASS220_V4_40_GATE_REPLAY_PREFLIGHT_37946520150.json \
            --output artifacts/pass220/v4-source-general/ordered_gate_obligations.json
          python -m pytest -q tests/pass220/test_pass220_v4_ordered_gate_obligations_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('artifacts/pass220/v4-source-general')
          gate=json.loads((folder/'ordered_gate_obligations.json').read_text())
          composite=json.loads((folder/'combined_preflight.json').read_text())
          assert gate['source_sha256']==composite['source_sha256']
          assert gate['gate_count']==composite['gate_occurrences']==40
          assert len(gate['copy_pairs'])==18
          assert composite['native_replay_observed']
          assert composite['native_hnan_15_rules_verified']
          assert not gate['all_40_gate_truths_proven']
          assert not composite['all_40_boolean_truth_witnesses_verified']
          assert not gate['pqc_signed_vm81_admission_verified']
          print('V4_NATIVE_REPLAY_HNAN_40_GATE_OBLIGATIONS_CONJOINED')
          PY
      - name: Upload diagnostic receipts and gate inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass220-v4-source-general-replay-preflight-${{ github.sha }}
          path: artifacts/pass220/v4-source-general/
          if-no-files-found: warn
          retention-days: 90
