name: Pass 220 I070 I Tensor Lane 5 VM81 Bridge

on:
  push:
    branches:
      - pass220/i070-i-tensor-lane5-vm81-bridge-20261003
    paths:
      - "hhs_runtime/hhs_pass220_i069_harmonicode_i_tensor_v1.py"
      - "hhs_runtime/hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1.py"
      - "hhs_runtime/hhs_pass220_i065_lossless_emergent_compression_hydration_v1.py"
      - "hhs_runtime/hhs_pass220_quantum_collapse_admission_bridge_v1.py"
      - "tests/pass220/test_hhs_pass220_i069_harmonicode_i_tensor_v1.py"
      - "tests/pass220/test_hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1.py"
      - "formal/wolfram/pass220_i070_i_tensor_lane5_vm81_bridge_v1.wl"
      - "evidence/pass220/i070_i_tensor_lane5_vm81_bridge_wolfram_20261003_v1.output.json"
      - "evidence/pass220/i070_i_tensor_lane5_vm81_bridge_wolfram_20261003_v1.receipt.json"
      - "contracts/pass220/PASS_220_I070_I_TENSOR_LANE5_VM81_BRIDGE_V1.json"
      - "docs/pass220/PASS_220_I070_I_TENSOR_LANE5_VM81_BRIDGE.md"
      - "docs/operations/restart/PASS_220_I070_I_TENSOR_LANE5_VM81_BRIDGE_RESTART_20261003.md"
      - ".github/workflows/pass220-i070-i-tensor-lane5-vm81-bridge.yml"
  pull_request:
    branches:
      - main
    paths:
      - "hhs_runtime/hhs_pass220_i069_harmonicode_i_tensor_v1.py"
      - "hhs_runtime/hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1.py"
      - "hhs_runtime/hhs_pass220_i065_lossless_emergent_compression_hydration_v1.py"
      - "hhs_runtime/hhs_pass220_quantum_collapse_admission_bridge_v1.py"
      - "tests/pass220/test_hhs_pass220_i069_harmonicode_i_tensor_v1.py"
      - "tests/pass220/test_hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1.py"
      - "formal/wolfram/pass220_i070_i_tensor_lane5_vm81_bridge_v1.wl"
      - "evidence/pass220/i070_i_tensor_lane5_vm81_bridge_wolfram_20261003_v1.output.json"
      - "evidence/pass220/i070_i_tensor_lane5_vm81_bridge_wolfram_20261003_v1.receipt.json"
      - "contracts/pass220/PASS_220_I070_I_TENSOR_LANE5_VM81_BRIDGE_V1.json"
      - "docs/pass220/PASS_220_I070_I_TENSOR_LANE5_VM81_BRIDGE.md"
      - "docs/operations/restart/PASS_220_I070_I_TENSOR_LANE5_VM81_BRIDGE_RESTART_20261003.md"
      - ".github/workflows/pass220-i070-i-tensor-lane5-vm81-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i-tensor-lane5-vm81:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate I069 parent and I070 bridge
        run: |
          PYTHONPATH=. python tests/pass220/test_hhs_pass220_i069_harmonicode_i_tensor_v1.py
          PYTHONPATH=. python tests/pass220/test_hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1.py
          python -m hhs_runtime.hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1

      - name: Revalidate inherited I065 and I027 address dependencies
        run: |
          python -m hhs_runtime.testing.native_pytest_provider_v1 -q \
            tests/pass220/test_hhs_pass220_i065_lossless_emergent_compression_hydration_v1.py
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "hhs_runtime/hhs_pass220_quantum_collapse_admission_bridge_v1.py"
          ).read_text(encoding="utf-8")
          for required in (
              "row, column = divmod(k, 3)",
              "vm81_cell_id = nucleus * 9 + k",
              "lo_shu_value = LO_SHU[row][column]",
          ):
              assert required in source
          PY
          python -m py_compile \
            hhs_runtime/hhs_pass220_quantum_collapse_admission_bridge_v1.py

      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            hhs_runtime/hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1.py \
            tests/pass220/test_hhs_pass220_i070_i_tensor_lane5_vm81_bridge_v1.py

      - name: Verify frozen formal evidence and authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output = json.loads(Path(
              "evidence/pass220/i070_i_tensor_lane5_vm81_bridge_wolfram_20261003_v1.output.json"
          ).read_text(encoding="utf-8"))
          receipt = json.loads(Path(
              "evidence/pass220/i070_i_tensor_lane5_vm81_bridge_wolfram_20261003_v1.receipt.json"
          ).read_text(encoding="utf-8"))
          contract = json.loads(Path(
              "contracts/pass220/PASS_220_I070_I_TENSOR_LANE5_VM81_BRIDGE_V1.json"
          ).read_text(encoding="utf-8"))

          assert output["status"] == "PASS"
          assert output["check_count"] == output["pass_count"] == 30
          assert output["failed"] == []
          assert output["vm81_address_count"] == 81
          assert output["vm81_unique_count"] == 81
          assert output["vm81_address_min"] == 0
          assert output["vm81_address_max"] == 80
          assert receipt["status"] == "PASS"
          assert receipt["proven"]["vm81_exact_cover_0_80"] is True
          assert contract["optimization"]["store_generator_and_plane_roots"] is True
          assert contract["optimization"]["persist_expanded_5184_vertices"] is False
          assert contract["authority"]["canonical_vm81_mutation_authority"] is False
          assert contract["authority"]["canonical_hash216_commit_authority"] is False
          PY
