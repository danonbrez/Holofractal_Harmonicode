name: DigitalOcean Production Exact Main

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/digitalocean-production-main.yml"
      - ".github/workflows/pass219-cumulative-pass202-membrane-i122.yml"
      - "hhs_runtime/hhs_pass219_cumulative_pass_membrane_i122_pass202.py"
      - "hhs_gui/**"
      - "hhs_backend/runtime_os_projection.py"
      - "hhs_backend/runtime_os_visual_server.py"
      - "hhs_backend/runtime_os_application_server.py"
      - "hhs_backend/production_visual_server.py"
      - "hhs_backend/production_server.py"
      - "hhs_backend/runtime/hhs_production_assistant_v1.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "native_projects/hhs_pass220_litert_native_model_runtime/**"
      - "scripts/production-backend-closure-verify.py"
      - "scripts/production-assistant-http-verify.py"
      - "tests/pass220/test_hhs_pass220_unified_chatbot_lane5_model_fabric.py"
      - ".github/workflows/repository-hash216-dependency-index.yml"
      - "deployment/digitalocean/guarded_auto_update/**"
      - "deployment/digitalocean/warm_boot_manifest.py"
      - "deploy/digitalocean/hhs-pass196-integrated-environment.service"
      - "deploy/digitalocean/hhs-warm-boot-identity.conf"
      - "tests/test_hhs_guarded_auto_update_contract_v1.py"
      - "tests/pass220/test_pass220_i046_warm_hydrated_vm_boot.py"
      - "tests/test_runtime_os_production_root.py"
      - "tests/test_hhs_production_public_app_v1.py"
      - "tests/test_hash216_exact_main_convergence_v1.py"
      - "docs/deployment/DIGITALOCEAN_EXACT_MAIN*.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  # PR contract validation must never occupy the production delivery mutex.
  # Every non-PR Exact-Main run, including push and explicit redispatch, shares
  # one queue with the generated Hash216 index so active remote promotion is
  # never cancelled by a newer main state.
  group: ${{ github.event_name == 'pull_request' && format('hhs-digitalocean-production-pr-{0}', github.event.pull_request.number) || 'hhs-production-main-delivery' }}
  cancel-in-progress: false

jobs:
  validate-deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out deployment candidate
        uses: actions/checkout@v4
      - name: Validate guarded deployment contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            deployment/digitalocean/guarded_auto_update/hhs-guarded-update.sh \
            deployment/digitalocean/guarded_auto_update/build-runtime-os.sh \
            deployment/digitalocean/guarded_auto_update/preserve-host-drift.sh \
            deployment/digitalocean/guarded_auto_update/validate-candidate.sh \
            deployment/digitalocean/guarded_auto_update/install.sh
          node --check hhs_gui/scripts/production-live-browser-verify.mjs
          python3 -m py_compile \
            deployment/digitalocean/guarded_auto_update/runtime-os-bundle.py \
            deployment/digitalocean/guarded_auto_update/normalize-service-permissions.py \
            deployment/digitalocean/guarded_auto_update/verify-recovery-state.py \
            deployment/digitalocean/warm_boot_manifest.py
          python3 - <<'PY'
          import runpy
          namespace = runpy.run_path("tests/test_hhs_guarded_auto_update_contract_v1.py")
          tests = sorted(
              (name, value)
              for name, value in namespace.items()
              if name.startswith("test_") and callable(value)
          )
          for name, test in tests:
              test()
              print(f"{name}: PASS")
          PY

  validate-production-backend-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out backend candidate
        uses: actions/checkout@v4
      - name: Set up production Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require native compiler toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cc
          command -v c++
          command -v make
      - name: Install production backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile complete production backend Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s python -m compileall -q \
            hhs_backend \
            hhs_runtime \
            scripts/production-backend-closure-verify.py \
            scripts/production-assistant-http-verify.py
          echo "HHS_PRODUCTION_BACKEND_PYTHON_COMPILE_CLOSURE=1"
      - name: Compile and execute production-reachable LiteRT native registry
        shell: bash
        run: |
          set -euo pipefail
          make -C native_projects/hhs_pass220_litert_native_model_runtime clean all test
          echo "HHS_PRODUCTION_BACKEND_NATIVE_COMPILE_CLOSURE=1"
      - name: Import production assistant service and route surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hhs_backend.api import litert_lm_assistant_routes
          from hhs_backend.runtime import hhs_production_assistant_v1
          paths = {
              str(getattr(route, "path", ""))
              for route in litert_lm_assistant_routes.router.routes
          }
          if "/api/assistant/chat" not in paths:
              raise SystemExit(f"production assistant chat route missing: {sorted(paths)}")
          if not hasattr(hhs_production_assistant_v1, "ProductionAssistantService"):
              raise SystemExit("ProductionAssistantService import missing")
          print("HHS_PRODUCTION_ASSISTANT_IMPORT_CLOSURE=1")
          PY
      - name: Execute production assistant two-turn backend closure
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s python scripts/production-backend-closure-verify.py
      - name: Run dependency-scoped production assistant regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/pass220/test_hhs_pass220_unified_chatbot_lane5_model_fabric.py::test_native_first_turn_does_not_probe_optional_pass153_health \
            tests/pass220/test_hhs_pass220_unified_chatbot_lane5_model_fabric.py::test_native_first_fallback_probes_pass153_only_when_needed \
            tests/pass220/test_hhs_pass220_litert_native_model_runtime_v1.py \
            tests/test_hhs_litert_lm_repo_bootstrap_v1.py

  deploy-exact-main:
    if: github.event_name != 'pull_request'
    needs:
      - validate-deployment-contract
      - validate-production-backend-closure
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HHS_PRODUCTION_HOST: '159.65.178.254'
      HHS_PRODUCTION_USER: ${{ vars.HHS_DIGITALOCEAN_SSH_USER || 'root' }}
      HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
      HHS_PINNED_KNOWN_HOSTS: ${{ secrets.HHS_DIGITALOCEAN_KNOWN_HOSTS }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Check out exact main source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Set up canonical frontend build runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require DigitalOcean SSH authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HHS_SSH_PRIVATE_KEY}" ]]; then
            echo "::error::Missing repository secret HHS_DIGITALOCEAN_SSH_PRIVATE_KEY. Production cannot prove or promote exact main without SSH authority."
            exit 2
          fi
          if [[ -z "${HHS_PINNED_KNOWN_HOSTS}" ]]; then
            echo "::error::Missing repository secret HHS_DIGITALOCEAN_KNOWN_HOSTS. Runtime host-key discovery is forbidden; provision the audited production known_hosts entry."
            exit 3
          fi
          [[ -n "${HHS_PRODUCTION_HOST}" ]]
          [[ -n "${HHS_PRODUCTION_USER}" ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Build and seal exact Runtime OS bundle
        shell: bash
        run: |
          set -euo pipefail
          pushd hhs_gui >/dev/null
          npm install --no-audit --no-fund
          npm run typecheck
          npm run test:workspace:source
          npm run test:e2e:source
          npm run test:frontend-telemetry:source
          node --check scripts/production-live-browser-verify.mjs
          npm run build
          popd >/dev/null

          BUNDLE_ARCHIVE="$RUNNER_TEMP/hhs-runtime-os-${TARGET_SHA}.tar.gz"
          BUNDLE_MANIFEST="$RUNNER_TEMP/hhs-runtime-os-${TARGET_SHA}.manifest.json"
          VERIFY_ROOT="$RUNNER_TEMP/hhs-runtime-os-verify"
          python3 deployment/digitalocean/guarded_auto_update/runtime-os-bundle.py create \
            --dist hhs_gui/dist \
            --repository-sha "$TARGET_SHA" \
            --archive "$BUNDLE_ARCHIVE" \
            --manifest "$BUNDLE_MANIFEST"
          release=$(python3 deployment/digitalocean/guarded_auto_update/runtime-os-bundle.py stage \
            --root "$VERIFY_ROOT" \
            --archive "$BUNDLE_ARCHIVE" \
            --manifest "$BUNDLE_MANIFEST" \
            --expected-sha "$TARGET_SHA")
          python3 deployment/digitalocean/guarded_auto_update/runtime-os-bundle.py verify \
            --root "$VERIFY_ROOT" --expected-sha "$TARGET_SHA" >/dev/null
          grep -Fq 'HHS Visual Runtime OS Workspace' "$release/index.html"
          sha256sum "$BUNDLE_ARCHIVE" "$BUNDLE_MANIFEST"

      - name: Configure pinned SSH target
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "${HHS_SSH_PRIVATE_KEY}" > "$HOME/.ssh/hhs-production"
          chmod 0600 "$HOME/.ssh/hhs-production"
          printf '%s\n' "${HHS_PINNED_KNOWN_HOSTS}" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -F "${HHS_PRODUCTION_HOST}" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "::error::Pinned HHS_DIGITALOCEAN_KNOWN_HOSTS does not contain the configured production host ${HHS_PRODUCTION_HOST}."
            exit 4
          fi
          cat > "$HOME/.ssh/config" <<EOF
          Host ${HHS_PRODUCTION_HOST}
            IdentityFile $HOME/.ssh/hhs-production
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            UpdateHostKeys no
          EOF
          chmod 0600 "$HOME/.ssh/config"
          ! grep -q 'ssh-keyscan' "$HOME/.ssh/config"
          echo "HHS_PRODUCTION_PINNED_HOST_TRUST_CONFIGURED=1"

      - name: Verify pinned SSH host and deploy credential
        shell: bash
        run: |
          set -euo pipefail
          set +e
          ssh_output=$(ssh \
            -i "$HOME/.ssh/hhs-production" \
            -o BatchMode=yes \
            -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes \
            "${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}" \
            "printf 'HHS_PRODUCTION_SSH_AUTHORITY_OK\\n'" 2>&1)
          ssh_status=$?
          set -e
          if [[ "$ssh_status" -ne 0 ]]; then
            case "$ssh_output" in
              *"REMOTE HOST IDENTIFICATION HAS CHANGED"*|*"Host key verification failed"*)
                echo "::error title=Stale pinned production SSH host key::HHS_DIGITALOCEAN_KNOWN_HOSTS does not match ${HHS_PRODUCTION_HOST}. Rotate the audited known_hosts secret; do not bypass StrictHostKeyChecking."
                ;;
              *"Permission denied"*)
                echo "::error title=Production SSH deploy credential rejected::HHS_DIGITALOCEAN_SSH_PRIVATE_KEY is not authorized for ${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}. Verify the registered deploy public key and the server authorized_keys entry."
                ;;
              *"Connection timed out"*|*"No route to host"*|*"Connection refused"*)
                echo "::error title=Production SSH endpoint unreachable::Cannot reach ${HHS_PRODUCTION_HOST}:22. Verify the DigitalOcean droplet address, firewall, and sshd."
                ;;
              *)
                echo "::error title=Production SSH preflight failed::Pinned SSH preflight failed for ${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}."
                ;;
            esac
            printf '%s\n' "$ssh_output" >&2
            exit "$ssh_status"
          fi
          grep -Fq 'HHS_PRODUCTION_SSH_AUTHORITY_OK' <<<"$ssh_output"
          echo "HHS_PRODUCTION_SSH_PREFLIGHT_VERIFIED=1"

      - name: Transfer exact Runtime OS bundle
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ARCHIVE="$RUNNER_TEMP/hhs-runtime-os-${TARGET_SHA}.tar.gz"
          BUNDLE_MANIFEST="$RUNNER_TEMP/hhs-runtime-os-${TARGET_SHA}.manifest.json"
          REMOTE_INCOMING="/var/lib/hhs/runtime-os/incoming/${TARGET_SHA}"
          ssh -i "$HOME/.ssh/hhs-production" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}" \
            "install -d -m 0755 '${REMOTE_INCOMING}' && rm -f '${REMOTE_INCOMING}/runtime-os.tar.gz.tmp' '${REMOTE_INCOMING}/manifest.json.tmp'"
          scp -i "$HOME/.ssh/hhs-production" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$BUNDLE_ARCHIVE" \
            "${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}:${REMOTE_INCOMING}/runtime-os.tar.gz.tmp"
          scp -i "$HOME/.ssh/hhs-production" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$BUNDLE_MANIFEST" \
            "${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}:${REMOTE_INCOMING}/manifest.json.tmp"
          ssh -i "$HOME/.ssh/hhs-production" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}" \
            "mv '${REMOTE_INCOMING}/runtime-os.tar.gz.tmp' '${REMOTE_INCOMING}/runtime-os.tar.gz' && mv '${REMOTE_INCOMING}/manifest.json.tmp' '${REMOTE_INCOMING}/manifest.json' && chmod 0644 '${REMOTE_INCOMING}/runtime-os.tar.gz' '${REMOTE_INCOMING}/manifest.json'"

      - name: Bootstrap guarded updater and promote exact main
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/hhs-production" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -o StrictHostKeyChecking=yes \
            "${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}" \
            "TARGET_SHA='${TARGET_SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 027

          APP_ROOT=/opt/hhs/app
          STATE_ROOT=/var/lib/hhs-guarded-update
          BUNDLE_ROOT=/var/lib/hhs/runtime-os
          LOCK_FILE=/run/lock/hhs-guarded-update.lock
          PRODUCTION_LOCK_FILE=/run/lock/hhs-production-mutation.lock
          OWNERSHIP_TIMEOUT=900
          TARGET_SHA=${TARGET_SHA:?missing TARGET_SHA}
          PROMOTION_HANDOFF=0
          TIMER_CLAIMED=0
          RECOVERY_MODE=0
          bootstrap_root=""

          cleanup() {
            if [[ -n "$bootstrap_root" ]]; then
              git -C "$APP_ROOT" worktree remove --force "$bootstrap_root" >/dev/null 2>&1 || rm -rf "$bootstrap_root"
            fi
            if [[ "$TIMER_CLAIMED" == "1" && "$PROMOTION_HANDOFF" == "0" ]]; then
              if systemctl is-active --quiet hhs.service; then
                systemctl start hhs-guarded-update.timer >/dev/null 2>&1 || true
              fi
            fi
          }
          trap cleanup EXIT

          [[ $EUID -eq 0 ]] || { echo "production deployment requires root SSH authority" >&2; exit 10; }
          [[ -d "$APP_ROOT/.git" ]] || { echo "repository missing at $APP_ROOT" >&2; exit 11; }

          # One host, one mutation owner. Keep this descriptor locked for the
          # entire remote exact-main transaction so no independent production
          # workflow can mutate the shared checkout/systemd/nginx concurrently.
          install -d -m 0755 "$(dirname "$PRODUCTION_LOCK_FILE")"
          exec 7>"$PRODUCTION_LOCK_FILE"
          flock -w 30 7 || { echo "production mutation lock is busy" >&2; exit 14; }
          echo "HHS_PRODUCTION_MUTATION_OWNERSHIP_CLAIMED=1"
          [[ -s "$BUNDLE_ROOT/incoming/$TARGET_SHA/runtime-os.tar.gz" ]] || { echo "Runtime OS archive missing" >&2; exit 12; }
          [[ -s "$BUNDLE_ROOT/incoming/$TARGET_SHA/manifest.json" ]] || { echo "Runtime OS manifest missing" >&2; exit 13; }
          command -v flock >/dev/null || { echo "flock is required for deployment ownership" >&2; exit 14; }

          echo "=== CLAIM EXACT-MAIN UPDATER OWNERSHIP ==="
          systemctl stop hhs-guarded-update.timer 2>/dev/null || true
          TIMER_CLAIMED=1
          deadline=$((SECONDS + OWNERSHIP_TIMEOUT))
          while :; do
            updater_state=$(systemctl show hhs-guarded-update.service -p ActiveState --value 2>/dev/null || printf 'inactive')
            case "$updater_state" in
              inactive|failed|unknown|"") break ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "existing guarded updater did not finish before exclusive deployment timeout (state=$updater_state)" >&2
              systemctl status hhs-guarded-update.service --no-pager --full >&2 || true
              journalctl -u hhs-guarded-update.service -n 400 --no-pager >&2 || true
              exit 15
            fi
            sleep 2
          done

          SERVICE_INACTIVE=0
          if ! systemctl is-active --quiet hhs.service; then
            if ss -H -ltn 'sport = :8080' | grep -q .; then
              echo "hhs.service is inactive but port 8080 is owned by another listener; refusing recovery." >&2
              ss -H -ltnp 'sport = :8080' >&2 || true
              exit 16
            fi
            SERVICE_INACTIVE=1
          fi

          systemctl reset-failed hhs-guarded-update.service 2>/dev/null || true
          install -d -m 0755 "$(dirname "$LOCK_FILE")"
          exec 8>"$LOCK_FILE"
          flock -w 10 8 || { echo "guarded updater lock remained held after service termination" >&2; exit 17; }
          flock -u 8
          echo "HHS_EXACT_MAIN_UPDATER_OWNERSHIP_CLAIMED=1"

          cd "$APP_ROOT"
          remote=$(git remote get-url origin)
          case "$remote" in
            *danonbrez/Holofractal_Harmonicode* ) ;;
            * ) echo "unexpected origin: $remote" >&2; exit 18 ;;
          esac
          branch=$(git branch --show-current)
          [[ "$branch" == "main" ]] || { echo "live checkout must be on main, found ${branch:-detached}" >&2; exit 19; }

          git fetch --prune origin main
          remote_sha=$(git rev-parse origin/main)
          [[ "$remote_sha" == "$TARGET_SHA" ]] || {
            echo "origin/main moved while deployment was starting: expected $TARGET_SHA got $remote_sha" >&2
            exit 20
          }
          git cat-file -e "$TARGET_SHA^{commit}"

          bootstrap_root=$(mktemp -d /tmp/hhs-production-bootstrap.XXXXXX)
          git worktree add --detach "$bootstrap_root" "$TARGET_SHA"

          if [[ "$SERVICE_INACTIVE" == "1" ]]; then
            current_head=$(git -C "$APP_ROOT" rev-parse HEAD)
            recovery_report=$(python3 "$bootstrap_root/deployment/digitalocean/guarded_auto_update/verify-recovery-state.py" \
              --receipt-log "$STATE_ROOT/receipts.jsonl" \
              --current-head "$current_head" \
              --repository-root "$APP_ROOT" \
              --branch main \
              --warm-boot-verifier "$bootstrap_root/deployment/digitalocean/warm_boot_manifest.py" \
              --warm-boot-manifest-root /var/lib/hhs/warm-boot/releases)
            printf '%s\n' "$recovery_report"
            RECOVERY_MODE=1
            echo "HHS_EXACT_MAIN_RECOVERY_RECEIPT_VERIFIED=1"
            echo "HHS_EXACT_MAIN_RECOVERY_MODE=1"
          fi

          HHS_UPDATE_STATE_ROOT="$STATE_ROOT" \
          HHS_RUNTIME_OUTPUT_DIR=/var/lib/hhs/data/runtime \
          HHS_HOST_DRIFT_MODE=source \
            bash "$bootstrap_root/deployment/digitalocean/guarded_auto_update/preserve-host-drift.sh" "$APP_ROOT"
          git -C "$APP_ROOT" update-index -q --refresh || true
          if ! git -C "$APP_ROOT" diff-index --quiet HEAD -- || ! git -C "$APP_ROOT" diff --cached --quiet; then
            echo "tracked host drift remains after audited reconciliation" >&2
            git -C "$APP_ROOT" status --short >&2
            exit 21
          fi

          PROMOTION_HANDOFF=1
          if ! REPO_ROOT="$APP_ROOT" \
            SOURCE_ROOT="$bootstrap_root" \
            HHS_RUNTIME_OS_BUNDLE_SHA="$TARGET_SHA" \
            HHS_RUNTIME_OS_BUNDLE_ROOT="$BUNDLE_ROOT" \
            HHS_INSTALL_ENABLE_PROMOTION=1 \
            HHS_INSTALL_RECOVERY_MODE="$RECOVERY_MODE" \
            HHS_PRODUCTION_HEALTH_TIMEOUT_SECONDS=600 \
              bash "$bootstrap_root/deployment/digitalocean/guarded_auto_update/install.sh"; then
            echo "=== EXACT-MAIN PRODUCTION RECOVERY DIAGNOSTICS ===" >&2
            printf 'HHS_EXACT_MAIN_FAILURE_HEAD=%s\n' "$(git -C "$APP_ROOT" rev-parse HEAD 2>/dev/null || printf unknown)" >&2
            git -C "$APP_ROOT" status --short >&2 || true
            echo "=== GUARDED UPDATER SERVICE STATUS ===" >&2
            systemctl status hhs-guarded-update.service --no-pager --full >&2 || true
            systemctl show hhs-guarded-update.service -p ActiveState -p SubState -p Result -p ExecMainCode -p ExecMainStatus --no-pager >&2 || true
            echo "=== GUARDED UPDATER JOURNAL ===" >&2
            journalctl -u hhs-guarded-update.service -n 800 --no-pager >&2 || true
            if [[ -f "$STATE_ROOT/receipts.jsonl" ]]; then
              echo "=== GUARDED UPDATE RECEIPTS ===" >&2
              tail -n 30 "$STATE_ROOT/receipts.jsonl" >&2 || true
            fi
            if [[ -f "$STATE_ROOT/last-success.json" ]]; then
              echo "=== GUARDED UPDATE LAST SUCCESS ===" >&2
              cat "$STATE_ROOT/last-success.json" >&2 || true
            fi
            echo "=== HHS SERVICE STATUS ===" >&2
            systemctl status hhs.service --no-pager --full >&2 || true
            systemctl show hhs.service -p ActiveState -p SubState -p MainPID -p ExecStart -p WorkingDirectory -p Environment --no-pager >&2 || true
            ss -ltnp | grep ':8080' >&2 || true
            journalctl -u hhs.service -n 500 --no-pager >&2 || true
            exit 24
          fi

          python3 - "$STATE_ROOT/last-success.json" "$TARGET_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = sys.argv[2]
          if payload.get("candidate_sha") != expected or payload.get("runtime_os_bundle_sha") != expected:
              raise SystemExit(f"promotion receipt identity mismatch: {payload}")
          if payload.get("outcome") != "PROMOTED":
              raise SystemExit(f"unexpected promotion outcome: {payload.get('outcome')}")
          print(json.dumps(payload, sort_keys=True))
          PY

          deployed_sha=$(git -C "$APP_ROOT" rev-parse HEAD)
          [[ "$deployed_sha" == "$TARGET_SHA" ]]
          [[ -z "$(git -C "$APP_ROOT" status --porcelain=v1 --untracked-files=normal)" ]] || {
            echo "production checkout is dirty after promotion" >&2
            git -C "$APP_ROOT" status --short >&2
            exit 22
          }
          systemctl is-active --quiet hhs.service
          systemctl is-active --quiet hhs-lane5-ingress.socket
          systemctl is-active --quiet hhs-lane5-ingress.service
          systemctl is-active --quiet hhs-guarded-update.timer
          runuser -u hhs -- test -x /opt
          runuser -u hhs -- test -x /opt/hhs
          runuser -u hhs -- test -x "$APP_ROOT"
          runuser -u hhs -- test -x "$APP_ROOT/hhs_backend"
          runuser -u hhs -- test -r "$APP_ROOT/hhs_backend/__init__.py"
          echo "HHS_PRODUCTION_SERVICE_PERMISSIONS_VERIFIED=1"
          hhs_service_unit="$(systemctl cat hhs.service)"
          grep -Fq 'HHS_RUNTIME_OUTPUT_DIR=/var/lib/hhs/data/runtime' <<<"$hhs_service_unit"
          grep -Fq 'HHS_RUNTIME_OS_ASSET_ROOT=/var/lib/hhs/runtime-os/current' <<<"$hhs_service_unit"
          grep -Fq 'HHS_COGNITION_AUTO_TICK=0' <<<"$hhs_service_unit"
          hhs_service_exec_start="$(systemctl show hhs.service -p ExecStart --value)"
          grep -Fq 'hhs_backend.production_visual_server:app' <<<"$hhs_service_exec_start"
          release=$(python3 /usr/local/lib/hhs-guarded-update/runtime-os-bundle.py verify \
            --root "$BUNDLE_ROOT" --expected-sha "$TARGET_SHA")
          test "$(readlink -f "$BUNDLE_ROOT/current")" = "$release"

          listener_count=$(ss -H -ltnp 'sport = :8080' | wc -l)
          [[ "$listener_count" -eq 1 ]] || {
            echo "expected exactly one production listener on 8080, found $listener_count" >&2
            ss -H -ltnp 'sport = :8080' >&2 || true
            exit 23
          }
          lane5_listener_count=$(ss -H -ltnp 'sport = :8715' | wc -l)
          [[ "$lane5_listener_count" -eq 1 ]] || {
            echo "expected exactly one Lane 5 ingress listener on 8715, found $lane5_listener_count" >&2
            ss -H -ltnp 'sport = :8715' >&2 || true
            exit 23
          }
          lane5_service_exec_start="$(systemctl show hhs-lane5-ingress.service -p ExecStart --value)"
          grep -Fq 'hhs_backend.lane5_ingress_gateway:app' <<<"$lane5_service_exec_start"
          curl -fsS --max-time 10 http://127.0.0.1:8715/__hhs_lane5_ingress_health >/tmp/hhs-lane5-ingress-health.json
          nginx_dump=$(nginx -T 2>&1)
          ! grep -Fq 'proxy_pass http://127.0.0.1:8080' <<<"$nginx_dump"
          ! grep -Fq 'proxy_pass http://127.0.0.1:8720' <<<"$nginx_dump"
          grep -Fq 'proxy_pass http://127.0.0.1:8715' <<<"$nginx_dump"
          echo "HHS_DIGITALOCEAN_LANE5_HOST_INGRESS_VERIFIED=1"

          curl -fsS --max-time 10 http://127.0.0.1:8080/api/system/status >/dev/null
          curl -fsS --max-time 10 http://127.0.0.1:8080/api/interface/status >/tmp/hhs-exact-main-interface.json
          curl -fsS --max-time 30 http://127.0.0.1:8080/api/runtime/services >/tmp/hhs-exact-main-services.json
          curl -fsS --max-time 10 http://127.0.0.1:8080/ >/tmp/hhs-exact-main-root.html
          grep -Fq 'HHS Visual Runtime OS Workspace' /tmp/hhs-exact-main-root.html
          EXPECTED_RUNTIME_OS_RELEASE="$release" python3 - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('/tmp/hhs-exact-main-interface.json').read_text(encoding='utf-8'))
          if payload.get('interface') != 'HHS_VISUAL_RUNTIME_OS_WORKSPACE': raise SystemExit(payload)
          if payload.get('legacy_harmonizer_is_public_root') is not False: raise SystemExit(payload)
          actual = Path(str(payload.get('asset_root', ''))).resolve()
          expected = Path(os.environ['EXPECTED_RUNTIME_OS_RELEASE']).resolve()
          if actual != expected:
              raise SystemExit(f'Runtime OS asset authority mismatch: actual={actual} expected={expected}')
          services_payload = json.loads(Path('/tmp/hhs-exact-main-services.json').read_text(encoding='utf-8'))
          services = services_payload.get('services')
          if not isinstance(services, list) or not services:
              raise SystemExit(f'local Runtime OS service registry is empty or malformed: {services_payload}')
          print(f'HHS_DIGITALOCEAN_LOCAL_SERVICE_REGISTRY_VERIFIED={len(services)}')
          PY

          echo "=== VERIFY DIRECT PRODUCTION BACKEND ASSISTANT ==="
          if ! python3 "$APP_ROOT/scripts/production-assistant-http-verify.py" \
            --base-url http://127.0.0.1:8080 \
            --timeout-seconds 30 \
            --label backend; then
            echo "direct production backend assistant verification failed" >&2
            systemctl status hhs.service --no-pager --full >&2 || true
            journalctl -u hhs.service -n 500 --no-pager >&2 || true
            exit 25
          fi

          echo "=== VERIFY LANE 5 ASSISTANT INGRESS ==="
          if ! python3 "$APP_ROOT/scripts/production-assistant-http-verify.py" \
            --base-url http://127.0.0.1:8715 \
            --timeout-seconds 30 \
            --label lane5; then
            echo "Lane 5 production assistant verification failed" >&2
            systemctl status hhs-lane5-ingress.service --no-pager --full >&2 || true
            journalctl -u hhs-lane5-ingress.service -n 500 --no-pager >&2 || true
            systemctl status hhs.service --no-pager --full >&2 || true
            journalctl -u hhs.service -n 500 --no-pager >&2 || true
            exit 26
          fi

          latest_drift_manifest=$(find "$STATE_ROOT/host-drift" -mindepth 2 -maxdepth 2 -name manifest.json -type f -printf '%T@ %p\n' 2>/dev/null | sort -n | tail -n 1 | cut -d' ' -f2- || true)
          if [[ -n "$latest_drift_manifest" ]]; then
            printf 'HHS_DIGITALOCEAN_HOST_DRIFT_MANIFEST=%s\n' "$latest_drift_manifest"
            sha256sum "$latest_drift_manifest"
          fi
          printf 'HHS_DIGITALOCEAN_EXACT_MAIN_PROMOTED=%s\n' "$TARGET_SHA"
          printf 'HHS_DIGITALOCEAN_RUNTIME_OS_RELEASE=%s\n' "$release"
          REMOTE

      - name: Verify public HTTPS Runtime OS is reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -kfsS --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            "https://${HHS_PRODUCTION_HOST}/api/system/status" >/tmp/hhs-public-system-status.json
          curl -kfsS --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            "https://${HHS_PRODUCTION_HOST}/api/interface/status" >/tmp/hhs-public-interface-status.json
          curl -kfsS --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            "https://${HHS_PRODUCTION_HOST}/api/runtime/services" >/tmp/hhs-public-services.json
          curl -kfsS --retry 5 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            "https://${HHS_PRODUCTION_HOST}/" >/tmp/hhs-public-runtime-os.html
          test -s /tmp/hhs-public-system-status.json
          grep -Fq 'HHS Visual Runtime OS Workspace' /tmp/hhs-public-runtime-os.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/hhs-public-interface-status.json').read_text(encoding='utf-8'))
          if payload.get('interface') != 'HHS_VISUAL_RUNTIME_OS_WORKSPACE': raise SystemExit(payload)
          if payload.get('legacy_harmonizer_is_public_root') is not False: raise SystemExit(payload)
          if '/var/lib/hhs/runtime-os/releases/' not in str(payload.get('asset_root', '')):
              raise SystemExit(f"public interface is not serving a versioned Runtime OS release: {payload}")
          services_payload = json.loads(Path('/tmp/hhs-public-services.json').read_text(encoding='utf-8'))
          services = services_payload.get('services')
          if not isinstance(services, list) or not services:
              raise SystemExit(f'public Runtime OS service registry is empty or malformed: {services_payload}')
          print('HHS_DIGITALOCEAN_PUBLIC_RUNTIME_OS_VERIFIED')
          print(f'HHS_DIGITALOCEAN_PUBLIC_SERVICE_REGISTRY_VERIFIED={len(services)}')
          PY

      - name: Verify public frontend capability projection in Chromium
        working-directory: hhs_gui
        shell: bash
        run: |
          set -euo pipefail
          expected_service_count=$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/hhs-public-services.json').read_text(encoding='utf-8'))
          services = payload.get('services')
          if not isinstance(services, list) or not services:
              raise SystemExit(f'public Runtime OS service registry is empty or malformed: {payload}')
          print(len(services))
          PY
          )
          npm install --no-save --package-lock=false playwright@1.55.0
          timeout 600s npx playwright install --with-deps chromium
          HHS_PRODUCTION_BASE_URL="https://${HHS_PRODUCTION_HOST}" \
          HHS_PRODUCTION_EXPECTED_SHA="${TARGET_SHA}" \
          HHS_PRODUCTION_EXPECTED_SERVICE_COUNT="${expected_service_count}" \
          HHS_PRODUCTION_PUBLIC_SERVICE_REGISTRY_FILE="/tmp/hhs-public-services.json" \
          HHS_PRODUCTION_BROWSER_IGNORE_HTTPS_ERRORS=1 \
          HHS_PRODUCTION_BROWSER_EVIDENCE_DIR="${RUNNER_TEMP}/production-browser" \
            timeout 300s node scripts/production-live-browser-verify.mjs
          cat "${RUNNER_TEMP}/production-browser/production-live-browser.json"

      - name: Upload production frontend capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-frontend-capability-${{ env.TARGET_SHA }}
          path: |
            ${{ runner.temp }}/production-browser/production-live-browser.json
            ${{ runner.temp }}/production-browser/production-live-browser.png
          if-no-files-found: warn
          retention-days: 30

      - name: Queue Hash216 repository index after verified promotion
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          subject="$(git show -s --format=%s "$TARGET_SHA")"
          if [[ "$subject" == "docs: refresh Hash216 repository dependency index" ]]; then
            echo "HHS_EXACT_MAIN_HASH216_INDEX_TERMINAL_GENERATED_SUCCESSOR=$TARGET_SHA"
            exit 0
          fi
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_head"
          if [[ "$remote_head" != "$TARGET_SHA" ]]; then
            echo "HHS_EXACT_MAIN_HASH216_INDEX_STALE_PROMOTION_SKIPPED=$TARGET_SHA"
            echo "HHS_EXACT_MAIN_CURRENT_REMOTE_HEAD=$remote_head"
            exit 0
          fi
          gh workflow run repository-hash216-dependency-index.yml --ref main -f promoted_sha="$TARGET_SHA"
          echo "HHS_EXACT_MAIN_HASH216_INDEX_QUEUED=$TARGET_SHA"
