name: Pass219 HHCQ Reciprocal Economy Phase9

on:
  push:
    branches:
      - agent/pass219-hhcq-reciprocal-economy-phase9-20260907
    paths:
      - 'hhs_runtime/include/hhs_pass219_hhcq_reciprocal_economy_1_29.h'
      - 'hhs_runtime/c/hhs_pass219_hhcq_reciprocal_economy_1_29.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_hhcq_reciprocal_economy_1_29.c'
      - 'benchmarks/pass219/hhcq_reciprocal_economy_phase9_benchmark.cpp'
      - 'docs/operations/restart/PASS_219_HHCQ_RECIPROCAL_ECONOMY_PHASE9_RESTART.md'
      - '.github/workflows/pass219-hhcq-reciprocal-economy-phase9.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase9:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
    steps:
      - name: Check out Phase9 branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build exact ABI
        run: |
          set -o pipefail
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Compile and run strict Phase9 C invariants
        run: |
          set -o pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_hhcq_reciprocal_economy_1_29.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-phase9-test
          /tmp/pass219-phase9-test

      - name: Reuse frozen Phase3 authenticated hydrated-weight artifact
        uses: actions/download-artifact@v4
        with:
          name: pass219-core-dynamic-circuit-experiment
          path: /tmp/pass219-phase3-artifact
          github-token: ${{ github.token }}
          repository: danonbrez/Holofractal_Harmonicode
          run-id: 34138427959

      - name: Verify frozen Phase3 frame binary
        run: |
          FRAME="$(find /tmp/pass219-phase3-artifact -name PASS_219_PHASE3_HYDRATED_WEIGHT_FRAMES.bin -print -quit)"
          test -n "$FRAME"
          test -s "$FRAME"
          echo '63d0f8816d4c04e10eb5d9644c9c60015b8cdd3b1235f114b3f1821ef08a3433  '"$FRAME" | sha256sum -c -
          printf '%s\n' "$FRAME" > /tmp/pass219-phase3-frame-path
          sha256sum "$FRAME" > /tmp/pass219-phase3-frame.sha256

      - name: Compile and run Phase9 reciprocal economy benchmark
        run: |
          set -o pipefail
          mkdir -p artifacts/pass219/phase9
          FRAME="$(cat /tmp/pass219-phase3-frame-path)"
          c++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/hhcq_reciprocal_economy_phase9_benchmark.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-phase9-benchmark
          /tmp/pass219-phase9-benchmark "$FRAME" \
            | tee artifacts/pass219/phase9/hhcq_reciprocal_economy.json
          cp /tmp/pass219-phase3-frame.sha256 artifacts/pass219/phase9/phase3_frame.sha256

      - name: Validate Phase9 evidence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/pass219/phase9/hhcq_reciprocal_economy.json')
          d = json.loads(p.read_text())
          assert d['schema'] == 'HHS_PASS219_HHCQ_RECIPROCAL_ECONOMY_PHASE9_V1'
          assert d['classification'] == 'BUDGET_GATE_REJECTS_UNPROVEN_RECOVERY'
          assert d['phase3_frame_binary_sha256'] == '63d0f8816d4c04e10eb5d9644c9c60015b8cdd3b1235f114b3f1821ef08a3433'
          assert d['summary_records'] == 529
          assert d['local_samples'] == 4761
          assert d['phase5_exact_roundtrip_checks'] == 4761
          assert d['lane_local_container_identity_checks'] == 19044
          assert d['resolution_diversity'] == 35
          assert d['target_lane_diversity'] == 4
          assert d['training_local_samples'] == 3456
          assert d['heldout_local_samples'] == 1305
          assert d['training_unique_digest_count'] == 352
          assert d['heldout_unique_digest_count'] == 137
          assert d['train_heldout_digest_overlap'] == 0
          assert d['selected_regret_quantum_units'] > 0
          assert d['selected_training_epochs'] in {4,8,12,16}
          assert d['heldout_phase8_mean_regret'] >= 0
          assert d['economy_parity_units'] == 5184
          assert d['economy_heldout_samples'] == 1305
          assert d['direct_lossless_admitted'] == 1305
          assert d['direct_lossless_selected'] == 1305
          assert d['factor2_lower_resolution_candidates'] > 0
          assert d['factor3_lower_resolution_candidates'] > 0
          assert d['unproven_lower_resolution_candidates'] > 0
          assert d['unproven_budget_positive_candidates'] > 0
          assert d['unproven_information_1to1_candidates'] > 0
          assert d['unproven_admitted_candidates'] == 0
          assert d['selector_replay_checks'] == 1305
          assert d['inherited_crossarch_contract_gate'] is True
          assert d['structural_normalized_economy_only'] is True
          assert d['lower_resolution_candidate_execution_measured'] is False
          assert d['materialized_golay_reconstruction_used'] is False
          assert d['golay_ecc_spend_is_budget_reservation_only'] is True
          assert d['exact_reconstruction_required_before_lower_resolution_admission'] is True
          assert d['lossy_lossless_information_ratio_required_1to1'] is True
          assert d['fixed_policy_state_bytes'] == 112
          assert d['phase5_resolution_locked'] is True
          assert d['candidate_only'] is True
          assert d['canonical_authority_changed'] is False
          assert d['floating_point_authority'] is False
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Record Phase9 summary
        if: always()
        run: |
          {
            echo '### Pass219 HHCQ reciprocal economy Phase9'
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            if test -f artifacts/pass219/phase9/hhcq_reciprocal_economy.json; then
              echo '```json'
              cat artifacts/pass219/phase9/hhcq_reciprocal_economy.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass219-hhcq-reciprocal-economy-phase9
          path: artifacts/pass219/phase9
          if-no-files-found: warn
