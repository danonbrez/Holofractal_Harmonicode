name: Pass 220 Course Module Gate Provenance
on:
  pull_request:
    paths:
      - "whitepapers/Harmonicode Algebra - Course"
      - "hhs_runtime/hhs_pass220_course_module_gate_provenance_v1.py"
      - "tests/pass220/test_pass220_course_module_gate_provenance_v1.py"
      - ".github/workflows/pass220-course-module-gate-provenance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course-module-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Validate all course modules with source-exact provenance and fail-closed admission
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_course_module_gate_provenance_v1.py
