name: Pass 220 Nucleus Group Selection
on:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/pass220/lane5_nucleus_group_selection.py'
      - 'tests/pass220/test_lane5_nucleus_group_selection.py'
      - '.github/workflows/pass220-nucleus-group-selection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact candidate selection tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/pass220/test_lane5_nucleus_group_selection.py
