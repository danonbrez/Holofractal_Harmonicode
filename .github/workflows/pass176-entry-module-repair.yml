name: Apply Pass 176 Entry Module Repair

on:
  push:
    branches:
      - agent/pass176-frozen-ide-stabilization
    paths:
      - '.github/workflows/pass176-entry-module-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pass176-entry-module-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass176-frozen-ide-stabilization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Remove entry-module top-level await barriers
        run: |
          python - <<'PY'
          from pathlib import Path

          def indent(block: str) -> str:
              return '\n'.join(('  ' + line) if line else '' for line in block.split('\n'))

          browser = Path('applications/holofractal_harmonizer/src/browser.mjs')
          text = browser.read_text(encoding='utf-8')
          start = text.index('for (const object of objects) {')
          end = text.index('\nfunction objectGlyph(object)', start)
          registry_block = text[start:end]
          text = text[:start] + 'async function initializeBrowserRegistry() {\n' + indent(registry_block) + '\n}\n' + text[end:]
          start = text.index('renderObjects();\nshowView(\'assistant\');')
          terminal = 'void Promise.allSettled([refreshAssistantStatus(), restoreOrCreateThread()]);'
          end = text.index(terminal, start) + len(terminal)
          bootstrap_block = text[start:end]
          wrapped = (
              'async function finishBrowserBootstrap() {\n'
              '  await initializeBrowserRegistry();\n'
              + indent(bootstrap_block)
              + '\n  return runtime;\n}\n\n'
              'const browserReadyPromise = finishBrowserBootstrap();\n'
              'window.HHSBrowserReady = browserReadyPromise;\n'
              "void browserReadyPromise.catch((error) => {\n"
              "  console.error('HHS Pass 161 browser bootstrap failed', error);\n"
              "  window.dispatchEvent(new CustomEvent('hhs:browser:bootstrap-error', {\n"
              "    detail: { classification: 'HHS_P176_BROWSER_BOOTSTRAP_FAILED', message: error?.message || String(error) },\n"
              "  }));\n"
              '});'
          )
          text = text[:start] + wrapped + text[end:]
          browser.write_text(text, encoding='utf-8')

          workflow = Path('applications/holofractal_harmonizer/src/ux-default.mjs')
          text = workflow.read_text(encoding='utf-8')
          start = text.index('await ready();')
          body = text[start:].rstrip()
          wrapped = (
              'async function initializeWorkflowUX() {\n'
              + indent(body)
              + '\n  return window.HHSWorkflowUX;\n}\n\n'
              'const workflowUXReadyPromise = initializeWorkflowUX();\n'
              'window.HHSWorkflowUXReady = workflowUXReadyPromise;\n'
              "void workflowUXReadyPromise.catch((error) => {\n"
              "  console.error('HHS workflow UX bootstrap failed', error);\n"
              "  window.dispatchEvent(new CustomEvent('hhs:workflow-ux:bootstrap-error', {\n"
              "    detail: { classification: 'HHS_P176_WORKFLOW_UX_BOOTSTRAP_FAILED', message: error?.message || String(error) },\n"
              "  }));\n"
              '});\n'
          )
          text = text[:start] + wrapped
          workflow.write_text(text, encoding='utf-8')
          PY

      - name: Validate entry modules and full browser test suite
        run: |
          set -euo pipefail
          node --check applications/holofractal_harmonizer/src/browser.mjs
          node --check applications/holofractal_harmonizer/src/ux-default.mjs
          node --check applications/holofractal_harmonizer/src/visual-ide.mjs
          if grep -nE '^await[[:space:]]' applications/holofractal_harmonizer/src/browser.mjs applications/holofractal_harmonizer/src/ux-default.mjs; then
            echo 'Top-level await remains in an entry module' >&2
            exit 1
          fi
          cd applications/holofractal_harmonizer
          timeout 600s npm test

      - name: Commit repair and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pass176-entry-module-repair.yml
          git add applications/holofractal_harmonizer/src/browser.mjs applications/holofractal_harmonizer/src/ux-default.mjs
          git diff --cached --check
          git commit -m 'Remove Pass 176 entry-module DOM readiness deadlocks'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/pass176-frozen-ide-stabilization; then
              exit 0
            fi
            git pull --rebase origin agent/pass176-frozen-ide-stabilization
            sleep $((attempt * 2))
          done
          exit 1
