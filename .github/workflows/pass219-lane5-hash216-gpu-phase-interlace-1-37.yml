      - name: Verify Wolfram cycle-4 Poincare invariant evidence is sealed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path(
              'evidence/pass219/lane5_poincare_integral_invariant_wolfram_20260924_v4.receipt.json'
          ).read_text())
          output = json.loads(Path(
              'evidence/pass219/lane5_poincare_integral_invariant_wolfram_20260924_v4.output.json'
          ).read_text())
          assert receipt['status'] == output['status'] == 'PASS'
          assert receipt['check_count'] == output['check_count'] == 16
          assert receipt['pass_count'] == output['pass_count'] == 16
          assert receipt['failed'] == output['failed'] == []
          assert output['both_sequential_orders_symplectic'] is True
          assert output['simultaneous_old_state_explicit_symplectic'] is False
          assert output['volume_only_is_insufficient'] is True
          assert output['poincare_integral_invariant'] == (
              'Phi^*(sum_i dq_i wedge dp_i)=sum_i dq_i wedge dp_i'
          )
          assert output['four_d_projection_reading'] == (
              'oriented A1+A2 is invariant; individual Ai may exchange'
          )
          assert output['t_bridge_01b_energy_band_class_stability'] == 'OPEN'
          assert receipt['exact_energy_conservation_claimed'] is False
          assert receipt['canonical_runtime_mutation_authority'] is False
          print('lane5_poincare_integral_invariant_wolfram_v4=PASS')
          PY

      - name: Validate SPI v9 harmonic and Delta projection registry
        env:
          PYTHONPATH: .
        run: |
          python hhs_spi_scalar_projection_registry_v9.py
          python hhs_spi_scalar_projection_registry_tests_v9.py

      - name: Verify Wolfram cycle-5 scalar-face / Delta / T_BRIDGE evidence is sealed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path(
              'evidence/pass219/lane5_scalar_face_delta_tbridge_wolfram_20260924_v5.receipt.json'
          ).read_text())
          output = json.loads(Path(
              'evidence/pass219/lane5_scalar_face_delta_tbridge_wolfram_20260924_v5.output.json'
          ).read_text())
          assert receipt['status'] == output['status'] == 'PASS'
          assert receipt['check_count'] == output['check_count'] == 15
          assert receipt['pass_count'] == output['pass_count'] == 15
          assert receipt['failed'] == output['failed'] == []
          assert output['harmonic_modulus_symbol'] == (
              'U72 := 2/ubar^2; not ordinary ubar^72'
          )
          assert output['g72_native_status'] == (
