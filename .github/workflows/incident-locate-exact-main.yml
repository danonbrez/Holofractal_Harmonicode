name: Incident Locate Exact Main Run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-locate-exact-main.yml'

permissions:
  actions: read
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Locate newest Exact-Main workflow dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo danonbrez/Holofractal_Harmonicode \
            --workflow digitalocean-production-main.yml \
            --event workflow_dispatch \
            --limit 10 \
            --json databaseId,status,conclusion,headSha,event,createdAt,displayTitle \
            --jq '.[] | "EXACT_MAIN_RUN id=\(.databaseId) status=\(.status) conclusion=\(.conclusion // "") head=\(.headSha) event=\(.event) created=\(.createdAt) title=\(.displayTitle)"'
