name: Production Runtime API Artifact Root

on:
  push:
    branches:
      - fix/production-runtime-api-artifact-root-20260925
    paths:
      - 'hhs_runtime_api_server_v1.py'
      - 'deploy/digitalocean/hhs-pass196-integrated-environment.service'
      - 'tests/test_runtime_api_artifact_root_production.py'
      - 'tests/test_production_mutable_state_roots.py'
      - '.github/workflows/production-runtime-api-artifact-root.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'hhs_runtime_api_server_v1.py'
      - 'deploy/digitalocean/hhs-pass196-integrated-environment.service'
      - 'tests/test_runtime_api_artifact_root_production.py'
      - 'tests/test_production_mutable_state_roots.py'
      - '.github/workflows/production-runtime-api-artifact-root.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run production artifact-root regressions
        run: |
          python -m pytest -q             tests/test_runtime_api_artifact_root_production.py             tests/test_production_mutable_state_roots.py
      - name: Verify production unit syntax and immutable checkout boundary
        run: |
          systemd-analyze verify deploy/digitalocean/hhs-pass196-integrated-environment.service
          grep -Fx 'Environment=HHS_RUNTIME_API_ARTIFACT_ROOT=/var/lib/hhs/runtime-api'             deploy/digitalocean/hhs-pass196-integrated-environment.service
          ! grep -F 'ReadWritePaths=/opt/hhs/app'             deploy/digitalocean/hhs-pass196-integrated-environment.service
