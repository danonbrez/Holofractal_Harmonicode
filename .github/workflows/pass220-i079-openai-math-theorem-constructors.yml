name: Pass 220 I079 OpenAI Math Theorem Constructors

on:
  push:
    branches:
      - pass220/i079-openai-math-theorem-constructors-20261007
    paths:
      - 'data/pass220/openai_math_formalized_novelty_constructors_v1.json'
      - 'hhs_runtime/hhs_pass220_i079_openai_math_theorem_constructors_v1.py'
      - 'tests/pass220/test_hhs_pass220_i079_openai_math_theorem_constructors_v1.py'
      - 'contracts/pass220/PASS_220_I079_OPENAI_MATH_THEOREM_CONSTRUCTORS_V1.json'
      - 'docs/whitepapers/HHS_PASS_220_I079_OPENAI_MATH_THEOREM_CONSTRUCTORS_V1.md'
      - '.github/workflows/pass220-i079-openai-math-theorem-constructors.yml'
  pull_request:
    paths:
      - 'data/pass220/openai_math_formalized_novelty_constructors_v1.json'
      - 'hhs_runtime/hhs_pass220_i079_openai_math_theorem_constructors_v1.py'
      - 'tests/pass220/test_hhs_pass220_i079_openai_math_theorem_constructors_v1.py'
      - 'contracts/pass220/PASS_220_I079_OPENAI_MATH_THEOREM_CONSTRUCTORS_V1.json'
      - 'docs/whitepapers/HHS_PASS_220_I079_OPENAI_MATH_THEOREM_CONSTRUCTORS_V1.md'

jobs:
  i079:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile             hhs_runtime/hhs_pass220_i079_openai_math_theorem_constructors_v1.py             tests/pass220/test_hhs_pass220_i079_openai_math_theorem_constructors_v1.py
      - name: Run dependency-scoped constructor tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q --tb=short             tests/pass220/test_hhs_pass220_i079_openai_math_theorem_constructors_v1.py
      - name: Emit registry receipt
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from hhs_runtime.hhs_pass220_i079_openai_math_theorem_constructors_v1 import build_registry_receipt
          print(json.dumps(build_registry_receipt(), sort_keys=True))
          PY
