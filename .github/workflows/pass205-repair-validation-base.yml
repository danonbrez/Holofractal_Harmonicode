name: Pass 205 Repair Validation Base

on:
  pull_request:
    paths:
      - 'hhs_runtime/c/hhs_pass205_continuation.h'
      - 'hhs_runtime/c/hhs_pass205_continuation.c'
      - 'hhs_runtime/src/hhs_hash216.c'
      - 'hhs_python/runtime/hhs_pass205_continuation_bridge.py'
      - 'hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py'
      - 'hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py'
      - 'hhs_backend/api/pass205_continuation_routes.py'
      - 'deployment/digitalocean/warm_boot_manifest.py'
      - 'deploy/digitalocean/hhs-pass196-integrated-environment.service'
      - 'bin/post_compile'
      - 'tests/test_hhs_pass205_continuation_runtime_v1.py'
      - 'tests/pass220/test_pass220_i046_warm_hydrated_vm_boot.py'
      - '.github/workflows/pass205-repair-validation-base.yml'
  push:
    branches: [main]
    paths:
      - 'hhs_runtime/c/hhs_pass205_continuation.h'
      - 'hhs_runtime/c/hhs_pass205_continuation.c'
      - 'hhs_runtime/src/hhs_hash216.c'
      - 'hhs_python/runtime/hhs_pass205_continuation_bridge.py'
      - 'hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py'
      - 'hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py'
      - 'hhs_backend/api/pass205_continuation_routes.py'
      - 'deployment/digitalocean/warm_boot_manifest.py'
      - 'deploy/digitalocean/hhs-pass196-integrated-environment.service'
      - 'bin/post_compile'
      - 'tests/test_hhs_pass205_continuation_runtime_v1.py'
      - 'tests/pass220/test_pass220_i046_warm_hydrated_vm_boot.py'
      - '.github/workflows/pass205-repair-validation-base.yml'
  workflow_dispatch:

concurrency:
  group: pass205-repair-validation-base-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONFAULTHANDLER: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  validate-pass205-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HHS_PASS205_DB: /tmp/pass205-repair.sqlite3
    steps:
      - name: Checkout exact merge tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate current compatibility surfaces
        run: |
          bash -n bin/post_compile
          python -m py_compile \
            hhs_python/runtime/hhs_pass205_continuation_bridge.py \
            hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py \
            hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py \
            hhs_backend/api/pass205_continuation_routes.py \
            deployment/digitalocean/warm_boot_manifest.py \
            tests/test_hhs_pass205_continuation_runtime_v1.py \
            tests/pass220/test_pass220_i046_warm_hydrated_vm_boot.py

      - name: Build current native authorities
        run: |
          make c-abi
          python - <<'PY'
          from hhs_python.runtime.hhs_pass205_continuation_bridge import build_native_library
          print(build_native_library(force=True))
          PY
          test -s hhs_runtime/builds/libhhs_pass205_continuation.so

      - name: Replay Pass 205 exact continuation compatibility
        run: python -m pytest -q tests/test_hhs_pass205_continuation_runtime_v1.py

      - name: Replay current warm-boot state binding
        run: python -m pytest -q tests/pass220/test_pass220_i046_warm_hydrated_vm_boot.py

      - name: Verify integrated continuation egress
        run: |
          python - <<'PY'
          from hhs_backend.api import pass205_continuation_routes as routes
          from hhs_backend.runtime.hhs_pass205_continuation_runtime_v1 import Pass205ContinuationRuntime

          assert isinstance(routes.PASS205_CONTINUATION_RUNTIME, Pass205ContinuationRuntime)
          paths = {str(getattr(route, 'path', '')) for route in routes.router.routes}
          required = {
              '/api/runtime/continuation/status',
              '/api/runtime/continuation/retrieve',
              '/api/runtime/continuation/hydrate',
              '/api/runtime/continuation/advance',
              '/api/runtime/continuation/replay',
              '/api/runtime/continuation/verify',
          }
          assert required <= paths
          status = routes.PASS205_CONTINUATION_RUNTIME.status()
          assert status['state_bits'] == 5184
          assert status['single_vm81_mutation_authority']
          assert status['single_ordered_hash72_commit_stream']
          assert status['cache_hit_bypasses_admission'] is False
          PY

      - name: Preserve inherited federation and guarded deployment
        run: |
          python -m unittest -v tests.test_hhs_pass201_public_api_federation_v1
          python -m pytest -q tests/test_hhs_guarded_auto_update_contract_v1.py
