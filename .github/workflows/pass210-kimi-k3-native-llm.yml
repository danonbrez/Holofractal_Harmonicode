name: Pass 210 Kimi K3 Native LLM

on:
  pull_request:
    paths:
      - "contracts/pass210/**"
      - "hhs_backend/runtime/hhs_kimi_k3_agentic_assistant_v1.py"
      - "hhs_backend/runtime/hhs_capability_provider_registry_v1.py"
      - "hhs_backend/runtime/hhs_pass210_native_agi_optimizer_v1.py"
      - "hhs_backend/runtime/hhs_pass210_production_assistant_v1.py"
      - "hhs_backend/api/pass210_llm_orchestrator_routes.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "hhs_backend/production_server.py"
      - "scripts/pass210_native_agi_optimizer_worker.py"
      - "deployment/digitalocean/llm/**"
      - "tests/test_hhs_pass210_*"
      - "tests/test_hhs_production_public_app_v1.py"
      - ".github/workflows/pass210-kimi-k3-native-llm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-production-route-closure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass210-kimi-k3-native-llm
          fetch-depth: 0

      - name: Stabilize authoritative routers before API fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("hhs_backend/production_server.py")
          text = path.read_text(encoding="utf-8")
          marker = '@app.api_route(\n    "/api/{unmatched_path:path}",'
          if "HHS_PASS_210_PRODUCTION_ROUTE_CLOSURE_V1" not in text:
              insertion = '''

# Pass 210 final route closure. The canonical bootstrap may import this overlay
# while the shared FastAPI app is still being composed. Re-append only route
# identities that are absent after every inherited root/static filter, then
# close startup if the production API or WebSocket surface is incomplete.
HHS_PASS_210_PRODUCTION_ROUTE_CLOSURE_V1 = True


def _route_identity(route: Any) -> tuple[str, str, tuple[str, ...]]:
    return (
        route.__class__.__name__,
        str(getattr(route, "path", "")),
        tuple(sorted(str(method) for method in (getattr(route, "methods", None) or ()))),
    )


def _append_missing_router_routes(router: Any) -> int:
    existing = {_route_identity(route) for route in app.router.routes}
    appended = 0
    for route in router.routes:
        identity = _route_identity(route)
        if identity in existing:
            continue
        app.router.routes.append(route)
        existing.add(identity)
        appended += 1
    return appended


PRODUCTION_ROUTE_CLOSURE_APPENDED = {
    "canonical_runtime": _append_missing_router_routes(canonical.runtime_router),
    "canonical_websocket": _append_missing_router_routes(canonical.runtime_ws_router),
    "assistant": _append_missing_router_routes(assistant_router),
    "pass210_orchestrator": _append_missing_router_routes(pass210_llm_router),
    "word2vec": _append_missing_router_routes(word2vec_router),
    "installation": _append_missing_router_routes(installation_router),
    "multimodal_ingress": _append_missing_router_routes(pass165_router),
    "development_lifecycle": _append_missing_router_routes(development_lifecycle_router),
}

PRODUCTION_REQUIRED_ROUTE_CLOSURE = {
    "/api/assistant/chat",
    "/api/assistant/health",
    "/api/runtime/llm-orchestrator/status",
    "/api/runtime/llm-orchestrator/optimizer/status",
    "/api/runtime/installation/status",
    "/api/runtime/services",
    "/api/runtime/services/dispatch",
    "/v1/modalities/language/models/word2vec/status",
    "/ws/runtime",
}
PRODUCTION_ROUTE_CLOSURE_PATHS = {
    str(getattr(route, "path", "")) for route in app.router.routes
}
PRODUCTION_ROUTE_CLOSURE_MISSING = sorted(
    PRODUCTION_REQUIRED_ROUTE_CLOSURE - PRODUCTION_ROUTE_CLOSURE_PATHS
)
if PRODUCTION_ROUTE_CLOSURE_MISSING:
    raise RuntimeError(
        "Pass 210 production route closure failed: "
        + ", ".join(PRODUCTION_ROUTE_CLOSURE_MISSING)
    )
'''
              if marker not in text:
                  raise SystemExit("production API fallback marker not found")
              text = text.replace(marker, insertion + "\n\n" + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile hhs_backend/production_server.py
          git config user.name hhs-pass210-route-closure
          git config user.email hhs-pass210-route-closure@users.noreply.github.com
          if git diff --quiet -- hhs_backend/production_server.py; then
            echo "Pass 210 production route closure already present"
            exit 0
          fi
          git add hhs_backend/production_server.py
          git commit -m "Close Pass 210 production router composition"
          git push origin HEAD:agent/pass210-kimi-k3-native-llm

  contract-runtime-and-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HHS_PASS210_OPTIMIZER_DB: /tmp/hhs-pass210-ci/native_agi_optimizer.sqlite3
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
      HHS_KIMI_K3_ENABLED: "0"
      HHS_LITERT_LM_BACKEND: cpu
      HHS_LITERT_LM_MODEL: gemma-4-E2B-it
      HHS_LITERT_LM_BASE_URL: http://127.0.0.1:9379/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest pytest-asyncio fastapi pydantic uvicorn cryptography

      - name: Parse Pass 210 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("contracts/pass210/PASS_210_CONTRACT.json").read_text())
          assert value["pass"] == 210
          assert value["provider_hierarchy"][0]["model_id"] == "kimi-k3"
          assert value["provider_hierarchy"][1]["model_id"] == "gemma-4-E2B-it"
          assert value["native_backend_agent"]["user_facing_fallback"] is False
          PY

      - name: Shell syntax
        run: |
          bash -n \
            deployment/digitalocean/llm/install.sh \
            deployment/digitalocean/llm/hhs-llm-preflight.sh \
            deployment/digitalocean/llm/post-merge.sh

      - name: Python compilation
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_kimi_k3_agentic_assistant_v1.py \
            hhs_backend/runtime/hhs_capability_provider_registry_v1.py \
            hhs_backend/runtime/hhs_pass210_native_agi_optimizer_v1.py \
            hhs_backend/runtime/hhs_pass210_production_assistant_v1.py \
            hhs_backend/api/pass210_llm_orchestrator_routes.py \
            hhs_backend/api/litert_lm_assistant_routes.py \
            hhs_backend/production_server.py \
            scripts/pass210_native_agi_optimizer_worker.py \
            tests/test_hhs_pass210_llm_orchestrator_v1.py \
            tests/test_hhs_pass210_digitalocean_llm_deployment_v1.py \
            tests/test_hhs_production_public_app_v1.py

      - name: Pass 210 and inherited assistant tests
        run: |
          python -m pytest -q \
            tests/test_hhs_pass210_llm_orchestrator_v1.py \
            tests/test_hhs_pass210_digitalocean_llm_deployment_v1.py \
            tests/test_hhs_litert_lm_assistant_v1.py \
            tests/test_hhs_litert_lm_hhs_api_tools_v1.py

      - name: Fresh production public app tests
        run: python -m pytest -q tests/test_hhs_production_public_app_v1.py

      - name: Public route composition
        run: |
          python - <<'PY'
          from hhs_backend.application_ide_server import app
          paths = {str(getattr(route, "path", "")) for route in app.router.routes}
          required = {
              "/api/assistant/status",
              "/api/assistant/health",
              "/api/assistant/chat",
              "/api/runtime/llm-orchestrator/status",
              "/api/runtime/llm-orchestrator/optimizer/status",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"missing Pass 210 routes: {missing}")
          PY
