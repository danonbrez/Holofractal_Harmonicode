name: Pass 220 Recursive HNAN Hash216 Tree Candidate
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_recursive_hnan_hash216_tree_candidate_v1.py"
      - "tests/pass220/test_pass220_recursive_hnan_hash216_tree_candidate_v1.py"
      - ".github/workflows/pass220-recursive-hnan-hash216-tree-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recursive-hnan-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Validate recursive local HNAN execution and ordered Hash216 tree
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_recursive_hnan_hash216_tree_candidate_v1.py
