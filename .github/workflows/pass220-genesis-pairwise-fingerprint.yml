name: Pass220 Genesis Pairwise Fingerprint
on:
  push:
    paths:
      - 'hhs_runtime/hhs_pass220_genesis_pairwise_fingerprint_v1.py'
      - 'tests/pass220/test_hhs_pass220_genesis_pairwise_fingerprint_v1.py'
      - '.github/workflows/pass220-genesis-pairwise-fingerprint.yml'
  pull_request:
    paths:
      - 'hhs_runtime/hhs_pass220_genesis_pairwise_fingerprint_v1.py'
      - 'tests/pass220/test_hhs_pass220_genesis_pairwise_fingerprint_v1.py'
      - '.github/workflows/pass220-genesis-pairwise-fingerprint.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=. python -m unittest tests/pass220/test_hhs_pass220_genesis_pairwise_fingerprint_v1.py
