name: Pass 174 dependency-scoped validation

on:
  push:
    branches:
      - main
      - agent/pass174-full-implementation
    paths:
      - 'hhs_runtime/pass174/**'
      - 'hhs_backend/api/pass174_*'
      - 'hhs_backend/pass174_server.py'
      - 'applications/pass174_visual_ide/**'
      - 'deployment/pass174/**'
      - 'tests/test_hhs_pass174_*'
      - 'hhs_verification/pass174/**'
      - 'contracts/authority/PASS_174_PLUS_LEGACY_FOUNDATION_POLICY.json'
      - 'schemas/pass174/**'
      - 'Procfile'
      - '.github/workflows/pass174-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/pass174/**'
      - 'hhs_backend/api/pass174_*'
      - 'hhs_backend/pass174_server.py'
      - 'applications/pass174_visual_ide/**'
      - 'deployment/pass174/**'
      - 'tests/test_hhs_pass174_*'
      - 'hhs_verification/pass174/**'
      - 'contracts/authority/PASS_174_PLUS_LEGACY_FOUNDATION_POLICY.json'
      - 'schemas/pass174/**'
      - 'Procfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass174:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HHS_REPOSITORY_ROOT: ${{ github.workspace }}
      HHS_PASS174_STATE_DIR: ${{ runner.temp }}/hhs-pass174-state
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: '0'
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: '5'
      HHS_PASS174_BOOT_TIMEOUT_SECONDS: '20'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile affected Python surfaces
        run: |
          python -m py_compile \
            hhs_runtime/pass174/inheritance.py \
            hhs_runtime/pass174/runtime.py \
            hhs_runtime/pass174/storage.py \
            hhs_runtime/pass174/cli.py \
            hhs_backend/api/pass174_runtime_routes.py \
            hhs_backend/api/pass174_ws_routes.py \
            hhs_backend/pass174_server.py \
            hhs_verification/pass174/verify.py

      - name: Validate Visual IDE JavaScript
        run: node --check applications/pass174_visual_ide/app.js

      - name: Run dependency-scoped runtime tests
        run: |
          python -m pytest -q \
            tests/test_hhs_pass163_vmrc_v1.py \
            tests/test_hhs_pass174_runtime_v1.py \
            tests/test_hhs_pass174_persistence_v1.py

      - name: Execute Pass 174 verification harness
        run: |
          python -m hhs_verification.pass174.verify \
            --repository-root . \
            --output evidence/pass174/PASS_174_DEPENDENCY_SCOPED_VERIFICATION.json

      - name: Exercise CLI parity
        run: |
          python -m hhs_runtime.pass174.cli \
            --repository-root . \
            --state-dir "$RUNNER_TEMP/hhs-pass174-cli" \
            status > evidence/pass174/PASS_174_CLI_STATUS.json

      - name: Start production server and verify public surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn hhs_backend.pass174_server:app \
            --host 127.0.0.1 --port 8765 --workers 1 --log-level info \
            > evidence/pass174/PASS_174_SERVER.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/v1/pass174/deployment/status \
              > evidence/pass174/PASS_174_DEPLOYMENT_STATUS.json; then
              if python - <<'PY'
import json
from pathlib import Path
status = json.loads(Path('evidence/pass174/PASS_174_DEPLOYMENT_STATUS.json').read_text())
raise SystemExit(0 if status.get('ready') and not status.get('silent_freeze') else 1)
PY
              then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat evidence/pass174/PASS_174_SERVER.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/api/v1/pass174/status \
            > evidence/pass174/PASS_174_HTTP_STATUS.json
          curl -fsS http://127.0.0.1:8765/api/v1/pass174/frame \
            > evidence/pass174/PASS_174_HTTP_FRAME.json
          curl -fsS -X POST http://127.0.0.1:8765/api/v1/pass174/execute \
            -H 'Content-Type: application/json' \
            -d '{"thread":0,"writes":{"0":1,"8":1,"72":1},"prefer_retrieval":true}' \
            > evidence/pass174/PASS_174_HTTP_EXECUTE.json
          curl -fsS http://127.0.0.1:8765/ > evidence/pass174/PASS_174_VISUAL_IDE.html
          grep -q 'Pass 174 Harmonic Visual SDLC Runtime' evidence/pass174/PASS_174_VISUAL_IDE.html
          curl -fsS http://127.0.0.1:8765/legacy-ide/ > evidence/pass174/PASS_174_LEGACY_IDE.html
          python - <<'PY'
import asyncio, json
from pathlib import Path
import websockets
async def main():
    async with websockets.connect('ws://127.0.0.1:8765/api/v1/pass174/ws/events') as websocket:
        first = json.loads(await asyncio.wait_for(websocket.recv(), timeout=5))
        assert first['classification'] == 'HHS_PASS_174_LIVE_PROJECTION'
        Path('evidence/pass174/PASS_174_WEBSOCKET_EVENT.json').write_text(json.dumps(first, indent=2, sort_keys=True))
asyncio.run(main())
PY

      - name: Upload Pass 174 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass174-validation-evidence
          path: |
            evidence/pass174/PASS_174_*.json
            evidence/pass174/PASS_174_*.log
            evidence/pass174/PASS_174_*.html
          if-no-files-found: warn
          retention-days: 30
