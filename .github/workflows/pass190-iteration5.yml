name: Pass 190 Iteration 5 Atomic Kernel Authority

on:
  push:
    paths:
      - "HHS_PASS_190_ITERATION_5_ATOMIC_KERNEL_AUTHORITY_CORRECTNESS.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - "hhs_gui/runtime_apps/pass190/**"
      - ".github/workflows/pass190-iteration5.yml"
  pull_request:
    paths:
      - "HHS_PASS_190_ITERATION_5_ATOMIC_KERNEL_AUTHORITY_CORRECTNESS.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - "hhs_gui/runtime_apps/pass190/**"
      - ".github/workflows/pass190-iteration5.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pass 190 Iteration 5
        working-directory: native_projects/hhs_pass190_operation_fabric
        run: make validate
