name: Pass 219 Lane 5 Nine-Loop Source Attestation 1.68

on:
  pull_request:
    branches: [main, agent/pass219-lane5-nine-loop-equivalence-1-67-20260927]
    paths:
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_SOURCE_ATTESTATION_1_68.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_SOURCE_ATTESTATION_1_68.md'
      - 'hhs_runtime/pass219/lane5_nine_loop_source_attestation_1_68.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_source_attestation_1_68.py'
      - '.github/workflows/pass219-lane5-nine-loop-source-attestation-1-68.yml'
  push:
    branches:
      - agent/pass219-lane5-nine-loop-source-attestation-1-68-20260927
    paths:
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_SOURCE_ATTESTATION_1_68.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_SOURCE_ATTESTATION_1_68.md'
      - 'hhs_runtime/pass219/lane5_nine_loop_source_attestation_1_68.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_source_attestation_1_68.py'
      - '.github/workflows/pass219-lane5-nine-loop-source-attestation-1-68.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-attestation-1-68:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped test dependency
        run: python -m pip install pytest

      - name: Run bounded source-attestation tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q             tests/pass219/test_pass219_lane5_nine_loop_source_attestation_1_68.py             tests/pass219/test_pass219_lane5_nine_loop_foreign_equivalence_1_67.py

      - name: Download public Cosmic9 checksum manifest and sample corpus
        run: |
          mkdir -p /tmp/cosmic9
          curl --fail --location --silent --show-error             https://smsharma.io/cosmic-nine-loops/MANIFEST.sha256             -o /tmp/cosmic9/MANIFEST.sha256
          curl --fail --location --silent --show-error             https://smsharma.io/cosmic-nine-loops/samples/E9_sample_coefficients.txt             -o /tmp/cosmic9/E9_sample_coefficients.txt
          test -s /tmp/cosmic9/MANIFEST.sha256
          test -s /tmp/cosmic9/E9_sample_coefficients.txt

      - name: Verify full 20,630-row source-attested sample
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from pathlib import Path

          from hhs_runtime.pass219.lane5_nine_loop_source_attestation_1_68 import attest_sample

          manifest = Path("/tmp/cosmic9/MANIFEST.sha256").read_text(encoding="utf-8")
          raw = Path("/tmp/cosmic9/E9_sample_coefficients.txt").read_bytes()
          receipt = attest_sample(raw, manifest_text=manifest, require_full_contract=True)

          assert receipt["manifest_member_verified"] is True
          assert receipt["nonzero_rows"] == 20400
          assert receipt["zero_rows"] == 230
          assert receipt["total_rows"] == 20630
          assert receipt["all_nonzero_rationals_exact"] is True
          assert receipt["all_zero_rows_exact"] is True
          assert receipt["floating_point_authority"] is False
          assert receipt["candidate_only"] is True
          assert receipt["manifest_sha256"] == "f96534526482f03e638ee030b1a88968348901f70967bb89618c76420a21ffe5"
          assert receipt["raw_sha256"] == "a78557e58efb3e12cccb647974131a3f694322bebb97607a5648db0484099b18"
          assert receipt["summary_sha256"] == "fbda1f90205bcf4f02b154aba25346aa83768e6cbbccbeeceaef9187eb691088"

          print("PASS219_1_68_RECEIPT=" + json.dumps(receipt, sort_keys=True))
          with open("/tmp/cosmic9/receipt.json", "w", encoding="utf-8") as f:
              json.dump(receipt, f, indent=2, sort_keys=True)
              f.write("\n")
          PY

      - name: Emit immutable digest observation
        run: |
          echo "MANIFEST_SHA256=$(sha256sum /tmp/cosmic9/MANIFEST.sha256 | awk '{print $1}')"
          echo "SAMPLE_SHA256=$(sha256sum /tmp/cosmic9/E9_sample_coefficients.txt | awk '{print $1}')"

      - name: Build shared exact VM81 runtime with 1.68 source cell wall
        run: make -f GNUmakefile c-kernel

      - name: Compile native 1.68 conformance
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_nine_loop_source_cell_wall_1_68.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -pthread \
            -o /tmp/test_pass219_lane5_nine_loop_source_1_68

      - name: Run native 1.68 conformance
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: /tmp/test_pass219_lane5_nine_loop_source_1_68
