name: Build HHS Canonical Visual Runtime OS

on:
  push:
    branches: [main]
    paths:
      - "hhs_gui/**"
      - "hhs_backend/server.py"
      - "hhs_backend/production_server.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "hhs_backend/api/pass166_word2vec_routes.py"
      - "hhs_backend/runtime/hhs_production_assistant_v1.py"
      - "hhs_backend/runtime/hhs_native_litert_lm_provider_v1.py"
      - "hhs_backend/runtime/hhs_litert_lm_hhs_api_assistant_v1.py"
      - "hhs_backend/runtime/live_fastapi_workflow_v1.py"
      - "tests/test_hhs_production_public_app_v1.py"
      - "Procfile"
      - "bin/post_compile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
      - "!hhs_gui/dist/**"
  pull_request:
    branches: [main]
    paths:
      - "hhs_gui/**"
      - "hhs_backend/server.py"
      - "hhs_backend/production_server.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "hhs_backend/api/pass166_word2vec_routes.py"
      - "hhs_backend/runtime/hhs_production_assistant_v1.py"
      - "hhs_backend/runtime/hhs_native_litert_lm_provider_v1.py"
      - "hhs_backend/runtime/hhs_litert_lm_hhs_api_assistant_v1.py"
      - "hhs_backend/runtime/live_fastapi_workflow_v1.py"
      - "tests/test_hhs_production_public_app_v1.py"
      - "Procfile"
      - "bin/post_compile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
      - "!hhs_gui/dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hhs-canonical-runtime-os-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-os:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-scoped backend test requirements
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'cryptography>=46.0,<47.0' \
            pytest

      - name: Build native Hash72 runtime and assistant authority
        env:
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "5"
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Validate canonical backend composition
        env:
          HHS_DISABLE_C_AUTOBUILD: "1"
          HHS_LITERT_LM_BACKEND: auto
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "5"
        run: |
          timeout 300s pytest -q tests/test_hhs_production_public_app_v1.py
          timeout 180s python - <<'PY'
          from hhs_backend.production_server import app, _workspace_session_snapshot
          from hhs_backend.server import server_self_test

          paths = {str(getattr(route, "path", "")) for route in app.router.routes}
          required = {
              "/api/product/health",
              "/api/runtime/authority/status",
              "/api/runtime/gui/command",
              "/api/runtime/workspace/session",
              "/api/runtime/workspace/command",
              "/api/runtime/capability/resolve",
              "/api/runtime/document/perceive",
              "/api/assistant/health",
              "/api/assistant/chat",
              "/v1/modalities/language/models/word2vec/status",
              "/ws/runtime",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"missing canonical production routes: {missing}")
          if "" not in paths and "/" not in paths:
              raise SystemExit("missing canonical public root static mount")
          session = _workspace_session_snapshot()
          if session.get("self_tests_executed") is not False:
              raise SystemExit("workspace session executed production self-tests")
          server_self_test()
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hhs_gui/package.json

      - name: Install frontend dependencies
        working-directory: hhs_gui
        run: timeout 600s npm install --no-audit --no-fund

      - name: Validate canonical IDE source contracts
        working-directory: hhs_gui
        run: |
          timeout 180s npm run test:e2e:source
          timeout 180s npm run test:workspace:source

      - name: Build deployable canonical Runtime OS bundle
        working-directory: hhs_gui
        run: timeout 600s npm run build

      - name: Verify canonical deployable entrypoint
        run: |
          test -s hhs_gui/dist/index.html
          test -d hhs_gui/dist/assets
          grep -q "HHS Visual Runtime OS Workspace" hhs_gui/dist/index.html
          grep -q "frontend_boot_timeout" hhs_gui/dist/index.html
          grep -R -q "hhs-canonical-runtime-ide" hhs_gui/dist/assets
          grep -R -q "hhs-product-workspace" hhs_gui/dist/assets
          grep -R -q "registry-visual-programmer" hhs_gui/dist/assets
          grep -R -q "hhs-visual-runtime-os-workspace" hhs_gui/dist/assets
          grep -R -q "runtime-assistant-panel" hhs_gui/dist/assets
          grep -R -q "Source → artifact → emulator" hhs_gui/dist/assets
          grep -R -q "Only operations that actually returned from the backend appear here" hhs_gui/dist/assets
          grep -R -q "/api/product/health" hhs_gui/dist/assets
          grep -R -q "/api/runtime/authority/status" hhs_gui/dist/assets
          grep -R -q "RUNTIME AUTHORITY ONLINE" hhs_gui/dist/assets
          grep -R -q "/api/runtime/services/dispatch" hhs_gui/dist/assets
          grep -R -q "HHS_REGISTRY_VISUAL_PROGRAM_V1" hhs_gui/dist/assets
          if grep -R -q "Production visual IDE · callable surfaces only" hhs_gui/dist/assets; then
            echo "Replacement ProductionApp leaked into canonical bundle"
            exit 1
          fi
          if grep -R -q "runtime_application_missing" hhs_gui/dist/assets; then
            echo "Missing-module placeholder leaked into canonical bundle"
            exit 1
          fi
          for forbidden in RuntimeProjectTree MultimodalIngressPanel LiveBackendCapabilityPanel HHSSymbolicEditor InterpreterConsole CompilerWorkbench EmulatorControlPanel RuntimeGraphCanvas SemanticMemoryPanel ReceiptLedgerInspector MutationHistoryPanel RuntimeCommandPanel RuntimeMutationPanel; do
            if grep -R -q "$forbidden" hhs_gui/dist/assets; then
              echo "Isolated public panel leaked into integrated bundle: $forbidden"
              exit 1
            fi
          done

      - name: Upload canonical Runtime OS bundle
        uses: actions/upload-artifact@v4
        with:
          name: hhs-canonical-runtime-os-dist
          path: hhs_gui/dist
          if-no-files-found: error
          retention-days: 14

      - name: Publish generated bundle to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/hhs-canonical-runtime-os-dist"
          rm -rf "$PUBLISH_DIR"
          cp -a hhs_gui/dist "$PUBLISH_DIR"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B hhs-canonical-dist-publish origin/main
            rm -rf hhs_gui/dist
            mkdir -p hhs_gui
            cp -a "$PUBLISH_DIR" hhs_gui/dist
            git add -f hhs_gui/dist

            if git diff --cached --quiet; then
              echo "Canonical Runtime OS bundle is unchanged"
              exit 0
            fi

            git commit -m "build: publish integrated HHS Runtime OS bundle [skip ci]"
            if timeout 120s git push origin HEAD:main; then
              exit 0
            fi
            echo "Publish attempt $attempt raced with main; retrying from the latest branch tip"
          done

          echo "Canonical Runtime OS bundle publication failed after three bounded attempts"
          exit 1
