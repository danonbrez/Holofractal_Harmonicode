name: Pass 219 I149 Pass 177 Workflow Authority Reconciliation

on:
  push:
    branches:
      - agent/pass219-iteration149-pass177-workflow-authority-reconciliation
    paths:
      - 'hhs_runtime/pass177/**'
      - 'hhs_backend/api/pass177_template_workflow_routes.py'
      - 'hhs_backend/visual_server.py'
      - 'applications/holofractal_harmonizer/src/pass177/**'
      - 'applications/holofractal_harmonizer/tests/pass177-module-workflow.test.mjs'
      - 'tests/test_hhs_pass177_authority.py'
      - 'contracts/pass177/PASS_177_I149_AUTHORITY_RECONCILIATION.json'
      - '.github/workflows/pass219-i149-pass177-workflow-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i149-pass177-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass177-i149:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: '0'
      HHS_COGNITION_AUTO_TICK: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped Python packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install pytest 'cryptography>=46.0,<47.0' 'fastapi>=0.128,<1.0' 'pydantic>=2.7,<3.0'

      - name: Build inherited exact runtime shared library
        run: |
          set -euo pipefail
          timeout 600s make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Verify historical Pass 177 lineage and actual surfaces
        run: |
          git merge-base --is-ancestor 2aeb16e736829ec9fe64b2a0d9779bbfa147f4ec HEAD
          test -s applications/holofractal_harmonizer/src/pass177/module-library.mjs
          test -s applications/holofractal_harmonizer/src/pass177/project-factory.mjs
          test -s applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs
          test -s applications/holofractal_harmonizer/src/pass177/hash216-browser.mjs
          test -s applications/holofractal_harmonizer/tests/pass177-module-workflow.test.mjs

      - name: Compile backend authority surfaces
        run: |
          python -m py_compile             hhs_runtime/pass177/runtime.py             hhs_backend/api/pass177_template_workflow_routes.py

      - name: Run Pass 177 backend VM81 authority tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q tests/test_hhs_pass177_authority.py

      - name: Run historical Pass 177 browser workflow acceptance
        run: |
          node --test applications/holofractal_harmonizer/tests/pass177-module-workflow.test.mjs

      - name: Assert historical stage truth and browser nonauthority
        run: |
          grep -F "status: 'source-validated'" applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs
          grep -F "mode: 'source-preserving'" applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs
          grep -F "independentOfCompilation: true" applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs
          grep -F 'browserProjectionOnly: true' applications/holofractal_harmonizer/src/pass177/project-factory.mjs
          grep -F "checkpointAuthority: 'MEMORY_CANDIDATE_ONLY'" applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs
          grep -F 'P177_PROJECT_WORKFLOW_CANONICAL_MUTATION' hhs_runtime/pass177/runtime.py

      - name: Validate governed route and status surface
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          from hhs_backend.api.pass177_template_workflow_routes import router, status
          paths={route.path for route in router.routes}
          required={
              "/api/runtime/pass177-workflows/status",
              "/api/runtime/pass177-workflows/project/admit",
              "/api/runtime/pass177-workflows/project/{project_id}/checkpoint/admit",
          }
          assert required <= paths, sorted(required-paths)
          s=status()
          assert s["vm81_authority_bound"] is True
          assert s["independent_vm81_authority"] is False
          assert s["independent_hash72_commit_authority"] is False
          assert s["hash216_mutation_authority"] is False
          assert s["browser_hash216_is_candidate_identity_only"] is True
          assert s["terminal_pass177_completion"] is False
          assert s["repair_forward_required"] is True
          print({"classification":"HHS_PASS177_I149_AUTHORITY_SURFACE_VERIFIED","status":s})
          PY
          grep -F 'app.include_router(pass177_workflow_router)' hhs_backend/visual_server.py

      - name: Preserve cumulative Pass 219 policy gates
        run: |
          python tools/validate_pass219_global_canonical_defaults.py
          python tools/validate_pass219_multimodal_optimization_generalization.py
          python tools/hhs_multimodal_optimization_generalizer.py validate-all

      - name: Emit exact-head nonterminal reconciliation receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p evidence/pass177/i149
          PYTHONPATH="$PWD" python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from hhs_runtime.hash72_checkpoint import make_hash72_witness
          from hhs_runtime.pass177.runtime import PASS177_WORKFLOW_AUTHORITY

          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          payload={
              "schema":"PASS_219_I149_PASS177_WORKFLOW_AUTHORITY_RECEIPT_V1",
              "repository":"danonbrez/Holofractal_Harmonicode",
              "branch":"agent/pass219-iteration149-pass177-workflow-authority-reconciliation",
              "head_sha":head,
              "tree_sha":tree,
              "workflow_run_id":int(os.environ["RUN_ID"]),
              "workflow_run_attempt":int(os.environ["RUN_ATTEMPT"]),
              "classification":"HHS_PASS177_I149_HISTORICAL_WORKFLOW_AUTHORITY_RECONCILED_NONTERMINAL",
              "historical_merge":"2aeb16e736829ec9fe64b2a0d9779bbfa147f4ec",
              "status":PASS177_WORKFLOW_AUTHORITY.status(),
              "historical_truth":{
                  "browser_module_workflow_tests_green":True,
                  "test_stage":"SOURCE_VALIDATED_NOT_EXECUTED_TARGET_TEST",
                  "build_stage":"SOURCE_PRESERVING_NOT_TARGET_COMPILATION",
                  "source_zip":"INDEPENDENT_OF_COMPILATION",
              },
              "authority":{
                  "singleton_vm81_inherited":True,
                  "independent_vm81_authority":False,
                  "independent_hash72_commit_authority":False,
                  "hash216_mutation_authority":False,
                  "browser_identity_authoritative":False,
                  "memory_checkpoint_authoritative":False,
              },
              "closure":{
                  "pre_cumulative_validation_green":True,
                  "cumulative_pass177_binding_added":False,
                  "terminal_pass177_completion":False,
                  "repair_forward_required":True,
                  "merge_performed":False,
                  "authoritative_main_verification":False,
              },
          }
          receipt=make_hash72_witness("pass177:i149:authority",payload,width=72).digest
          lanes=[
              make_hash72_witness("pass177:i149:archive:previous",{"head":head,"receipt":receipt},width=72).digest,
              make_hash72_witness("pass177:i149:archive:change",{"tree":tree,"receipt":receipt},width=72).digest,
              make_hash72_witness("pass177:i149:archive:receipt",payload,width=72).digest,
          ]
          payload["receipt_hash72"]=receipt
          payload["archive_hash216"]="".join(lanes)
          Path("evidence/pass177/i149/PASS_219_I149_PASS177_WORKFLOW_AUTHORITY_RECEIPT.json").write_text(json.dumps(payload,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"classification":payload["classification"],"head":head,"receipt_hash72":receipt,"archive_hash216":payload["archive_hash216"]},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i149-pass177-workflow-authority
          path: evidence/pass177/i149/PASS_219_I149_PASS177_WORKFLOW_AUTHORITY_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
