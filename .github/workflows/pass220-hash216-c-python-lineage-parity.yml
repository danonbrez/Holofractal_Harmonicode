name: Pass 220 Hash216 C Python Lineage Parity
on:
  pull_request:
    paths:
      - "hhs_runtime/src/hhs_hash216.c"
      - "hhs_runtime/include/hhs_hash216_bytes.h"
      - "tests/pass220/test_pass220_hash216_c_python_lineage_parity_v1.py"
      - ".github/workflows/pass220-hash216-c-python-lineage-parity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hash216-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile C Hash216 and compare with inherited Python vector
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_hash216_c_python_lineage_parity_v1.py
