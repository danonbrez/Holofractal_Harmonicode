name: Pass 220 I077 Whitepaper Native Execution Binding
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_i077_whitepaper_executed_binding_v1.py"
      - "tests/pass220/test_pass220_i077_whitepaper_executed_binding_v1.py"
      - ".github/workflows/pass220-i077-whitepaper-executed-binding.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  i077-whitepaper-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Build inherited canonical exact runtime
        run: |
          make clean
          make c-abi
          test -f hhs_runtime/builds/libhhs_runtime.so
      - name: Execute both native VM81 symbols and bind frozen I077 whitepaper
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_i077_whitepaper_executed_binding_v1.py
