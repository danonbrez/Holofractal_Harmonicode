name: Pass 204 Open Cloud Mainframe

on:
  pull_request:
    paths:
      - 'HHS_PASS_204_UNIVERSAL_EXECUTABLE_DECLARATIONS_OPEN_CLOUD_COMPUTER.md'
      - 'hhs_backend/runtime/hhs_pass204_open_cloud_mainframe_v1.py'
      - 'hhs_backend/runtime/hhs_pass204_open_cloud_mainframe.py'
      - 'hhs_backend/runtime/hhs_pass204_sandbox_worker_v1.py'
      - 'hhs_backend/runtime/hhs_pass204_sandbox_worker.py'
      - 'hhs_backend/runtime/hhs_pass204_native_abi_executor_v1.py'
      - 'hhs_backend/api/pass204_open_cloud_routes.py'
      - 'hhs_backend/application_ide_server.py'
      - 'tests/test_hhs_pass204_open_cloud_mainframe_v1.py'
      - 'scripts/pass204_open_cloud_validation.py'
      - 'docs/pass204/**'
      - 'evidence/pass204/**'
      - '.github/workflows/pass204-open-cloud-mainframe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pass204-open-cloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install inherited runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Pass 204 Python surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass204_open_cloud_mainframe_v1.py \
            hhs_backend/runtime/hhs_pass204_open_cloud_mainframe.py \
            hhs_backend/runtime/hhs_pass204_sandbox_worker_v1.py \
            hhs_backend/runtime/hhs_pass204_sandbox_worker.py \
            hhs_backend/runtime/hhs_pass204_native_abi_executor_v1.py \
            hhs_backend/api/pass204_open_cloud_routes.py \
            tests/test_hhs_pass204_open_cloud_mainframe_v1.py \
            scripts/pass204_open_cloud_validation.py \
            hhs_backend/application_ide_server.py

      - name: Build canonical HHS C ABI
        run: make c-abi

      - name: Run Pass 204 unit tests
        env:
          HHS_PASS190_CAPABILITY_SECRET: pass204-ci-secret
        run: python -m pytest -q tests/test_hhs_pass204_open_cloud_mainframe_v1.py

      - name: Execute hosted Pass 204 production validation
        env:
          HHS_PASS190_CAPABILITY_SECRET: pass204-ci-secret
          PYTHONFAULTHANDLER: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          PYTHONPATH=. timeout --signal=ABRT --kill-after=30s 900s \
            python scripts/pass204_open_cloud_validation.py \
            --evidence evidence/pass204-ci/PASS204_OPEN_CLOUD_VALIDATION_RECEIPT.json

      - name: Run inherited Pass 203 mainframe unit tests
        env:
          HHS_PASS190_CAPABILITY_SECRET: pass204-ci-secret
        run: python -m pytest -q tests/test_hhs_pass203_hydrated_mainframe_v1.py

      - name: Run inherited Pass 203 hosted validation
        env:
          HHS_PASS190_CAPABILITY_SECRET: pass204-ci-secret
          HHS_PASS204_DISABLE_MAINFRAME_UPGRADE: '1'
          PYTHONFAULTHANDLER: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          PYTHONPATH=. timeout --signal=ABRT --kill-after=30s 600s \
            python scripts/pass203_hydrated_mainframe_validation.py \
            --evidence evidence/pass204-ci/PASS203_INHERITED_VALIDATION_RECEIPT.json

      - name: Run inherited Pass 201 federation tests
        run: python -m unittest -v tests.test_hhs_pass201_public_api_federation_v1

      - name: Run inherited Pass 202 guarded deployment tests
        run: python -m pytest -q tests/test_hhs_guarded_auto_update_contract_v1.py

      - name: Verify Pass 204 cumulative authority boundary
        run: |
          grep -Fq 'PASS_204_INHERITS_ALL_PRIOR_PASSES_AS_ONE_INTEGRATED_SYSTEM' hhs_backend/runtime/hhs_pass204_open_cloud_mainframe_v1.py
          grep -Fq 'remote_users_automatically_sandboxed' hhs_backend/runtime/hhs_pass204_open_cloud_mainframe_v1.py
          grep -Fq 'caller_adjustable_internal_policy' hhs_backend/runtime/hhs_pass204_open_cloud_mainframe_v1.py
          grep -Fq 'all_declarations_executable' hhs_backend/runtime/hhs_pass204_open_cloud_mainframe.py
          grep -Fq 'CLOUD_SERVER_HARDWARE_ENVIRONMENT' hhs_backend/runtime/hhs_pass204_open_cloud_mainframe.py
          grep -Fq 'history_rewrite_permitted' hhs_backend/runtime/hhs_pass204_open_cloud_mainframe.py
          grep -Fq 'CANONICAL_CTYPES_ABI_EXECUTED' hhs_backend/runtime/hhs_pass204_native_abi_executor_v1.py
          grep -Fq '/api/runtime/open-cloud/closure' HHS_PASS_204_UNIVERSAL_EXECUTABLE_DECLARATIONS_OPEN_CLOUD_COMPUTER.md
          grep -Fq 'valid_call_http_error' hhs_backend/api/pass204_open_cloud_routes.py
          grep -Fq 'capabilities_restored' hhs_backend/api/pass204_open_cloud_routes.py
          grep -Fq 'HHS_PASS204_DISABLE_MAINFRAME_UPGRADE' hhs_backend/api/pass204_open_cloud_routes.py

      - name: Upload Pass 204 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass204-open-cloud-mainframe
          path: evidence/pass204-ci/*.json
          if-no-files-found: error
          retention-days: 30
