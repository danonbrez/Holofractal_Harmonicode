name: Pass 219 I182 HARMONIC Geometry Circuit

on:
  push:
    branches:
      - main
      - agent/pass219-i182-harmonic-geometry-circuit
    paths:
      - 'contracts/pass219/PASS_219_HARMONIC_GEOMETRY_CIRCUIT_CONSTRAINT_ENFORCEMENT_COMPUTATIONAL_PHYSICS_1_0.md'
      - 'hhs_runtime/pass219/harmonic_geometry_circuit_i182.py'
      - 'tests/pass219/test_pass219_i182_harmonic_geometry_circuit.py'
      - 'contracts/pass219/PASS_219_I182_HARMONIC_GEOMETRY_CIRCUIT_1_0.json'
      - '.github/workflows/pass219-i182-harmonic-geometry-circuit.yml'
      - 'docs/operations/restart/PASS_219_I182_HARMONIC_GEOMETRY_CIRCUIT_RESTART.md'
  pull_request:
    paths:
      - 'contracts/pass219/PASS_219_HARMONIC_GEOMETRY_CIRCUIT_CONSTRAINT_ENFORCEMENT_COMPUTATIONAL_PHYSICS_1_0.md'
      - 'hhs_runtime/pass219/harmonic_geometry_circuit_i182.py'
      - 'tests/pass219/test_pass219_i182_harmonic_geometry_circuit.py'
      - 'contracts/pass219/PASS_219_I182_HARMONIC_GEOMETRY_CIRCUIT_1_0.json'
      - '.github/workflows/pass219-i182-harmonic-geometry-circuit.yml'
      - 'docs/operations/restart/PASS_219_I182_HARMONIC_GEOMETRY_CIRCUIT_RESTART.md'

permissions:
  contents: read

jobs:
  exact-geometry-constraint-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validate JSON contract
        run: python -m json.tool contracts/pass219/PASS_219_I182_HARMONIC_GEOMETRY_CIRCUIT_1_0.json >/dev/null

      - name: Compile exact geometry kernel
        run: python -m py_compile hhs_runtime/pass219/harmonic_geometry_circuit_i182.py

      - name: Enforce no-float and no-authoritative-vertex-table source boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('hhs_runtime/pass219/harmonic_geometry_circuit_i182.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)
          float_constants = [n.value for n in ast.walk(tree) if isinstance(n, ast.Constant) and isinstance(n.value, float)]
          float_calls = [
              n for n in ast.walk(tree)
              if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == 'float'
          ]
          forbidden_vertex_authority = ('VERTEX_TABLE =', 'DODECAHEDRON_VERTICES =', 'ICOSAHEDRON_VERTICES =')
          if float_constants or float_calls:
              raise SystemExit(f'canonical float authority detected: constants={float_constants} calls={len(float_calls)}')
          for token in forbidden_vertex_authority:
              if token in source:
                  raise SystemExit(f'authoritative final vertex table token detected: {token}')
          PY

      - name: Run dependency-scoped I182 tests
        run: pytest -q tests/pass219/test_pass219_i182_harmonic_geometry_circuit.py

      - name: Emit deterministic geometry witness artifact
        run: |
          mkdir -p evidence/pass219/i182
          python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass219.harmonic_geometry_circuit_i182 import build_geometry_constraint_receipt, verify_geometry_constraint_receipt

          receipt = build_geometry_constraint_receipt()
          assert verify_geometry_constraint_receipt(receipt)
          Path('evidence/pass219/i182/PASS_219_I182_HARMONIC_GEOMETRY_WITNESS.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload deterministic witness
        uses: actions/upload-artifact@v4
        with:
          name: pass219-i182-harmonic-geometry-witness
          path: evidence/pass219/i182/PASS_219_I182_HARMONIC_GEOMETRY_WITNESS.json
          if-no-files-found: error
