name: Pass 220 I012 Harmonic Lane5 Preflight

on:
  push:
    paths:
      - "hhs_backend/runtime/hhs_pass220_genesis_zero_sum_lane5_gate_v1.py"
      - "hhs_runtime/hhs_pass220_mobius_quarter_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_genesis_zero_sum_halt_v1.py"
      - "tests/pass220/test_hhs_pass220_mobius_quarter_phase_v1.py"
      - "docs/pass220/PASS_220_I012_HARMONIC_LANE5_PREFLIGHT_BINDING.md"
      - ".github/workflows/pass220-i012-harmonic-lane5-preflight.yml"
  pull_request:
    paths:
      - "hhs_backend/runtime/hhs_pass220_genesis_zero_sum_lane5_gate_v1.py"
      - "hhs_runtime/hhs_pass220_mobius_quarter_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_genesis_zero_sum_halt_v1.py"
      - "tests/pass220/test_hhs_pass220_mobius_quarter_phase_v1.py"
      - "docs/pass220/PASS_220_I012_HARMONIC_LANE5_PREFLIGHT_BINDING.md"
      - ".github/workflows/pass220-i012-harmonic-lane5-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run I011 and I012 exact dependency surface
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_mobius_quarter_phase_v1.py
          tests/pass220/test_hhs_pass220_genesis_zero_sum_halt_v1.py
