name: Production hardening validation

on:
  push:
    branches:
      - main
      - fix/production-hardening-2026-08-03
  pull_request:
    paths:
      - 'hhs_backend/api/pass196_integration_routes.py'
      - 'hhs_backend/runtime/hhs_pass196_*_v1.py'
      - 'applications/holofractal_harmonizer/src/pass196-integration.mjs'
      - 'deploy/digitalocean/tls/**'
      - 'tests/test_hhs_pass196_*_v1.py'
      - 'tests/test_hhs_digitalocean_tls_renewal_v1.py'
      - '.github/workflows/production-hardening.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile changed Python surfaces
        run: |
          python -m py_compile \
            hhs_backend/api/pass196_integration_routes.py \
            hhs_backend/runtime/hhs_pass196_scan_jobs_v1.py \
            hhs_backend/runtime/hhs_pass196_gap_partition_v1.py \
            tests/test_hhs_pass196_scan_jobs_v1.py \
            tests/test_hhs_pass196_gap_partition_v1.py \
            tests/test_hhs_digitalocean_tls_renewal_v1.py
      - name: Parse deployment shell
        run: |
          bash -n deploy/digitalocean/tls/hhs-tls-renew.sh
          bash -n deploy/digitalocean/tls/install.sh
      - name: Run dependency-scoped tests
        run: |
          python -m unittest -v \
            tests.test_hhs_pass196_scan_jobs_v1 \
            tests.test_hhs_pass196_gap_partition_v1 \
            tests.test_hhs_digitalocean_tls_renewal_v1 \
            tests.test_hhs_pass196_integrated_environment_v1
