name: Pass 219B I6 Existing Runtime Equation Conformance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tests/pass219/test_pass219b_global_zero_sum_closure_v1.py'
      - 'docs/operations/restart/PASS_219B_GLOBAL_ZERO_SUM_CLOSURE_I6_RESTART.md'
      - '.github/workflows/pass219b-global-zero-sum-closure-i6.yml'
      - 'hhs_runtime/pass219_native_universal_constraint_v1.py'
      - 'native_projects/hhs_pass191_dyadic_quartic_phase_lattice/**'
      - 'native_projects/hhs_pass189_hqlh_runtime/**'
      - 'hhs_runtime/pass175/**'
      - 'tests/pass219/test_pass219_monolithic_uqcel_residual_boundary_1_15.py'
      - 'tests/test_hhs_pass129_invariant_delta_rational_projection_algebra_v1.py'

permissions:
  contents: read

jobs:
  inherited-runtime-conformance:
    name: inherited-runtime-equation-conformance (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [exact, synthetic]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'exact' && github.event.pull_request.head.sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          fetch-depth: 0

      - name: Prove canonical I5 ancestry
        run: |
          git merge-base --is-ancestor f5d8fdc014d888f93c0d85d40d2a2c0c198eefdf HEAD

      - name: Enforce zero new runtime or kernel implementation
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- \
            hhs_runtime \
            native_projects/hhs_pass189_hqlh_runtime \
            native_projects/hhs_pass191_dyadic_quartic_phase_lattice

      - name: Enforce frozen UQCEL and monolithic boundary
        run: |
          git diff --exit-code "${{ github.event.pull_request.base.sha }}" HEAD -- \
            hhs_runtime/include/hhs_runtime_uqcel_1_8.h \
            hhs_runtime/c/hhs_runtime_uqcel_1_8_validate.inc \
            hhs_runtime/c/hhs_runtime_uqcel_1_8_receipt.inc \
            contracts/pass219/PASS_219_MONOLITHIC_UQCEL_RESIDUAL_BOUNDARY_1_15_0.tex \
            tests/pass219/test_pass219_monolithic_uqcel_residual_boundary_1_15.py

      - name: Install proof-test dependency
        run: |
          python -m pip install --disable-pip-version-check pytest

      - name: Prove Pass 219 source through inherited Pass 191 runtime evidence
        run: |
          python -m pytest -q \
            tests/pass219/test_pass219b_global_zero_sum_closure_v1.py

      - name: Preserve inherited Pass 219 monolithic boundary
        run: |
          python -m pytest -q \
            tests/pass219/test_pass219_monolithic_uqcel_residual_boundary_1_15.py

      - name: Preserve inherited Pass 129 exact algebra and replay
        run: |
          python -m pytest -q \
            tests/test_hhs_pass129_invariant_delta_rational_projection_algebra_v1.py
