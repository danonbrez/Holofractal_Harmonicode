name: Pass 220 Complex P Exact VM81 Carrier
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_complex_p_exact_raw5184_ingress_v1.py"
      - "tests/pass220/test_pass220_complex_p_exact_raw5184_ingress_v1.py"
      - ".github/workflows/pass220-complex-p-exact-vm81-carrier.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-carrier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --tb=short \
            tests/pass220/test_pass220_complex_p_exact_raw5184_ingress_v1.py \
            tests/pass220/test_pass220_complex_p_native_period_admission_v1.py \
            tests/pass220/test_hhs_pass220_hnan_lane5_i074_candidate_binding_v1.py
