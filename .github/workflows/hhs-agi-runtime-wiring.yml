name: HHS AGI Runtime Wiring

on:
  pull_request:
    paths:
      - "hhs_backend/runtime/runtime_replay_engine.py"
      - "hhs_backend/runtime/live_cognition_runtime_v1.py"
      - "hhs_backend/runtime/live_fastapi_workflow_v1.py"
      - "hhs_backend/api/cognition_routes.py"
      - "tests/test_hhs_live_cognition_runtime_v1.py"
      - "tests/test_hhs_cognition_routes_v1.py"
      - "tests/test_hhs_server_cognition_boot_v1.py"
      - ".github/workflows/hhs-agi-runtime-wiring.yml"
  push:
    branches:
      - main
    paths:
      - "hhs_backend/runtime/runtime_replay_engine.py"
      - "hhs_backend/runtime/live_cognition_runtime_v1.py"
      - "hhs_backend/runtime/live_fastapi_workflow_v1.py"
      - "hhs_backend/api/cognition_routes.py"
      - "tests/test_hhs_live_cognition_runtime_v1.py"
      - "tests/test_hhs_cognition_routes_v1.py"
      - "tests/test_hhs_server_cognition_boot_v1.py"
      - ".github/workflows/hhs-agi-runtime-wiring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-agi-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      HHS_LEDGER_FSYNC: "0"
      HHS_COGNITION_AUTO_TICK: "1"
      HHS_COGNITION_REPLAY_HORIZON: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build and verify native kernel
        run: make verify-c

      - name: Compile cognition surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/runtime_replay_engine.py \
            hhs_backend/runtime/live_cognition_runtime_v1.py \
            hhs_backend/runtime/live_fastapi_workflow_v1.py \
            hhs_backend/api/cognition_routes.py

      - name: Validate live replay engine
        run: python -m pytest -vv --tb=short tests/test_hhs_live_cognition_runtime_v1.py::test_replay_engine_accepts_live_packets_and_generates_prediction

      - name: Validate automatic cognition cascade
        run: python -m pytest -vv --tb=short tests/test_hhs_live_cognition_runtime_v1.py::test_live_cognition_processes_each_committed_state_once

      - name: Validate explicit agentic cognition cycle
        run: python -m pytest -vv --tb=short tests/test_hhs_live_cognition_runtime_v1.py::test_explicit_agentic_cognition_cycle_is_callable

      - name: Validate explicit autonomous research cycle
        run: python -m pytest -vv --tb=short tests/test_hhs_live_cognition_runtime_v1.py::test_explicit_autonomous_research_cycle_is_callable

      - name: Validate explicit recursive toolchain cycle
        run: python -m pytest -vv --tb=short tests/test_hhs_live_cognition_runtime_v1.py::test_explicit_recursive_toolchain_cycle_is_callable

      - name: Validate guarded cognition routes
        run: python -m pytest -vv --tb=short tests/test_hhs_cognition_routes_v1.py

      - name: Revalidate inherited Pass 045 workflow
        run: python -m pytest -vv --tb=short tests/test_hhs_live_fastapi_runtime_pass045_v1.py

      - name: Run canonical server lifespan smoke test
        run: python -m pytest -vv --tb=short tests/test_hhs_server_cognition_boot_v1.py

      - name: Verify server route composition
        run: |
          python - <<'PY'
          from hhs_backend.server import app
          paths = {route.path for route in app.routes}
          required = {
              "/api/runtime/cognition/status",
              "/api/runtime/goals",
              "/api/runtime/semantic/search",
              "/api/runtime/prediction/generate",
              "/api/runtime/consensus/status",
              "/api/runtime/toolchain/execute",
              "/api/runtime/research/execute",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"missing cognition routes: {missing}")
          print({"cognition_routes": len(required), "status": "VERIFIED"})
          PY
