name: Pass 220 I074 Full Tensor HNAN Closure Hydration

on:
  push:
    branches:
      - pass220/i074-full-tensor-hnan-closure-hydration-20261004
    paths:
      - "hhs_runtime/hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1.py"
      - "tests/pass220/test_hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1.py"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS/Pass220/FullTensorHNANClosureHydration.lean"
      - "formal/wolfram/pass220_i074_full_tensor_hnan_closure_hydration_v1.wl"
      - "evidence/pass220/i074_full_tensor_hnan_closure_hydration_wolfram_20261004_v1.output.json"
      - "evidence/pass220/i074_full_tensor_hnan_closure_hydration_wolfram_20261004_v1.receipt.json"
      - "contracts/pass220/PASS_220_I074_FULL_TENSOR_HNAN_CLOSURE_HYDRATION_V1.json"
      - "docs/whitepapers/HHS_PASS_220_I074_FULL_TENSOR_HNAN_CLOSURE_HYDRATION_V1.md"
      - "docs/operations/restart/PASS_220_I074_FULL_TENSOR_HNAN_CLOSURE_HYDRATION_RESTART_20261004.md"
      - ".github/workflows/pass220-i074-full-tensor-hnan-closure-hydration.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i074-full-tensor-hnan-closure-hydration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-scoped Python requirements
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile I074 runtime and tests
        run: |
          python -m py_compile \
            hhs_runtime/hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1.py \
            tests/pass220/test_hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1.py

      - name: Execute I074 and inherited dependency-scoped tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/pass220/test_hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1.py \
            tests/pass220/test_hhs_pass220_i073_palindromic_rna_fibonacci_symbolic_tensor_v1.py \
            tests/pass220/test_hhs_pass220_i069_harmonicode_i_tensor_v1.py

      - name: Execute I074 runtime self-test
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from hhs_runtime.hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1 import self_test
          result = self_test()
          assert result["status"] == "PASS", result
          assert result["check_count"] == result["pass_count"], result
          assert result["failed"] == [], result
          print(result)
          PY

      - name: Verify exact inherited source bundle identities
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import subprocess
          from hhs_runtime.hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1 import SOURCE_BUNDLE
          for row in SOURCE_BUNDLE:
              actual = subprocess.check_output(
                  ["git", "hash-object", row["path"]], text=True
              ).strip()
              assert actual == row["git_blob_sha"], (
                  row["path"], actual, row["git_blob_sha"]
              )
          PY

      - name: Verify verbatim tensor and optimization census
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from hhs_runtime.hhs_pass220_i074_full_tensor_hnan_closure_hydration_v1 import (
              E_MEMBRANE_SOURCE,
              VERBATIM_SOURCE,
              left_generator_witness,
              right_symbolic_cse_witness,
              closure_witness,
          )
          assert VERBATIM_SOURCE.startswith("u^((")
          assert VERBATIM_SOURCE.endswith("==1)")
          assert VERBATIM_SOURCE.count(E_MEMBRANE_SOURCE) == 3
          assert VERBATIM_SOURCE.count("MatrixPower(") == 2
          left = left_generator_witness()
          assert left["e_membrane"]["source_occurrences"] == 3
          assert left["e_membrane"]["value_nodes"] == 1
          assert left["e_membrane"]["value_evaluations_avoided"] == 2
          right = right_symbolic_cse_witness()
          assert right["cell_occurrences"] == 32
          assert right["unique_cell_expressions"] == 12
          assert right["materializations_avoided"] == 20
          assert right["all_occurrence_witnesses_retained"] is True
          assert right["matrix_power_host_evaluated"] is False
          closure = closure_witness()
          assert closure["closure_readout"] == "1_H"
          assert closure["host_modulo_one_used"] is False
          assert closure["host_division_by_zero_used"] is False
          PY

      - name: Enforce I074 Wolfram evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path(
              "formal/wolfram/pass220_i074_full_tensor_hnan_closure_hydration_v1.wl"
          ).read_text(encoding="utf-8")
          for token in (
              "eVector=phaseScale Table[1+Mod[2 i,phaseModulus]",
              "rightOccurrences=Length[rightCells]",
              "rightUnique=DeleteDuplicates[rightCells]",
              "rightAvoided=rightOccurrences-rightUniqueCount",
              "matrixPowerNodes={\"MatrixPower[M_wz,x^2]\",\"MatrixPower[M_xy,x^4]\"}",
              "41_no_host_matrixpower_evaluation",
              "56_closure_readout_typed_unit",
          ):
              assert token in source, token

          output = json.loads(Path(
              "evidence/pass220/i074_full_tensor_hnan_closure_hydration_wolfram_20261004_v1.output.json"
          ).read_text(encoding="utf-8"))
          assert output["status"] == "PASS"
          assert output["check_count"] == output["pass_count"] == 56
          assert output["failed"] == []
          assert output["e_membrane_occurrences"] == 3
          assert output["e_membrane_value_nodes"] == 1
          assert output["e_evaluations_avoided"] == 2
          assert output["right_cell_occurrences"] == 32
          assert output["right_unique_cell_expressions"] == 12
          assert output["right_cse_materializations_avoided"] == 20
          assert output["hash216_width"] == 216
          assert output["full_attached_components"] == 15552
          PY

      - name: Verify I074 Lean theorem surface
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path(
              "formal/lean/HHS/Pass220/FullTensorHNANClosureHydration.lean"
          ).read_text(encoding="utf-8")
          for token in (
              "theorem eMembraneOptimizationExact",
              "theorem rightCSEExact",
              "theorem rightCSESavingsArithmetic",
              "theorem matrixPowerNodesRemainHeld",
              "theorem hash216HydrationFactor",
              "theorem inheritsI073SerializedCharacters",
              "theorem inheritsHNANEpsilonTerminalDistinction",
              "theorem nativeClosurePolicy",
              "theorem closureReadoutExact",
              "theorem compactHydrationPolicy",
              "theorem authorityBoundary",
          ):
              assert token in source, token
          root = Path("formal/lean/HHS.lean").read_text(encoding="utf-8")
          assert "import HHS.Pass220.FullTensorHNANClosureHydration" in root
          PY

      - name: Lean 4 build, kernel check, and axiom audit
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          build: true
          test: false
          leanchecker: true
          leanchecker-args: HHS
          axiom-audit: true
          axiom-audit-root: HHS
