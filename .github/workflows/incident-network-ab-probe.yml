name: Incident Restored Production Verify

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-network-ab-probe.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify restored production network and pinned SSH
        shell: bash
        env:
          HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
          HHS_PINNED_KNOWN_HOSTS: ${{ secrets.HHS_DIGITALOCEAN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for port in 22 80 443; do
            timeout 5 bash -c "exec 3<>/dev/tcp/159.65.178.254/$port"
            echo "RESTORED_PRODUCTION_PORT_${port}=OPEN"
          done

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HHS_SSH_PRIVATE_KEY" > "$HOME/.ssh/production"
          chmod 0600 "$HOME/.ssh/production"
          printf '%s\n' "$HHS_PINNED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F 159.65.178.254 -f "$HOME/.ssh/known_hosts" >/dev/null

          ssh -i "$HOME/.ssh/production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            root@159.65.178.254 'bash -s' <<'PROD'
          set -euo pipefail
          echo "RESTORED_PRODUCTION_PINNED_SSH_OK=1"
          printf 'RESTORED_PRODUCTION_SHA='
          git -C /opt/hhs/app rev-parse HEAD
          printf 'RESTORED_PRODUCTION_BRANCH='
          git -C /opt/hhs/app branch --show-current
          for svc in ssh nginx hhs.service NetworkManager systemd-networkd; do
            printf 'RESTORED_SERVICE_%s=' "$svc"
            systemctl is-active "$svc" 2>/dev/null || true
          done
          echo 'RESTORED_LISTENERS_BEGIN'
          ss -ltnp | grep -E ':(22|80|443|8080|8720)\b' || true
          echo 'RESTORED_LISTENERS_END'
          curl -kfsS --connect-timeout 5 --max-time 10 https://127.0.0.1/ >/tmp/restored-root.html
          test -s /tmp/restored-root.html
          echo "RESTORED_LOCAL_HTTPS_OK=1"
          PROD
