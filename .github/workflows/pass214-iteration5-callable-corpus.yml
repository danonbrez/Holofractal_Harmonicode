name: Pass 214 Iteration 5 Callable Corpus

on:
  push:
    branches:
      - agent/pass214-operating-compression-gradient
    paths:
      - "hhs_backend/runtime/hhs_pass214_iteration5_callable_corpus_v1.py"
      - "hhs_backend/runtime/pass214_i5_payload/**"
      - "tools/pass214_iteration5_callable_corpus.py"
      - "tools/pass214_iteration5_manifest.py"
      - "tests/test_hhs_pass214_iteration5_callable_corpus_v1.py"
      - "docs/pass214/**"
      - "evidence/pass214/**"
      - ".github/workflows/pass214-iteration5-callable-corpus.yml"
  pull_request:
    paths:
      - "hhs_backend/runtime/hhs_pass214_iteration5_callable_corpus_v1.py"
      - "hhs_backend/runtime/pass214_i5_payload/**"
      - "tools/pass214_iteration5_callable_corpus.py"
      - "tools/pass214_iteration5_manifest.py"
      - "tests/test_hhs_pass214_iteration5_callable_corpus_v1.py"
      - "docs/pass214/**"
      - "evidence/pass214/**"
      - ".github/workflows/pass214-iteration5-callable-corpus.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  callable-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Iteration 5 surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass214_iteration5_callable_corpus_v1.py \
            tools/pass214_iteration5_callable_corpus.py \
            tools/pass214_iteration5_manifest.py \
            tests/test_hhs_pass214_iteration5_callable_corpus_v1.py
      - name: Run dependency-scoped tests
        run: python -m pytest -q tests/test_hhs_pass214_iteration5_callable_corpus_v1.py
      - name: Execute three-run callable corpus
        run: python tools/pass214_iteration5_callable_corpus.py --output-dir artifacts/pass214/iteration5
      - name: Enforce non-promoting gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/pass214/iteration5/PASS_214_ITERATION_5_CALLABLE_CORPUS_REPORT.json").read_text())
          assert report["status"] == "PILOT_READY"
          assert report["consecutive_exact_positive_gain"] is True
          assert report["completed_consecutive_runs"] == 3
          assert report["family_count"] == 5
          assert report["policy"]["migration_active"] is False
          assert report["policy"]["authority_promoted"] is False
          assert report["policy"]["terminal_roots_minted"] is False
          assert report["policy"]["pass215_authorized"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pass214-iteration5-callable-corpus-${{ github.run_id }}
          path: artifacts/pass214/iteration5
          if-no-files-found: error
