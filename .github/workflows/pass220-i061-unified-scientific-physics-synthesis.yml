name: Pass 220 I061 Unified Scientific Physics Synthesis

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_i061_unified_scientific_physics_synthesis_v1.py"
      - "hhs_runtime/include/hhs_pass220_i061_unified_scientific_physics_synthesis_1_0.hpp"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "contracts/pass220/PASS_220_I061_UNIFIED_SCIENTIFIC_PHYSICS_SYNTHESIS_V1.json"
      - "tests/pass220/test_hhs_pass220_i061_unified_scientific_physics_synthesis_v1.py"
      - "tests/pass220/test_hhs_pass220_i061_unified_scientific_physics_synthesis.cpp"
      - "docs/pass220/PASS_220_I061_UNIFIED_SCIENTIFIC_PHYSICS_SYNTHESIS.md"
      - "docs/operations/restart/PASS_220_I061_UNIFIED_SCIENTIFIC_PHYSICS_SYNTHESIS_RESTART_20260929.md"
      - ".github/workflows/pass220-i061-unified-scientific-physics-synthesis.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_i061_unified_scientific_physics_synthesis_v1.py"
      - "hhs_runtime/include/hhs_pass220_i061_unified_scientific_physics_synthesis_1_0.hpp"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "contracts/pass220/PASS_220_I061_UNIFIED_SCIENTIFIC_PHYSICS_SYNTHESIS_V1.json"
      - "tests/pass220/test_hhs_pass220_i061_unified_scientific_physics_synthesis_v1.py"
      - "tests/pass220/test_hhs_pass220_i061_unified_scientific_physics_synthesis.cpp"
      - "docs/pass220/PASS_220_I061_UNIFIED_SCIENTIFIC_PHYSICS_SYNTHESIS.md"
      - "docs/operations/restart/PASS_220_I061_UNIFIED_SCIENTIFIC_PHYSICS_SYNTHESIS_RESTART_20260929.md"
      - ".github/workflows/pass220-i061-unified-scientific-physics-synthesis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove exact I060 ancestry
        run: |
          git merge-base --is-ancestor             ad697affec1eb87d413f25ddb9aa4ece403506ff             HEAD

      - name: Install dependency-scoped Python requirements
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify frozen formal artifact identities
        run: |
          test "$(sha256sum contracts/pass219/PASS_219_ORDERED_CONSTRAINT_WOLFRAM_FORMALIZATION_1_0.harmonicode | awk '{print $1}')" =             "d6d7da60e3e9520c0ec802fa8ec63121ffbee9313263012d021907e210bc652c"
          test "$(sha256sum formal/wolfram/pass219_ordered_constraint_formalization_1_0.wl | awk '{print $1}')" =             "7e4203b0eb578cd10303971fb715576d7fd3af5c8921bd46d5a522d61a950a98"

      - name: Run I061 dual-axis admission tests
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_i061_unified_scientific_physics_synthesis_v1.py

      - name: Re-run I060 proof-identity dependency
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_i060_native_lean_exactrat_value_algebra_v1.py

      - name: Compile native I061 scientific PhysicsCellWall
        run: |
          mkdir -p build/pass220-i061
          g++             -std=c++17             -O2             -Wall             -Wextra             -Werror             -pedantic             -Ihhs_runtime/include             tests/pass220/test_hhs_pass220_i061_unified_scientific_physics_synthesis.cpp             -o build/pass220-i061/test_i061_scientific_physics

      - name: Run native I061 scientific PhysicsCellWall
        run: build/pass220-i061/test_i061_scientific_physics

      - name: Re-run frozen I059 native foundation regression
        run: |
          g++             -std=c++17             -O2             -Wall             -Wextra             -Werror             -pedantic             -Ihhs_runtime/include             tests/pass220/test_hhs_pass220_i059_native_3d_engine_cell_wall.cpp             -o build/pass220-i061/test_i059_foundation
          build/pass220-i061/test_i059_foundation

      - name: Enforce scientific evidence-axis and authority contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              "contracts/pass220/"
              "PASS_220_I061_UNIFIED_SCIENTIFIC_PHYSICS_SYNTHESIS_V1.json"
          ).read_text(encoding="utf-8"))
          runtime = Path(
              "hhs_runtime/"
              "hhs_pass220_i061_unified_scientific_physics_synthesis_v1.py"
          ).read_text(encoding="utf-8")
          native = Path(
              "hhs_runtime/include/"
              "hhs_pass220_i061_unified_scientific_physics_synthesis_1_0.hpp"
          ).read_text(encoding="utf-8")

          assert contract["parent_main"] == (
              "ad697affec1eb87d413f25ddb9aa4ece403506ff"
          )
          assert contract["scientific_admission"]["substitution"] == {
              "formal_for_empirical": False,
              "empirical_for_formal": False,
          }
          assert contract["scientific_admission"]["formal_validity_axis"][
              "post_hoc_proof_attachment_satisfies_admission"
          ] is False

          for token in (
              "PRE_PHYSICS_CELL_CANDIDATE_CONSTRUCTION",
              "formal_validity_does_not_establish_empirical_correspondence",
              "empirical_correspondence_cannot_substitute_for_formal_validity",
              "candidate_hash216",
              "vm81_admission_required_for_canonical_successor",
          ):
              assert token in runtime, token

          for token in (
              "class UnifiedScientificPhysicsCellWall final",
              "bound_before_physics_candidate_construction",
              "post_hoc_attachment",
              "formal_substitutes_for_empirical",
              "empirical_substitutes_for_formal",
              "lane5_5184_hash216_binding_valid",
              "inherited_i059_physics_cell_accepted",
          ):
              assert token in native, token
          PY
