name: Pass 219 I146 Pass 180 Application Factory Reconciliation

on:
  push:
    branches:
      - agent/pass219-iteration146-pass180-application-factory-reconciliation
    paths:
      - 'hhs_backend/runtime/hhs_application_factory_v1.py'
      - 'hhs_backend/api/application_factory_routes.py'
      - 'hhs_backend/visual_server.py'
      - 'hhs_runtime/hhs_pass219_cumulative_pass_membrane_i146_pass180.py'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass180_1_46.*'
      - 'hhs_runtime/c/hhs_pass219_inherited_pass180_1_46.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'contracts/pass219/PASS_219_GLOBAL_CANONICAL_DEFAULTS_1_0.json'
      - 'hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h'
      - 'hhs_runtime/c/hhs_pass219_global_canonical_defaults_1_0.inc'
      - 'tools/validate_pass219_global_canonical_defaults.py'
      - 'tests/test_pass180_application_factory.py'
      - 'tests/pass219/test_pass219_cumulative_pass180_membrane_i146.py'
      - 'tests/pass219/test_pass219_inherited_pass180_1_46.*'
      - 'tests/pass219/test_pass219_global_canonical_defaults_1_0.*'
      - 'contracts/pass219/optimization_generalization/PASS_182_UNIVERSAL_HYDRATION_I144.json'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_ka10_monitor_profile_1_9.inc'
      - '.github/workflows/pass219-cumulative-pass186-membrane-i140.yml'
      - '.github/workflows/pass219-universal-quantization-constraint-audit.yml'
      - '.github/workflows/pass219-i146-pass180-application-factory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i146-pass180-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass180-i146:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_LITERT_LM_PROVIDER_MODE: disabled
      HHS_START_LITERT_LM: '0'
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: '0'
      HHS_COGNITION_AUTO_TICK: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped Python packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 600s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'pydantic>=2.7,<3.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'httpx>=0.27,<1.0' \
            'requests>=2.32,<3.0' \
            'websockets>=12.0,<16.0' \
            'cryptography>=46.0,<47.0' \
            'networkx>=3.3,<4.0' \
            'orjson>=3.10,<4.0' \
            'pyyaml>=6.0,<7.0' \
            'numpy>=1.26,<3.0' \
            'sympy>=1.13,<2.0' \
            'sqlalchemy>=2.0,<3.0' \
            'aiosqlite>=0.20,<1.0' \
            'rich>=13.7,<14.0' \
            'click>=8.1,<9.0' \
            'typer>=0.12,<1.0' \
            'loguru>=0.7,<1.0' \
            'pytest>=8.0,<10.0' \
            'pytest-asyncio>=0.23,<1.0'

      - name: Verify frozen lineage and historical Pass 180 green head
        run: |
          git merge-base --is-ancestor 9d0e8ef4a60d450f69ef5bf4dab3ad1c18b30dba HEAD
          git merge-base --is-ancestor 4762e1b5428f09a957905cc59669b7c9aeb36f06 HEAD
          grep -F 'HHS-P180-IAF-VM81-H72-H216' docs/pass180/HHS_PASS_180_INTEGRATED_APPLICATION_FACTORY.md

      - name: Compile I146 and Pass 180 surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_application_factory_v1.py \
            hhs_backend/api/application_factory_routes.py \
            hhs_backend/visual_server.py \
            hhs_runtime/hhs_pass219_cumulative_pass_membrane_i146_pass180.py \
            tests/test_pass180_application_factory.py

      - name: Build exact runtime shared library
        run: |
          set -euo pipefail
          timeout 600s make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep -E 'hhs_exact_abi_validate|hhs_exact_pass219_inherited_pass180_version'

      - name: Run complete Pass 180 application-factory suite
        run: |
          PYTHONPATH="$PWD" python -m pytest -q tests/test_pass180_application_factory.py

      - name: Run I146 cumulative membrane
        run: |
          PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass180_membrane_i146.py

      - name: Verify public routes and VM81 authority repair
        run: |
          grep -F 'P180_APPLICATION_FACTORY_CANONICAL_MUTATION' hhs_backend/runtime/hhs_application_factory_v1.py
          grep -F 'HHS_PASS180_APPLICATION_FACTORY_VM81_ADMISSION_VERIFIED' hhs_backend/runtime/hhs_application_factory_v1.py
          grep -F 'vm81_receipt_hash72' hhs_backend/runtime/hhs_application_factory_v1.py
          PYTHONPATH="$PWD" python - <<'PY'
          from hhs_backend.visual_server import app
          paths = {getattr(route, "path", None) for route in app.router.routes}
          required = {
              "/api/runtime/application-factory/status",
              "/api/runtime/application-factory/modules",
              "/api/runtime/application-factory/workflows",
              "/api/runtime/application-factory/projects",
          }
          missing = required - paths
          assert not missing, sorted(missing)
          from hhs_backend.runtime.hhs_application_factory_v1 import APPLICATION_FACTORY
          status = APPLICATION_FACTORY.status()
          assert status["vm81_authority_bound"] is True
          assert status["independent_vm81_authority"] is False
          assert status["hash72_after_vm81_required"] is True
          print({"routes": sorted(required), "status": status})
          PY

      - name: Preserve global defaults and multimodal generalization
        run: |
          python tools/validate_pass219_global_canonical_defaults.py
          python tools/validate_pass219_multimodal_optimization_generalization.py
          python tools/hhs_multimodal_optimization_generalizer.py validate-all

      - name: Audit repaired integration compatibility gates
        run: |
          set -euo pipefail
          git fetch origin main
          python tools/hhs_multimodal_optimization_generalizer.py audit-diff origin/main
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          contract = json.loads(
              Path("contracts/pass219/PASS_219_GLOBAL_CANONICAL_DEFAULTS_1_0.json").read_text()
          )
          census = contract["current_cumulative_binding_census"]
          policy_h = Path(
              "hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h"
          ).read_text()
          match = re.search(
              r"HHS_EXACT_PASS219_GLOBAL_DEFAULT_BINDING_COUNT\\s+(\\d+)U",
              policy_h,
          )
          assert match is not None
          assert int(match.group(1)) == census["binding_count"]
          assert census["binding_count"] >= 35
          assert census["wired_floor_pass"] <= 186
          assert census["ordered_bindings"][:35][-1] == "186"
          print({
              "classification": "HHS_PASS186_ADDITIVE_SUCCESSOR_CENSUS_VERIFIED",
              "binding_count": census["binding_count"],
              "wired_floor": census["wired_floor_pass"],
          })
          PY
          PYTHONPATH="$PWD" python -m pytest -q             tests/test_hhs_vm81_native_development_v1.py::test_direct_c_abi_exact_foundation_smoke

      - name: Compile exact ABI and I146 C/C++ conformance
        run: |
          mkdir -p /tmp/pass219-i146
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -c hhs_runtime/c/hhs_runtime_exact_abi.c -o /tmp/pass219-i146/exact.o
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass186_x64_vm81_q144/include -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_vm81_q144_abi.c -o /tmp/pass219-i146/pass186.o
          gcc -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_registers.S -o /tmp/pass219-i146/registers.o
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass180_1_46.c /tmp/pass219-i146/exact.o /tmp/pass219-i146/pass186.o /tmp/pass219-i146/registers.o -o /tmp/pass219-i146/pass180-c
          /tmp/pass219-i146/pass180-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass180_1_46.cpp /tmp/pass219-i146/exact.o /tmp/pass219-i146/pass186.o /tmp/pass219-i146/registers.o -o /tmp/pass219-i146/pass180-cpp
          /tmp/pass219-i146/pass180-cpp
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.c /tmp/pass219-i146/exact.o /tmp/pass219-i146/pass186.o /tmp/pass219-i146/registers.o -o /tmp/pass219-i146/defaults-c
          /tmp/pass219-i146/defaults-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.cpp /tmp/pass219-i146/exact.o /tmp/pass219-i146/pass186.o /tmp/pass219-i146/registers.o -o /tmp/pass219-i146/defaults-cpp
          /tmp/pass219-i146/defaults-cpp

      - name: Emit exact-head I146 branch-local receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p evidence/pass180/i146
          PYTHONPATH="$PWD" python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from hhs_runtime.hash72_checkpoint import make_hash72_witness
          from hhs_runtime.hhs_pass219_cumulative_pass_membrane_i146_pass180 import execute_pass180_membrane_preflight

          preflight = execute_pass180_membrane_preflight()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          payload = {
              "schema": "PASS_219_I146_PASS180_VALIDATION_RECEIPT_V1",
              "repository": "danonbrez/Holofractal_Harmonicode",
              "branch": "agent/pass219-iteration146-pass180-application-factory-reconciliation",
              "head_sha": head,
              "tree_sha": tree,
              "workflow_run_id": int(os.environ["RUN_ID"]),
              "workflow_run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "classification": "HHS_PASS180_I146_CUMULATIVE_TERMINAL_VERIFIED",
              "historical_green": {
                  "head": "9d0e8ef4a60d450f69ef5bf4dab3ad1c18b30dba",
                  "run_id": 30633469008,
              },
              "preflight": preflight,
              "global_defaults": {
                  "wired_ceiling": 218,
                  "wired_floor": 180,
                  "binding_count": 41,
              },
              "authority": {
                  "singleton_vm81_authority_remains_inherited": True,
                  "project_create_requires_vm81": True,
                  "file_upsert_requires_vm81": True,
                  "lifecycle_commit_requires_vm81": True,
                  "hash72_after_vm81": True,
                  "independent_vm81_authority": False,
                  "independent_hash72_authority": False,
                  "hash216_mutation_authority": False,
              },
              "closure": {
                  "terminal_pass180_completion": True,
                  "repair_forward_required": False,
                  "remaining_terminal_obligation_count": 0,
                  "merge_performed": False,
                  "authoritative_main_verification": False,
                  "deployment_performed": False,
              },
          }
          receipt = make_hash72_witness("pass180:i146:validation", payload, width=72).digest
          lanes = [
              make_hash72_witness("pass180:i146:archive:previous", {"head": head, "receipt": receipt}, width=72).digest,
              make_hash72_witness("pass180:i146:archive:change", {"tree": tree, "receipt": receipt}, width=72).digest,
              make_hash72_witness("pass180:i146:archive:receipt", payload, width=72).digest,
          ]
          payload["receipt_hash72"] = receipt
          payload["archive_hash216"] = "".join(lanes)
          path = Path("evidence/pass180/i146/PASS_219_I146_PASS180_VALIDATION_RECEIPT.json")
          path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "classification": payload["classification"],
              "head": head,
              "receipt_hash72": receipt,
              "archive_hash216": payload["archive_hash216"],
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i146-pass180-application-factory
          path: evidence/pass180/i146/PASS_219_I146_PASS180_VALIDATION_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
