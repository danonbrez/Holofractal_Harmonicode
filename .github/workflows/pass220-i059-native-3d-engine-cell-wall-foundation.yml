name: Pass 220 I059 Native 3D Engine Cell-Wall Foundation

on:
  push:
    paths:
      - "hhs_runtime/include/hhs_pass220_native_3d_engine_cell_wall_1_0.hpp"
      - "tests/pass220/test_hhs_pass220_i059_native_3d_engine_cell_wall.cpp"
      - "docs/pass220/PASS_220_I059_NATIVE_3D_ENGINE_CELL_WALL_FOUNDATION.md"
      - "docs/operations/restart/PASS_220_I059_NATIVE_3D_ENGINE_CELL_WALL_FOUNDATION_RESTART_20260928.md"
      - "hhs_runtime/hhs_pass220_whitepaper_equation_game_mechanics_v1.py"
      - "tests/pass220/test_hhs_pass220_i058_whitepaper_equation_game_mechanics_v1.py"
      - "examples/ParticleSimulation.html"
      - "tests/pass220/test_hhs_pass220_i057_particle_simulation_performance.py"
      - ".github/workflows/pass220-i059-native-3d-engine-cell-wall-foundation.yml"
  pull_request:
    paths:
      - "hhs_runtime/include/hhs_pass220_native_3d_engine_cell_wall_1_0.hpp"
      - "tests/pass220/test_hhs_pass220_i059_native_3d_engine_cell_wall.cpp"
      - "docs/pass220/PASS_220_I059_NATIVE_3D_ENGINE_CELL_WALL_FOUNDATION.md"
      - "docs/operations/restart/PASS_220_I059_NATIVE_3D_ENGINE_CELL_WALL_FOUNDATION_RESTART_20260928.md"
      - "hhs_runtime/hhs_pass220_whitepaper_equation_game_mechanics_v1.py"
      - "tests/pass220/test_hhs_pass220_i058_whitepaper_equation_game_mechanics_v1.py"
      - "examples/ParticleSimulation.html"
      - "tests/pass220/test_hhs_pass220_i057_particle_simulation_performance.py"
      - ".github/workflows/pass220-i059-native-3d-engine-cell-wall-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-scoped Python requirements
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile native I059 cell-wall regression
        run: |
          mkdir -p build/pass220-i059
          g++             -std=c++17             -O2             -Wall             -Wextra             -Werror             -pedantic             -Ihhs_runtime/include             tests/pass220/test_hhs_pass220_i059_native_3d_engine_cell_wall.cpp             -o build/pass220-i059/test_i059_native_3d_engine_cell_wall

      - name: Run native I059 cell-wall regression
        run: build/pass220-i059/test_i059_native_3d_engine_cell_wall

      - name: Run inherited I058 exact game-mechanics regression
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_i058_whitepaper_equation_game_mechanics_v1.py

      - name: Run frozen I057 ParticleSimulation regression
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_i057_particle_simulation_performance.py

      - name: Enforce foundation authority and topology
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path(
              "hhs_runtime/include/"
              "hhs_pass220_native_3d_engine_cell_wall_1_0.hpp"
          ).read_text(encoding="utf-8")
          frozen = Path("examples/ParticleSimulation.html").read_text(encoding="utf-8")
          mechanics = Path(
              "hhs_runtime/hhs_pass220_whitepaper_equation_game_mechanics_v1.py"
          ).read_text(encoding="utf-8")

          for token in (
              "class WorldCellWall final",
              "class PhysicsCellWall final",
              "class GeometryCellWall final",
              "class RenderCellWall final",
              "class ScriptCellWall final",
              "class ComputeCellWall final",
              "class AssetCellWall final",
              "class Native3DEngineCellWall final",
              "HHSExactRational64 delta_time",
              "candidate_only{1U}",
              "canonical_vm81_mutation_authority{}",
              "canonical_hash72_authority{}",
              "canonical_hash216_authority{}",
              "floating_point_canonical_authority{}",
              "frozen_i057_renderer_preserved = 1U",
              "inherited_i058_mechanics_preserved = 1U",
          ):
              assert token in header, token

          assert 'schema:"HHS_PASS_220_I057_PARTICLE_SIMULATION_ZERO_LOSS_PERF_V1"' in frozen
          assert "HHS_PASS_220_I059" not in frozen
          assert "HHS_PASS_220_I058_WHITEPAPER_EQUATION_GAME_MECHANICS_V1" in mechanics
          PY
