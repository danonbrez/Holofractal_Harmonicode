          )
          assert output['g72_scalar_projection_face'] == '2^(1/72)'
          assert output['delta_constructor_identity_global'] is False
          assert output['delta_projection_cross_substitution_authorized'] is False
          assert output['actual_epsilon_monotonicity_claimed'] is False
          assert output['monotone_envelope_claimed'] is True
          assert output['t_bridge_01b_workload_interval_certificate'] == 'OPEN'
