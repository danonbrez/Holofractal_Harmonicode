name: Pass 161 Source Materialization

on:
  pull_request:
    paths:
      - 'staging/pass161-source/**'
      - '.github/workflows/pass161-source-materialization.yml'

permissions:
  contents: write

jobs:
  materialize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic source transport
        run: |
          set -euo pipefail
          stage='staging/pass161-source'
          test "$(sha256sum "$stage/p161-part-00" | awk '{print $1}')" = b66456205e2bb8c0db6d1648bdda82ba0cb2103a2debe15658f74277f51a3dd9
          test "$(sha256sum "$stage/p161-part-01" | awk '{print $1}')" = d0c16bc3354fecf2bac2e6235520c0fc5ad136e94549c16830425256fb92a5e3
          test "$(sha256sum "$stage/p161-part-02" | awk '{print $1}')" = 488f35e6ab5e9c479ea03c22bb6ab28031ad905f45d8eb43f000aba92e079bd0
          test "$(sha256sum "$stage/p161-part-03" | awk '{print $1}')" = 85e33eba13eee04ad5cf68bfbb6b02d309b2e617b46fac1b35b9114064c5d4be
          test "$(sha256sum "$stage/p161-part-04" | awk '{print $1}')" = b56b46261fdb154f7941608b4ed443992dffc66b554ad63b3bd28948b6e3380c
          cat "$stage"/p161-part-* | base64 -d > /tmp/pass161-source.tar.gz
          test "$(sha256sum /tmp/pass161-source.tar.gz | awk '{print $1}')" = eaa5e8af7531f1c23a97a0acfd6ed40e35674d7a35f270d15633dc9cf9d92473
          gzip -t /tmp/pass161-source.tar.gz
          tar -tzf /tmp/pass161-source.tar.gz >/dev/null
      - name: Materialize ordinary inspectable source
        run: |
          set -euo pipefail
          tar -xzf /tmp/pass161-source.tar.gz -C .
          rm -f .github/workflows/pass161-harmonizer.yml
          test -f applications/holofractal_harmonizer/src/core.mjs
          test -f applications/holofractal_harmonizer/src/finalization.mjs
          test -f applications/holofractal_harmonizer/tools/close.mjs
      - name: Execute source-scoped Pass 161 validation
        working-directory: applications/holofractal_harmonizer
        run: |
          set -euo pipefail
          node --check src/core.mjs
          node --check src/browser.mjs
          node --check src/finalization.mjs
          node --check tools/finalize.mjs
          node --check tools/browser_audit.mjs
          node --check tools/package.mjs
          node --check tools/close.mjs
          node --test tests/*.test.mjs
      - name: Commit ordinary Pass 161 source
        run: |
          set -euo pipefail
          rm -rf staging/pass161-source
          git config user.name 'chatgpt-pass161-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HHS_PASS_161_INHERITANCE_AMENDMENT_V1_1.md applications/holofractal_harmonizer staging/pass161-source
          git diff --cached --check
          git commit -m 'Implement complete Pass 161 Harmonizer source'
          git push origin HEAD:"$TARGET_BRANCH"
