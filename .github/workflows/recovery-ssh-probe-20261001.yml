name: Recovery SSH Auth Probe 20261001

on:
  push:
    branches:
      - recovery/ssh-probe-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RECOVERY_HOST: '165.227.99.132'
      RECOVERY_USER: root
      HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
    steps:
      - name: Require recovery SSH credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HHS_SSH_PRIVATE_KEY"
      - name: Probe recovery SSH port
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket
          import os
          host = os.environ["RECOVERY_HOST"]
          sock = socket.socket()
          sock.settimeout(8)
          sock.connect((host, 22))
          sock.close()
          print(f"HHS_RECOVERY_SSH_PORT_OPEN={host}:22")
          PY
      - name: Verify recovery SSH authentication
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HHS_SSH_PRIVATE_KEY" > "$HOME/.ssh/hhs-recovery"
          chmod 0600 "$HOME/.ssh/hhs-recovery"
          ssh-keyscan -T 8 -H "$RECOVERY_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh \
            -i "$HOME/.ssh/hhs-recovery" \
            -o BatchMode=yes \
            -o ConnectTimeout=12 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$RECOVERY_USER@$RECOVERY_HOST" \
            "set -e; printf 'HHS_RECOVERY_SSH_AUTH_OK=1\\n'; id; uname -a; cloud-init status --long || true"
