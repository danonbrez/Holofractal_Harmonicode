name: Pass 217 Iteration 3 Genesis Candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_backend/runtime/hhs_pass217_genesis_candidate_v1.py'
      - 'tools/pass217_iteration3_genesis_candidate.py'
      - 'tests/test_hhs_pass217_genesis_candidate_v1.py'
      - 'scripts/run_pass217_iteration3_validation.sh'
      - 'contracts/pass217/**'
      - 'evidence/pass217/PASS_217_ITERATION_3*'
      - 'docs/pass217/**'
      - '.github/workflows/pass217-iteration3-genesis-candidate.yml'
  push:
    branches:
      - main
      - agent/pass217-genesis-inventory-iteration1
    paths:
      - 'hhs_backend/runtime/hhs_pass217_genesis_candidate_v1.py'
      - 'tools/pass217_iteration3_genesis_candidate.py'
      - 'tests/test_hhs_pass217_genesis_candidate_v1.py'
      - 'scripts/run_pass217_iteration3_validation.sh'
      - 'contracts/pass217/**'
      - 'evidence/pass217/PASS_217_ITERATION_3*'
      - 'docs/pass217/**'
      - '.github/workflows/pass217-iteration3-genesis-candidate.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-non-promotional-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate cumulative Iterations 1 through 3
        run: |
          mkdir -p "$RUNNER_TEMP/pass217-iteration3"
          bash scripts/run_pass217_iteration3_validation.sh \
            | tee "$RUNNER_TEMP/pass217-iteration3/validation.log"
      - name: Retain Iteration 3 candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass217-iteration3-genesis-candidate-${{ github.run_id }}
          path: |
            contracts/pass217/genesis_candidate_manifest.schema.json
            contracts/pass217/genesis_candidate_reference_vectors.json
            evidence/pass217/PASS_217_ITERATION_3_LOGICAL_GENESIS_CANDIDATE.bin
            evidence/pass217/PASS_217_ITERATION_3_ADDRESS_MAPS.bin
            evidence/pass217/PASS_217_ITERATION_3_GENESIS_CANDIDATE_MANIFEST.json
            evidence/pass217/PASS_217_ITERATION_3_CHECKSUMS.sha256
            ${{ runner.temp }}/pass217-iteration3/validation.log
          if-no-files-found: error
