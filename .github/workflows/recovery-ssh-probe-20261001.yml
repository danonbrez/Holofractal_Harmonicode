name: Recovery Clean Host Baseline 20261001

on:
  push:
    branches:
      - recovery/ssh-probe-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RECOVERY_HOST: '165.227.99.132'
      RECOVERY_USER: root
      HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HHS_SSH_PRIVATE_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HHS_SSH_PRIVATE_KEY" > "$HOME/.ssh/hhs-recovery"
          chmod 0600 "$HOME/.ssh/hhs-recovery"
          ssh-keyscan -T 8 "$RECOVERY_HOST" > "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Install headless baseline and clone main
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hhs-recovery" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$RECOVERY_USER@$RECOVERY_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl nginx \
            build-essential gcc g++ make pkg-config libssl-dev \
            python3 python3-venv python3-pip sqlite3 openssl

          if ! id hhs >/dev/null 2>&1; then
            useradd --system --home-dir /var/lib/hhs --create-home --shell /usr/sbin/nologin hhs
          fi

          rm -rf /opt/hhs
          install -d -m 0755 /opt/hhs
          git clone --branch main https://github.com/danonbrez/Holofractal_Harmonicode.git /opt/hhs/app
          python3 -m venv /opt/hhs/venv

          echo "HHS_RECOVERY_BASELINE_VERIFIED=1"
          git -C /opt/hhs/app rev-parse HEAD
          python3 --version
          nginx -v
          REMOTE
