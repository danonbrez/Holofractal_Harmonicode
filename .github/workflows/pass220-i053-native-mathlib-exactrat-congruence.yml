name: Pass 220 I053 Native Mathlib ExactRat Congruence

on:
  push:
    branches:
      - pass220/i053-native-mathlib-exactrat-congruence1
    paths:
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS/Mathlib/Algebra/ExactRatCongruence.lean"
      - "hhs_runtime/hhs_pass220_i053_native_mathlib_exactrat_congruence_v1.py"
      - "tests/pass220/test_hhs_pass220_i053_native_mathlib_exactrat_congruence_v1.py"
      - "contracts/pass220/PASS_220_I053_NATIVE_MATHLIB_EXACTRAT_CONGRUENCE_V1.json"
      - "docs/pass220/PASS_220_I053_NATIVE_MATHLIB_EXACTRAT_CONGRUENCE.md"
      - "docs/operations/restart/PASS_220_I053_NATIVE_MATHLIB_EXACTRAT_CONGRUENCE_RESTART_20260928.md"
      - ".github/workflows/pass220-i053-native-mathlib-exactrat-congruence.yml"
  pull_request:
    paths:
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS/Mathlib/Algebra/ExactRatCongruence.lean"
      - "hhs_runtime/hhs_pass220_i053_native_mathlib_exactrat_congruence_v1.py"
      - "tests/pass220/test_hhs_pass220_i053_native_mathlib_exactrat_congruence_v1.py"
      - "contracts/pass220/PASS_220_I053_NATIVE_MATHLIB_EXACTRAT_CONGRUENCE_V1.json"
      - "docs/pass220/PASS_220_I053_NATIVE_MATHLIB_EXACTRAT_CONGRUENCE.md"
      - "docs/operations/restart/PASS_220_I053_NATIVE_MATHLIB_EXACTRAT_CONGRUENCE_RESTART_20260928.md"
      - ".github/workflows/pass220-i053-native-mathlib-exactrat-congruence.yml"
  workflow_dispatch:

jobs:
  exactrat-congruence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: ExactRat congruence manifest
        run: python -m pytest -q tests/pass220/test_hhs_pass220_i053_native_mathlib_exactrat_congruence_v1.py

      - name: Lean 4 build and kernel audit
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          build: true
          test: false
          leanchecker: true
          leanchecker-args: HHS
          axiom-audit: true
          axiom-audit-root: HHS
