name: Pass 214 Compound Optimization Benchmark Authority

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/pass214-operating-compression-gradient
    paths:
      - 'HHS_PASS_214_REPOSITORY_WIDE_COMPOUND_OPTIMIZATION_BENCHMARK_AUTHORITY.md'
      - 'contracts/pass214/**'
      - 'docs/pass214/**'
      - 'evidence/pass214/**'
      - 'hhs_backend/runtime/hhs_pass214_repository_census_v1.py'
      - 'hhs_backend/runtime/hhs_pass214_callable_conformance_v1.py'
      - 'hhs_backend/runtime/pass214_i2_payload/**'
      - 'hhs_backend/runtime/hhs_pass214_oracle_adjudication_v1.py'
      - 'hhs_backend/runtime/pass214_i3_payload/**'
      - 'hhs_backend/runtime/hhs_pass214_callable_oracle_v1.py'
      - 'hhs_backend/runtime/pass214_i4_payload/**'
      - 'hhs_backend/runtime/hhs_pass214_iteration5_callable_corpus_v1.py'
      - 'hhs_backend/runtime/pass214_i5_payload/**'
      - 'tools/pass214_repository_census.py'
      - 'tools/pass214_callable_conformance.py'
      - 'tools/pass214_oracle_adjudication.py'
      - 'tools/pass214_callable_oracle.py'
      - 'tools/pass214_iteration4_manifest.py'
      - 'tools/pass214_iteration5_callable_corpus.py'
      - 'tools/pass214_iteration5_manifest.py'
      - 'scripts/run_pass214_contract_validation.sh'
      - 'tests/test_hhs_pass214_contract_v2.py'
      - 'tests/test_hhs_pass214_repository_census_v1.py'
      - 'tests/test_hhs_pass214_callable_conformance_v1.py'
      - 'tests/pass214_i2_test_payload/**'
      - 'tests/test_hhs_pass214_oracle_adjudication_v1.py'
      - 'tests/pass214_i3_test_payload/**'
      - 'tests/test_hhs_pass214_callable_oracle_v1.py'
      - 'tests/pass214_i4_test_payload/**'
      - 'tests/test_hhs_pass214_iteration5_callable_corpus_v1.py'
      - '.github/workflows/pass214-compound-optimization-benchmark.yml'
      - '.github/workflows/pass214-iteration5-callable-corpus.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'HHS_PASS_214_REPOSITORY_WIDE_COMPOUND_OPTIMIZATION_BENCHMARK_AUTHORITY.md'
      - 'contracts/pass214/**'
      - 'docs/pass214/**'
      - 'evidence/pass214/**'
      - 'hhs_backend/runtime/hhs_pass214_*'
      - 'hhs_backend/runtime/pass214_i*_payload/**'
      - 'tools/pass214_*'
      - 'scripts/run_pass214_contract_validation.sh'
      - 'tests/test_hhs_pass214_*'
      - 'tests/pass214_i*_test_payload/**'
      - '.github/workflows/pass214-compound-optimization-benchmark.yml'
      - '.github/workflows/pass214-iteration5-callable-corpus.yml'

permissions:
  contents: read

jobs:
  iterations-1-2-3-4-5-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pytest
      - name: Validate Pass 214 Iterations 1 through 5
        run: bash scripts/run_pass214_contract_validation.sh
      - name: Build inherited native C ABI
        run: make c-abi
      - name: Generate immutable Iteration 1 census
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration1"
          python tools/pass214_repository_census.py \
            --repository-root . \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-iteration1" \
            | tee "$RUNNER_TEMP/pass214-iteration1-validation.log"
      - name: Generate Iteration 2 callable conformance graph
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration2"
          python tools/pass214_callable_conformance.py \
            --repository-root . \
            --iteration1-directory "$RUNNER_TEMP/pass214-iteration1" \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-iteration2" \
            | tee "$RUNNER_TEMP/pass214-iteration2-validation.log"
      - name: Generate exact-head Iteration 4 workload manifest
        run: |
          python tools/pass214_iteration4_manifest.py \
            --repository-root . \
            --output "$RUNNER_TEMP/pass214-iteration4-manifest.json" \
            | tee "$RUNNER_TEMP/pass214-iteration4-manifest.log"
      - name: Execute selected repository-callable oracle
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration4"
          python tools/pass214_callable_oracle.py \
            --repository-root . \
            --iteration2-directory "$RUNNER_TEMP/pass214-iteration2" \
            --manifest "$RUNNER_TEMP/pass214-iteration4-manifest.json" \
            --output-directory "$RUNNER_TEMP/pass214-iteration4" \
            | tee "$RUNNER_TEMP/pass214-iteration4-validation.log"
      - name: Execute exact-head Iteration 5 callable corpus
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration5"
          python tools/pass214_iteration5_callable_corpus.py \
            --output-dir "$RUNNER_TEMP/pass214-iteration5" \
            | tee "$RUNNER_TEMP/pass214-iteration5-validation.log"
      - name: Enforce Iteration 5 non-promoting gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pass214-iteration5" / "PASS_214_ITERATION_5_CALLABLE_CORPUS_REPORT.json").read_text()
          )
          assert report["status"] == "PILOT_READY"
          assert report["consecutive_exact_positive_gain"] is True
          assert report["completed_consecutive_runs"] == 3
          assert report["family_count"] == 5
          assert report["policy"]["migration_active"] is False
          assert report["policy"]["authority_promoted"] is False
          assert report["policy"]["terminal_roots_minted"] is False
          assert report["policy"]["pass215_authorized"] is False
          PY
      - name: Retain Pass 214 Iterations 1 through 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass214-iterations-1-2-3-4-5-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pass214-iteration1/*.json
            ${{ runner.temp }}/pass214-iteration2/*.json
            ${{ runner.temp }}/pass214-iteration4/*.json
            ${{ runner.temp }}/pass214-iteration5/*.json
            ${{ runner.temp }}/pass214-iteration4-manifest.json
            ${{ runner.temp }}/pass214-iteration1-validation.log
            ${{ runner.temp }}/pass214-iteration2-validation.log
            ${{ runner.temp }}/pass214-iteration4-manifest.log
            ${{ runner.temp }}/pass214-iteration4-validation.log
            ${{ runner.temp }}/pass214-iteration5-validation.log
            contracts/pass214/PASS_214_ITERATION_3_ORACLE_ADJUDICATION_EXTENSION.json
            contracts/pass214/PASS_214_ITERATION_4_CALLABLE_ORACLE_EXTENSION.json
            evidence/pass214/PASS_214_ITERATION_3_IMPLEMENTATION_RECORD.json
            evidence/pass214/PASS_214_ITERATION_4_IMPLEMENTATION_RECORD.json
            evidence/pass214/PASS_214_ITERATION_5_IMPLEMENTATION_RECORD.json
          if-no-files-found: error
