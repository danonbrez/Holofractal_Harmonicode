name: HHS Consensus Gate

on:
  push:
    branches:
      - agent/pass219-main-determinism-repair-20260911
  pull_request:
    branches: [main, work]

permissions:
  contents: read

jobs:
  workflow-syntax-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install pinned actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Compile-check all workflows
        run: |
          ACTIONLINT="$(go env GOPATH)/bin/actionlint"
          "$ACTIONLINT" -shellcheck= -color

  verify:
    strategy:
      matrix:
        node: [1, 2, 3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run commit acceptance gate as repository module
        run: PYTHONPATH="$PWD" python -m hhs_runtime.hhs_commit_acceptance_gate_v1
      - name: Run distributed verification as repository module
        run: PYTHONPATH="$PWD" python -m hhs_runtime.hhs_distributed_verification_v1
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-${{ matrix.node }}
          path: data/runtime/hhs_distributed_verification_local.json

  consensus:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: receipts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate deterministic consensus
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import glob
          import json
          from hhs_runtime.hhs_multi_agent_consensus_v2_gate import evaluate_consensus

          receipts = [
              json.load(open(path, encoding='utf-8'))
              for path in sorted(glob.glob('receipts/**/*.json', recursive=True))
          ]
          result = evaluate_consensus(receipts)
          print(result)
          assert result.status == 'CONSENSUS_ACCEPTED'
          PY
