name: Pass 219 Lane 5 Thread Lineage Normalization 1.60

on:
  push:
    branches:
      - pass219/lane5-thread-lineage-normalization-1-60
    paths:
      - 'hhs_backend/runtime/hhs_pass219_lane5_thread_lineage_normalization_1_60.py'
      - 'tests/pass219/test_pass219_lane5_thread_lineage_normalization_1_60.py'
      - 'contracts/pass219/PASS_219_LANE5_THREAD_LINEAGE_NORMALIZATION_1_60.md'
      - 'evidence/pass219/hhs_thread_lineage_normalization_v1.wl'
      - 'evidence/pass219/hhs_thread_lineage_normalization_v1.output.json'
      - 'evidence/pass219/hhs_thread_lineage_normalization_v1.receipt.json'
      - 'docs/HARMONICODE_SPEC_v1.md'
      - 'RUNTIME_FLOW.md'
      - '.github/workflows/pass219-lane5-thread-lineage-normalization-1-60.yml'
      - 'docs/operations/restart/PASS_219_LANE5_THREAD_LINEAGE_NORMALIZATION_1_60_RESTART_20260920.md'
  pull_request:
    branches:
      - pass219/lane5-zero-bypass-secure-gateway-1-59
    paths:
      - 'hhs_backend/runtime/hhs_pass219_lane5_thread_lineage_normalization_1_60.py'
      - 'tests/pass219/test_pass219_lane5_thread_lineage_normalization_1_60.py'
      - 'contracts/pass219/PASS_219_LANE5_THREAD_LINEAGE_NORMALIZATION_1_60.md'
      - 'evidence/pass219/hhs_thread_lineage_normalization_v1.wl'
      - 'evidence/pass219/hhs_thread_lineage_normalization_v1.output.json'
      - 'evidence/pass219/hhs_thread_lineage_normalization_v1.receipt.json'
      - 'docs/HARMONICODE_SPEC_v1.md'
      - 'RUNTIME_FLOW.md'
      - '.github/workflows/pass219-lane5-thread-lineage-normalization-1-60.yml'
      - 'docs/operations/restart/PASS_219_LANE5_THREAD_LINEAGE_NORMALIZATION_1_60_RESTART_20260920.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  thread-lineage-normalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped tools
        run: python -m pip install --disable-pip-version-check pytest 'cryptography>=45.0,<47.0'

      - name: Build cumulative exact runtime
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Verify sealed Wolfram HHS-T5184-005 evidence
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          receipt = json.loads(
              Path('evidence/pass219/hhs_thread_lineage_normalization_v1.receipt.json').read_text()
          )
          assert receipt['result'] == 'PASS'
          assert receipt['theorem'] == 'HHS-T5184-005'
          assert receipt['checks_passed'] == receipt['checks_total'] == 17
          for kind in ('source', 'output'):
              path = Path(receipt[f'{kind}_path'])
              raw = path.read_bytes()
              assert len(raw) == receipt[f'{kind}_bytes'], (kind, len(raw))
              assert sha256(raw).hexdigest() == receipt[f'{kind}_sha256'], kind

          output = json.loads(Path(receipt['output_path']).read_text())
          assert output['status'] == 'PASS'
          assert output['theorem'] == 'HHS-T5184-005'
          assert output['checks_passed'] == output['checks_total'] == 17
          assert all(output['checks'].values())
          assert output['geometry']['serialization_characters'] == 5184
          assert output['geometry']['vm81_cells'] == 81
          assert output['geometry']['local_cell_width'] == 64
          assert output['semantics']['scope_composition'] == 'intersection'
          assert output['semantics']['host_floating_point_authority'] is False
          PY

      - name: Run 1.60 dependency-scoped exact regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/pass219/test_pass219_lane5_thread_lineage_normalization_1_60.py \
            tests/pass219/test_harmonicode_lane5_bigint_transcription_v1.py

      - name: Prove normalized genesis and shared-SQL thread topology
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import tempfile
          from hhs_backend.runtime.hhs_pass219_lane5_thread_lineage_normalization_1_60 import (
              Pass219Lane5ThreadLineageMemory,
              ZERO_OFFSETS,
              ZERO_SERIALIZATION_5184,
              normalized_genesis_witness,
          )

          witness = normalized_genesis_witness()
          assert witness['all_qudit_offsets_zero'] is True
          assert tuple(witness['offsets']) == ZERO_OFFSETS
          assert len(ZERO_SERIALIZATION_5184) == 5184

          with tempfile.TemporaryDirectory() as root:
              with Pass219Lane5ThreadLineageMemory(root) as memory:
                  status = memory.status()
                  assert status['physical_database_fabric'] == 'shared'
                  assert status['logical_thread_indexes'] is True
                  assert status['namespace_prefilter_before_vector_rank'] is True
                  assert status['scope_union_escalation_allowed'] is False
                  assert status['pqc_witness_required'] is True
                  assert status['canonical_vm81_mutation_authority'] is False
                  assert status['canonical_hash72_authority'] is False
                  assert status['canonical_hash216_commit_authority'] is False
                  print(json.dumps(status, sort_keys=True))
          PY

      - name: Seal 1.60 validation summary
        run: |
          mkdir -p artifacts/pass219/1.60
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path

          summary = {
              'schema': 'HHS_PASS219_LANE5_THREAD_LINEAGE_NORMALIZATION_EVIDENCE_1_60',
              'result': 'PASS',
              'theorem': 'HHS-T5184-005',
              'wolfram_checks': 17,
              'normalized_vm81_zero_offsets': 81,
              'fixed_width_characters': 5184,
              'thread_root_boundary_derived': True,
              'scope_composition': 'intersection',
              'shared_physical_sql_fabric': True,
              'logical_thread_partition_index': True,
              'namespace_prefilter_before_vector_rank': True,
              'cross_thread_scope_expansion_allowed': False,
              'pqc_witness_bound': True,
              'floating_point_canonical_authority': False,
              'canonical_vm81_mutation_authority': False,
              'canonical_hash72_authority': False,
              'canonical_hash216_commit_authority': False,
          }
          canonical = json.dumps(summary, sort_keys=True, separators=(',', ':')).encode()
          summary['receipt_sha256'] = sha256(canonical).hexdigest()
          Path('artifacts/pass219/1.60/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pass219-lane5-thread-lineage-normalization-1-60
          path: artifacts/pass219/1.60/
          if-no-files-found: error
