name: Pass 220 Reciprocal Modality Witness Binding
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_reciprocal_modality_witness_binding_v1.py"
      - "tests/pass220/test_pass220_reciprocal_modality_witness_binding_v1.py"
      - ".github/workflows/pass220-reciprocal-modality-witness-binding.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  executable-reciprocal-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Check exact reversible codec witness and fail-closed scope
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_reciprocal_modality_witness_binding_v1.py
