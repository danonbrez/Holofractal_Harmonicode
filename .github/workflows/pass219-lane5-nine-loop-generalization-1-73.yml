name: Pass 219 Lane 5 Nine-Loop Generalization Discovery 1.73

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_GENERALIZATION_1_73.json'
      - 'hhs_runtime/pass219/lane5_nine_loop_generalization_1_73.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_generalization_1_73.py'
      - '.github/workflows/pass219-lane5-nine-loop-generalization-1-73.yml'
  push:
    branches:
      - main
      - agent/pass219-lane5-nine-loop-generalization-1-73-20260928
    paths:
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_GENERALIZATION_1_73.json'
      - 'hhs_runtime/pass219/lane5_nine_loop_generalization_1_73.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_generalization_1_73.py'
      - '.github/workflows/pass219-lane5-nine-loop-generalization-1-73.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-generalization-1-73:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped test dependency
        run: python -m pip install pytest numpy

      - name: Run 1.73 discovery and parent regressions
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_lane5_nine_loop_generalization_1_73.py \
            tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_1_72.py \
            tests/pass219/test_pass219_lane5_nine_loop_training_specimen_1_71.py \
            tests/pass219/test_pass219_lane5_nine_loop_feedback_1_70.py \
            tests/pass219/test_pass219_lane5_nine_loop_large_artifact_1_69.py \
            tests/pass219/test_pass219_lane5_nine_loop_source_attestation_1_68.py \
            tests/pass219/test_pass219_lane5_nine_loop_foreign_equivalence_1_67.py

      - name: Emit exact 1.73 discovery receipt
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from hhs_runtime.pass219.lane5_nine_loop_generalization_1_73 import (
              run_generalization,
          )
          receipt = run_generalization()
          assert receipt["accuracy"] == {"numerator": 12, "denominator": 12}
          assert receipt["semantic_drift_count"] == 0
          assert receipt["replay_count"] == 12
          assert receipt["model_weight_update_authority"] is False
          assert receipt["learning_commit_authority"] is False
          print("PASS219_1_73_DISCOVERY=" + json.dumps(receipt, sort_keys=True))
          PY
