name: Pass 220 Reuse Evidence Gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/pass220/lane5_reuse_evidence_gate.py'
      - 'tests/pass220/test_lane5_reuse_evidence_gate.py'
      - '.github/workflows/pass220-reuse-evidence-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/pass220/test_lane5_trajectory_constructor_evidence.py tests/pass220/test_lane5_structural_reuse_candidate.py tests/pass220/test_lane5_reuse_evidence_gate.py
