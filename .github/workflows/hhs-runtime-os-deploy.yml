name: Validate HHS Runtime OS Production Root

on:
  push:
    branches: [main]
    paths:
      - "hhs_gui/**"
      - "hhs_backend/runtime_os_projection.py"
      - "hhs_backend/runtime_os_visual_server.py"
      - "hhs_backend/runtime_os_application_server.py"
      - "hhs_backend/production_visual_server.py"
      - "hhs_backend/cached_visual_server.py"
      - "hhs_backend/visual_server.py"
      - "hhs_backend/server.py"
      - "hhs_backend/api/**"
      - "hhs_backend/runtime/**"
      - "hhs_python/runtime/**"
      - "deployment/digitalocean/guarded_auto_update/**"
      - "deployment/digitalocean/pass205_state/**"
      - "deploy/digitalocean/hhs-pass196-integrated-environment.service"
      - "tests/test_runtime_os_production_root.py"
      - "tests/test_production_visual_server.py"
      - "tests/test_hhs_pass205_*"
      - "bin/post_compile"
      - "Procfile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "hhs_gui/**"
      - "hhs_backend/runtime_os_projection.py"
      - "hhs_backend/runtime_os_visual_server.py"
      - "hhs_backend/runtime_os_application_server.py"
      - "hhs_backend/production_visual_server.py"
      - "hhs_backend/cached_visual_server.py"
      - "hhs_backend/visual_server.py"
      - "hhs_backend/server.py"
      - "hhs_backend/api/**"
      - "hhs_backend/runtime/**"
      - "hhs_python/runtime/**"
      - "deployment/digitalocean/guarded_auto_update/**"
      - "deployment/digitalocean/pass205_state/**"
      - "deploy/digitalocean/hhs-pass196-integrated-environment.service"
      - "tests/test_runtime_os_production_root.py"
      - "tests/test_production_visual_server.py"
      - "tests/test_hhs_pass205_*"
      - "bin/post_compile"
      - "Procfile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hhs-runtime-os-production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-runtime-os-production-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install production validation requirements
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 600s python -m pip install -r requirements.txt

      - name: Build inherited native runtime authority
        env:
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "0.5"
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Retain Pass 205 authority and transport gates
        if: ${{ hashFiles('hhs_backend/runtime/hhs_pass205_governed_continuation_v2.py') != '' }}
        env:
          HHS_PASS205_DB: ${{ runner.temp }}/pass205-runtime-os.sqlite3
        run: |
          set -euo pipefail
          bash -n bin/post_compile
          bash -n deployment/digitalocean/pass205_state/install.sh
          python -m py_compile \
            hhs_python/runtime/__init__.py \
            hhs_python/runtime/hhs_pass205_native_freshness_guard.py \
            hhs_backend/runtime/hhs_pass205_governed_continuation_v2.py \
            hhs_backend/runtime/hhs_pass205_retrieval_order_v1.py \
            hhs_backend/api/a0_pass205_transport_bootstrap.py \
            hhs_backend/api/a_pass205_governed_bootstrap.py
          python - <<'PY'
          from hhs_python.runtime.hhs_pass205_continuation_bridge import build_native_library
          print(build_native_library(force=True))
          PY
          timeout 600s pytest -q \
            tests/test_hhs_pass205_native_freshness_guard_v1.py \
            tests/test_hhs_pass205_state_deployment_v1.py \
            tests/test_hhs_pass205_governed_continuation_v2.py \
            tests/test_hhs_pass205_transport_and_retrieval_v1.py
          timeout 900s pytest -q tests/test_hhs_pass205_continuation_runtime_v1.py

      - name: Validate TypeScript Runtime OS source and build
        working-directory: hhs_gui
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm run test:calculator
          npm run test:e2e:source
          npm run test:workspace:source
          npm run test:frontend-telemetry:source
          npm run build
          test -s dist/index.html
          test -d dist/assets
          grep -F "HHS Visual Runtime OS Workspace" dist/index.html
          grep -F "/assets/index-" dist/index.html

      - name: Compile production projection
        run: |
          set -euo pipefail
          python -m py_compile \
            hhs_backend/runtime_os_projection.py \
            hhs_backend/runtime_os_visual_server.py \
            hhs_backend/runtime_os_application_server.py \
            hhs_backend/cached_visual_server.py \
            hhs_backend/production_visual_server.py \
            tests/test_runtime_os_production_root.py \
            tests/test_production_visual_server.py

      - name: Enforce Runtime OS public-root authority
        run: |
          set -euo pipefail
          grep -F 'RUNTIME_OS_SOURCE_ROOT = ROOT_DIR / "hhs_gui"' hhs_backend/runtime_os_projection.py
          grep -F 'os.environ.get("HHS_RUNTIME_OS_ASSET_ROOT")' hhs_backend/runtime_os_projection.py
          grep -F 'DEFAULT_PUBLIC_MOUNT_NAME = "hhs-runtime-os-home"' hhs_backend/runtime_os_projection.py
          grep -F 'from hhs_backend.runtime_os_visual_server import app as authoritative_app' hhs_backend/production_visual_server.py
          grep -F 'hhs_backend.production_visual_server:app' deploy/digitalocean/hhs-pass196-integrated-environment.service
          grep -F 'Environment=HHS_RUNTIME_OS_ASSET_ROOT=/var/lib/hhs/runtime-os/dist' deploy/digitalocean/hhs-pass196-integrated-environment.service
          grep -F 'OUTPUT_ROOT=/var/lib/hhs/runtime-os/dist' deployment/digitalocean/guarded_auto_update/build-runtime-os.sh
          grep -F 'hhs_backend.runtime_os_application_server:app' Procfile
          if grep -Fq 'from hhs_backend.visual_server import app as authoritative_app' hhs_backend/production_visual_server.py; then
            echo 'DigitalOcean production gateway still bypasses the Runtime OS projection' >&2
            exit 1
          fi
          if grep -Fq 'hhs_backend.application_ide_server:app' Procfile; then
            echo 'Procfile still bypasses the Runtime OS application projection' >&2
            exit 1
          fi
          if grep -Fq 'legacy_harmonizer_is_public_root": True' hhs_backend/runtime_os_projection.py; then
            echo 'Legacy Harmonizer was re-promoted to production root' >&2
            exit 1
          fi

      - name: Verify inherited backend routes remain ahead of SPA fallback
        env:
          HHS_DISABLE_C_AUTOBUILD: "1"
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_RUNTIME_STATUS_PROBE: "0"
        run: |
          timeout 180s python - <<'PY'
          from pathlib import Path
          from hhs_backend.runtime_os_projection import API_FALLBACK_PATH
          from hhs_backend.runtime_os_visual_server import PUBLIC_MOUNT_NAME, RUNTIME_OS_ROOT, app

          assert RUNTIME_OS_ROOT == Path('hhs_gui/dist').resolve()
          routes = list(app.router.routes)
          paths = [str(getattr(route, 'path', '')) for route in routes]
          names = [str(getattr(route, 'name', '')) for route in routes]
          required = {
              '/api/system/status',
              '/api/interface/status',
              '/api/runtime/services',
              '/api/runtime/services/dispatch',
              '/api/runtime/workspace/command',
              '/api/runtime/installation/status',
              '/api/assistant/status',
              '/api/assistant/chat',
              '/api/public/status',
              '/ws/runtime',
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f'missing inherited production routes: {missing}')
          if PUBLIC_MOUNT_NAME not in names:
              raise SystemExit('Runtime OS public root mount missing')
          if 'hhs-visual-home' in names:
              raise SystemExit('legacy Harmonizer root still mounted')
          root_index = names.index(PUBLIC_MOUNT_NAME)
          for path in required:
              route_index = paths.index(path)
              if route_index >= root_index:
                  raise SystemExit(f'route shadowed by Runtime OS SPA mount: {path}')
          if API_FALLBACK_PATH in paths:
              interface_index = paths.index('/api/interface/status')
              fallback_index = paths.index(API_FALLBACK_PATH)
              if not interface_index < fallback_index < root_index:
                  raise SystemExit('projection-owned API route/fallback/root ordering is invalid')
          PY

      - name: Run dependency-scoped production-root regressions
        env:
          HHS_DISABLE_C_AUTOBUILD: "1"
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_RUNTIME_STATUS_PROBE: "0"
        run: |
          timeout 600s python -m pytest -q \
            tests/test_runtime_os_production_root.py \
            tests/test_production_visual_server.py

      - name: Upload Runtime OS production build
        uses: actions/upload-artifact@v4
        with:
          name: hhs-runtime-os-production-root
          path: |
            hhs_gui/dist/index.html
            hhs_gui/dist/assets/**
          if-no-files-found: error
          retention-days: 14
