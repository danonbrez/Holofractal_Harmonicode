name: Pass 219 I149 Pass 177 Cumulative Binding

on:
  push:
    branches:
      - agent/pass219-iteration149-pass177-workflow-authority-reconciliation
    paths:
      - 'hhs_runtime/include/hhs_pass219_inherited_pass177_1_49.*'
      - 'hhs_runtime/c/hhs_pass219_inherited_pass177_1_49.inc'
      - 'hhs_runtime/hhs_pass219_cumulative_pass_membrane_i149_pass177.py'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'contracts/pass219/PASS_219_GLOBAL_CANONICAL_DEFAULTS_1_0.json'
      - 'hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h'
      - 'hhs_runtime/c/hhs_pass219_global_canonical_defaults_1_0.inc'
      - 'tools/validate_pass219_global_canonical_defaults.py'
      - 'tests/pass219/test_pass219_inherited_pass177_1_49.*'
      - 'tests/pass219/test_pass219_cumulative_pass177_membrane_i149.py'
      - 'tests/pass219/test_pass219_global_canonical_defaults_1_0.*'
      - 'evidence/pass177/i149/PASS_219_I149_PASS177_WORKFLOW_AUTHORITY_RECEIPT_INDEX.json'
      - '.github/workflows/pass219-i149-pass177-cumulative-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i149-pass177-cumulative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pass177-cumulative-i149:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: '0'
      HHS_COGNITION_AUTO_TICK: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped Python packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install pytest 'cryptography>=46.0,<47.0' 'fastapi>=0.128,<1.0' 'pydantic>=2.7,<3.0'

      - name: Verify frozen Pass 177 authority evidence
        run: |
          git merge-base --is-ancestor 15fa5a458c6755eab4d1af4b405b83b3467d45d9 HEAD
          test "$(git hash-object evidence/pass177/i149/PASS_219_I149_PASS177_WORKFLOW_AUTHORITY_RECEIPT_INDEX.json)" = "357365c6c55df87b1c199e64fb53d889c7315249"
          grep -F '"workflow_run_id": 33632013615' evidence/pass177/i149/PASS_219_I149_PASS177_WORKFLOW_AUTHORITY_RECEIPT_INDEX.json
          grep -F '"conclusion": "success"' evidence/pass177/i149/PASS_219_I149_PASS177_WORKFLOW_AUTHORITY_RECEIPT_INDEX.json

      - name: Build inherited exact runtime shared library
        run: |
          timeout 600s make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Run current Pass 177 authority and historical workflow conformance
        run: |
          PYTHONPATH="$PWD" python -m pytest -q             tests/test_hhs_pass177_authority.py             tests/pass219/test_pass219_cumulative_pass177_membrane_i149.py
          node --test applications/holofractal_harmonizer/tests/pass177-module-workflow.test.mjs

      - name: Run I149 cumulative membrane
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          from hhs_runtime.hhs_pass219_cumulative_pass_membrane_i149_pass177 import execute_pass177_membrane_preflight
          result=execute_pass177_membrane_preflight()
          assert result["ok"] is True
          assert result["census"]["wired_floor"]==177
          assert result["census"]["binding_count"]==44
          assert result["exact_binding"]["terminal_completion_claimed"] is False
          assert result["exact_binding"]["repair_forward_required"] is True
          assert result["historical_truth"]["historical_stage_truth_preserved"] is True
          print(result["classification"])
          PY

      - name: Preserve global canonical defaults and multimodal generalization
        run: |
          python tools/validate_pass219_global_canonical_defaults.py
          python tools/validate_pass219_multimodal_optimization_generalization.py
          python tools/hhs_multimodal_optimization_generalizer.py validate-all

      - name: Compile aggregate exact ABI and Pass 177 C/C++ conformance
        run: |
          mkdir -p /tmp/pass219-i149
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -c hhs_runtime/c/hhs_runtime_exact_abi.c -o /tmp/pass219-i149/exact.o
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass186_x64_vm81_q144/include -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_vm81_q144_abi.c -o /tmp/pass219-i149/pass186.o
          gcc -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_registers.S -o /tmp/pass219-i149/registers.o
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass177_1_49.c /tmp/pass219-i149/exact.o /tmp/pass219-i149/pass186.o /tmp/pass219-i149/registers.o -o /tmp/pass219-i149/pass177-c
          /tmp/pass219-i149/pass177-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass177_1_49.cpp /tmp/pass219-i149/exact.o /tmp/pass219-i149/pass186.o /tmp/pass219-i149/registers.o -o /tmp/pass219-i149/pass177-cpp
          /tmp/pass219-i149/pass177-cpp
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.c /tmp/pass219-i149/exact.o /tmp/pass219-i149/pass186.o /tmp/pass219-i149/registers.o -o /tmp/pass219-i149/defaults-c
          /tmp/pass219-i149/defaults-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.cpp /tmp/pass219-i149/exact.o /tmp/pass219-i149/pass186.o /tmp/pass219-i149/registers.o -o /tmp/pass219-i149/defaults-cpp
          /tmp/pass219-i149/defaults-cpp

      - name: Assert Pass 177 nonterminal authority boundary
        run: |
          grep -F 'terminal_pass177_completion_claimed() noexcept { return false; }' hhs_runtime/include/hhs_pass219_inherited_pass177_1_49.hpp
          grep -F 'repair_forward_required() noexcept { return true; }' hhs_runtime/include/hhs_pass219_inherited_pass177_1_49.hpp
          grep -F 'browser_identity_authority() noexcept { return false; }' hhs_runtime/include/hhs_pass219_inherited_pass177_1_49.hpp
          grep -F 'memory_checkpoint_authority() noexcept { return false; }' hhs_runtime/include/hhs_pass219_inherited_pass177_1_49.hpp
          grep -F '#define HHS_EXACT_PASS219_GLOBAL_DEFAULT_WIRED_FLOOR 177U' hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h
          grep -F '#define HHS_EXACT_PASS219_GLOBAL_DEFAULT_BINDING_COUNT 44U' hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.h
          grep -F "status: 'source-validated'" applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs
          grep -F "mode: 'source-preserving'" applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs
          grep -F "independentOfCompilation: true" applications/holofractal_harmonizer/src/pass177/workflow-engine.mjs

      - name: Emit exact-head cumulative nonterminal receipt
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p evidence/pass177/i149
          PYTHONPATH="$PWD" python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from hhs_runtime.hash72_checkpoint import make_hash72_witness
          from hhs_runtime.hhs_pass219_cumulative_pass_membrane_i149_pass177 import execute_pass177_membrane_preflight

          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          tree=subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip()
          preflight=execute_pass177_membrane_preflight()
          payload={
              "schema":"PASS_219_I149_PASS177_CUMULATIVE_VALIDATION_RECEIPT_V1",
              "repository":"danonbrez/Holofractal_Harmonicode",
              "branch":"agent/pass219-iteration149-pass177-workflow-authority-reconciliation",
              "head_sha":head,
              "tree_sha":tree,
              "workflow_run_id":int(os.environ["RUN_ID"]),
              "workflow_run_attempt":int(os.environ["RUN_ATTEMPT"]),
              "classification":"HHS_PASS177_I149_CUMULATIVE_NONTERMINAL_VERIFIED",
              "preflight":preflight,
              "global_census":{"wired_ceiling":218,"wired_floor":177,"binding_count":44},
              "closure":{
                  "cumulative_pass177_binding_added":True,
                  "terminal_pass177_completion":False,
                  "repair_forward_required":True,
                  "historical_stage_truth_preserved":True,
                  "merge_performed":False,
                  "authoritative_main_verification":False,
                  "deployment_performed":False,
              },
          }
          receipt=make_hash72_witness("pass177:i149:cumulative",payload,width=72).digest
          lanes=[
              make_hash72_witness("pass177:i149:cumulative:previous",{"head":head,"receipt":receipt},width=72).digest,
              make_hash72_witness("pass177:i149:cumulative:change",{"tree":tree,"receipt":receipt},width=72).digest,
              make_hash72_witness("pass177:i149:cumulative:receipt",payload,width=72).digest,
          ]
          payload["receipt_hash72"]=receipt
          payload["archive_hash216"]="".join(lanes)
          Path("evidence/pass177/i149/PASS_219_I149_PASS177_CUMULATIVE_VALIDATION_RECEIPT.json").write_text(json.dumps(payload,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"classification":payload["classification"],"head":head,"receipt_hash72":receipt,"archive_hash216":payload["archive_hash216"]},sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i149-pass177-cumulative-binding
          path: evidence/pass177/i149/PASS_219_I149_PASS177_CUMULATIVE_VALIDATION_RECEIPT.json
          if-no-files-found: warn
          retention-days: 30
