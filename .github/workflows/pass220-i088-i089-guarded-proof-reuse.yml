name: Pass 220 I088 I089 Guarded Proof Reuse

on:
  pull_request:
    branches: [main]
    paths:
      - "hhs_runtime/hhs_pass220_i088_i089_guarded_successor_proof_reuse_v1.py"
      - "tests/pass220/test_i088_i089_guarded_successor_proof_reuse.py"
      - ".github/workflows/pass220-i088-i089-guarded-proof-reuse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guarded-successor-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m py_compile hhs_runtime/hhs_pass220_i088_i089_guarded_successor_proof_reuse_v1.py tests/pass220/test_i088_i089_guarded_successor_proof_reuse.py
      - run: PYTHONPATH=. python -m pytest -q tests/pass220/test_i088_i089_guarded_successor_proof_reuse.py
