name: Pass 220 Python1 Native BigInt Execution

on:
  pull_request:
    paths:
      - 'native_projects/hhs_pass220_python_native_execution/**'
      - 'hhs_runtime/hhs_pass220_python_native_execution_v1.py'
      - 'tests/pass220/test_hhs_pass220_python_native_execution_v1.py'
      - 'contracts/pass220/PASS_220_PYTHON1_NATIVE_BIGINT_EXECUTION_V1.json'
      - 'docs/pass220/PASS_220_PYTHON1_NATIVE_BIGINT_EXECUTION.md'
      - '.github/workflows/pass220-python1-native-bigint-execution.yml'
  push:
    branches: [main]
    paths:
      - 'native_projects/hhs_pass220_python_native_execution/**'
      - 'hhs_runtime/hhs_pass220_python_native_execution_v1.py'
      - 'tests/pass220/test_hhs_pass220_python_native_execution_v1.py'
      - 'contracts/pass220/PASS_220_PYTHON1_NATIVE_BIGINT_EXECUTION_V1.json'
      - 'docs/pass220/PASS_220_PYTHON1_NATIVE_BIGINT_EXECUTION.md'
      - '.github/workflows/pass220-python1-native-bigint-execution.yml'

permissions:
  contents: read

jobs:
  python-native-bigint-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install differential-test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile and run strict C11 Python execution kernel
        run: make -C native_projects/hhs_pass220_python_native_execution clean all test
      - name: Run CPython differential and fail-closed gates
        run: python -m pytest -q tests/pass220/test_hhs_pass220_python_native_execution_v1.py
