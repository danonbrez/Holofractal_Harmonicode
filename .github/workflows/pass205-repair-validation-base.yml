name: Pass 205 Repair Validation Base

on:
  pull_request:
    paths:
      - 'hhs_runtime/c/hhs_pass205_continuation.h'
      - 'hhs_runtime/c/hhs_pass205_continuation.c'
      - 'hhs_runtime/src/hhs_hash216.c'
      - 'hhs_runtime/include/hhs_hash216_bytes.h'
      - 'hhs_python/runtime/hhs_pass205_continuation_bridge.py'
      - 'hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py'
      - 'hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py'
      - 'hhs_backend/api/pass205_continuation_routes.py'
      - 'tests/test_hhs_pass205_continuation_runtime_v1.py'
      - 'deployment/digitalocean/guarded_auto_update/**'
      - 'bin/post_compile'
      - '.github/workflows/pass205-repair-validation-base.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONFAULTHANDLER: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  validate-pass205-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Bind runner-local HHS_PASS205_DB
        shell: bash
        run: echo "HHS_PASS205_DB=$RUNNER_TEMP/pass205-repair.sqlite3" >> "$GITHUB_ENV"

      - name: Checkout exact merge tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate current Pass 205 shell and Python surfaces
        run: |
          bash -n bin/post_compile
          python -m py_compile \
            hhs_python/runtime/hhs_pass205_continuation_bridge.py \
            hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py \
            hhs_backend/runtime/hhs_pass205_accelerator_translation_v1.py \
            hhs_backend/api/pass205_continuation_routes.py \
            tests/test_hhs_pass205_continuation_runtime_v1.py

      - name: Build native authorities
        run: |
          make c-abi
          python - <<'PY'
          import ctypes
          from hhs_python.runtime.hhs_pass205_continuation_bridge import build_native_library
          path = build_native_library(force=True)
          ctypes.CDLL(str(path))
          print(path)
          PY

      - name: Run current Pass 205 production tests
        run: python -m pytest -q tests/test_hhs_pass205_continuation_runtime_v1.py

      - name: Verify current Pass 205 authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from hhs_backend.runtime.hhs_pass205_continuation_runtime_v1 import Pass205ContinuationRuntime

          runtime = Pass205ContinuationRuntime(Path(r"${{ runner.temp }}") / "pass205-authority.sqlite3")
          status = runtime.status()
          assert status["state_bits"] == 5184
          assert status["hydration_projection_count"] == 1_259_712
          assert status["single_vm81_mutation_authority"]
          assert status["single_ordered_hash72_commit_stream"]
          assert status["cache_hit_bypasses_admission"] is False
          assert status["accelerator_translation"]["physical_gpu_backend_active"] is False
          PY

      - name: Run inherited federation and guarded deployment tests
        run: |
          python -m unittest -v tests.test_hhs_pass201_public_api_federation_v1
          python -m pytest -q tests/test_hhs_guarded_auto_update_contract_v1.py
