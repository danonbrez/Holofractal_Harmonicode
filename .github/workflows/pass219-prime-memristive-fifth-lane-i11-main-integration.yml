name: Pass 219 Prime Memristive Fifth Lane I11 Main Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_*.md'
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_*.hpp'
      - 'hhs_backend/runtime/hhs_pass219_five_lane_bigint_address_v1.py'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_*.cpp'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_i11_bigint_address.py'
      - 'hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h'
      - 'hhs_runtime/canonical.py'
      - 'hhs_runtime/palindromic_ecc.py'
      - 'hhs_backend/runtime/hhs_pass211_bigint_hfc_carrier_v1.py'
      - '.github/workflows/pass219-prime-memristive-fifth-lane-i11-main-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-main-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out PR merged tree
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Verify exact authority membranes
        run: |
          python - <<'PY'
          from pathlib import Path
          holo4 = Path('hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h').read_text()
          i11 = Path('hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_10.hpp').read_text()
          canonical = Path('hhs_runtime/canonical.py').read_text()
          pass211 = Path('hhs_backend/runtime/hhs_pass211_bigint_hfc_carrier_v1.py').read_text()
          assert '#define HHS_EXACT_PASS219_HOLO4_LANE_COUNT UINT32_C(4)' in holo4
          assert 'pass133_canonical_bigint_serialization{true}' in i11
          assert 'pass211_hfc_frame_compatible{true}' in i11
          assert 'canonical_mutation_authority{false}' in i11
          assert 'canonical_hash216_authority{false}' in i11
          assert 'requires_inherited_vm81_hash216_admission{true}' in i11
          assert 'def bigint_to_bytes(value: int) -> bytes:' in canonical
          assert 'class Pass211BigIntHFCRuntime:' in pass211
          print('lane5_i11_main_authority_gate=PASS')
          PY

      - name: Build current-main exact ABI
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_holo4_prepare'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_hash216_transition_init'

      - name: Run I11 merged-tree native address and winner execution
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_10.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i11-main
          /tmp/test-pass219-prime-memristive-fifth-lane-i11-main
          test -s /tmp/pass219_i11_address.hex

      - name: Run merged-tree Pass133 and Pass211 interoperability
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/pass219/test_pass219_prime_memristive_fifth_lane_i11_bigint_address.py \
            /tmp/pass219_i11_address.hex

      - name: Verify current-main Pass211 reference path
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import math
          from hhs_backend.runtime.hhs_pass211_bigint_hfc_carrier_v1 import Pass211BigIntHFCRuntime
          runtime = Pass211BigIntHFCRuntime()
          source = math.factorial(72)
          package = runtime.encode(source)
          decoded = runtime.decode(package)
          assert decoded['ciphertext_hex'] == hex(source)
          print(f'lane5_i11_main_pass211_reference=PASS shards={package.shard_count}')
          PY

      - name: Verify current-main inherited Holo4 authority
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_core_holographic_four_lane_1_24.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-core-holo4-main
          /tmp/test-core-holo4-main
