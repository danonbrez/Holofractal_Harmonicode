  workflow_dispatch:

permissions:
  contents: read

jobs:
  harmonic36-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Strict C11 kernel compile
        run: |
          mkdir -p /tmp/h36
          gcc -x c -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             -c hhs_runtime/c/hhs_pass219_harmonic36_nested_vm_1_0.inc             -o /tmp/h36/core.o
          gcc -x c -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             -c hhs_runtime/c/hhs_pass219_harmonic36_default_binding_1_0.inc             -o /tmp/h36/binding.o
          gcc -x c -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_pass219_harmonic36_ka10_monitor_profile_1_9.inc \
            -o /tmp/h36/monitor.o

      - name: Exact 5184 nested VM conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_harmonic36_nested_vm_1_0.c             /tmp/h36/core.o             -o /tmp/h36/test-vm
          /tmp/h36/test-vm

      - name: Legacy 36-bit ISA 1.1 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_legacy_isa_1_1.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-legacy-isa
          /tmp/h36/test-legacy-isa

      - name: Two-word 36-bit ISA 1.2 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_two_word_isa_1_2.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-two-word-isa
          /tmp/h36/test-two-word-isa

      - name: Control stack I-O ISA 1.3 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_control_io_isa_1_3.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-control-io
          /tmp/h36/test-control-io

      - name: Privilege JRST PI 1.4 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_privilege_pi_1_4.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-privilege-pi
          /tmp/h36/test-privilege-pi

      - name: KA10 historical UUO 1.5 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_ka10_uuo_1_5.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-ka10-uuo
          /tmp/h36/test-ka10-uuo

      - name: KA10 console devices 1.6 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_ka10_console_devices_1_6.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-ka10-devices
          /tmp/h36/test-ka10-devices

      - name: KA10 RIM bootstrap 1.7 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_ka10_rim_bootstrap_1_7.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-ka10-rim
          /tmp/h36/test-ka10-rim

      - name: KA10 APR PI 1.8 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_ka10_apr_pi_1_8.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-ka10-apr-pi
          /tmp/h36/test-ka10-apr-pi

      - name: KA10 monitor profile 1.9 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_ka10_monitor_profile_1_9.c \
            /tmp/h36/core.o /tmp/h36/monitor.o \
            -o /tmp/h36/test-ka10-monitor
          /tmp/h36/test-ka10-monitor

      - name: Arithmetic flag fidelity conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_arithmetic_flags_1_3.c \
            /tmp/h36/core.o \
            -o /tmp/h36/test-arithmetic-flags
          /tmp/h36/test-arithmetic-flags

      - name: Mandatory default binding conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_harmonic36_default_binding_1_0.c             /tmp/h36/binding.o             -o /tmp/h36/test-binding
          /tmp/h36/test-binding

      - name: C++17 RNA facade conformance
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_harmonic36_nested_vm_1_0.cpp             /tmp/h36/core.o             -o /tmp/h36/test-cpp
          /tmp/h36/test-cpp

      - name: Exact cumulative ABI compile
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/h36/exact-abi.o

      - name: H36 stack selector 1.10 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_stack_selection_1_10.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-stack-selection
          /tmp/h36/test-stack-selection

      - name: H36 global 25/3 latency policy 1.16 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_global_latency_policy_1_16.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-h36-global-latency
          /tmp/h36/test-h36-global-latency

      - name: H36 stack-selection cache 1.11 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_stack_selection_cache_1_11.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-stack-cache
          /tmp/h36/test-stack-cache

      - name: H36 branch-reference cache 1.17 conformance
        run: |
          gcc -O3 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_branch_reference_cache_1_17.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-branch-ref-cache
          /tmp/h36/test-branch-ref-cache

      - name: Exact factorization fabric conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_factorization_fabric_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-fabric
          /tmp/h36/test-fabric

      - name: Hash216 RNA binding conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_hash216_rna_binding_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-hash216-rna
          /tmp/h36/test-hash216-rna

      - name: Compression GPU fabric conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_compression_gpu_fabric_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-compression-gpu
          /tmp/h36/test-compression-gpu

      - name: Branch knowledge fabric conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_branch_knowledge_fabric_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-branch-knowledge
          /tmp/h36/test-branch-knowledge

      - name: Composition grammar 1.0 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_composition_grammar_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-composition
          /tmp/h36/test-composition

      - name: Composition programs 1.1 conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_composition_programs_1_1.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-composition-programs
          /tmp/h36/test-composition-programs

      - name: Canonical Pass128 graph bridge self-test
        run: |
          PYTHONPATH=. python - <<'PY'
          from hhs_runtime.hhs_pass219_harmonic36_knowledge_graph_bridge_v1 import (
              pass219_harmonic36_knowledge_graph_self_test,
          )
          result = pass219_harmonic36_knowledge_graph_self_test()
          assert result["status"] == "PASS"
          assert result["execution_authority"] is False
          assert result["mutation_authority"] is False
          PY

      - name: Composition Pass128 graph bridge self-test
        run: |
          PYTHONPATH=. python - <<'PY'
          from hhs_runtime.hhs_pass219_harmonic36_composition_graph_bridge_v1 import (
              pass219_harmonic36_composition_graph_self_test,
          )
          result = pass219_harmonic36_composition_graph_self_test()
          assert result["status"] == "PASS"
          assert result["execution_authority"] is False
          assert result["mutation_authority"] is False
          PY

      - name: No canonical floating implementation
        run: |
          if grep -nE '\b(float|double)\b' \
            hhs_runtime/include/hhs_pass219_harmonic36_nested_vm_1_0.h \
            hhs_runtime/include/hhs_pass219_harmonic36_nested_vm_1_0.hpp \
            hhs_runtime/c/hhs_pass219_harmonic36_nested_vm_*.inc \
            hhs_runtime/include/hhs_pass219_harmonic36_ka10_monitor_profile_1_9.h \
            hhs_runtime/c/hhs_pass219_harmonic36_ka10_monitor_profile_1_9.inc \
            hhs_runtime/include/hhs_pass219_harmonic36_stack_selection_1_10.h \
            hhs_runtime/c/hhs_pass219_harmonic36_stack_selection_1_10.inc \
            hhs_runtime/include/hhs_pass219_harmonic36_stack_selection_cache_1_11.h \
            hhs_runtime/c/hhs_pass219_harmonic36_stack_selection_cache_1_11.inc \
            hhs_runtime/include/hhs_pass219_harmonic36_branch_reference_cache_1_17.h \
            hhs_runtime/c/hhs_pass219_harmonic36_branch_reference_cache_1_17.inc; then
            echo "Canonical floating type detected in Harmonic36 kernel"
            exit 1
          fi
      - name: Measured H36 optimization winners
        run: |
          mkdir -p artifacts/pass219/harmonic36
          gcc -O3 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/h36/exact-opt.o
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/harmonic36_optimization_benchmark.cpp \
            /tmp/h36/exact-opt.o \
            -o /tmp/h36/h36-benchmark
          /tmp/h36/h36-benchmark \
            artifacts/pass219/harmonic36/optimization_benchmark.json
          cat artifacts/pass219/harmonic36/optimization_benchmark.json
          python - <<'PY'
          import json
          p='artifacts/pass219/harmonic36/optimization_benchmark.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['physical_gpu_measured'] is False
          assert d['authoritative_state_changed'] is False
          assert d['transcode']['exact_result_equal'] is True
          assert d['hfc_reconstruction']['exact_result_equal'] is True
          assert d['gpu_locality_cpu_reference']['exact_selected_equal'] is True
          assert d['native_cache_address']['exact_result_equal'] is True
          assert d['all_candidate_winners'] is True
          PY

      - name: Measured H36 KA10 versus Linux x86_64 stack selection
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/harmonic36_stack_selection_benchmark.cpp \
            /tmp/h36/exact-opt.o \
            -o /tmp/h36/h36-stack-benchmark
          /tmp/h36/h36-stack-benchmark \
            artifacts/pass219/harmonic36/stack_selection_benchmark.json
          cat artifacts/pass219/harmonic36/stack_selection_benchmark.json
          python - <<'PY'
          import json
          p='artifacts/pass219/harmonic36/stack_selection_benchmark.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['platform']['linux'] is True
          assert d['platform']['x86_64'] is True
          assert d['workload']['exact_result_equal_before_timing'] is True
          assert d['selection']['exact_equality_before_timing'] is True
          assert d['selection']['timing_executed'] is True
          assert d['selection']['measured_winner'] is True
          assert d['selection']['selected_candidate_id'] in (1, 2)
          assert d['selection']['selected_stack'] in (
              'H36_KA10_MONITOR', 'LINUX_X86_64_POSIX')
          assert d['h36_ka10_monitor']['vector_key216_length'] == 216
          assert d['linux_x86_64_posix']['vector_key216_length'] == 216
          assert d['h36_ka10_monitor']['hash216_lineage_claim'] is False
          assert d['linux_x86_64_posix']['hash216_lineage_claim'] is False
          assert d['selection']['vector_store_metadata_only'] is True
          assert d['generalization_bridge']['compatible_unvalidated'] == 'VALIDATION_REQUIRED'
          assert d['generalization_bridge']['compatible_safe_beneficial'] == 'GENERALIZE_REQUIRED'
          assert all(value is False for value in d['authority'].values())
          assert d['authoritative_state_changed'] is False
          PY

      - name: Measure H36 stack-selection cache versus fresh selector
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/harmonic36_stack_selection_cache_benchmark.cpp \
            /tmp/h36/exact-opt.o \
            -o /tmp/h36/h36-stack-cache-benchmark
          /tmp/h36/h36-stack-cache-benchmark \
            artifacts/pass219/harmonic36/stack_selection_cache_benchmark.json
          cat artifacts/pass219/harmonic36/stack_selection_cache_benchmark.json
          python - <<'PY'
          import json
          p='artifacts/pass219/harmonic36/stack_selection_cache_benchmark.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['platform']['linux'] is True
          assert d['platform']['x86_64'] is True
          assert d['identity']['workload_signature36'] == 3734727431
          assert str(d['identity']['semantic_result_signature64']) == '4176962402124975431'
          assert d['identity']['selected_candidate_id'] == 1
          assert d['identity']['vector_key216_length'] == 216
          assert d['correctness']['cache_hit_equals_fresh_before_timing'] is True
          assert d['correctness']['stale_signature_rejected_before_timing'] is True
          assert d['correctness']['deterministic_replay_receipt'] is True
          assert d['fresh_selection']['median_ns'] > 0
          assert d['cache_hit']['median_ns'] > 0
