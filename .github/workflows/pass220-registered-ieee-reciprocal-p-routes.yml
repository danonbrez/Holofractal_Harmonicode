name: Pass 220 Registered IEEE Reciprocal P Routes
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_registered_ieee_reciprocal_p_route_v1.py"
      - "tests/pass220/test_pass220_registered_ieee_reciprocal_p_route_v1.py"
      - ".github/workflows/pass220-registered-ieee-reciprocal-p-routes.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registered-reciprocal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify registered IEEE codec on bidirectional P relations
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_registered_ieee_reciprocal_p_route_v1.py
