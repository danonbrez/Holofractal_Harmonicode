name: Pass 220 I022 Cosmological Clock Cadence

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py"
      - "tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py"
      - "hhs_runtime/hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "tests/pass220/test_hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "docs/pass220/PASS_220_I022_COSMOLOGICAL_CLOCK_CADENCE.md"
      - "evidence/pass220/i022_cosmological_clock_cadence_wolfram_20260921_v1.wl"
      - "evidence/pass220/i022_cosmological_clock_cadence_wolfram_20260921_v1.output.json"
      - "docs/operations/restart/PASS_220_I022_COSMOLOGICAL_CLOCK_CADENCE_RESTART.md"
      - ".github/workflows/pass220-i022-cosmological-clock-cadence.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py"
      - "tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py"
      - "hhs_runtime/hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "tests/pass220/test_hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "docs/pass220/PASS_220_I022_COSMOLOGICAL_CLOCK_CADENCE.md"
      - "evidence/pass220/i022_cosmological_clock_cadence_wolfram_20260921_v1.wl"
      - "evidence/pass220/i022_cosmological_clock_cadence_wolfram_20260921_v1.output.json"
      - "docs/operations/restart/PASS_220_I022_COSMOLOGICAL_CLOCK_CADENCE_RESTART.md"
      - ".github/workflows/pass220-i022-cosmological-clock-cadence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Reject host-time and algebraic-preemption authority
        run: |
          ! grep -Eq '(^|[[:space:]])import[[:space:]]+(time|datetime)([[:space:]]|$)' hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py
          ! grep -Eq '(perf_counter|monotonic|process_time|time_ns|datetime\.now|time\.time)' hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py
          ! grep -Eq '(^|[^[:alnum:]_])(pow|sqrt|exp)[[:space:]]*\(' hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py
      - name: Compile exact I022 surface
        run: python -m py_compile hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py
      - name: Verify Wolfram receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/pass220/i022_cosmological_clock_cadence_wolfram_20260921_v1.output.json")
          data = json.loads(p.read_text())
          assert data["status"] == "PASS"
          assert data["check_count"] == data["pass_count"] == 8
          assert data["failed"] == []
          assert data["constant_cadence_dot_h"] == "0"
          assert data["constant_cadence_w"] == "-1"
          PY
      - name: Run I022 and inherited I021 dependency-scoped tests
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py
          tests/pass220/test_hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py
