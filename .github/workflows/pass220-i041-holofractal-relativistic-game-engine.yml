      - "hhs_runtime/c/hhs_pass219_harmonic36_nested_vm_data_1_0.inc"
      - "hhs_runtime/python/hhs_sprite_map_engine_v1.py"
      - "applications/holofractal_harmonizer/lane5_holographic_sprite_5184.html"
      - "tests/pass220/test_hhs_pass220_i041_holographic_sprite_browser_v1.py"
      - "benchmarks/pass220/benchmark_i041_html_render_bottleneck.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "tests/pass220/test_hhs_pass220_holofractal_relativistic_game_engine_v1.py"
      - "tests/pass220/test_hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py"
      - "tests/pass220/test_hhs_pass220_desi_explicit_projection_corpus_v1.py"
      - "tests/pass219/test_pass219_i182_harmonic_geometry_circuit.py"
      - "evidence/pass220/i041_holofractal_relativistic_game_engine_wolfram_20260923_v1.wl"
