name: Recovery Production Service Activation 20261001

on:
  push:
    branches:
      - recovery/ssh-probe-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RECOVERY_HOST: '165.227.99.132'
      RECOVERY_USER: root
      TARGET_SHA: '83e563b2227e6c5a9c7ded4be4fd7cd2c9b8fcc4'
      HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HHS_SSH_PRIVATE_KEY" > "$HOME/.ssh/hhs-recovery"
          chmod 0600 "$HOME/.ssh/hhs-recovery"
          ssh-keyscan -T 8 "$RECOVERY_HOST" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Install and start canonical production service
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/hhs-recovery" \
            -o BatchMode=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$RECOVERY_USER@$RECOVERY_HOST" \
            "TARGET_SHA='$TARGET_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          REPO=/opt/hhs/app
          TARGET_SHA=${TARGET_SHA:?missing TARGET_SHA}

          test "$(git -C "$REPO" rev-parse HEAD)" = "$TARGET_SHA"
          test -s "$REPO/hhs_runtime/builds/libhhs_runtime.so"
          test -s "/var/lib/hhs/warm-boot/releases/$TARGET_SHA.json"
          test -s /var/lib/hhs/runtime-os/current/index.html
          test -d /var/lib/hhs/runtime-os/current/assets

          install -d -m 0755 /etc/hhs
          install -m 0644 \
            "$REPO/deploy/digitalocean/hhs-pass196-integrated-environment.service" \
            /etc/systemd/system/hhs.service

          cat >/etc/nginx/conf.d/hhs-websocket-map.conf <<'NGINX'
          map $http_upgrade $hhs_connection_upgrade {
              default upgrade;
              '' close;
          }
          NGINX

          rm -f /etc/nginx/sites-enabled/default
          cat >/etc/nginx/sites-available/hhs <<'NGINX'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;
              client_max_body_size 512m;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $hhs_connection_upgrade;
                  proxy_connect_timeout 30s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
              }
          }
          NGINX
          ln -sfn /etc/nginx/sites-available/hhs /etc/nginx/sites-enabled/hhs

          nginx -t
          systemctl daemon-reload
          systemctl enable nginx >/dev/null
          systemctl enable hhs.service >/dev/null
          systemctl restart nginx
          systemctl reset-failed hhs.service 2>/dev/null || true
          systemctl restart hhs.service

          deadline=$((SECONDS + 240))
          until curl -fsS --max-time 10 http://127.0.0.1:8080/api/system/status >/tmp/hhs-system-status.json; do
            if (( SECONDS >= deadline )); then
              systemctl status hhs.service --no-pager --full >&2 || true
              systemctl show hhs.service -p ActiveState -p SubState -p MainPID -p ExecStart -p WorkingDirectory --no-pager >&2 || true
              journalctl -u hhs.service -n 500 --no-pager >&2 || true
              ss -ltnp >&2 || true
              exit 30
            fi
            sleep 3
          done

          curl -fsS --max-time 10 http://127.0.0.1:8080/api/interface/status >/tmp/hhs-interface-status.json
          curl -fsS --max-time 10 http://127.0.0.1/api/system/status >/tmp/hhs-nginx-status.json
          systemctl is-active --quiet hhs.service
          systemctl is-active --quiet nginx
          ss -H -ltnp 'sport = :8080'
          ss -H -ltnp 'sport = :80'

          echo "HHS_RECOVERY_SERVICE_ACTIVE=1"
          echo "HHS_RECOVERY_SERVICE_SHA=$TARGET_SHA"
          cat /tmp/hhs-system-status.json
          REMOTE

      - name: Verify recovered public HTTP surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            "http://$RECOVERY_HOST/api/system/status" >/tmp/hhs-public-system.json
          curl -fsS --retry 10 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            "http://$RECOVERY_HOST/api/interface/status" >/tmp/hhs-public-interface.json
          curl -fsS --retry 10 --retry-delay 3 --connect-timeout 10 --max-time 30 \
            "http://$RECOVERY_HOST/" >/tmp/hhs-public-root.html
          test -s /tmp/hhs-public-system.json
          grep -Fq 'HHS Visual Runtime OS Workspace' /tmp/hhs-public-root.html
          echo "HHS_RECOVERY_PUBLIC_HTTP_VERIFIED=1"
          cat /tmp/hhs-public-interface.json
