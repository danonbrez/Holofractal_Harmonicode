name: Apply Pass 175 Terminal VMRC Repair

on:
  push:
    branches: [agent/pass175-terminal-completion]
    paths:
      - 'tools/patch_pass175_terminal_vmrc_operation.py'
      - '.github/workflows/pass175-terminal-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass175-terminal-completion
          fetch-depth: 0
      - name: Bind hydration sealing to inherited VMRC operation
        run: python tools/patch_pass175_terminal_vmrc_operation.py
      - name: Commit source repair
        run: |
          git config user.name 'hhs-pass175-terminal'
          git config user.email 'hhs-pass175-terminal@users.noreply.github.com'
          git add -A
          git commit -m 'Bind Pass 175 hydration seal to inherited VMRC commit'
          git push origin HEAD:agent/pass175-terminal-completion
