name: Pass 220 Course M4 Inherited Native HNAN
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_course_m4_inherited_hnan_phase_binding_v1.py"
      - "tests/pass220/test_pass220_course_m4_inherited_hnan_phase_binding_v1.py"
      - ".github/workflows/pass220-course-m4-inherited-native-hnan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Execute established native HNAN 1.63 and bind Course Module 4
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_course_m4_inherited_hnan_phase_binding_v1.py
