name: Pass 219 Local Circular Phase Fiber Formalization

on:
  push:
    paths:
      - 'contracts/pass219/PASS_219_LOCAL_CIRCULAR_PHASE_FIBER_INVARIANT_1_0.md'
      - 'evidence/pass219/local_circular_phase_fiber_wolfram_20260925_v1.wl'
      - 'evidence/pass219/local_circular_phase_fiber_wolfram_20260925_v1.output.json'
      - 'evidence/pass219/local_circular_phase_fiber_wolfram_20260925_v1.receipt.json'
      - 'tests/pass219/test_pass219_local_circular_phase_fiber_formalization.py'
      - 'hhs_runtime/hhs_pass220_multidimensional_constraint_manifold_v1.py'
      - 'tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py'
      - 'docs/operations/restart/PASS_219_LOCAL_CIRCULAR_PHASE_FIBER_RESTART_20260925.md'
      - '.github/workflows/pass219-local-circular-phase-fiber-formalization.yml'
  pull_request:
    paths:
      - 'contracts/pass219/PASS_219_LOCAL_CIRCULAR_PHASE_FIBER_INVARIANT_1_0.md'
      - 'evidence/pass219/local_circular_phase_fiber_wolfram_20260925_v1.wl'
      - 'evidence/pass219/local_circular_phase_fiber_wolfram_20260925_v1.output.json'
      - 'evidence/pass219/local_circular_phase_fiber_wolfram_20260925_v1.receipt.json'
      - 'tests/pass219/test_pass219_local_circular_phase_fiber_formalization.py'
      - 'hhs_runtime/hhs_pass220_multidimensional_constraint_manifold_v1.py'
      - 'tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py'
      - 'docs/operations/restart/PASS_219_LOCAL_CIRCULAR_PHASE_FIBER_RESTART_20260925.md'
      - '.github/workflows/pass219-local-circular-phase-fiber-formalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-circular-phase-fiber-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile focused formalization test
        run: python -m py_compile tests/pass219/test_pass219_local_circular_phase_fiber_formalization.py
      - name: Verify existing runtime and formal circular-class binding
        run: |
          PYTHONPATH="$PWD" python -m pytest -q             tests/pass219/test_pass219_local_circular_phase_fiber_formalization.py             tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py
