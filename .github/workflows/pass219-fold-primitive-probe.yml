name: Pass 219 Fold Primitive Probe

on:
  push:
    paths:
      - 'hhs_runtime/pass219/fold_primitive_probe.py'
      - 'hhs_runtime/pass219/platonic_multistate_fold_probe.py'
      - 'hhs_runtime/pass219/nonary_qudit_bigint_assembly_probe.py'
      - 'tests/pass219/test_pass219_fold_primitive_probe.py'
      - 'tests/pass219/test_pass219_platonic_multistate_fold_probe.py'
      - 'tests/pass219/test_pass219_nonary_qudit_bigint_assembly_probe.py'
      - '.github/workflows/pass219-fold-primitive-probe.yml'
  pull_request:
    paths:
      - 'hhs_runtime/pass219/fold_primitive_probe.py'
      - 'hhs_runtime/pass219/platonic_multistate_fold_probe.py'
      - 'hhs_runtime/pass219/nonary_qudit_bigint_assembly_probe.py'
      - 'tests/pass219/test_pass219_fold_primitive_probe.py'
      - 'tests/pass219/test_pass219_platonic_multistate_fold_probe.py'
      - 'tests/pass219/test_pass219_nonary_qudit_bigint_assembly_probe.py'
      - '.github/workflows/pass219-fold-primitive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fold-primitive-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused primitive tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q -s \
            tests/pass219/test_pass219_fold_primitive_probe.py \
            tests/pass219/test_pass219_platonic_multistate_fold_probe.py \
            tests/pass219/test_pass219_nonary_qudit_bigint_assembly_probe.py
      - name: Emit exact combined fold probe
        run: PYTHONPATH="$PWD" python -m hhs_runtime.pass219.fold_primitive_probe
      - name: Emit exact Platonic multi-state probe
        run: PYTHONPATH="$PWD" python -m hhs_runtime.pass219.platonic_multistate_fold_probe
      - name: Emit exact nonary qudit BigInt assembly probe
        run: PYTHONPATH="$PWD" python -m hhs_runtime.pass219.nonary_qudit_bigint_assembly_probe
