name: HHS Visual IDE A-B Usability

on:
  pull_request:
    paths:
      - 'applications/holofractal_harmonizer/**'
      - 'HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md'
      - '.github/workflows/visual-ide-ab-usability.yml'
  workflow_dispatch:

jobs:
  workflow-first-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install usability-lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn playwright pillow
          python -m playwright install --with-deps chromium
          ffmpeg -version | head -n 1
      - name: Validate workflow templates and global default
        run: |
          node --test applications/holofractal_harmonizer/tests/ux_workflow_default.test.mjs
          node --check applications/holofractal_harmonizer/src/ux-default.mjs
          node --check applications/holofractal_harmonizer/ux_lab/static/app.js
          python -m py_compile \
            applications/holofractal_harmonizer/ux_lab/server.py \
            applications/holofractal_harmonizer/ux_lab/capture_parallel.py
      - name: Capture parallel A-B workflows
        working-directory: applications/holofractal_harmonizer/ux_lab
        run: |
          for workflow in code_api data_dashboard document_knowledge image_spatial; do
            python capture_parallel.py "$workflow"
          done
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: visual-ide-ab-evidence
          path: |
            applications/holofractal_harmonizer/ux_lab/evidence/screenshots
            applications/holofractal_harmonizer/ux_lab/evidence/videos
            applications/holofractal_harmonizer/ux_lab/evidence/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
