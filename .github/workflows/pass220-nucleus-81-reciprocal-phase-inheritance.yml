name: Pass 220 Nucleus 81 Reciprocal Phase Inheritance

on:
  pull_request:
    branches:
      - main
    paths:
      - "formal/wolfram/pass220_nucleus_81_reciprocal_phase_inheritance_v1.wl"
      - "contracts/pass220/PASS_220_NUCLEUS_81_RECIPROCAL_PHASE_INHERITANCE_V1.json"
      - "tests/pass220/test_pass220_nucleus_81_reciprocal_phase_inheritance_v1.py"
      - "docs/pass220/PASS_220_NUCLEUS_81_RECIPROCAL_PHASE_INHERITANCE_V1.md"
      - ".github/workflows/pass220-nucleus-81-reciprocal-phase-inheritance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nucleus-exact-integer-and-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency-scoped test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile independent Python regression tests
        run: python -m py_compile tests/pass220/test_pass220_nucleus_81_reciprocal_phase_inheritance_v1.py
      - name: Run exact integer, address, modulo and authority tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/pass220/test_pass220_nucleus_81_reciprocal_phase_inheritance_v1.py
      - name: Check Wolfram script and inherited authority references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path("contracts/pass220/PASS_220_NUCLEUS_81_RECIPROCAL_PHASE_INHERITANCE_V1.json").read_text())
          wolfram = Path(contract["formal_source"]).read_text()
          for token in ("VerificationTest[", "40-disjoint-antipodal-address-pairs", "all-72-cross-phase-inverses", "TestReport[checks]"):
              assert token in wolfram, token
          for path in contract["frozen_dependencies"]:
              assert Path(path).exists(), path
          assert contract["authority"] == {
              "canonical_vm81_mutation": False,
              "canonical_hash72_mint": False,
              "canonical_hash216_persistence": False,
          }
          print("Wolfram proof source and immutable dependencies verified (not a kernel replay).")
          PY
