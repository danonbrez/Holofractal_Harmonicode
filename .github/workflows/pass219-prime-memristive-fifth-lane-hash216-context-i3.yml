name: Pass 219 Prime Memristive Fifth Lane Hash216 Context I3

on:
  push:
    branches:
      - agent/pass219-prime-memristive-fifth-lane-i3-20260912
    paths:
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_0.hpp'
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_1.hpp'
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_2.hpp'
      - 'hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_1_0.cpp'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_1_1.cpp'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_1_2.cpp'
      - 'tests/pass219/test_pass219_core_holographic_four_lane_1_24.c'
      - 'contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_HASH216_CONTEXT_I3.md'
      - 'docs/operations/restart/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_I3_RESTART_20260912.md'
      - '.github/workflows/pass219-prime-memristive-fifth-lane-hash216-context-i3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out I3 branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Verify I3 reference and context authority contract
        run: |
          python - <<'PY'
          from pathlib import Path
          header = Path('hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_2.hpp').read_text()
          contract = Path('contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_HASH216_CONTEXT_I3.md').read_text()
          holo4 = Path('hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h').read_text()
          assert '#define HHS_EXACT_PASS219_HOLO4_LANE_COUNT UINT32_C(4)' in holo4
          for needle in (
              'hash216_reference_only{true}',
              'canonical_mutation_authority{false}',
              'canonical_hash72_authority{false}',
              'canonical_hash216_authority{false}',
              'canonical_persistence_authority{false}',
              'requires_inherited_vm81_hash216_admission{true}',
              'bind_transition',
              'alias_group_for_record',
              'compose_and_store',
              'decision_for',
              'seed_router_state',
              'cold_selector_evaluations',
          ):
              assert needle in header, needle
          for needle in (
              'hash216_reference_only = true',
              'K_a != K_b',
              'H(K_a) = H(K_b)',
              'indexed_candidate_IDs == linear_scan_candidate_IDs',
              'W_cold(k)',
              'requires_inherited_vm81_hash216_admission = true',
              'HHS_EXACT_PASS219_HOLO4_LANE_COUNT = 4',
          ):
              assert needle in contract, needle
          print('prime_memristive_fifth_lane_i3_contract_gate=PASS')
          PY

      - name: Run inherited I1 fifth-lane test
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_0.cpp \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i1
          /tmp/test-pass219-prime-memristive-fifth-lane-i1

      - name: Build inherited exact ABI
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_holo4_prepare'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_holo4_route'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_hash216_transition_init'

      - name: Run inherited I2 adapter index benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_1.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i2
          /tmp/test-pass219-prime-memristive-fifth-lane-i2

      - name: Run I3 Hash216 alias and warm route benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_2.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i3
          /tmp/test-pass219-prime-memristive-fifth-lane-i3

      - name: Verify inherited four-lane authority remains green
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_core_holographic_four_lane_1_24.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-core-holo4
          /tmp/test-core-holo4
