name: Pass 214 Iteration 8 Terminal Freeze

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pass214-operating-compression-gradient
    paths:
      - 'hhs_backend/runtime/hhs_pass214_*.py'
      - 'hhs_backend/runtime/pass214_i*_payload/**'
      - 'hhs_runtime/pass165/**'
      - 'tools/pass214_*.py'
      - 'tools/generate_pass212_full_hydration_evidence.py'
      - 'tests/test_hhs_pass214_*.py'
      - 'tests/test_pass214_terminal_workflow_ordering.py'
      - 'docs/pass214/**'
      - 'evidence/pass214/**'
      - 'contracts/pass214/**'
      - 'contracts/pass215/**'
      - 'scripts/run_pass214_contract_validation.sh'
      - '.github/workflows/pass214-iteration8-terminal-freeze.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'hhs_backend/runtime/hhs_pass214_*.py'
      - 'hhs_backend/runtime/pass214_i*_payload/**'
      - 'hhs_runtime/pass165/**'
      - 'tools/pass214_*.py'
      - 'tools/generate_pass212_full_hydration_evidence.py'
      - 'tests/test_hhs_pass214_*.py'
      - 'tests/test_pass214_terminal_workflow_ordering.py'
      - 'docs/pass214/**'
      - 'evidence/pass214/**'
      - 'contracts/pass214/**'
      - 'contracts/pass215/**'
      - 'scripts/run_pass214_contract_validation.sh'
      - '.github/workflows/pass214-iteration8-terminal-freeze.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  terminal-freeze-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pytest
      - name: Validate cumulative Pass 214 through Iteration 8
        run: bash scripts/run_pass214_contract_validation.sh
      - name: Generate exact-head census and compatibility summaries
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-i8/census" "$RUNNER_TEMP/pass214-i8/compatibility"
          python tools/pass214_repository_census.py \
            --repository-root . \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-i8/census"
          python tools/pass214_callable_conformance.py \
            --repository-root . \
            --iteration1-directory "$RUNNER_TEMP/pass214-i8/census" \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-i8/compatibility"
      - name: Reconcile exact-head authority-conflict candidates
        run: |
          python tools/pass214_authority_conflict_reconciliation.py \
            --compatibility-directory "$RUNNER_TEMP/pass214-i8/compatibility" \
            --output "$RUNNER_TEMP/pass214-i8/PASS_214_AUTHORITY_CONFLICT_RECONCILIATION.json"
      - name: Execute frozen final compound benchmark
        run: |
          python tools/pass214_final_compound_benchmark.py \
            --output "$RUNNER_TEMP/pass214-i8/PASS_214_FINAL_COMPOUND_BENCHMARK_BUNDLE.json"
          python tools/pass214_final_compound_benchmark.py \
            --output "$RUNNER_TEMP/pass214-i8/unused.json" \
            --validate "$RUNNER_TEMP/pass214-i8/PASS_214_FINAL_COMPOUND_BENCHMARK_BUNDLE.json"
      - name: Prove Pass 214 terminal readiness before Pass 213 runtime admission
        run: |
          python tools/pass214_iteration8_terminal_freeze.py \
            --mode inspect \
            --census-summary "$RUNNER_TEMP/pass214-i8/census/iteration1_summary.json" \
            --compatibility-summary "$RUNNER_TEMP/pass214-i8/compatibility/iteration2_summary.json" \
            --authority-reconciliation "$RUNNER_TEMP/pass214-i8/PASS_214_AUTHORITY_CONFLICT_RECONCILIATION.json" \
            --benchmark-bundle "$RUNNER_TEMP/pass214-i8/PASS_214_FINAL_COMPOUND_BENCHMARK_BUNDLE.json" \
            --pass215-profile contracts/pass215/PASS_215_BENCHMARK_PROFILE.json \
            --output "$RUNNER_TEMP/pass214-i8/PASS_214_ITERATION_8_CI_INSPECTION.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pass214-i8'
          reconciliation = json.loads((root / 'PASS_214_AUTHORITY_CONFLICT_RECONCILIATION.json').read_text())
          benchmark = json.loads((root / 'PASS_214_FINAL_COMPOUND_BENCHMARK_BUNDLE.json').read_text())
          report = json.loads((root / 'PASS_214_ITERATION_8_CI_INSPECTION.json').read_text())
          assert reconciliation['all_conflicts_reconciled'] is True
          assert reconciliation['unresolved_conflict_count'] == 0
          assert reconciliation['automatic_merge_count'] == 0
          assert reconciliation['single_mutation_authority_preserved'] is True
          assert benchmark['status'] == 'FINAL_BENCHMARK_COMPLETE_READY_FOR_PASS214_TERMINAL_FREEZE'
          assert benchmark['governance_accounting']['pass214_benchmark_complete'] == 1
          assert benchmark['governance_accounting']['pass214_terminal_freeze_ready'] == 1
          assert benchmark['governance_accounting']['production_live_admission_claimed'] == 0
          assert benchmark['governance_accounting']['canonical_mutation_authorized'] == 0
          assert len(benchmark['workloads']) == 15
          assert len(benchmark['ablations']) == 26
          assert all(benchmark[key] is True for key in (
              'semantic_observational_separation', 'append_only_result_integrity',
              'multimodal_ml_compound_exercised', 'multimodal_ml_ablation_exercised',
              'incremental_full_equality', 'recovery_replay_semantic_equality',
              'cross_process_replay_semantic_equality', 'negative_controls_fail_closed',
              'complete_cost_accounting', 'compression_incidence_complete_physical_accounting'))
          assert report['ready'] is True
          assert report['blockers'] == []
          assert report['pass213_gates_preserved'] is True
          assert report['pass213_live_admission_required_before_canonical_mutation'] is True
          assert report['terminal_roots_minted'] is False
          assert report['benchmark_authority_promoted'] is False
          assert report['runtime_mutation_authority_promoted'] is False
          assert report['canonical_mutation_authorized'] is False
          assert report['migration_active'] is False
          assert report['pass215_authorized'] is False
          PY
      - name: Mint exact-head Pass 214 terminal benchmark authority
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          python tools/pass214_iteration8_terminal_freeze.py \
            --mode finalize \
            --census-summary "$RUNNER_TEMP/pass214-i8/census/iteration1_summary.json" \
            --compatibility-summary "$RUNNER_TEMP/pass214-i8/compatibility/iteration2_summary.json" \
            --authority-reconciliation "$RUNNER_TEMP/pass214-i8/PASS_214_AUTHORITY_CONFLICT_RECONCILIATION.json" \
            --workload-corpus contracts/pass214/PASS_214_WORKLOAD_CORPUS.json \
            --benchmark-method contracts/pass214/PASS_214_FINAL_BENCHMARK_METHOD.json \
            --benchmark-bundle "$RUNNER_TEMP/pass214-i8/PASS_214_FINAL_COMPOUND_BENCHMARK_BUNDLE.json" \
            --pass215-profile contracts/pass215/PASS_215_BENCHMARK_PROFILE.json \
            --source-commit "$SOURCE_COMMIT" \
            --source-tree "$SOURCE_TREE" \
            --output "$RUNNER_TEMP/pass214-i8/PASS_214_TERMINAL_FREEZE.json"
          python tools/pass214_iteration8_terminal_freeze.py \
            --mode validate \
            --terminal-record "$RUNNER_TEMP/pass214-i8/PASS_214_TERMINAL_FREEZE.json" \
            --output "$RUNNER_TEMP/pass214-i8/PASS_214_TERMINAL_VALIDATION.json"
      - name: Enforce repaired terminal authority boundary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pass214-i8'
          record = json.loads((root / 'PASS_214_TERMINAL_FREEZE.json').read_text())
          expected = {
              'PASS214_REPOSITORY_SCAN_ROOT_HASH216',
              'PASS214_OPTIMIZATION_REGISTRY_ROOT_HASH216',
              'PASS214_COMPATIBILITY_GRAPH_ROOT_HASH216',
              'PASS214_WORKLOAD_CORPUS_ROOT_HASH216',
              'PASS214_BENCHMARK_METHOD_ROOT_HASH216',
              'PASS214_COMPOUND_EVIDENCE_ROOT_HASH216',
              'PASS214_AUTHORITY_ROOT_HASH216',
              'PASS215_BENCHMARK_PROFILE_ROOT_HASH216',
          }
          assert set(record['terminal_roots']) == expected
          assert len(record['terminal_roots']) == 8
          assert record['authority_scope'] == 'PASS214_BENCHMARK_AUTHORITY_ONLY'
          assert record['acceptance_gates_passed'] is True
          assert record['terminal_roots_minted'] is True
          assert record['authority_promoted'] is True
          assert record['benchmark_authority_promoted'] is True
          assert record['pass215_authorized'] is True
          assert record['pass213_gates_preserved'] is True
          assert record['runtime_mutation_authority_promoted'] is False
          assert record['canonical_mutation_authorized'] is False
          assert record['migration_active'] is False
          assert record['pass213_live_admission_required_before_canonical_mutation'] is True
          assert all(len(value) == 64 for value in record['terminal_roots'].values())
          assert len(record['terminal_receipt_hash72']) == 72
          assert len(record['pass213_gate_preservation_root_hash216']) == 64
          PY
      - name: Retain Iteration 8 terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass214-iteration8-terminal-freeze-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pass214-i8/**/*.json
            contracts/pass214/PASS_214_WORKLOAD_CORPUS.json
            contracts/pass214/PASS_214_FINAL_BENCHMARK_METHOD.json
            contracts/pass215/PASS_215_BENCHMARK_PROFILE.json
            evidence/pass214/PASS_214_ITERATION_8_IMPLEMENTATION_RECORD.json
          if-no-files-found: error
