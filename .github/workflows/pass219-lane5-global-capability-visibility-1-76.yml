name: Pass 219 Lane 5 Global Capability Visibility 1.76

on:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_backend/runtime/hhs_pass219_lane5_global_capability_visibility_1_76.py'
      - 'hhs_runtime/include/hhs_pass219_lane5_global_capability_visibility_cell_wall_1_76.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_global_capability_visibility_cell_wall_1_76.cpp'
      - 'tests/pass219/test_pass219_lane5_global_capability_visibility_1_76.py'
      - 'tests/pass219/test_pass219_lane5_global_capability_visibility_cell_wall_1_76.cpp'
      - 'contracts/pass219/PASS_219_LANE5_GLOBAL_CAPABILITY_VISIBILITY_1_76.md'
      - 'hhs_backend/runtime_os_pass220_lane5_capability_hydration.py'
      - 'hhs_backend/runtime_os_visual_server.py'
      - 'hhs_backend/runtime_os_application_server_full.py'
      - 'tests/pass220/test_hhs_pass220_lane5_capability_hydration.py'
      - 'hhs_backend/runtime/hhs_native_litert_lm_provider_v1.py'
      - 'hhs_backend/runtime/hhs_litert_lm_assistant_v1.py'
      - 'hhs_backend/runtime/hhs_production_assistant_v1.py'
      - 'hhs_backend/runtime/hhs_unified_language_model_fabric_v1.py'
      - 'hhs_backend/runtime/hhs_assistant_api_tool_gateway_v1.py'
      - 'tests/pass220/test_hhs_pass220_unified_chatbot_lane5_model_fabric.py'
      - 'tests/pass220/test_hhs_pass220_i008_assistant_modes.py'
      - 'tests/pass220/test_hhs_pass220_i009_native_causal_rag_generation.py'
      - 'tests/test_hhs_production_public_app_v1.py'
      - '.github/workflows/pass219-lane5-global-capability-visibility-1-76.yml'
  push:
    branches:
      - main
      - pass219-lane5-global-capability-visibility-1-76
    paths:
      - 'hhs_backend/runtime/hhs_pass219_lane5_global_capability_visibility_1_76.py'
      - 'hhs_runtime/include/hhs_pass219_lane5_global_capability_visibility_cell_wall_1_76.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_global_capability_visibility_cell_wall_1_76.cpp'
      - 'tests/pass219/test_pass219_lane5_global_capability_visibility_1_76.py'
      - 'tests/pass219/test_pass219_lane5_global_capability_visibility_cell_wall_1_76.cpp'
      - 'contracts/pass219/PASS_219_LANE5_GLOBAL_CAPABILITY_VISIBILITY_1_76.md'
      - 'hhs_backend/runtime_os_pass220_lane5_capability_hydration.py'
      - 'hhs_backend/runtime_os_visual_server.py'
      - 'hhs_backend/runtime_os_application_server_full.py'
      - 'tests/pass220/test_hhs_pass220_lane5_capability_hydration.py'
      - 'hhs_backend/runtime/hhs_native_litert_lm_provider_v1.py'
      - 'hhs_backend/runtime/hhs_litert_lm_assistant_v1.py'
      - 'hhs_backend/runtime/hhs_production_assistant_v1.py'
      - 'hhs_backend/runtime/hhs_unified_language_model_fabric_v1.py'
      - 'hhs_backend/runtime/hhs_assistant_api_tool_gateway_v1.py'
      - 'tests/pass220/test_hhs_pass220_unified_chatbot_lane5_model_fabric.py'
      - 'tests/pass220/test_hhs_pass220_i008_assistant_modes.py'
      - 'tests/pass220/test_hhs_pass220_i009_native_causal_rag_generation.py'
      - 'tests/test_hhs_production_public_app_v1.py'
      - '.github/workflows/pass219-lane5-global-capability-visibility-1-76.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-lane5-global-capability-visibility-1-76-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.'
      PYTHONHASHSEED: '0'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch repository-visible branch and pull-request heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force origin '+refs/pull/*/head:refs/remotes/pull/*' || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped Python test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest \
            pytest-asyncio \
            uvicorn==0.54.0 \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'cryptography>=46.0,<47.0' \
            requests

      - name: Compile Python surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass219_lane5_global_capability_visibility_1_76.py \
            hhs_backend/runtime_os_pass220_lane5_capability_hydration.py \
            hhs_backend/runtime_os_visual_server.py \
            hhs_backend/runtime_os_application_server_full.py \
            hhs_backend/runtime/hhs_native_litert_lm_provider_v1.py \
            hhs_backend/runtime/hhs_litert_lm_assistant_v1.py \
            hhs_backend/runtime/hhs_production_assistant_v1.py \
            hhs_backend/runtime/hhs_unified_language_model_fabric_v1.py \
            hhs_backend/runtime/hhs_assistant_api_tool_gateway_v1.py \
            tests/pass219/test_pass219_lane5_global_capability_visibility_1_76.py \
            tests/pass220/test_hhs_pass220_lane5_capability_hydration.py \
            tests/pass220/test_hhs_pass220_unified_chatbot_lane5_model_fabric.py \
            tests/pass220/test_hhs_pass220_i008_assistant_modes.py \
            tests/pass220/test_hhs_pass220_i009_native_causal_rag_generation.py \
            tests/test_hhs_production_public_app_v1.py

      - name: Run dependency-scoped Python regressions
        run: |
          python -m pytest -q --tb=short \
            tests/pass219/test_pass219_lane5_global_capability_visibility_1_76.py \
            tests/pass220/test_hhs_pass220_lane5_capability_hydration.py \
            tests/pass220/test_hhs_pass220_unified_chatbot_lane5_model_fabric.py \
            tests/pass220/test_hhs_pass220_i008_assistant_modes.py \
            tests/pass220/test_hhs_pass220_i009_native_causal_rag_generation.py \
            tests/test_hhs_production_public_app_v1.py

      - name: Verify Runtime OS host wiring is Pass219-consumer only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'install_pass219_lane5_capability_visibility' hhs_backend/runtime_os_visual_server.py
          grep -Fq 'install_pass219_lane5_capability_visibility' hhs_backend/runtime_os_application_server_full.py
          grep -Fq 'lane5_selection_authority": False' hhs_backend/runtime_os_pass220_lane5_capability_hydration.py
          grep -Fq 'runtime_validation_authority": False' hhs_backend/runtime_os_pass220_lane5_capability_hydration.py
          grep -Fq 'canonical_mutation_authority": False' hhs_backend/runtime_os_pass220_lane5_capability_hydration.py
          grep -Fq 'hhs_pass219_lane5_global_capability_visibility_1_76' hhs_backend/runtime/hhs_assistant_api_tool_gateway_v1.py
          ! grep -Fq 'hhs_pass219_lane5_repository_capability_reverse_discovery_1_44' hhs_backend/runtime/hhs_assistant_api_tool_gateway_v1.py

      - name: Compile and run native C++ membrane regression
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            hhs_runtime/cpp/hhs_pass219_lane5_global_capability_visibility_cell_wall_1_76.cpp \
            tests/pass219/test_pass219_lane5_global_capability_visibility_cell_wall_1_76.cpp \
            -o /tmp/pass219-lane5-global-capability-visibility-1-76
          /tmp/pass219-lane5-global-capability-visibility-1-76

      - name: Hydrate complete repository-visible capability projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass219-176-state
          python -m hhs_backend.runtime.hhs_pass219_lane5_global_capability_visibility_1_76 \
            --repository-root . \
            --state-root /tmp/pass219-176-state \
            --main-ref HEAD \
            --output /tmp/pass219-176-state/receipt.json
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          receipt = json.loads(
              Path('/tmp/pass219-176-state/receipt.json').read_text(encoding='utf-8')
          )
          snapshot = receipt['snapshot']
          database = receipt['database']
          assert snapshot['invariants']['all_discovered_capabilities_visible_to_lane5'] is True
          assert snapshot['invariants']['classification_metadata_never_filters_visibility'] is True
          assert snapshot['invariants']['unresolved_state_remains_visible'] is True
          assert snapshot['invariants']['discovery_imports_or_executes_discovered_code'] is False
          assert snapshot['authority']['candidate_only'] is True
          assert snapshot['authority']['direct_linux_or_service_bypass_authority'] is False
          assert snapshot['authority']['canonical_vm81_mutation_authority'] is False
          assert snapshot['authority']['canonical_hash72_mint_authority'] is False
          assert snapshot['authority']['canonical_hash216_mint_authority'] is False
          assert snapshot['authority']['canonical_persistence_authority'] is False
          assert database['hash216_vector_rows'] == database['node_count']
          assert database['hash216_vector_positions'] == database['node_count'] * 216
          db = sqlite3.connect(database['database_path'])
          try:
              hidden = db.execute(
                  "SELECT COUNT(*) FROM capability_nodes "
                  "WHERE json_extract(payload_json, '$.visible_to_lane5') != 1"
              ).fetchone()[0]
              filtered = db.execute(
                  "SELECT COUNT(*) FROM capability_nodes "
                  "WHERE json_extract(payload_json, '$.classification_is_visibility_filter') != 0"
              ).fetchone()[0]
              vector_shape = db.execute(
                  "SELECT COUNT(*), COALESCE(SUM(codeword_count), 0), "
                  "MIN(length(codeword_blob)), MAX(length(codeword_blob)) "
                  "FROM hash216_vectors"
              ).fetchone()
          finally:
              db.close()
          assert hidden == 0
          assert filtered == 0
          assert vector_shape[0] == database['node_count']
          assert vector_shape[1] == database['node_count'] * 216
          assert vector_shape[2] == 216 * 32
          assert vector_shape[3] == 216 * 32
          print(json.dumps({
              'nodes': database['node_count'],
              'hash216_vector_positions': database['hash216_vector_positions'],
              'snapshot_root_hash216': snapshot['snapshot_root_hash216'],
          }, sort_keys=True))
          PY

      - name: Upload restartable visibility receipt and vector database
        uses: actions/upload-artifact@v4
        with:
          name: pass219-lane5-global-capability-visibility-1-76
          path: |
            /tmp/pass219-176-state/receipt.json
          if-no-files-found: error
          retention-days: 14
