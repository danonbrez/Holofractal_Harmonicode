name: Materialize Pass 176 on Latest Main

on:
  push:
    branches: [agent/pass176-frozen-ide-stabilization]
    paths: ['.github/workflows/pass176-current-main-materialize.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass176-frozen-ide-stabilization
          fetch-depth: 0
      - name: Restore validated Pass 176 files
        run: |
          set -euo pipefail
          git fetch origin backup/pass176-pre-current-main-integration-20260731-2
          backup=origin/backup/pass176-pre-current-main-integration-20260731-2
          git checkout "$backup" -- \
            .github/workflows/pass176-frozen-ide-stabilization.yml \
            applications/holofractal_harmonizer/src/integrated-assistant.mjs \
            applications/holofractal_harmonizer/src/pass176-stability-core.mjs \
            applications/holofractal_harmonizer/src/pass176-stability.css \
            applications/holofractal_harmonizer/src/pass176-stability.mjs \
            applications/holofractal_harmonizer/src/visual-ide-state.mjs \
            applications/holofractal_harmonizer/src/visual-ide.mjs \
            applications/holofractal_harmonizer/tests/integrated.workbench.test.mjs \
            applications/holofractal_harmonizer/tests/intuitive.ide.test.mjs \
            applications/holofractal_harmonizer/tests/pass176-stability.test.mjs \
            applications/holofractal_harmonizer/tests/project.lifecycle.test.mjs \
            applications/holofractal_harmonizer/ux_lab/pass176_stability_smoke.py \
            evidence/pass176/PASS_176_ACTIVATION_RECORD.json \
            hhs_verification/pass176/verify.py \
            tests/test_pass176_frozen_ide_stabilization.py
      - name: Preserve latest-main deployment recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('applications/holofractal_harmonizer/src/visual-ide.mjs')
          source = path.read_text(encoding='utf-8')
          anchor = "import { initProductionRecovery, runBoundedProjectTest } from './production-recovery.mjs';\n"
          health_import = "import { initDeploymentHealth } from './deployment-health.mjs';\n"
          if health_import not in source:
              source = source.replace(anchor, anchor + health_import)
          init_anchor = "      await safeInit('production-recovery', initProductionRecovery);\n"
          health_init = "      await safeInit('deployment-health', initDeploymentHealth, { optional: true });\n"
          if health_init not in source:
              source = source.replace(init_anchor, init_anchor + health_init)
          required = ['initDeploymentHealth', "stage: 'INTERACTIVE'", 'initPass175TerminalProcessor', 'initProductionRecovery']
          missing = [token for token in required if token not in source]
          if missing:
              raise SystemExit(f'PASS176_LATEST_MAIN_INTEGRATION_MISSING:{missing}')
          path.write_text(source, encoding='utf-8')
          receipt = Path('evidence/pass176/PASS_176_ACTIVATION_RECORD.json')
          payload = json.loads(receipt.read_text(encoding='utf-8'))
          payload['authoritative_base_commit'] = '58474848c5d0f97c32a9a8d98000e736ca7a9710'
          payload['latest_main_integration'] = {
              'base_commit': '58474848c5d0f97c32a9a8d98000e736ca7a9710',
              'source_backup_branch': 'backup/pass176-pre-current-main-integration-20260731-2',
              'deployment_backend_degraded_mode_preserved': True,
              'pass159_main_closure_preserved': True,
              'deployment_health_preserved': True
          }
          payload['next_action'] = 'Run bounded validation, merge after terminal evidence, and verify authoritative main.'
          receipt.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/pass176-current-main-materialize.yml
      - name: Compile and commit
        run: |
          node --check applications/holofractal_harmonizer/src/visual-ide.mjs
          node --check applications/holofractal_harmonizer/src/integrated-assistant.mjs
          node --check applications/holofractal_harmonizer/src/pass176-stability-core.mjs
          node --check applications/holofractal_harmonizer/src/pass176-stability.mjs
          python -m py_compile \
            applications/holofractal_harmonizer/ux_lab/pass176_stability_smoke.py \
            hhs_verification/pass176/verify.py \
            tests/test_pass176_frozen_ide_stabilization.py
          git config user.name 'hhs-pass176-integration'
          git config user.email 'hhs-pass176-integration@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Pass 176 stabilization with latest main'
          git push origin HEAD:agent/pass176-frozen-ide-stabilization

# Trigger current-main materialization after workflow registration.
