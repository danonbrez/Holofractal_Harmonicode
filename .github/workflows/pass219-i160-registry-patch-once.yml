name: Pass 219 I160 Exact Registry Patch Once

on:
  push:
    branches:
      - agent/pass219-i160-source-bound-ab-x2-phase-bindings
    paths:
      - .github/workflows/pass219-i160-registry-patch-once.yml

permissions:
  contents: write

jobs:
  patch-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass219-i160-source-bound-ab-x2-phase-bindings
          fetch-depth: 0
      - name: Insert exact I160 governed service registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hhs_runtime/hhs_service_registry_v1.py')
          text = path.read_text(encoding='utf-8')
          service_name_token = 'name="runtime.pass219.source_bound_ab_x2_phase_binding"'
          predecessor = 'name="runtime.pass219.harmonicode_modular_pivot_phase_binding"'
          marker = '    return registry\n\n\ndef _compact_registry_status_from_registry'

          if service_name_token in text:
              print('I160 registry entry already present; no mutation needed.')
          else:
              if text.count(predecessor) != 1:
                  raise SystemExit('I159 predecessor registration is not unique')
              if text.count(marker) != 1:
                  raise SystemExit('central registry return marker is not unique')

              block = '''    registry.register_function(\n        name="runtime.pass219.source_bound_ab_x2_phase_binding",\n        module="hhs_runtime.pass219.source_bound_ab_x2_phase_binding",\n        function="i160_source_bound_binding_self_test",\n        service_type="pass219_exact_source_bound_ab_x2_phase_binding",\n        description="Executes the frozen I160 source-bound P^4=AB product membrane and Pass191 ordered x^2 phase-basis exponent adapter, retaining exact dyadic/quartic witness metadata while leaving the complete monolithic boundary executor fail-closed and forbidding scalar-zero authority escalation.",\n        invariant_ids=["HHS-I001","HHS-I002","HHS-I003","HHS-I005","HHS-I006","HHS-I008","HHS-I009","HHS-I010","HHS-I011","HHS-I012","HHS-I013","HHS-I014","HHS-I015"],\n        contract_schemas=["HHS_PASS219_I160_SOURCE_BOUND_AB_X2_PHASE_BINDING_CONTRACT_V1","HHS_PASS219_I157_CANDIDATE_BOUND_TYPED_VALUE_GRAPH_V1","HHS_PASS219_I159_HARMONICODE_MODULAR_PIVOT_PHASE_BINDING_V1"],\n        witness_schemas=["HHS_PASS219_I160_SOURCE_BOUND_AB_PRODUCT_WITNESS_V1","HHS_PASS219_I160_PASS191_ORDERED_PHASE_EXPONENT_WITNESS_V1","HHS_PASS219_I160_BOUNDARY_ZERO_AUDIT_V1","HHS_PASS219_I157_TYPED_CONSTRAINT_JOIN_V1"],\n        validators=["build_source_bound_ab_product_witness","build_pass191_ordered_phase_exponent_witness","audit_complete_boundary_zero_projection","execute_i160_source_bound_bindings","i160_source_bound_binding_self_test"],\n        guards=["source_bound_P4_AB_product_membrane","complete_A_B_not_definitionally_P2","Pass191_ordered_phase_basis_exponent","Pass191_dyadic_coordinate_retained","ordinary_x_squared_forbidden","right_scalar_zero_not_boundary_authority","complete_monolithic_boundary_executor_still_required","no_float_canonical_authority","no_vm81_mutation_authority","no_hash72_mint_authority","no_hash216_persistence_authority","zero_bypass_runtime_interposer"],\n        rejection_codes=["I159_GRAPH_SHA256_MISMATCH","SOURCE_BOUND_P4_PRODUCT_MISMATCH","COMPLETE_BOUNDARY_SCALARIZATION_FORBIDDEN","PASS191_ORDERED_PHASE_BINDING_MISMATCH","ORDINARY_X_SQUARED_FORBIDDEN","BOUNDARY_ZERO_AUTHORITY_ESCALATION_FORBIDDEN","AUTHORITY_ESCALATION"],\n        mutation_policy="READ_ONLY_SOURCE_BOUND_TYPED_PROOF_NO_VM81_OR_CANONICAL_STATE_MUTATION",\n        persistence_policy="NO_CANONICAL_PERSISTENCE_DIAGNOSTIC_SHA256_WITNESSES_ONLY",\n        boundedness_policy="TEN_FROZEN_JOINS_TWO_I160_SOURCE_BOUND_BINDINGS_ONE_REMAINING_COMPLETE_MONOLITHIC_BOUNDARY_EXECUTOR",\n    )\n\n'''
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Inserted I160 central governed service registration.')

          final = path.read_text(encoding='utf-8')
          if final.count(service_name_token) != 1:
              raise SystemExit('I160 service name registration count must be exactly one')
          if final.count('complete_monolithic_boundary_executor_still_required') != 1:
              raise SystemExit('I160 fail-closed executor guard missing or duplicated')
          PY
      - name: Validate registry syntax and I160 callable import
        shell: bash
        run: |
          python -m py_compile hhs_runtime/hhs_service_registry_v1.py hhs_runtime/pass219/source_bound_ab_x2_phase_binding.py
          python - <<'PY'
          from hhs_runtime.pass219.source_bound_ab_x2_phase_binding import i160_source_bound_binding_self_test
          result = i160_source_bound_binding_self_test()
          assert result['ok'] is True
          print(result.get('schema'), result.get('ok'))
          PY
      - name: Commit exact registry integration
        shell: bash
        run: |
          if git diff --quiet -- hhs_runtime/hhs_service_registry_v1.py; then
            echo "No registry diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hhs_runtime/hhs_service_registry_v1.py
          git commit -m "Pass 219 I160: register governed source-bound service"
          git push origin HEAD:agent/pass219-i160-source-bound-ab-x2-phase-bindings
