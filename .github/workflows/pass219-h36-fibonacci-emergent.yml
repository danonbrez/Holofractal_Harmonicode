name: Pass 219 H36 Fibonacci Emergent Benchmark

on:
  push:
    branches:
      - agent/pass219-h36-fibonacci-branch-cache-benchmark
    paths:
      - 'benchmarks/pass219/harmonic36_fibonacci_branch_emergent_benchmark.cpp'
      - '.github/workflows/pass219-h36-fibonacci-emergent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emergent-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile exact cumulative ABI
        run: |
          mkdir -p /tmp/h36 artifacts/pass219/harmonic36
          gcc -O3 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/h36/exact-opt.o

      - name: Measure emergent branch scaling
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/harmonic36_fibonacci_branch_emergent_benchmark.cpp \
            /tmp/h36/exact-opt.o \
            -o /tmp/h36/h36-fibonacci-branch-emergent
          /tmp/h36/h36-fibonacci-branch-emergent \
            artifacts/pass219/harmonic36/fibonacci_branch_emergent_benchmark.json
          cat artifacts/pass219/harmonic36/fibonacci_branch_emergent_benchmark.json

      - name: Validate emergent benchmark receipt
        run: |
          python - <<'PY'
          import json
          p='artifacts/pass219/harmonic36/fibonacci_branch_emergent_benchmark.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['platform']['linux'] is True
          assert d['platform']['x86_64'] is True
          assert d['frozen_parent']['entries'] == 4
          assert d['frozen_parent']['next_sequence'] == 5
          assert d['frozen_parent']['unchanged_after_all_sweeps'] is True
          assert [row['branches'] for row in d['scales']] == [144,288,576,1152,2304,5184]
          assert [row['tiles144'] for row in d['scales']] == [1,2,4,8,16,36]
          for row in d['scales']:
              assert row['memory']['duplicate_bytes'] > row['memory']['reference_bytes']
              assert row['memory']['duplicate_vs_reference_x1000'] > 1000
              assert row['fork_creation']['duplicate_total_ns'] > 0
              assert row['fork_creation']['reference_total_ns'] > 0
              assert row['random_access']['duplicate_total_ns'] > 0
              assert row['random_access']['reference_total_ns'] > 0
              assert row['equivalence']['full_scan_total_ns'] > 0
              assert row['equivalence']['fib_bucket_total_ns'] > 0
              assert row['composition_receipts']['compute_total_ns'] > 0
              assert row['composition_receipts']['memo_total_ns'] > 0
              assert row['composition_receipts']['memo_build_total_ns'] > 0
          assert d['correctness'] and all(d['correctness'].values())
          assert d['authority']['candidate_benchmark_only'] is True
          assert all(value is False for key, value in d['authority'].items()
                     if key != 'candidate_benchmark_only')
          assert d['authoritative_state_changed'] is False
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pass219-h36-fibonacci-emergent-benchmark
          path: artifacts/pass219/harmonic36/fibonacci_branch_emergent_benchmark.json
          if-no-files-found: error
