name: PR914 Review Repair Regressions

on:
  pull_request:
    paths:
      - 'hhs_backend/lane5_ingress_gateway.py'
      - 'tests/test_hhs_lane5_public_host_forwarding_v1.py'
      - 'tools/hhs_pr914_g2_conflict_receipts.py'
      - 'tests/test_hhs_pr914_g2_conflict_receipts_v1.py'
      - 'applications/holofractal_harmonizer/src/admin-source-stream.mjs'
      - 'applications/holofractal_harmonizer/tests/admin-source-stream.test.mjs'
      - '.github/workflows/pr914-review-repair-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-repairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public Host header and G2 exact-head receipt guards
        run: |
          python -m unittest discover -s tests -p 'test_hhs_lane5_public_host_forwarding_v1.py' -v
          python -m unittest discover -s tests -p 'test_hhs_pr914_g2_conflict_receipts_v1.py' -v
      - name: Stream cancellation and existing admin staging checks
        run: node --test applications/holofractal_harmonizer/tests/admin-source-stream.test.mjs
