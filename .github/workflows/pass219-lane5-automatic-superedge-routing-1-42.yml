name: Pass 219 Lane 5 Automatic Superedge Routing 1.42

on:
  push:
    branches:
      - agent/pass219-lane5-auto-superedge-routing-1-42-20260914
    paths:
      - 'contracts/pass219/PASS_219_LANE5_AUTOMATIC_SUPEREDGE_ROUTING_1_42.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_automatic_superedge_routing_1_42.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_automatic_superedge_routing_1_42.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_python/runtime/hhs_pass219_lane5_automatic_superedge_routing_bridge.py'
      - 'hhs_backend/runtime/hhs_pass219_lane5_automatic_superedge_routing_1_42.py'
      - 'tests/pass219/test_pass219_lane5_automatic_superedge_routing_1_42.c'
      - 'tests/pass219/test_pass219_lane5_automatic_superedge_routing_1_42.py'
      - '.github/workflows/pass219-lane5-automatic-superedge-routing-1-42.yml'
      - 'docs/operations/restart/PASS_219_LANE5_AUTOMATIC_SUPEREDGE_ROUTING_1_42_RESTART_20260914.md'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/pass219/PASS_219_LANE5_AUTOMATIC_SUPEREDGE_ROUTING_1_42.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_automatic_superedge_routing_1_42.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_automatic_superedge_routing_1_42.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_python/runtime/hhs_pass219_lane5_automatic_superedge_routing_bridge.py'
      - 'hhs_backend/runtime/hhs_pass219_lane5_automatic_superedge_routing_1_42.py'
      - 'tests/pass219/test_pass219_lane5_automatic_superedge_routing_1_42.c'
      - 'tests/pass219/test_pass219_lane5_automatic_superedge_routing_1_42.py'
      - '.github/workflows/pass219-lane5-automatic-superedge-routing-1-42.yml'
      - 'docs/operations/restart/PASS_219_LANE5_AUTOMATIC_SUPEREDGE_ROUTING_1_42_RESTART_20260914.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-pytest python3-cryptography

      - name: Static automatic routing contract gate
        run: |
          python - <<'PY'
          from pathlib import Path
          contract = Path('contracts/pass219/PASS_219_LANE5_AUTOMATIC_SUPEREDGE_ROUTING_1_42.md').read_text()
          header = Path('hhs_runtime/include/hhs_pass219_lane5_automatic_superedge_routing_1_42.h').read_text()
          runtime = Path('hhs_backend/runtime/hhs_pass219_lane5_automatic_superedge_routing_1_42.py').read_text()
          for needle in (
              'persistent_snapshot_retrievals',
              'automatic repeated-route promotion',
              'mixed-level candidate routing',
              'signed environmental VM81 admission',
          ):
              assert needle.lower() in contract.lower(), needle
          for needle in (
              'cross_level_exact_routing',
              'automatic_repeated_route_promotion',
              'integer_only_routing_cost',
              'requires_signed_environmental_vm81_admission',
          ):
              assert needle in header, needle
          for needle in (
              'plan_route',
              'execute_plan',
              'observe_level0_route',
              'observe_superedge_chain',
              'Pass219Lane5SuperedgeHierarchy',
          ):
              assert needle in runtime, needle
          print('lane5_automatic_superedge_routing_static=PASS')
          PY

      - name: Build cumulative exact ABI
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Audit 1.42 exported symbols
        run: |
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_automatic_superedge_routing_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_automatic_superedge_routing_authority$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_automatic_route_validate$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_superedge_hierarchy_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_recursive_composition_graph_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_vm81_environment_admit_signed$' /tmp/hhs.symbols

      - name: Run native automatic routing membrane test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_automatic_superedge_routing_1_42.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-lane5-automatic-routing
          /tmp/test-lane5-automatic-routing

      - name: Run automatic routing integration and inherited Lane 5 regressions
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python -m pytest -q \
            tests/pass219/test_pass219_lane5_automatic_superedge_routing_1_42.py \
            tests/pass219/test_pass219_lane5_superedge_hierarchy_1_41.py \
            tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.py \
            tests/pass219/test_pass219_lane5_persistent_hash216_composition_memory_1_39.py \
            tests/pass219/test_pass219_lane5_hash216_composition_jump_store_1_38.py \
            tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py \
            tests/test_hhs_pass207_gpu_driver_v1.py

      - name: Regress inherited Pass194 encrypted storage
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python -m pytest -q tests/test_hhs_pass194_multimodal_storage_training_v1.py

      - name: Regress inherited Lane 5 authority
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-lane5-nucleus
          /tmp/test-lane5-nucleus
