name: Pass 220 P Centered HNAN Conformance
on:
  pull_request:
    paths:
      - "tests/pass220/test_pass220_p_centered_hnan_boundary_v1.py"
      - "tests/pass220/test_pass220_complex_p_rational_scaling_v1.py"
      - "tests/pass220/test_pass220_weighted_hnan_residual_constraint_v1.py"
      - ".github/workflows/pass220-p-centered-hnan-conformance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-hnan-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Dependency-scoped exact tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --tb=short \
            tests/pass220/test_pass220_p_centered_hnan_boundary_v1.py \
            tests/pass220/test_pass220_complex_p_rational_scaling_v1.py \
            tests/pass220/test_pass220_weighted_hnan_residual_constraint_v1.py \
            tests/pass219/test_pass219_hnan_4x4_recursive_gate_v1.py \
            tests/pass219/test_pass219_lane5_hnan_global_constraint_1_63.py
