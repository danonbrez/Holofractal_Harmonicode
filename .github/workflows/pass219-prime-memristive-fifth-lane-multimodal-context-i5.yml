name: Pass 219 Prime Memristive Fifth Lane Multimodal Context I5

on:
  push:
    branches:
      - agent/pass219-prime-memristive-fifth-lane-i5-20260912
    paths:
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_3.hpp'
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_4.hpp'
      - 'hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_1_3.cpp'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_1_4.cpp'
      - 'tests/pass219/test_pass219_core_holographic_four_lane_1_24.c'
      - 'contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_MULTIMODAL_CONTEXT_I5.md'
      - 'docs/operations/restart/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_I5_RESTART_20260912.md'
      - '.github/workflows/pass219-prime-memristive-fifth-lane-multimodal-context-i5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out I5 branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Verify I5 multimodal hierarchy authority contract
        run: |
          python - <<'PY'
          from pathlib import Path
          header = Path('hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_4.hpp').read_text()
          contract = Path('contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_MULTIMODAL_CONTEXT_I5.md').read_text()
          holo4 = Path('hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h').read_text()
          assert '#define HHS_EXACT_PASS219_HOLO4_LANE_COUNT UINT32_C(4)' in holo4
          for needle in (
              'multimodal_route_metadata_only{true}',
              'hash216_reference_only{true}',
              'canonical_mutation_authority{false}',
              'canonical_hash72_authority{false}',
              'canonical_hash216_authority{false}',
              'canonical_persistence_authority{false}',
              'requires_inherited_vm81_hash216_admission{true}',
              'register_context(',
              'observe_route(',
              'set_tombstone(',
              'clear_tombstone(',
              'select_route(',
              'query_with_fallback(',
          ):
              assert needle in header, needle
          for needle in (
              'multimodal_route_metadata_only = true',
              'TEXT   = 1',
              'VISION = 2',
              'AUDIO  = 4',
              'CODE   = 8',
              'child context may use a route registered on an ancestor by reference',
              'route not selectable in this context',
              'indexed_candidate_IDs == linear_scan_candidate_IDs',
              'HHS_EXACT_PASS219_HOLO4_LANE_COUNT = 4',
          ):
              assert needle in contract, needle
          print('prime_memristive_fifth_lane_i5_contract_gate=PASS')
          PY

      - name: Build inherited exact ABI
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_holo4_state_init'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_hash216_transition_init'

      - name: Run inherited I4 adaptive context benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_3.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i4
          /tmp/test-pass219-prime-memristive-fifth-lane-i4

      - name: Run I5 multimodal hierarchy and tombstone benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_4.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i5
          /tmp/test-pass219-prime-memristive-fifth-lane-i5

      - name: Verify inherited four-lane authority remains green
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_core_holographic_four_lane_1_24.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-core-holo4
          /tmp/test-core-holo4
