name: Bootstrap Pass 210 source migration

on:
  push:
    branches:
      - agent/pass210-kimi-k3-native-llm
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass210-kimi-k3-native-llm
          fetch-depth: 0

      - name: Copy and renumber the isolated LLM source
        run: |
          git fetch origin agent/pass209-kimi-k3-native-llm
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source_branch = "origin/agent/pass209-kimi-k3-native-llm"
          restart_record_commit = "215ec71c296419c8aa399dea6b0fe03b5b398862"
          old_base = "13025bbeccb0cd45ebfcf7151fa2bca9cfbb61ea"
          new_base = "36d110ba2f808f83bace25d6df84d45e44ab024b"
          copies = {
              "contracts/pass209/PASS_209_CONTRACT.json":
                  "contracts/pass210/PASS_210_CONTRACT.json",
              "deployment/digitalocean/llm/README.md":
                  "deployment/digitalocean/llm/README.md",
              "deployment/digitalocean/llm/hhs-litert-lm-gemma4.service":
                  "deployment/digitalocean/llm/hhs-litert-lm-gemma4.service",
              "deployment/digitalocean/llm/hhs-llm-preflight.sh":
                  "deployment/digitalocean/llm/hhs-llm-preflight.sh",
              "deployment/digitalocean/llm/hhs-native-agi-optimizer.service":
                  "deployment/digitalocean/llm/hhs-native-agi-optimizer.service",
              "deployment/digitalocean/llm/install.sh":
                  "deployment/digitalocean/llm/install.sh",
              "deployment/digitalocean/llm/pass209-llm.env.example":
                  "deployment/digitalocean/llm/pass210-llm.env.example",
              "deployment/digitalocean/llm/post-merge.sh":
                  "deployment/digitalocean/llm/post-merge.sh",
              "docs/pass209/RESTART_RECORD.md":
                  "docs/pass210/RESTART_RECORD.md",
              "hhs_backend/api/pass209_llm_orchestrator_routes.py":
                  "hhs_backend/api/pass210_llm_orchestrator_routes.py",
              "hhs_backend/runtime/hhs_kimi_k3_agentic_assistant_v1.py":
                  "hhs_backend/runtime/hhs_kimi_k3_agentic_assistant_v1.py",
              "hhs_backend/runtime/hhs_pass209_native_agi_optimizer_v1.py":
                  "hhs_backend/runtime/hhs_pass210_native_agi_optimizer_v1.py",
              "hhs_backend/runtime/hhs_pass209_production_assistant_v1.py":
                  "hhs_backend/runtime/hhs_pass210_production_assistant_v1.py",
              "scripts/pass209_native_agi_optimizer_worker.py":
                  "scripts/pass210_native_agi_optimizer_worker.py",
              "tests/test_hhs_pass209_digitalocean_llm_deployment_v1.py":
                  "tests/test_hhs_pass210_digitalocean_llm_deployment_v1.py",
              "tests/test_hhs_pass209_llm_orchestrator_v1.py":
                  "tests/test_hhs_pass210_llm_orchestrator_v1.py",
          }

          for source, destination in copies.items():
              source_ref = (
                  restart_record_commit
                  if source == "docs/pass209/RESTART_RECORD.md"
                  else source_branch
              )
              content = subprocess.check_output(
                  ["git", "show", f"{source_ref}:{source}"],
                  text=True,
              )
              content = content.replace("209", "210")
              content = content.replace(old_base, new_base)
              content = content.replace(
                  "Complete cumulative HHS runtime through Pass 208",
                  "Complete cumulative HHS runtime through Pass 209",
              )
              if destination == "deployment/digitalocean/llm/install.sh":
                  lines = content.splitlines()
                  for index, line in enumerate(lines):
                      if line.startswith('if [[ "$API_KEY" =~'):
                          lines[index] = 'if [[ ! "$API_KEY" =~ ^[A-Za-z0-9._-]+$ ]]; then'
                      if "unsupported whitespace or quote characters" in line:
                          lines[index] = '  echo "MOONSHOT_API_KEY contains unsupported characters" >&2'
                  content = "\n".join(lines) + "\n"
              target = Path(destination)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          route = Path("hhs_backend/api/litert_lm_assistant_routes.py")
          text = route.read_text(encoding="utf-8")
          text = text.replace(
              '"""FastAPI routes for the production governed HHS assistant interface."""',
              '"""FastAPI routes for the Pass 210 production governed HHS assistant."""',
          )
          text = text.replace(
              "from hhs_backend.runtime.hhs_production_assistant_v1 import (\n"
              "            DEFAULT_PRODUCTION_ASSISTANT_SERVICE,\n"
              "        )\n"
              "        _SERVICE = DEFAULT_PRODUCTION_ASSISTANT_SERVICE",
              "from hhs_backend.runtime.hhs_pass210_production_assistant_v1 import (\n"
              "            DEFAULT_PASS210_PRODUCTION_ASSISTANT,\n"
              "        )\n"
              "        _SERVICE = DEFAULT_PASS210_PRODUCTION_ASSISTANT",
          )
          route.write_text(text, encoding="utf-8")

          for obsolete in (
              "contracts/pass209/PASS_209_CONTRACT.json",
              "deployment/digitalocean/llm/pass209-llm.env.example",
              "hhs_backend/api/pass209_llm_orchestrator_routes.py",
              "hhs_backend/runtime/hhs_pass209_native_agi_optimizer_v1.py",
              "hhs_backend/runtime/hhs_pass209_production_assistant_v1.py",
              "scripts/pass209_native_agi_optimizer_worker.py",
              "tests/test_hhs_pass209_digitalocean_llm_deployment_v1.py",
              "tests/test_hhs_pass209_llm_orchestrator_v1.py",
          ):
              path = Path(obsolete)
              if path.exists():
                  path.unlink()
          PY

          git config user.name hhs-pass210-bootstrap
          git config user.email hhs-pass210-bootstrap@users.noreply.github.com
          git add -A -- ':!.github/workflows'
          git commit -m "Migrate Kimi K3 LLM source to Pass 210"
          git push origin HEAD:agent/pass210-kimi-k3-native-llm
