name: Pass 219 Lane 5 Nine-Loop Relation Dataset 1.72

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/pass219/lane5_nine_loop_relation_dataset_1_72.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_RELATION_DATASET_1_72.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_RELATION_DATASET_1_72.md'
      - 'hhs_runtime/pass219/lane5_nine_loop_relation_dataset_1_72.py'
      - 'hhs_runtime/include/hhs_pass219_lane5_nine_loop_relation_dataset_cell_wall_1_72.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_nine_loop_relation_dataset_cell_wall_1_72.cpp'
      - 'tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_1_72.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_cell_wall_1_72.cpp'
      - 'docs/whitepapers/HHS_LANE5_NINE_LOOP_RELATION_DATASET_1_72.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'GNUmakefile'
      - '.github/workflows/pass219-lane5-nine-loop-relation-dataset-1-72.yml'
  push:
    branches:
      - main
      - agent/pass219-lane5-nine-loop-relation-dataset-1-72-20260928
    paths:
      - 'data/pass219/lane5_nine_loop_relation_dataset_1_72.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_RELATION_DATASET_1_72.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_RELATION_DATASET_1_72.md'
      - 'hhs_runtime/pass219/lane5_nine_loop_relation_dataset_1_72.py'
      - 'hhs_runtime/include/hhs_pass219_lane5_nine_loop_relation_dataset_cell_wall_1_72.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_nine_loop_relation_dataset_cell_wall_1_72.cpp'
      - 'tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_1_72.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_cell_wall_1_72.cpp'
      - 'docs/whitepapers/HHS_LANE5_NINE_LOOP_RELATION_DATASET_1_72.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'GNUmakefile'
      - '.github/workflows/pass219-lane5-nine-loop-relation-dataset-1-72.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nine-loop-relation-dataset-1-72:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped test dependency
        run: python -m pip install pytest numpy

      - name: Verify 1.72 dataset identity and ordered chain
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          from hhs_runtime.pass219.lane5_nine_loop_relation_dataset_1_72 import (
              DATASET_SHA256,
              RECORD_CHAIN_SHA256,
              build_relation_training_records,
              verify_dataset,
          )

          receipt = verify_dataset()
          records = build_relation_training_records()
          assert receipt["dataset_sha256"] == DATASET_SHA256
          assert receipt["ordered_record_chain_sha256"] == RECORD_CHAIN_SHA256
          assert receipt["record_count"] == 12
          assert receipt["class_partition"] == {
              "additive": 6,
              "neutral": 4,
              "negative": 2,
          }
          assert len(records) == 12
          assert records[6]["deviation_class"] == -1
          assert records[7]["deviation_class"] == -1
          assert receipt["model_weight_update_authority"] is False
          assert receipt["learning_commit_authority"] is False
          PY

      - name: Run 1.72 and nine-loop parent Python regressions
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_1_72.py \
            tests/pass219/test_pass219_lane5_nine_loop_training_specimen_1_71.py \
            tests/pass219/test_pass219_lane5_nine_loop_feedback_1_70.py \
            tests/pass219/test_pass219_lane5_nine_loop_large_artifact_1_69.py \
            tests/pass219/test_pass219_lane5_nine_loop_source_attestation_1_68.py \
            tests/pass219/test_pass219_lane5_nine_loop_foreign_equivalence_1_67.py

      - name: Build shared exact VM81 runtime
        run: make -f GNUmakefile c-kernel

      - name: Compile native 1.72 conformance
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_cell_wall_1_72.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -pthread \
            -o /tmp/test_pass219_lane5_nine_loop_relation_dataset_1_72

      - name: Run native 1.72 conformance
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: /tmp/test_pass219_lane5_nine_loop_relation_dataset_1_72

      - name: Verify dataset-only boundary
        run: |
          grep -F 'dd623f4fc778364274e7ba05c914fb441b724ca3ce41a4eb4df4cdc64935d587' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_RELATION_DATASET_1_72.json
          grep -F '4a951f76afcd3f759e74263bc9cd0019b50f034bc07e93341b73200e0c85bd6a' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_RELATION_DATASET_1_72.json
          grep -F '"model_weight_update_authority": false' \
            data/pass219/lane5_nine_loop_relation_dataset_1_72.json
          grep -F '"learning_commit_authority": false' \
            data/pass219/lane5_nine_loop_relation_dataset_1_72.json
