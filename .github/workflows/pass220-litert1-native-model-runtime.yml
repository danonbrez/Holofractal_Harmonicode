name: Pass 220 LiteRT1 Native Model Runtime

on:
  pull_request:
    paths:
      - 'native_projects/hhs_pass220_litert_native_model_runtime/**'
      - 'hhs_backend/runtime/hhs_pass220_native_litert_runtime_v1.py'
      - 'hhs_backend/runtime/hhs_production_assistant_v1.py'
      - 'requirements.txt'
      - 'requirements-litert-lm.txt'
      - 'start.sh'
      - 'tests/pass220/test_hhs_pass220_litert_native_model_runtime_v1.py'
      - 'tests/test_hhs_litert_lm_repo_bootstrap_v1.py'
      - 'contracts/pass220/PASS_220_LITERT1_NATIVE_MODEL_RUNTIME_V1.json'
      - 'docs/pass220/PASS_220_LITERT1_NATIVE_MODEL_RUNTIME.md'
      - '.github/workflows/pass220-litert1-native-model-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'native_projects/hhs_pass220_litert_native_model_runtime/**'
      - 'hhs_backend/runtime/hhs_pass220_native_litert_runtime_v1.py'
      - 'hhs_backend/runtime/hhs_production_assistant_v1.py'
      - 'requirements.txt'
      - 'requirements-litert-lm.txt'
      - 'start.sh'
      - 'tests/pass220/test_hhs_pass220_litert_native_model_runtime_v1.py'
      - 'tests/test_hhs_litert_lm_repo_bootstrap_v1.py'
      - 'contracts/pass220/PASS_220_LITERT1_NATIVE_MODEL_RUNTIME_V1.json'
      - 'docs/pass220/PASS_220_LITERT1_NATIVE_MODEL_RUNTIME.md'
      - '.github/workflows/pass220-litert1-native-model-runtime.yml'

permissions:
  contents: read

jobs:
  litert-native-model-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install default native HHS dependency closure
        run: python -m pip install --disable-pip-version-check pytest -r requirements.txt
      - name: Compile and run native LiteRT model registry
        run: make -C native_projects/hhs_pass220_litert_native_model_runtime clean all test
      - name: Run LiteRT1 native/RNA dependency inversion gates
        run: |
          python -m pytest -q             tests/pass220/test_hhs_pass220_litert_native_model_runtime_v1.py             tests/test_hhs_litert_lm_repo_bootstrap_v1.py
      - name: Validate launcher syntax
        run: bash -n start.sh tools/bootstrap_litert_lm.sh tools/import_hhs_gemma4_model.sh
