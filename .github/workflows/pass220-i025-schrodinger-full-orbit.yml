name: Pass 220 I025 Schrodinger Full Orbit

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_schrodinger_firing_order_v1.py"
      - "tests/pass220/test_hhs_pass220_schrodinger_firing_order_v1.py"
      - "hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py"
      - "tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py"
      - "docs/pass220/PASS_220_I025_SCHRODINGER_FULL_ORBIT.md"
      - "evidence/pass220/i025_schrodinger_full_orbit_wolfram_20260921_v1.wl"
      - "evidence/pass220/i025_schrodinger_full_orbit_wolfram_20260921_v1.output.json"
      - "docs/operations/restart/PASS_220_I025_SCHRODINGER_FULL_ORBIT_RESTART.md"
      - ".github/workflows/pass220-i025-schrodinger-full-orbit.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_schrodinger_firing_order_v1.py"
      - "tests/pass220/test_hhs_pass220_schrodinger_firing_order_v1.py"
      - "hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py"
      - "tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py"
      - "docs/pass220/PASS_220_I025_SCHRODINGER_FULL_ORBIT.md"
      - "evidence/pass220/i025_schrodinger_full_orbit_wolfram_20260921_v1.wl"
      - "evidence/pass220/i025_schrodinger_full_orbit_wolfram_20260921_v1.output.json"
      - "docs/operations/restart/PASS_220_I025_SCHRODINGER_FULL_ORBIT_RESTART.md"
      - ".github/workflows/pass220-i025-schrodinger-full-orbit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify exact-authority AST
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path(
              "hhs_runtime/hhs_pass220_schrodinger_firing_order_v1.py"
          )
          tree = ast.parse(
              path.read_text(encoding="utf-8"), filename=str(path)
          )

          forbidden_imports = {
              "numpy", "scipy", "sympy", "decimal", "time", "datetime"
          }
          forbidden_calls = {
              "float", "complex", "eval", "exec", "pow", "sqrt", "exp",
              "eig", "eigh", "eigvals", "eigvalsh",
          }
          violations = []

          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      root = alias.name.split(".")[0]
                      if root in forbidden_imports:
                          violations.append(
                              f"forbidden import {alias.name} line {node.lineno}"
                          )
              elif isinstance(node, ast.ImportFrom):
                  root = (node.module or "").split(".")[0]
                  if root in forbidden_imports:
                      violations.append(
                          f"forbidden import-from {node.module} line {node.lineno}"
                      )
              elif isinstance(node, ast.Call):
                  func = node.func
                  if (
                      isinstance(func, ast.Name)
                      and func.id in forbidden_calls
                  ):
                      violations.append(
                          f"forbidden call {func.id} line {node.lineno}"
                      )
                  elif (
                      isinstance(func, ast.Attribute)
                      and func.attr in forbidden_calls
                  ):
                      violations.append(
                          f"forbidden attribute call "
                          f"{ast.unparse(func)} line {node.lineno}"
                      )

          if violations:
              raise SystemExit("\n".join(violations))
          print("HHS_I025_AST_AUTHORITY_SCAN=PASS")
          PY

      - name: Compile exact I025 surface
        run: >
          python -m py_compile
          hhs_runtime/hhs_pass220_schrodinger_firing_order_v1.py

      - name: Verify Wolfram 25 of 25 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path(
              "evidence/pass220/"
              "i025_schrodinger_full_orbit_wolfram_20260921_v1.output.json"
          )
          data = json.loads(p.read_text())
          assert data["status"] == "PASS"
          assert data["check_count"] == data["pass_count"] == 25
          assert data["failed"] == []
          assert data["cycle_lengths"] == [9] * 8
          assert data["positive_energy_eigenphase"] == "zeta9^(-k)"
          assert data["finite_difference_equalities_k1_to_8"] == (
              [False] * 8
          )
          PY

      - name: Run I025 and inherited firing-order regressions
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_schrodinger_firing_order_v1.py
          tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py
