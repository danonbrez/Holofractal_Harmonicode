name: Pass 219 Real-Source Translation Calibration v1

on:
  pull_request:
    paths:
      - 'hhs_runtime/hhs_pass219_real_source_translation_calibration_v1.py'
      - 'data/pass219/translation_invariant_real_source_calibration_v1.json'
      - 'tests/pass219/test_hhs_pass219_real_source_translation_calibration_v1.py'
      - 'contracts/pass219/PASS_219_REAL_SOURCE_TRANSLATION_INVARIANCE_CALIBRATION_V1.md'
      - '.github/workflows/pass219-real-source-translation-calibration-v1.yml'
  push:
    branches: [main]
    paths:
      - 'hhs_runtime/hhs_pass219_real_source_translation_calibration_v1.py'
      - 'data/pass219/translation_invariant_real_source_calibration_v1.json'
      - 'tests/pass219/test_hhs_pass219_real_source_translation_calibration_v1.py'
      - 'contracts/pass219/PASS_219_REAL_SOURCE_TRANSLATION_INVARIANCE_CALIBRATION_V1.md'
      - '.github/workflows/pass219-real-source-translation-calibration-v1.yml'

permissions:
  contents: read

jobs:
  real-source-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile bounded calibration surfaces
        run: |
          python -m py_compile hhs_runtime/hhs_pass219_real_source_translation_calibration_v1.py
          python -m py_compile tests/pass219/test_hhs_pass219_real_source_translation_calibration_v1.py
      - name: Validate frozen manifest JSON
        run: python -m json.tool data/pass219/translation_invariant_real_source_calibration_v1.json >/dev/null
      - name: Run bounded real-source calibration tests
        run: pytest -q tests/pass219/test_hhs_pass219_real_source_translation_calibration_v1.py
