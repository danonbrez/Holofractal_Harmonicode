name: Pass 196 Integrated Environment

on:
  push:
    paths:
      - "HHS_PASS_196_SERIALIZED_PARALLEL_INTEGRATED_ENVIRONMENT.md"
      - "hhs_backend/runtime/hhs_pass196_integrated_environment_v1.py"
      - "hhs_backend/api/pass196_integration_routes.py"
      - "hhs_backend/visual_server.py"
      - "applications/holofractal_harmonizer/src/pass196-integration.mjs"
      - "applications/holofractal_harmonizer/src/production-startup-coordinator.mjs"
      - "tests/test_hhs_pass196_integrated_environment_v1.py"
      - "deploy/digitalocean/hhs-pass196*"
      - "docs/pass196/**"
      - ".github/workflows/pass196-integrated-environment.yml"
  pull_request:
    paths:
      - "HHS_PASS_196_SERIALIZED_PARALLEL_INTEGRATED_ENVIRONMENT.md"
      - "hhs_backend/runtime/hhs_pass196_integrated_environment_v1.py"
      - "hhs_backend/api/pass196_integration_routes.py"
      - "hhs_backend/visual_server.py"
      - "applications/holofractal_harmonizer/src/pass196-integration.mjs"
      - "applications/holofractal_harmonizer/src/production-startup-coordinator.mjs"
      - "tests/test_hhs_pass196_integrated_environment_v1.py"
      - "deploy/digitalocean/hhs-pass196*"
      - "docs/pass196/**"
      - ".github/workflows/pass196-integrated-environment.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Pass 196 Python surfaces
        run: |
          python -m py_compile hhs_backend/runtime/hhs_pass196_integrated_environment_v1.py
          python -m py_compile hhs_backend/api/pass196_integration_routes.py
          python -m py_compile tests/test_hhs_pass196_integrated_environment_v1.py
      - name: Validate Pass 196 browser module
        run: node --check applications/holofractal_harmonizer/src/pass196-integration.mjs
      - name: Verify Visual IDE and server wiring
        run: |
          grep -F "import './pass196-integration.mjs';" applications/holofractal_harmonizer/src/production-startup-coordinator.mjs
          grep -F "pass196_integration_router" hhs_backend/visual_server.py
          grep -F "hhs_backend.visual_server:app" deploy/digitalocean/hhs-pass196-integrated-environment.service
      - name: Run Pass 196 tests
        run: python -m unittest tests.test_hhs_pass196_integrated_environment_v1
