name: Pass 219 I166 Pass168 Terminal Seal Once

on:
  push:
    branches:
      - agent/pass219-i166-pass168-terminal-parent-closure
    paths:
      - '.github/workflows/pass219-i166-pass168-terminal-seal-once.yml'

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_PASS168_STATE_DIR: /tmp/pass219-i166-seal-state
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass219-i166-pass168-terminal-parent-closure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded seal dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx 'cryptography>=45.0,<47.0'

      - name: Build full canonical runtime
        run: |
          set -euo pipefail
          timeout 600s make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep -E \
            'hhs_runtime_init|hhs_pass168_(candidate_validate|commit_candidate|self_test|comparator_conformance)'

      - name: Revalidate terminal dependency scope before sealing
        run: |
          set -euo pipefail
          rm -rf "$HHS_PASS168_STATE_DIR"
          python -m pytest -q --tb=short \
            tests/pass219/test_pass219_i166_pass168_terminal_parent_closure.py \
            tests/pass219/test_pass219_i166_pass168_parameter_matrix.py
          python - <<'PY'
          from hhs_runtime.pass219.pass169_terminal_reconciliation import _pass168_terminal_receipt_valid
          assert _pass168_terminal_receipt_valid({'verified': True}) is False
          print('Pass169 bare Pass168 receipt rejection: PASS')
          PY

      - name: Generate exact prescribed Pass168 artifact set
        run: |
          set -euo pipefail
          rm -rf /tmp/pass168-terminal-artifacts
          python -m hhs_runtime.pass168.terminal_artifacts \
            /tmp/pass168-terminal-artifacts \
            --branch-head "$GITHUB_SHA" \
            --native-run-id 33896435315 \
            --native-artifact-id 9945932317 \
            --native-artifact-digest sha256:777d246f70152054048e002989a3b676912a67b9d81fb74b39ca7ce26c0b44c7 \
            --public-run-id 33896470887 \
            --public-artifact-id 9945930122 \
            --public-artifact-digest sha256:7d7c27142a98474f4ba1e3cd7d81544510352104e72ffa1c52e20e642fcef457 \
            --matrix-run-id 33896299969 \
            | tee /tmp/pass168-seal-result.json
          python -m json.tool /tmp/pass168-seal-result.json >/dev/null
          test "$(find /tmp/pass168-terminal-artifacts -maxdepth 1 -type f | wc -l)" -eq 22
          test -s /tmp/pass168-terminal-artifacts/HHS_PASS_168_COMPLETION_RECEIPT.json
          test -s /tmp/pass168-terminal-artifacts/HHS_PASS_168_EVIDENCE_MANIFEST.json

      - name: Validate generated completion receipt and manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('/tmp/pass168-terminal-artifacts')
          receipt=json.loads((root/'HHS_PASS_168_COMPLETION_RECEIPT.json').read_text())
          manifest=json.loads((root/'HHS_PASS_168_EVIDENCE_MANIFEST.json').read_text())
          assert receipt['terminal_verified'] is True and receipt['verified'] is True
          assert receipt['contract_id']=='HHS-P168-VM81-5184-HPC-STCF'
          assert receipt['classification']=='HHS_PASS_168_VM81_5184_CELL_HARMONICODE_PARAMETER_CIRCUIT_AND_SPARSE_TENSOR_CONTROL_FABRIC_VERIFIED'
          assert receipt['source_bytes']==424
          assert receipt['source_sha256']=='fdbee5db0f2fea428b6b88e5ac9b273e6aa3754fa00f84e8923456373275166e'
          assert receipt['cells_covered']==5184 and receipt['threads_registered']==64
          assert receipt['x86_64_verified'] is True and receipt['arm64_verified'] is True
          assert receipt['sanitizers_passed'] is True
          assert receipt['parameter_matrix_verified'] is True
          assert receipt['floating_point_canonical_authority'] is False
          assert receipt['fallback_used'] is False
          assert manifest['result']=='PASS'
          assert manifest['artifact_inventory_count']==21
          for row in manifest['artifact_records']:
              data=(root/row['path']).read_bytes()
              assert len(data)==row['bytes']
              assert hashlib.sha256(data).hexdigest()==row['sha256']
          print(json.dumps({
              'receipt_sha256':hashlib.sha256((root/'HHS_PASS_168_COMPLETION_RECEIPT.json').read_bytes()).hexdigest(),
              'manifest_sha256':hashlib.sha256((root/'HHS_PASS_168_EVIDENCE_MANIFEST.json').read_bytes()).hexdigest(),
              'artifact_count':22,
          },sort_keys=True))
          PY

      - name: Stage generated artifacts and verify Pass169 parent resolution
        run: |
          set -euo pipefail
          cp /tmp/pass168-terminal-artifacts/* .
          python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass219.pass169_terminal_reconciliation import (
              build_i164_pass169_terminal_reconciliation,
              _pass168_terminal_receipt_valid,
          )
          receipt=json.loads(Path('HHS_PASS_168_COMPLETION_RECEIPT.json').read_text())
          assert _pass168_terminal_receipt_valid(receipt) is True
          report=build_i164_pass169_terminal_reconciliation('.')
          assert report['terminal_conditions']['pass168_parent_resolved'] is True
          assert 'PASS168_TERMINAL_PARENT_RECEIPT_UNRESOLVED' not in report['blockers']
          assert 'PASS169_CANONICAL_CORPUS_ABSENT' in report['blockers']
          Path('/tmp/pass169-after-pass168.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps({'pass168_parent_resolved':True,'remaining_blockers':report['blockers']},sort_keys=True))
          PY

      - name: Commit terminal Pass168 artifact set atomically
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            HHS_PASS_168_CONTRACT.md \
            HHS_PASS_168_AUTHORITY_BINDING.json \
            HHS_PASS_168_SOURCE_FIXTURE.harmonicode \
            HHS_PASS_168_PARAMETER_REGISTRY.json \
            HHS_PASS_168_EQUALITY_HALF_GATE_REGISTRY.json \
            HHS_PASS_168_THREAD_MAP.json \
            HHS_PASS_168_5184_CELL_MAP.json \
            HHS_PASS_168_BANK_LAYOUT.json \
            HHS_PASS_168_DEPENDENCY_GRAPH.json \
            HHS_PASS_168_ABI.json \
            HHS_PASS_168_API_SCHEMA.json \
            HHS_PASS_168_CLI_MATRIX.json \
            HHS_PASS_168_POSITIVE_TEST_MATRIX.json \
            HHS_PASS_168_NEGATIVE_TEST_MATRIX.json \
            HHS_PASS_168_5184_COVERAGE_REPORT.json \
            HHS_PASS_168_SPARSE_UPDATE_REPORT.json \
            HHS_PASS_168_GPU_MAPPING_REPORT.json \
            HHS_PASS_168_CROSS_ARCH_REPLAY_REPORT.json \
            HHS_PASS_168_SANITIZER_REPORT.json \
            HHS_PASS_168_BENCHMARK_REPORT.json \
            HHS_PASS_168_EVIDENCE_MANIFEST.json \
            HHS_PASS_168_COMPLETION_RECEIPT.json
          test "$(git diff --cached --name-only | wc -l)" -eq 22
          git commit -m 'Pass 219 I166: seal Pass168 terminal parent closure [skip ci]'
          git push origin HEAD:agent/pass219-i166-pass168-terminal-parent-closure
