name: Pass 190 Iteration 3 Native ABI Compiler Parity Authority

on:
  push:
    paths:
      - "HHS_PASS_190_ITERATION_3_NATIVE_ABI_COMPILER_PARITY_AUTHORITY.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - ".github/workflows/pass190-iteration3.yml"
  pull_request:
    paths:
      - "HHS_PASS_190_ITERATION_3_NATIVE_ABI_COMPILER_PARITY_AUTHORITY.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - ".github/workflows/pass190-iteration3.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pass 190 iteration 3
        working-directory: native_projects/hhs_pass190_operation_fabric
        run: make validate
