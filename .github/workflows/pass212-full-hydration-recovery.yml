name: Pass 212 Full Hydration Recovery

on:
  push:
    branches:
      - main
      - agent/pass212-physical-shard-erasure-recovery
    paths:
      - 'hhs_backend/runtime/hhs_pass212_full_hydration_recovery_v1.py'
      - 'hhs_backend/api/pass212_full_hydration_recovery_routes.py'
      - 'tests/test_hhs_pass212_full_hydration_recovery_v1.py'
      - 'tests/test_hhs_pass212_full_hydration_recovery_api_v1.py'
      - 'tools/generate_pass212_full_hydration_evidence.py'
      - 'evidence/pass212/**'
      - 'contracts/pass212/**'
      - 'docs/pass212/**'
      - 'scripts/run_pass212_full_hydration_validation.sh'
      - 'HHS_PASS_212_FULL_HYDRATION_SUPERFRAME_COMPRESSION_AND_PHYSICAL_ERASURE_RECOVERY.md'
      - '.github/workflows/pass212-full-hydration-recovery.yml'
  pull_request:
    paths:
      - 'hhs_backend/runtime/hhs_pass212_full_hydration_recovery_v1.py'
      - 'hhs_backend/api/pass212_full_hydration_recovery_routes.py'
      - 'tests/test_hhs_pass212_full_hydration_recovery_v1.py'
      - 'tests/test_hhs_pass212_full_hYDRATION_RECOVERY_API_v1.py'
      - 'tools/generate_pass212_full_hydration_evidence.py'
      - 'evidence/pass212/**'
      - 'contracts/pass212/**'
      - 'docs/pass212/**'
      - 'scripts/run_pass212_full_hydration_validation.sh'
      - 'HHS_PASS_212_FULL_HYDRATION_SUPERFRAME_COMPRESSION_AND_PHYSICAL_ERASURE_RECOVERY.md'
      - '.github/workflows/pass212-full-hydration-recovery.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio fastapi pydantic httpx sympy
      - name: Validate full hydration compression and physical recovery
        run: bash scripts/run_pass212_full_hydration_validation.sh
