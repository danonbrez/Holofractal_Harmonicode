name: Pass 214 Iteration 1 Materializer

on:
  push:
    branches:
      - agent/pass214-operating-compression-gradient
    paths:
      - '.github/bootstrap_pass214_iteration1/**'
      - '.github/workflows/pass214-compound-optimization-benchmark.yml'

permissions:
  contents: write

jobs:
  materialize-iteration1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Materialize Pass 214 Iteration 1
        shell: bash
        run: |
          cat .github/bootstrap_pass214_iteration1/part-*.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/bootstrap_pass214_iteration1.py
          python /tmp/bootstrap_pass214_iteration1.py
          rm -rf .github/bootstrap_pass214_iteration1
          git config user.name "hhs-pass214-iteration1"
          git config user.email "hhs-pass214-iteration1@users.noreply.github.com"
          git add -A
          git commit -m "Implement Pass 214 repository census"
          git push origin "HEAD:${GITHUB_REF_NAME}"
