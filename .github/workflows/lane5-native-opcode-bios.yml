name: Lane5 Native Opcode BIOS Candidate
on:
  pull_request:
    paths:
      - 'hhs_runtime/acceleration/hhs_lane5_*'
      - 'hhs_runtime/cpp/hhs_lane5_opcode_bios_controller_v1.cpp'
      - 'hhs_runtime/include/hhs_lane5_opcode_bios_controller_v1.hpp'
      - 'hhs_python/runtime/hhs_lane5_sql_native_bios_v1.py'
      - 'tests/test_lane5_*bios_v1*'
      - 'tests/test_lane5_hash216_lower_parity_v1.py'
      - '.github/workflows/lane5-native-opcode-bios.yml'
  workflow_dispatch:
jobs:
  strict-c-and-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          python -m pip install cryptography
      - name: Strict native C and C++ compilation
        run: |
          set -eu
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/acceleration \
            hhs_runtime/acceleration/hhs_lane5_opcode_bios_v1.c \
            tests/test_lane5_opcode_bios_v1.c -o /tmp/hhs_bios_test
          /tmp/hhs_bios_test
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -fPIC -shared hhs_runtime/acceleration/hhs_lane5_hash216_lower_v1.c \
            -lcrypto -o /tmp/libhhs_hash216_lower.so
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -Ihhs_runtime/include -Ihhs_runtime/acceleration \
            -c hhs_runtime/cpp/hhs_lane5_opcode_bios_controller_v1.cpp \
            -o /tmp/hhs_bios_controller.o
      - name: Python versus native SHA256 parity
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_lane5_hash216_lower_parity_v1.py' -v
      - name: SQL AES-GCM restart and native read
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_lane5_sql_native_bios_v1.py' -v
