name: Pass 211 BigInt HFC Carrier

on:
  push:
    branches:
      - agent/pass211-bigint-hfc-carrier
    paths:
      - 'hhs_backend/runtime/hhs_pass211_bigint_hfc_carrier_v1.py'
      - 'hhs_backend/api/pass211_bigint_hfc_routes.py'
      - 'tests/test_hhs_pass211_bigint_hfc_carrier_v1.py'
      - 'tests/test_hhs_pass211_bigint_hfc_api_v1.py'
      - 'tools/generate_pass211_bigint_hfc_evidence.py'
      - 'contracts/pass211/**'
      - 'docs/pass211/**'
      - 'HHS_PASS_211_BIGINT_HFC_CARRIER_AND_MULTI_REGISTER_FRAMING.md'
      - '.github/workflows/pass211-bigint-hfc-carrier.yml'
  pull_request:
    paths:
      - 'hhs_backend/runtime/hhs_pass211_bigint_hfc_carrier_v1.py'
      - 'hhs_backend/api/pass211_bigint_hfc_routes.py'
      - 'tests/test_hhs_pass211_bigint_hfc_carrier_v1.py'
      - 'tests/test_hhs_pass211_bigint_hfc_api_v1.py'
      - 'tools/generate_pass211_bigint_hfc_evidence.py'
      - 'evidence/pass211/**'
      - 'contracts/pass211/**'
      - 'docs/pass211/**'
      - 'HHS_PASS_211_BIGINT_HFC_CARRIER_AND_MULTI_REGISTER_FRAMING.md'
      - 'scripts/run_pass211_bigint_hfc_validation.sh'
      - '.github/workflows/pass211-bigint-hfc-carrier.yml'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio fastapi pydantic httpx sympy
      - name: Parse frozen contract
        run: python -m json.tool contracts/pass211/PASS_211_CONTRACT.json >/dev/null
      - name: Compile Pass 211 surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass211_bigint_hfc_carrier_v1.py \
            hhs_backend/api/pass211_bigint_hfc_routes.py \
            tools/generate_pass211_bigint_hfc_evidence.py \
            tests/test_hhs_pass211_bigint_hfc_carrier_v1.py \
            tests/test_hhs_pass211_bigint_hfc_api_v1.py
      - name: Run inherited and Pass 211 suites
        run: |
          pytest -q \
            tests/test_pass133.py \
            tests/test_hhs_pass210_holographic_frame_compression_v1.py \
            tests/test_hhs_pass211_bigint_hfc_carrier_v1.py \
            tests/test_hhs_pass211_bigint_hfc_api_v1.py
      - name: Generate deterministic evidence candidate
        run: python tools/generate_pass211_bigint_hfc_evidence.py
      - name: Upload evidence candidate
        uses: actions/upload-artifact@v4
        with:
          name: pass211-bigint-hfc-evidence
          path: evidence/pass211/PASS_211_BIGINT_HFC_REFERENCE_VECTORS.json
          if-no-files-found: error
