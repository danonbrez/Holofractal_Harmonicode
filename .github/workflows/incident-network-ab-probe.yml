name: Incident Network A-B Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-network-ab-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare clean control and production reachability
        shell: bash
        run: |
          set +e
          probe() {
            host="$1"
            port="$2"
            label="$3"
            started=$(date +%s)
            timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port" >/dev/null 2>&1
            rc=$?
            elapsed=$(( $(date +%s) - started ))
            if [ "$rc" -eq 0 ]; then
              state=open
            elif [ "$rc" -eq 124 ]; then
              state=timeout_or_filtered
            else
              state=refused_or_unreachable
            fi
            printf 'NETWORK_AB label=%s host=%s port=%s state=%s rc=%s elapsed_s=%s\n'               "$label" "$host" "$port" "$state" "$rc" "$elapsed"
          }

          for port in 22 80 443 8080 8720; do
            probe 134.209.161.168 "$port" clean-control
          done
          for port in 22 80 443 8080 8720; do
            probe 104.236.61.39 "$port" tagged-control
          done
          for port in 22 80 443 8080 8720; do
            probe 162.243.186.202 "$port" backup-sep27
          done
          for port in 22 80 443 8080 8720; do
            probe 104.131.56.236 "$port" backup-sep26
          done
          for port in 22 80 443 8080 8720; do
            probe 138.197.93.86 "$port" replacement-snapshot
          done
          for port in 22 80 443 8080 8720; do
            probe 159.65.178.254 "$port" production
          done

          echo '--- HTTPS control ---'
          curl -kIsS --connect-timeout 5 --max-time 8 https://134.209.161.168/ || true
          echo '--- HTTPS production ---'
          curl -kIsS --connect-timeout 5 --max-time 8 https://159.65.178.254/ || true

      - name: Probe production private NIC from inside NYC3 VPC
        shell: bash
        env:
          HHS_CONTROL_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HHS_CONTROL_SSH_PRIVATE_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HHS_CONTROL_SSH_PRIVATE_KEY" > "$HOME/.ssh/control"
          chmod 0600 "$HOME/.ssh/control"
          ssh-keyscan -T 5 -H 134.209.161.168 > "$HOME/.ssh/control_known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/control_known_hosts"
          chmod 0600 "$HOME/.ssh/control_known_hosts"

          ssh -i "$HOME/.ssh/control" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=8 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/control_known_hosts" \
            root@134.209.161.168 'bash -s' <<'REMOTE'
          set +e
          ip route get 10.108.0.5 || true
          probe() {
            host="$1"
            port="$2"
            label="$3"
            started=$(date +%s)
            timeout 5 bash -c "exec 3<>/dev/tcp/$host/$port" >/dev/null 2>&1
            rc=$?
            elapsed=$(( $(date +%s) - started ))
            if [ "$rc" -eq 0 ]; then
              state=open
            elif [ "$rc" -eq 124 ]; then
              state=timeout_or_filtered
            else
              state=refused_or_unreachable
            fi
            printf 'VPC_PROBE label=%s host=%s port=%s state=%s rc=%s elapsed_s=%s\n' \
              "$label" "$host" "$port" "$state" "$rc" "$elapsed"
          }
          for port in 22 80 443 8080 8720; do
            probe 10.108.0.5 "$port" production-private
          done
          for port in 22 80 443; do
            probe 159.65.178.254 "$port" production-public-from-vpc
          done
          REMOTE


      - name: Verify Sep27 clone identity and inspect guest state
        shell: bash
        env:
          HHS_CONTROL_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
          HHS_PINNED_KNOWN_HOSTS: ${{ secrets.HHS_DIGITALOCEAN_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HHS_CONTROL_SSH_PRIVATE_KEY"
          test -n "$HHS_PINNED_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$HHS_CONTROL_SSH_PRIVATE_KEY" > "$HOME/.ssh/recovery"
          chmod 0600 "$HOME/.ssh/recovery"
          printf '%s\n' "$HHS_PINNED_KNOWN_HOSTS" > "$HOME/.ssh/pinned"
          chmod 0600 "$HOME/.ssh/pinned"

          ssh-keygen -F 159.65.178.254 -f "$HOME/.ssh/pinned"             | awk '!/^#/ && NF >= 3 {print $2 " " $3}'             | sort -u > "$RUNNER_TEMP/old.keys"
          test -s "$RUNNER_TEMP/old.keys"

          ssh-keyscan -T 8 162.243.186.202 2>/dev/null             | tee "$HOME/.ssh/recovery_known_hosts"             | awk 'NF >= 3 {print $2 " " $3}'             | sort -u > "$RUNNER_TEMP/new.keys"
          test -s "$RUNNER_TEMP/new.keys"

          comm -12 "$RUNNER_TEMP/old.keys" "$RUNNER_TEMP/new.keys"             > "$RUNNER_TEMP/matching.keys"
          test -s "$RUNNER_TEMP/matching.keys"
          echo "RECOVERY_CLONE_PINNED_HOST_KEY_MATCH=1"

          ssh -i "$HOME/.ssh/recovery"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o ConnectTimeout=10             -o StrictHostKeyChecking=yes             -o UserKnownHostsFile="$HOME/.ssh/recovery_known_hosts"             root@162.243.186.202 'bash -s' <<'RECOVERY'
          set -euo pipefail
          echo "RECOVERY_SSH_OK=1"
          printf 'RECOVERY_HOSTNAME='; hostname
          printf 'RECOVERY_UPTIME='; uptime -p || true
          printf 'RECOVERY_ROOT_FS='; df -h / | tail -1
          printf 'RECOVERY_MAIN_SHA='
          git -C /opt/hhs/app rev-parse HEAD 2>/dev/null || echo MISSING
          printf 'RECOVERY_MAIN_BRANCH='
          git -C /opt/hhs/app branch --show-current 2>/dev/null || true
          for svc in ssh nginx hhs.service hhs-application-vm.service hhs-guarded-update.timer; do
            printf 'RECOVERY_SERVICE_%s=' "$svc"
            systemctl is-active "$svc" 2>/dev/null || true
          done
          echo 'RECOVERY_LISTENERS_BEGIN'
          ss -ltnp | grep -E ':(22|80|443|8080|8720)\b' || true
          echo 'RECOVERY_LISTENERS_END'
          curl -kfsS --connect-timeout 5 --max-time 10 https://127.0.0.1/ -o /tmp/recovery-root.html || true
          if test -s /tmp/recovery-root.html; then
            echo "RECOVERY_LOCAL_HTTPS_BODY=1"
          else
            echo "RECOVERY_LOCAL_HTTPS_BODY=0"
          fi
          RECOVERY
