name: Pass 220 I032 G3 Full Phase IEEE Transport

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_g3_full_phase_ieee_transport_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "tests/pass220/test_hhs_pass220_g3_full_phase_ieee_transport_v1.py"
      - "evidence/pass220/i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.wl"
      - "evidence/pass220/i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.output.json"
      - "evidence/pass220/i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.receipt.json"
      - "docs/whitepapers/HARMONICODE_G3_FULL_PHASE_IEEE_TRANSPORT_THEOREM.md"
      - "docs/pass220/PASS_220_I032_G3_FULL_PHASE_IEEE_TRANSPORT.md"
      - "docs/operations/restart/PASS_220_I032_G3_FULL_PHASE_IEEE_TRANSPORT_RESTART.md"
      - "whitepapers/HOLOFRACTAL_HARMONICODE.md"
      - ".github/workflows/pass220-i032-g3-full-phase-ieee-transport.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_g3_full_phase_ieee_transport_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "tests/pass220/test_hhs_pass220_g3_full_phase_ieee_transport_v1.py"
      - "evidence/pass220/i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.wl"
      - "evidence/pass220/i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.output.json"
      - "evidence/pass220/i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.receipt.json"
      - "docs/whitepapers/HARMONICODE_G3_FULL_PHASE_IEEE_TRANSPORT_THEOREM.md"
      - "docs/pass220/PASS_220_I032_G3_FULL_PHASE_IEEE_TRANSPORT.md"
      - "docs/operations/restart/PASS_220_I032_G3_FULL_PHASE_IEEE_TRANSPORT_RESTART.md"
      - "whitepapers/HOLOFRACTAL_HARMONICODE.md"
      - ".github/workflows/pass220-i032-g3-full-phase-ieee-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-scoped requirements
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile I032 surfaces
        run: |
          python -m py_compile \
            hhs_runtime/hhs_pass220_g3_full_phase_ieee_transport_v1.py \
            tests/pass220/test_hhs_pass220_g3_full_phase_ieee_transport_v1.py

      - name: Verify Wolfram 22 of 22 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path(
              "evidence/pass220/"
              "i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.wl"
          ).read_text(encoding="utf-8")
          data = json.loads(
              Path(
                  "evidence/pass220/"
                  "i032_g3_full_phase_ieee_transport_wolfram_20260922_v1.output.json"
              ).read_text(encoding="utf-8")
          )
          assert data["status"] == "PASS"
          assert data["check_count"] == data["pass_count"] == 22
          assert data["failed"] == []
          assert data["phase_names"] == ["x", "y", "z", "w"]
          assert data["schema"] in source
          PY

      - name: Run I032 full-phase IEEE transport tests
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_g3_full_phase_ieee_transport_v1.py

      - name: Run inherited I031 scalar involution regression
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_g3_ieee_scalar_involution_v1.py

      - name: Run inherited I030 symbol reciprocal regression
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_g3_reciprocal_symbol_codec_v1.py

      - name: Run inherited I028 native G3 identity regression
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            tests/pass220/test_hhs_pass220_g3_ouroboros_vm81_native_v1.c \
            -o /tmp/test_hhs_i032_g3
          /tmp/test_hhs_i032_g3

      - name: Reject host floating arithmetic in I032 runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path(
              "hhs_runtime/hhs_pass220_g3_full_phase_ieee_transport_v1.py"
          ).read_text(encoding="utf-8")
          forbidden = ("float(", "struct.", "Decimal(", "Fraction(", "numpy.")
          hits = [token for token in forbidden if token in source]
          assert not hits, hits
          assert '"boundary_reciprocal_rule": "y=1/x"' in source
          assert "full_phase_tensor_drives_internal_logic" in source
          PY
