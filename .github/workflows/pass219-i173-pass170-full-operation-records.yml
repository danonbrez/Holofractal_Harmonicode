name: Pass 219 I173 Pass170 Full Operation Records

on:
  push:
    branches:
      - main
      - agent/pass219-i173-pass170-launcher-operation-records
    paths:
      - 'HHS_PUBLIC_OPERATION_RECORD_INDEX.json'
      - 'contracts/pass219/pass170_operation_records_i173/**'
      - 'hhs_runtime/pass219/pass170_full_operation_records_i173.py'
      - 'tests/pass219/test_pass219_i173_pass170_full_operation_records.py'
      - 'contracts/pass219/PASS_219_I173_PASS170_FULL_OPERATION_RECORDS_1_0.json'
      - '.github/workflows/pass219-i173-pass170-full-operation-records.yml'
      - 'docs/operations/restart/PASS_219_I173_PASS170_FULL_OPERATION_RECORDS_RESTART.md'
  pull_request:
    branches:
      - main
    paths:
      - 'HHS_PUBLIC_OPERATION_RECORD_INDEX.json'
      - 'contracts/pass219/pass170_operation_records_i173/**'
      - 'hhs_runtime/pass219/pass170_full_operation_records_i173.py'
      - 'tests/pass219/test_pass219_i173_pass170_full_operation_records.py'
      - 'contracts/pass219/PASS_219_I173_PASS170_FULL_OPERATION_RECORDS_1_0.json'
      - '.github/workflows/pass219-i173-pass170-full-operation-records.yml'
      - 'docs/operations/restart/PASS_219_I173_PASS170_FULL_OPERATION_RECORDS_RESTART.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-i173:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded validation dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Parse record package and compile I173 surfaces
        run: |
          set -euo pipefail
          python -m json.tool HHS_PUBLIC_OPERATION_RECORD_INDEX.json >/dev/null
          for f in contracts/pass219/pass170_operation_records_i173/*.json; do python -m json.tool "$f" >/dev/null; done
          python -m json.tool contracts/pass219/PASS_219_I173_PASS170_FULL_OPERATION_RECORDS_1_0.json >/dev/null
          python -m py_compile hhs_runtime/pass219/pass170_full_operation_records_i173.py
          python -m py_compile tests/pass219/test_pass219_i173_pass170_full_operation_records.py

      - name: Run dependency-scoped I173 tests
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/pass219/test_pass219_i173_pass170_full_operation_records.py

      - name: Execute I173 fail-closed operation-record gate
        run: |
          set -euo pipefail
          mkdir -p artifacts/pass219/i173
          python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass219.pass170_full_operation_records_i173 import verify_i173_full_operation_records

          report = verify_i173_full_operation_records(Path('.'))
          Path('artifacts/pass219/i173/full_operation_records_verification.json').write_text(
              json.dumps(report, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Enforce I173 bounded nonterminal boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/pass219/i173/full_operation_records_verification.json').read_text())
          expected = [
              'PASS170_EXPLICIT_SOURCE_ONLY_DEGRADED_GATEWAY_REMAINS',
              'PASS170_LEGACY_FASTAPI_CONSTRUCTORS_REMAIN',
              'PASS170_LEGACY_SELF_LAUNCH_BYPASSES_REMAIN',
              'PASS170_PUBLIC_CLI_NATIVE_LANGUAGE_PARITY_PENDING',
              'PASS170_PUBLIC_E2E_RECEIPT_REPLAY_PENDING',
          ]
          checks = [
              ('evidence_verified', report['evidence_verified'] is True, report['evidence_verified']),
              ('evidence_blockers_empty', report['evidence_blockers'] == [], report['evidence_blockers']),
              ('inherited_i172_verified', report['inherited_i172_verified'] is True, report['inherited_i172_verified']),
              ('frozen_i171_registry_retained', report['frozen_i171_route_identity_registry_retained'] is True, report['frozen_i171_route_identity_registry_retained']),
              ('shard_count', report['shard_count'] == 5, report['shard_count']),
              ('expected_route_count', report['expected_route_count'] == 47, report['expected_route_count']),
              ('operation_record_count', report['operation_record_count'] == 47, report['operation_record_count']),
              ('unique_operation_id_count', report['unique_operation_id_count'] == 47, report['unique_operation_id_count']),
              ('unique_route_signature_count', report['unique_route_signature_count'] == 47, report['unique_route_signature_count']),
              ('executable_source_bound_count', report['executable_source_bound_count'] == 47, report['executable_source_bound_count']),
              ('full_operation_records_verified', report['full_operation_records_verified'] is True, report['full_operation_records_verified']),
              ('transport_parity_pending_count', report['transport_parity_pending_count'] == 46, report['transport_parity_pending_count']),
              ('receipt_replay_pending_count', report['receipt_replay_pending_count'] == 47, report['receipt_replay_pending_count']),
              ('full_operation_records_blocker_cleared', 'PASS170_FULL_OPERATION_RECORDS_PENDING' not in report['target_blockers'], report['target_blockers']),
              ('target_blockers_exact', report['target_blockers'] == expected, report['target_blockers']),
              ('pass170_nonterminal', report['pass170_terminal_contract_verified'] is False, report['pass170_terminal_contract_verified']),
              ('canonical_state_mutated', report['canonical_state_mutated'] is False, report['canonical_state_mutated']),
              ('new_vm81_authority', report['new_vm81_authority'] is False, report['new_vm81_authority']),
              ('new_hash72_mint_authority', report['new_hash72_mint_authority'] is False, report['new_hash72_mint_authority']),
              ('hash216_persistence_authority', report['hash216_persistence_authority'] is False, report['hash216_persistence_authority']),
              ('floating_point_canonical_authority', report['floating_point_canonical_authority'] is False, report['floating_point_canonical_authority']),
              ('next_boundary', report['next_boundary'] == 'PASS170_LEGACY_LAUNCHER_RETIREMENT_AND_PUBLIC_PARITY_COMPLETION', report['next_boundary']),
          ]
          failed = []
          for name, ok, observed in checks:
              print(f"{'PASS' if ok else 'FAIL'} {name}: observed={observed!r}")
              if not ok:
                  failed.append({'check': name, 'observed': observed})
          if failed:
              raise SystemExit('I173 boundary enforcement failed: ' + json.dumps(failed, sort_keys=True))
          PY

      - name: Upload I173 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass219-i173-pass170-full-operation-records-${{ github.sha }}
          path: artifacts/pass219/i173
          if-no-files-found: warn
          retention-days: 90
