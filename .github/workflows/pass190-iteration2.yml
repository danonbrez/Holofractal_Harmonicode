name: Pass 190 Iteration 2 Persistent Event SDK GUI Authority

on:
  push:
    paths:
      - "HHS_PASS_190_ITERATION_2_PERSISTENT_EVENT_SDK_GUI_AUTHORITY.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - "hhs_gui/runtime_apps/pass190/**"
      - "hhs_gui/runtime_os/core/RuntimeApplicationRegistry.tsx"
      - ".github/workflows/pass190-iteration2.yml"
  pull_request:
    paths:
      - "HHS_PASS_190_ITERATION_2_PERSISTENT_EVENT_SDK_GUI_AUTHORITY.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - "hhs_gui/runtime_apps/pass190/**"
      - "hhs_gui/runtime_os/core/RuntimeApplicationRegistry.tsx"
      - ".github/workflows/pass190-iteration2.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pass 190 iteration 2
        working-directory: native_projects/hhs_pass190_operation_fabric
        run: make validate
