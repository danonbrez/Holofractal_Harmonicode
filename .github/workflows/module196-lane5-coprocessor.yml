name: Module 196 Native C and Lean Gate
on:
  pull_request:
    paths:
      - 'hhs_runtime/include/hhs_module196_lane5_coprocessor.h'
      - 'hhs_runtime/include/hhs_pass220_module196_rna_cell_wall_route_v1.h'
      - 'hhs_runtime/cpp/hhs_pass220_module196_rna_cell_wall_route_v1.cpp'
      - 'tests/pass220/test_hhs_module196_rna_route_mock.cpp'
      - 'tests/pass220/test_hhs_module196_linked_abi_v1.py'
      - 'tests/pass220/test_hhs_module196_real_linked_candidate_v1.cpp'
      - 'GNUmakefile'
      - 'tests/pass220/test_hhs_module196_lane5_coprocessor.cpp'
      - 'formal/lean/HHS/Module196.lean'
      - 'hhs_runtime/hhs_pass220_module196_lean_source_identity_v1.py'
      - 'tests/pass220/test_hhs_pass220_module196_lean_source_identity_v1.py'
      - 'docs/pass220/MODULE_196_FRACTAL_VALIDATION_LANE5_INTEGRATION.md'
      - '.github/workflows/module196-lane5-coprocessor.yml'
  push:
    paths:
      - 'hhs_runtime/include/hhs_module196_lane5_coprocessor.h'
      - 'tests/pass220/test_hhs_module196_lane5_coprocessor.cpp'
      - 'formal/lean/HHS/Module196.lean'
      - '.github/workflows/module196-lane5-coprocessor.yml'
permissions:
  contents: read
jobs:
  native-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact C++ negative-control test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ihhs_runtime/include tests/pass220/test_hhs_module196_lane5_coprocessor.cpp -o /tmp/hhs-module196-test
          /tmp/hhs-module196-test
      - name: Compile inherited RNA cell-wall bridge
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -fPIC -Ihhs_runtime/include -Ihhs_runtime/c -Inative_projects/hhs_pass188_bott_runtime/include -Inative_projects/hhs_pass189_hqlh_runtime/include -c hhs_runtime/cpp/hhs_pass220_module196_rna_cell_wall_route_v1.cpp -o /tmp/hhs-module196-rna-bridge.o
          nm /tmp/hhs-module196-rna-bridge.o | grep -F hhs_exact_pass220_module196_rna_route_v1
      - name: Exercise route fail-closed and inherited delegation with native mocks
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -Ihhs_runtime/c -Inative_projects/hhs_pass188_bott_runtime/include -Inative_projects/hhs_pass189_hqlh_runtime/include tests/pass220/test_hhs_module196_rna_route_mock.cpp hhs_runtime/cpp/hhs_pass220_module196_rna_cell_wall_route_v1.cpp -o /tmp/hhs-module196-route-test
          /tmp/hhs-module196-route-test
      - name: Compile C-only ingress ABI
        run: |
          printf '#include "hhs_module196_lane5_coprocessor.h"\nint main(void){HHSModule196Candidate c;return !hhs_m196_evaluate(1,2,&c);}\n' >/tmp/hhs-module196-abi.c
          cc -std=c11 -Wall -Wextra -Werror -Ihhs_runtime/include /tmp/hhs-module196-abi.c -o /tmp/hhs-module196-abi
          /tmp/hhs-module196-abi
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reuse inherited Lean kernel and axiom audit
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          build: true
          test: false
          leanchecker: true
          leanchecker-args: HHS
          axiom-audit: true
          axiom-audit-root: HHS
      - name: Typecheck Module196
        run: lake env lean formal/lean/HHS/Module196.lean
      - name: Check exact source-bound proof identity and tamper rejection
        run: python -m unittest discover -s tests/pass220 -p 'test_hhs_pass220_module196_lean_source_identity_v1.py' -v
  linked-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build inherited C/C++ runtime ABI with Module 196
        run: make c-abi
      - name: Confirm actual shared export and legacy selectors
        run: |
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep -F hhs_exact_pass220_module196_rna_route_v1
          python tests/pass220/test_hhs_module196_linked_abi_v1.py
      - name: Exercise real linked VM81 candidate and RNA cell-wall replay
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -Ihhs_runtime/c -Inative_projects/hhs_pass188_bott_runtime/include -Inative_projects/hhs_pass189_hqlh_runtime/include tests/pass220/test_hhs_module196_real_linked_candidate_v1.cpp -Lhhs_runtime/builds -Wl,-rpath,$PWD/hhs_runtime/builds -lhhs_runtime -o /tmp/hhs-module196-real-test
          /tmp/hhs-module196-real-test
