name: Pass 166 Word2Vec Preinstaller

on:
  pull_request:
    paths:
      - 'hhs_runtime/pass166/**'
      - 'hhs_backend/api/pass166_word2vec_routes.py'
      - 'hhs_backend/pass166_server.py'
      - 'native_projects/hhs_pass166_word2vec/**'
      - 'tests/test_hhs_pass166_word2vec_v1.py'
      - 'tests/test_hhs_pass166_supply_chain_v1.py'
      - 'tools/hhs_model.py'
      - 'tools/pass166_terminal_evidence.py'
      - 'HHS_PASS_166_AUTHORITY_BINDING.json'
      - 'HHS_PASS_166_IMPLEMENTATION_STATUS.md'
      - 'docs/HHS_PASS_166_WORD2VEC_RUNTIME.md'
      - 'evidence/pass166/**'
      - '.github/workflows/pass166-word2vec.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      HHS_PASS166_STORAGE_DIR: '${{ runner.temp }}/hhs-pass166-default'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi pydantic httpx
      - name: Python Pass 165 terminal plus Pass 166
        run: |
          python -m pytest -q \
            tests/test_hash72_digest_v1.py \
            tests/test_hhs_pass163_vmrc_v1.py \
            tests/test_hhs_pass164_gcmsl_v1.py \
            tests/test_hhs_pass165_multimodal_ingress_v1.py \
            tests/test_hhs_pass165_terminal_v1.py \
            tests/test_hhs_pass166_word2vec_v1.py \
            tests/test_hhs_pass166_supply_chain_v1.py
      - name: Strict C11 Pass 165
        run: make -C native_projects/hhs_pass165_mmvs clean test
      - name: Strict C11 Pass 166
        run: make -C native_projects/hhs_pass166_word2vec clean test
      - name: Execute terminal evidence harness
        run: python tools/pass166_terminal_evidence.py --output "$RUNNER_TEMP/pass166-terminal/P166_TERMINAL_EXECUTION.json"
      - name: Upload terminal evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass166-terminal-evidence
          path: ${{ runner.temp }}/pass166-terminal/P166_TERMINAL_EXECUTION.json
          if-no-files-found: error
          retention-days: 30
