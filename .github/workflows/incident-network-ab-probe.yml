name: Incident Dispatch Exact Main Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-network-ab-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch authoritative Exact-Main recovery promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: e6b56828e85e1a49c370407f93e1fe156bc5bd50
        run: |
          set -euo pipefail
          gh workflow run digitalocean-production-main.yml --repo danonbrez/Holofractal_Harmonicode --ref main
          echo "EXACT_MAIN_RECOVERY_DISPATCHED=1"

          deadline=$((SECONDS + 90))
          run_id=""
          while [[ -z "$run_id" ]]; do
            run_id=$(gh run list --repo danonbrez/Holofractal_Harmonicode \
              --workflow digitalocean-production-main.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq '.[] | select(.headSha == env.TARGET_SHA) | .databaseId' \
              | head -n 1)
            if (( SECONDS >= deadline )); then
              echo "Exact-Main dispatch did not register for $TARGET_SHA" >&2
              exit 2
            fi
            [[ -n "$run_id" ]] || sleep 2
          done
          echo "EXACT_MAIN_RECOVERY_RUN_ID=$run_id"
