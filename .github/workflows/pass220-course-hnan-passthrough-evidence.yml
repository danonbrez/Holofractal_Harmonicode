name: Pass 220 Course HNAN Passthrough Evidence Separation
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_course_hnan_passthrough_evidence_v1.py"
      - "tests/pass220/test_pass220_course_hnan_passthrough_evidence_v1.py"
      - ".github/workflows/pass220-course-hnan-passthrough-evidence.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  passthrough-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Assert independent HNAN proof and fail-closed course theorem
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_course_hnan_passthrough_evidence_v1.py
