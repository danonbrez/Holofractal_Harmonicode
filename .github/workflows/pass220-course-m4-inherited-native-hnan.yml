name: Pass 220 Course M4 Inherited Native HNAN
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_course_m4_inherited_hnan_phase_binding_v1.py"
      - "hhs_runtime/hhs_pass220_recursive_hnan_native_rule_preflight_v1.py"
      - "hhs_runtime/hhs_pass220_course_module_gate_provenance_v1.py"
      - "hhs_runtime/hhs_pass220_whitepaper_proof_dependency_binding_v1.py"
      - "hhs_runtime/hhs_pass220_whitepaper_corpus_ingress_v1.py"
      - "hhs_runtime/include/hhs_pass219_lane5_hnan_global_constraint_1_63.h"
      - "hhs_runtime/c/hhs_pass219_lane5_hnan_global_constraint_1_63.inc"
      - "hhs_runtime/c/hhs_runtime_exact_abi.c"
      - "hhs_runtime/cpp/hhs_pass219_vm81_pqc_cell_wall_1_30.cpp"
      - "hhs_runtime/src/hhs_hash216.c"
      - "whitepapers/Harmonicode Algebra - Course"
      - "contracts/pass220/PASS_220_WHITEPAPER_CORPUS_SOURCE_FREEZE_V1.json"
      - "tests/pass220/test_pass220_course_m4_inherited_hnan_phase_binding_v1.py"
      - ".github/workflows/pass220-course-m4-inherited-native-hnan.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Execute established native HNAN 1.63 and bind Course Module 4
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_course_m4_inherited_hnan_phase_binding_v1.py
