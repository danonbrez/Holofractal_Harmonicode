name: Pass219 Exact Main Production Reachability Diagnostic

on:
  push:
    branches:
      - agent/pass219-exact-main-73652c12-ssh-pinning-recovery-20260908
    paths:
      - '.github/workflows/pass219-exact-main-ssh-reachability-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-reachability:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HHS_PRODUCTION_HOST: ${{ vars.HHS_DIGITALOCEAN_HOST || '137.184.223.84' }}
    steps:
      - name: Probe production TCP surfaces without host-key discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import socket

          host = os.environ['HHS_PRODUCTION_HOST']
          results = {}
          for port in (22, 80, 443, 8080):
              try:
                  with socket.create_connection((host, port), timeout=10) as sock:
                      results[port] = ('reachable', None)
                      if port == 22:
                          sock.settimeout(5)
                          try:
                              banner = sock.recv(512)
                          except Exception as exc:
                              results[port] = ('reachable-no-banner', f'{type(exc).__name__}:{exc}')
                          else:
                              if banner.startswith(b'SSH-'):
                                  print(f'HHS_PRODUCTION_SSH_BANNER_VALID=1 banner={banner.decode("ascii", errors="replace").strip()}')
                              else:
                                  results[port] = ('reachable-invalid-banner', repr(banner[:80]))
              except Exception as exc:
                  results[port] = ('unreachable', f'{type(exc).__name__}:{exc}')

          for port in (22, 80, 443, 8080):
              state, detail = results[port]
              print(f'HHS_PRODUCTION_TCP_{port}={state}' + (f' detail={detail}' if detail else ''))
          print('HHS_PRODUCTION_HOST_KEY_DISCOVERY_ATTEMPTED=0')

          if all(results[p][0] == 'unreachable' for p in results):
              raise SystemExit('all probed production TCP surfaces are unreachable')
          if results[22][0] == 'unreachable':
              print('HHS_PRODUCTION_SSH_RECOVERY_REQUIRED=1')
          PY

      - name: Probe public HTTPS health if reachable
        shell: bash
        run: |
          set -u
          if curl -kfsS --connect-timeout 10 --max-time 20 "https://${HHS_PRODUCTION_HOST}/api/system/status" >/tmp/hhs-public-system-status.json; then
            echo 'HHS_PRODUCTION_PUBLIC_HTTPS_HEALTH=1'
            test -s /tmp/hhs-public-system-status.json
          else
            rc=$?
            echo "HHS_PRODUCTION_PUBLIC_HTTPS_HEALTH=0 curl_exit=${rc}"
            exit "$rc"
          fi
