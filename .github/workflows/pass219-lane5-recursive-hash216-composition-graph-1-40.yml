name: Pass 219 Lane 5 Recursive Hash216 Composition Graph 1.40

on:
  push:
    branches:
      - agent/pass219-lane5-recursive-hash216-composition-graph-1-40-20260914
    paths:
      - 'contracts/pass219/PASS_219_LANE5_RECURSIVE_HASH216_COMPOSITION_GRAPH_1_40.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_python/runtime/hhs_pass219_lane5_recursive_composition_graph_bridge.py'
      - 'hhs_backend/runtime/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.py'
      - 'tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.c'
      - 'tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.py'
      - '.github/workflows/pass219-lane5-recursive-hash216-composition-graph-1-40.yml'
      - 'docs/operations/restart/PASS_219_LANE5_RECURSIVE_HASH216_COMPOSITION_GRAPH_1_40_RESTART_20260914.md'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/pass219/PASS_219_LANE5_RECURSIVE_HASH216_COMPOSITION_GRAPH_1_40.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_python/runtime/hhs_pass219_lane5_recursive_composition_graph_bridge.py'
      - 'hhs_backend/runtime/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.py'
      - 'tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.c'
      - 'tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.py'
      - '.github/workflows/pass219-lane5-recursive-hash216-composition-graph-1-40.yml'
      - 'docs/operations/restart/PASS_219_LANE5_RECURSIVE_HASH216_COMPOSITION_GRAPH_1_40_RESTART_20260914.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-pytest python3-cryptography

      - name: Static recursive composition graph contract gate
        run: |
          python - <<'PY'
          from pathlib import Path
          contract = Path('contracts/pass219/PASS_219_LANE5_RECURSIVE_HASH216_COMPOSITION_GRAPH_1_40.md').read_text()
          header = Path('hhs_runtime/include/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.h').read_text()
          runtime = Path('hhs_backend/runtime/hhs_pass219_lane5_recursive_hash216_composition_graph_1_40.py').read_text()
          for needle in (
              '20,020 full phase cycle',
              'E_i.child_hash216 == E_j.parent_hash216',
              'intermediate_vm81_transitions_executed = 0',
              '1.37/Pass207 GPU-vector ranking                   = REQUIRED',
              'canonical VM81 mutation authority                 = FALSE',
              'signed environmental VM81 admission               = REQUIRED',
          ):
              assert needle in contract, needle
          for needle in (
              'persistent_composition_graph',
              'recursive_multi_hop_search',
              'hash216_path_seal_required',
              'exact_hash216_adjacency_required',
              'persistent_edge_authentication_required',
              'inherited_gpu_vector_rank_required',
              'canonical_vm81_mutation_authority',
              'requires_signed_environmental_vm81_admission',
          ):
              assert needle in header, needle
          for needle in (
              'Pass219Lane5PersistentHash216CompositionMemory',
              'search_hash216',
              'reuse_path',
              'path_hash216',
              'intermediate_vm81_transitions_executed',
              'exact Hash216 adjacency',
          ):
              assert needle in runtime, needle
          print('lane5_recursive_hash216_composition_graph_static=PASS')
          PY

      - name: Build cumulative exact ABI
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Audit 1.40 exported symbols
        run: |
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_recursive_composition_graph_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_recursive_composition_graph_authority$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_recursive_composition_graph_validate$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_persistent_composition_memory_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_composition_jump_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_phase_interlace_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_vm81_environment_admit_signed$' /tmp/hhs.symbols

      - name: Run native recursive composition graph membrane test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-lane5-recursive-composition-graph
          /tmp/test-lane5-recursive-composition-graph

      - name: Run real recursive persistent graph integration
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python -m pytest -q \
            tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.py \
            tests/pass219/test_pass219_lane5_persistent_hash216_composition_memory_1_39.py \
            tests/pass219/test_pass219_lane5_hash216_composition_jump_store_1_38.py \
            tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py \
            tests/test_hhs_pass207_gpu_driver_v1.py

      - name: Regress inherited Pass194 encrypted storage
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python -m pytest -q tests/test_hhs_pass194_multimodal_storage_training_v1.py

      - name: Regress inherited Lane 5 authority
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-lane5-nucleus
          /tmp/test-lane5-nucleus
