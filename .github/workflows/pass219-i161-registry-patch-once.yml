name: Pass 219 I161 Exact Registry Patch Once

on:
  push:
    branches:
      - agent/pass219-i161-complete-monolithic-boundary-executor
    paths:
      - .github/workflows/pass219-i161-registry-patch-once.yml

permissions:
  contents: write

jobs:
  patch-registry:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass219-i161-complete-monolithic-boundary-executor
          fetch-depth: 0
      - name: Insert exact I161 governed service registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('hhs_runtime/hhs_service_registry_v1.py')
          text = path.read_text(encoding='utf-8')
          service_name_token = 'name="runtime.pass219.complete_monolithic_boundary_executor"'
          predecessor = 'name="runtime.pass219.source_bound_ab_x2_phase_binding"'
          marker = '    return registry\n\n\ndef _compact_registry_status_from_registry'

          if service_name_token in text:
              print('I161 registry entry already present; no mutation needed.')
          else:
              if text.count(predecessor) != 1:
                  raise SystemExit('I160 predecessor registration is not unique')
              if text.count(marker) != 1:
                  raise SystemExit('central registry return marker is not unique')

              block = '''    registry.register_function(\n        name="runtime.pass219.complete_monolithic_boundary_executor",\n        module="hhs_runtime.pass219.complete_monolithic_boundary_executor",\n        function="i161_complete_monolithic_boundary_self_test",\n        service_type="pass219_exact_complete_monolithic_boundary_executor",\n        description="Executes the I161 complete monolithic boundary as typed CLOSURE_EQ over exact scalar-zero phase and renewed-unit closure witnesses. Host 0/0, host scalar 0^4, ordinary scalar A=B, float authority, VM81 mutation, Hash72 mint, and Hash216 persistence remain forbidden; downstream Pass169 VM81 exact symbolic execution remains a separate gate.",\n        invariant_ids=["HHS-I001","HHS-I002","HHS-I003","HHS-I005","HHS-I006","HHS-I008","HHS-I009","HHS-I010","HHS-I011","HHS-I012","HHS-I013","HHS-I014","HHS-I015"],\n        contract_schemas=["HHS_PASS219_I161_COMPLETE_MONOLITHIC_BOUNDARY_EXECUTOR_CONTRACT_V1","HHS_PASS219_I160_SOURCE_BOUND_AB_X2_PHASE_BINDING_CONTRACT_V1","HHS_PASS219_I157_CANDIDATE_BOUND_TYPED_VALUE_GRAPH_V1"],\n        witness_schemas=["HHS_PASS219_I161_TYPED_ZERO_RENEWED_UNIT_PROFILE_V1","HHS_PASS219_I161_SCALAR_ZERO_PHASE_WITNESS_V1","HHS_PASS219_I161_RENEWED_UNIT_CLOSURE_WITNESS_V1","HHS_PASS219_I161_TYPED_MONOLITHIC_BOUNDARY_WITNESS_V1"],\n        validators=["verify_i161_typed_zero_renewed_unit_profile","prove_scalar_zero_phase_relation","prove_renewed_unit_closure_relation","prove_complete_monolithic_boundary","execute_i161_complete_monolithic_boundary","i161_complete_monolithic_boundary_self_test"],\n        guards=["inherited_pass62_typed_equality_frames","inherited_pass129_a2_and_delta_idempotent_closure","scalar_zero_xyzw_I_I3_projection","typed_xy_over_zw_closure_quotient_no_0_over_0","typed_zero_fourth_phase_closure_no_host_pow","scalar_zero_one_noncollapse","source_boundary_structure_preserved","right_scalar_zero_diagnostic_only","closure_eq_not_scalar_equality","all_nine_non_boundary_joins_proved","no_float_canonical_authority","no_vm81_mutation_authority","no_hash72_mint_authority","no_hash216_persistence_authority","zero_bypass_runtime_interposer"],\n        rejection_codes=["FLOAT_CANONICAL_AUTHORITY_FORBIDDEN","HOST_ZERO_DIVISION_FORBIDDEN","HOST_ZERO_FOURTH_POWER_FORBIDDEN","ORDINARY_SCALAR_BOUNDARY_EQUALITY_FORBIDDEN","I160_EXPECTED_9_1_0_BOUNDARY","EDGE8_FAIL_CLOSED_BOUNDARY_REQUIRED","RIGHT_CLOSURE_NUMERATOR_ZERO_REQUIRED","ALL_NON_BOUNDARY_JOINS_MUST_BE_PROVED","AUTHORITY_ESCALATION"],\n        mutation_policy="READ_ONLY_TYPED_CLOSURE_EQ_PROOF_NO_VM81_OR_CANONICAL_STATE_MUTATION",\n        persistence_policy="NO_CANONICAL_PERSISTENCE_DIAGNOSTIC_SHA256_WITNESSES_ONLY",\n        boundedness_policy="TEN_FROZEN_JOINS_ALL_RESOLVED_NEXT_GATE_PASS169_VM81_EXACT_SYMBOLIC_CONSTRAINT_EXECUTION",\n    )\n\n'''
              text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Inserted I161 central governed service registration.')

          final = path.read_text(encoding='utf-8')
          if final.count(service_name_token) != 1:
              raise SystemExit('I161 service name registration count must be exactly one')
          if final.count('typed_zero_fourth_phase_closure_no_host_pow') != 1:
              raise SystemExit('I161 typed zero-fourth guard missing or duplicated')
          if final.count('closure_eq_not_scalar_equality') != 1:
              raise SystemExit('I161 CLOSURE_EQ guard missing or duplicated')
          PY
      - name: Validate registry syntax, registration, and I161 callable
        shell: bash
        run: |
          python -m py_compile hhs_runtime/hhs_service_registry_v1.py hhs_runtime/pass219/complete_monolithic_boundary_executor.py
          python - <<'PY'
          from hhs_runtime.hhs_service_registry_v1 import make_default_service_registry
          from hhs_runtime.pass219.complete_monolithic_boundary_executor import i161_complete_monolithic_boundary_self_test

          registry = make_default_service_registry()
          assert registry.has_service("runtime.pass219.complete_monolithic_boundary_executor")
          descriptor = next(
              service
              for service in registry.services()
              if service["name"] == "runtime.pass219.complete_monolithic_boundary_executor"
          )
          assert descriptor["function"] == "i161_complete_monolithic_boundary_self_test"
          assert "closure_eq_not_scalar_equality" in descriptor["guards"]
          result = i161_complete_monolithic_boundary_self_test()
          assert result['ok'] is True
          assert result['counts']['proved'] == 10
          assert result['counts']['unresolved'] == 0
          assert result['boundary_witness']['equality_frame'] == 'CLOSURE_EQ'
          print(result['schema'], result['ok'], result['i161_execution_sha256'])
          PY
      - name: Commit exact registry integration
        shell: bash
        run: |
          if git diff --quiet -- hhs_runtime/hhs_service_registry_v1.py; then
            echo "No registry diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hhs_runtime/hhs_service_registry_v1.py
          git commit -m "Pass 219 I161: register complete boundary executor"
          git push origin HEAD:agent/pass219-i161-complete-monolithic-boundary-executor
