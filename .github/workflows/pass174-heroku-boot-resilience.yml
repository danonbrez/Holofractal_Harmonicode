name: Pass 174 Heroku Boot Resilience

on:
  pull_request:
    paths:
      - "hhs_backend/pass174_server.py"
      - "hhs_backend/api/pass174_runtime_routes.py"
      - "hhs_runtime/pass174/**"
      - "tests/test_hhs_pass174_heroku_boot_resilience_v1.py"
      - ".github/workflows/pass174-heroku-boot-resilience.yml"
  push:
    branches: [main]
    paths:
      - "hhs_backend/pass174_server.py"
      - "hhs_backend/api/pass174_runtime_routes.py"
      - "hhs_runtime/pass174/**"
      - "tests/test_hhs_pass174_heroku_boot_resilience_v1.py"
      - ".github/workflows/pass174-heroku-boot-resilience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  degraded-boot-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "1"
      HHS_PASS174_BOOT_TIMEOUT_SECONDS: "2"
      HHS_PASS174_STATE_DIR: ${{ runner.temp }}/hhs/pass174
    steps:
      - name: Check out source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependency-scoped runtime requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Pass 174 production entrypoint
        run: python -m py_compile hhs_backend/pass174_server.py tests/test_hhs_pass174_heroku_boot_resilience_v1.py

      - name: Prove degraded boot keeps the web service alive
        run: python -m pytest -q tests/test_hhs_pass174_heroku_boot_resilience_v1.py

      - name: Prove production entrypoint imports
        run: |
          python - <<'PY'
          from hhs_backend.pass174_server import app, PASS174_BOOT_STATE
          paths = [str(getattr(route, "path", "")) for route in app.router.routes]
          assert "/api/v1/pass174/status" in paths
          assert "/api/v1/pass174/deployment/status" in paths
          print(PASS174_BOOT_STATE)
          PY
