name: Pass 219 Discrete S7 Embedding

on:
  push:
    paths:
      - 'hhs_runtime/pass219/discrete_s7_embedding.py'
      - 'tests/pass219/test_pass219_discrete_s7_embedding.py'
      - 'contracts/pass219/PASS_219_RML6_DISCRETE_S7_EMBEDDING_1_0.json'
      - '.github/workflows/pass219-discrete-s7-embedding.yml'
  pull_request:
    paths:
      - 'hhs_runtime/pass219/discrete_s7_embedding.py'
      - 'tests/pass219/test_pass219_discrete_s7_embedding.py'
      - 'contracts/pass219/PASS_219_RML6_DISCRETE_S7_EMBEDDING_1_0.json'
      - '.github/workflows/pass219-discrete-s7-embedding.yml'

permissions:
  contents: read

jobs:
  targeted-rml6-discrete-s7:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run RML4 through RML6 topology dependency scope
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_dynamic_octonion_gyroscope.py \
            tests/pass219/test_pass219_gyroscope_admission_membrane.py \
            tests/pass219/test_pass219_discrete_s7_embedding.py
