name: Pass 219 Orthogonal Glyph Membrane 1.21

on:
  pull_request:
    branches:
      - main
    paths:
      - 'hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp'
      - 'hhs_runtime/include/hhs_pass219_monolithic_constraint_abi_1_20.h'
      - 'hhs_runtime/include/hhs_pass219_octonion_runtime_1_19.h'
      - 'hhs_runtime/c/hhs_pass219_monolithic_constraint_abi_1_20.inc'
      - 'hhs_runtime/c/hhs_pass219_octonion_runtime_1_19.inc'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/src/hhs_hash216.c'
      - 'hhs_runtime/include/hhs_hash216_bytes.h'
      - 'native_projects/hhs_pass188_bott_runtime/**'
      - 'native_projects/hhs_pass189_hqlh_runtime/**'
      - 'contracts/pass219/PASS_219_MONOLITHIC_UQCEL_NATIVE_VERBATIM_1_20.harmonicode'
      - 'tests/pass219/test_pass219_orthogonal_glyph_membrane_1_21.cpp'
      - 'tests/pass219/test_pass219_monolithic_constraint_abi_1_20.c'
      - 'tests/pass219/test_pass219_octonion_runtime_1_19.c'
      - 'HHS_PASS_219_APPEND_ONLY_ORTHOGONAL_GLYPH_PARALLEL_MEMBRANE_AMENDMENT_1_21_0.md'
      - 'HHS_PASS_219_APPEND_ONLY_ORTHOGONAL_GLYPH_VM81_CIRCUIT_REPAIR_1_21_1.md'
      - 'docs/operations/restart/PASS_219_ORTHOGONAL_GLYPH_PARALLEL_MEMBRANE_1_21_RESTART.md'
      - 'docs/operations/restart/PASS_219_ORTHOGONAL_GLYPH_VM81_CIRCUIT_REPAIR_1_21_1_RESTART.md'
      - '.github/workflows/pass219-orthogonal-glyph-membrane-1-21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orthogonal-glyph-membrane:
    name: orthogonal-glyph-membrane (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [exact, synthetic]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && (matrix.target == 'exact' && github.event.pull_request.head.sha || format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.sha }}
          fetch-depth: 0

      - name: Prove canonical main authority lineage
        run: |
          git merge-base --is-ancestor f5d8fdc014d888f93c0d85d40d2a2c0c198eefdf HEAD
          git merge-base --is-ancestor e87bc42b17c03ff98f691838b8d573a5bdf46ff2 HEAD
          git merge-base --is-ancestor eb88a4b88ab8c598458c0e48c0f4f9db77f81654 HEAD
          git merge-base --is-ancestor fd42056c22071d290945b02efe3a5752aaa3d737 HEAD
          git merge-base --is-ancestor c77e3feef42448a111d8b8912a1d1cb157d51925 HEAD
          git merge-base --is-ancestor a1a55a4f621ff3678f5af81119439e9558cf9db4 HEAD

      - name: Enforce source-defined exact membrane authority
        run: |
          ! grep -REn '\b(float|double|long[[:space:]]+double)\b' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          ! grep -F 'canonical_a2' hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          ! grep -F 'lane_count * lane_width' hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'lane_count == 24U' hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'vm_thread_count * vm_cells_per_thread == vm_fabric_positions' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'source_structure_thread_count == 49U' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'hhs_exact_pass219_octonion_from_vm81' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'hhs_exact_vm5184_address_encode' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'hhs188_transition_projected' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'hhs189_encode_context' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'append_proof_identity' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'append_verification_identity' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'append_projection(material, a2_)' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'native_shared_invariant_proven = false' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'canonical_proof = false' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp
          grep -F 'requires_vm81_authority = true' \
            hhs_runtime/include/hhs_pass219_orthogonal_glyph_membrane_1_21.hpp

      - name: Compile cumulative exact and inherited hydration substrates
        run: |
          mkdir -p /tmp/pass219-orthogonal-1-21
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/pass219-orthogonal-1-21/exact.o
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/src/hhs_hash216.c \
            -o /tmp/pass219-orthogonal-1-21/hash216.o
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Inative_projects/hhs_pass188_bott_runtime/include \
            -c native_projects/hhs_pass188_bott_runtime/src/hhs_pass188_bott_runtime.c \
            -o /tmp/pass219-orthogonal-1-21/pass188.o
          gcc -c native_projects/hhs_pass188_bott_runtime/src/hhs_pass188_bott_step_x86_64.S \
            -o /tmp/pass219-orthogonal-1-21/pass188-x86.o
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Inative_projects/hhs_pass189_hqlh_runtime/include \
            -c native_projects/hhs_pass189_hqlh_runtime/src/hhs_pass189_hqlh.c \
            -o /tmp/pass219-orthogonal-1-21/pass189.o

      - name: Compile and run full VM81 octonion hydration membrane
        run: |
          g++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -Ihhs_runtime/include \
            -Inative_projects/hhs_pass188_bott_runtime/include \
            -Inative_projects/hhs_pass189_hqlh_runtime/include \
            tests/pass219/test_pass219_orthogonal_glyph_membrane_1_21.cpp \
            /tmp/pass219-orthogonal-1-21/exact.o \
            /tmp/pass219-orthogonal-1-21/hash216.o \
            /tmp/pass219-orthogonal-1-21/pass188.o \
            /tmp/pass219-orthogonal-1-21/pass188-x86.o \
            /tmp/pass219-orthogonal-1-21/pass189.o \
            -o /tmp/pass219-orthogonal-1-21/test-membrane
          /tmp/pass219-orthogonal-1-21/test-membrane

      - name: Prove every glyph lane retains the full verbatim program
        run: |
          /tmp/pass219-orthogonal-1-21/test-membrane --dump-source \
            > /tmp/pass219-orthogonal-1-21/lane-source.harmonicode
          cmp /tmp/pass219-orthogonal-1-21/lane-source.harmonicode \
              contracts/pass219/PASS_219_MONOLITHIC_UQCEL_NATIVE_VERBATIM_1_20.harmonicode
          printf '%s  %s\n' \
            'ac143798146d89a3fe932f39ccb4d612e4fb3e45c471abc1a8bbbebb0f9c0a6a' \
            '/tmp/pass219-orthogonal-1-21/lane-source.harmonicode' | sha256sum -c -

      - name: Preserve monolithic and ordered-octonion substrates
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_monolithic_constraint_abi_1_20.c \
            /tmp/pass219-orthogonal-1-21/exact.o \
            -o /tmp/pass219-orthogonal-1-21/test-monolithic
          /tmp/pass219-orthogonal-1-21/test-monolithic
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_octonion_runtime_1_19.c \
            /tmp/pass219-orthogonal-1-21/exact.o \
            -o /tmp/pass219-orthogonal-1-21/test-octonion
          /tmp/pass219-orthogonal-1-21/test-octonion
