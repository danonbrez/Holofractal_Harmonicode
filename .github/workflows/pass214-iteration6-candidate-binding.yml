name: Pass 214 Iteration 6 Candidate Binding

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pass214-operating-compression-gradient
    paths:
      - 'hhs_backend/runtime/hhs_pass214_iteration6_candidate_binding_v1.py'
      - 'hhs_backend/runtime/pass214_i6_payload/**'
      - 'tools/pass214_iteration6_candidate_binding.py'
      - 'tools/pass214_iteration6_manifest.py'
      - 'tests/test_hhs_pass214_iteration6_candidate_binding_v1.py'
      - 'docs/pass214/ITERATION_6_REPOSITORY_CANDIDATE_BINDING.md'
      - 'evidence/pass214/PASS_214_ITERATION_6_IMPLEMENTATION_RECORD.json'
      - 'scripts/run_pass214_contract_validation.sh'
      - '.github/workflows/pass214-iteration6-candidate-binding.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  candidate-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Iteration 6 surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass214_iteration6_candidate_binding_v1.py \
            tools/pass214_iteration6_candidate_binding.py \
            tools/pass214_iteration6_manifest.py \
            tests/test_hhs_pass214_iteration6_candidate_binding_v1.py
      - name: Run Iteration 6 tests
        run: python -m pytest -q tests/test_hhs_pass214_iteration6_candidate_binding_v1.py
      - name: Build candidate-binding report
        run: |
          mkdir -p artifacts/pass214/iteration6
          python tools/pass214_iteration6_candidate_binding.py \
            --output artifacts/pass214/iteration6/PASS_214_ITERATION_6_CANDIDATE_BINDING_REPORT.json
      - name: Enforce admission-blocked non-promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/pass214/iteration6/PASS_214_ITERATION_6_CANDIDATE_BINDING_REPORT.json').read_text())
          assert report['status'] == 'CANDIDATE_SET_BOUND_ADMISSION_BLOCKED'
          assert report['family_count'] == 5
          assert report['live_admission'] is None
          assert report['policy']['candidate_imported_for_replacement'] is False
          assert report['policy']['candidate_executed_for_migration'] is False
          assert report['policy']['authority_promoted'] is False
          assert report['policy']['terminal_roots_minted'] is False
          assert report['policy']['pass215_authorized'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pass214-iteration6-candidate-binding-${{ github.run_id }}
          path: artifacts/pass214/iteration6
          if-no-files-found: error
