name: Lane 5 Native Capability Provider

on:
  push:
    branches:
      - 'repair/native-fastapi-default-provider'
    paths:
      - 'hhs_backend/runtime/hhs_fastapi_provider_v1.py'
      - 'hhs_runtime/hhs_lane5_native_capability_provider_v1.py'
      - 'contracts/pass220/PASS_220_LANE5_NATIVE_CAPABILITY_PROVIDER_V1.json'
      - 'hhs_backend/runtime/hhs_native_fastapi_compat_v1.py'
      - 'hhs_backend/runtime/runtime_ws.py'
      - 'hhs_backend/server.py'
      - 'tests/pass220/test_hhs_native_fastapi_default_provider_v1.py'
      - 'tests/pass220/test_hhs_lane5_native_capability_provider_v1.py'
      - '.github/workflows/native-fastapi-default-provider.yml'
      - 'docs/operations/restart/NATIVE_FASTAPI_DEFAULT_PROVIDER_20260929.md'
      - 'docs/operations/restart/LANE5_NATIVE_CAPABILITY_PROVIDER_20260929.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  lane5-native-capability-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded validation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check pytest numpy cryptography

      - name: Prove external FastAPI is absent
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("fastapi") is None
          assert importlib.util.find_spec("starlette") is None
          print("EXTERNAL_FASTAPI_ABSENT=YES")
          PY

      - name: Compile changed Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile \
            hhs_backend/runtime/hhs_fastapi_provider_v1.py \
            hhs_runtime/hhs_lane5_native_capability_provider_v1.py \
            hhs_backend/runtime/hhs_native_fastapi_compat_v1.py \
            hhs_backend/runtime/runtime_ws.py \
            tests/pass220/test_hhs_native_fastapi_default_provider_v1.py \
            tests/pass220/test_hhs_lane5_native_capability_provider_v1.py

      - name: Build cumulative exact ABI
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Build and test native FastAPI C11 route kernel
        shell: bash
        run: |
          set -euo pipefail
          make -C native_projects/hhs_pass220_fastapi_native_route_kernel clean all test

      - name: Native-provider and service-registry regression
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/pass220/test_hhs_native_fastapi_default_provider_v1.py \
            tests/pass220/test_hhs_lane5_native_capability_provider_v1.py \
            tests/test_hhs_service_registry_v1.py \
            tests/test_hhs_live_fastapi_runtime_pass045_v1.py \
            tests/test_hhs_websocket_kernel_channel_binding_pass045_v1.py
