name: Pass 220 72-shell source-bound native C
on:
  pull_request:
    paths:
      - "hhs_runtime/include/hhs_pass220_72_shell_source_bound_v1.h"
      - "hhs_runtime/c/hhs_pass220_72_shell_source_bound_v1.c"
      - "tests/pass220/test_pass220_72_shell_source_bound_v1.c"
      - ".github/workflows/pass220-72-shell-native-source-bound.yml"
      - "hhs_runtime/include/hhs_pass220_72_shell_exact_residue_v1.h"
      - "hhs_runtime/c/hhs_pass220_72_shell_exact_residue_v1.c"
      - "tests/pass220/test_pass220_72_shell_exact_residue_v1.c"
  push:
    paths:
      - "hhs_runtime/include/hhs_pass220_72_shell_source_bound_v1.h"
      - "hhs_runtime/c/hhs_pass220_72_shell_source_bound_v1.c"
      - "tests/pass220/test_pass220_72_shell_source_bound_v1.c"
      - ".github/workflows/pass220-72-shell-native-source-bound.yml"
      - "hhs_runtime/include/hhs_pass220_72_shell_exact_residue_v1.h"
      - "hhs_runtime/c/hhs_pass220_72_shell_exact_residue_v1.c"
      - "tests/pass220/test_pass220_72_shell_exact_residue_v1.c"
jobs:
  source-bound:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile native C validator
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            hhs_runtime/c/hhs_pass220_72_shell_source_bound_v1.c \
            tests/pass220/test_pass220_72_shell_source_bound_v1.c \
            -lcrypto -o /tmp/hhs_pass220_72_shell_source_bound_v1
      - name: Execute source-bound negative suite
        run: /tmp/hhs_pass220_72_shell_source_bound_v1

  exact-residue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact rational residue test
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            hhs_runtime/c/hhs_pass220_72_shell_exact_residue_v1.c \
            tests/pass220/test_pass220_72_shell_exact_residue_v1.c \
            -lcrypto -o /tmp/hhs_pass220_exact_residue
      - name: Verify exact rational result and bounds
        run: /tmp/hhs_pass220_exact_residue
