name: Production Mutable State Roots Repair Validation

on:
  push:
    branches:
      - fix/production-mutable-state-roots-20260925
    paths:
      - '.github/workflows/production-mutable-state-roots-repair.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production mutable-state roots
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m pytest -q             tests/test_production_mutable_state_roots.py             tests/test_runtime_lock_certifier_production_state.py
          python -m py_compile             hhs_backend/runtime/hhs_storybook_reel_v1.py             hhs_backend/runtime/hhs_pass203_hydrated_mainframe_v1.py             hhs_backend/runtime/hhs_pass204_open_cloud_mainframe_v1.py             hhs_backend/runtime/hhs_vulkan_loader_runtime_v1.py
          grep -F 'Environment=HHS_STORYBOOK_REEL_ARTIFACT_ROOT=/var/lib/hhs/storybook-reels' deploy/digitalocean/hhs-pass196-integrated-environment.service
          grep -F 'Environment=HHS_PASS203_STATE_ROOT=/var/lib/hhs/pass203' deploy/digitalocean/hhs-pass196-integrated-environment.service
          grep -F 'Environment=HHS_VULKAN_RUNTIME_ROOT=/var/lib/hhs/vulkan-runtime' deploy/digitalocean/hhs-pass196-integrated-environment.service
          ! grep -F 'ReadWritePaths=/opt/hhs/app' deploy/digitalocean/hhs-pass196-integrated-environment.service
