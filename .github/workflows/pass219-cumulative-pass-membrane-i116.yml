name: Pass 219 Cumulative Pass Membrane I116

on:
  pull_request:
    branches:
      - agent/pass219-iteration116-reconciled-main
    paths:
      - 'docs/operations/restart/PASS_219_I116_VALIDATION_PROBE.md'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass218_1_16.h'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass218_1_16.hpp'
      - 'hhs_runtime/c/hhs_pass219_inherited_pass218_1_16.inc'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass217_1_16.h'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass217_1_16.hpp'
      - 'hhs_runtime/c/hhs_pass219_inherited_pass217_1_16.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/hhs_pass219_cumulative_pass_membrane_i116.py'
      - 'tests/pass219/test_pass219_inherited_pass218_1_16.c'
      - 'tests/pass219/test_pass219_inherited_pass218_1_16.cpp'
      - 'tests/pass219/test_pass219_inherited_pass217_1_16.c'
      - 'tests/pass219/test_pass219_inherited_pass217_1_16.cpp'
      - 'tests/pass219/test_pass219_cumulative_pass_membrane_i116.py'
      - 'docs/operations/restart/PASS_219_CUMULATIVE_PASS_MEMBRANE_WIRING_1_16_RESTART.md'
      - '.github/workflows/pass219-cumulative-pass-membrane-i116.yml'

permissions:
  contents: read

jobs:
  cumulative-inherited-membrane:
    name: cumulative-inherited-membrane (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target:
          - exact
          - synthetic
    steps:
      - name: Check out explicit reconciliation validation target
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'exact' && github.event.pull_request.base.sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          fetch-depth: 0

      - name: Record validation target
        run: |
          printf 'PASS219_I116_VALIDATION_TARGET=%s\n' '${{ matrix.target }}'
          git rev-parse HEAD

      - name: Prove non-rewriting reconciliation ancestry
        run: |
          git merge-base --is-ancestor d4b893521782d7f7590c74034c4634bfdba83874 HEAD
          git merge-base --is-ancestor c34956f2982020d7b16513e31cae3f40d91e9326 HEAD
          git merge-base --is-ancestor b0656a92ab29507f81eae760e070f74e49db83f4 HEAD
          git merge-base --is-ancestor be71da59c9b8b7c7e055c03da703ca301849cfff HEAD
          test -f hhs_runtime/pass218/manifest_bound_curriculum_completion_seal_i48.py
          test -f hhs_backend/runtime_os_pass218_manifest_curriculum_completion_i48.py
          test -f hhs_runtime/hhs_pass217_cumulative_closure_v1.py
          test -f evidence/pass217/PASS_217_ITERATION_4_HASH72_MANIFOLD_NUCLEUS.json

      - name: Reject approximate authority in I116 membrane
        run: |
          python - <<'PY'
          import pathlib, re
          paths = [
              pathlib.Path('hhs_runtime/include/hhs_pass219_inherited_pass218_1_16.h'),
              pathlib.Path('hhs_runtime/include/hhs_pass219_inherited_pass218_1_16.hpp'),
              pathlib.Path('hhs_runtime/c/hhs_pass219_inherited_pass218_1_16.inc'),
              pathlib.Path('hhs_runtime/include/hhs_pass219_inherited_pass217_1_16.h'),
              pathlib.Path('hhs_runtime/include/hhs_pass219_inherited_pass217_1_16.hpp'),
              pathlib.Path('hhs_runtime/c/hhs_pass219_inherited_pass217_1_16.inc'),
              pathlib.Path('hhs_runtime/hhs_pass219_cumulative_pass_membrane_i116.py'),
          ]
          pattern = re.compile(r'\b(float|double)\b')
          for path in paths:
              match = pattern.search(path.read_text('utf-8'))
              if match:
                  raise SystemExit(f'forbidden authority token {match.group(1)!r} in {path}')
          PY

      - name: Compile reconciled exact C ABI with strict warnings
        run: |
          mkdir -p /tmp/pass219-i116
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/pass219-i116/hhs_runtime_exact_abi.o

      - name: Run Pass 218 C completion-binding conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_inherited_pass218_1_16.c \
            /tmp/pass219-i116/hhs_runtime_exact_abi.o \
            -o /tmp/pass219-i116/test-218-c
          /tmp/pass219-i116/test-218-c

      - name: Run Pass 218 C++17 non-authority membrane conformance
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_inherited_pass218_1_16.cpp \
            /tmp/pass219-i116/hhs_runtime_exact_abi.o \
            -o /tmp/pass219-i116/test-218-cpp
          /tmp/pass219-i116/test-218-cpp

      - name: Run Pass 217 C cumulative-closure conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_inherited_pass217_1_16.c \
            /tmp/pass219-i116/hhs_runtime_exact_abi.o \
            -o /tmp/pass219-i116/test-217-c
          /tmp/pass219-i116/test-217-c

      - name: Run Pass 217 C++17 non-authority membrane conformance
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_inherited_pass217_1_16.cpp \
            /tmp/pass219-i116/hhs_runtime_exact_abi.o \
            -o /tmp/pass219-i116/test-217-cpp
          /tmp/pass219-i116/test-217-cpp

      - name: Preserve frozen I114 execution-composer ABI
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_rna_execution_composer_1_14.c \
            /tmp/pass219-i116/hhs_runtime_exact_abi.o \
            -o /tmp/pass219-i116/test-i114-c
          /tmp/pass219-i116/test-i114-c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped Python validation packages
        run: python -m pip install --upgrade pytest fastapi httpx cryptography uvicorn

      - name: Run I116 cumulative kernel-composer registration test
        run: PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass_membrane_i116.py

      - name: Preserve admitted Pass 217 cumulative closure semantics
        run: pytest -q --tb=short tests/test_hhs_pass217_cumulative_closure_v1.py

      - name: Preserve frozen Pass 217 I4 Hash72 and nucleus semantics
        run: pytest -q --tb=short tests/test_hhs_pass217_hash72_manifold_nucleus_v1.py

      - name: Preserve frozen Pass 218 I48 terminal completion semantics
        run: pytest -q --tb=short tests/pass218/test_pass218_iteration48_manifest_bound_curriculum_completion_seal.py
