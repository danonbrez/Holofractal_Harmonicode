name: Apply Pass 158 hardening payload

on:
  push:
    branches:
      - agent/pass158-llabi-nftc-api
    paths:
      - .p158-hardening/**
      - .github/workflows/apply-pass158-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          cat .p158-hardening/part-* | base64 --decode > /tmp/pass158-hardening.tar.gz
          echo "46103865e9e4491fdecd338766af4b9428e0c11b5f95cb020f4ab6bb0f091f6c  /tmp/pass158-hardening.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pass158-hardening.tar.gz
          rm -rf .p158-hardening
          rm -f .github/workflows/apply-pass158-hardening.yml
      - name: Commit hardened sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Harden Pass 158 ABI and Hash216 projection integration"
          git push origin HEAD:${GITHUB_REF_NAME}
