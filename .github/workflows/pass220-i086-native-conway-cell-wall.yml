name: Pass 220 I086 Native Conway Cell Wall

on:
  push:
    branches:
      - agent/pass220-i086-prime-orbit-formalization-20261012
  pull_request:
    paths:
      - 'hhs_runtime/include/hhs_pass219_core_holographic_rna_cell_wall_1_24.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_vm81_pqc_cell_wall_1_30.cpp'
      - 'hhs_runtime/include/hhs_pass220_i086_lane5_conway_cell_wall_v1.h'
      - 'tests/pass220/test_i086_pass219_cpp_cell_wall_conway.cpp'
      - '.github/workflows/pass220-i086-native-conway-cell-wall.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cell-wall:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
      - name: Build native exact ABI and C++ membrane
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          bash tools/pass219/build_exact_abi_link_support.sh /tmp/i086-link full
          nm /tmp/i086-link/hhs_pass219_vm81_pqc_cell_wall.o | c++filt | grep hhs_pass220_i086_lane5_conway81_cell_wall
      - name: Build inherited membrane dependencies
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass188_bott_runtime/include -c native_projects/hhs_pass188_bott_runtime/src/hhs_pass188_bott_runtime.c -o /tmp/i086-link/pass188.o
          gcc -c native_projects/hhs_pass188_bott_runtime/src/hhs_pass188_bott_step_x86_64.S -o /tmp/i086-link/pass188-x86.o
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass189_hqlh_runtime/include -c native_projects/hhs_pass189_hqlh_runtime/src/hhs_pass189_hqlh.c -o /tmp/i086-link/pass189.o
      - name: Run native Conway regression
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -Ihhs_runtime/include \
            -Inative_projects/hhs_pass188_bott_runtime/include \
            -Inative_projects/hhs_pass189_hqlh_runtime/include \
            tests/pass220/test_i086_pass219_cpp_cell_wall_conway.cpp \
            /tmp/i086-link/pass188.o /tmp/i086-link/pass188-x86.o /tmp/i086-link/pass189.o \
            /tmp/i086-link/hhs_pass219_vm81_pqc_cell_wall.o \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/i086-link/test-conway
          /tmp/i086-link/test-conway
      - name: Verify unchanged native authority
        run: |
          test -f hhs_runtime/HARMONICODE_VM_RUNTIME.c
          test -f hhs_runtime/include/hhs_pass220_i086_lane5_conway_cell_wall_v1.h
