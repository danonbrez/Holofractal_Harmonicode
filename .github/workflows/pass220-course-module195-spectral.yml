name: Pass 220 Course Module 195 Exact Spectral Witness
on:
  pull_request:
    paths:
      - 'hhs_runtime/hhs_pass220_course_m195_spectral_tensor_witness_v1.py'
      - 'tests/pass220/test_hhs_pass220_course_m195_spectral_tensor_witness_v1.py'
      - 'hhs_runtime/hhs_pass220_course_m195_hnan_bridge_v1.py'
      - 'hhs_runtime/hhs_pass220_course_m195_raw5184_source_candidate_v1.py'
      - 'tests/pass220/test_hhs_pass220_course_m195_raw5184_source_candidate_v1.py'
      - 'hhs_runtime/c/hhs_pass220_course_m195_gaussian_hnan_ingress_v1.c'
      - 'hhs_runtime/include/hhs_pass220_course_m195_gaussian_hnan_ingress_v1.h'
      - 'tests/pass220/test_hhs_pass220_course_m195_native_gaussian_ingress_v1.py'
      - 'hhs_runtime/hhs_pass220_course_m195_source_lineage_diagnostic_v1.py'
      - 'tests/pass220/test_hhs_pass220_course_m195_source_lineage_diagnostic_v1.py'
      - 'tests/pass220/test_hhs_pass220_course_m195_hnan_bridge_v1.py'
      - 'docs/pass220/HARMONICODE_ALGEBRA_COURSE_MODULE_195_SPECTRAL_TENSOR.md'
      - '.github/workflows/pass220-course-module195-spectral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-spectral-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # source-lineage diagnostic requires historical frozen Git blob
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute Module 195 exact witness
        run: python hhs_runtime/hhs_pass220_course_m195_spectral_tensor_witness_v1.py
      - name: Run fail-closed Module 195 regression tests
        run: python -m unittest discover -s tests/pass220 -p 'test_hhs_pass220_course_m195_spectral_tensor_witness_v1.py' -v
      - name: Test inherited HNAN adapter fail-closed behavior
        run: python -m unittest discover -s tests/pass220 -p 'test_hhs_pass220_course_m195_hnan_bridge_v1.py' -v
      - name: Verify historical frozen-course provenance remains fail-closed
        run: python -m unittest discover -s tests/pass220 -p 'test_hhs_pass220_course_m195_source_lineage_diagnostic_v1.py' -v
      - name: Execute exact C11 source-derived denominator and inherited passthrough
        run: python -m unittest discover -s tests/pass220 -p 'test_hhs_pass220_course_m195_native_gaussian_ingress_v1.py' -v
      - name: Execute source-pinned raw5184 Module 195 native candidate tests
        run: python -m unittest discover -s tests/pass220 -p 'test_hhs_pass220_course_m195_raw5184_source_candidate_v1.py' -v
