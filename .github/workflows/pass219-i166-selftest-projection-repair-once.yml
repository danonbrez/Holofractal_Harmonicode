name: Pass 219 I166 SelfTest Projection Repair Once

on:
  push:
    branches:
      - agent/pass219-i166-pass168-terminal-parent-closure
    paths:
      - '.github/workflows/pass219-i166-selftest-projection-repair-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass219-i166-pass168-terminal-parent-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Export complete native Pass168 self-test proof
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('hhs_python/runtime/hhs_pass168_ctypes_bridge.py')
          text=path.read_text(encoding='utf-8')
          old='''        return {\n            "status": status,\n            "source_preserved": bool(proof.source_preserved),\n            "parenthesis_parameters_registered": int(proof.parenthesis_parameters_registered),\n            "equality_half_gates_registered": int(proof.equality_half_gates_registered),\n            "threads_registered": int(proof.threads_registered),\n            "raw_threads": int(proof.raw_threads),\n            "derived_threads": int(proof.derived_threads),\n            "cells_covered": int(proof.cells_covered),\n            "duplicate_addresses": int(proof.duplicate_addresses),\n            "inverse_address_failures": int(proof.inverse_address_failures),\n            "comparators_verified": int(proof.comparators_verified),\n            "sparse_dependency_updates_verified": bool(proof.sparse_dependency_updates_verified),\n            "hash72_receipts_verified": bool(proof.hash72_receipts_verified),\n            "hash216_identity_verified": bool(proof.hash216_identity_verified),\n            "rollback_verified": bool(proof.rollback_verified),\n            "repair_verified": bool(proof.repair_verified),\n            "deterministic_replay_verified": bool(proof.deterministic_replay_verified),\n            "floating_point_canonical_authority": bool(proof.floating_point_canonical_authority),\n            "fallback_used": bool(proof.fallback_used),\n            "deterministic_record_hash216": _c_text(proof.deterministic_record_hash216),\n        }\n'''
          new='''        return {\n            "status": status,\n            "source_preserved": bool(proof.source_preserved),\n            "parenthesis_parameters_registered": int(proof.parenthesis_parameters_registered),\n            "equality_half_gates_registered": int(proof.equality_half_gates_registered),\n            "threads_registered": int(proof.threads_registered),\n            "raw_threads": int(proof.raw_threads),\n            "derived_threads": int(proof.derived_threads),\n            "cells_covered": int(proof.cells_covered),\n            "duplicate_addresses": int(proof.duplicate_addresses),\n            "inverse_address_failures": int(proof.inverse_address_failures),\n            "banks_per_thread": int(proof.banks_per_thread),\n            "cells_per_bank": int(proof.cells_per_bank),\n            "exact_rational_authority": bool(proof.exact_rational_authority),\n            "baseline_upper_equals_361L": bool(proof.baseline_upper_equals_361L),\n            "baseline_lower_equals_360L": bool(proof.baseline_lower_equals_360L),\n            "successor_residual_equals_L": bool(proof.successor_residual_equals_L),\n            "loshu_square_identity": bool(proof.loshu_square_identity),\n            "gauge_cancellation_verified": bool(proof.gauge_cancellation_verified),\n            "ratio_channels_verified": bool(proof.ratio_channels_verified),\n            "comparators_verified": int(proof.comparators_verified),\n            "sparse_dependency_updates_verified": bool(proof.sparse_dependency_updates_verified),\n            "single_vm81_commit_authority": bool(proof.single_vm81_commit_authority),\n            "hash72_receipts_verified": bool(proof.hash72_receipts_verified),\n            "hash216_identity_verified": bool(proof.hash216_identity_verified),\n            "rollback_verified": bool(proof.rollback_verified),\n            "repair_verified": bool(proof.repair_verified),\n            "deterministic_replay_verified": bool(proof.deterministic_replay_verified),\n            "x86_64_verified": bool(proof.x86_64_verified),\n            "arm64_verified": bool(proof.arm64_verified),\n            "floating_point_canonical_authority": bool(proof.floating_point_canonical_authority),\n            "fallback_used": bool(proof.fallback_used),\n            "deterministic_record_hash216": _c_text(proof.deterministic_record_hash216),\n        }\n'''
          if text.count(old) != 1:
              raise SystemExit('Pass168 self_test projection anchor mismatch')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile hhs_python/runtime/hhs_pass168_ctypes_bridge.py hhs_runtime/pass168/terminal_artifacts.py
          timeout 600s make c-abi
          PYTHONPATH=. HHS_DISABLE_C_AUTOBUILD=1 python - <<'PY'
          from hhs_python.runtime.hhs_pass168_ctypes_bridge import HHSPass168RuntimeBridge
          proof=HHSPass168RuntimeBridge.self_test()
          required=(
              'banks_per_thread','cells_per_bank','exact_rational_authority',
              'baseline_upper_equals_361L','baseline_lower_equals_360L',
              'successor_residual_equals_L','loshu_square_identity',
              'gauge_cancellation_verified','ratio_channels_verified',
              'single_vm81_commit_authority','x86_64_verified','arm64_verified',
          )
          assert all(key in proof for key in required)
          assert proof['banks_per_thread']==9 and proof['cells_per_bank']==9
          assert proof['exact_rational_authority'] is True
          assert proof['single_vm81_commit_authority'] is True
          assert proof['floating_point_canonical_authority'] is False
          assert proof['fallback_used'] is False
          print('complete Pass168 native self-test projection: PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hhs_python/runtime/hhs_pass168_ctypes_bridge.py
          git commit -m 'Pass 219 I166: expose complete Pass168 native self-test proof [skip ci]'
          git push origin HEAD:agent/pass219-i166-pass168-terminal-parent-closure
