name: Pass 211 Bootstrap
on:
  push:
    branches:
      - agent/pass211-bigint-hfc-carrier
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize Pass 211 source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .pass211-bootstrap/chunk00 .pass211-bootstrap/chunk01 .pass211-bootstrap/chunk02 .pass211-bootstrap/chunk03 .pass211-bootstrap/chunk04 > /tmp/pass211_payload.b64
          base64 -d /tmp/pass211_payload.b64 > /tmp/pass211_payload.tar.xz
          tar -xJf /tmp/pass211_payload.tar.xz -C .
          rm -rf .pass211-bootstrap .github/workflows/pass211-bootstrap.yml
          git config user.name hhs-pass211-bootstrap
          git config user.email hhs-pass211-bootstrap@users.noreply.github.com
          git add -A
          git commit -m "feat(pass211): implement BigInt HFC carrier integration"
          git push origin HEAD:agent/pass211-bigint-hfc-carrier
