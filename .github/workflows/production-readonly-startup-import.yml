name: Production Readonly Startup Import Validation

on:
  push:
    branches:
      - fix/production-runtime-api-artifact-root-20260925
    paths:
      - '.github/workflows/production-readonly-startup-import.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production import against immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt -r requirements-litert-lm.txt
          make -C hhs_runtime shared
          python -m pytest -q             tests/test_runtime_api_artifact_root_production.py             tests/test_production_mutable_state_roots.py             tests/test_runtime_lock_certifier_production_state.py             tests/test_production_systemd_environment_serialization.py

          state="$RUNNER_TEMP/hhs-state"
          mkdir -p             "$state/data/runtime"             "$state/runtime-certification"             "$state/runtime-api"             "$state/graphics-hydration"             "$state/storybook-reels"             "$state/vulkan-runtime"             "$state/pass174" "$state/pass194" "$state/pass196" "$state/pass197"             "$state/pass198" "$state/pass199" "$state/pass200a" "$state/pass200b"             "$state/pass200c" "$state/pass203" "$state/pass204" "$state/pass205"             "$state/pass213/surface" "$state/pass218" "$state/pass219/lane5"             "$state/runtime-bootstrap" "$state/warm-boot/releases" "$state/runtime-os/current"

          export PYTHONDONTWRITEBYTECODE=1
          export HHS_REPOSITORY_ROOT="$GITHUB_WORKSPACE"
          export HHS_REPO_ROOT="$GITHUB_WORKSPACE"
          export HHS_DISABLE_C_AUTOBUILD=1
          export HHS_DATA_DIR="$state/data"
          export HHS_RUNTIME_OUTPUT_DIR="$state/data/runtime"
          export HHS_RUNTIME_CERTIFICATION_DIR="$state/runtime-certification"
          export HHS_RUNTIME_API_ARTIFACT_ROOT="$state/runtime-api"
          export HHS_FILESYSTEM_LEDGER_PATH="$state/data/runtime/hhs_filesystem_ledger.json"
          export HHS_GRAPHICS_HYDRATION_ROOT="$state/graphics-hydration"
          export HHS_STORYBOOK_REEL_ARTIFACT_ROOT="$state/storybook-reels"
          export HHS_VULKAN_RUNTIME_ROOT="$state/vulkan-runtime"
          export HHS_PASS174_STATE_DIR="$state/pass174"
          export HHS_PASS194_STATE_ROOT="$state/pass194"
          export HHS_PASS196_STATE_ROOT="$state/pass196"
          export HHS_PASS197_STATE_ROOT="$state/pass197"
          export HHS_PASS198_STATE_ROOT="$state/pass198"
          export HHS_PASS199_STATE_ROOT="$state/pass199"
          export HHS_PASS200A_STATE_ROOT="$state/pass200a"
          export HHS_PASS200B_STATE_ROOT="$state/pass200b"
          export HHS_PASS200C_STATE_ROOT="$state/pass200c"
          export HHS_PASS203_STATE_ROOT="$state/pass203"
          export HHS_PASS204_STATE_ROOT="$state/pass204"
          export HHS_PASS205_DB="$state/pass205/continuation.sqlite3"
          export HHS_PASS213_SURFACE_STATE_DIR="$state/pass213/surface"
          export HHS_PASS218_STATE_ROOT="$state/pass218"
          export HHS_PASS219_LANE5_STATE_ROOT="$state/pass219/lane5"
          export HHS_RUNTIME_BOOTSTRAP_ROOT="$state/runtime-bootstrap"
          export HHS_WARM_BOOT_MANIFEST_ROOT="$state/warm-boot/releases"
          export HHS_RUNTIME_OS_ASSET_ROOT="$state/runtime-os/current"
          export HHS_RUNTIME_STATUS_CACHE="$state/runtime-bootstrap/status-cache.json"
          export HHS_RUNTIME_STATUS_PROBE=0
          export HHS_COGNITION_AUTO_TICK=0

          trap 'chmod -R u+w "$GITHUB_WORKSPACE" || true' EXIT
          chmod -R a-w "$GITHUB_WORKSPACE"
          python - <<'PY'
          import hhs_backend.production_visual_server as production
          assert production.app is not None
          print("HHS_PRODUCTION_READONLY_IMPORT_PASS=1")
          PY
