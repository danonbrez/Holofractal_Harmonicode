name: Pass 218 Full Iteration 46

on:
  push:
    branches:
      - agent/pass218-full-iteration46-manifest-bound-i32-source-closure
  pull_request:
    branches:
      - main
    paths:
      - 'hhs_runtime/pass218/**'
      - 'hhs_backend/runtime_os_pass218_*.py'
      - 'hhs_backend/runtime_os_application_server.py'
      - 'tests/pass218/**'
      - 'tests/test_runtime_os_production_root.py'
      - 'scripts/pass218_iteration46_manifest_i32_source_closure_validation.py'
      - '.github/workflows/pass218-full-iteration46.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-bound-i32-source-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact Iteration 46 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped validation packages
        run: python -m pip install --upgrade pytest fastapi httpx cryptography uvicorn

      - name: Compile cumulative Pass 218 and I45-I46 bindings
        run: |
          python -m py_compile hhs_runtime/pass218/*.py
          python -m py_compile hhs_backend/runtime_os_pass218_manifest_i31_verbatim_purge_i45.py
          python -m py_compile hhs_backend/runtime_os_pass218_manifest_i32_source_closure_i46.py
          python -m py_compile hhs_backend/runtime_os_application_server.py
          python -m py_compile scripts/pass218_iteration46_manifest_i32_source_closure_validation.py
          python -m py_compile tests/pass218/test_pass218_iteration46_manifest_bound_i32_source_closure.py

      - name: Enforce global Pass 218 and I45-I46 no-authoritative-float literals
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = sorted(Path('hhs_runtime/pass218').glob('*.py')) + [
              Path('hhs_backend/runtime_os_pass218_manifest_i31_verbatim_purge_i45.py'),
              Path('hhs_backend/runtime_os_pass218_manifest_i32_source_closure_i46.py'),
          ]
          assert paths
          for path in paths:
              tree = ast.parse(path.read_text('utf-8'))
              floats = [
                  node for node in ast.walk(tree)
                  if isinstance(node, ast.Constant) and isinstance(node.value, float)
              ]
              assert not floats, f'{path}: authoritative float literal(s) found'
          print('PASS218_I46_GLOBAL_NO_FLOAT_LITERAL_AUTHORITY=1')
          PY

      - name: Run focused I46 manifest-bound I32 closure tests
        run: |
          python - <<'PY'
          import subprocess
          command = [
              'pytest', '-q', '--tb=short',
              'tests/pass218/test_pass218_iteration46_manifest_bound_i32_source_closure.py',
          ]
          completed = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(completed.stdout)
          if completed.returncode:
              detail = completed.stdout[-12000:]
              detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=I46 focused test failure::{detail}')
          raise SystemExit(completed.returncode)
          PY

      - name: Preserve frozen I45 manifest-bound I31 purge semantics
        run: pytest -q tests/pass218/test_pass218_iteration45_manifest_bound_i31_verbatim_purge.py

      - name: Preserve frozen I44 manifest-bound I30 promotion semantics
        run: pytest -q tests/pass218/test_pass218_iteration44_manifest_bound_i30_atomic_promotion.py

      - name: Preserve frozen I43 request authorization semantics
        run: pytest -q tests/pass218/test_pass218_iteration43_manifest_bound_i30_promotion_request_authorization.py

      - name: Preserve frozen I42 cross-lineage equality semantics
        run: pytest -q tests/pass218/test_pass218_iteration42_manifest_semantic_cross_lineage_equality.py

      - name: Preserve frozen I41 canonical learning ingress semantics
        run: pytest -q tests/pass218/test_pass218_iteration41_manifest_bound_canonical_learning_ingress.py

      - name: Preserve frozen I40 canonical commit persistence semantics
        run: pytest -q tests/pass218/test_pass218_iteration40_manifest_bound_canonical_commit_persistence.py

      - name: Preserve frozen I34 manifest source identity semantics
        run: pytest -q tests/pass218/test_pass218_iteration34_manifest_source_ingress.py

      - name: Preserve frozen I33 curriculum authority separation
        run: pytest -q tests/pass218/test_pass218_iteration33_curriculum_advance.py

      - name: Preserve frozen I32 source closure semantics
        run: pytest -q tests/pass218/test_pass218_iteration32_source_closure.py

      - name: Preserve frozen I31 verbatim purge semantics
        run: pytest -q tests/pass218/test_pass218_iteration31_verbatim_purge.py

      - name: Preserve frozen I30 atomic semantic promotion semantics
        run: pytest -q tests/pass218/test_pass218_iteration30_atomic_semantic_promotion.py

      - name: Preserve frozen I29 independent validation semantics
        run: pytest -q tests/pass218/test_pass218_iteration29_hash216_vm5184_validation.py

      - name: Preserve frozen I27 differentiation semantics
        run: pytest -q tests/pass218/test_pass218_iteration27_formal_analogical_differentiation.py

      - name: Preserve frozen I7 durable canonical persistence semantics
        run: pytest -q tests/pass218/test_pass218_iteration7_durable_canonical_persistence.py

      - name: Preserve frozen I6 atomic canonical commit semantics
        run: pytest -q tests/pass218/test_pass218_iteration6_canonical_commit_boundary.py

      - name: Preserve canonical writer-fence semantics
        run: pytest -q tests/pass218/test_pass218_iteration9_multiprocess_canonical_ownership.py

      - name: Preserve inherited Pass205 native continuation ABI
        run: pytest -q tests/test_hhs_pass205_continuation_runtime_v1.py

      - name: Preserve Pass 166 Word2Vec runtime semantics
        run: pytest -q tests/test_hhs_pass166_word2vec_v1.py

      - name: Preserve repository-native creative-writing crawler boundary
        run: pytest -q tests/pass218/test_repository_native_creative_writing_crawler.py

      - name: Emit deterministic I46 source-closure evidence
        run: PYTHONPATH="$PWD" python scripts/pass218_iteration46_manifest_i32_source_closure_validation.py

      - name: Preserve RuntimeOS production-root acceptance
        run: pytest -q tests/test_runtime_os_production_root.py

      - name: Upload I46 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass218-iteration46-manifest-bound-i32-source-closure-evidence
          path: .i46-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
