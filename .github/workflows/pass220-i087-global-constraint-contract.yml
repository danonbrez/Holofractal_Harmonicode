name: Pass 220 I087 Global Constraint Contract
on:
  pull_request:
    paths:
      - "contracts/pass220/PASS_220_I087_GLOBAL_CONSTRAINT_RECONCILIATION_V1.json"
      - "contracts/pass219/PASS_219_LANE5_HNAN_GLOBAL_CONSTRAINT_GRAPH_1_63.json"
      - "tests/pass220/test_pass220_i087_global_constraint_contract_v1.py"
      - ".github/workflows/pass220-i087-global-constraint-contract.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inherited-graph-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Check I087 source graph and proof status
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_i087_global_constraint_contract_v1.py
