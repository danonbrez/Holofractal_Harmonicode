name: Pass 219 I141 Pass 185 Phase 3 Browser Lifecycle Acceptance

on:
  push:
    branches:
      - agent/pass219-iteration141-pass185-production-browser-closure-reconciliation
    paths:
      - 'hhs_gui/runtime_os/core/RuntimeSocketManager.ts'
      - 'hhs_gui/runtime_os/core/LiveRuntimeProjectionPanel.tsx'
      - 'hhs_gui/runtime_os/workspace/Pass185ApplicationLifecyclePanel.tsx'
      - 'hhs_verification/pass185/phase3_browser_lifecycle_acceptance.py'
      - 'docs/pass185/HHS_PASS_185_I141_PHASE3_BROWSER_LIFECYCLE_ACCEPTANCE.md'
      - 'docs/operations/restart/PASS_219_I141_PASS185_PRODUCTION_BROWSER_CLOSURE_RESTART.md'
      - '.github/workflows/pass219-i141-pass185-phase3-browser-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i141-pass185-phase3-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase3-browser-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HHS_COGNITION_AUTO_TICK: '0'
      HHS_PASS174_BOOT_TIMEOUT_SECONDS: '12'
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: '0.5'
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_PASS185_PHASE3_EVIDENCE: '/tmp/pass185-phase3'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped runtime packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'cryptography>=46.0,<47.0' \
            requests \
            pytest \
            playwright

      - name: Prove inherited compiled C runtime
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so
          sha256sum hhs_runtime/builds/libhhs_runtime.so | tee /tmp/pass185-phase3-c-runtime.sha256

      - name: Typecheck and build exact Runtime OS public root
        working-directory: hhs_gui
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.html
          test -d dist/assets

      - name: Validate Phase-3 source contract
        run: |
          python -m py_compile hhs_verification/pass185/phase3_browser_lifecycle_acceptance.py
          grep -Fq 'hhs_backend.runtime_os_application_server:app' \
            hhs_verification/pass185/phase3_browser_lifecycle_acceptance.py
          grep -Fq 'terminal_pass185_completion_claimed' \
            hhs_verification/pass185/phase3_browser_lifecycle_acceptance.py
          grep -Fq 'reconnectTimers' hhs_gui/runtime_os/core/RuntimeSocketManager.ts
          grep -Fq 'live-runtime-transport-metrics' \
            hhs_gui/runtime_os/core/LiveRuntimeProjectionPanel.tsx
          grep -Fq 'LOCAL_STORAGE_UNAVAILABLE_LOCAL_SESSION_ACTIVE' \
            hhs_gui/runtime_os/workspace/Pass185ApplicationLifecyclePanel.tsx
          grep -Fq 'HHS_PASS_185_PHASE3_BROWSER_LIFECYCLE_ACCEPTANCE_IMPLEMENTED_PENDING_VALIDATION' \
            docs/pass185/HHS_PASS_185_I141_PHASE3_BROWSER_LIFECYCLE_ACCEPTANCE.md

      - name: Install bounded Chromium
        run: timeout 600s python -m playwright install --with-deps chromium

      - name: Run Phase-3 real-browser lifecycle acceptance
        run: |
          mkdir -p "$HHS_PASS185_PHASE3_EVIDENCE"
          timeout 480s python -m hhs_verification.pass185.phase3_browser_lifecycle_acceptance \
            --evidence-dir "$HHS_PASS185_PHASE3_EVIDENCE"

      - name: Retain impacted production-root regressions
        run: |
          timeout 180s pytest -q \
            tests/test_hhs_pass174_heroku_boot_resilience_v1.py \
            tests/test_runtime_os_production_root.py

      - name: Seal Phase-3 evidence
        if: always()
        run: |
          mkdir -p "$HHS_PASS185_PHASE3_EVIDENCE"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('/tmp/pass185-phase3')
          payload = {
              'schema': 'HHS_PASS219_I141_PASS185_PHASE3_VALIDATION_SEAL_V1',
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'authoritative_main_base': 'f8aa3337ee023c7d828343eac208987c20a05e67',
              'phase2_validated_head': '2b972a66743a505937d5f819c839f5e59dda98b4',
              'pass185_contract_commit': 'f260f2b013072a48399d9cdc207d0a76a6c63d2f',
              'classification': 'HHS_PASS_185_PHASE3_BROWSER_LIFECYCLE_EXECUTED',
              'terminal_pass185_completion_claimed': False,
              'evidence': {},
              'source_blobs': {},
          }
          for path in [
              'hhs_gui/runtime_os/core/RuntimeSocketManager.ts',
              'hhs_gui/runtime_os/core/LiveRuntimeProjectionPanel.tsx',
              'hhs_gui/runtime_os/workspace/Pass185ApplicationLifecyclePanel.tsx',
              'hhs_verification/pass185/phase3_browser_lifecycle_acceptance.py',
              'docs/pass185/HHS_PASS_185_I141_PHASE3_BROWSER_LIFECYCLE_ACCEPTANCE.md',
          ]:
              payload['source_blobs'][path] = subprocess.check_output(
                  ['git', 'hash-object', path], text=True
              ).strip()
          for evidence in sorted(root.glob('**/*.json')):
              data = json.loads(evidence.read_text())
              payload['evidence'][evidence.name] = {
                  'ok': data.get('ok'),
                  'classification': data.get('classification'),
                  'path': str(evidence.relative_to(root)),
                  'sha256': hashlib.sha256(evidence.read_bytes()).hexdigest(),
              }
          encoded = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(encoded).hexdigest()
          (root / 'i141-phase3-seal.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i141-pass185-phase3-browser-lifecycle
          path: |
            /tmp/pass185-phase3/**
            /tmp/pass185-phase3-c-runtime.sha256
          if-no-files-found: warn
          retention-days: 30
