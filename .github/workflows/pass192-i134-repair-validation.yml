name: Pass 192 I134 Repair Validation

on:
  push:
    branches:
      - agent/pass219-iteration134-pass192-census-membrane
    paths:
      - 'hhs_runtime/pass192/**'
      - 'hhs_backend/api/pass192_fibonacci_routes.py'
      - 'hhs_backend/visual_server.py'
      - 'schemas/pass192/**'
      - 'tests/test_hhs_pass192_*'
      - 'tests/test_hhs_pass219_fibonacci_compression_compliance.py'
      - 'tests/pass192_193/test_pass192_193_contract_invariants.py'
      - '.github/workflows/pass192-i134-repair-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/pass192/**'
      - 'hhs_backend/api/pass192_fibonacci_routes.py'
      - 'hhs_backend/visual_server.py'
      - 'schemas/pass192/**'
      - 'tests/test_hhs_pass192_*'
      - 'tests/test_hhs_pass219_fibonacci_compression_compliance.py'
      - 'tests/pass192_193/test_pass192_193_contract_invariants.py'
      - '.github/workflows/pass192-i134-repair-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass192-focused-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'fastapi==0.128.2' \
            'starlette==0.50.0' \
            'pydantic>=2.7,<3.0' \
            'httpx>=0.27,<1.0' \
            'cryptography>=46.0,<47.0' \
            'pytest>=8,<9'

      - name: Prove frozen I133 and Pass 192 authorization lineage
        run: |
          git merge-base --is-ancestor 8380d2dbc9cf1b0245f006eaa440b47a921d4901 HEAD
          test "$(git merge-base 8380d2dbc9cf1b0245f006eaa440b47a921d4901 HEAD)" = "8380d2dbc9cf1b0245f006eaa440b47a921d4901"
          git merge-base --is-ancestor c3da7e2b7125754b65f08fb8922a151bf01df2b8 HEAD
          test "$(git rev-parse c3da7e2b7125754b65f08fb8922a151bf01df2b8:docs/pass192/HHS_PASS_192_LO_SHU_CELLULAR_FIBONACCI_NESTING_TENSOR_AND_MODULAR_MEMBRANE_DEPTH_AUTHORITY.md)" = \
               "$(git hash-object docs/pass192/HHS_PASS_192_LO_SHU_CELLULAR_FIBONACCI_NESTING_TENSOR_AND_MODULAR_MEMBRANE_DEPTH_AUTHORITY.md)"

      - name: Compile Pass 192 production surfaces
        run: |
          python -m py_compile \
            hhs_runtime/pass192/__init__.py \
            hhs_runtime/pass192/runtime.py \
            hhs_runtime/pass192/cli.py \
            hhs_backend/api/pass192_fibonacci_routes.py \
            hhs_backend/visual_server.py \
            tests/test_hhs_pass192_cellular_fibonacci_v1.py \
            tests/test_hhs_pass192_fibonacci_routes.py \
            tests/test_hhs_pass192_cli_v1.py \
            tests/test_hhs_pass192_visual_registration.py

      - name: Preserve exact canonical arithmetic boundary
        run: |
          ! grep -Eq '\b(float|double)\b|<math\.h>|\b(sqrt|sin|cos|pow|log|exp)\s*\(' \
            hhs_runtime/pass192/runtime.py \
            hhs_runtime/pass192/cli.py \
            hhs_backend/api/pass192_fibonacci_routes.py \
            schemas/pass192/HHS_PASS_192_CELLULAR_FIBONACCI_TENSOR_V1.schema.json \
            schemas/pass192/HHS_PASS_192_OPERATION_REGISTRY_V1.json

      - name: Validate Pass 192 schemas and operation registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('schemas/pass192/HHS_PASS_192_CELLULAR_FIBONACCI_TENSOR_V1.schema.json').read_text())
          registry = json.loads(Path('schemas/pass192/HHS_PASS_192_OPERATION_REGISTRY_V1.json').read_text())
          assert schema['properties']['magnitude_rows']['const'] == [1,2,3,5,8]
          assert registry['authority']['mutation'] == 'INHERITED_SINGLETON_VM81'
          ids = [item['operation_id'] for item in registry['operations']]
          assert len(ids) == len(set(ids))
          assert 'P192.CellularFibonacciTensor' in ids
          assert 'P192.MaterializeTensorPrefix' in ids
          assert 'P192.ValidateTensor' in ids
          assert 'P192.ReplayTensor' in ids
          PY

      - name: Run inherited Pass 192 contract oracle
        run: |
          python tests/pass192_193/test_pass192_193_contract_invariants.py -v

      - name: Preserve inherited Pass 219 1.9 Fibonacci compression
        run: |
          PYTHONPATH="$PWD" python -m pytest -q tests/test_hhs_pass219_fibonacci_compression_compliance.py

      - name: Run dedicated Pass 192 runtime API CLI and production registration
        run: |
          PYTHONPATH="$PWD" python -m unittest -v \
            tests.test_hhs_pass192_cellular_fibonacci_v1 \
            tests.test_hhs_pass192_fibonacci_routes \
            tests.test_hhs_pass192_cli_v1 \
            tests.test_hhs_pass192_visual_registration

      - name: Compile inherited aggregate exact C ABI
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c -o /tmp/hhs-i134-exact.o
