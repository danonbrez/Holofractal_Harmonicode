name: Pass 220 Complete Whitepaper Corpus Ingress
on:
  pull_request:
    paths:
      - "whitepapers/**"
      - "docs/whitepapers/**"
      - "contracts/pass220/PASS_220_WHITEPAPER_CORPUS_SOURCE_FREEZE_V1.json"
      - "hhs_runtime/hhs_pass220_whitepaper_corpus_ingress_v1.py"
      - "tests/pass220/test_pass220_whitepaper_corpus_ingress_v1.py"
      - ".github/workflows/pass220-complete-whitepaper-corpus-ingress.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify both complete whitepaper folders and native admission boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_whitepaper_corpus_ingress_v1.py
