name: Pass 220 Audio Harmonic Cellular Projection
on:
  push:
    branches:
      - 'agent/pass220-audio-amplitude-harmonic-*'
  pull_request:
    paths:
      - 'examples/ParticleSimulation.html'
      - 'examples/ParticleSimulationAudioBridge.js'
      - 'tests/pass220/test_hhs_pass220_four_phase_liquid_light.py'
      - 'tests/pass220/test_hhs_pass220_qepsilon_17_html_projection.py'
      - 'tests/pass220/test_hhs_pass220_audio_amplitude_harmonic_projection_v1.py'
      - 'tests/pass220/test_hhs_pass220_vertical_gyroscopic_shader_v1.py'
      - 'tests/pass220/test_hhs_pass220_orthogonal_rotating_shader_v2.py'
      - 'tests/pass220/test_hhs_pass220_particle_centered_halo_v1.py'
      - 'tests/pass220/test_hhs_pass220_brownian_light_antiparticles_v1.py'
      - '.github/workflows/pass220-audio-amplitude-harmonic-projection.yml'
jobs:
  audio-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - run: node --check examples/ParticleSimulationAudioBridge.js
      - name: Scoped audio and inherited particle regressions
        run: |
          python -m pytest -q --tb=short \
            tests/pass220/test_hhs_pass220_four_phase_liquid_light.py \
            tests/pass220/test_hhs_pass220_qepsilon_17_html_projection.py \
            tests/pass220/test_hhs_pass220_audio_amplitude_harmonic_projection_v1.py \
            tests/pass220/test_hhs_pass220_vertical_gyroscopic_shader_v1.py \
            tests/pass220/test_hhs_pass220_orthogonal_rotating_shader_v2.py \
            tests/pass220/test_hhs_pass220_particle_centered_halo_v1.py \
            tests/pass220/test_hhs_pass220_brownian_light_antiparticles_v1.py \
            tests/pass220/test_hhs_pass220_audio_visible_particles_lighting.py \
            tests/pass220/test_hhs_pass220_stereo_particle_audio_controls.py \
            tests/pass220/test_hhs_pass220_i057_particle_simulation_performance.py
