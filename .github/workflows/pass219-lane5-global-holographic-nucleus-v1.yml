name: Pass 219 Lane 5 Global Holographic Nucleus v1

on:
  push:
    branches:
      - agent/pass219-lane5-global-holographic-nucleus-contract-20260913
    paths:
      - 'contracts/pass219/PASS_219_LANE5_GLOBAL_HOLOGRAPHIC_NUCLEUS_V1.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_global_holographic_nucleus_1_34.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/c/hhs_pass219_vm81_authority_exports.map'
      - 'tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c'
      - 'tests/pass219/test_pass219_rna_vm5184_abi_1_33.c'
      - '.github/workflows/pass219-lane5-global-holographic-nucleus-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Static Lane 5 authority contract gate
        run: |
          python - <<'PY'
          from pathlib import Path
          contract = Path('contracts/pass219/PASS_219_LANE5_GLOBAL_HOLOGRAPHIC_NUCLEUS_V1.md').read_text()
          header = Path('hhs_runtime/include/hhs_pass219_lane5_global_holographic_nucleus_1_34.h').read_text()
          abi = Path('hhs_runtime/c/hhs_runtime_exact_abi.c').read_text()
          exports = Path('hhs_runtime/c/hhs_pass219_vm81_authority_exports.map').read_text()
          vm5184 = Path('hhs_runtime/include/hhs_pass219_rna_vm5184_abi_1_33.h').read_text()
          for needle in (
              'Lane 5 is the highest-level semantic nucleus',
              'Lane 5 is the lowest-level exact address nucleus',
              'FORMALIZE\n-> PROVE\n-> IMPLEMENT\n-> OPTIMIZE\n-> CANONIZE\n-> ITERATE',
              'canonical_write_L5 = 0',
              'KernelAdmission(x) => Lane5Mediated(x)',
              'Hash72 native token / state-change representation',
              'Pass 133 canonical BigInt serialization',
              'Pass 211 BigInt/HFC carrier framing',
              'signed environmental VM81 admission remains the sole canonical mutation authority',
          ):
              assert needle in contract, needle
          for needle in (
              'global_root_orchestration',
              'global_traffic_mediation',
              'validated_hash216_read_only',
              'hash216_sha256_array_addressing',
              'pass133_bigint_serialization',
              'pass211_hfc_frame_compatible',
              'nested_modular_fibonacci_reuse',
              'graphics_vector_hydration',
              'api_registry_visible',
              'learning_iteration_cycle',
              'canonical_vm81_mutation_authority',
              'requires_signed_environmental_vm81_admission',
          ):
              assert needle in header, needle
          assert 'candidate_only' in vm5184
          assert 'hhs_pass219_lane5_global_holographic_nucleus_1_34.inc' in abi
          for hidden in (
              'hhs_exact_vm81_admit_uqcel;',
              'hhs_exact_pass219_admit_composed;',
              'hhs_exact_pass219_rna_admit_composed;',
              'hhs_exact_pass219_vm81_pqc_admit;',
              'hhs_exact_pass219_vm81_pqc_admit_signed;',
              'hhs_exact_pass219_vm81_environment_checkpoint_seal;',
          ):
              assert hidden in exports, hidden
          for public_lane5 in (
              'hhs_exact_pass219_lane5_nucleus_version;',
              'hhs_exact_pass219_lane5_nucleus_authority;',
              'hhs_exact_pass219_lane5_mediate_candidate;',
          ):
              assert public_lane5 not in exports, public_lane5
          print('lane5_global_holographic_nucleus_static=PASS')
          PY

      - name: Build cumulative exact ABI
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Audit exported authority surface
        run: |
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_nucleus_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_nucleus_authority$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_mediate_candidate$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_vm81_environment_admit_signed$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_vm81_admit_uqcel$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_pass219_admit_composed$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_pass219_rna_admit_composed$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_pass219_vm81_pqc_admit$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_pass219_vm81_pqc_admit_signed$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_pass219_vm81_environment_checkpoint_seal$' /tmp/hhs.symbols

      - name: Run Lane 5 nucleus native contract test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-lane5-nucleus
          /tmp/test-lane5-nucleus

      - name: Regress inherited I183 RNA VM5184 ABI
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_rna_vm5184_abi_1_33.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-rna-vm5184
          /tmp/test-rna-vm5184

      - name: Verify Holo4 remains four canonical hydration lanes
        run: |
          grep -q '#define HHS_EXACT_PASS219_HOLO4_LANE_COUNT UINT32_C(4)' \
            hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h
