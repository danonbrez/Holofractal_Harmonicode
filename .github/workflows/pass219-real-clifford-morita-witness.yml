name: Pass 219 Real Clifford Morita Witness

on:
  push:
    branches:
      - agent/pass219-recursive-manifold-learning-20260909
    paths:
      - 'hhs_runtime/pass219/real_clifford_morita_witness.py'
      - 'tests/pass219/test_pass219_real_clifford_morita_witness.py'
      - 'contracts/pass219/PASS_219_RML10_REAL_CLIFFORD_MORITA_WITNESS_1_0.json'
      - '.github/workflows/pass219-real-clifford-morita-witness.yml'
      - 'hhs_runtime/pass219/classical_bott_correspondence.py'
      - 'hhs_runtime/pass219/bott8_native_correspondence.py'
      - 'hhs_runtime/pass219/discrete_hopf_projection.py'
      - 'native_projects/hhs_pass188_bott_runtime/**'
  pull_request:
    paths:
      - 'hhs_runtime/pass219/real_clifford_morita_witness.py'
      - 'tests/pass219/test_pass219_real_clifford_morita_witness.py'
      - 'contracts/pass219/PASS_219_RML10_REAL_CLIFFORD_MORITA_WITNESS_1_0.json'
      - '.github/workflows/pass219-real-clifford-morita-witness.yml'
      - 'hhs_runtime/pass219/classical_bott_correspondence.py'
      - 'hhs_runtime/pass219/bott8_native_correspondence.py'
      - 'hhs_runtime/pass219/discrete_hopf_projection.py'
      - 'native_projects/hhs_pass188_bott_runtime/**'

permissions:
  contents: read

jobs:
  targeted-rml10-clifford-morita:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate inherited Pass 188 native Bott runtime
        run: make -C native_projects/hhs_pass188_bott_runtime validate
      - name: Run RML8 through RML10 Clifford Morita dependency scope
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_bott8_native_correspondence.py \
            tests/pass219/test_pass219_classical_bott_correspondence.py \
            tests/pass219/test_pass219_real_clifford_morita_witness.py
