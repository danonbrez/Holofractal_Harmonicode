name: Pass 220 Course 0-26 Integration
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_course_module_gate_provenance_v1.py"
      - "hhs_runtime/hhs_pass220_whitepaper_corpus_ingress_v1.py"
      - "contracts/pass220/COURSE_EDITION_IDENTITY_V1.json"
      - "docs/pass220/HARMONICODE_ALGEBRA_COURSE_MODULES_13_26.md"
      - "tests/pass220/test_pass220_course_0_26_continuation_synthetic_v1.py"
      - "tests/pass220/test_pass220_course_edition_identity_v1.py"
      - "tests/pass220/test_pass220_course_module_gate_provenance_v1.py"
      - "tests/pass220/test_pass220_whitepaper_corpus_ingress_v1.py"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS/Pass220/Module*.lean"
      - ".github/workflows/pass220-course-0-26-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  course-0-26:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Validate edition pins, synthetic boundaries, provenance, corpus
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --tb=short \
            tests/pass220/test_pass220_course_0_26_continuation_synthetic_v1.py \
            tests/pass220/test_pass220_course_edition_identity_v1.py \
            tests/pass220/test_pass220_course_module_gate_provenance_v1.py \
            tests/pass220/test_pass220_whitepaper_corpus_ingress_v1.py
