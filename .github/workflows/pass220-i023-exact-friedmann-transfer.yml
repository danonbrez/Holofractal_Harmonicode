name: Pass 220 I023 Exact Friedmann Transfer

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_exact_friedmann_transfer_v1.py"
      - "tests/pass220/test_hhs_pass220_exact_friedmann_transfer_v1.py"
      - "hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py"
      - "tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py"
      - "docs/pass220/PASS_220_I023_EXACT_FRIEDMANN_TRANSFER.md"
      - "evidence/pass220/i023_exact_friedmann_transfer_wolfram_20260921_v1.wl"
      - "evidence/pass220/i023_exact_friedmann_transfer_wolfram_20260921_v1.output.json"
      - "docs/operations/restart/PASS_220_I023_EXACT_FRIEDMANN_TRANSFER_RESTART.md"
      - ".github/workflows/pass220-i023-exact-friedmann-transfer.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_exact_friedmann_transfer_v1.py"
      - "tests/pass220/test_hhs_pass220_exact_friedmann_transfer_v1.py"
      - "hhs_runtime/hhs_pass220_cosmological_clock_cadence_v1.py"
      - "tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py"
      - "docs/pass220/PASS_220_I023_EXACT_FRIEDMANN_TRANSFER.md"
      - "evidence/pass220/i023_exact_friedmann_transfer_wolfram_20260921_v1.wl"
      - "evidence/pass220/i023_exact_friedmann_transfer_wolfram_20260921_v1.output.json"
      - "docs/operations/restart/PASS_220_I023_EXACT_FRIEDMANN_TRANSFER_RESTART.md"
      - ".github/workflows/pass220-i023-exact-friedmann-transfer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Reject host time floating point and numerical transcendental authority
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("hhs_runtime/hhs_pass220_exact_friedmann_transfer_v1.py")
          tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          forbidden_imports = {"time", "datetime", "decimal"}
          forbidden_calls = {
              "float", "pow", "sqrt", "exp",
              "perf_counter", "monotonic", "process_time", "time_ns",
          }
          violations = []

          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split(".")[0] in forbidden_imports:
                          violations.append(f"forbidden import {alias.name} line {node.lineno}")
              elif isinstance(node, ast.ImportFrom):
                  module = (node.module or "").split(".")[0]
                  if module in forbidden_imports:
                      violations.append(f"forbidden import-from {node.module} line {node.lineno}")
                  if module == "math":
                      imported = {alias.name for alias in node.names}
                      if imported != {"isqrt"}:
                          violations.append(
                              f"math import must be exact isqrt only line {node.lineno}: {sorted(imported)}"
                          )
              elif isinstance(node, ast.Call):
                  func = node.func
                  if isinstance(func, ast.Name) and func.id in forbidden_calls:
                      violations.append(f"forbidden call {func.id} line {node.lineno}")
                  elif isinstance(func, ast.Attribute):
                      if func.attr in forbidden_calls or (
                          isinstance(func.value, ast.Name)
                          and func.value.id in {"time", "datetime", "math", "decimal"}
                      ):
                          violations.append(
                              f"forbidden attribute call {ast.unparse(func)} line {node.lineno}"
                          )

          if violations:
              raise SystemExit("\n".join(violations))
          print("HHS_I023_AST_AUTHORITY_SCAN=PASS")
          PY
      - name: Compile exact I023 surface
        run: python -m py_compile hhs_runtime/hhs_pass220_exact_friedmann_transfer_v1.py
      - name: Verify Wolfram receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/pass220/i023_exact_friedmann_transfer_wolfram_20260921_v1.output.json")
          data = json.loads(p.read_text())
          assert data["status"] == "PASS"
          assert data["check_count"] == data["pass_count"] == 9
          assert data["failed"] == []
          assert data["phase_only_log_scale_increment"] == "lambda"
          assert data["phase_only_scale_ratio"] == "E^lambda"
          PY
      - name: Run I023 and inherited I022 exact regressions
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_exact_friedmann_transfer_v1.py
          tests/pass220/test_hhs_pass220_cosmological_clock_cadence_v1.py
