name: Pass 193 I133 Repair Validation

on:
  push:
    branches:
      - agent/pass219-iteration133-pass193-repair-membrane
    paths:
      - 'docs/pass193/HHS_PASS_193_REUSABLE_HYPERSOLID_FRACTAL_MANIFOLD_NATIVE_COMPILATION_AND_SAFE_NFT_EXECUTABLES.md'
      - 'hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py'
      - 'hhs_backend/api/pass193_hypersolid_routes.py'
      - 'hhs_backend/visual_server.py'
      - 'tests/pass192_193/test_pass192_193_contract_invariants.py'
      - 'tests/test_hhs_pass193_hypersolid_native_egress_v1.py'
      - 'tests/test_hhs_pass193_hypersolid_routes.py'
      - 'tests/test_hhs_pass193_native_targets_v1.py'
      - 'tests/test_hhs_pass193_visual_registration.py'
      - '.github/workflows/pass193-i133-repair-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/pass193/HHS_PASS_193_REUSABLE_HYPERSOLID_FRACTAL_MANIFOLD_NATIVE_COMPILATION_AND_SAFE_NFT_EXECUTABLES.md'
      - 'hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py'
      - 'hhs_backend/api/pass193_hypersolid_routes.py'
      - 'hhs_backend/visual_server.py'
      - 'tests/pass192_193/test_pass192_193_contract_invariants.py'
      - 'tests/test_hhs_pass193_hypersolid_native_egress_v1.py'
      - 'tests/test_hhs_pass193_hypersolid_routes.py'
      - 'tests/test_hhs_pass193_native_targets_v1.py'
      - 'tests/test_hhs_pass193_visual_registration.py'
      - '.github/workflows/pass193-i133-repair-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pass193-focused-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'fastapi==0.128.2' \
            'starlette==0.50.0' \
            'pydantic>=2.7,<3.0' \
            'httpx>=0.27,<1.0' \
            'cryptography>=46.0,<47.0'

      - name: Install required native target toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user file

      - name: Prove frozen I132 and Pass 193 authorization lineage
        run: |
          git merge-base --is-ancestor d311cd243845456851518ce1fef026a7d3cac45e HEAD
          test "$(git merge-base d311cd243845456851518ce1fef026a7d3cac45e HEAD)" = "d311cd243845456851518ce1fef026a7d3cac45e"
          git merge-base --is-ancestor c3da7e2b7125754b65f08fb8922a151bf01df2b8 eebc47a52de143df4a9acf807735f576ad0ce844
          test "$(git rev-parse eebc47a52de143df4a9acf807735f576ad0ce844:docs/pass193/HHS_PASS_193_REUSABLE_HYPERSOLID_FRACTAL_MANIFOLD_NATIVE_COMPILATION_AND_SAFE_NFT_EXECUTABLES.md)" = "2452a5d5184bd9275e150b4b4afd840928e723fd"

      - name: Compile focused Pass 193 Python surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py \
            hhs_backend/api/pass193_hypersolid_routes.py \
            hhs_backend/visual_server.py \
            tests/pass192_193/test_pass192_193_contract_invariants.py \
            tests/test_hhs_pass193_hypersolid_native_egress_v1.py \
            tests/test_hhs_pass193_hypersolid_routes.py \
            tests/test_hhs_pass193_native_targets_v1.py \
            tests/test_hhs_pass193_visual_registration.py

      - name: Preserve exact canonical arithmetic boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden_calls = []
          forbidden_imports = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'float':
                  forbidden_calls.append(node.lineno)
              if isinstance(node, ast.Import):
                  forbidden_imports.extend(alias.name for alias in node.names if alias.name == 'math')
              if isinstance(node, ast.ImportFrom) and node.module == 'math':
                  forbidden_imports.append('math')
          assert not forbidden_calls, forbidden_calls
          assert not forbidden_imports, forbidden_imports
          PY

      - name: Prove singleton VM81 admission remains inherited
        run: |
          grep -F 'from hhs_runtime.hhs_pass219_vm81_admission_bridge_v1 import _validated_authorized_tick' \
            hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py
          grep -F 'validated = _validated_authorized_tick(execution)' \
            hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py
          ! grep -Eq 'new_vm81|second_vm81|independent_vm81|vm81_mutation_authority[[:space:]]*=[[:space:]]*True' \
            hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py

      - name: Run inherited Pass 192-193 pre-contract suite
        run: python tests/pass192_193/test_pass192_193_contract_invariants.py -v

      - name: Run Pass 193 runtime, API, and production registration conformance
        run: |
          PYTHONPATH="$PWD" python -m unittest -v \
            tests.test_hhs_pass193_hypersolid_native_egress_v1 \
            tests.test_hhs_pass193_hypersolid_routes \
            tests.test_hhs_pass193_visual_registration

      - name: Validate x86_64 and ARM64 native targets
        env:
          HHS_PASS193_REQUIRE_NATIVE_TARGETS: '1'
        run: |
          PYTHONPATH="$PWD" python -m unittest -v tests.test_hhs_pass193_native_targets_v1

      - name: Record focused evidence
        if: always()
        run: |
          mkdir -p evidence/pass193/i133
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          files = [
              'docs/pass193/HHS_PASS_193_REUSABLE_HYPERSOLID_FRACTAL_MANIFOLD_NATIVE_COMPILATION_AND_SAFE_NFT_EXECUTABLES.md',
              'hhs_backend/runtime/hhs_pass193_hypersolid_native_egress_v1.py',
              'hhs_backend/api/pass193_hypersolid_routes.py',
              'hhs_backend/visual_server.py',
              'tests/test_hhs_pass193_hypersolid_native_egress_v1.py',
              'tests/test_hhs_pass193_hypersolid_routes.py',
              'tests/test_hhs_pass193_native_targets_v1.py',
              'tests/test_hhs_pass193_visual_registration.py',
          ]
          payload = {
              'schema': 'HHS_PASS219_I133_PASS193_FOCUSED_REPAIR_EVIDENCE_V1',
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'frozen_i132': 'd311cd243845456851518ce1fef026a7d3cac45e',
              'pass193_authorization': 'eebc47a52de143df4a9acf807735f576ad0ce844',
              'contract_blob': '2452a5d5184bd9275e150b4b4afd840928e723fd',
              'files': {
                  path: subprocess.check_output(['git', 'hash-object', path], text=True).strip()
                  for path in files
              },
              'native_targets_required': ['linux-x86_64-elf', 'linux-arm64-elf'],
              'production_registration': '/api/runtime/hypersolids',
              'canonical_float_authority': False,
              'vm81_authority': 'INHERITED_SINGLETON',
          }
          Path('evidence/pass193/i133/PASS_193_I133_FOCUSED_REPAIR_EVIDENCE.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass193-i133-focused-repair-evidence
          path: evidence/pass193/i133/PASS_193_I133_FOCUSED_REPAIR_EVIDENCE.json
          if-no-files-found: error
