name: Pass 219 I166 Pass169 Parent Receipt Hardening Once

on:
  push:
    branches:
      - agent/pass219-i166-pass168-terminal-parent-closure
    paths:
      - '.github/workflows/pass219-i166-pass169-parent-receipt-hardening-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass219-i166-pass168-terminal-parent-closure
          fetch-depth: 0
      - name: Harden Pass168 parent receipt verifier
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path=Path('hhs_runtime/pass219/pass169_terminal_reconciliation.py')
          text=path.read_text(encoding='utf-8')
          const_anchor='PASS168_COMPLETION_RECEIPT_PATH = Path("HHS_PASS_168_COMPLETION_RECEIPT.json")\n'
          consts='''PASS168_COMPLETION_RECEIPT_PATH = Path("HHS_PASS_168_COMPLETION_RECEIPT.json")\nPASS168_CONTRACT_ID = "HHS-P168-VM81-5184-HPC-STCF"\nPASS168_TERMINAL_CLASSIFICATION = (\n    "HHS_PASS_168_VM81_5184_CELL_HARMONICODE_PARAMETER_CIRCUIT_AND_"\n    "SPARSE_TENSOR_CONTROL_FABRIC_VERIFIED"\n)\nPASS168_SOURCE_SHA256 = "fdbee5db0f2fea428b6b88e5ac9b273e6aa3754fa00f84e8923456373275166e"\n'''
          if text.count(const_anchor) != 1:
              raise SystemExit('Pass168 constant anchor mismatch')
          text=text.replace(const_anchor,consts,1)

          func_anchor='''def build_i164_pass169_terminal_reconciliation(repo_root: str | Path = ".") -> Dict[str, Any]:\n'''
          helper='''def _pass168_terminal_receipt_valid(receipt: Dict[str, Any]) -> bool:\n    exact_true = (\n        "terminal_verified",\n        "verified",\n        "pass167_inheritance_bound",\n        "single_vm81_commit_authority",\n        "hash72_receipts_verified",\n        "hash216_identity_verified",\n        "deterministic_replay_verified",\n        "rollback_verified",\n        "repair_verified",\n        "x86_64_verified",\n        "arm64_verified",\n        "sanitizers_passed",\n        "cli_complete",\n        "http_complete",\n        "parameter_matrix_verified",\n        "evidence_manifest_verified",\n    )\n    return bool(\n        receipt.get("schema") == "HHS_PASS_168_COMPLETION_RECEIPT_V1"\n        and receipt.get("contract_id") == PASS168_CONTRACT_ID\n        and receipt.get("classification") == PASS168_TERMINAL_CLASSIFICATION\n        and receipt.get("fixed_resolution") == FIXED_RESOLUTION\n        and receipt.get("source_bytes") == 424\n        and receipt.get("source_sha256") == PASS168_SOURCE_SHA256\n        and receipt.get("cells_covered") == 5184\n        and receipt.get("threads_registered") == 64\n        and receipt.get("raw_threads") == 40\n        and receipt.get("derived_threads") == 24\n        and receipt.get("comparators_verified") == 6\n        and all(receipt.get(key) is True for key in exact_true)\n        and receipt.get("floating_point_canonical_authority") is False\n        and receipt.get("fallback_used") is False\n        and receipt.get("manifest_path") == "HHS_PASS_168_EVIDENCE_MANIFEST.json"\n    )\n\n\n'''
          if text.count(func_anchor) != 1:
              raise SystemExit('build function anchor mismatch')
          text=text.replace(func_anchor,helper+func_anchor,1)

          old='''            pass168_receipt = _load_json(pass168_receipt_path)\n            pass168_resolved = bool(\n                pass168_receipt.get("terminal_verified") is True\n                or pass168_receipt.get("verified") is True\n            )\n'''
          new='''            pass168_receipt = _load_json(pass168_receipt_path)\n            pass168_resolved = _pass168_terminal_receipt_valid(pass168_receipt)\n'''
          if text.count(old) != 1:
              raise SystemExit('Pass168 loose receipt verifier anchor mismatch')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          test_path=Path('tests/pass219/test_pass219_i164_pass169_terminal_reconciliation.py')
          test=test_path.read_text(encoding='utf-8')
          import_anchor='''    PASS169_CANONICAL_CORPUS_PATH,\n    build_i164_pass169_terminal_reconciliation,\n'''
          import_new='''    PASS169_CANONICAL_CORPUS_PATH,\n    PASS168_CONTRACT_ID,\n    PASS168_SOURCE_SHA256,\n    PASS168_TERMINAL_CLASSIFICATION,\n    _pass168_terminal_receipt_valid,\n    build_i164_pass169_terminal_reconciliation,\n'''
          if test.count(import_anchor) != 1:
              raise SystemExit('I164 test import anchor mismatch')
          test=test.replace(import_anchor,import_new,1)
          append='''\n\ndef test_i164_pass168_parent_requires_full_structured_terminal_receipt() -> None:\n    assert _pass168_terminal_receipt_valid({"verified": True}) is False\n    receipt = {\n        "schema": "HHS_PASS_168_COMPLETION_RECEIPT_V1",\n        "contract_id": PASS168_CONTRACT_ID,\n        "classification": PASS168_TERMINAL_CLASSIFICATION,\n        "terminal_verified": True,\n        "verified": True,\n        "fixed_resolution": FIXED_RESOLUTION,\n        "source_bytes": 424,\n        "source_sha256": PASS168_SOURCE_SHA256,\n        "pass167_inheritance_bound": True,\n        "cells_covered": 5184,\n        "threads_registered": 64,\n        "raw_threads": 40,\n        "derived_threads": 24,\n        "comparators_verified": 6,\n        "single_vm81_commit_authority": True,\n        "hash72_receipts_verified": True,\n        "hash216_identity_verified": True,\n        "deterministic_replay_verified": True,\n        "rollback_verified": True,\n        "repair_verified": True,\n        "x86_64_verified": True,\n        "arm64_verified": True,\n        "sanitizers_passed": True,\n        "cli_complete": True,\n        "http_complete": True,\n        "parameter_matrix_verified": True,\n        "evidence_manifest_verified": True,\n        "floating_point_canonical_authority": False,\n        "fallback_used": False,\n        "manifest_path": "HHS_PASS_168_EVIDENCE_MANIFEST.json",\n    }\n    assert _pass168_terminal_receipt_valid(receipt) is True\n    for field in (\n        "source_sha256", "single_vm81_commit_authority", "arm64_verified",\n        "parameter_matrix_verified", "evidence_manifest_verified",\n    ):\n        forged = dict(receipt)\n        forged[field] = False if isinstance(receipt[field], bool) else "forged"\n        assert _pass168_terminal_receipt_valid(forged) is False\n'''
          test_path.write_text(test+append,encoding='utf-8')
          PY
          python -m py_compile hhs_runtime/pass219/pass169_terminal_reconciliation.py \
            tests/pass219/test_pass219_i164_pass169_terminal_reconciliation.py
          python - <<'PY'
          from hhs_runtime.pass219.pass169_terminal_reconciliation import _pass168_terminal_receipt_valid
          assert _pass168_terminal_receipt_valid({'verified': True}) is False
          print('Pass168 bare-boolean parent receipt rejected: PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hhs_runtime/pass219/pass169_terminal_reconciliation.py \
                  tests/pass219/test_pass219_i164_pass169_terminal_reconciliation.py
          git commit -m 'Pass 219 I166: harden Pass169 Pass168 parent receipt gate [skip ci]'
          git push origin HEAD:agent/pass219-i166-pass168-terminal-parent-closure
