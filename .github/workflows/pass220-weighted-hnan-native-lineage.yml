name: Pass 220 Weighted HNAN Native Lineage
on:
  pull_request:
    paths:
      - "tests/pass220/test_pass220_weighted_hnan_native_lineage_v1.py"
      - ".github/workflows/pass220-weighted-hnan-native-lineage.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weighted-native-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Check weighted native lineage dependency cone
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --tb=short \
            tests/pass220/test_pass220_weighted_hnan_native_lineage_v1.py \
            tests/pass220/test_pass220_weighted_hnan_residual_constraint_v1.py \
            tests/pass220/test_pass220_complex_p_rational_scaling_v1.py \
            tests/pass220/test_hhs_pass220_hnan_lane5_i074_candidate_binding_v1.py
