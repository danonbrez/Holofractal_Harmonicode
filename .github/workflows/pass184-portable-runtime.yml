name: Pass 184 Portable Runtime Authority

on:
  push:
    branches:
      - main
      - agent/pass184-portable-runtime-service-authority
    paths:
      - "docs/pass184/**"
      - "hhs_runtime/pass184/**"
      - "hhs_backend/api/pass184_runtime_routes.py"
      - "hhs_backend/application_ide_server.py"
      - "applications/runtime_package_studio/**"
      - "deployment/pass184/**"
      - "tests/test_pass184_portable_runtime.py"
      - "scripts/test_pass184_portable_runtime.sh"
      - ".github/workflows/pass184-portable-runtime.yml"
  pull_request:
    paths:
      - "docs/pass184/**"
      - "hhs_runtime/pass184/**"
      - "hhs_backend/api/pass184_runtime_routes.py"
      - "hhs_backend/application_ide_server.py"
      - "applications/runtime_package_studio/**"
      - "deployment/pass184/**"
      - "tests/test_pass184_portable_runtime.py"
      - "scripts/test_pass184_portable_runtime.sh"
      - ".github/workflows/pass184-portable-runtime.yml"

permissions:
  contents: read

jobs:
  portable-runtime-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HHS_DISABLE_C_AUTOBUILD: "1"
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "0.5"
      HHS_PASS174_BOOT_TIMEOUT_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependency-scoped packages
        run: |
          python -m pip install --disable-pip-version-check \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn>=0.30,<1.0' \
            pytest
      - name: Run bounded Pass 184 acceptance
        run: timeout 1200s bash scripts/test_pass184_portable_runtime.sh
      - name: Verify completion receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('evidence/pass184/PASS_184_COMPLETION.json').read_text())
          assert result['classification'] == 'HHS_PASS_184_PORTABLE_HYDRATION_RUNTIME_PACKAGE_AND_SUPERVISED_SERVICE_AUTHORITY_VERIFIED'
          assert all(result['checks'].values())
          assert len(result['receipt_sha256']) == 64
          print(json.dumps({
              'classification': result['classification'],
              'receipt_sha256': result['receipt_sha256'],
          }, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pass184-portable-runtime-evidence
          path: evidence/pass184/PASS_184_COMPLETION.json
          if-no-files-found: error
          retention-days: 30
