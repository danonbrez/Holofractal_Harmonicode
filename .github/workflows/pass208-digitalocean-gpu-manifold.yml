name: Pass 208 DigitalOcean GPU Manifold

on:
  pull_request:
    paths:
      - 'contracts/pass208/**'
      - 'hhs_backend/runtime/hhs_pass208_gpu_branch_manifold_v1.py'
      - 'hhs_backend/api/pass208_gpu_manifold_routes.py'
      - 'deployment/digitalocean/gpu/**'
      - 'tests/test_hhs_pass208_*'
      - '.github/workflows/pass208-digitalocean-gpu-manifold.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/pass208/**'
      - 'hhs_backend/runtime/hhs_pass208_gpu_branch_manifold_v1.py'
      - 'hhs_backend/api/pass208_gpu_manifold_routes.py'
      - 'deployment/digitalocean/gpu/**'
      - 'tests/test_hhs_pass208_*'
      - '.github/workflows/pass208-digitalocean-gpu-manifold.yml'

permissions:
  contents: read

jobs:
  contract-runtime-and-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HHS_PASS208_GPU_ENABLED: '0'
      HHS_PASS207_GPU_BACKEND: CPU_REFERENCE
      HHS_PASS207_REQUIRE_PHYSICAL_GPU: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest jsonschema fastapi pydantic
      - name: Parse Pass 208 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/pass208/PASS_208_CONTRACT.json').read_text())
          assert contract['pass'] == 208
          assert contract['formal_model']['same_kernel_bytecode_hydration_lattice'] is True
          assert contract['authority']['gpu_may_commit_hash72'] is False
          assert contract['json_specification_package']['file_count'] == 23
          PY
      - name: Shell syntax
        run: |
          bash -n \
            deployment/digitalocean/gpu/install.sh \
            deployment/digitalocean/gpu/hhs-gpu-preflight.sh \
            deployment/digitalocean/gpu/post-merge.sh \
            deployment/digitalocean/gpu/validate-candidate.sh
      - name: Python compilation
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass208_gpu_branch_manifold_v1.py \
            hhs_backend/api/pass208_gpu_manifold_routes.py \
            deployment/digitalocean/gpu/validate-json-spec-package.py \
            tests/test_hhs_pass208_gpu_branch_manifold_v1.py \
            tests/test_hhs_pass208_digitalocean_gpu_deployment_v1.py
      - name: Build Pass 205 native continuation ABI
        run: |
          python -c 'from hhs_python.runtime.hhs_pass205_continuation_bridge import build_native_library; print(build_native_library(force=True))'
      - name: Build Pass 207 native GPU ABI
        run: |
          python -c 'from hhs_python.runtime.hhs_pass207_gpu_driver_native import build_native_library; print(build_native_library(force=True))'
      - name: Pass 207 and Pass 208 tests
        run: |
          python -m pytest -q \
            tests/test_hhs_pass207_gpu_driver_v1.py \
            tests/test_hhs_pass208_gpu_branch_manifold_v1.py \
            tests/test_hhs_pass208_digitalocean_gpu_deployment_v1.py
      - name: API route surface
        run: |
          python - <<'PY'
          from hhs_backend.api.pass208_gpu_manifold_routes import router
          paths = {route.path for route in router.routes}
          assert '/api/runtime/gpu-manifold/status' in paths
          assert '/api/runtime/gpu-manifold/expand' in paths
          assert '/api/runtime/gpu-manifold/expand-and-commit' in paths
          PY
