name: VM81 Playable 19-Opcode Platform Game

on:
  push:
    branches:
      - main
      - agent/vm81-game-level10
    paths:
      - native_projects/hhs_vm81_game_level10/**
      - hhs_runtime/include/hhs_hash216.h
      - hhs_runtime/src/hhs_hash216.c
      - .github/workflows/vm81-game-level10.yml
  pull_request:
    paths:
      - native_projects/hhs_vm81_game_level10/**
      - .github/workflows/vm81-game-level10.yml

permissions:
  contents: read

jobs:
  vm81-playable-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Compile and execute core and playable release verification
        shell: bash
        run: |
          mkdir -p native_projects/hhs_vm81_game_level10/dist
          set +e
          make -C native_projects/hhs_vm81_game_level10 test > native_projects/hhs_vm81_game_level10/dist/hosted-test.log 2>&1
          code=$?
          cat native_projects/hhs_vm81_game_level10/dist/hosted-test.log
          exit "$code"
      - name: Execute ASAN and UBSAN verification
        shell: bash
        run: |
          set +e
          make -C native_projects/hhs_vm81_game_level10 sanitize > native_projects/hhs_vm81_game_level10/dist/hosted-sanitize.log 2>&1
          code=$?
          cat native_projects/hhs_vm81_game_level10/dist/hosted-sanitize.log
          exit "$code"
      - name: Assert core and release evidence
        run: |
          test -x native_projects/hhs_vm81_game_level10/dist/hhs-vm81-game
          test -x native_projects/hhs_vm81_game_level10/dist/test-hhs-vm81-game
          test -x native_projects/hhs_vm81_game_level10/dist/hhs-vm81-platformer
          test -x native_projects/hhs_vm81_game_level10/dist/test-hhs-vm81-game-release
          native_projects/hhs_vm81_game_level10/dist/hhs-vm81-platformer --help
          test -s native_projects/hhs_vm81_game_level10/dist/verification.json
          test -s native_projects/hhs_vm81_game_level10/dist/playable-verification.json
          grep -q '"opcode_coverage": "19/19"' native_projects/hhs_vm81_game_level10/dist/verification.json
          grep -q '"replay": "MATCH"' native_projects/hhs_vm81_game_level10/dist/verification.json
          grep -q 'VM81_C_ABI_19_OPCODE_2D_PLATFORM_DEMO_VERIFIED' native_projects/hhs_vm81_game_level10/dist/verification.json
          grep -q '"phase": "VICTORY"' native_projects/hhs_vm81_game_level10/dist/playable-verification.json
          grep -q '"opcode_coverage": "19/19"' native_projects/hhs_vm81_game_level10/dist/playable-verification.json
          grep -q '"checkpoints_reached": 2' native_projects/hhs_vm81_game_level10/dist/playable-verification.json
          grep -q '"replay": "MATCH"' native_projects/hhs_vm81_game_level10/dist/playable-verification.json
          grep -q 'VM81_PLAYABLE_GAME_RELEASE_VERIFIED' native_projects/hhs_vm81_game_level10/dist/playable-verification.json
      - name: Upload playable game and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm81-playable-game-release
          path: |
            native_projects/hhs_vm81_game_level10/dist/hhs-vm81-platformer
            native_projects/hhs_vm81_game_level10/dist/hhs-vm81-game
            native_projects/hhs_vm81_game_level10/dist/verification.json
            native_projects/hhs_vm81_game_level10/dist/playable-verification.json
            native_projects/hhs_vm81_game_level10/dist/hosted-test.log
            native_projects/hhs_vm81_game_level10/dist/hosted-sanitize.log
            native_projects/hhs_vm81_game_level10/specs/HHS_VM81_GAME_LEVEL10_CONTRACT.json
            native_projects/hhs_vm81_game_level10/specs/HHS_VM81_PLAYABLE_GAME_RELEASE_CONTRACT.json
          if-no-files-found: warn
