name: Pass 219 Acquisition Job Service v1

on:
  pull_request:
    paths:
      - 'hhs_backend/pass219_acquisition_job_service.py'
      - 'hhs_backend/api/pass219_acquisition_routes.py'
      - 'hhs_backend/pass174_server.py'
      - 'hhs_gui/runtime_os/workspace/OpenSourceAcquisitionPanel.tsx'
      - 'hhs_gui/runtime_os/workspace/ProductionMobileControlCenter.tsx'
      - 'hhs_gui/scripts/pass219-acquisition-job-ui-source-verify.mjs'
      - 'tests/pass219/test_hhs_pass219_acquisition_job_service_v1.py'
      - 'contracts/pass219/PASS_219_ACQUISITION_JOB_SERVICE_V1.md'
      - '.github/workflows/pass219-acquisition-job-service-v1.yml'
  push:
    branches: [main]
    paths:
      - 'hhs_backend/pass219_acquisition_job_service.py'
      - 'hhs_backend/api/pass219_acquisition_routes.py'
      - 'hhs_backend/pass174_server.py'
      - 'hhs_gui/runtime_os/workspace/OpenSourceAcquisitionPanel.tsx'
      - 'hhs_gui/runtime_os/workspace/ProductionMobileControlCenter.tsx'
      - 'hhs_gui/scripts/pass219-acquisition-job-ui-source-verify.mjs'
      - 'tests/pass219/test_hhs_pass219_acquisition_job_service_v1.py'
      - 'contracts/pass219/PASS_219_ACQUISITION_JOB_SERVICE_V1.md'
      - '.github/workflows/pass219-acquisition-job-service-v1.yml'

permissions:
  contents: read

jobs:
  acquisition-job-service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hhs_gui/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi pydantic
      - name: Compile bounded application-service surfaces
        run: |
          python -m py_compile hhs_backend/pass219_acquisition_job_service.py
          python -m py_compile hhs_backend/api/pass219_acquisition_routes.py
          python -m py_compile hhs_backend/pass174_server.py
          python -m py_compile tests/pass219/test_hhs_pass219_acquisition_job_service_v1.py
      - name: Run persistent acquisition and replay tests
        run: pytest -q tests/pass219/test_hhs_pass219_acquisition_job_service_v1.py
      - name: Verify production source wiring
        run: node hhs_gui/scripts/pass219-acquisition-job-ui-source-verify.mjs
      - name: Install Runtime OS dependencies
        working-directory: hhs_gui
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build mobile production surface
        working-directory: hhs_gui
        run: npm run build:strict
