name: Pass 166 Validation Relay

on:
  push:
    branches:
      - 'agent/pass166-validation-run'
    paths:
      - 'hhs_runtime/pass166/**'
      - 'hhs_backend/api/pass166_word2vec_routes.py'
      - 'hhs_backend/pass166_server.py'
      - 'native_projects/hhs_pass166_word2vec/**'
      - 'tests/test_hhs_pass166_word2vec_v1.py'
      - 'tests/test_hhs_pass166_supply_chain_v1.py'
      - 'tools/hhs_model.py'
      - 'tools/pass166_terminal_evidence.py'
      - 'HHS_PASS_166_AUTHORITY_BINDING.json'
      - 'HHS_PASS_166_IMPLEMENTATION_STATUS.md'
      - 'docs/HHS_PASS_166_WORD2VEC_RUNTIME.md'

permissions:
  contents: write

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      HHS_PASS166_STORAGE_DIR: '${{ runner.temp }}/hhs-pass166-default'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi pydantic httpx
      - name: Execute Pass 166 Python matrix
        id: python_matrix
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_hhs_pass166_word2vec_v1.py \
            tests/test_hhs_pass166_supply_chain_v1.py \
            > "$RUNNER_TEMP/pass166-python.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pass166-python.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Execute strict C11 Pass 166
        id: native_matrix
        shell: bash
        run: |
          set +e
          make -C native_projects/hhs_pass166_word2vec clean test \
            > "$RUNNER_TEMP/pass166-c11.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pass166-c11.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Execute terminal evidence harness
        id: terminal_harness
        shell: bash
        run: |
          set +e
          python tools/pass166_terminal_evidence.py \
            --output "$RUNNER_TEMP/P166_TERMINAL_EXECUTION.json" \
            > "$RUNNER_TEMP/pass166-terminal.txt" 2>&1
          status=$?
          cat "$RUNNER_TEMP/pass166-terminal.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Write machine-readable validation evidence
        env:
          PYTHON_STATUS: ${{ steps.python_matrix.outputs.status }}
          NATIVE_STATUS: ${{ steps.native_matrix.outputs.status }}
          TERMINAL_STATUS: ${{ steps.terminal_harness.outputs.status }}
        run: |
          mkdir -p evidence/pass166
          cp "$RUNNER_TEMP/pass166-python.txt" evidence/pass166/relay_python_output.txt
          cp "$RUNNER_TEMP/pass166-c11.txt" evidence/pass166/relay_c11_output.txt
          cp "$RUNNER_TEMP/pass166-terminal.txt" evidence/pass166/relay_terminal_output.txt
          if [[ -f "$RUNNER_TEMP/P166_TERMINAL_EXECUTION.json" ]]; then
            cp "$RUNNER_TEMP/P166_TERMINAL_EXECUTION.json" evidence/pass166/P166_TERMINAL_EXECUTION.json
          fi
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import re

          def read(path: str) -> bytes:
              return Path(path).read_bytes()

          python_raw = read('evidence/pass166/relay_python_output.txt')
          c11_raw = read('evidence/pass166/relay_c11_output.txt')
          terminal_raw = read('evidence/pass166/relay_terminal_output.txt')
          match = re.search(rb'(\d+) passed', python_raw)
          terminal_path = Path('evidence/pass166/P166_TERMINAL_EXECUTION.json')
          terminal = json.loads(terminal_path.read_text('utf-8')) if terminal_path.exists() else None
          statuses = {
              'python': int(os.environ['PYTHON_STATUS']),
              'native_c11': int(os.environ['NATIVE_STATUS']),
              'terminal_harness': int(os.environ['TERMINAL_STATUS']),
          }
          passed = all(value == 0 for value in statuses.values())
          report = {
              'schema': 'HHS_PASS_166_RELAY_VALIDATION_V1',
              'contract_id': 'HHS-P166-W2V-LMVS-MAIS',
              'tested_commit': os.environ['GITHUB_SHA'],
              'runner_os': os.environ.get('RUNNER_OS'),
              'python_version': '3.12',
              'statuses': statuses,
              'python_tests_passed': int(match.group(1)) if match else 0,
              'python_output_sha256': sha256(python_raw).hexdigest(),
              'native_output_sha256': sha256(c11_raw).hexdigest(),
              'terminal_output_sha256': sha256(terminal_raw).hexdigest(),
              'terminal_execution_evidence_sha256': terminal.get('evidence_sha256') if terminal else None,
              'terminal_classification': terminal.get('classification') if terminal else None,
              'validation_failures': sum(value != 0 for value in statuses.values()),
              'classification': 'HHS_PASS_166_RELAY_VALIDATION_PASS' if passed else 'HHS_PASS_166_RELAY_VALIDATION_FAILED',
              'validated': passed,
          }
          Path('evidence/pass166/P166_RELAY_VALIDATION.json').write_text(
              json.dumps(report, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit validation evidence to branch
        run: |
          git config user.name 'hhs-validation-relay[bot]'
          git config user.email 'hhs-validation-relay[bot]@users.noreply.github.com'
          git add evidence/pass166/P166_RELAY_VALIDATION.json \
            evidence/pass166/relay_python_output.txt \
            evidence/pass166/relay_c11_output.txt \
            evidence/pass166/relay_terminal_output.txt
          if [[ -f evidence/pass166/P166_TERMINAL_EXECUTION.json ]]; then
            git add evidence/pass166/P166_TERMINAL_EXECUTION.json
          fi
          git commit -m 'Record Pass 166 relay validation'
          git push origin HEAD:${{ github.ref_name }}
      - name: Enforce validation result
        env:
          PYTHON_STATUS: ${{ steps.python_matrix.outputs.status }}
          NATIVE_STATUS: ${{ steps.native_matrix.outputs.status }}
          TERMINAL_STATUS: ${{ steps.terminal_harness.outputs.status }}
        run: |
          test "$PYTHON_STATUS" -eq 0
          test "$NATIVE_STATUS" -eq 0
          test "$TERMINAL_STATUS" -eq 0
