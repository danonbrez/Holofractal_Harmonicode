name: Pass 219 Ordered Constraint Wolfram Formalization

on:
  push:
    paths:
      - 'contracts/pass219/PASS_219_ORDERED_CONSTRAINT_WOLFRAM_FORMALIZATION_1_0.harmonicode'
      - 'formal/wolfram/pass219_ordered_constraint_formalization_1_0.wl'
      - 'contracts/pass219/PASS_219_ORDERED_CONSTRAINT_WOLFRAM_FORMALIZATION_1_0.json'
      - 'tests/pass219/test_pass219_ordered_constraint_wolfram_formalization.py'
      - 'docs/operations/restart/PASS_219_ORDERED_CONSTRAINT_WOLFRAM_FORMALIZATION_RESTART_20260925.md'
      - '.github/workflows/pass219-ordered-constraint-wolfram-formalization.yml'
  pull_request:
    paths:
      - 'contracts/pass219/PASS_219_ORDERED_CONSTRAINT_WOLFRAM_FORMALIZATION_1_0.harmonicode'
      - 'formal/wolfram/pass219_ordered_constraint_formalization_1_0.wl'
      - 'contracts/pass219/PASS_219_ORDERED_CONSTRAINT_WOLFRAM_FORMALIZATION_1_0.json'
      - 'tests/pass219/test_pass219_ordered_constraint_wolfram_formalization.py'
      - 'docs/operations/restart/PASS_219_ORDERED_CONSTRAINT_WOLFRAM_FORMALIZATION_RESTART_20260925.md'
      - '.github/workflows/pass219-ordered-constraint-wolfram-formalization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ordered-constraint-formal-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile focused repository proof test
        run: python -m py_compile tests/pass219/test_pass219_ordered_constraint_wolfram_formalization.py
      - name: Verify exact source, Wolfram receipt, and ordered topology
        run: PYTHONPATH="$PWD" python -m pytest -q tests/pass219/test_pass219_ordered_constraint_wolfram_formalization.py
