name: Pass 220 Whitepaper Proof Dependency Binding
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_whitepaper_proof_dependency_binding_v1.py"
      - "tests/pass220/test_pass220_whitepaper_proof_dependency_binding_v1.py"
      - ".github/workflows/pass220-whitepaper-proof-dependency-binding.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify source-complete proof dependencies and fail-closed candidate receipts
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_whitepaper_proof_dependency_binding_v1.py
