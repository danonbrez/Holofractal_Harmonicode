name: Pass 219 I141 Pass 185 Phase 5 Performance Negative Acceptance

on:
  push:
    branches:
      - agent/pass219-iteration141-pass185-production-browser-closure-reconciliation
    paths:
      - 'hhs_backend/production_server.py'
      - 'hhs_backend/api/runtime_routes.py'
      - 'hhs_gui/index.html'
      - 'hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx'
      - 'hhs_gui/runtime_os/workspace/Pass185ApplicationLifecyclePanel.tsx'
      - 'hhs_gui/runtime_os/workspace/Pass185MultimodalLifecyclePanel.tsx'
      - 'hhs_gui/runtime_os/core/RuntimeSocketManager.ts'
      - 'hhs_verification/pass185/phase5_performance_negative_acceptance.py'
      - 'tests/test_runtime_os_production_root.py'
      - 'docs/pass185/HHS_PASS_185_I141_PHASE5_PERFORMANCE_NEGATIVE_ACCEPTANCE.md'
      - 'docs/operations/restart/PASS_219_I141_PASS185_PRODUCTION_BROWSER_CLOSURE_RESTART.md'
      - '.github/workflows/pass219-i141-pass185-phase5-performance-negative.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i141-pass185-phase5-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase5-performance-negative:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      HHS_COGNITION_AUTO_TICK: '0'
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: '0.25'
      HHS_PASS185_PHASE5_EVIDENCE: '/tmp/pass185-phase5'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped runtime packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'cryptography>=46.0,<47.0' \
            requests \
            pytest \
            playwright

      - name: Prove inherited compiled C runtime
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so
          sha256sum hhs_runtime/builds/libhhs_runtime.so | tee /tmp/pass185-phase5-c-runtime.sha256

      - name: Typecheck and build exact Runtime OS public root
        working-directory: hhs_gui
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.html
          test -d dist/assets

      - name: Validate Phase-5 source contract
        run: |
          python -m py_compile hhs_verification/pass185/phase5_performance_negative_acceptance.py
          grep -Fq 'HEALTH_P95_GATE_MS = 250.0' hhs_verification/pass185/phase5_performance_negative_acceptance.py
          grep -Fq 'EVENT_LOOP_YIELD_GATE_MS = 100.0' hhs_verification/pass185/phase5_performance_negative_acceptance.py
          grep -Fq 'HHS_COGNITION_AUTO_TICK' hhs_verification/pass185/phase5_performance_negative_acceptance.py
          grep -Fq 'timing_and_resource_values_are_noncanonical_evidence' hhs_verification/pass185/phase5_performance_negative_acceptance.py
          grep -Fq 'frontend_runtime_authority' hhs_verification/pass185/phase5_performance_negative_acceptance.py
          grep -Fq 'production_inherited_runtime_authority_status' hhs_backend/production_server.py
          grep -Fq 'test_pass185_production_runtime_authority_route_wins_first_match' tests/test_runtime_os_production_root.py
          grep -Eq 'HHS_PASS_185_PHASE5_PERFORMANCE_NEGATIVE_(IMPLEMENTED_PENDING_VALIDATION|VERIFIED)' \
            docs/pass185/HHS_PASS_185_I141_PHASE5_PERFORMANCE_NEGATIVE_ACCEPTANCE.md

      - name: Install bounded Chromium
        run: timeout 600s python -m playwright install --with-deps chromium

      - name: Run Phase-5 production performance and negative acceptance
        run: |
          mkdir -p "$HHS_PASS185_PHASE5_EVIDENCE"
          timeout 720s python -m hhs_verification.pass185.phase5_performance_negative_acceptance \
            --evidence-dir "$HHS_PASS185_PHASE5_EVIDENCE"

      - name: Retain impacted production-root and workspace regressions
        run: |
          timeout 240s pytest -q \
            tests/test_hhs_pass174_heroku_boot_resilience_v1.py \
            tests/test_runtime_os_production_root.py \
            tests/test_hhs_workspace_multimodal_ingress_gui_pass049_v1.py

      - name: Seal Phase-5 evidence
        if: always()
        run: |
          mkdir -p "$HHS_PASS185_PHASE5_EVIDENCE"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('/tmp/pass185-phase5')
          payload = {
              'schema': 'HHS_PASS219_I141_PASS185_PHASE5_VALIDATION_SEAL_V1',
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'authoritative_main_base': 'f8aa3337ee023c7d828343eac208987c20a05e67',
              'phase4_validated_head': '6721a7daa5ac9bff087e3f2df92ca8e0212e126b',
              'pass185_contract_commit': 'f260f2b013072a48399d9cdc207d0a76a6c63d2f',
              'classification': 'HHS_PASS_185_PHASE5_PERFORMANCE_NEGATIVE_EXECUTED',
              'terminal_pass185_completion_claimed': False,
              'evidence': {},
              'source_blobs': {},
          }
          for path in [
              'hhs_backend/production_server.py',
              'hhs_backend/api/runtime_routes.py',
              'hhs_gui/index.html',
              'hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx',
              'hhs_gui/runtime_os/workspace/Pass185ApplicationLifecyclePanel.tsx',
              'hhs_gui/runtime_os/workspace/Pass185MultimodalLifecyclePanel.tsx',
              'hhs_gui/runtime_os/core/RuntimeSocketManager.ts',
              'hhs_verification/pass185/phase5_performance_negative_acceptance.py',
              'tests/test_runtime_os_production_root.py',
              'docs/pass185/HHS_PASS_185_I141_PHASE5_PERFORMANCE_NEGATIVE_ACCEPTANCE.md',
          ]:
              payload['source_blobs'][path] = subprocess.check_output(
                  ['git', 'hash-object', path], text=True
              ).strip()
          for evidence in sorted(root.glob('**/*.json')):
              data = json.loads(evidence.read_text())
              payload['evidence'][evidence.name] = {
                  'ok': data.get('ok'),
                  'classification': data.get('classification'),
                  'path': str(evidence.relative_to(root)),
                  'sha256': hashlib.sha256(evidence.read_bytes()).hexdigest(),
              }
          encoded = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(encoded).hexdigest()
          (root / 'i141-phase5-seal.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i141-pass185-phase5-performance-negative
          path: |
            /tmp/pass185-phase5/**
            /tmp/pass185-phase5-c-runtime.sha256
          if-no-files-found: warn
          retention-days: 30
