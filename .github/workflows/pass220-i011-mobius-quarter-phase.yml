name: Pass 220 I011 Möbius Quarter Phase

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_mobius_quarter_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_mobius_quarter_phase_v1.py"
      - "docs/pass220/PASS_220_I011_MOBIUS_QUARTER_PHASE_HARMONIC_CLOSURE.md"
      - ".github/workflows/pass220-i011-mobius-quarter-phase.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_mobius_quarter_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_mobius_quarter_phase_v1.py"
      - "docs/pass220/PASS_220_I011_MOBIUS_QUARTER_PHASE_HARMONIC_CLOSURE.md"
      - ".github/workflows/pass220-i011-mobius-quarter-phase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run exact I011 witness tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/pass220/test_hhs_pass220_mobius_quarter_phase_v1.py
