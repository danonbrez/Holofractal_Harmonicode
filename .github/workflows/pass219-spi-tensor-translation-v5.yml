name: Pass 219 SPI Tensor Translation v5

on:
  push:
    branches:
      - 'agent/pass219-spi-scalar-projection-registry-v1-*'
    paths:
      - 'hhs_spi_equal_sum_tensor_translation_rule_v1.py'
      - 'hhs_spi_equal_sum_tensor_translation_rule_v2.py'
      - 'hhs_spi_equal_sum_tensor_translation_rule_tests_v1.py'
      - 'hhs_spi_equal_sum_tensor_translation_rule_tests_v2.py'
      - 'hhs_spi_fibonacci_pythagorean_scaling_rule_v1.py'
      - 'hhs_spi_fibonacci_pythagorean_scaling_rule_tests_v1.py'
      - 'hhs_spi_tensor_pair_cubic_normalization_rule_v1.py'
      - 'hhs_spi_tensor_pair_cubic_normalization_rule_tests_v1.py'
      - 'hhs_spi_tensor_pair_translation_stack_v1.py'
      - 'hhs_spi_tensor_pair_translation_stack_tests_v1.py'
      - 'hhs_spi_scalar_projection_registry_v5.py'
      - 'hhs_spi_scalar_projection_registry_tests_v5.py'
      - 'contracts/pass219/PASS_219_SPI_EQUAL_SUM_FIBONACCI_CUBIC_TENSOR_TRANSLATION_V1.md'
      - '.github/workflows/pass219-spi-tensor-translation-v5.yml'
  pull_request:
    paths:
      - 'hhs_spi_equal_sum_tensor_translation_rule_v1.py'
      - 'hhs_spi_equal_sum_tensor_translation_rule_v2.py'
      - 'hhs_spi_equal_sum_tensor_translation_rule_tests_v1.py'
      - 'hhs_spi_equal_sum_tensor_translation_rule_tests_v2.py'
      - 'hhs_spi_fibonacci_pythagorean_scaling_rule_v1.py'
      - 'hhs_spi_fibonacci_pythagorean_scaling_rule_tests_v1.py'
      - 'hhs_spi_tensor_pair_cubic_normalization_rule_v1.py'
      - 'hhs_spi_tensor_pair_cubic_normalization_rule_tests_v1.py'
      - 'hhs_spi_tensor_pair_translation_stack_v1.py'
      - 'hhs_spi_tensor_pair_translation_stack_tests_v1.py'
      - 'hhs_spi_scalar_projection_registry_v5.py'
      - 'hhs_spi_scalar_projection_registry_tests_v5.py'
      - 'contracts/pass219/PASS_219_SPI_EQUAL_SUM_FIBONACCI_CUBIC_TENSOR_TRANSLATION_V1.md'
      - '.github/workflows/pass219-spi-tensor-translation-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-tensor-translation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile tensor translation projection stack
        run: |
          python -m py_compile \
            hhs_spi_equal_sum_tensor_translation_rule_v1.py \
            hhs_spi_equal_sum_tensor_translation_rule_v2.py \
            hhs_spi_equal_sum_tensor_translation_rule_tests_v1.py \
            hhs_spi_equal_sum_tensor_translation_rule_tests_v2.py \
            hhs_spi_fibonacci_pythagorean_scaling_rule_v1.py \
            hhs_spi_fibonacci_pythagorean_scaling_rule_tests_v1.py \
            hhs_spi_tensor_pair_cubic_normalization_rule_v1.py \
            hhs_spi_tensor_pair_cubic_normalization_rule_tests_v1.py \
            hhs_spi_tensor_pair_translation_stack_v1.py \
            hhs_spi_tensor_pair_translation_stack_tests_v1.py \
            hhs_spi_scalar_projection_registry_v5.py \
            hhs_spi_scalar_projection_registry_tests_v5.py

      - name: Run equal-sum tensor translation tests v1
        run: python hhs_spi_equal_sum_tensor_translation_rule_tests_v1.py

      - name: Run full Sudoku equal-sum translation tests v2
        run: python hhs_spi_equal_sum_tensor_translation_rule_tests_v2.py

      - name: Run Fibonacci Pythagorean Golden scaling tests
        run: python hhs_spi_fibonacci_pythagorean_scaling_rule_tests_v1.py

      - name: Run tensor-pair cubic three-set tests
        run: python hhs_spi_tensor_pair_cubic_normalization_rule_tests_v1.py

      - name: Run composite tensor translation stack tests
        run: python hhs_spi_tensor_pair_translation_stack_tests_v1.py

      - name: Validate registry v5
        run: |
          python hhs_spi_scalar_projection_registry_v5.py --validate
          python hhs_spi_scalar_projection_registry_tests_v5.py

      - name: Regress Law-of-1 hierarchy v4
        run: |
          python hhs_spi_law_of_one_projection_rule_tests_v1.py
          python hhs_spi_scalar_projection_registry_v4.py --validate
          python hhs_spi_scalar_projection_registry_tests_v4.py

      - name: Regress O2 matrix tensor projection v2
        run: |
          python hhs_spi_defined_scalar_projection_rule_tests_v1.py
          python hhs_spi_symmetric_unit_product_projection_rule_tests_v1.py
          python hhs_spi_ordered_matrix_projection_witness_v1.py --validate
          python hhs_spi_ordered_matrix_projection_witness_tests_v1.py
          python hhs_spi_ordered_matrix_projection_witness_v2.py --validate
          python hhs_spi_ordered_matrix_projection_witness_tests_v2.py
          python hhs_spi_scalar_projection_registry_v2.py --validate
          python hhs_spi_scalar_projection_registry_tests_v2.py

      - name: Regress frozen SPI and corpus evidence
        run: |
          python hhs_spi_scalar_projection_registry_tests_v1.py
          python hhs_spi_scalar_projection_corpus_reconciliation_v2.py --validate
          python hhs_spi_scalar_projection_corpus_reconciliation_tests_v2.py
          python - <<'PY'
          from pathlib import Path
          from hhs_spi_scalar_projection_corpus_reconciliation_v2 import reconciliation_manifest_v2
          data = reconciliation_manifest_v2(Path('.'))
          assert data['resolved_candidate_counts'] == {
              'MISSING_PROJECTION': 0,
              'PROVEN': 429,
              'SYMBOLIC': 43,
              'UNSUPPORTED_DOMAIN': 0,
          }
          assert data['manifest_sha256'] == '481c0bb0264ad0771344ae068624dcfd7c9c5ba853a8c7963ad9a22971389aee'
          assert data['scalar_value_complete'] is False
          print(data['manifest_sha256'])
          PY

      - name: Emit deterministic tensor translation evidence
        run: |
          mkdir -p /tmp/pass219_spi_tensor_translation
          python - <<'PY' > /tmp/pass219_spi_tensor_translation/lo_shu_stack_v1.json
          import json
          from hhs_spi_tensor_pair_translation_stack_v1 import lo_shu_translation_stack
          print(json.dumps(lo_shu_translation_stack(4), indent=2, sort_keys=True, ensure_ascii=False))
          PY
          python - <<'PY' > /tmp/pass219_spi_tensor_translation/sudoku_stack_v1.json
          import json
          from hhs_spi_tensor_pair_translation_stack_v1 import sudoku_translation_stack
          print(json.dumps(sudoku_translation_stack(4), indent=2, sort_keys=True, ensure_ascii=False))
          PY
          python hhs_spi_scalar_projection_registry_v5.py --manifest > /tmp/pass219_spi_tensor_translation/spi_registry_v5.json
          python - <<'PY'
          import json
          from pathlib import Path
          lo = json.loads(Path('/tmp/pass219_spi_tensor_translation/lo_shu_stack_v1.json').read_text(encoding='utf-8'))
          su = json.loads(Path('/tmp/pass219_spi_tensor_translation/sudoku_stack_v1.json').read_text(encoding='utf-8'))
          reg = json.loads(Path('/tmp/pass219_spi_tensor_translation/spi_registry_v5.json').read_text(encoding='utf-8'))
          assert lo['cubic_three_set_layer']['relation'] == 't³=t+a²'
          assert su['equal_sum_layer']['equation_count'] == 27
          assert reg['validation']['ok'] is True
          assert reg['validation']['tensor_pair_three_set'] == 't³=t+a²'
          assert reg['authority_boundary']['native_t_solved'] is False
          print(json.dumps({
              'lo_shu_stack_receipt_sha256': lo['receipt_sha256'],
              'sudoku_stack_receipt_sha256': su['receipt_sha256'],
              'registry_v5_manifest_sha256': reg['manifest_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload tensor translation evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass219-spi-tensor-translation-v5
          path: /tmp/pass219_spi_tensor_translation
          if-no-files-found: error
