# Include inside the existing DigitalOcean HTTPS server block.
# Native DNS gate upstreams are resolved from the host-local hhs.internal zone.
location = /pass189/i4 { return 308 /pass189/i4/; }
location /pass189/i4/ {
    proxy_pass http://pass189-provenance.hhs.internal:8192/pass189/i4/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}
location /api/pass189/i4/ {
    proxy_pass http://pass189-provenance.hhs.internal:8192/api/pass189/i4/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
location = /ws/pass189/i4 {
    proxy_pass http://pass189-provenance.hhs.internal:8192/ws/pass189/i4;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location = /pass189/i3 { return 308 /pass189/i3/; }
location /pass189/i3/ {
    proxy_pass http://pass189-adapter.hhs.internal:8191/pass189/i3/;
