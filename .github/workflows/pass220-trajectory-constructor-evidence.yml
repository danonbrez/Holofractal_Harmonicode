name: Pass 220 Trajectory Constructor Evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/pass220/lane5_trajectory_constructor_evidence.py'
      - 'tests/pass220/test_lane5_trajectory_constructor_evidence.py'
      - '.github/workflows/pass220-trajectory-constructor-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/pass220/test_lane5_trajectory_relations.py tests/pass220/test_lane5_trajectory_constructor_evidence.py
