name: Pass 219 Lane 5 BigInt Nested Transcription 1.52

on:
  push:
    branches:
      - pass219/lane5-bigint-nested-transcription-1-52
    paths:
      - 'hhs_runtime/harmonicode_lane5_bigint_transcription_v1.py'
      - 'tests/pass219/test_harmonicode_lane5_bigint_transcription_v1.py'
      - 'contracts/pass219/PASS_219_LANE5_BIGINT_NESTED_TRANSCRIPTION_1_52.md'
      - 'docs/whitepapers/HHS_LANE5_BIGINT_NESTED_TRANSCRIPTION_1_52_V1.md'
      - 'docs/HARMONICODE_SPEC_v1.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'evidence/pass219/hhs_lane5_bigint_nested_transcription_v1.wl'
      - 'evidence/pass219/hhs_lane5_bigint_nested_transcription_v1.output.json'
      - 'evidence/pass219/hhs_lane5_bigint_nested_transcription_v1.receipt.json'
      - '.github/workflows/pass219-lane5-bigint-nested-transcription-1-52.yml'
  pull_request:
    branches:
      - pass219/lane5-directed-constraint-semantics-1-51
    paths:
      - 'hhs_runtime/harmonicode_lane5_bigint_transcription_v1.py'
      - 'tests/pass219/test_harmonicode_lane5_bigint_transcription_v1.py'
      - 'contracts/pass219/PASS_219_LANE5_BIGINT_NESTED_TRANSCRIPTION_1_52.md'
      - 'docs/whitepapers/HHS_LANE5_BIGINT_NESTED_TRANSCRIPTION_1_52_V1.md'
      - 'docs/HARMONICODE_SPEC_v1.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'evidence/pass219/hhs_lane5_bigint_nested_transcription_v1.wl'
      - 'evidence/pass219/hhs_lane5_bigint_nested_transcription_v1.output.json'
      - 'evidence/pass219/hhs_lane5_bigint_nested_transcription_v1.receipt.json'
      - '.github/workflows/pass219-lane5-bigint-nested-transcription-1-52.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bigint-nested-transcription:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped tools
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify repaired 1.51 ancestry
        run: git merge-base --is-ancestor 1b2e7d218af6d8316f10e051e4e67cd2d52c6984 HEAD

      - name: Run dependency-scoped exact tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/pass219/test_harmonicode_lane5_bigint_transcription_v1.py \
            tests/pass220/test_hhs_pass220_rna_hash72_dna_qudit_phase_lock_v1.py \
            tests/pass219/test_harmonicode_directed_constraint_semantics_v1.py
          python -m hhs_runtime.harmonicode_lane5_bigint_transcription_v1 > /tmp/hhs-lane5-1-52.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/hhs-lane5-1-52.json'))
          assert d['result']=='PASS'
          assert d['check_count']==18
          assert all(d['checks'].values())
          assert d['ingress_egress_same_operation'] is True
          assert d['nested_payloads_remain_typed'] is True
          PY

      - name: Verify sealed Wolfram witness
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          receipt=json.loads(Path('evidence/pass219/hhs_lane5_bigint_nested_transcription_v1.receipt.json').read_text())
          for kind in ('source','output'):
              path=Path(receipt[f'{kind}_path'])
              raw=path.read_bytes()
              assert len(raw)==receipt[f'{kind}_bytes']
              assert sha256(raw).hexdigest()==receipt[f'{kind}_sha256']
          output=json.loads(Path(receipt['output_path']).read_text())
          assert receipt['result']=='PASS'
          assert receipt['checks_passed']==receipt['checks_total']==15
          assert output['status']=='PASS'
          assert all(output['checks'].values())
          assert output['geometry']['serialized_positions']==5184
          assert output['h36']['normalization']==111
          assert output['ingress_egress_same_operator'] is True
          assert output['checks']['shared_global_denominator'] is True
          PY

      - name: Seal 1.52 summary
        run: |
          mkdir -p artifacts/pass219/1.52
          cp /tmp/hhs-lane5-1-52.json artifacts/pass219/1.52/runtime-validation.json
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          summary={
            'schema':'HHS_PASS219_LANE5_BIGINT_NESTED_TRANSCRIPTION_EVIDENCE_1_52',
            'result':'PASS',
            'single_transcription_operation':True,
            'fixed_width_characters':5184,
            'g123_h36_geometry_bound':True,
            'ordered_tensor_positions':144,
            'h36_states':36,
            'shared_global_denominator':True,
            'nested_payloads_remain_typed':True,
            'wolfram_checks':15,
            'candidate_only':True,
            'canonical_vm81_mutation_authority':False,
            'canonical_hash72_authority':False,
            'canonical_hash216_authority':False,
            'source_complete_formalization_status':'IN_PROGRESS',
          }
          canonical=json.dumps(summary,sort_keys=True,separators=(',',':')).encode()
          summary['receipt_sha256']=sha256(canonical).hexdigest()
          Path('artifacts/pass219/1.52/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pass219-lane5-bigint-nested-transcription-1-52
          path: artifacts/pass219/1.52/
          if-no-files-found: error
