<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="HHS Visual Runtime OS: canonical project, language, multimodal, runtime, graph, receipt, and assistant workspace" />
  <meta name="hhs-build-contract" content="canonical-visual-runtime-os-mobile-safe" />
  <title>HHS Visual Runtime OS Workspace</title>
  <style>
    html, body, #root { width: 100%; min-height: 100%; margin: 0; background: #000; color: #fff; }
    * { box-sizing: border-box; }
    #runtime_boot_overlay {
      position: fixed; inset: 0; z-index: 999999; display: grid; place-items: center;
      padding: 24px; background: radial-gradient(circle at center, rgba(34,211,238,.1), transparent 70%), #000;
      font-family: Inter, system-ui, sans-serif;
    }
    #runtime_boot_panel {
      width: min(620px, 94vw); border: 1px solid rgba(34,211,238,.22); border-radius: 20px;
      background: rgba(0,0,0,.88); padding: 26px; box-shadow: 0 24px 80px rgba(0,0,0,.5);
    }
    #runtime_boot_title { color: rgb(103,232,249); font-size: 20px; font-weight: 800; letter-spacing: .04em; }
    #runtime_boot_status { margin-top: 12px; color: rgba(255,255,255,.62); font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
    #runtime_boot_error { display: none; margin-top: 14px; color: #fecaca; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
  </style>
  <script type="module" crossorigin src="/assets/index-C0QsYSm-.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="runtime_boot_overlay" role="status" aria-live="polite">
    <div id="runtime_boot_panel">
      <div id="runtime_boot_title">HHS Visual Runtime OS Workspace</div>
      <div id="runtime_boot_status">boot_sequence:
  → load compatibility bootstrap
  → import canonical IDE bundle
  → mount canonical IDE shell
  → initialize runtime projection transport
  → expose project, editor, compiler, emulator, assistant, and multimodal tools</div>
      <div id="runtime_boot_error"></div>
    </div>
  </div>
  <script>
    (() => {
      const stringify = (value) => {
        if (value == null) return "Unknown frontend error";
        if (typeof value === "string") return value;
        if (value.stack) return String(value.stack);
        if (value.message) return String(value.message);
        try { return JSON.stringify(value, null, 2); } catch (_) { return String(value); }
      };
      const report = (label, value) => {
        const status = document.getElementById("runtime_boot_status");
        const error = document.getElementById("runtime_boot_error");
        if (status) status.textContent = "The canonical HHS IDE did not mount.";
        if (error) {
          error.style.display = "block";
          error.textContent = `${label}\n${stringify(value)}`;
        }
        document.documentElement.dataset.hhsBootFailure = label;
      };
      window.__HHS_REPORT_BOOT_ERROR__ = report;
      window.addEventListener("error", (event) => report("frontend_error", event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => report("unhandled_promise_rejection", event.reason));
      window.setTimeout(() => {
        if (document.documentElement.dataset.hhsMounted) return;
        const bootstrap = document.documentElement.dataset.hhsBootstrap || "not-loaded";
        const entry = document.documentElement.dataset.hhsEntry || "not-loaded";
        report(
          "frontend_boot_timeout",
          `bootstrap=${bootstrap}\nentry=${entry}\nNo canonical IDE surface committed within 12 seconds.`
        );
      }, 12000);
    })();
  </script>
</body>
</html>
