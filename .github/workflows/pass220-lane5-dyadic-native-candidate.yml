name: Pass 220 Lane 5 Dyadic Native Candidate Regression
on:
  pull_request:
    paths:
      - 'GNUmakefile'
      - 'hhs_runtime/include/hhs_pass220_lane5_dyadic_virtual_bridge_v1.h'
      - 'hhs_runtime/cpp/hhs_pass220_lane5_dyadic_virtual_bridge_v1.cpp'
      - 'tests/pass220/test_lane5_dyadic_native_bridge.cpp'
      - 'tests/test_lane5_dyadic_native_bridge_source.py'
      - '.github/workflows/pass220-lane5-dyadic-native-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dyadic-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
      - name: Verify frozen Pass219 generation integrity
        run: python tools/pass219/verify_generation_integrity_v1.py --manifest contracts/pass219/PASS_219_GENERATION_INTEGRITY_MANIFEST_V1.json --print-seal
      - name: Build exact ABI and check singleton signed environmental export
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so | grep ' hhs_pass220_lane5_dyadic_virtual_candidate_route$'
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so | grep ' hhs_exact_pass219_vm81_environment_admit_signed$'
          ! nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so | grep -q ' hhs_exact_pass219_vm81_pqc_admit_signed$'
          ! nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so | grep -q ' hhs_exact_pass219_vm81_pqc_admit$'
          ! nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so | grep -q ' hhs_exact_pass219_rna_admit_composed$'
          ! nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so | grep -q ' hhs_exact_vm81_admit_uqcel$'
      - name: Build inherited membrane dependencies
        run: |
          mkdir -p /tmp/dyadic-native
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass188_bott_runtime/include -c native_projects/hhs_pass188_bott_runtime/src/hhs_pass188_bott_runtime.c -o /tmp/dyadic-native/pass188.o
          gcc -c native_projects/hhs_pass188_bott_runtime/src/hhs_pass188_bott_step_x86_64.S -o /tmp/dyadic-native/pass188-x86.o
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass189_hqlh_runtime/include -c native_projects/hhs_pass189_hqlh_runtime/src/hhs_pass189_hqlh.c -o /tmp/dyadic-native/pass189.o
      - name: Run native dyadic candidate positive and negative tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic -pthread \
            -Ihhs_runtime/include \
            -Inative_projects/hhs_pass188_bott_runtime/include \
            -Inative_projects/hhs_pass189_hqlh_runtime/include \
            tests/pass220/test_lane5_dyadic_native_bridge.cpp \
            /tmp/dyadic-native/pass188.o /tmp/dyadic-native/pass188-x86.o /tmp/dyadic-native/pass189.o \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/dyadic-native/test-dyadic
          /tmp/dyadic-native/test-dyadic
      - name: Verify unchanged native authority
        run: |
          test -f hhs_runtime/HARMONICODE_VM_RUNTIME.c
          python -m unittest discover -s tests -p 'test_lane5_dyadic_native_bridge_source.py'
