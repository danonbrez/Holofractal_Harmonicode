name: Pass 200C Guarded Active Admission

on:
  pull_request:
    paths:
      - 'HHS_PASS_200C_GUARDED_ACTIVE_ADMISSION.md'
      - 'hhs_backend/runtime/hhs_pass200c_guarded_active_admission_v1.py'
      - 'hhs_backend/runtime/hhs_pass200c_guarded_active_admission.py'
      - 'hhs_backend/api/pass200c_active_routes.py'
      - 'hhs_backend/visual_server.py'
      - 'applications/holofractal_harmonizer/src/pass200c-guarded-active.mjs'
      - 'applications/holofractal_harmonizer/src/production-startup-coordinator.mjs'
      - 'tests/test_hhs_pass200c_guarded_active_admission_v1.py'
      - 'scripts/pass200c_production_validation.py'
      - 'docs/pass200c/**'
      - 'evidence/pass200c/**'
      - '.github/workflows/pass200c-guarded-active-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pass200c:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact tree
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install inherited runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Pass 200C surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass200c_guarded_active_admission_v1.py \
            hhs_backend/runtime/hhs_pass200c_guarded_active_admission.py \
            hhs_backend/api/pass200c_active_routes.py \
            hhs_backend/visual_server.py \
            tests/test_hhs_pass200c_guarded_active_admission_v1.py \
            scripts/pass200c_production_validation.py

      - name: Run guarded active lifecycle tests
        run: python -m unittest -v tests.test_hhs_pass200c_guarded_active_admission_v1

      - name: Execute production proof, canary evidence, active lease, exhaustion, and rollback
        run: |
          python scripts/pass200c_production_validation.py \
            --state-root .hhs/pass200c-ci \
            --evidence evidence/pass200c-ci/PASS200C_VALIDATION_RECEIPT.json

      - name: Reject floating-point canonical operations
        run: |
          if grep -RInE '(^|[^[:alnum:]_])(float\(|Decimal\(|numpy|np\.)' \
            hhs_backend/runtime/hhs_pass200c_guarded_active_admission_v1.py \
            hhs_backend/runtime/hhs_pass200c_guarded_active_admission.py; then
            echo 'Floating-point canonical operation detected.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate visual JavaScript
        run: |
          node --check applications/holofractal_harmonizer/src/pass200c-guarded-active.mjs
          node --check applications/holofractal_harmonizer/src/production-startup-coordinator.mjs

      - name: Verify authority, API, visual, and contract wiring
        run: |
          grep -Fq 'SINGLETON_ACTIVE_FRONTIER_ACTIVATED' hhs_backend/runtime/hhs_pass200c_guarded_active_admission_v1.py
          grep -Fq 'ACTIVE_EXACT_GUARD_MISMATCH' hhs_backend/runtime/hhs_pass200c_guarded_active_admission_v1.py
          grep -Fq 'three distinct principals' hhs_backend/runtime/hhs_pass200c_guarded_active_admission_v1.py
          grep -Fq 'persisted canary evidence was tampered' hhs_backend/runtime/hhs_pass200c_guarded_active_admission.py
          grep -Fq 'runtime_controller.authorized_tick' hhs_backend/api/pass200c_active_routes.py
          grep -Fq 'vm81:compiler-active-authority' hhs_backend/api/pass200c_active_routes.py
          grep -Fq 'vm81:runtime-active-authority' hhs_backend/api/pass200c_active_routes.py
          grep -Fq 'vm81:operations-active-authority' hhs_backend/api/pass200c_active_routes.py
          grep -Fq '/api/runtime/optimization-active' hhs_backend/visual_server.py
          grep -Fq 'pass200c_active_router' hhs_backend/visual_server.py
          grep -Fq "import './pass200c-guarded-active.mjs';" applications/holofractal_harmonizer/src/production-startup-coordinator.mjs
          grep -Fq 'pass200c_guarded_active_projection_loaded: true' applications/holofractal_harmonizer/src/production-startup-coordinator.mjs
          grep -Fq 'The exact guard executes on every active invocation' applications/holofractal_harmonizer/src/pass200c-guarded-active.mjs
          grep -Fq 'Permanent freezing requires a separate pass' HHS_PASS_200C_GUARDED_ACTIVE_ADMISSION.md

      - name: Upload Pass 200C evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass200c-guarded-active-admission
          path: evidence/pass200c-ci/PASS200C_VALIDATION_RECEIPT.json
          if-no-files-found: error
          retention-days: 30
