      - "tests/pass220/test_hhs_pass220_h36_hash72_unit_bridge_v1.py"
      - "hhs_runtime/hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "hhs_runtime/hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/c/hhs_runtime_uqcel_1_8_bigint.inc"
      - "hhs_runtime/c/hhs_runtime_uqcel_1_8_validate.inc"
      - "hhs_python/runtime/hhs_uqcel_ctypes_bridge.py"
      - "contracts/pass219/PASS_219_NATIVE_UNIVERSAL_CONSTRAINT_ENVELOPE_1_8_0.harmonicode"
      - "evidence/pass220/i018_repair_wolfram_audit_v1.wl"
      - "evidence/pass220/i018_repair_wolfram_audit_v1.output.json"
      - "evidence/pass220/i018_repair_wolfram_audit_v1.receipt.json"
      - "hhs_runtime/hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/c/hhs_runtime_uqcel_1_8_bigint.inc"
      - "hhs_runtime/c/hhs_runtime_uqcel_1_8_validate.inc"
      - "hhs_python/runtime/hhs_uqcel_ctypes_bridge.py"
      - "contracts/pass219/PASS_219_NATIVE_UNIVERSAL_CONSTRAINT_ENVELOPE_1_8_0.harmonicode"
      - "evidence/pass220/i018_repair_wolfram_audit_v1.wl"
      - "evidence/pass220/i018_repair_wolfram_audit_v1.output.json"
      - "evidence/pass220/i018_repair_wolfram_audit_v1.receipt.json"
      - "tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "hhs_runtime/hhs_pass219_dynamic_paradox_phase_cycle_v1.py"
      - "contracts/pass219/PASS_219_I147_DYNAMIC_PARADOX_PHASE_CYCLE_H36_1_0.json"
      - "hhs_runtime/pass219_native_universal_constraint_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "whitepapers/HHS_PASS220_H36_HASH72_UNIT_BRIDGE_V1.md"
      - "docs/pass220/PASS_220_I018_H36_HASH72_UNIT_BRIDGE.md"
      - ".github/workflows/pass220-i018-h36-hash72-unit-bridge.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_h36_hash72_unit_bridge_v1.py"
      - "tests/pass220/test_hhs_pass220_h36_hash72_unit_bridge_v1.py"
      - "hhs_runtime/hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "hhs_runtime/hhs_pass219_dynamic_paradox_phase_cycle_v1.py"
      - "contracts/pass219/PASS_219_I147_DYNAMIC_PARADOX_PHASE_CYCLE_H36_1_0.json"
      - "hhs_runtime/pass219_native_universal_constraint_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "whitepapers/HHS_PASS220_H36_HASH72_UNIT_BRIDGE_V1.md"
      - "docs/pass220/PASS_220_I018_H36_HASH72_UNIT_BRIDGE.md"
      - ".github/workflows/pass220-i018-h36-hash72-unit-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify sealed Wolfram audit evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path(".")
          receipt_path = root / "evidence/pass220/i018_repair_wolfram_audit_v1.receipt.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          for kind in ("input", "output"):
              path = root / receipt[f"{kind}_path"]
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == receipt[f"{kind}_sha256"], (kind, actual)
          output = json.loads((root / receipt["output_path"]).read_text(encoding="utf-8"))
          assert output["allPassed"] is True
          assert output["checkCount"] == output["passedCount"] == 15
          assert receipt["all_passed"] is True
          assert receipt["check_count"] == receipt["passed_count"] == 15
          PY
      - name: Run I018 and inherited exact surfaces
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_h36_hash72_unit_bridge_v1.py
          tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py
          tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py
          tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py
          tests/pass220/test_hhs_pass220_lo_shu_normalization_v1.py
