name: Pass 219 I178 Pass170 Constructor Transport Parity

on:
  push:
    branches:
      - main
      - agent/pass219-i178-pass170-constructor-transport-parity
    paths:
      - 'hhs_runtime/main.py'
      - 'hhs_runtime/pass219/pass170_audio_transport_i178.py'
      - 'HHS_FASTAPI_CONSTRUCTOR_REGISTRY_I178.json'
      - 'HHS_PUBLIC_OPERATION_RECORD_INDEX_I178.json'
      - 'contracts/pass219/pass170_operation_records_i178/HHS_PUBLIC_OPERATION_RECORDS_AUDIO_LANGUAGE_TRANSPORT_V1.json'
      - 'contracts/pass219/PASS_219_I178_PASS170_CONSTRUCTOR_TRANSPORT_1_0.json'
      - 'hhs_runtime/pass219/pass170_constructor_transport_i178.py'
      - 'tests/pass219/test_pass219_i178_pass170_constructor_transport.py'
      - '.github/workflows/pass219-i178-pass170-constructor-transport.yml'
      - 'docs/operations/restart/PASS_219_I178_PASS170_CONSTRUCTOR_TRANSPORT_RESTART.md'
  pull_request:
    branches:
      - main
    paths:
      - 'hhs_runtime/main.py'
      - 'hhs_runtime/pass219/pass170_audio_transport_i178.py'
      - 'HHS_FASTAPI_CONSTRUCTOR_REGISTRY_I178.json'
      - 'HHS_PUBLIC_OPERATION_RECORD_INDEX_I178.json'
      - 'contracts/pass219/pass170_operation_records_i178/HHS_PUBLIC_OPERATION_RECORDS_AUDIO_LANGUAGE_TRANSPORT_V1.json'
      - 'contracts/pass219/PASS_219_I178_PASS170_CONSTRUCTOR_TRANSPORT_1_0.json'
      - 'hhs_runtime/pass219/pass170_constructor_transport_i178.py'
      - 'tests/pass219/test_pass219_i178_pass170_constructor_transport.py'
      - '.github/workflows/pass219-i178-pass170-constructor-transport.yml'
      - 'docs/operations/restart/PASS_219_I178_PASS170_CONSTRUCTOR_TRANSPORT_RESTART.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-i178:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded validation dependencies
        run: python -m pip install pytest fastapi httpx
      - name: Parse manifests and compile I178 surfaces
        run: |
          python -m json.tool HHS_FASTAPI_CONSTRUCTOR_REGISTRY_I178.json >/dev/null
          python -m json.tool HHS_PUBLIC_OPERATION_RECORD_INDEX_I178.json >/dev/null
          python -m json.tool contracts/pass219/pass170_operation_records_i178/HHS_PUBLIC_OPERATION_RECORDS_AUDIO_LANGUAGE_TRANSPORT_V1.json >/dev/null
          python -m json.tool contracts/pass219/PASS_219_I178_PASS170_CONSTRUCTOR_TRANSPORT_1_0.json >/dev/null
          python -m py_compile hhs_runtime/main.py
          python -m py_compile hhs_runtime/pass219/pass170_audio_transport_i178.py
          python -m py_compile hhs_runtime/pass219/pass170_constructor_transport_i178.py
          python -m py_compile tests/pass219/test_pass219_i178_pass170_constructor_transport.py
      - name: Run dependency-scoped I178 tests
        run: PYTHONPATH=. python -m pytest -q --tb=short tests/pass219/test_pass219_i178_pass170_constructor_transport.py
      - name: Execute I178 fail-closed gate
        run: |
          mkdir -p artifacts/pass219/i178
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass219.pass170_constructor_transport_i178 import verify_i178_constructor_transport
          report = verify_i178_constructor_transport('.', fail_closed=False)
          target = Path('artifacts/pass219/i178/constructor_transport.json')
          target.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Enforce I178 bounded nonterminal boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/pass219/i178/constructor_transport.json').read_text(encoding='utf-8'))
          expected = [
            'PASS170_EXPLICIT_SOURCE_ONLY_DEGRADED_GATEWAY_REMAINS',
            'PASS170_LEGACY_FASTAPI_CONSTRUCTORS_REMAIN',
            'PASS170_PUBLIC_NATIVE_ABI_PARITY_PENDING',
            'PASS170_PUBLIC_E2E_RECEIPT_REPLAY_PENDING',
          ]
          assert report['schema'] == 'HHS_PASS219_I178_PASS170_CONSTRUCTOR_TRANSPORT_V1'
          assert report['evidence_verified'] is True, report['evidence_blockers']
          assert report['evidence_blockers'] == []
          assert report['parent_i177_exact_main_verified'] is True
          assert report['parent_fastapi_constructor_count'] == 9
          assert report['fastapi_constructor_count'] == 8
          assert report['newly_retired_constructor_count'] == 1
          assert report['cumulative_retired_constructor_count'] == 2
          assert report['retired_constructor_path'] == 'hhs_runtime/main.py'
          assert report['observed_launcher_count'] == 6
          assert report['canonical_redirect_count'] == 6
          assert report['audio_http_transport_verified'] is True
          assert report['audio_cli_transport_verified'] is True
          assert report['audio_python_transport_verified'] is True
          assert report['audio_native_abi_verified'] is False
          assert report['shared_signed_admission_preserved'] is True
          assert report['audio_internal_ecc_pq_boundary_preserved'] is True
          assert report['new_capability_token_authority'] is False
          assert report['target_blockers'] == expected
          assert report['pass170_terminal_contract_verified'] is False
          assert report['canonical_state_mutated'] is False
          assert report['new_vm81_authority'] is False
          assert report['new_hash72_mint_authority'] is False
          assert report['hash216_persistence_authority'] is False
          assert report['floating_point_canonical_authority'] is False
          assert report['next_boundary'] == 'PASS170_CONSTRUCTOR_RETIREMENT_TRANCHE_C_NATIVE_AUDIO_ABI_AND_RECEIPT_REPLAY'
          PY
      - name: Upload I178 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass219-i178-pass170-constructor-transport-${{ github.sha }}
          path: artifacts/pass219/i178/constructor_transport.json
          if-no-files-found: warn
