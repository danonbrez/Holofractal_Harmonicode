name: Pass 220 Binary-Trinary Egress Memory Lift

on:
  pull_request:
    paths:
      - 'tests/pass220/test_binary_trinary_egress_memory_lift.py'
      - 'tests/pass220/emit_binary_trinary_native_frame_fixture.py'
      - 'tests/pass220/test_binary_trinary_native_frame_bridge.c'
      - 'tests/pass220/test_binary_trinary_hnan_codec_crossview.py'
      - 'hhs_runtime/hhs_pass220_base64_balanced_trit_v1.py'
      - 'hhs_runtime/pass219/hnan_4x4_recursive_gate_v1.py'
      - '.github/workflows/pass220-binary-trinary-egress-memory-lift.yml'
      - 'hhs_backend/runtime/hhs_universal_binary_trinary_translation_v1.py'
      - 'hhs_runtime/hhs_loshu_phase_embedding_v1.py'
      - 'hhs_runtime/pass175/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-lift-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest pytest-asyncio cryptography

      - name: Compile inherited exact VM81 ABI
        run: |
          mkdir -p /tmp/pass220-egress-memory
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/pass220-egress-memory/exact-abi.o
      - name: Build inherited exact ABI link support
        run: bash tools/pass219/build_exact_abi_link_support.sh /tmp/pass220-egress-memory/link-support full

      - name: Verify inherited RNA candidate reconstruction, rollback, and admission
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_rna_admission_lowering_1_12.c \
            /tmp/pass220-egress-memory/exact-abi.o \
            /tmp/pass220-egress-memory/link-support/hhs_hash216.o \
            /tmp/pass220-egress-memory/link-support/hhs_pass219_vm81_pqc_cell_wall.o \
            -lcrypto -lstdc++ -pthread -lm \
            -o /tmp/pass220-egress-memory/rna-admission-test
          /tmp/pass220-egress-memory/rna-admission-test

      - name: Generate recovered egress frame and provenance record
        env:
          PYTHONPATH: .
        run: |
          python tests/pass220/emit_binary_trinary_native_frame_fixture.py \
            /tmp/pass220-egress-memory/recovered-egress.bin \
            | tee /tmp/pass220-egress-memory/roundtrip.json
      - name: Verify lifted egress in native VM81 candidate admission
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass220/test_binary_trinary_native_frame_bridge.c \
            /tmp/pass220-egress-memory/exact-abi.o \
            /tmp/pass220-egress-memory/link-support/hhs_hash216.o \
            /tmp/pass220-egress-memory/link-support/hhs_pass219_vm81_pqc_cell_wall.o \
            -lcrypto -lstdc++ -pthread -lm \
            -o /tmp/pass220-egress-memory/native-lift-bridge
          /tmp/pass220-egress-memory/native-lift-bridge \
            /tmp/pass220-egress-memory/recovered-egress.bin
      - name: Verify full 648-byte egress trinary lift
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/pass220/test_binary_trinary_egress_memory_lift.py \
            tests/pass220/test_binary_trinary_hnan_codec_crossview.py
