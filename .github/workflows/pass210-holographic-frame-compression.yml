name: Pass 210 Holographic Frame Compression

on:
  push:
    branches: [main, agent/pass210-multimodal-invariant-calibration]
    paths:
      - "HHS_PASS_210_HOLOGRAPHIC_FRAME_COMPRESSION_ALGORITHM.md"
      - "contracts/pass210/**"
      - "hhs_backend/runtime/hhs_pass210_holographic_frame_compression_v1.py"
      - "hhs_backend/api/pass210_holographic_frame_compression_routes.py"
      - "tests/test_hhs_pass210_holographic_frame_compression_*"
      - "tools/generate_pass210_hfc_evidence.py"
      - "evidence/pass210/**"
      - "scripts/run_pass210_hfc_validation.sh"
      - "docs/pass210/**"
      - ".github/workflows/pass210-holographic-frame-compression.yml"
  pull_request:
    paths:
      - "HHS_PASS_210_HOLOGRAPHIC_FRAME_COMPRESSION_ALGORITHM.md"
      - "contracts/pass210/**"
      - "hhs_backend/runtime/hhs_pass210_holographic_frame_compression_v1.py"
      - "hhs_backend/api/pass210_holographic_frame_compression_routes.py"
      - "tests/test_hhs_pass210_holographic_frame_compression_*"
      - "tools/generate_pass210_hfc_evidence.py"
      - "evidence/pass210/**"
      - "scripts/run_pass210_hfc_validation.sh"
      - "docs/pass210/**"
      - ".github/workflows/pass210-holographic-frame-compression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi pydantic httpx
      - name: Parse frozen contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("contracts/pass210/PASS_210_CONTRACT.json").read_text())
          assert value["pass"] == 210
          assert value["contract_identifier"] == "HHS-P210-HFC-VM81-H72-H216"
          assert value["constants"]["REGISTER_LEN"] == 5184
          assert value["constants"]["SNAPSHOT_COUNT"] == 36
          assert value["constants"]["SNAPSHOT_WIDTH"] == 288
          assert value["constants"]["SNAPSHOT_STRIDE"] == 144
          assert value["floating_point_policy"] == "NO_FLOAT_CANONICAL_AUTHORITY"
          PY
      - name: Pass 210 validation
        run: bash scripts/run_pass210_hfc_validation.sh
