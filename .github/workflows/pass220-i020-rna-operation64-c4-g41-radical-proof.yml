name: Pass 220 I020 RNA operation64 C4 G41 Radical Proof

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_rna_operation64_c4_g41_radical_proof_v1.py"
      - "tests/pass220/test_hhs_pass220_rna_operation64_c4_g41_radical_proof_v1.py"
      - "hhs_runtime/hhs_pass220_rna_hash72_dna_qudit_phase_lock_v1.py"
      - "hhs_runtime/hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "hhs_runtime/hhs_pass220_mobius_quarter_phase_v1.py"
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "evidence/pass220/i020_wolfram_audit_v1.wl"
      - "evidence/pass220/i020_wolfram_audit_v1.output.json"
      - "evidence/pass220/i020_wolfram_audit_v1.receipt.json"
      - "evidence/pass220/i020_wolfram_audit_v1.wl"
      - "evidence/pass220/i020_wolfram_audit_v1.output.json"
      - "evidence/pass220/i020_wolfram_audit_v1.receipt.json"
      - "whitepapers/HHS_PASS220_RNA_OPERATION64_C4_G41_RADICAL_PROOF_V1.md"
      - "docs/pass220/PASS_220_I020_RNA_OPERATION64_C4_G41_RADICAL_PROOF.md"
      - ".github/workflows/pass220-i020-rna-operation64-c4-g41-radical-proof.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_rna_operation64_c4_g41_radical_proof_v1.py"
      - "tests/pass220/test_hhs_pass220_rna_operation64_c4_g41_radical_proof_v1.py"
      - "hhs_runtime/hhs_pass220_rna_hash72_dna_qudit_phase_lock_v1.py"
      - "hhs_runtime/hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "hhs_runtime/hhs_pass220_mobius_quarter_phase_v1.py"
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "whitepapers/HHS_PASS220_RNA_OPERATION64_C4_G41_RADICAL_PROOF_V1.md"
      - "docs/pass220/PASS_220_I020_RNA_OPERATION64_C4_G41_RADICAL_PROOF.md"
      - ".github/workflows/pass220-i020-rna-operation64-c4-g41-radical-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify sealed I020 Wolfram audit evidence
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path(".")
          receipt = json.loads(
              (root / "evidence/pass220/i020_wolfram_audit_v1.receipt.json").read_text(
                  encoding="utf-8"
              )
          )
          for kind in ("input", "output"):
              path = root / receipt[f"{kind}_path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == receipt[f"{kind}_sha256"]
          output = json.loads((root / receipt["output_path"]).read_text(encoding="utf-8"))
          assert output["allPassed"] is True
          assert output["checkCount"] == output["passedCount"] == 18
          assert receipt["all_passed"] is True
          assert receipt["check_count"] == receipt["passed_count"] == 18
          PY
      - name: Run I020 and inherited exact surfaces
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_rna_operation64_c4_g41_radical_proof_v1.py
          tests/pass220/test_hhs_pass220_rna_hash72_dna_qudit_phase_lock_v1.py
          tests/pass220/test_hhs_pass220_mobius_quarter_phase_v1.py
          tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py
          tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py
          tests/pass220/test_hhs_pass220_lo_shu_normalization_v1.py
