name: Validate Full Application IDE

on:
  pull_request:
    branches: [main]
    paths:
      - 'Procfile'
      - 'applications/holofractal_harmonizer/**'
      - 'applications/pass174_visual_ide/**'
      - 'hhs_backend/application_ide_server.py'
      - 'hhs_backend/production_ide_server.py'
      - 'hhs_backend/pass174_server.py'
      - 'hhs_backend/api/repository_history_routes.py'
      - 'tests/test_hhs_full_application_ide_root_v1.py'
      - 'tests/test_hhs_repository_history_surface_v1.py'
      - '.github/workflows/full-application-ide.yml'
  push:
    branches: [main]
    paths:
      - 'Procfile'
      - 'applications/holofractal_harmonizer/**'
      - 'applications/pass174_visual_ide/**'
      - 'hhs_backend/application_ide_server.py'
      - 'hhs_backend/production_ide_server.py'
      - 'hhs_backend/pass174_server.py'
      - 'hhs_backend/api/repository_history_routes.py'
      - 'tests/test_hhs_full_application_ide_root_v1.py'
      - 'tests/test_hhs_repository_history_surface_v1.py'
      - '.github/workflows/full-application-ide.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hhs-full-application-ide-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-full-application-ide:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: '0'
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: '0.5'
      HHS_PASS174_BOOT_TIMEOUT_SECONDS: '12'

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped runtime packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'cryptography>=46.0,<47.0' \
            requests \
            pytest \
            playwright

      - name: Build inherited native authorities
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Validate executable application templates and browser compiler
        working-directory: applications/holofractal_harmonizer
        run: |
          timeout 60s node --check src/application-templates.mjs
          timeout 60s node --check src/application-studio.mjs
          timeout 60s node --check src/deployable-app-compiler.mjs
          timeout 60s node --check src/integrated-assistant.mjs
          timeout 60s node --check src/integrated-workbench.mjs
          timeout 60s node --check src/intuitive-ide.mjs
          timeout 120s node --test \
            tests/application.studio.test.mjs \
            tests/intuitive.ide.test.mjs \
            tests/integrated.workbench.test.mjs \
            tests/project.lifecycle.test.mjs

      - name: Validate final server composition and repository lineage
        run: |
          timeout 60s python -m py_compile \
            hhs_backend/application_ide_server.py \
            hhs_backend/production_ide_server.py \
            hhs_backend/api/repository_history_routes.py \
            applications/holofractal_harmonizer/ux_lab/full_application_smoke.py
          timeout 300s pytest -q \
            tests/test_hhs_full_application_ide_root_v1.py \
            tests/test_hhs_repository_history_surface_v1.py

      - name: Install bounded Chromium runtime
        run: timeout 600s python -m playwright install --with-deps chromium

      - name: Boot and browser-verify the exact Heroku entrypoint
        run: |
          set -euo pipefail
          python -m uvicorn hhs_backend.application_ide_server:app \
            --host 127.0.0.1 --port 8766 --workers 1 --log-level info \
            > /tmp/hhs-full-application-ide.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8766/ > /tmp/hhs-full-ide.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/hhs-full-application-ide.log
            exit 1
          fi
          grep -q 'HHS Full Multimodal Application IDE' /tmp/hhs-full-ide.html
          grep -q 'application-studio.css' /tmp/hhs-full-ide.html
          grep -q 'visual-ide.mjs' /tmp/hhs-full-ide.html
          curl -fsS http://127.0.0.1:8766/runtime-console/ | grep -q 'Pass 174 Harmonic Visual SDLC Runtime'
          curl -fsS http://127.0.0.1:8766/api/assistant/status > /tmp/hhs-assistant-status.json
          curl -fsS http://127.0.0.1:8766/api/runtime/repository/status > /tmp/hhs-repository-status.json
          curl -fsS http://127.0.0.1:8766/api/runtime/workspace/session > /tmp/hhs-workspace-session.json
          curl -fsS http://127.0.0.1:8766/api/v1/pass174/deployment/status?wait_for_terminal=false > /tmp/hhs-pass174-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [
              '/tmp/hhs-assistant-status.json',
              '/tmp/hhs-repository-status.json',
              '/tmp/hhs-workspace-session.json',
              '/tmp/hhs-pass174-status.json',
          ]:
              payload = json.loads(Path(path).read_text())
              if not isinstance(payload, dict):
                  raise SystemExit(f'non-object response: {path}')
          repository = json.loads(Path('/tmp/hhs-repository-status.json').read_text())
          if repository.get('ide_default_surface') != 'FULL_INTEGRATED_DEVELOPMENT_ENVIRONMENT':
              raise SystemExit(repository)
          PY
          HHS_FULL_APPLICATION_IDE_URL=http://127.0.0.1:8766 \
            timeout 300s python applications/holofractal_harmonizer/ux_lab/full_application_smoke.py
          cat applications/holofractal_harmonizer/evidence/full_application_ide_smoke.json

      - name: Verify public-root contract and representative applications
        run: |
          grep -q 'hhs_backend.application_ide_server:app' Procfile
          grep -q "'pong'" applications/holofractal_harmonizer/tests/application.studio.test.mjs
          grep -q "'calculator'" applications/holofractal_harmonizer/tests/application.studio.test.mjs
          grep -q "'puzzle'" applications/holofractal_harmonizer/tests/application.studio.test.mjs
          grep -q "'document'" applications/holofractal_harmonizer/tests/application.studio.test.mjs
          grep -q "'audio'" applications/holofractal_harmonizer/tests/application.studio.test.mjs
          grep -q "'video'" applications/holofractal_harmonizer/tests/application.studio.test.mjs
          grep -q 'HHS_DEPLOYABLE_BROWSER_APPLICATION_V1' applications/holofractal_harmonizer/src/deployable-app-compiler.mjs
          grep -q '"ok": true' applications/holofractal_harmonizer/evidence/full_application_ide_smoke.json

      - name: Upload browser acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-application-ide-smoke
          path: applications/holofractal_harmonizer/evidence/full_application_ide_smoke.json
          if-no-files-found: error
          retention-days: 30
