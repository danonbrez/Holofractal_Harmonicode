name: Pass 219 Lane 5 Nine-Loop Knowledge Hydration 1.75

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json'
      - 'hhs_runtime/pass219/lane5_nine_loop_knowledge_hydration_1_75.py'
      - 'hhs_runtime/include/hhs_pass219_lane5_nine_loop_knowledge_hydration_cell_wall_1_75.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_nine_loop_knowledge_hydration_cell_wall_1_75.cpp'
      - 'tests/pass219/test_pass219_lane5_nine_loop_knowledge_hydration_cell_wall_1_75.cpp'
      - 'evidence/pass219/lane5_nine_loop_knowledge_hydration_1_75_discovery_20260928_v1.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.md'
      - 'docs/whitepapers/HHS_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'GNUmakefile'
      - 'hhs_runtime/include/hhs_pass219_lane5_nine_loop_knowledge_hydration_cell_wall_1_75.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_nine_loop_knowledge_hydration_cell_wall_1_75.cpp'
      - 'tests/pass219/test_pass219_lane5_nine_loop_knowledge_hydration_cell_wall_1_75.cpp'
      - 'evidence/pass219/lane5_nine_loop_knowledge_hydration_1_75_discovery_20260928_v1.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.md'
      - 'docs/whitepapers/HHS_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'GNUmakefile'
      - 'tests/pass219/test_pass219_lane5_nine_loop_knowledge_hydration_1_75.py'
      - '.github/workflows/pass219-lane5-nine-loop-knowledge-hydration-1-75.yml'
  push:
    branches:
      - main
      - agent/pass219-lane5-nine-loop-knowledge-hydration-1-75-20260928
    paths:
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json'
      - 'hhs_runtime/pass219/lane5_nine_loop_knowledge_hydration_1_75.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_knowledge_hydration_1_75.py'
      - '.github/workflows/pass219-lane5-nine-loop-knowledge-hydration-1-75.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-knowledge-hydration-1-75:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped test dependency
        run: python -m pip install pytest numpy

      - name: Run 1.75 discovery and nine-loop parent regressions
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_lane5_nine_loop_knowledge_hydration_1_75.py \
            tests/pass219/test_pass219_lane5_nine_loop_generalization_1_73.py \
            tests/pass219/test_pass219_lane5_nine_loop_relation_dataset_1_72.py \
            tests/pass219/test_pass219_lane5_nine_loop_training_specimen_1_71.py \
            tests/pass219/test_pass219_lane5_nine_loop_feedback_1_70.py

      - name: Emit exact 1.75 discovery receipt
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from hhs_runtime.pass219.lane5_nine_loop_knowledge_hydration_1_75 import (
              discover_knowledge_hydration,
          )
          receipt = discover_knowledge_hydration()
          assert receipt["admitted_record_count"] == 13
          assert receipt["graph_node_count"] == 13
          assert receipt["graph_edge_count"] == 12
          assert receipt["query_count"] == 12
          assert receipt["execution_authority"] is False
          assert receipt["canonical_persistence_authority"] is False
          assert receipt["admitted_corpus_root_hash72"] == "0000000000000000000000000000002721Ip^KPnKF(sDVftNJCSFA1nW1v*8lgdQX?exMhE"
          assert receipt["knowledge_graph_root_hash72"] == "0000000000000000000000000000003ZOZmmCFNEq6a!I>kRKjlHqhXFOLxxAN4aleMzR7hM"
          assert receipt["admission_replay_bundle_sha256"] == "6d4ab72612278a3b1a27f8cab61a1de6e2a958275817b50aaa71ea11ac9a1b40"
          assert receipt["retrieval_replay_bundle_sha256"] == "9f509009a450e58e9d0fa91041e91dc69c2f20ea63d957f98cbd64526a38731a"
          print("PASS219_1_75_DISCOVERY=" + json.dumps(receipt, sort_keys=True))
          PY

      - name: Build shared exact VM81 runtime
        run: make -f GNUmakefile c-kernel

      - name: Compile native 1.75 conformance
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_nine_loop_knowledge_hydration_cell_wall_1_75.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -pthread \
            -o /tmp/test_pass219_lane5_nine_loop_knowledge_hydration_1_75

      - name: Run native 1.75 conformance
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: /tmp/test_pass219_lane5_nine_loop_knowledge_hydration_1_75

      - name: Verify frozen knowledge identities and authority boundary
        run: |
          grep -F '0000000000000000000000000000002721Ip^KPnKF(sDVftNJCSFA1nW1v*8lgdQX?exMhE' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json
          grep -F '0000000000000000000000000000003ZOZmmCFNEq6a!I>kRKjlHqhXFOLxxAN4aleMzR7hM' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json
          grep -F '6d4ab72612278a3b1a27f8cab61a1de6e2a958275817b50aaa71ea11ac9a1b40' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json
          grep -F '9f509009a450e58e9d0fa91041e91dc69c2f20ea63d957f98cbd64526a38731a' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json
          grep -F '"knowledge_authority": true' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json
          grep -F '"canonical_persistence_authority": false' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_KNOWLEDGE_HYDRATION_1_75.json
