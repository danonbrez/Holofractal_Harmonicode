name: Pass 220 Remote Mathematical Corpus Ref Census

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  remote-ref-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate remote census contracts
        run: python -m pip install pytest && python -m pytest -q tests/pass220/test_hhs_pass220_remote_ref_census_v1.py tests/pass220/test_hhs_pass220_remote_ref_tree_reconciliation_v1.py tests/pass220/test_hhs_pass220_source_bound_proof_extraction_v1.py tests/pass220/test_hhs_pass220_extracted_proof_crosswalk_v1.py
      - name: Observe paginated branch and open PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/pass220
          python -m hhs_runtime.hhs_pass220_remote_ref_census_v1 \
            --repo "${{ github.repository }}" > artifacts/pass220/REMOTE_REF_CENSUS.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/pass220/REMOTE_REF_CENSUS.json")
          r=json.loads(p.read_text())
          assert r["branch_pages_exhausted"] and r["open_pr_pages_exhausted"]
          assert not r["negative_existence_claim_authorized"]
          assert not r["distributed_discovery_complete"]
          print("Remote branch refs:",r["branch_count"])
          print("Open PR heads:",r["open_pr_count"])
          print("Candidate-only; no negative existence authority")
          PY
      - name: Inspect exact Git trees and reconcile candidate source blob identities
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m hhs_runtime.hhs_pass220_remote_ref_tree_reconciliation_v1 \
            --census artifacts/pass220/REMOTE_REF_CENSUS.json \
            --output artifacts/pass220/REMOTE_SOURCE_TREE_RECONCILIATION.json \
            --index-root .
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/pass220/REMOTE_SOURCE_TREE_RECONCILIATION.json").read_text())
          assert not r["negative_existence_claim_authorized"]
          assert not r["distributed_discovery_complete"]
          assert not r["candidate_results_truncated"], "TREE_CANDIDATE_REPORT_TRUNCATED"
          assert r["all_census_trees_enumerated"], "TREE_REF_COVERAGE_INCOMPLETE"
          print("Source tree candidates:",r["candidate_count"])
          PY
      - name: Extract candidate module and lemma declarations from exact source blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m hhs_runtime.hhs_pass220_source_bound_proof_extraction_v1 \
            --tree artifacts/pass220/REMOTE_SOURCE_TREE_RECONCILIATION.json \
            --output artifacts/pass220/REMOTE_PROOF_SOURCE_EXTRACTION.json \
            --max-files 250
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/pass220/REMOTE_PROOF_SOURCE_EXTRACTION.json").read_text())
          assert not r["negative_existence_claim_authorized"]
          assert not r["native_proof_executed"]
          print("Extracted source witnesses:",r["extracted_source_count"])
          print("Skipped blob identities:",len(r["skipped_blobs"]))
          PY
      - name: Crosswalk extracted lemma records against inherited Lane 5 constructors
        run: |
          python -m hhs_runtime.hhs_pass220_extracted_proof_crosswalk_v1 \
            --extraction artifacts/pass220/REMOTE_PROOF_SOURCE_EXTRACTION.json \
            --lemma-registry formal/lemmas/pass_144/LEMMA_CORPUS.json \
            --lane5 artifacts/repository_index/LANE5_HASH216_HYDRATION_KNOWLEDGE_GRAPH.json \
            --output artifacts/pass220/REMOTE_PROOF_CORPUS_CROSSWALK.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/pass220/REMOTE_PROOF_CORPUS_CROSSWALK.json")
          result=json.loads(p.read_text())
          assert result["negative_existence_claim_authorized"] is False
          assert result["native_proof_executed"] is False
          print("Recorded lemma source divergences:",len(result["lemma_source_conflicts"]))
          print("Course equation variants:",len(result["course_source_variants"]))
          PY
      - name: Upload read-only ref census evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass220-remote-ref-census
          path: |
            artifacts/pass220/REMOTE_REF_CENSUS.json
            artifacts/pass220/REMOTE_SOURCE_TREE_RECONCILIATION.json
            artifacts/pass220/REMOTE_PROOF_SOURCE_EXTRACTION.json
            artifacts/pass220/REMOTE_PROOF_CORPUS_CROSSWALK.json
          if-no-files-found: error
          retention-days: 30
