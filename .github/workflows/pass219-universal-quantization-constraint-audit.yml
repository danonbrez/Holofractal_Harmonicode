name: Pass 219 Universal Quantization Constraint Audit

on:
  pull_request:
    paths:
      - 'HHS_PASS_219_APPEND_ONLY_LO_SHU_DYADIC_QUADRATIC_RECIPROCITY_QUANTIZATION_AMENDMENT_1_7_0.md'
      - 'HHS_PASS_219_APPEND_ONLY_NATIVE_UNIVERSAL_CONSTRAINT_ENFORCEMENT_AMENDMENT_1_8_0.md'
      - 'HHS_PASS_219_APPEND_ONLY_NESTED_MODULAR_FIBONACCI_COMPRESSION_AMENDMENT_1_9_0.md'
      - 'HHS_PASS_219_APPEND_ONLY_MONOLITHIC_UQCEL_RESIDUAL_BOUNDARY_AMENDMENT_1_15_0.md'
      - 'contracts/pass219/PASS_219_NATIVE_UNIVERSAL_CONSTRAINT_ENVELOPE_1_8_0.harmonicode'
      - 'contracts/pass219/PASS_219_MONOLITHIC_UQCEL_RESIDUAL_BOUNDARY_1_15_0.tex'
      - 'docs/pass219/APPENDIX_G_UNIVERSAL_QUANTIZATION_CONSTRAINT_ENFORCEMENT_LAW.md'
      - 'docs/pass219/APPENDIX_H_NATIVE_UNIVERSAL_CONSTRAINT_ENVELOPE.md'
      - 'docs/pass219/APPENDIX_I_NESTED_MODULAR_FIBONACCI_COMPRESSION.md'
      - 'docs/operations/restart/PASS_219B_I6_INHERITED_RUNTIME_CONFORMANCE_RESTART.md'
      - 'hhs_runtime/pass219_quantization_constraint_reference_v1.py'
      - 'hhs_runtime/pass219_native_universal_constraint_v1.py'
      - 'hhs_runtime/pass219_fibonacci_compression_reference_v1.py'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/c/hhs_runtime_exact_abi_v1_1_base.inc'
      - 'hhs_runtime/c/hhs_runtime_uqcel_1_8_bigint.inc'
      - 'hhs_runtime/c/hhs_runtime_uqcel_1_8_validate.inc'
      - 'hhs_runtime/c/hhs_runtime_uqcel_1_8_receipt.inc'
      - 'hhs_runtime/c/hhs_pass192_fibonacci_compression_1_9.inc'
      - 'hhs_runtime/src/hhs_hash216.c'
      - 'hhs_runtime/include/hhs_hash216_bytes.h'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/include/hhs_runtime_exact_abi_v1_1_base.h'
      - 'hhs_runtime/include/hhs_runtime_uqcel_1_8.h'
      - 'hhs_runtime/include/hhs_pass192_fibonacci_compression_1_9.h'
      - 'hhs_python/runtime/hhs_uqcel_ctypes_bridge.py'
      - 'hhs_python/runtime/hhs_pass219_composed_ctypes_bridge.py'
      - 'native_projects/hhs_pass191_dyadic_quartic_phase_lattice/**'
      - 'tests/pass192_193/test_pass192_193_contract_invariants.py'
      - 'tests/pass219/test_pass219_inherited_runtime_conformance_i6_repair.py'
      - 'tests/pass219/test_pass219_monolithic_uqcel_residual_boundary_1_15.py'
      - 'tests/test_hhs_pass219_quantization_constraint_law.py'
      - 'tests/test_hhs_pass219_native_universal_constraint_enforcement.py'
      - 'tests/test_hhs_pass219_native_universal_constraint_negative_edges.py'
      - 'tests/test_hhs_pass219_fibonacci_compression_compliance.py'
      - 'tests/test_hhs_exact_runtime_abi_v1.py'
      - '.github/workflows/pass219-universal-quantization-constraint-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-quantization-constraint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'cryptography>=45.0,<47.0'
      - name: Strict-compile additive exact ABI
        run: >-
          gcc -O2 -std=c11 -Wall -Wextra -Werror
          -Ihhs_runtime/include -Ihhs_runtime/c -fPIC -shared
          hhs_runtime/c/hhs_runtime_exact_abi.c hhs_runtime/src/hhs_hash216.c
          -o /tmp/libhhs_uqcel_exact.so
      - name: Build integrated shared ABI
        run: make c-abi
      - name: Verify UQCEL and Fibonacci composition symbol exports
        run: >-
          nm -D hhs_runtime/builds/libhhs_runtime.so |
          grep -E 'hhs_exact_uqcel_version|hhs_exact_uqcel_source_sha256|hhs_exact_uqcel_validate|hhs_exact_uqcel_receipt_material|hhs_exact_vm81_admit_uqcel|hhs_exact_pass192_fibonacci_version|hhs_exact_pass192_fibonacci_compress|hhs_exact_pass192_fibonacci_validate_descriptor|hhs_exact_pass219_admit_composed|hhs_hash72_compute_bytes|hhs_hash216_compute_bytes'
      - name: Run inherited Pass 192 Fibonacci contract oracle
        run: python -m pytest -q tests/pass192_193/test_pass192_193_contract_invariants.py
      - name: Run UQCEL correspondence, enforcement, inherited conformance, monolithic residual, and Fibonacci composition audits
        run: >-
          python -m pytest -q
          tests/pass219/test_pass219_inherited_runtime_conformance_i6_repair.py
          tests/pass219/test_pass219_monolithic_uqcel_residual_boundary_1_15.py
          tests/test_hhs_pass219_quantization_constraint_law.py
          tests/test_hhs_pass219_native_universal_constraint_enforcement.py
          tests/test_hhs_pass219_native_universal_constraint_negative_edges.py
          tests/test_hhs_pass219_fibonacci_compression_compliance.py
          tests/test_hhs_exact_runtime_abi_v1.py
      - name: Verify historical standalone public C ABI link contract
        run: >-
          python -m pytest -q
          tests/test_hhs_vm81_native_development_v1.py::test_direct_c_abi_exact_foundation_smoke
      - name: Verify standalone VM81 kernel remains exact
        run: |
          make vm81
          hhs_runtime/builds/hhs_vm81 --verify --no-trace
