name: Pass 207 VM81 GPU Hyperthreads

on:
  pull_request:
    paths:
      - 'hhs_runtime/c/hhs_pass207_gpu_driver*'
      - 'hhs_python/runtime/hhs_pass207_gpu_driver_native.py'
      - 'hhs_python/runtime/hhs_pass207_gpu_driver_bridge.py'
      - 'hhs_backend/runtime/hhs_pass207_vm81_gpu_runtime_v1.py'
      - 'tests/test_hhs_pass207_gpu_driver_v1.c'
      - 'tests/test_hhs_pass207_gpu_driver_v1.py'
      - 'contracts/pass207/**'
      - 'artifacts/pass207/**'
      - 'docs/pass207/**'
      - '.github/workflows/pass207-vm81-gpu-hyperthreads.yml'
  push:
    branches: [main]
    paths:
      - 'hhs_runtime/c/hhs_pass207_gpu_driver*'
      - 'hhs_python/runtime/hhs_pass207_gpu_driver_native.py'
      - 'hhs_python/runtime/hhs_pass207_gpu_driver_bridge.py'
      - 'hhs_backend/runtime/hhs_pass207_vm81_gpu_runtime_v1.py'
      - 'tests/test_hhs_pass207_gpu_driver_v1.c'
      - 'tests/test_hhs_pass207_gpu_driver_v1.py'
      - 'contracts/pass207/**'
      - 'artifacts/pass207/**'
      - 'docs/pass207/**'
      - '.github/workflows/pass207-vm81-gpu-hyperthreads.yml'

permissions:
  contents: read

jobs:
  native-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Strict native shared-library build
        run: |
          mkdir -p hhs_runtime/builds
          cc -std=c11 -O3 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            hhs_runtime/c/hhs_pass207_gpu_driver.c \
            -Ihhs_runtime/c -ldl \
            -o hhs_runtime/builds/libhhs_pass207_gpu_driver.so
      - name: Native ABI symbols
        run: |
          nm -D hhs_runtime/builds/libhhs_pass207_gpu_driver.so | grep ' hhs_pass207_gpu_dispatch$'
          nm -D hhs_runtime/builds/libhhs_pass207_gpu_driver.so | grep ' hhs_pass207_lane_address$'
          nm -D hhs_runtime/builds/libhhs_pass207_gpu_driver.so | grep ' hhs_pass207_gpu_vector_distance72$'
      - name: Native deterministic test
        run: |
          cc -std=c11 -O3 -Wall -Wextra -Werror -pedantic \
            tests/test_hhs_pass207_gpu_driver_v1.c \
            hhs_runtime/c/hhs_pass207_gpu_driver.c \
            -Ihhs_runtime/c -ldl \
            -o /tmp/test_hhs_pass207_gpu_driver
          /tmp/test_hhs_pass207_gpu_driver
      - name: Native sanitizers
        run: |
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_hhs_pass207_gpu_driver_v1.c \
            hhs_runtime/c/hhs_pass207_gpu_driver.c \
            -Ihhs_runtime/c -ldl \
            -o /tmp/test_hhs_pass207_gpu_driver_san
          ASAN_OPTIONS=detect_leaks=1 /tmp/test_hhs_pass207_gpu_driver_san
      - name: Python compilation
        run: |
          python -m py_compile \
            hhs_python/runtime/hhs_pass207_gpu_driver_native.py \
            hhs_python/runtime/hhs_pass207_gpu_driver_bridge.py \
            hhs_backend/runtime/hhs_pass207_vm81_gpu_runtime_v1.py \
            tests/test_hhs_pass207_gpu_driver_v1.py
      - name: Python integration tests
        env:
          HHS_PASS207_GPU_BACKEND: CPU_REFERENCE
        run: python -m pytest -q tests/test_hhs_pass207_gpu_driver_v1.py
