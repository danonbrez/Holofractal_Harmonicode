name: Pass 220 Recursive BigInt P Metadata Hydration
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_recursive_bigint_p_metadata_hydration_v1.py"
      - "tests/pass220/test_pass220_recursive_bigint_p_metadata_hydration_v1.py"
      - ".github/workflows/pass220-recursive-bigint-p-metadata-hydration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recursive-crt-index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Exact recursive BigInt P metadata via inherited CRT VM81
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_recursive_bigint_p_metadata_hydration_v1.py
