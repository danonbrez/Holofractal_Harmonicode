name: Pass 219 I141 Pass 185 Phase 4 Production Multimodal Acceptance

on:
  push:
    branches:
      - agent/pass219-iteration141-pass185-production-browser-closure-reconciliation
    paths:
      - 'hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx'
      - 'hhs_gui/runtime_os/workspace/Pass185MultimodalLifecyclePanel.tsx'
      - 'hhs_gui/runtime_os/workspace/Pass185ApplicationLifecyclePanel.tsx'
      - 'hhs_gui/runtime_os/workspace/WorkspaceCommandClient.ts'
      - 'hhs_backend/runtime/hhs_workspace_authority_loop_v1.py'
      - 'hhs_backend/runtime/multimodal_workspace_ingress_v1.py'
      - 'hhs_verification/pass185/phase4_production_multimodal_acceptance.py'
      - 'docs/pass185/HHS_PASS_185_I141_PHASE4_PRODUCTION_MULTIMODAL_ACCEPTANCE.md'
      - '.github/workflows/pass219-i141-pass185-phase4-production-multimodal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i141-pass185-phase4-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase4-production-multimodal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HHS_COGNITION_AUTO_TICK: '0'
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: '0.5'
      HHS_PASS185_PHASE4_EVIDENCE: '/tmp/pass185-phase4'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped runtime packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'cryptography>=46.0,<47.0' \
            requests \
            pytest \
            playwright

      - name: Prove inherited compiled C runtime
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so
          sha256sum hhs_runtime/builds/libhhs_runtime.so | tee /tmp/pass185-phase4-c-runtime.sha256

      - name: Typecheck and build exact Runtime OS public root
        working-directory: hhs_gui
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.html
          test -d dist/assets

      - name: Validate Phase-4 source contract
        run: |
          python -m py_compile hhs_verification/pass185/phase4_production_multimodal_acceptance.py
          grep -Fq 'Pass185MultimodalLifecyclePanel' hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx
          grep -Fq 'pass185-multimodal-lifecycle' hhs_gui/runtime_os/workspace/Pass185MultimodalLifecyclePanel.tsx
          grep -Fq 'WORKSPACE_COMMAND_INGRESS_REGISTER' hhs_verification/pass185/phase4_production_multimodal_acceptance.py
          grep -Fq 'frontend_runtime_authority' hhs_gui/runtime_os/workspace/Pass185MultimodalLifecyclePanel.tsx
          grep -Fq 'browser_preview_is_canonical_source' hhs_gui/runtime_os/workspace/Pass185MultimodalLifecyclePanel.tsx
          grep -Fq 'HHS_PASS_185_PHASE4_PRODUCTION_MULTIMODAL_IMPLEMENTED_PENDING_VALIDATION' \
            docs/pass185/HHS_PASS_185_I141_PHASE4_PRODUCTION_MULTIMODAL_ACCEPTANCE.md

      - name: Install bounded Chromium
        run: timeout 600s python -m playwright install --with-deps chromium

      - name: Run Phase-4 production multimodal browser acceptance
        run: |
          mkdir -p "$HHS_PASS185_PHASE4_EVIDENCE"
          timeout 480s python -m hhs_verification.pass185.phase4_production_multimodal_acceptance \
            --evidence-dir "$HHS_PASS185_PHASE4_EVIDENCE"

      - name: Retain impacted multimodal and production-root regressions
        run: |
          timeout 240s pytest -q \
            tests/test_hhs_workspace_multimodal_ingress_gui_pass049_v1.py \
            tests/test_hhs_pass165_multimodal_ingress_v1.py \
            tests/test_runtime_os_production_root.py

      - name: Seal Phase-4 evidence
        if: always()
        run: |
          mkdir -p "$HHS_PASS185_PHASE4_EVIDENCE"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('/tmp/pass185-phase4')
          payload = {
              'schema': 'HHS_PASS219_I141_PASS185_PHASE4_VALIDATION_SEAL_V1',
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'authoritative_main_base': 'f8aa3337ee023c7d828343eac208987c20a05e67',
              'phase3_validated_head': 'beff7599dedff2624be712f7a215de5c193e8cbe',
              'pass185_contract_commit': 'f260f2b013072a48399d9cdc207d0a76a6c63d2f',
              'classification': 'HHS_PASS_185_PHASE4_PRODUCTION_MULTIMODAL_EXECUTED',
              'terminal_pass185_completion_claimed': False,
              'evidence': {},
              'source_blobs': {},
          }
          for path in [
              'hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx',
              'hhs_gui/runtime_os/workspace/Pass185MultimodalLifecyclePanel.tsx',
              'hhs_gui/runtime_os/workspace/Pass185ApplicationLifecyclePanel.tsx',
              'hhs_gui/runtime_os/workspace/WorkspaceCommandClient.ts',
              'hhs_backend/runtime/hhs_workspace_authority_loop_v1.py',
              'hhs_backend/runtime/multimodal_workspace_ingress_v1.py',
              'hhs_verification/pass185/phase4_production_multimodal_acceptance.py',
              'docs/pass185/HHS_PASS_185_I141_PHASE4_PRODUCTION_MULTIMODAL_ACCEPTANCE.md',
          ]:
              payload['source_blobs'][path] = subprocess.check_output(
                  ['git', 'hash-object', path], text=True
              ).strip()
          for evidence in sorted(root.glob('**/*.json')):
              data = json.loads(evidence.read_text())
              payload['evidence'][evidence.name] = {
                  'ok': data.get('ok'),
                  'classification': data.get('classification'),
                  'path': str(evidence.relative_to(root)),
                  'sha256': hashlib.sha256(evidence.read_bytes()).hexdigest(),
              }
          encoded = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(encoded).hexdigest()
          (root / 'i141-phase4-seal.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i141-pass185-phase4-production-multimodal
          path: |
            /tmp/pass185-phase4/**
            /tmp/pass185-phase4-c-runtime.sha256
          if-no-files-found: warn
          retention-days: 30
