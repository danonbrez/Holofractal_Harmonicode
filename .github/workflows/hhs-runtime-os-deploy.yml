name: Build HHS Runtime OS frontend

on:
  push:
    branches: [main]
    paths:
      - "hhs_gui/**"
      - "hhs_backend/heroku_server.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "hhs_backend/runtime/hhs_production_assistant_v1.py"
      - "tests/test_hhs_production_public_app_v1.py"
      - "bin/post_compile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
      - "!hhs_gui/dist/**"
  pull_request:
    branches: [main]
    paths:
      - "hhs_gui/**"
      - "hhs_backend/heroku_server.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "hhs_backend/runtime/hhs_production_assistant_v1.py"
      - "tests/test_hhs_production_public_app_v1.py"
      - "bin/post_compile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
      - "!hhs_gui/dist/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hhs-runtime-os-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-runtime-os:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            pytest

      - name: Build native Hash72 runtime receipt authority
        run: |
          bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Validate production public APIs
        env:
          HHS_DISABLE_C_AUTOBUILD: "1"
          HHS_LITERT_LM_BACKEND: auto
          HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "0.1"
        run: pytest -q tests/test_hhs_production_public_app_v1.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: hhs_gui/package.json

      - name: Install frontend dependencies
        working-directory: hhs_gui
        run: npm install --no-audit --no-fund

      - name: Validate source contracts
        working-directory: hhs_gui
        run: |
          npm run test:e2e:source
          npm run test:workspace:source

      - name: Build deployable Runtime OS bundle
        working-directory: hhs_gui
        run: npm run build

      - name: Verify deployable entrypoint
        run: |
          test -s hhs_gui/dist/index.html
          test -d hhs_gui/dist/assets
          grep -q "HHS Runtime OS" hhs_gui/dist/index.html
          grep -q "frontend_boot_timeout" hhs_gui/dist/index.html
          grep -R -q "Production visual IDE · callable surfaces only" hhs_gui/dist/assets
          if grep -R -q "runtime_application_missing" hhs_gui/dist/assets; then
            echo "Legacy missing-module fallback leaked into production bundle"
            exit 1
          fi

      - name: Upload Runtime OS bundle
        uses: actions/upload-artifact@v4
        with:
          name: hhs-runtime-os-dist
          path: hhs_gui/dist
          if-no-files-found: error
          retention-days: 14

      - name: Publish generated bundle to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hhs_gui/dist
          if git diff --cached --quiet; then
            echo "Runtime OS bundle is unchanged"
            exit 0
          fi
          git commit -m "build: publish HHS Runtime OS frontend bundle [skip ci]"
          git push origin HEAD:main
