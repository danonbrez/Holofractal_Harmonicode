name: Pass 220 I073 Lean Parallel Generators
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_i073_lean_parallel_generator_equivalence_v1.py"
      - "tests/pass220/test_pass220_i073_lean_parallel_generator_equivalence_v1.py"
      - ".github/workflows/pass220-i073-lean-parallel-generators.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-generator-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify inherited symbolic generator and P equivalence cone
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --tb=short \
            tests/pass220/test_pass220_i073_lean_parallel_generator_equivalence_v1.py
