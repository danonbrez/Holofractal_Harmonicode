name: Pass 220 Trajectory Relations
on:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/pass220/lane5_trajectory_relations.py'
      - 'tests/pass220/test_lane5_trajectory_relations.py'
      - '.github/workflows/pass220-trajectory-relations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/pass220/test_lane5_nucleus_group_selection.py tests/pass220/test_lane5_neighborhood_phase_exchange.py tests/pass220/test_lane5_trajectory_relations.py
