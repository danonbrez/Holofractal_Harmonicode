name: Pass 219 Lane 5 Mandatory Optimization Integration

on:
  push:
    branches:
      - pass219/saturation-deadline-warm-cache-benchmark-v3
    paths:
      - 'hhs_runtime/pass219/lane5_mandatory_optimization_dispatcher.py'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'\n      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'\n      - 'hhs_runtime/c/hhs_pass219_vm81_authority_exports.map'\n      - 'hhs_runtime/c/hhs_pass219_rlm20_lane5_internal_state_closure_1_37.inc'\n      - 'hhs_runtime/include/hhs_pass219_rlm20_lane5_internal_state_closure_1_37.h'\n      - 'tests/pass219/test_pass219_rlm20_lane5_internal_state_closure_1_37.c'\n      - 'tests/pass219/test_lane5_rlm20_mandatory_integration.py'\n      - 'hhs_runtime/pass219/lane5_mandatory_optimization_dispatcher_impl.py'
      - 'hhs_runtime/pass219/lane5_mandatory_optimization_registry.py'
      - 'hhs_runtime/pass219/multimodal_optimization_generalization.py'
      - 'hhs_runtime/hhs_pass219_nonagentic_allegorical_warm_hydration_v1.py'
      - 'hhs_runtime/hhs_pass219_nonagentic_allegorical_warm_hydration_legacy_v1.py'
      - 'hhs_python/runtime/hhs_pass219_lane5_direct_witness_routing_bridge.py'
      - 'hhs_python/runtime/hhs_pass219_lane5_unbounded_workload_scaling_bridge.py'
      - 'hhs_runtime/include/hhs_pass219_harmonic36_global_latency_policy_1_16.h'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_global_latency_policy_1_16.inc'
      - 'contracts/pass219/optimization_generalization/**'
      - 'tests/pass219/test_lane5_mandatory_optimization_dispatcher.py'
      - 'tests/pass219/test_lane5_mandatory_optimization_registry.py'
      - 'tests/pass219/test_pass219_harmonic36_global_latency_policy_1_16.c'
      - '.github/workflows/pass219-lane5-mandatory-optimization-integration.yml'
      - 'docs/operations/restart/PASS_219_LANE5_MANDATORY_OPTIMIZATION_INTEGRATION_RESTART_20260917.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mandatory-optimization-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-pytest python3-cryptography

      - name: Static mandatory reachability gate
        run: |
          python - <<'PY'
          from pathlib import Path
          dispatcher = Path('hhs_runtime/pass219/lane5_mandatory_optimization_dispatcher.py').read_text()
          implementation = Path('hhs_runtime/pass219/lane5_mandatory_optimization_dispatcher_impl.py').read_text()
          registry = Path('hhs_runtime/pass219/lane5_mandatory_optimization_registry.py').read_text()
          facade = Path('hhs_runtime/hhs_pass219_nonagentic_allegorical_warm_hydration_v1.py').read_text()
          latency_h = Path('hhs_runtime/include/hhs_pass219_harmonic36_global_latency_policy_1_16.h').read_text()
          latency_c = Path('hhs_runtime/c/hhs_pass219_harmonic36_global_latency_policy_1_16.inc').read_text()
          for needle in (
              'LANE5_HASH216_COMPOSITION_JUMP_STORE_1_38',
              'LANE5_PERSISTENT_HASH216_COMPOSITION_MEMORY_1_39',
              'LANE5_RECURSIVE_HASH216_COMPOSITION_GRAPH_1_40',
              'LANE5_SUPEREDGE_HIERARCHY_1_41',
              'LANE5_AUTOMATIC_SUPEREDGE_ROUTING_1_42',
              'LANE5_EXECUTABLE_CAPABILITY_SELF_MODEL_1_43',
              'LANE5_REPOSITORY_CAPABILITY_REVERSE_DISCOVERY_1_44',
              'HASH216_FRACTAL_QUDIT_ADMISSION_1_45',
              'LANE5_DIRECT_WITNESS_ROUTING_1_46',
              'LANE5_UNBOUNDED_WORKLOAD_SCALING_1_48',
              'RML19_ROUTE_COMPOSITION_CERTIFICATE_REUSE',
              'RLM20_LANE5_INTERNAL_STATE_CLOSURE_1_37',\n              'compose_or_reuse',
              'optimize_direct_witness_routes',
              'optimize_unbounded_workload',
          ):
              assert needle in implementation, needle
          assert 'Pass219Lane5LatencyCompositionAgent' in dispatcher
          assert 'HHS_PASS219_LANE5_STATE_ROOT' in dispatcher
          assert '.hhs/pass219/lane5' in dispatcher
          assert 'build_mandatory_optimization_registry' in dispatcher
          assert 'validate_manifest' in registry
          assert 'GENERALIZE_REQUIRED' in registry
          assert 'Pass219Lane5MandatoryOptimizationDispatcher' in facade
          assert 'Pass219Lane5Hash216GPUPhaseInterlaceOptimizer' not in facade
          for needle in (
              'hhs_exact_pass219_h36_global_latency_select_cached',
              'hhs_exact_pass219_h36_global_latency_select_branch_ref',
              'hhs_exact_pass219_h36_global_latency_select_prevalidated',
          ):
              assert needle in latency_h, needle
              assert needle in latency_c, needle
          assert 'hhs_exact_pass219_h36_branch_ref_resolve' in latency_c
          assert 'hhs_exact_pass219_h36_branch_ref_composition_receipt' in latency_c
          print('mandatory_lane5_optimization_reachability=PASS')
          PY

      - name: Python compile
        run: |
          python -m py_compile \
            hhs_runtime/pass219/lane5_mandatory_optimization_dispatcher.py \
            hhs_runtime/pass219/lane5_mandatory_optimization_dispatcher_impl.py \
            hhs_runtime/pass219/lane5_mandatory_optimization_registry.py \
            hhs_runtime/hhs_pass219_nonagentic_allegorical_warm_hydration_v1.py \
            hhs_runtime/hhs_pass219_nonagentic_allegorical_warm_hydration_legacy_v1.py \
            hhs_python/runtime/hhs_pass219_lane5_direct_witness_routing_bridge.py \
            hhs_python/runtime/hhs_pass219_lane5_unbounded_workload_scaling_bridge.py

      - name: Build cumulative exact ABI
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Run native cached and branch-reference latency integration
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_global_latency_policy_1_16.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-h36-global-latency
          /tmp/test-h36-global-latency

      - name: Run mandatory dispatcher and accumulated Lane 5 regressions
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python -m pytest -q \
            tests/pass219/test_lane5_mandatory_optimization_dispatcher.py \
            tests/pass219/test_lane5_mandatory_optimization_registry.py \
            tests/pass219/test_pass219_lane5_automatic_superedge_routing_1_42.py \
            tests/pass219/test_pass219_lane5_superedge_hierarchy_1_41.py \
            tests/pass219/test_pass219_lane5_recursive_hash216_composition_graph_1_40.py \
            tests/pass219/test_pass219_lane5_persistent_hash216_composition_memory_1_39.py \
            tests/pass219/test_pass219_lane5_hash216_composition_jump_store_1_38.py \
            tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py \
            tests/pass219/test_pass219_rml19_route_composition_conservation_acceleration.py

      - name: Audit mandatory native exports
        run: |
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          for symbol in \
            hhs_exact_pass219_h36_global_latency_select_cached \
            hhs_exact_pass219_h36_global_latency_select_branch_ref \
            hhs_exact_pass219_h36_branch_ref_resolve \
            hhs_exact_pass219_h36_branch_ref_composition_receipt \
            hhs_exact_pass219_lane5_automatic_route_validate \
            hhs_exact_pass219_hash216_fractal_qudit_hydrate_proof \
            hhs_exact_pass219_lane5_direct_witness_route_validate \
            hhs_exact_pass219_lane5_direct_witness_route_optimize \
            hhs_exact_pass219_lane5_unbounded_workload_route_validate \
            hhs_exact_pass219_lane5_unbounded_workload_stream_consider \
            hhs_exact_pass219_lane5_unbounded_workload_stream_finalize \
            hhs_exact_pass219_lane5_runtime_preflight \\
            hhs_exact_pass219_rlm20_lane5_closure_authority \\
            hhs_exact_pass219_vm81_environment_admit_signed; do\n            grep -q " ${symbol}$" /tmp/hhs.symbols || {
              echo "missing mandatory Lane 5 export: ${symbol}" >&2
              exit 1
            }
          done

      - name: Audit RLM20 raw environmental seam remains hidden
        run: |
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          if grep -q ' hhs_exact_pass219_vm81_environment_admit_signed_raw$' /tmp/hhs.symbols; then
            echo 'raw environmental admission bypass exported' >&2
            exit 1
          fi
