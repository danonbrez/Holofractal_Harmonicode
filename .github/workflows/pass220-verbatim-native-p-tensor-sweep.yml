name: Pass 220 Verbatim Native P Tensor Sweep
on:
  push:
    branches:
      - 'agent/pass220-verbatim-native-p-tensor-sweep-*'
  pull_request:
    paths:
      - 'contracts/pass220/PASS_220_VERBATIM_P_TENSOR_SWEEP_V1.harmonicode'
      - 'hhs_runtime/pass220/hhs_pass220_verbatim_p_tensor_sweep_v1.py'
      - 'tests/pass220/test_hhs_pass220_verbatim_p_tensor_sweep_v1.py'
      - '.github/workflows/pass220-verbatim-native-p-tensor-sweep.yml'
jobs:
  verify-candidate-ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m compileall -q hhs_runtime/pass220/hhs_pass220_verbatim_p_tensor_sweep_v1.py
      - run: python -m pytest -q tests/pass220/test_hhs_pass220_verbatim_p_tensor_sweep_v1.py
