name: Guarded service Lean proof admission
on:
  pull_request:
    paths:
      - 'hhs_runtime/hhs_guarded_service_lean_proof_checker_v1.py'
      - 'hhs_runtime/hhs_service_registry_v1.py'
      - 'tests/pass220/test_hhs_guarded_service_lean_proof_checker_v1.py'
      - '.github/workflows/guarded-service-lean-proof-admission.yml'
  push:
    branches: [main]
    paths:
      - 'hhs_runtime/hhs_guarded_service_lean_proof_checker_v1.py'
      - 'hhs_runtime/hhs_service_registry_v1.py'
      - 'tests/pass220/test_hhs_guarded_service_lean_proof_checker_v1.py'
      - '.github/workflows/guarded-service-lean-proof-admission.yml'
jobs:
  proof-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate service checker and registry source
        run: python -m py_compile hhs_runtime/hhs_guarded_service_lean_proof_checker_v1.py hhs_runtime/hhs_service_registry_v1.py
      - name: Run proof checker regression
        run: PYTHONPATH=. python -m unittest tests/pass220/test_hhs_guarded_service_lean_proof_checker_v1.py
