name: Pass 219 Prime Memristive Fifth Lane Index I2

on:
  push:
    branches:
      - agent/pass219-prime-memristive-fifth-lane-i2-20260912
    paths:
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_0.hpp'
      - 'hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_1.hpp'
      - 'hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_1_0.cpp'
      - 'tests/pass219/test_pass219_prime_memristive_fifth_lane_1_1.cpp'
      - 'contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_INDEX_I2.md'
      - 'docs/operations/restart/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_I2_RESTART_20260912.md'
      - '.github/workflows/pass219-prime-memristive-fifth-lane-index-i2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out I2 branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Verify I2 authority and exact stopping contract
        run: |
          python - <<'PY'
          from pathlib import Path
          i1 = Path('hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_0.hpp').read_text()
          i2 = Path('hhs_runtime/include/hhs_pass219_prime_memristive_fifth_lane_1_1.hpp').read_text()
          contract = Path('contracts/pass219/PASS_219_PRIME_MEMRISTIVE_FIFTH_LANE_INDEX_I2.md').read_text()
          holo4 = Path('hhs_runtime/include/hhs_pass219_core_holographic_four_lane_1_24.h').read_text()
          assert '#define HHS_EXACT_PASS219_HOLO4_LANE_COUNT UINT32_C(4)' in holo4
          assert 'HHS_PASS219_PRIME_LANE_FIBRE_COUNT = 65U' in i1
          for needle in (
              'candidate_only{true}',
              'canonical_mutation_authority{false}',
              'canonical_hash72_authority{false}',
              'canonical_hash216_authority{false}',
              'canonical_persistence_authority{false}',
              'floating_point_authority{false}',
              'requires_inherited_vm81_hash216_admission{true}',
              'candidate_budget == 0U',
              'intersect_sorted',
              'linear_scan',
          ):
              assert needle in i2, needle
          for needle in (
              'K = (fibre_index, u, v, rho)',
              '|Ci| <= candidate_budget',
              'indexed_candidate_IDs == linear_scan_candidate_IDs',
              'requires_inherited_vm81_hash216_admission = true',
          ):
              assert needle in contract, needle
          print('prime_memristive_fifth_lane_i2_contract_gate=PASS')
          PY

      - name: Run inherited I1 fifth-lane test
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_0.cpp \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i1
          /tmp/test-pass219-prime-memristive-fifth-lane-i1

      - name: Build inherited exact ABI
        run: |
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_holo4_prepare'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep 'hhs_exact_pass219_holo4_route'

      - name: Run I2 adapter index intersection benchmark
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_prime_memristive_fifth_lane_1_1.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-pass219-prime-memristive-fifth-lane-i2
          /tmp/test-pass219-prime-memristive-fifth-lane-i2

      - name: Verify inherited four-lane authority remains green
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_core_holographic_four_lane_1_24.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto \
            -o /tmp/test-core-holo4
          /tmp/test-core-holo4
