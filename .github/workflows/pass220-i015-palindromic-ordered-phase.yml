name: Pass 220 I015 Palindromic Ordered Phase

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py"
      - "whitepapers/HHS_PASS220_PALINDROMIC_ORDERED_PHASE_MIRROR_ALGEBRA_V1.md"
      - "whitepapers/HOLOFRACTAL_HARMONICODE.md"
      - "docs/pass220/PASS_220_I015_PALINDROMIC_ORDERED_PHASE.md"
      - ".github/workflows/pass220-i015-palindromic-ordered-phase.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py"
      - "whitepapers/HHS_PASS220_PALINDROMIC_ORDERED_PHASE_MIRROR_ALGEBRA_V1.md"
      - "whitepapers/HOLOFRACTAL_HARMONICODE.md"
      - "docs/pass220/PASS_220_I015_PALINDROMIC_ORDERED_PHASE.md"
      - ".github/workflows/pass220-i015-palindromic-ordered-phase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-palindromic-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run I015 and inherited I014/I001 exact surfaces
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py
          tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py
          tests/pass220/test_hhs_pass220_lo_shu_normalization_v1.py
