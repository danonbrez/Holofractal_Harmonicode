name: Pass 190 Iteration 4 Distributed Singleton Authority

on:
  push:
    paths:
      - "HHS_PASS_190_ITERATION_4_DISTRIBUTED_SINGLETON_FENCED_AUTHORITY.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - "hhs_gui/runtime_apps/pass190/**"
      - ".github/workflows/pass190-iteration4.yml"
  pull_request:
    paths:
      - "HHS_PASS_190_ITERATION_4_DISTRIBUTED_SINGLETON_FENCED_AUTHORITY.md"
      - "native_projects/hhs_pass190_operation_fabric/**"
      - "hhs_gui/runtime_apps/pass190/**"
      - ".github/workflows/pass190-iteration4.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pass 190 Iteration 4
        working-directory: native_projects/hhs_pass190_operation_fabric
        run: make validate
