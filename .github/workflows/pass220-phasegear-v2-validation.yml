name: Pass 220 Phase Gear V2 Validation
on:
  push:
    branches:
      - feature/pass220-phasegear-lean-wolfram-lane5-20261017
    paths:
      - 'native_projects/pass220/**'
      - 'contracts/pass220/PASS_220_LANE5_FOUR_COMPONENT_PHASE_GEAR_CIRCUIT_V2.md'
      - 'formal/lean/HHS/Pass220/AdjustablePhaseGearCircuit.lean'
      - 'formal/lean/HHS.lean'
      - '.github/workflows/pass220-phasegear-v2-validation.yml'
  pull_request:
    paths:
      - 'native_projects/pass220/**'
      - 'contracts/pass220/PASS_220_LANE5_FOUR_COMPONENT_PHASE_GEAR_CIRCUIT_V2.md'
      - 'formal/lean/HHS/Pass220/AdjustablePhaseGearCircuit.lean'
      - '.github/workflows/pass220-phasegear-v2-validation.yml'
  workflow_dispatch:
jobs:
  cpp-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run phase gear native candidate tests
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -pedantic -I native_projects/pass220 native_projects/pass220/test_adjustable_phase_gear.cpp -o /tmp/hhs_phasegear_test
          /tmp/hhs_phasegear_test
          g++ -std=c++17 -Wall -Wextra -pedantic -I native_projects/pass220 native_projects/pass220/test_phase_gear_v2_ordered_source.cpp -o /tmp/hhs_phasegear_v2_test
          /tmp/hhs_phasegear_v2_test
      - name: Compile native RNA VM5184 bridge against existing ABI
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -pedantic -fsyntax-only -I native_projects/pass220 -I hhs_runtime/include native_projects/pass220/test_phase_gear_lane5_rna_bridge.cpp
      - name: Confirm source-locked V2 matches contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          contract=Path('contracts/pass220/PASS_220_LANE5_FOUR_COMPONENT_PHASE_GEAR_CIRCUIT_V2.md').read_text()
          source=contract.split('```wolfram\n',1)[1].split('\n```',1)[0].strip()
          header=Path('native_projects/pass220/phase_gear_v2_ordered_source.hpp').read_text()
          assert source in header
          assert source.count('==') == 22
          print('V2_SOURCE_IDENTITY_PASS: 4 components, 22 gates')
          PY
