# Include inside the existing DigitalOcean HTTPS server block.
# Specific Iteration 3 and Iteration 2 routes precede general Pass 189 routes.
location = /pass189/i3 { return 308 /pass189/i3/; }
location /pass189/i3/ {
    proxy_pass http://127.0.0.1:8191/pass189/i3/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}
location /api/pass189/i3/ {
    proxy_pass http://127.0.0.1:8191/api/pass189/i3/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
location = /ws/pass189/i3 {
    proxy_pass http://127.0.0.1:8191/ws/pass189/i3;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location = /pass189/i2 { return 308 /pass189/i2/; }
location /pass189/i2/ {
    proxy_pass http://127.0.0.1:8190/pass189/i2/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}
location /api/pass189/i2/ {
    proxy_pass http://127.0.0.1:8190/api/pass189/i2/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
location = /ws/pass189/i2 {
    proxy_pass http://127.0.0.1:8190/ws/pass189/i2;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}

location = /pass189 { return 308 /pass189/; }
location /pass189/ {
    proxy_pass http://127.0.0.1:8189/pass189/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}
location /api/pass189/ {
    proxy_pass http://127.0.0.1:8189/api/pass189/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
location = /ws {
    proxy_pass http://127.0.0.1:8189/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
