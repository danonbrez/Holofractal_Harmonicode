name: Pass 152 Authoritative Repository Sync V2

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pass152-authoritative-sync-v2
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZIP_URL: https://www.dropbox.com/scl/fi/q6iqw3yotlv9w1yeyft56/hhs_pass_152_universal_elastic_closure_invariant_full_inherited_pass_history_nucleus.zip?rlkey=shz59o5fblq1g6xrsd5c7snkp&dl=1
      ZIP_NAME: hhs_pass_152_universal_elastic_closure_invariant_full_inherited_pass_history_nucleus.zip
      ZIP_SIZE: "57645575"
      ZIP_SHA256: 8836e352396e440f8bfe9fa0e8f7dae3aa4f3bbb636ca5a80bca8c9efe6646c3
      MANIFEST_COUNT: "3410"
      ROLLBACK_BRANCH: backup/pre-pass-152-sync-20260723T144951Z
      ROLLBACK_SHA: b064860ed7df852604729e4ae8bd73f7620a0389
      TERMINAL_CLASSIFICATION: HHS_PASS_152_UNIVERSAL_ELASTIC_CLOSURE_INVARIANT_VERIFIED
      TARGET_BRANCH: release/pass-152-authoritative-sync-v2

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/pass-152-authoritative-sync-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download and verify authoritative archive
        shell: bash
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/$ZIP_NAME"
          curl -L --fail --retry 5 --retry-delay 3 "$ZIP_URL" -o "$zip_path"
          test "$(stat -c '%s' "$zip_path")" = "$ZIP_SIZE"
          test "$(sha256sum "$zip_path" | awk '{print $1}')" = "$ZIP_SHA256"
          printf 'ZIP_PATH=%s\n' "$zip_path" >> "$GITHUB_ENV"

      - name: Audit, extract with permissions, and verify source manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pass152-extracted"
          mkdir -p "$RUNNER_TEMP/pass152-extracted"
          python - <<'PY'
          import hashlib, json, os, pathlib, stat, zipfile
          zip_path = pathlib.Path(os.environ["ZIP_PATH"])
          extract_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pass152-extracted"
          with zipfile.ZipFile(zip_path) as archive:
              for info in archive.infolist():
                  relative = pathlib.PurePosixPath(info.filename)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"unsafe archive path: {info.filename}")
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"symlink entry rejected: {info.filename}")
              archive.extractall(extract_dir)
              for info in archive.infolist():
                  mode = (info.external_attr >> 16) & 0xFFFF
                  path = extract_dir / info.filename
                  if mode and path.exists():
                      os.chmod(path, stat.S_IMODE(mode))
          entries = list(extract_dir.iterdir())
          root = entries[0] if len(entries) == 1 and entries[0].is_dir() else extract_dir
          manifest = json.loads((root / "PASS_152_FILE_MANIFEST.json").read_text(encoding="utf-8"))
          files = manifest.get("files", [])
          expected = int(os.environ["MANIFEST_COUNT"])
          assert manifest.get("count") == expected and len(files) == expected
          for entry in files:
              relative = pathlib.PurePosixPath(entry["path"])
              assert not relative.is_absolute() and ".." not in relative.parts
              path = root.joinpath(*relative.parts)
              assert path.is_file(), entry["path"]
              assert path.stat().st_size == entry["size"], entry["path"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"], entry["path"]
          pathlib.Path(os.environ["RUNNER_TEMP"], "pass152-root.txt").write_text(str(root), encoding="utf-8")
          print(f"manifest_verified={len(files)}/{expected}")
          PY
          printf 'EXTRACTED_ROOT=%s\n' "$(cat "$RUNNER_TEMP/pass152-root.txt")" >> "$GITHUB_ENV"

      - name: Synchronize authoritative tree
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$EXTRACTED_ROOT/" "$GITHUB_WORKSPACE/"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/pass152-authoritative-sync.yml"

      - name: Verify synchronized manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          manifest = json.loads((root / "PASS_152_FILE_MANIFEST.json").read_text(encoding="utf-8"))
          files = manifest["files"]
          expected = int(os.environ["MANIFEST_COUNT"])
          assert manifest["count"] == expected and len(files) == expected
          for entry in files:
              path = root / entry["path"]
              assert path.is_file() and path.stat().st_size == entry["size"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"]
          PY

      - name: Install compatible validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install --upgrade --force-reinstall "fastapi==0.128.2" "starlette==0.50.0"

      - name: Verify canonical route compatibility
        run: python -m pytest -q tests/test_hhs_pass152_universal_elastic_closure_v1.py::test_pass152_routes_are_reachable_from_canonical_server

      - name: Run authoritative validation
        shell: bash
        run: |
          set -euo pipefail
          make pass152-full 2>&1 | tee "$RUNNER_TEMP/pass152-validation.log"

      - name: Verify generated evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("reports/pass152/PASS_152_FULL_VALIDATION_REPORT.json").read_text())
          tests = json.loads(Path("reports/pass152/P152_TEST_REPORT.json").read_text())
          assert tests["positive_cases_executed"] == 30
          assert tests["negative_cases_executed"] == 30
          assert tests["passed"] == 60 and tests["failed"] == 0
          assert report["pass152"]["api_integration_pytest"] == "5_PASSED"
          assert report["pass152"]["native_c"] == "PASSED"
          assert report["pass152"]["replay"] == "MATCH"
          assert report["pass152"]["vm81_commit"] is True
          assert report["pass152"]["hash72_receipt_present"] is True
          assert report["inherited_regression"]["make_verify_c"] == "PASSED"
          assert report["terminal_status"] == "HHS_PASS_152_UNIVERSAL_ELASTIC_CLOSURE_INVARIANT_VERIFIED"
          PY

      - name: Restore exact archive bytes and reverify
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$EXTRACTED_ROOT/" "$GITHUB_WORKSPACE/"
          rm -f "$GITHUB_WORKSPACE/.github/workflows/pass152-authoritative-sync.yml"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          manifest = json.loads((root / "PASS_152_FILE_MANIFEST.json").read_text())
          files = manifest["files"]
          expected = int(os.environ["MANIFEST_COUNT"])
          assert manifest["count"] == expected and len(files) == expected
          for entry in files:
              path = root / entry["path"]
              assert path.is_file() and path.stat().st_size == entry["size"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"]
          all_files = [p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts]
          assert len(all_files) == expected + 1, len(all_files)
          PY

      - name: Commit, push, and open release PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "Release Pass 152 universal elastic closure invariant"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$TARGET_BRANCH" --title "Release Pass 152 universal elastic closure invariant" --body "Complete authoritative Pass 152 repository replacement. Archive SHA-256: $ZIP_SHA256. Manifest: $MANIFEST_COUNT/$MANIFEST_COUNT. Validation: 60/60 Pass 152 cases, 5/5 API integration, native C and make verify-c passed. Rollback: $ROLLBACK_BRANCH at $ROLLBACK_SHA. Terminal classification: $TERMINAL_CLASSIFICATION"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass152-v2-validation
          path: ${{ runner.temp }}/pass152-validation.log
          if-no-files-found: warn
