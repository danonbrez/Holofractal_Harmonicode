name: Pass 219 I167 Public Service Gate Patch Once

on:
  push:
    branches:
      - agent/pass219-i167-pass169-canonical-corpus-terminal-closure
    paths:
      - '.github/workflows/pass219-i167-public-service-gate-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass219-i167-pass169-canonical-corpus-terminal-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch I165 service onto hardened I167 terminal gate
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('hhs_runtime/pass169/public_service.py')
          text=path.read_text(encoding='utf-8')
          old='''from hhs_runtime.pass219.pass169_terminal_reconciliation import (\n    PASS169_CANONICAL_CORPUS_PATH,\n    build_i164_pass169_terminal_reconciliation,\n)'''
          new='''from hhs_runtime.pass219.pass169_terminal_reconciliation import PASS169_CANONICAL_CORPUS_PATH\nfrom hhs_runtime.pass219.pass169_terminal_gate_i167 import build_i167_pass169_terminal_gate'''
          assert text.count(old)==1
          text=text.replace(old,new)
          old_call='return build_i164_pass169_terminal_reconciliation(self.repository_root)'
          new_call='return build_i167_pass169_terminal_gate(self.repository_root)'
          assert text.count(old_call)==1
          text=text.replace(old_call,new_call)
          path.write_text(text,encoding='utf-8')
          PY
          python -m py_compile hhs_runtime/pass169/public_service.py hhs_runtime/pass219/pass169_terminal_gate_i167.py
          grep -F 'build_i167_pass169_terminal_gate' hhs_runtime/pass169/public_service.py
          ! grep -F 'build_i164_pass169_terminal_reconciliation(self.repository_root)' hhs_runtime/pass169/public_service.py
      - name: Commit exact patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hhs_runtime/pass169/public_service.py
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'Pass 219 I167: bind public service status to hardened terminal gate [skip ci]'
          git push origin HEAD:agent/pass219-i167-pass169-canonical-corpus-terminal-closure
