name: Recovery Capture SSH Host Keys 20261001

on:
  push:
    branches:
      - recovery/ssh-probe-20261001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RECOVERY_HOST: '165.227.99.132'
    steps:
      - name: Capture audited recovery host keys
        shell: bash
        run: |
          set -euo pipefail
          keys=$(ssh-keyscan -T 8 "$RECOVERY_HOST" 2>/dev/null | sort -u)
          test -n "$keys"
          printf '%s\n' "HHS_RECOVERY_HOST_KEYS_BEGIN"
          printf '%s\n' "$keys"
          printf '%s\n' "HHS_RECOVERY_HOST_KEYS_END"
          printf '%s\n' "$keys" > /tmp/recovery-known-hosts
          ssh-keygen -lf /tmp/recovery-known-hosts
