name: Pass 189 HQLH Runtime

on:
  push:
    paths:
      - "HHS_PASS_189_HQLH_RUNTIME_IMPLEMENTATION_AND_DIGITALOCEAN_AUTHORITY.md"
      - "HHS_PASS_189_ITERATION_2_CALIBRATION_CAUSAL_PERSISTENCE_AUTHORITY.md"
      - "HHS_PASS_189_ITERATION_3_DEVICE_ADAPTER_LEASE_WATCHDOG_AUTHORITY.md"
      - "HHS_PASS_189_ITERATION_4_DRIVER_PROVENANCE_QUARANTINE_PROMOTION_AUTHORITY.md"
      - "native_projects/hhs_pass189_hqlh_runtime/**"
      - "hhs_gui/runtime_apps/hqlh/**"
      - "hhs_gui/runtime_os/core/RuntimeApplicationRegistry.tsx"
      - ".github/workflows/pass189-hqlh-runtime.yml"
  pull_request:
    paths:
      - "HHS_PASS_189_HQLH_RUNTIME_IMPLEMENTATION_AND_DIGITALOCEAN_AUTHORITY.md"
      - "HHS_PASS_189_ITERATION_2_CALIBRATION_CAUSAL_PERSISTENCE_AUTHORITY.md"
      - "HHS_PASS_189_ITERATION_3_DEVICE_ADAPTER_LEASE_WATCHDOG_AUTHORITY.md"
      - "HHS_PASS_189_ITERATION_4_DRIVER_PROVENANCE_QUARANTINE_PROMOTION_AUTHORITY.md"
      - "native_projects/hhs_pass189_hqlh_runtime/**"
      - "hhs_gui/runtime_apps/hqlh/**"
      - "hhs_gui/runtime_os/core/RuntimeApplicationRegistry.tsx"
      - ".github/workflows/pass189-hqlh-runtime.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact Pass 189 authority through Iteration 4
        working-directory: native_projects/hhs_pass189_hqlh_runtime
        run: make validate
