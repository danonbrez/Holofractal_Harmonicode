name: Pass 220 I048 Lean4 Native Mathlib1

on:
  push:
    branches:
      - pass220/i048-lean4-native-mathlib1
    paths:
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS/**"
      - "native_projects/hhs_pass220_mathlib_native/**"
      - "hhs_runtime/hhs_pass220_i048_native_mathlib_v1.py"
      - "tests/pass220/test_hhs_pass220_i048_native_mathlib_v1.py"
      - "contracts/pass220/PASS_220_I048_LEAN4_NATIVE_MATHLIB_REBUILD_V1.json"
      - "docs/pass220/PASS_220_I048_LEAN4_NATIVE_MATHLIB_REBUILD.md"
      - "docs/operations/restart/PASS_220_I048_LEAN4_NATIVE_MATHLIB_REBUILD_RESTART_20260928.md"
      - ".github/workflows/pass220-i048-lean4-native-mathlib.yml"
  pull_request:
    paths:
      - "lean-toolchain"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "formal/lean/HHS/**"
      - "native_projects/hhs_pass220_mathlib_native/**"
      - "hhs_runtime/hhs_pass220_i048_native_mathlib_v1.py"
      - "tests/pass220/test_hhs_pass220_i048_native_mathlib_v1.py"
      - "contracts/pass220/PASS_220_I048_LEAN4_NATIVE_MATHLIB_REBUILD_V1.json"
      - "docs/pass220/PASS_220_I048_LEAN4_NATIVE_MATHLIB_REBUILD.md"
      - "docs/operations/restart/PASS_220_I048_LEAN4_NATIVE_MATHLIB_REBUILD_RESTART_20260928.md"
      - ".github/workflows/pass220-i048-lean4-native-mathlib.yml"
  workflow_dispatch:

jobs:
  native-mathlib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Native C++/Python1 foundation
        run: |
          make -C native_projects/hhs_pass220_mathlib_native clean test
          python -m pytest -q tests/pass220/test_hhs_pass220_i048_native_mathlib_v1.py

      - name: Lean 4 build and kernel audit
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          build: true
          test: false
          leanchecker: true
          axiom-audit: true
          axiom-audit-root: HHS
