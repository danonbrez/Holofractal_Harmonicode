name: Pass 214 Iteration 2 Materializer

on:
  push:
    branches:
      - agent/pass214-operating-compression-gradient
    paths:
      - '.github/bootstrap_pass214_iteration2/**'
      - '.github/workflows/pass214-compound-optimization-benchmark.yml'

permissions:
  contents: write

jobs:
  materialize-iteration2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Materialize Pass 214 Iteration 2
        shell: bash
        run: |
          {
            head -c -1 .github/bootstrap_pass214_iteration2/part-00.b64
            cat .github/bootstrap_pass214_iteration2/part-01.b64 \
                .github/bootstrap_pass214_iteration2/part-02.b64 \
                .github/bootstrap_pass214_iteration2/part-03.b64 \
                .github/bootstrap_pass214_iteration2/part-04.b64 \
                .github/bootstrap_pass214_iteration2/part-05.b64
          } | base64 --decode \
            | gzip --decompress > /tmp/bootstrap_pass214_iteration2.py
          python /tmp/bootstrap_pass214_iteration2.py
          rm -rf .github/bootstrap_pass214_iteration2
          git checkout -- .github/workflows/pass214-compound-optimization-benchmark.yml
          git config user.name "hhs-pass214-iteration2"
          git config user.email "hhs-pass214-iteration2@users.noreply.github.com"
          git add -A
          git commit -m "Implement Pass 214 callable conformance graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
