# Include inside the existing DigitalOcean HTTPS server block.
location = /pass189 {
    return 308 /pass189/;
}

location /pass189/ {
    proxy_pass http://127.0.0.1:8189/pass189/;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}

location /api/pass189/ {
    proxy_pass http://127.0.0.1:8189/api/pass189/;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_buffering off;
}

location = /ws {
    proxy_pass http://127.0.0.1:8189/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
}
