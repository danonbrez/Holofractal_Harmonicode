name: Pass 214 Semantic Equivalence Reuse Registry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_backend/runtime/hhs_pass214_semantic_equivalence_v1.py'
      - 'hhs_backend/runtime/hhs_pass214_semantic_equivalence_v2.py'
      - 'hhs_backend/runtime/hhs_pass214_reusable_operation_registry_v1.py'
      - 'tools/pass214_semantic_equivalence_reconciliation.py'
      - 'tests/test_hhs_pass214_semantic_equivalence_v1.py'
      - 'tests/test_hhs_vm81_capture_process_utils_v1.py'
      - 'native_projects/hhs_vm81_game_level10/tools/hhs_capture_process_utils_v1.py'
      - 'native_projects/hhs_vm81_game_level10/tools/render_sprite_capture.py'
      - 'native_projects/hhs_vm81_game_level10/tools/render_terminal_capture.py'
      - 'evidence/pass214/PASS_214_SEMANTIC_EQUIVALENCE_REUSE_V1.json'
      - '.github/workflows/pass214-semantic-equivalence-reuse.yml'
  push:
    branches:
      - main
      - agent/pass214-semantic-equivalence-reuse-v1
    paths:
      - 'hhs_backend/runtime/hhs_pass214_semantic_equivalence_v1.py'
      - 'hhs_backend/runtime/hhs_pass214_semantic_equivalence_v2.py'
      - 'hhs_backend/runtime/hhs_pass214_reusable_operation_registry_v1.py'
      - 'tools/pass214_semantic_equivalence_reconciliation.py'
      - 'tests/test_hhs_pass214_semantic_equivalence_v1.py'
      - 'tests/test_hhs_vm81_capture_process_utils_v1.py'
      - 'native_projects/hhs_vm81_game_level10/tools/hhs_capture_process_utils_v1.py'
      - 'native_projects/hhs_vm81_game_level10/tools/render_sprite_capture.py'
      - 'native_projects/hhs_vm81_game_level10/tools/render_terminal_capture.py'
      - 'evidence/pass214/PASS_214_SEMANTIC_EQUIVALENCE_REUSE_V1.json'
      - '.github/workflows/pass214-semantic-equivalence-reuse.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  semantic-equivalence-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile reconciliation and promoted module
        run: |
          python -m py_compile hhs_backend/runtime/hhs_pass214_semantic_equivalence_v1.py
          python -m py_compile hhs_backend/runtime/hhs_pass214_semantic_equivalence_v2.py
          python -m py_compile hhs_backend/runtime/hhs_pass214_reusable_operation_registry_v1.py
          python -m py_compile tools/pass214_semantic_equivalence_reconciliation.py
          python -m py_compile native_projects/hhs_vm81_game_level10/tools/hhs_capture_process_utils_v1.py
          python -m py_compile native_projects/hhs_vm81_game_level10/tools/render_sprite_capture.py
          python -m py_compile native_projects/hhs_vm81_game_level10/tools/render_terminal_capture.py
      - name: Run targeted reconciliation and promotion tests
        run: |
          python -m pytest -q \
            tests/test_hhs_pass214_semantic_equivalence_v1.py \
            tests/test_hhs_vm81_capture_process_utils_v1.py
      - name: Generate exact-head reconciliation
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-semantic-equivalence"
          python tools/pass214_semantic_equivalence_reconciliation.py \
            --repository-root . \
            --source-ref HEAD \
            --output "$RUNNER_TEMP/pass214-semantic-equivalence/PASS_214_SEMANTIC_EQUIVALENCE_REUSE_V1.json" \
            | tee "$RUNNER_TEMP/pass214-semantic-equivalence/validation.log"
      - name: Emit migration accounting
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'pass214-semantic-equivalence' / 'PASS_214_SEMANTIC_EQUIVALENCE_REUSE_V1.json'
          d = json.loads(p.read_text())
          s = d['summary']
          print('SOURCE_COMMIT', s['source_commit'])
          print('RAW_IDENTITIES', s['raw_operation_identities'])
          print('OPERATION_REGISTRY_ENTRIES', s['operation_registry_entries'])
          print('REGISTRY_IDENTITIES_WITHOUT_UNPROVEN_COLLAPSE', s['registry_identity_count_without_unproven_collapse'])
          print('CANDIDATE_GROUPS', s['candidate_groups'])
          print('GROUP_STATUS', json.dumps(s['group_status_counts'], sort_keys=True))
          print('PROOF_EDGES', s['proof_edges'])
          print('REUSABLE_REGISTRY_ENTRIES', s['reusable_registry_entries'])
          print('MIGRATION_ACTIONS', json.dumps(s['migration_action_counts'], sort_keys=True))
          print('PROJECTION_SURFACES_FILTERED', s['projection_surfaces_removed_from_implementation_backlog'])
          print('SEMANTIC_ALIAS_ISOLATED_RETURNED', s['semantic_alias_only_isolated_records_returned_to_backlog'])
          print('ISOLATED_COVERED', s['isolated_candidates_covered_by_proven_reuse_or_promotion'])
          print('ISOLATED_REMAINING', s['isolated_candidates_remaining_reusable_extraction_backlog'])
          print('RECONCILIATION_SHA256', d['reconciliation_sha256'])
          PY
      - name: Retain reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass214-semantic-equivalence-reuse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pass214-semantic-equivalence/PASS_214_SEMANTIC_EQUIVALENCE_REUSE_V1.json
            ${{ runner.temp }}/pass214-semantic-equivalence/validation.log
          if-no-files-found: error
