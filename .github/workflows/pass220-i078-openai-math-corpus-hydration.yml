name: Pass 220 I078 OpenAI Math Corpus Hydration

on:
  push:
    branches:
      - pass220/i078-openai-math-corpus-hydration-20261007
    paths:
      - 'data/pass220/openai_math_corpus_hydration_20261006_v1.json'
      - 'hhs_runtime/hhs_pass220_i078_openai_math_corpus_hydration_v1.py'
      - 'tests/pass220/test_hhs_pass220_i078_openai_math_corpus_hydration_v1.py'
      - 'contracts/pass220/PASS_220_I078_OPENAI_MATH_CORPUS_HYDRATION_V1.json'
      - 'docs/whitepapers/HHS_PASS_220_I078_OPENAI_MATH_CORPUS_HYDRATION_V1.md'
      - '.github/workflows/pass220-i078-openai-math-corpus-hydration.yml'
  pull_request:
    paths:
      - 'data/pass220/openai_math_corpus_hydration_20261006_v1.json'
      - 'hhs_runtime/hhs_pass220_i078_openai_math_corpus_hydration_v1.py'
      - 'tests/pass220/test_hhs_pass220_i078_openai_math_corpus_hydration_v1.py'
      - 'contracts/pass220/PASS_220_I078_OPENAI_MATH_CORPUS_HYDRATION_V1.json'
      - 'docs/whitepapers/HHS_PASS_220_I078_OPENAI_MATH_CORPUS_HYDRATION_V1.md'

jobs:
  i078:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile I078 surfaces
        run: |
          python -m py_compile             hhs_runtime/hhs_pass220_i078_openai_math_corpus_hydration_v1.py             tests/pass220/test_hhs_pass220_i078_openai_math_corpus_hydration_v1.py

      - name: Run dependency-scoped I078 tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q --tb=short             tests/pass220/test_hhs_pass220_i078_openai_math_corpus_hydration_v1.py

      - name: Emit deterministic hydration summary
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from hhs_runtime.hhs_pass220_i078_openai_math_corpus_hydration_v1 import build_candidate_graph
          report=build_candidate_graph()
          print(json.dumps({
              "graph_node_count": report["graph_node_count"],
              "graph_edge_count": report["graph_edge_count"],
              "graph_sha256": report["graph_sha256"],
              "candidate_hash72": report["candidate_hash72"],
              "formalized_novelty_candidates": len(report["formalized_novelty_candidates"]),
              "candidate_only": report["candidate_only"],
          }, sort_keys=True))
          PY
