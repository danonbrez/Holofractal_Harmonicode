name: Pass 220 Course Native Passthrough Witness
on:
  pull_request:
    paths:
      - "hhs_runtime/include/hhs_pass220_course_passthrough_witness.h"
      - "hhs_runtime/c/hhs_pass220_course_passthrough_witness.c"
      - "hhs_runtime/hhs_pass220_course_passthrough_native_witness_binding_v1.py"
      - "tests/pass220/test_pass220_course_passthrough_native_witness_v1.py"
      - ".github/workflows/pass220-course-native-passthrough-witness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-passthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Compile and execute separate C passthrough witness with negative cases
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_course_passthrough_native_witness_v1.py
