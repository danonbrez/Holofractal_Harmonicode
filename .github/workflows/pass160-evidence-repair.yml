name: Pass 160 Repair-Forward Evidence Closure

on:
  push:
    branches:
      - agent/pass160-validated-transition-runtime
    paths:
      - 'HHS_PASS_160_EVIDENCE_REPAIR_REQUEST.json'

permissions:
  actions: read
  contents: write

jobs:
  repair-evidence-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      X86_ARTIFACT_ID: '8671768765'
      X86_ARTIFACT_SHA256: '9edd4c3bc0009be2317ff1a58857555ee2264d6738aa7601afb7a956f477394c'
      ARM_ARTIFACT_ID: '8671766892'
      ARM_ARTIFACT_SHA256: '6180a82f49f32543c63249d0b0ec306cca4057d7094b4a7bd8784765448d6d78'
      FINAL_RUN_ID: '30314852968'
      FINAL_GATE_COMMIT: '2da4ac4f98653dda83a02d8b3501130029f0681f'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass160-validated-transition-runtime
          fetch-depth: 2
          show-progress: false

      - name: Download and verify frozen successful artifacts
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$X86_ARTIFACT_ID/zip" > /tmp/pass160-x86.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARM_ARTIFACT_ID/zip" > /tmp/pass160-arm.zip
          test "$(sha256sum /tmp/pass160-x86.zip | awk '{print $1}')" = "$X86_ARTIFACT_SHA256"
          test "$(sha256sum /tmp/pass160-arm.zip | awk '{print $1}')" = "$ARM_ARTIFACT_SHA256"
          mkdir -p /tmp/pass160-x86 /tmp/pass160-arm
          unzip -q /tmp/pass160-x86.zip -d /tmp/pass160-x86
          unzip -q /tmp/pass160-arm.zip -d /tmp/pass160-arm
          test -f /tmp/pass160-x86/dist/P160_BOUNDED_FINAL_GATE_RECEIPT.json
          test -f /tmp/pass160-x86/dist/P160_CANONICAL_ROOT_x86_64.json
          test -f /tmp/pass160-arm/P160_CANONICAL_ROOT_aarch64.json
          test -f /tmp/pass160-arm/P160_NATIVE_VALIDATION_REPORT.json

      - name: Install frozen reports at canonical paths
        working-directory: native_projects/hhs_pass160_validated_transition_runtime
        run: |
          set -euo pipefail
          rm -rf dist evidence/pass160
          mkdir -p dist evidence/pass160 dist/cross-host/aarch64
          cp -a /tmp/pass160-x86/dist/. dist/
          if test -d /tmp/pass160-x86/evidence/pass160; then cp -a /tmp/pass160-x86/evidence/pass160/. evidence/pass160/; fi
          cp -a /tmp/pass160-x86/HHS_PASS_160_RELEASE_BUNDLE.json .
          cp -a /tmp/pass160-x86/HHS_PASS_160_FILE_MANIFEST.json .
          cp -a /tmp/pass160-x86/HHS_PASS_160_RECEIPT_INDEX.json .
          cp /tmp/pass160-arm/P160_CANONICAL_ROOT_aarch64.json dist/cross-host/aarch64/
          cp /tmp/pass160-arm/P160_NATIVE_VALIDATION_REPORT.json dist/cross-host/aarch64/

      - name: Generate terminal evidence from frozen reports only
        working-directory: native_projects/hhs_pass160_validated_transition_runtime
        run: |
          set -euo pipefail
          make materialize
          python3 tools/pass160_suite.py compare-cross-host
          python3 tools/pass160_suite.py generate-evidence
          python3 tools/pass160_suite.py close-terminal
          unzip -t dist/HHS_PASS_160_RELEASE_BUNDLE.zip

      - name: Build deterministic terminal evidence package
        working-directory: native_projects/hhs_pass160_validated_transition_runtime
        run: |
          python3 - <<'PY'
          import gzip, hashlib, io, json, os, tarfile
          from pathlib import Path

          terminal='HHS_PASS_160_FIBONACCI_PRIME_PSEUDORANDOM_OVERLAP_RECEIPT_TIP_VALIDATED_TRANSITION_RUNTIME_VERIFIED'
          evidence=Path('evidence/pass160')
          dist=Path('dist')
          receipt=evidence/'P160_COMPLETION_RECEIPT.json'
          closure=evidence/'P160_TERMINAL_CLOSURE.json'
          data=json.loads(receipt.read_text(encoding='utf-8'))
          assert data['classification']==terminal
          assert data['omega_160'] is True
          assert data['terminal_claimed'] is True

          repair={
            'schema':'P160_REPAIR_FORWARD_EVIDENCE_CLOSURE_V1',
            'contract':'HHS-P160-FPPORT-VTR',
            'final_workflow_run_id':int(os.environ['FINAL_RUN_ID']),
            'final_gate_commit':os.environ['FINAL_GATE_COMMIT'],
            'x86_artifact':{'id':int(os.environ['X86_ARTIFACT_ID']),'sha256':os.environ['X86_ARTIFACT_SHA256'],'computational_job':'success'},
            'aarch64_artifact':{'id':int(os.environ['ARM_ARTIFACT_ID']),'sha256':os.environ['ARM_ARTIFACT_SHA256'],'computational_job':'success'},
            'original_failure_scope':'evidence artifact path mapping only',
            'validation_reexecuted':False,
            'bounded_final_gate_count':1,
            'cross_architecture_root':json.loads((dist/'P160_CROSS_ARCHITECTURE_REPORT.json').read_text())['roots'][0],
            'terminal_classification':terminal,
            'omega_160':True,
            'terminal_claimed':True,
            'repair_forward':True,
          }
          repair_path=evidence/'P160_REPAIR_FORWARD_EVIDENCE_CLOSURE.json'
          repair_path.write_text(json.dumps(repair,indent=2,sort_keys=True)+'\n',encoding='utf-8')

          members=sorted(list(evidence.glob('*'))+[dist/'P160_CROSS_ARCHITECTURE_REPORT.json',dist/'P160_BOUNDED_FINAL_GATE_RECEIPT.json'])
          archive=dist/'P160_TERMINAL_EVIDENCE.tar.gz'
          raw=io.BytesIO()
          with tarfile.open(fileobj=raw,mode='w',format=tarfile.PAX_FORMAT) as tf:
            for path in members:
              arcname=str(path)
              payload=path.read_bytes()
              info=tarfile.TarInfo(arcname)
              info.size=len(payload); info.mode=0o644; info.mtime=0; info.uid=0; info.gid=0; info.uname=''; info.gname=''
              tf.addfile(info,io.BytesIO(payload))
          with archive.open('wb') as out, gzip.GzipFile(filename='',mode='wb',fileobj=out,mtime=0,compresslevel=9) as gz:
            gz.write(raw.getvalue())

          package={
            'schema':'P160_TERMINAL_EVIDENCE_PACKAGE_V1',
            'contract':'HHS-P160-FPPORT-VTR',
            'classification':terminal,
            'archive':str(archive),
            'archive_bytes':archive.stat().st_size,
            'archive_sha256':hashlib.sha256(archive.read_bytes()).hexdigest(),
            'completion_receipt_sha256':hashlib.sha256(receipt.read_bytes()).hexdigest(),
            'terminal_closure_sha256':hashlib.sha256(closure.read_bytes()).hexdigest(),
            'repair_closure_sha256':hashlib.sha256(repair_path.read_bytes()).hexdigest(),
            'release_bundle_sha256':hashlib.sha256((dist/'HHS_PASS_160_RELEASE_BUNDLE.zip').read_bytes()).hexdigest(),
            'integrity_verified':True,
            'validation_reexecuted':False,
            'bounded_final_gate_count':1,
          }
          (dist/'P160_TERMINAL_EVIDENCE_PACKAGE.json').write_text(json.dumps(package,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          grep -q 'HHS_PASS_160_FIBONACCI_PRIME_PSEUDORANDOM_OVERLAP_RECEIPT_TIP_VALIDATED_TRANSITION_RUNTIME_VERIFIED' evidence/pass160/P160_TERMINAL_CLASSIFICATION.txt

      - name: Commit terminal Pass 160 evidence
        working-directory: native_projects/hhs_pass160_validated_transition_runtime
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name 'hhs-pass160-evidence-closure'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin agent/pass160-validated-transition-runtime
          project='native_projects/hhs_pass160_validated_transition_runtime'
          git add -f \
            "$project/evidence/pass160" \
            "$project/dist/P160_CROSS_ARCHITECTURE_REPORT.json" \
            "$project/dist/P160_BOUNDED_FINAL_GATE_RECEIPT.json" \
            "$project/dist/P160_TERMINAL_EVIDENCE.tar.gz" \
            "$project/dist/P160_TERMINAL_EVIDENCE_PACKAGE.json" \
            "$project/dist/HHS_PASS_160_RELEASE_BUNDLE.zip" \
            "$project/HHS_PASS_160_RELEASE_BUNDLE.json" \
            "$project/HHS_PASS_160_FILE_MANIFEST.json" \
            "$project/HHS_PASS_160_RECEIPT_INDEX.json"
          git diff --cached --check
          git commit -m 'Record Pass 160 terminal evidence'
          git push origin HEAD:agent/pass160-validated-transition-runtime
