name: Pass 220 I003-I004 Cold Raw x86_64 Calibration + Genesis Halt Integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/pass220/hhs_pass220_i003_cold_x86_64_raw_bytes_abc_v1.sh'
      - 'hhs_runtime/hhs_pass220_holographic_hash216_query_v1.py'
      - 'hhs_backend/runtime/hhs_pass220_holographic_hash216_lane5_bridge_v1.py'
      - 'hhs_runtime/hhs_pass220_genesis_zero_sum_halt_v1.py'
      - 'hhs_backend/runtime/hhs_pass220_genesis_zero_sum_lane5_gate_v1.py'
      - 'tests/pass220/test_hhs_pass220_genesis_zero_sum_halt_v1.py'
      - 'docs/pass220/PASS_220_I004_GENESIS_ZERO_SUM_LO_SHU_GLOBAL_HALT.md'
      - 'tests/pass220/test_hhs_pass220_i003_four_phase_abc_max_hardware_v1.py'
      - 'docs/pass220/PASS_220_I003_FOUR_PHASE_ABC_MAX_HARDWARE_QUERY_CALIBRATION.md'
      - 'docs/operations/restart/PASS_220_I003_*'
      - 'docs/operations/restart/PASS_220_I004_*'
      - '.github/workflows/pass220-i003-four-phase-abc-max-hardware.yml'
  push:
    branches: [main, pass220-lo-shu-normalization-checkpoint-1]
    paths:
      - 'benchmarks/pass220/hhs_pass220_i003_cold_x86_64_raw_bytes_abc_v1.sh'
      - 'hhs_runtime/hhs_pass220_holographic_hash216_query_v1.py'
      - 'hhs_backend/runtime/hhs_pass220_holographic_hash216_lane5_bridge_v1.py'
      - 'hhs_runtime/hhs_pass220_genesis_zero_sum_halt_v1.py'
      - 'hhs_backend/runtime/hhs_pass220_genesis_zero_sum_lane5_gate_v1.py'
      - 'tests/pass220/test_hhs_pass220_genesis_zero_sum_halt_v1.py'
      - 'docs/pass220/PASS_220_I004_GENESIS_ZERO_SUM_LO_SHU_GLOBAL_HALT.md'
      - 'tests/pass220/test_hhs_pass220_i003_four_phase_abc_max_hardware_v1.py'
      - 'docs/pass220/PASS_220_I003_FOUR_PHASE_ABC_MAX_HARDWARE_QUERY_CALIBRATION.md'
      - 'docs/operations/restart/PASS_220_I003_*'
      - 'docs/operations/restart/PASS_220_I004_*'
      - '.github/workflows/pass220-i003-four-phase-abc-max-hardware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-raw-calibration-and-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # This MUST remain the first executable workload after checkout.
      # It invokes no project binary, HHS service, runtime ABI, make target,
      # compiler, Python interpreter, or package installation.
      - name: Cold x86_64 raw-byte four-cohort A:B:C hardware calibration
        env:
          HHS_PASS220_I003_RAW_START_BYTES: '1048576'
          HHS_PASS220_I003_RAW_LEG_BUDGET_NS: '120000000'
          HHS_PASS220_I003_RAW_GLOBAL_BUDGET_NS: '30000000000'
          HHS_PASS220_I003_RAW_REPEATS: '3'
        run: |
          bash benchmarks/pass220/hhs_pass220_i003_cold_x86_64_raw_bytes_abc_v1.sh \
            /tmp/pass220-i003/cold-raw

          set -a
          source /tmp/pass220-i003/cold-raw/summary.env
          set +a

          test "$ARCH" = "x86_64"
          test "$ALL_FOUR_COHORTS_EXECUTED" = "1"
          test "$GLOBAL_MAX_CLOSED_BYTES" -gt 0
          test "$HHS_SERVICES_USED" = "0"
          test "$HHS_RUNTIME_ABI_USED" = "0"
          test "$PROJECT_COMPILED_CODE_USED" = "0"
          test "$PYTHON_USED" = "0"
          test "$WORKLOAD_SIZE_STATIC_CEILING" = "0"
          test "$TIMING_OBSERVATIONAL_ONLY" = "1"

          cat /tmp/pass220-i003/cold-raw/report.md

      # Everything below this point is post-calibration integration.  It is
      # deliberately excluded from the max-hardware calibration measurement.
      - name: Install post-calibration integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-pytest

      - name: Build post-calibration exact ABI and Pass 207 CPU-reference driver
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          cc -std=c11 -O3 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            hhs_runtime/c/hhs_pass207_gpu_driver.c \
            -Ihhs_runtime/c -ldl \
            -o hhs_runtime/builds/libhhs_pass207_gpu_driver.so
          nm -D hhs_runtime/builds/libhhs_pass207_gpu_driver.so | grep ' hhs_pass207_gpu_vector_distance72$'

      - name: Compile post-calibration I003-I004 Python surfaces
        run: |
          python -m py_compile \
            hhs_runtime/hhs_pass220_holographic_hash216_query_v1.py \
            hhs_backend/runtime/hhs_pass220_holographic_hash216_lane5_bridge_v1.py \
            hhs_runtime/hhs_pass220_genesis_zero_sum_halt_v1.py \
            hhs_backend/runtime/hhs_pass220_genesis_zero_sum_lane5_gate_v1.py \
            benchmarks/pass220/hhs_pass220_i003_four_phase_abc_max_hardware_v1.py \
            tools/pass220/hhs_pass220_i003_four_phase_abc_analyze_v1.py \
            tests/pass220/test_hhs_pass220_i003_four_phase_abc_max_hardware_v1.py \
            tests/pass220/test_hhs_pass220_genesis_zero_sum_halt_v1.py

      - name: Run dependency-scoped I001-I004 integration tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
          HHS_PASS207_GPU_BACKEND: CPU_REFERENCE
          HHS_PASS220_I003_INTEGRATION: '1'
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/pass220/test_hhs_pass220_lo_shu_normalization_v1.py \
            tests/pass220/test_hhs_pass220_holographic_hash216_query_v1.py \
            tests/pass220/test_hhs_pass220_i003_four_phase_abc_max_hardware_v1.py \
            tests/pass220/test_hhs_pass220_genesis_zero_sum_halt_v1.py \
            | tee /tmp/pass220-i003/integration-tests.txt

      - name: Record raw-capacity normalization facts
        run: |
          set -a
          source /tmp/pass220-i003/cold-raw/summary.env
          set +a

          {
            echo "cold_raw_global_max_closed_bytes=$GLOBAL_MAX_CLOSED_BYTES"
            echo "cold_raw_xy_max_bytes=$PHASE_XY_MAX_BYTES"
            echo "cold_raw_yx_max_bytes=$PHASE_YX_MAX_BYTES"
            echo "cold_raw_zw_max_bytes=$PHASE_ZW_MAX_BYTES"
            echo "cold_raw_wz_max_bytes=$PHASE_WZ_MAX_BYTES"
            echo "cold_raw_5184_bit_state_equivalent=$((GLOBAL_MAX_CLOSED_BYTES / 648))"
            echo "cold_raw_5184_bit_state_remainder_bytes=$((GLOBAL_MAX_CLOSED_BYTES % 648))"
            echo "cold_raw_hash216_byte_equivalent=$((GLOBAL_MAX_CLOSED_BYTES / 216))"
            echo "hardware_calibration_used_hhs=0"
            echo "hardware_calibration_used_runtime_abi=0"
            echo "post_calibration_integration_is_separate=1"
          } | tee /tmp/pass220-i003/capacity-normalization.txt

      - name: Upload cold calibration and post-calibration integration evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass220-i003-cold-x86-64-raw-bytes
          path: |
            /tmp/pass220-i003/cold-raw/records.tsv
            /tmp/pass220-i003/cold-raw/summary.env
            /tmp/pass220-i003/cold-raw/report.md
            /tmp/pass220-i003/cold-raw/runner.txt
            /tmp/pass220-i003/capacity-normalization.txt
            /tmp/pass220-i003/integration-tests.txt
          if-no-files-found: error
