name: Pass 220 I027 Quantum Collapse Admission Bridge

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_quantum_collapse_admission_bridge_v1.py"
      - "tests/pass220/test_hhs_pass220_quantum_collapse_admission_bridge_v1.py"
      - "hhs_runtime/hhs_pass220_quantum_measurement_projectors_v1.py"
      - "hhs_backend/runtime/hhs_pass213_parametric_delta_v1.py"
      - "hhs_backend/runtime/hhs_pass213_compiled_rom_v1.py"
      - "hhs_backend/runtime/hhs_pass213_native_dispatch_common_v1.py"
      - "docs/pass220/PASS_220_I027_QUANTUM_COLLAPSE_ADMISSION_BRIDGE.md"
      - "evidence/pass220/i027_quantum_collapse_address_wolfram_20260922_v1.wl"
      - "evidence/pass220/i027_quantum_collapse_address_wolfram_20260922_v1.output.json"
      - "docs/operations/restart/PASS_220_I027_QUANTUM_COLLAPSE_ADMISSION_BRIDGE_RESTART.md"
      - ".github/workflows/pass220-i027-quantum-collapse-admission-bridge.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_quantum_collapse_admission_bridge_v1.py"
      - "tests/pass220/test_hhs_pass220_quantum_collapse_admission_bridge_v1.py"
      - "hhs_runtime/hhs_pass220_quantum_measurement_projectors_v1.py"
      - "hhs_backend/runtime/hhs_pass213_parametric_delta_v1.py"
      - "hhs_backend/runtime/hhs_pass213_compiled_rom_v1.py"
      - "hhs_backend/runtime/hhs_pass213_native_dispatch_common_v1.py"
      - "docs/pass220/PASS_220_I027_QUANTUM_COLLAPSE_ADMISSION_BRIDGE.md"
      - "evidence/pass220/i027_quantum_collapse_address_wolfram_20260922_v1.wl"
      - "evidence/pass220/i027_quantum_collapse_address_wolfram_20260922_v1.output.json"
      - "docs/operations/restart/PASS_220_I027_QUANTUM_COLLAPSE_ADMISSION_BRIDGE_RESTART.md"
      - ".github/workflows/pass220-i027-quantum-collapse-admission-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile I026-I027 and Pass213 dependencies
        run: |
          python -m py_compile hhs_runtime/hhs_pass220_quantum_measurement_projectors_v1.py
          python -m py_compile hhs_runtime/hhs_pass220_quantum_collapse_admission_bridge_v1.py
          python -m py_compile hhs_backend/runtime/hhs_pass213_parametric_delta_v1.py
          python -m py_compile hhs_backend/runtime/hhs_pass213_compiled_rom_v1.py

      - name: Verify Wolfram address receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("evidence/pass220/i027_quantum_collapse_address_wolfram_20260922_v1.output.json")
          data=json.loads(p.read_text())
          assert data["status"]=="PASS"
          assert data["check_count"]==data["pass_count"]==8
          assert data["failed"]==[]
          assert data["vm81_min"]==0
          assert data["vm81_max"]==80
          assert data["lo_shu_flat"]==[4,9,2,3,5,7,8,1,6]
          PY

      - name: Verify native quantum dispatch is still absent
        run: |
          python - <<'PY'
          from hhs_backend.runtime.hhs_pass213_native_dispatch_common_v1 import _NATIVE_DISPATCH_IDS
          assert "hhs.native.quantum.collapse.v1" not in _NATIVE_DISPATCH_IDS
          PY

      - name: Run I027, inherited I026, and Pass213 parametric regressions
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_quantum_collapse_admission_bridge_v1.py
          tests/pass220/test_hhs_pass220_quantum_measurement_projectors_v1.py
          tests/test_pass213_parametric_delta_v1.py
