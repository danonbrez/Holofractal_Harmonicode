name: VM81 Playable 19-Opcode Platform Game

on:
  push:
    branches:
      - main
      - agent/vm81-game-level10
      - agent/vm81-modality-evidence
      - agent/vm81-sprite-overlay-gradients
      - agent/vm81-governed-texture-layers
    paths:
      - native_projects/hhs_vm81_game_level10/**
      - hhs_runtime/include/hhs_hash216.h
      - hhs_runtime/src/hhs_hash216.c
      - .github/workflows/vm81-game-level10.yml
  pull_request:
    paths:
      - native_projects/hhs_vm81_game_level10/**
      - .github/workflows/vm81-game-level10.yml

permissions:
  contents: read

jobs:
  vm81-playable-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Ensure terminal sprite and texture media dependencies
        shell: bash
        run: |
          missing=0
          command -v ffmpeg >/dev/null || missing=1
          command -v ffprobe >/dev/null || missing=1
          python3 -c 'import PIL' >/dev/null 2>&1 || missing=1
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf || missing=1
          if [ "$missing" -ne 0 ]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg python3-pil fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
          python3 -c 'import PIL; print(PIL.__version__)'
          sha256sum /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
      - name: Compile and execute core playable sprite and texture verification
        shell: bash
        run: |
          mkdir -p native_projects/hhs_vm81_game_level10/dist
          set +e
          make -C native_projects/hhs_vm81_game_level10 test > native_projects/hhs_vm81_game_level10/dist/hosted-test.log 2>&1
          code=$?
          cat native_projects/hhs_vm81_game_level10/dist/hosted-test.log
          exit "$code"
      - name: Execute ASAN and UBSAN verification
        shell: bash
        run: |
          set +e
          make -C native_projects/hhs_vm81_game_level10 sanitize > native_projects/hhs_vm81_game_level10/dist/hosted-sanitize.log 2>&1
          code=$?
          cat native_projects/hhs_vm81_game_level10/dist/hosted-sanitize.log
          exit "$code"
      - name: Verify terminal input output and presentation media
        shell: bash
        run: |
          set +e
          make -C native_projects/hhs_vm81_game_level10 modality > native_projects/hhs_vm81_game_level10/dist/hosted-modality.log 2>&1
          code=$?
          cat native_projects/hhs_vm81_game_level10/dist/hosted-modality.log
          exit "$code"
      - name: Verify inherited sprite map overlay gradients and media
        shell: bash
        run: |
          set +e
          make -C native_projects/hhs_vm81_game_level10 sprite-modality > native_projects/hhs_vm81_game_level10/dist/hosted-sprite-modality.log 2>&1
          code=$?
          cat native_projects/hhs_vm81_game_level10/dist/hosted-sprite-modality.log
          exit "$code"
      - name: Verify governed texture layers and media
        shell: bash
        run: |
          set +e
          make -C native_projects/hhs_vm81_game_level10 texture-modality > native_projects/hhs_vm81_game_level10/dist/hosted-texture-modality.log 2>&1
          code=$?
          cat native_projects/hhs_vm81_game_level10/dist/hosted-texture-modality.log
          exit "$code"
      - name: Assert core release terminal sprite and texture evidence
        run: |
          test -x native_projects/hhs_vm81_game_level10/dist/hhs-vm81-game
          test -x native_projects/hhs_vm81_game_level10/dist/test-hhs-vm81-game
          test -x native_projects/hhs_vm81_game_level10/dist/hhs-vm81-platformer
          test -x native_projects/hhs_vm81_game_level10/dist/test-hhs-vm81-game-release
          test -x native_projects/hhs_vm81_game_level10/dist/hhs-vm81-sprite-capture
          test -x native_projects/hhs_vm81_game_level10/dist/hhs-vm81-texture-capture
          test -x native_projects/hhs_vm81_game_level10/dist/test-hhs-vm81-game-sprite
          test -x native_projects/hhs_vm81_game_level10/dist/test-hhs-vm81-game-texture
          native_projects/hhs_vm81_game_level10/dist/hhs-vm81-platformer --help
          test -s native_projects/hhs_vm81_game_level10/dist/verification.json
          test -s native_projects/hhs_vm81_game_level10/dist/playable-verification.json
          test -s native_projects/hhs_vm81_game_level10/dist/sprite-verification.txt
          test -s native_projects/hhs_vm81_game_level10/dist/texture-verification.txt
          grep -q 'VM81_C_ABI_19_OPCODE_2D_PLATFORM_DEMO_VERIFIED' native_projects/hhs_vm81_game_level10/dist/verification.json
          grep -q 'VM81_PLAYABLE_GAME_RELEASE_VERIFIED' native_projects/hhs_vm81_game_level10/dist/playable-verification.json
          grep -q 'VM81_SPRITE_MAP_OVERLAY_GRADIENTS_VERIFIED' native_projects/hhs_vm81_game_level10/dist/sprite-verification.txt
          grep -q 'VM81_GOVERNED_TEXTURE_LAYER_FOUNDATION_VERIFIED' native_projects/hhs_vm81_game_level10/dist/texture-verification.txt
          test -s native_projects/hhs_vm81_game_level10/dist/terminal-io/terminal-io-evidence.json
          grep -q 'VM81_TERMINAL_IO_MODALITY_VERIFIED' native_projects/hhs_vm81_game_level10/dist/terminal-io/terminal-io-evidence.json
          test -s native_projects/hhs_vm81_game_level10/dist/media/modality-evidence.json
          grep -q 'VM81_USER_MODALITY_PRESENTATION_EVIDENCE_VERIFIED' native_projects/hhs_vm81_game_level10/dist/media/modality-evidence.json
          test -s native_projects/hhs_vm81_game_level10/dist/sprite-capture/sprite-capture-trace.json
          test -s native_projects/hhs_vm81_game_level10/dist/sprite-media/sprite-modality-evidence.json
          grep -q 'VM81_SPRITE_MAP_OVERLAY_GRADIENTS_PRESENTATION_VERIFIED' native_projects/hhs_vm81_game_level10/dist/sprite-media/sprite-modality-evidence.json
          test -s native_projects/hhs_vm81_game_level10/dist/texture-capture/texture-capture-trace.json
          test -s native_projects/hhs_vm81_game_level10/dist/texture-capture/layers/layer-manifest.json
          grep -q 'VM81_GOVERNED_TEXTURE_LAYER_FRAME_STREAM_CAPTURED' native_projects/hhs_vm81_game_level10/dist/texture-capture/texture-capture-trace.json
          grep -q 'VM81_GOVERNED_TEXTURE_LAYER_COMPARISON_CAPTURED' native_projects/hhs_vm81_game_level10/dist/texture-capture/layers/layer-manifest.json
          test -s native_projects/hhs_vm81_game_level10/dist/texture-media/screenshots/00-texture-layer-overview.png
          test -s native_projects/hhs_vm81_game_level10/dist/texture-media/screenshots/05-governed-texture-layers.png
          test -s native_projects/hhs_vm81_game_level10/dist/texture-media/screenshots/06-texture-detail-crops.png
          test -s native_projects/hhs_vm81_game_level10/dist/texture-media/vm81-platformer-governed-textures.mp4
          test -s native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
          grep -q 'VM81_GOVERNED_TEXTURE_LAYER_PRESENTATION_VERIFIED' native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
          grep -q '"inherited_gradient_reproducible": "VERIFIED"' native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
          grep -q '"inherited_sprite_projection": "UNCHANGED"' native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
          grep -q '"state_projection_non_mutating": "VERIFIED"' native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
          grep -q '"opcode_coverage": "19/19"' native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
          grep -q '"replay": "MATCH"' native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
      - name: Upload playable game sprite texture and modality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm81-playable-game-governed-texture-release
          path: |
            native_projects/hhs_vm81_game_level10/Makefile
            native_projects/hhs_vm81_game_level10/README.md
            native_projects/hhs_vm81_game_level10/include/
            native_projects/hhs_vm81_game_level10/src/
            native_projects/hhs_vm81_game_level10/tests/
            native_projects/hhs_vm81_game_level10/tools/
            native_projects/hhs_vm81_game_level10/dist/hhs-vm81-platformer
            native_projects/hhs_vm81_game_level10/dist/hhs-vm81-game
            native_projects/hhs_vm81_game_level10/dist/hhs-vm81-sprite-capture
            native_projects/hhs_vm81_game_level10/dist/hhs-vm81-texture-capture
            native_projects/hhs_vm81_game_level10/dist/verification.json
            native_projects/hhs_vm81_game_level10/dist/playable-verification.json
            native_projects/hhs_vm81_game_level10/dist/sprite-verification.txt
            native_projects/hhs_vm81_game_level10/dist/texture-verification.txt
            native_projects/hhs_vm81_game_level10/dist/capture-command.json
            native_projects/hhs_vm81_game_level10/dist/capture/capture-trace.json
            native_projects/hhs_vm81_game_level10/dist/terminal-io/
            native_projects/hhs_vm81_game_level10/dist/media/screenshots/
            native_projects/hhs_vm81_game_level10/dist/media/vm81-platformer-playthrough.mp4
            native_projects/hhs_vm81_game_level10/dist/media/modality-evidence.json
            native_projects/hhs_vm81_game_level10/dist/sprite-capture-command.json
            native_projects/hhs_vm81_game_level10/dist/sprite-capture/sprite-capture-trace.json
            native_projects/hhs_vm81_game_level10/dist/sprite-capture/layers/
            native_projects/hhs_vm81_game_level10/dist/sprite-media/screenshots/
            native_projects/hhs_vm81_game_level10/dist/sprite-media/vm81-platformer-sprite-gradients.mp4
            native_projects/hhs_vm81_game_level10/dist/sprite-media/sprite-modality-evidence.json
            native_projects/hhs_vm81_game_level10/dist/texture-capture-command.json
            native_projects/hhs_vm81_game_level10/dist/texture-capture/texture-capture-trace.json
            native_projects/hhs_vm81_game_level10/dist/texture-capture/layers/
            native_projects/hhs_vm81_game_level10/dist/texture-media/screenshots/
            native_projects/hhs_vm81_game_level10/dist/texture-media/vm81-platformer-governed-textures.mp4
            native_projects/hhs_vm81_game_level10/dist/texture-media/texture-modality-evidence.json
            native_projects/hhs_vm81_game_level10/dist/hosted-test.log
            native_projects/hhs_vm81_game_level10/dist/hosted-sanitize.log
            native_projects/hhs_vm81_game_level10/dist/hosted-modality.log
            native_projects/hhs_vm81_game_level10/dist/hosted-sprite-modality.log
            native_projects/hhs_vm81_game_level10/dist/hosted-texture-modality.log
            native_projects/hhs_vm81_game_level10/dist/terminal-io-evidence.log
            native_projects/hhs_vm81_game_level10/dist/modality-evidence.log
            native_projects/hhs_vm81_game_level10/dist/sprite-modality.log
            native_projects/hhs_vm81_game_level10/dist/texture-modality.log
            native_projects/hhs_vm81_game_level10/specs/HHS_VM81_GAME_LEVEL10_CONTRACT.json
            native_projects/hhs_vm81_game_level10/specs/HHS_VM81_PLAYABLE_GAME_RELEASE_CONTRACT.json
            native_projects/hhs_vm81_game_level10/specs/HHS_VM81_USER_MODALITY_EVIDENCE_CONTRACT.json
            native_projects/hhs_vm81_game_level10/specs/HHS_VM81_SPRITE_MAP_OVERLAY_GRADIENTS_CONTRACT.json
            native_projects/hhs_vm81_game_level10/specs/HHS_VM81_GOVERNED_TEXTURE_LAYERS_CONTRACT.json
            hhs_runtime/include/hhs_hash216.h
            hhs_runtime/src/hhs_hash216.c
          if-no-files-found: warn
