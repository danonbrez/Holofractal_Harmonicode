name: Pass219 HHCQ Symbolic Phase Gear Phase11 Repair

on:
  push:
    branches:
      - agent/pass219-hhcq-phase11-symbolic-type-repair-20260908
    paths:
      - 'hhs_runtime/include/hhs_pass219_hhcq_symbolic_phase_gear_1_32.h'
      - 'hhs_runtime/c/hhs_pass219_hhcq_symbolic_phase_gear_1_32.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_hhcq_symbolic_phase_gear_1_32.c'
      - 'benchmarks/pass219/hhcq_symbolic_phase_gear_phase11_repair_benchmark.cpp'
      - 'docs/operations/restart/PASS_219_PHASE11_SYMBOLIC_TYPE_AUTHORITY_REPAIR_20260908.md'
      - 'docs/operations/restart/PASS_219_PHASE11_SYMBOLIC_TYPE_AUTHORITY_PRECI_20260908.md'
      - '.github/workflows/pass219-hhcq-symbolic-phase-gear-phase11-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  symbolic-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
    steps:
      - name: Check out symbolic repair branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build exact ABI
        run: |
          set -o pipefail
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Compile and run strict symbolic type-authority invariants
        run: |
          set -o pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_hhcq_symbolic_phase_gear_1_32.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-symbolic-phase-test
          /tmp/pass219-symbolic-phase-test

      - name: Reuse frozen Phase3 authenticated hydrated-weight artifact
        uses: actions/download-artifact@v4
        with:
          name: pass219-core-dynamic-circuit-experiment
          path: /tmp/pass219-phase3-artifact
          github-token: ${{ github.token }}
          repository: danonbrez/Holofractal_Harmonicode
          run-id: 34138427959

      - name: Verify frozen Phase3 frame binary
        run: |
          FRAME="$(find /tmp/pass219-phase3-artifact -name PASS_219_PHASE3_HYDRATED_WEIGHT_FRAMES.bin -print -quit)"
          test -n "$FRAME"
          test -s "$FRAME"
          echo '63d0f8816d4c04e10eb5d9644c9c60015b8cdd3b1235f114b3f1821ef08a3433  '"$FRAME" | sha256sum -c -
          printf '%s\n' "$FRAME" > /tmp/pass219-phase3-frame-path
          sha256sum "$FRAME" > /tmp/pass219-phase3-frame.sha256

      - name: Compile and run authenticated symbolic repair benchmark
        run: |
          set -o pipefail
          mkdir -p artifacts/pass219/phase11-symbolic-repair
          FRAME="$(cat /tmp/pass219-phase3-frame-path)"
          c++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/hhcq_symbolic_phase_gear_phase11_repair_benchmark.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-symbolic-phase-benchmark
          /tmp/pass219-symbolic-phase-benchmark "$FRAME" \
            | tee artifacts/pass219/phase11-symbolic-repair/hhcq_symbolic_phase_gear.json
          cp /tmp/pass219-phase3-frame.sha256 artifacts/pass219/phase11-symbolic-repair/phase3_frame.sha256

      - name: Validate symbolic repair evidence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/pass219/phase11-symbolic-repair/hhcq_symbolic_phase_gear.json')
          d = json.loads(p.read_text())
          assert d['schema'] == 'HHS_PASS219_HHCQ_SYMBOLIC_PHASE_GEAR_PHASE11_REPAIR_V1'
          assert d['classification'] == 'SYMBOLIC_TYPE_AUTHORITY_REPAIRED'
          assert d['phase3_frame_binary_sha256'] == '63d0f8816d4c04e10eb5d9644c9c60015b8cdd3b1235f114b3f1821ef08a3433'
          assert d['summary_records'] == 529
          assert d['authenticated_unique_digests'] == 489
          assert d['local_samples'] == 4761
          assert d['phase5_exact_roundtrip_checks'] == 4761
          assert d['raw_projection_checks'] == 4761
          assert d['raw_projection_admitted'] + d['raw_projection_rejected'] == 4761
          assert d['raw_zero_xy_projection_count'] == 2
          assert d['raw_zero_xy_admitted'] == 0
          assert d['symbolic_direct_checks'] == 4761
          assert d['symbolic_reverse_checks'] == 4761
          assert d['symbolic_mixed_checks'] == 9522
          assert d['symbolic_manifold_checks'] == 19044
          assert d['symbolic_replay_checks'] == 19044
          assert d['phase11_scalar_equilibrium_superseded'] is True
          assert d['phase11_scalar_parity_superseded'] is True
          assert d['raw_phase_residue_authority'] is False
          assert d['scalar_phase_sum_authority'] is False
          assert d['scalar_x_parity_authority'] is False
          assert d['phase10_projection_witness_only'] is True
          assert d['symbolic_x_squared_is_i2'] is True
          assert d['candidate_only'] is True
          assert d['canonical_authority_changed'] is False
          assert d['floating_point_authority'] is False
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Record symbolic repair summary
        if: always()
        run: |
          {
            echo '### Pass219 Phase11 symbolic type-authority repair'
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            if test -f artifacts/pass219/phase11-symbolic-repair/hhcq_symbolic_phase_gear.json; then
              echo '```json'
              cat artifacts/pass219/phase11-symbolic-repair/hhcq_symbolic_phase_gear.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload symbolic repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass219-hhcq-symbolic-phase-gear-phase11-repair
          path: artifacts/pass219/phase11-symbolic-repair
          if-no-files-found: warn
