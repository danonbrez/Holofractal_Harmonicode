name: Validate HHS Pass 161 Production Harmonizer

on:
  push:
    branches: [main]
    paths:
      - "applications/holofractal_harmonizer/**"
      - "HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md"
      - "HHS_PASS_161_AUTHORITY_BINDING.json"
      - "hhs_backend/server.py"
      - "hhs_backend/production_server.py"
      - "hhs_backend/api/installation_routes.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "hhs_backend/api/pass166_word2vec_routes.py"
      - "hhs_backend/api/runtime_routes.py"
      - "hhs_backend/runtime/live_fastapi_workflow_v1.py"
      - "hhs_backend/runtime/hhs_production_assistant_v1.py"
      - "hhs_backend/runtime/hhs_native_litert_lm_provider_v1.py"
      - "hhs_backend/runtime/hhs_litert_lm_hhs_api_assistant_v1.py"
      - "tests/test_hhs_production_public_app_v1.py"
      - "Procfile"
      - "bin/post_compile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "applications/holofractal_harmonizer/**"
      - "HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md"
      - "HHS_PASS_161_AUTHORITY_BINDING.json"
      - "hhs_backend/server.py"
      - "hhs_backend/production_server.py"
      - "hhs_backend/api/installation_routes.py"
      - "hhs_backend/api/litert_lm_assistant_routes.py"
      - "hhs_backend/api/pass166_word2vec_routes.py"
      - "hhs_backend/api/runtime_routes.py"
      - "hhs_backend/runtime/live_fastapi_workflow_v1.py"
      - "hhs_backend/runtime/hhs_production_assistant_v1.py"
      - "hhs_backend/runtime/hhs_native_litert_lm_provider_v1.py"
      - "hhs_backend/runtime/hhs_litert_lm_hhs_api_assistant_v1.py"
      - "tests/test_hhs_production_public_app_v1.py"
      - "Procfile"
      - "bin/post_compile"
      - ".github/workflows/hhs-runtime-os-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hhs-pass161-production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-production-harmonizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-scoped backend and browser requirements
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'cryptography>=46.0,<47.0' \
            playwright \
            pytest

      - name: Build native Hash72 runtime and assistant authority
        env:
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "0.5"
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Validate canonical backend and real execution authorities
        env:
          HHS_DISABLE_C_AUTOBUILD: "1"
          HHS_LITERT_LM_BACKEND: auto
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "0.5"
        run: |
          timeout 300s pytest -q tests/test_hhs_production_public_app_v1.py
          timeout 180s python - <<'PY'
          from pathlib import Path
          from hhs_backend.production_server import app, VISUAL_ROOT, _workspace_session_snapshot
          from hhs_backend.server import server_self_test

          paths = {str(getattr(route, "path", "")) for route in app.router.routes}
          required = {
              "/api/product/health",
              "/api/runtime/authority/status",
              "/api/runtime/services",
              "/api/runtime/services/dispatch",
              "/api/runtime/workspace/session",
              "/api/runtime/workspace/command",
              "/api/runtime/installation/status",
              "/api/assistant/health",
              "/api/assistant/chat",
              "/v1/modalities/language/models/word2vec/status",
              "/ws/runtime",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"missing production routes: {missing}")
          if "" not in paths and "/" not in paths:
              raise SystemExit("missing verified Pass 161 public root mount")
          if VISUAL_ROOT != Path("applications/holofractal_harmonizer").resolve():
              raise SystemExit(f"wrong production visual root: {VISUAL_ROOT}")
          if not any(getattr(route, "name", None) == "hhs-production-harmonizer" for route in app.router.routes):
              raise SystemExit("verified Harmonizer is not the production static mount")
          session = _workspace_session_snapshot()
          if session.get("self_tests_executed") is not False:
              raise SystemExit("workspace session executed production self-tests")
          server_self_test()
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate terminal Pass 161 browser and workflow-first integration
        working-directory: applications/holofractal_harmonizer
        run: |
          timeout 300s npm test
          timeout 180s npm run audit:browser
          timeout 60s node --check src/browser.mjs
          timeout 60s node --check src/ux-default.mjs
          timeout 60s node --check src/production-integration.mjs
          timeout 60s python -m py_compile ux_lab/production_smoke.py

      - name: Install bounded Chromium runtime
        run: timeout 600s python -m playwright install --with-deps chromium

      - name: Browser-verify production server and executable registry
        env:
          HHS_DISABLE_C_AUTOBUILD: "1"
          HHS_LITERT_LM_BACKEND: auto
          HHS_NATIVE_LANGUAGE_REQUIRE_WORD2VEC: "0"
          HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: "5"
          HHS_PRODUCTION_SMOKE_URL: "http://127.0.0.1:8765"
        run: |
          set -euo pipefail
          python -m uvicorn hhs_backend.production_server:app \
            --host 127.0.0.1 --port 8765 --workers 1 --log-level info \
            > /tmp/hhs-pass161-production-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8765/api/system/status > /tmp/hhs-system-status.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/hhs-pass161-production-server.log
            exit 1
          fi
          timeout 240s python applications/holofractal_harmonizer/ux_lab/production_smoke.py
          cat applications/holofractal_harmonizer/evidence/production_integration_smoke/production-smoke.json

      - name: Verify authoritative usability evidence remains bound
        run: |
          grep -q 'WORKFLOW_FIRST_PROGRESSIVE_DISCLOSURE' HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md
          grep -q '50%' HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md
          grep -q '75%' HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md
          grep -q '39%' HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md
          grep -q '"omega_161": true' applications/holofractal_harmonizer/HHS_PASS_161_TERMINAL_RELEASE.json
          grep -q '"browser_complete": true' applications/holofractal_harmonizer/evidence/pass161/P161_COMPLETION_RECEIPT.json

      - name: Verify production projection and executable registry integration
        run: |
          grep -q 'HHS LiteRT-LM Development Assistant' applications/holofractal_harmonizer/index.html
          grep -q 'src/browser.mjs' applications/holofractal_harmonizer/index.html
          grep -q 'src/ux-default.mjs' applications/holofractal_harmonizer/index.html
          grep -q 'src/production-integration.mjs' applications/holofractal_harmonizer/index.html
          grep -q '/api/runtime/services/dispatch' applications/holofractal_harmonizer/src/production-integration.mjs
          grep -q 'runtime.registry.register' applications/holofractal_harmonizer/src/production-integration.mjs
          grep -q 'Execute registered service' applications/holofractal_harmonizer/src/production-integration.mjs
          grep -q 'VISUAL_ROOT = ROOT_DIR / "applications" / "holofractal_harmonizer"' hhs_backend/production_server.py
          grep -q 'hhs-production-harmonizer' hhs_backend/production_server.py
          grep -q '"ok": true' applications/holofractal_harmonizer/evidence/production_integration_smoke/production-smoke.json
          grep -q '"dispatch_result_schema_present": true' applications/holofractal_harmonizer/evidence/production_integration_smoke/production-smoke.json
          if grep -q 'RUNTIME_OS_ROOT = ROOT_DIR / "hhs_gui" / "dist"' hhs_backend/production_server.py; then
            echo "Replacement hhs_gui shell remains the production root"
            exit 1
          fi
          if grep -q 'new HarmonizerRuntime' applications/holofractal_harmonizer/src/production-integration.mjs; then
            echo "Production integration created an alternate frontend runtime"
            exit 1
          fi

      - name: Upload verified production visual application
        uses: actions/upload-artifact@v4
        with:
          name: hhs-pass161-production-harmonizer
          path: |
            applications/holofractal_harmonizer/index.html
            applications/holofractal_harmonizer/src/**
            applications/holofractal_harmonizer/HHS_PASS_161_TERMINAL_RELEASE.json
            applications/holofractal_harmonizer/evidence/pass161/P161_COMPLETION_RECEIPT.json
            applications/holofractal_harmonizer/evidence/ux_ab_optimization_v1/metrics.json
            applications/holofractal_harmonizer/evidence/production_integration_smoke/**
            HHS_VISUAL_IDE_PARALLEL_AB_USABILITY_REPORT.md
          if-no-files-found: error
          retention-days: 14
