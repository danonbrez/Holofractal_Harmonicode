name: Pass 220 Structural Reuse
on:
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/pass220/lane5_structural_reuse_candidate.py'
      - 'tests/pass220/test_lane5_structural_reuse_candidate.py'
      - '.github/workflows/pass220-structural-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pip install pytest
          python -m pytest -q tests/pass220/test_lane5_trajectory_relations.py tests/pass220/test_lane5_structural_reuse_candidate.py
