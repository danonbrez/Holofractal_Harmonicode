name: Pass 194 I132 Storage Training Validation

on:
  push:
    branches:
      - agent/pass219-iteration132-pass194-storage-training-membrane
    paths:
      - 'hhs_backend/runtime/hhs_pass194_multimodal_storage_training_v1.py'
      - 'hhs_backend/api/pass194_storage_training_routes.py'
      - 'tests/test_hhs_pass194_multimodal_storage_training_v1.py'
      - 'tests/test_hhs_pass194_storage_training_routes.py'
      - '.github/workflows/pass194-i132-storage-training-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hhs_backend/runtime/hhs_pass194_multimodal_storage_training_v1.py'
      - 'hhs_backend/api/pass194_storage_training_routes.py'
      - 'tests/test_hhs_pass194_multimodal_storage_training_v1.py'
      - 'tests/test_hhs_pass194_storage_training_routes.py'
      - '.github/workflows/pass194-i132-storage-training-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Prove Pass 194 contract and frozen I131 lineage
        run: |
          git merge-base --is-ancestor 714f3f3c5c77eab9714be421811ce4fd650a8e99 HEAD
          git merge-base --is-ancestor b8202201bc92470afdd15d701d16ea102aeb3aab HEAD
          test -f docs/pass194/HHS_PASS_194_USER_MULTIMODAL_FILE_FOLDER_HYDRATION_SNAPSHOT_SQL_CONTEXT_VECTOR_STORE_AGI_TRAINING_AUTHORITY.md
      - name: Compile Pass 194 runtime and API
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass194_multimodal_storage_training_v1.py \
            hhs_backend/api/pass194_storage_training_routes.py \
            tests/test_hhs_pass194_multimodal_storage_training_v1.py \
            tests/test_hhs_pass194_storage_training_routes.py
      - name: Run Pass 194 runtime and API regressions
        run: |
          PYTHONPATH="$PWD" python -m unittest -v \
            tests.test_hhs_pass194_multimodal_storage_training_v1 \
            tests.test_hhs_pass194_storage_training_routes
