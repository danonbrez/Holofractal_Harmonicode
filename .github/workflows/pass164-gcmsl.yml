name: Pass 164 GCMSL

on:
  pull_request:
    paths:
      - "hhs_runtime/core/hash72_*"
      - "hhs_runtime/pass163/**"
      - "hhs_runtime/pass164/**"
      - "hhs_backend/api/pass164_gcmsl_routes.py"
      - "hhs_backend/pass164_server.py"
      - "native_projects/hhs_pass163_vmrc/**"
      - "native_projects/hhs_pass164_gcmsl/**"
      - "tests/test_hash72_digest_v1.py"
      - "tests/test_hhs_pass163_vmrc_v1.py"
      - "tests/test_hhs_pass164_gcmsl_v1.py"
      - ".github/workflows/pass164-gcmsl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scoped-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi pydantic
      - name: Python Hash72 + Pass 163 + Pass 164 matrix
        run: >-
          python -m pytest -q
          tests/test_hash72_digest_v1.py
          tests/test_hhs_pass163_vmrc_v1.py
          tests/test_hhs_pass164_gcmsl_v1.py
      - name: Strict C11 Pass 163
        run: make -C native_projects/hhs_pass163_vmrc clean test
      - name: Strict C11 Pass 164
        run: make -C native_projects/hhs_pass164_gcmsl clean test
