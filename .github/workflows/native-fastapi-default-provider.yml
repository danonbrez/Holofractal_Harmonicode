name: Lane 5 Native Capability Provider

on:
  push:
    branches:
      - 'repair/native-fastapi-default-provider'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  HHS_LANE5_PROVIDER_CONTEXT: 'pull_request'

jobs:
  lane5-native-capability-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native-core validation prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check \
            pytest numpy matplotlib cryptography

      - name: Prove external FastAPI is absent for native-core validation
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("fastapi") is None
          assert importlib.util.find_spec("starlette") is None
          print("EXTERNAL_FASTAPI_ABSENT=YES")
          PY

      - name: Compile changed Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile \
            hhs_backend/runtime/hhs_fastapi_provider_v1.py \
            hhs_runtime/hhs_lane5_native_capability_provider_v1.py \
            hhs_backend/runtime/hhs_native_fastapi_compat_v1.py \
            hhs_backend/runtime/runtime_ws.py \
            hhs_backend/runtime/live_fastapi_workflow_v1.py \
            hhs_backend/runtime/hhs_pass201_public_api_federation.py \
            hhs_backend/server.py \
            tests/pass220/test_hhs_native_fastapi_default_provider_v1.py \
            tests/pass220/test_hhs_lane5_native_capability_provider_v1.py

      - name: Resolve PR providers and emit fallback warnings
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import importlib.util
          from hhs_runtime.hhs_lane5_native_capability_provider_v1 import (
              lane5_capability_provider_status,
              resolve_lane5_capability,
          )

          status = lane5_capability_provider_status(provider_context="pull_request")
          fallback_rows = [
              row for row in status["capabilities"]
              if row["pull_request_fallback_used"]
          ]
          fallback_ids = {row["capability_id"] for row in fallback_rows}
          assert "matplotlib" in fallback_ids
          assert "fastapi_application" in fallback_ids
          assert importlib.util.find_spec("matplotlib") is not None
          assert importlib.util.find_spec("fastapi") is None

          for row in fallback_rows:
              warning = row["warning"]
              print(f"::warning title=Lane 5 provider fallback::{warning}")
              resolution = resolve_lane5_capability(
                  row["capability_id"],
                  provider_context="pull_request",
              )
              assert resolution.provider == "external"
              assert resolution.fallback_used is True
              assert resolution.warning == warning
          PY

      - name: Build cumulative exact ABI
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Build and test native FastAPI C11 route kernel
        shell: bash
        run: |
          set -euo pipefail
          make -C native_projects/hhs_pass220_fastapi_native_route_kernel clean all test

      - name: Native-core provider and service-registry regression
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/pass220/test_hhs_native_fastapi_default_provider_v1.py \
            tests/pass220/test_hhs_lane5_native_capability_provider_v1.py \
            tests/test_hhs_service_registry_v1.py \
            tests/test_hhs_websocket_kernel_channel_binding_pass045_v1.py

      - name: Install declared external FastAPI application fallback
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pip install --disable-pip-version-check \
            'fastapi==0.128.2' \
            'starlette==0.50.0' \
            'pydantic>=2.7,<3.0'
          .venv/bin/python - <<'PY'
          import fastapi, pydantic, starlette
          print("FASTAPI_EXTERNAL_FALLBACK_READY", fastapi.__version__, starlette.__version__, pydantic.__version__)
          PY

      - name: Extended FastAPI application compatibility regression
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
          HHS_LANE5_PROVIDER_FASTAPI: 'external'
          HHS_LANE5_PROVIDER_FASTAPI_APPLICATION: 'external'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=Lane 5 provider fallback::HHS_LANE5_PR_EXTERNAL_PROVIDER_FALLBACK:fastapi_application:native_unavailable=HHS_LANE5_NATIVE_IMPLEMENTATION_UNAVAILABLE:fastapi_application:external=FastAPI/Starlette/Pydantic extended application composition:compatibility_only_no_canonical_authority"
          .venv/bin/python -m pytest -q \
            tests/test_hhs_live_fastapi_runtime_pass045_v1.py
