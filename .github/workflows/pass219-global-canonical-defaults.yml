name: Pass 219 Global Canonical Defaults
on:
  push:
    branches:
      - main
      - agent/pass219-global-canonical-defaults-main-repair
    paths:
      - contracts/pass219/PASS_219_GLOBAL_CANONICAL_DEFAULTS_1_0.json
      - contracts/pass219/PASS_219_MULTIMODAL_OPTIMIZATION_GENERALIZATION_1_0.json
      - contracts/pass219/PASS_219_MANDATORY_GENESIS_SCALING_DATA_ML_1_22.json
      - contracts/pass219/PASS_219_GLOBAL_LATENCY_POLICY_25_3_1_0.json
      - docs/pass219/PASS_219_GLOBAL_LATENCY_POLICY_25_3_BENCHMARK_RESULTS.md
      - hhs_runtime/include/hhs_pass219_global_latency_policy_25_3_1_0.h
      - hhs_runtime/c/hhs_pass219_global_latency_policy_25_3_1_0.inc
      - hhs_runtime/hhs_pass219_global_latency_policy_registration_v1.py
      - tests/pass219/test_pass219_global_latency_policy_25_3_1_0.*
      - tests/pass219/test_pass219_global_latency_policy_registration_v1.py
      - contracts/pass219/PASS_219_GLOBAL_LATENCY_POLICY_25_3_1_0.json
      - docs/pass219/PASS_219_GLOBAL_LATENCY_POLICY_25_3_BENCHMARK_RESULTS.md
      - hhs_runtime/include/hhs_pass219_global_latency_policy_25_3_1_0.h
      - hhs_runtime/c/hhs_pass219_global_latency_policy_25_3_1_0.inc
      - hhs_runtime/hhs_pass219_global_latency_policy_registration_v1.py
      - tests/pass219/test_pass219_global_latency_policy_25_3_1_0.*
      - tests/pass219/test_pass219_global_latency_policy_registration_v1.py
      - docs/architecture/HHS_CUMULATIVE_PASS_GLOBAL_DEFAULTS.md
      - docs/architecture/HHS_MULTIMODAL_OPTIMIZATION_GENERALIZATION.md
      - docs/pass219/PASS_219_I140_INHERITED_PASS186_FULL_BINDING.md
      - hhs_runtime/include/hhs_runtime_exact_abi.h
      - hhs_runtime/c/hhs_runtime_exact_abi.c
      - hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.*
      - hhs_runtime/c/hhs_pass219_global_canonical_defaults_1_0.inc
      - tools/validate_pass219_global_canonical_defaults.py
      - tests/pass219/test_pass219_global_canonical_defaults_1_0.*
      - .github/workflows/pass219-global-canonical-defaults.yml
  pull_request:
    paths:
      - contracts/pass219/PASS_219_GLOBAL_CANONICAL_DEFAULTS_1_0.json
      - contracts/pass219/PASS_219_MULTIMODAL_OPTIMIZATION_GENERALIZATION_1_0.json
      - contracts/pass219/PASS_219_MANDATORY_GENESIS_SCALING_DATA_ML_1_22.json
      - docs/architecture/HHS_CUMULATIVE_PASS_GLOBAL_DEFAULTS.md
      - docs/architecture/HHS_MULTIMODAL_OPTIMIZATION_GENERALIZATION.md
      - docs/pass219/PASS_219_I140_INHERITED_PASS186_FULL_BINDING.md
      - hhs_runtime/include/hhs_runtime_exact_abi.h
      - hhs_runtime/c/hhs_runtime_exact_abi.c
      - hhs_runtime/include/hhs_pass219_global_canonical_defaults_1_0.*
      - hhs_runtime/c/hhs_pass219_global_canonical_defaults_1_0.inc
      - tools/validate_pass219_global_canonical_defaults.py
      - tests/pass219/test_pass219_global_canonical_defaults_1_0.*
      - .github/workflows/pass219-global-canonical-defaults.yml
permissions:
  contents: read
jobs:
  global-defaults:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate contract census and repair-forward debt
        run: python tools/validate_pass219_global_canonical_defaults.py
      - name: Compile aggregate exact ABI
        run: |
          mkdir -p /tmp/pass219-global-defaults
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -c hhs_runtime/c/hhs_runtime_exact_abi.c -o /tmp/pass219-global-defaults/exact.o
      - name: Revalidate current inherited tail
        run: make -C native_projects/hhs_pass186_x64_vm81_q144 clean test disassemble
      - name: Compile current Pass 186 dependency objects
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Inative_projects/hhs_pass186_x64_vm81_q144/include -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_vm81_q144_abi.c -o /tmp/pass219-global-defaults/pass186.o
          gcc -c native_projects/hhs_pass186_x64_vm81_q144/src/hhs_pass186_x64_registers.S -o /tmp/pass219-global-defaults/registers.o
      - name: Run global-default C conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.c /tmp/pass219-global-defaults/exact.o /tmp/pass219-global-defaults/pass186.o /tmp/pass219-global-defaults/registers.o -o /tmp/pass219-global-defaults/global-defaults-c
          /tmp/pass219-global-defaults/global-defaults-c
      - name: Run global-default C++ conformance
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_canonical_defaults_1_0.cpp /tmp/pass219-global-defaults/exact.o /tmp/pass219-global-defaults/pass186.o /tmp/pass219-global-defaults/registers.o -o /tmp/pass219-global-defaults/global-defaults-cpp
          /tmp/pass219-global-defaults/global-defaults-cpp
      - name: Run promoted global latency policy conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_latency_policy_25_3_1_0.c /tmp/pass219-global-defaults/exact.o /tmp/pass219-global-defaults/pass186.o /tmp/pass219-global-defaults/registers.o -o /tmp/pass219-global-defaults/latency-c
          /tmp/pass219-global-defaults/latency-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_global_latency_policy_25_3_1_0.cpp /tmp/pass219-global-defaults/exact.o /tmp/pass219-global-defaults/pass186.o /tmp/pass219-global-defaults/registers.o -o /tmp/pass219-global-defaults/latency-cpp
          /tmp/pass219-global-defaults/latency-cpp
          python -m pytest -q tests/pass219/test_pass219_global_latency_policy_registration_v1.py
      - name: Preserve current I140 C/C++ membrane conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass186_1_40.c /tmp/pass219-global-defaults/exact.o /tmp/pass219-global-defaults/pass186.o /tmp/pass219-global-defaults/registers.o -o /tmp/pass219-global-defaults/pass186-c
          /tmp/pass219-global-defaults/pass186-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass186_1_40.cpp /tmp/pass219-global-defaults/exact.o /tmp/pass219-global-defaults/pass186.o /tmp/pass219-global-defaults/registers.o -o /tmp/pass219-global-defaults/pass186-cpp
          /tmp/pass219-global-defaults/pass186-cpp
      - name: Emit policy receipt
        if: always()
        run: |
          mkdir -p evidence/pass219/global-defaults
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          payload={"schema":"HHS_PASS219_GLOBAL_CANONICAL_DEFAULTS_RECEIPT_V1","head":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"tree":subprocess.check_output(["git","rev-parse","HEAD^{tree}"],text=True).strip(),"classification":"HHS_PASS219_GLOBAL_CANONICAL_DEFAULTS_ENFORCED","wired_ceiling":218,"wired_floor":186,"binding_count":35,"pass157":"MISSING_CUMULATIVE_EXPOSURE_REPAIR_FORWARD_REQUIRED"}
          encoded=json.dumps(payload,sort_keys=True,separators=(",",":")).encode();payload["receipt_sha256"]=hashlib.sha256(encoded).hexdigest()
          Path("evidence/pass219/global-defaults/PASS_219_GLOBAL_CANONICAL_DEFAULTS_RECEIPT.json").write_text(json.dumps(payload,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-global-canonical-defaults-receipt
          path: evidence/pass219/global-defaults/PASS_219_GLOBAL_CANONICAL_DEFAULTS_RECEIPT.json
          if-no-files-found: error
