name: Pass 219 Lane 5 Reciprocal Phase Boundary 1.53

on:
  push:
    branches:
      - pass219/lane5-reciprocal-phase-boundary-1-53
    paths:
      - 'hhs_runtime/harmonicode_lane5_reciprocal_phase_boundary_v1.py'
      - 'tests/pass219/test_harmonicode_lane5_reciprocal_phase_boundary_v1.py'
      - 'contracts/pass219/PASS_219_LANE5_RECIPROCAL_PHASE_BOUNDARY_1_53.md'
      - 'contracts/pass219/PASS_219_LANE5_RECIPROCAL_PHASE_BOUNDARY_1_53.json'
      - 'docs/HARMONICODE_SPEC_v1.md'
      - 'docs/whitepapers/HHS_LANE5_RECIPROCAL_PHASE_BOUNDARY_1_53_V1.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'evidence/pass219/hhs_lane5_reciprocal_phase_boundary_v1.wl'
      - 'evidence/pass219/hhs_lane5_reciprocal_phase_boundary_v1.output.json'
      - 'evidence/pass219/hhs_lane5_reciprocal_phase_boundary_v1.receipt.json'
      - '.github/workflows/pass219-lane5-reciprocal-phase-boundary-1-53.yml'
  pull_request:
    branches:
      - pass219/lane5-bigint-nested-transcription-1-52
    paths:
      - 'hhs_runtime/harmonicode_lane5_reciprocal_phase_boundary_v1.py'
      - 'tests/pass219/test_harmonicode_lane5_reciprocal_phase_boundary_v1.py'
      - 'contracts/pass219/PASS_219_LANE5_RECIPROCAL_PHASE_BOUNDARY_1_53.md'
      - 'contracts/pass219/PASS_219_LANE5_RECIPROCAL_PHASE_BOUNDARY_1_53.json'
      - 'docs/HARMONICODE_SPEC_v1.md'
      - 'docs/whitepapers/HHS_LANE5_RECIPROCAL_PHASE_BOUNDARY_1_53_V1.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'evidence/pass219/hhs_lane5_reciprocal_phase_boundary_v1.wl'
      - 'evidence/pass219/hhs_lane5_reciprocal_phase_boundary_v1.output.json'
      - 'evidence/pass219/hhs_lane5_reciprocal_phase_boundary_v1.receipt.json'
      - '.github/workflows/pass219-lane5-reciprocal-phase-boundary-1-53.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reciprocal-phase-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped tools
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run typed theorem and inherited serializer tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/pass219/test_harmonicode_lane5_reciprocal_phase_boundary_v1.py \
            tests/pass219/test_harmonicode_lane5_bigint_transcription_v1.py \
            tests/pass219/test_harmonicode_directed_constraint_semantics_v1.py \
            tests/pass220/test_hhs_pass220_rna_hash72_dna_qudit_phase_lock_v1.py
          python -m hhs_runtime.harmonicode_lane5_reciprocal_phase_boundary_v1 > /tmp/hhs-lane5-1-53.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/hhs-lane5-1-53.json'))
          assert d['result']=='PASS'
          assert d['check_count']==20
          assert all(d['checks'].values())
          assert d['law_count']==12
          assert d['prohibited_rewrite_count']==7
          PY

      - name: Verify machine theorem record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('contracts/pass219/PASS_219_LANE5_RECIPROCAL_PHASE_BOUNDARY_1_53.json').read_text())
          t=d['hhs_exact_formalization']
          assert t['theorem_id']=='HHS-T5184-002'
          assert t['status']=='EXECUTED_EXACT'
          assert t['topological_invariants']['non_cancellable_denominator']=='Cancel_∆(S)=forbidden'
          assert t['topological_invariants']['scale_differentiation']=='P≠∞'
          assert len(t['prohibited_rewrites'])==7
          PY

      - name: Verify sealed Wolfram witness
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          receipt=json.loads(Path('evidence/pass219/hhs_lane5_reciprocal_phase_boundary_v1.receipt.json').read_text())
          for kind in ('source','output'):
              path=Path(receipt[f'{kind}_path'])
              raw=path.read_bytes()
              assert len(raw)==receipt[f'{kind}_bytes']
              assert sha256(raw).hexdigest()==receipt[f'{kind}_sha256']
          output=json.loads(Path(receipt['output_path']).read_text())
          assert receipt['result']=='PASS'
          assert receipt['checks_passed']==receipt['checks_total']==18
          assert output['theorem_id']=='HHS-T5184-002'
          assert output['status']=='PASS'
          assert all(output['checks'].values())
          assert output['delta_cancellation_authority'] is False
          assert output['ordinary_inverse_authority'] is False
          assert output['commutation_authority'] is False
          assert output['scalar_exponent_combination_authority'] is False
          PY

      - name: Seal 1.53 summary
        run: |
          mkdir -p artifacts/pass219/1.53
          cp /tmp/hhs-lane5-1-53.json artifacts/pass219/1.53/runtime-validation.json
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          summary={
            'schema':'HHS_PASS219_LANE5_RECIPROCAL_PHASE_BOUNDARY_EVIDENCE_1_53',
            'theorem_id':'HHS-T5184-002',
            'result':'PASS',
            'runtime_checks':20,
            'wolfram_checks':18,
            'delta_cancellation_authority':False,
            'ordinary_inverse_authority':False,
            'commutation_authority':False,
            'scalar_exponent_combination_authority':False,
            'p_not_infinity':True,
            'serializer_1_52_reused':True,
            'canonical_vm81_mutation_authority':False,
            'canonical_hash72_authority':False,
            'canonical_hash216_authority':False,
            'source_complete_formalization_status':'IN_PROGRESS',
          }
          canonical=json.dumps(summary,sort_keys=True,separators=(',',':')).encode()
          summary['receipt_sha256']=sha256(canonical).hexdigest()
          Path('artifacts/pass219/1.53/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pass219-lane5-reciprocal-phase-boundary-1-53
          path: artifacts/pass219/1.53/
          if-no-files-found: error
