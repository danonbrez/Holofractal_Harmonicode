name: Pass 214 Operating Compression Gradient

on:
  push:
    branches:
      - main
      - agent/pass214-operating-compression-gradient
    paths:
      - 'HHS_PASS_214_OPERATING_COMPRESSION_GRADIENT_ADMISSION_INCIDENCE_CALIBRATION.md'
      - 'contracts/pass214/**'
      - 'evidence/pass214/**'
      - 'docs/pass214/**'
      - 'tests/test_hhs_pass214_contract_v1.py'
      - 'scripts/run_pass214_contract_validation.sh'
      - '.github/workflows/pass214-operating-compression-gradient.yml'
  pull_request:
    paths:
      - 'HHS_PASS_214_OPERATING_COMPRESSION_GRADIENT_ADMISSION_INCIDENCE_CALIBRATION.md'
      - 'contracts/pass214/**'
      - 'evidence/pass214/**'
      - 'docs/pass214/**'
      - 'tests/test_hhs_pass214_contract_v1.py'
      - 'scripts/run_pass214_contract_validation.sh'
      - '.github/workflows/pass214-operating-compression-gradient.yml'

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate Pass 214 contract freeze
        run: bash scripts/run_pass214_contract_validation.sh
