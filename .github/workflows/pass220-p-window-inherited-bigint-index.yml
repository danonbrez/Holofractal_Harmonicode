name: Pass 220 P Window Inherited BigInt Index
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_p_window_inherited_bigint_index_v1.py"
      - "tests/pass220/test_pass220_p_window_inherited_bigint_index_v1.py"
      - ".github/workflows/pass220-p-window-inherited-bigint-index.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p-window-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - env:
          PYTHONPATH: .
        run: |
          python -m pytest -q --tb=short tests/pass220/test_pass220_p_window_inherited_bigint_index_v1.py
