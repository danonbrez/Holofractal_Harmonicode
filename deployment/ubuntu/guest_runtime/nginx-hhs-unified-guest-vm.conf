# Pass 220 I047 unified guest transport.
# Public /vm-api is projected to the application-VM control plane running inside
# the exact-SHA Ubuntu guest. The host owns transport only.
location /vm-api/ {
    proxy_pass http://127.0.0.1:18720/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 1m;
    proxy_buffering off;
}
