name: Pass 220 I044 Real Ubuntu Guest Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - "hhs_runtime/pass220/ubuntu_guest_runtime.py"
      - "deployment/ubuntu/guest_runtime/**"
      - "tests/pass220/test_pass220_i043_ubuntu_guest_runtime.py"
      - "tests/pass220/test_pass220_i044_real_ubuntu_guest_integration.py"
      - "docs/pass220/PASS_220_I044_REAL_UBUNTU_GUEST_INTEGRATION_V1.md"
      - "docs/operations/restart/PASS_220_I044_REAL_UBUNTU_GUEST_INTEGRATION_20260923.md"
      - ".github/workflows/pass220-i044-real-ubuntu-guest.yml"
  workflow_dispatch:
    inputs:
      run_real_guest:
        description: "Boot and verify the real guest on the configured production host"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hhs-pass220-i044-real-ubuntu-guest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check pytest pyyaml

      - name: Validate I044 source and shell surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            hhs_runtime/pass220/ubuntu_guest_runtime.py \
            tests/pass220/test_pass220_i043_ubuntu_guest_runtime.py \
            tests/pass220/test_pass220_i044_real_ubuntu_guest_integration.py
          bash -n deployment/ubuntu/guest_runtime/prepare-real-guest.sh
          bash -n deployment/ubuntu/guest_runtime/run-real-guest-integration.sh
          python -m json.tool \
            deployment/ubuntu/guest_runtime/ubuntu-24.04-amd64-image.json >/dev/null
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.compose(
              Path(".github/workflows/pass220-i044-real-ubuntu-guest.yml").read_text()
          )
          print("PASS220_I044_WORKFLOW_YAML_VALID")
          PY

      - name: Preserve I043 and validate I044 dependency frontier
        run: |
          python -m pytest -q \
            tests/pass220/test_pass220_i043_ubuntu_guest_runtime.py \
            tests/pass220/test_pass220_i044_real_ubuntu_guest_integration.py

  real-guest:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_guest == true
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HHS_PRODUCTION_HOST: ${{ vars.HHS_DIGITALOCEAN_HOST || '159.65.178.254' }}
      HHS_PRODUCTION_USER: ${{ vars.HHS_DIGITALOCEAN_SSH_USER || 'root' }}
      HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
      HHS_PINNED_KNOWN_HOSTS: ${{ secrets.HHS_DIGITALOCEAN_KNOWN_HOSTS }}
      TARGET_SHA: ${{ github.sha }}

    steps:
      - name: Require explicit production SSH authority
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HHS_SSH_PRIVATE_KEY}" ]] || {
            echo "::error::Missing HHS_DIGITALOCEAN_SSH_PRIVATE_KEY"
            exit 2
          }
          [[ -n "${HHS_PINNED_KNOWN_HOSTS}" ]] || {
            echo "::error::Missing HHS_DIGITALOCEAN_KNOWN_HOSTS"
            exit 3
          }
          [[ -n "${HHS_PRODUCTION_HOST}" ]]
          [[ -n "${HHS_PRODUCTION_USER}" ]]

      - name: Configure pinned production SSH target
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "${HHS_SSH_PRIVATE_KEY}" > "$HOME/.ssh/hhs-production"
          chmod 0600 "$HOME/.ssh/hhs-production"
          printf '%s\n' "${HHS_PINNED_KNOWN_HOSTS}" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${HHS_PRODUCTION_HOST}" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Boot and verify exact-main Ubuntu guest
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/hhs-production" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=30 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${HHS_PRODUCTION_USER}@${HHS_PRODUCTION_HOST}" \
            "TARGET_SHA='${TARGET_SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          TARGET_SHA=${TARGET_SHA:?missing TARGET_SHA}
          SOURCE_REPO=/opt/hhs/app
          SOURCE_PARENT=/var/lib/hhs/ubuntu-guest/source
          SOURCE_ROOT="$SOURCE_PARENT/$TARGET_SHA"

          [[ $EUID -eq 0 ]] || {
            echo "I044 real guest integration requires root on the host" >&2
            exit 10
          }
          git -C "$SOURCE_REPO" rev-parse --is-inside-work-tree >/dev/null
          git -C "$SOURCE_REPO" fetch --prune origin main
          git -C "$SOURCE_REPO" cat-file -e "$TARGET_SHA^{commit}"

          install -d -m 0755 "$SOURCE_PARENT"
          if [[ -e "$SOURCE_ROOT" ]]; then
            if git -C "$SOURCE_ROOT" rev-parse --verify HEAD >/dev/null 2>&1 \
              && [[ "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]] \
              && [[ -z "$(git -C "$SOURCE_ROOT" status --porcelain=v1 --untracked-files=normal)" ]]; then
              echo "HHS_I044_SOURCE_REUSED=$SOURCE_ROOT"
            else
              git -C "$SOURCE_REPO" worktree remove --force "$SOURCE_ROOT" >/dev/null 2>&1 || rm -rf "$SOURCE_ROOT"
            fi
          fi
          if [[ ! -e "$SOURCE_ROOT" ]]; then
            git -C "$SOURCE_REPO" worktree add --detach "$SOURCE_ROOT" "$TARGET_SHA"
          fi

          [[ "$(git -C "$SOURCE_ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ -z "$(git -C "$SOURCE_ROOT" status --porcelain=v1 --untracked-files=normal)" ]]

          SOURCE_ROOT="$SOURCE_ROOT" TARGET_SHA="$TARGET_SHA" \
            bash "$SOURCE_ROOT/deployment/ubuntu/guest_runtime/run-real-guest-integration.sh"

          RECEIPT="/var/lib/hhs/ubuntu-guest/releases/$TARGET_SHA/integration.receipt.json"
          test -s "$RECEIPT"
          python3 - "$RECEIPT" "$TARGET_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["schema"] == "HHS_PASS_220_I044_REAL_UBUNTU_GUEST_INTEGRATION_RECEIPT_V1"
          assert payload["target_sha"] == sys.argv[2]
          assert payload["guest_running"] is True
          assert payload["ssh_loopback_only"] is True
          assert payload["application_vm_ok"] is True
          assert payload["single_vm81_authority_preserved"] is True
          assert payload["pty_proof"] is True
          assert payload["canonical_state_authority"] is False
          print(json.dumps(payload, sort_keys=True))
          PY
          REMOTE
