name: Pass 220 I081 Doc-Bound Formalization Promotions

on:
  push:
    branches:
      - pass220/i081-doc-bound-formalization-promotions-20261008
    paths:
      - 'data/pass220/openai_math_doc_bound_formalization_promotions_v1.json'
      - 'hhs_runtime/hhs_pass220_i081_doc_bound_formalization_promotions_v1.py'
      - 'tests/pass220/test_hhs_pass220_i081_doc_bound_formalization_promotions_v1.py'
      - 'contracts/pass220/PASS_220_I081_DOC_BOUND_FORMALIZATION_PROMOTIONS_V1.json'
      - 'docs/whitepapers/HHS_PASS_220_I081_DOC_BOUND_FORMALIZATION_PROMOTIONS_V1.md'
      - '.github/workflows/pass220-i081-doc-bound-formalization-promotions.yml'
  pull_request:
    paths:
      - 'data/pass220/openai_math_doc_bound_formalization_promotions_v1.json'
      - 'hhs_runtime/hhs_pass220_i081_doc_bound_formalization_promotions_v1.py'
      - 'tests/pass220/test_hhs_pass220_i081_doc_bound_formalization_promotions_v1.py'
      - 'contracts/pass220/PASS_220_I081_DOC_BOUND_FORMALIZATION_PROMOTIONS_V1.json'
      - 'docs/whitepapers/HHS_PASS_220_I081_DOC_BOUND_FORMALIZATION_PROMOTIONS_V1.md'

jobs:
  i081:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Compile
        run: |
          python -m py_compile             hhs_runtime/hhs_pass220_i081_doc_bound_formalization_promotions_v1.py             tests/pass220/test_hhs_pass220_i081_doc_bound_formalization_promotions_v1.py
      - name: Run dependency-scoped I081 tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q --tb=short             tests/pass220/test_hhs_pass220_i081_doc_bound_formalization_promotions_v1.py
      - name: Emit registry/frontier receipt
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          import json
          from hhs_runtime.hhs_pass220_i081_doc_bound_formalization_promotions_v1 import build_registry_receipt
          print(json.dumps(build_registry_receipt(), sort_keys=True))
          PY
