name: Pass 165 MMVS
on:
  pull_request:
    paths:
      - 'hhs_runtime/pass165/**'
      - 'hhs_backend/api/pass165_multimodal_ingress_routes.py'
      - 'hhs_backend/pass165_server.py'
      - 'native_projects/hhs_pass165_mmvs/**'
      - 'tests/test_hhs_pass165_multimodal_ingress_v1.py'
      - 'HHS_PASS_165_AUTHORITY_BINDING.json'
      - 'HHS_PASS_165_IMPLEMENTATION_STATUS.md'
      - 'docs/HHS_PASS_165_MULTIMODAL_INGRESS_RUNTIME.md'
      - 'evidence/pass165/**'
      - '.github/workflows/pass165-mmvs.yml'
  workflow_dispatch:
jobs:
  dependency-scoped-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded dependencies
        run: python -m pip install pytest fastapi pydantic
      - name: Python Hash72 + Pass 163 + Pass 164 + Pass 165
        run: |
          python -m pytest -q \
            tests/test_hash72_digest_v1.py \
            tests/test_hhs_pass163_vmrc_v1.py \
            tests/test_hhs_pass164_gcmsl_v1.py \
            tests/test_hhs_pass165_multimodal_ingress_v1.py
      - name: Strict C11 Pass 163
        run: make -C native_projects/hhs_pass163_vmrc clean test
      - name: Strict C11 Pass 164
        run: make -C native_projects/hhs_pass164_gcmsl clean test
      - name: Strict C11 Pass 165
        run: make -C native_projects/hhs_pass165_mmvs clean test
