name: Pass 220 Ubuntu Application VM Unified Production Contract

on:
  push:
    branches:
      - main
    paths:
      - "hhs_runtime/pass220/**"
      - "hhs_backend/application_vm_api_server.py"
      - "hhs_backend/pass220_unified_guest_server.py"
      - "deployment/ubuntu/application_vm/**"
      - "deployment/ubuntu/guest_runtime/**"
      - "deployment/digitalocean/guarded_auto_update/**"
      - ".github/workflows/digitalocean-production-main.yml"
      - ".github/workflows/pass220-ubuntu-application-vm-production.yml"
      - "tests/pass220/test_pass220_ubuntu_application_vm_control_plane.py"
      - "tests/pass220/test_pass220_i047_unified_lane5_production_vm.py"
  pull_request:
    branches:
      - main
    paths:
      - "hhs_runtime/pass220/**"
      - "hhs_backend/application_vm_api_server.py"
      - "hhs_backend/pass220_unified_guest_server.py"
      - "deployment/ubuntu/application_vm/**"
      - "deployment/ubuntu/guest_runtime/**"
      - "deployment/digitalocean/guarded_auto_update/**"
      - ".github/workflows/digitalocean-production-main.yml"
      - ".github/workflows/pass220-ubuntu-application-vm-production.yml"
      - "tests/pass220/test_pass220_ubuntu_application_vm_control_plane.py"
      - "tests/pass220/test_pass220_i047_unified_lane5_production_vm.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-production-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HHS_DISABLE_C_AUTOBUILD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-scoped requirements
        run: >-
          python -m pip install
          fastapi==0.128.2 starlette==0.50.0
          'httpx>=0.27,<1.0' 'uvicorn[standard]>=0.30,<1.0'
          cryptography pyyaml requests pytest
          networkx websockets anyio sqlalchemy aiosqlite numpy sympy

      - name: Build and verify inherited native runtime
        shell: bash
        run: |
          set -euo pipefail
          make -B c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep -E ' hhs_runtime_init$'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep -E ' hhs_exact_abi_validate$'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep -E ' hhs_hash216_compute$'
          ! ldd hhs_runtime/builds/libhhs_runtime.so | grep -q 'not found'
          PYTHONPATH="$PWD" python - <<'PY'
          import hhs_python.runtime.hhs_ctypes_bridge
          import hhs_python.runtime.hhs_exact_ctypes_bridge
          import hhs_backend.application_vm_api_server
          import hhs_backend.pass220_unified_guest_server
          print("HHS_I047_UNIFIED_COMPONENT_IMPORTS_VERIFIED")
          PY

      - name: Validate unified production shell and Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          bash -n deployment/ubuntu/guest_runtime/prepare-real-guest.sh
          bash -n deployment/ubuntu/guest_runtime/run-real-guest-integration.sh
          bash -n deployment/ubuntu/guest_runtime/install-unified-guest-ide.sh
          bash -n deployment/ubuntu/guest_runtime/manage-unified-vm.sh
          bash -n deployment/digitalocean/guarded_auto_update/hhs-guarded-update.sh
          bash -n deployment/digitalocean/guarded_auto_update/install.sh
          python -m py_compile             hhs_runtime/pass220/ubuntu_guest_runtime.py             hhs_backend/pass220_unified_guest_server.py             deployment/ubuntu/guest_runtime/configure-unified-guest-proxy.py             deployment/digitalocean/configure_runtime_os_static_first.py

      - name: Run dependency-scoped unified VM regressions
        run: |
          python -m pytest -q             tests/pass220/test_pass220_ubuntu_application_vm_control_plane.py             tests/pass220/test_pass220_i043_ubuntu_guest_runtime.py             tests/pass220/test_pass220_i044_real_ubuntu_guest_integration.py             tests/pass220/test_pass220_i047_unified_lane5_production_vm.py

      - name: Enforce no independent production host application deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'HHS Lane 5 BIOS Unified VM Supervisor' deployment/ubuntu/guest_runtime/hhs-unified-vm.service
          ! grep -Fq 'uvicorn' deployment/ubuntu/guest_runtime/hhs-unified-vm.service
          grep -Fq 'run-real-guest-integration.sh' deployment/digitalocean/guarded_auto_update/hhs-guarded-update.sh
          grep -Fq 'configure-unified-guest-proxy.py' deployment/digitalocean/guarded_auto_update/hhs-guarded-update.sh
          grep -Fq 'host application listener on 8080 remains after unified VM cutover' .github/workflows/digitalocean-production-main.yml
          ! grep -Fq 'Deploy independent Ubuntu application VM release' .github/workflows/pass220-ubuntu-application-vm-production.yml
          echo "HHS_I047_NO_PARALLEL_HOST_APPLICATION_DEPLOYMENT=1"
