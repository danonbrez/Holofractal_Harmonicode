name: Pass 219 I141 Pass 185 Phase 6 Cumulative Workspace Job Gaps

on:
  push:
    branches:
      - agent/pass219-iteration141-pass185-production-browser-closure-reconciliation
    paths:
      - 'hhs_runtime/pass191/repository_hydration.py'
      - 'hhs_backend/api/runtime_routes.py'
      - 'hhs_backend/api/pass191_repository_hydration_routes.py'
      - 'hhs_backend/api/pass175_terminal_routes.py'
      - 'hhs_backend/api/pass175_terminal_ws_routes.py'
      - 'hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx'
      - 'hhs_gui/runtime_os/workspace/Pass185TerminalPanel.tsx'
      - 'hhs_gui/runtime_os/workspace/Pass185HydrationJobPanel.tsx'
      - 'hhs_verification/pass185/phase6_cumulative_gap_acceptance.py'
      - 'tests/test_hhs_pass191_repository_hydration_surfaces_v1.py'
      - 'tests/test_runtime_os_production_root.py'
      - 'docs/pass185/HHS_PASS_185_I141_PHASE6_CUMULATIVE_WORKSPACE_JOB_GAP_CLOSURE.md'
      - 'docs/operations/restart/PASS_219_I141_PASS185_PRODUCTION_BROWSER_CLOSURE_RESTART.md'
      - '.github/workflows/pass219-i141-pass185-phase6-cumulative-workspace-job.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pass219-i141-pass185-phase6-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase6-cumulative-workspace-job:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HHS_COGNITION_AUTO_TICK: '0'
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_ASSISTANT_HEALTH_TIMEOUT_SECONDS: '0.25'
      HHS_PASS185_PHASE6_EVIDENCE: '/tmp/pass185-phase6'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependency-scoped runtime packages
        run: |
          timeout 300s python -m pip install --upgrade pip
          timeout 300s python -m pip install \
            fastapi==0.128.2 \
            starlette==0.50.0 \
            'httpx>=0.27,<1.0' \
            'uvicorn[standard]>=0.30,<1.0' \
            'cryptography>=46.0,<47.0' \
            requests \
            pytest \
            playwright

      - name: Prove inherited compiled C runtime
        run: |
          timeout 600s bash bin/post_compile
          test -s hhs_runtime/builds/libhhs_runtime.so
          sha256sum hhs_runtime/builds/libhhs_runtime.so | tee /tmp/pass185-phase6-c-runtime.sha256

      - name: Typecheck and build exact Runtime OS
        working-directory: hhs_gui
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          test -s dist/index.html
          test -d dist/assets

      - name: Validate Phase-6 authority and UI source boundary
        run: |
          python -m py_compile hhs_verification/pass185/phase6_cumulative_gap_acceptance.py
          grep -Fq 'runtime_step_lock = asyncio.Lock()' hhs_backend/api/runtime_routes.py
          grep -Fq '@router.post("/authority/tick")' hhs_backend/api/runtime_routes.py
          grep -Fq 'runtime_controller.authorized_tick' hhs_backend/api/runtime_routes.py
          grep -Fq 'self._cancel_events' hhs_runtime/pass191/repository_hydration.py
          grep -Fq 'HHS_P191_JOB_CANCELLED' hhs_runtime/pass191/repository_hydration.py
          grep -Fq 'test_running_job_cancel_is_cooperative_and_cannot_be_overwritten_by_resume' tests/test_hhs_pass191_repository_hydration_surfaces_v1.py
          grep -Fq 'pass185-new-file' hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx
          grep -Fq 'pass185-upload-input' hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx
          grep -Fq 'pass185-workbench-build' hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx
          grep -Fq 'pass185-workbench-run' hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx
          grep -Fq 'pass185-terminal-open' hhs_gui/runtime_os/workspace/Pass185TerminalPanel.tsx
          grep -Fq 'pass185-hydration-cancel' hhs_gui/runtime_os/workspace/Pass185HydrationJobPanel.tsx
          grep -Fq 'frontend_job_authority=false' hhs_gui/runtime_os/workspace/Pass185HydrationJobPanel.tsx

      - name: Validate cooperative Pass-191 cancellation and production route regressions
        run: |
          timeout 300s pytest -q \
            tests/test_hhs_pass191_repository_hydration_surfaces_v1.py \
            tests/test_runtime_os_production_root.py

      - name: Install bounded Chromium
        run: timeout 600s python -m playwright install --with-deps chromium

      - name: Run Phase-6 exact-production visible gap acceptance
        run: |
          mkdir -p "$HHS_PASS185_PHASE6_EVIDENCE"
          timeout 900s python -m hhs_verification.pass185.phase6_cumulative_gap_acceptance \
            --evidence-dir "$HHS_PASS185_PHASE6_EVIDENCE"

      - name: Seal Phase-6 evidence
        if: always()
        run: |
          mkdir -p "$HHS_PASS185_PHASE6_EVIDENCE"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('/tmp/pass185-phase6')
          payload = {
              'schema': 'HHS_PASS219_I141_PASS185_PHASE6_VALIDATION_SEAL_V1',
              'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'authoritative_main_base': 'f8aa3337ee023c7d828343eac208987c20a05e67',
              'phase5_implementation_validated_head': '36321174c124ff5ba81bd60fd37a72ce703e606c',
              'pass185_contract_commit': 'f260f2b013072a48399d9cdc207d0a76a6c63d2f',
              'classification': 'HHS_PASS_185_PHASE6_WORKSPACE_JOB_GAPS_EXECUTED',
              'terminal_pass185_completion_claimed': False,
              'evidence': {},
              'source_blobs': {},
          }
          for path in [
              'hhs_runtime/pass191/repository_hydration.py',
              'hhs_backend/api/runtime_routes.py',
              'hhs_gui/runtime_os/workspace/HHSWorkspaceShell.tsx',
              'hhs_gui/runtime_os/workspace/Pass185TerminalPanel.tsx',
              'hhs_gui/runtime_os/workspace/Pass185HydrationJobPanel.tsx',
              'hhs_verification/pass185/phase6_cumulative_gap_acceptance.py',
              'tests/test_hhs_pass191_repository_hydration_surfaces_v1.py',
              'docs/pass185/HHS_PASS_185_I141_PHASE6_CUMULATIVE_WORKSPACE_JOB_GAP_CLOSURE.md',
          ]:
              payload['source_blobs'][path] = subprocess.check_output(
                  ['git', 'hash-object', path], text=True
              ).strip()
          for evidence in sorted(root.glob('**/*.json')):
              data = json.loads(evidence.read_text())
              payload['evidence'][evidence.name] = {
                  'ok': data.get('ok'),
                  'classification': data.get('classification'),
                  'path': str(evidence.relative_to(root)),
                  'sha256': hashlib.sha256(evidence.read_bytes()).hexdigest(),
              }
          encoded = json.dumps(payload, sort_keys=True, separators=(',', ':')).encode()
          payload['receipt_sha256'] = hashlib.sha256(encoded).hexdigest()
          (root / 'i141-phase6-seal.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass219-i141-pass185-phase6-cumulative-workspace-job
          path: |
            /tmp/pass185-phase6/**
            /tmp/pass185-phase6-c-runtime.sha256
          if-no-files-found: warn
          retention-days: 30
