name: Pass 220 I043 Ubuntu Guest Runtime PTY

on:
  pull_request:
    branches:
      - main
    paths:
      - "hhs_runtime/pass220/ubuntu_guest_runtime.py"
      - "hhs_runtime/pass220/ubuntu_guest_cli.py"
      - "bin/hhs-guest"
      - "tests/pass220/test_pass220_i043_ubuntu_guest_runtime.py"
      - "docs/pass220/PASS_220_I043_UBUNTU_GUEST_RUNTIME_PTY_V1.md"
      - "docs/operations/restart/PASS_220_I043_UBUNTU_GUEST_RUNTIME_PTY_20260923.md"
      - ".github/workflows/pass220-i043-ubuntu-guest-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-runtime-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile I043 runtime surfaces
        run: |
          python -m py_compile \
            hhs_runtime/pass220/ubuntu_guest_runtime.py \
            hhs_runtime/pass220/ubuntu_guest_cli.py \
            tests/pass220/test_pass220_i043_ubuntu_guest_runtime.py

      - name: Validate launcher syntax
        run: sh -n bin/hhs-guest

      - name: Enforce host/guest authority boundary
        run: |
          grep -Fq 'canonical_state_authority": False' hhs_runtime/pass220/ubuntu_guest_runtime.py
          grep -Fq 'new_vm81_authority": False' hhs_runtime/pass220/ubuntu_guest_runtime.py
          grep -Fq 'hostfwd=tcp:127.0.0.1:' hhs_runtime/pass220/ubuntu_guest_runtime.py
          ! grep -Eq 'hostfwd=tcp:(0\.0\.0\.0|\[::\])' hhs_runtime/pass220/ubuntu_guest_runtime.py

      - name: Run dependency-scoped guest lifecycle and PTY regressions
        run: python -m pytest -q tests/pass220/test_pass220_i043_ubuntu_guest_runtime.py
