name: Pass 220 HNAN Lane 5 Exact Witness
on:
  pull_request:
    paths:
      - 'formal/lean/HHS/Pass220/Lane5NormalizationApplications.lean'
      - 'formal/lean/HHS/Mathlib/Rat/ValueAlgebra.lean'
      - 'hhs_runtime/hhs_pass220_i060_native_lean_exactrat_value_algebra_v1.py'
      - 'hhs_runtime/pass220/hnan_lane5_exact_witness_v1.py'
      - 'tests/pass220/test_hnan_lane5_exact_witness_v1.py'
      - 'hhs_runtime/pass220/lane5_lean_normalization_instance_v1.py'
      - 'tests/pass220/test_lane5_lean_normalization_instance_v1.py'
      - 'hhs_runtime/pass220/lane5_lean_normalization_lookup_v1.py'
      - 'tests/pass220/test_lane5_lean_normalization_lookup_v1.py'
      - 'hhs_runtime/hhs_loshu_phase_embedding_v1.py'
      - 'tests/pass220/test_existing_tokenizer_hnan_identity_annotation_v1.py'
      - 'hhs_runtime/hhs_pass220_recursive_hnan_native_rule_preflight_v1.py'
      - 'tests/pass220/test_pass220_recursive_hnan_native_rule_preflight_v1.py'
      - '.github/workflows/pass220-hnan-lane5-exact-witness.yml'
  push:
    paths:
      - 'hhs_runtime/pass220/hnan_lane5_exact_witness_v1.py'
      - 'tests/pass220/test_hnan_lane5_exact_witness_v1.py'
      - '.github/workflows/pass220-hnan-lane5-exact-witness.yml'
jobs:
  exact-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused exact witness test
        run: python -m unittest discover -s tests/pass220 -p 'test_hnan_lane5_exact_witness_v1.py' -v
      - name: Native Lean theorem normalization lookup
        run: python -m unittest discover -s tests/pass220 -p 'test_lane5_lean_normalization_lookup_v1.py' -v
      - name: Typed exact rational normalization instances
        run: python -m unittest discover -s tests/pass220 -p 'test_lane5_lean_normalization_instance_v1.py' -v
      - name: Existing tokenizer exact identity annotation
        run: python -m unittest discover -s tests/pass220 -p 'test_existing_tokenizer_hnan_identity_annotation_v1.py' -v
      - name: Native preflight fail-closed regression
        run: |
          python -m pip install pytest
          python -m pytest -q tests/pass220/test_pass220_recursive_hnan_native_rule_preflight_v1.py -k 'missing_native_library or native_exact_phase_witness_rejection or native_token_identity_incomplete_handoff or native_lean_normalization_invalid_shape or native_lean_instance_requires_theorem'

  lean-normalization-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify inherited Lean I060 declarations in the real kernel
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          build: true
          test: false
          leanchecker: true
          leanchecker-args: HHS
          axiom-audit: true
          axiom-audit-root: HHS
      - name: Typecheck all eight existing Lean theorem applications
        run: lake env lean formal/lean/HHS/Pass220/Lane5NormalizationApplications.lean
