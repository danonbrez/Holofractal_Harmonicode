name: Pass 218 Full Iteration 12

on:
  push:
    branches:
      - agent/pass218-full-iteration12-production-authority-maintenance
  pull_request:
    paths:
      - 'hhs_runtime/pass218/**'
      - 'tests/pass218/**'
      - 'deploy/pass218-etcd/**'
      - 'docs/pass218/**'
      - '.github/workflows/pass218-full-iteration12.yml'

permissions:
  contents: read

jobs:
  production-authority-maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HHS_PASS218_I12_ENDPOINTS: https://127.0.0.1:12379,https://127.0.0.1:22379,https://127.0.0.1:32379
      HHS_PASS218_I12_NAMESPACE: /hhs/pass218/i12/ci/${{ github.run_id }}

    steps:
      - name: Check out Iteration 12 candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped validation packages
        run: python -m pip install --upgrade pytest cryptography fastapi uvicorn httpx

      - name: Compile cumulative Pass 218 surfaces
        run: |
          python -m py_compile hhs_runtime/pass218/*.py
          python -m py_compile hhs_backend/runtime_os_pass218_lifecycle.py

      - name: Enforce no authoritative float literals
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = sorted(Path('hhs_runtime/pass218').glob('*.py'))
          for path in paths:
              tree = ast.parse(path.read_text('utf-8'))
              floats = [
                  node for node in ast.walk(tree)
                  if isinstance(node, ast.Constant) and isinstance(node.value, float)
              ]
              assert not floats, f'{path}: authoritative float literal(s) found'
          print('PASS218_I12_NO_FLOAT_LITERAL_AUTHORITY=1')
          PY

      - name: Preserve Iterations 1 through 12
        run: |
          pytest -q tests/pass218/test_pass218_iteration1_genesis_curriculum.py
          pytest -q tests/pass218/test_pass218_iteration2_grammar_narrative_hydration.py
          pytest -q tests/pass218/test_pass218_iteration3_source_transaction_membrane.py
          pytest -q tests/pass218/test_pass218_iteration4_vector_vm5184_staging.py
          pytest -q tests/pass218/test_pass218_iteration5_promotion_admission_proof.py
          pytest -q tests/pass218/test_pass218_iteration6_canonical_commit_boundary.py
          pytest -q tests/pass218/test_pass218_iteration7_durable_canonical_persistence.py
          pytest -q tests/pass218/test_pass218_iteration8_runtime_os_lifecycle.py
          pytest -q tests/pass218/test_pass218_iteration9_multiprocess_canonical_ownership.py
          pytest -q tests/pass218/test_pass218_iteration10_distributed_canonical_ownership.py
          pytest -q tests/pass218/test_pass218_iteration11_distributed_operational_hardening.py
          pytest -q tests/pass218/test_pass218_iteration12_production_authority_maintenance.py

      - name: Preserve inherited crawler and Runtime OS acceptance
        run: |
          pytest -q tests/pass218/test_repository_native_creative_writing_crawler.py
          pytest -q tests/test_runtime_os_production_root.py

      - name: Generate dual-generation mTLS credentials
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import ipaddress
          from pathlib import Path
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.x509.oid import ExtendedKeyUsageOID, NameOID

          root = Path('.i12-pki')
          root.mkdir(parents=True, exist_ok=True)
          now = datetime.now(timezone.utc)
          ca_key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          ca_name = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, 'HHS Pass218 I12 CI CA')])
          ca_cert = (
              x509.CertificateBuilder()
              .subject_name(ca_name)
              .issuer_name(ca_name)
              .public_key(ca_key.public_key())
              .serial_number(x509.random_serial_number())
              .not_valid_before(now - timedelta(minutes=5))
              .not_valid_after(now + timedelta(days=2))
              .add_extension(x509.BasicConstraints(ca=True, path_length=None), critical=True)
              .sign(ca_key, hashes.SHA256())
          )

          def issue(name, *, server=False, client=False, sans=()):
              key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
              subject = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, name)])
              builder = (
                  x509.CertificateBuilder()
                  .subject_name(subject)
                  .issuer_name(ca_name)
                  .public_key(key.public_key())
                  .serial_number(x509.random_serial_number())
                  .not_valid_before(now - timedelta(minutes=5))
                  .not_valid_after(now + timedelta(days=2))
              )
              usages = []
              if server:
                  usages.append(ExtendedKeyUsageOID.SERVER_AUTH)
              if client:
                  usages.append(ExtendedKeyUsageOID.CLIENT_AUTH)
              builder = builder.add_extension(x509.ExtendedKeyUsage(usages), critical=False)
              if sans:
                  values = []
                  for item in sans:
                      try:
                          values.append(x509.IPAddress(ipaddress.ip_address(item)))
                      except ValueError:
                          values.append(x509.DNSName(item))
                  builder = builder.add_extension(x509.SubjectAlternativeName(values), critical=False)
              return key, builder.sign(ca_key, hashes.SHA256())

          server_key, server_cert = issue(
              'hhs-pass218-i12-etcd-members',
              server=True,
              client=True,
              sans=('127.0.0.1', 'localhost', 'etcd1', 'etcd2', 'etcd3', 'etcd3new'),
          )
          old_key, old_cert = issue('hhs-pass218-i12-writer-old', client=True)
          new_key, new_cert = issue('hhs-pass218-i12-writer-new', client=True)

          def write_key(path, key):
              path.write_bytes(key.private_bytes(
                  serialization.Encoding.PEM,
                  serialization.PrivateFormat.PKCS8,
                  serialization.NoEncryption(),
              ))

          (root / 'ca.pem').write_bytes(ca_cert.public_bytes(serialization.Encoding.PEM))
          (root / 'server.pem').write_bytes(server_cert.public_bytes(serialization.Encoding.PEM))
          (root / 'client-old.pem').write_bytes(old_cert.public_bytes(serialization.Encoding.PEM))
          (root / 'client-new.pem').write_bytes(new_cert.public_bytes(serialization.Encoding.PEM))
          write_key(root / 'server-key.pem', server_key)
          write_key(root / 'client-old-key.pem', old_key)
          write_key(root / 'client-new-key.pem', new_key)
          PY

      - name: Start real three-member mTLS cluster
        run: |
          set -euo pipefail
          docker network create hhs-p218-i12
          mkdir -p .i12-data/etcd1 .i12-data/etcd2 .i12-data/etcd3 .i12-data/etcd3new .i12-evidence

          start_member() {
            name="$1"
            port="$2"
            data_dir="$3"
            docker run -d \
              --name "$name" \
              --network hhs-p218-i12 \
              -p "${port}:2379" \
              -v "$PWD/.i12-pki:/certs:ro" \
              -v "$data_dir:/etcd-data" \
              quay.io/coreos/etcd:v3.5.21 \
              /usr/local/bin/etcd \
              --name="$name" \
              --data-dir=/etcd-data \
              --listen-client-urls=https://0.0.0.0:2379 \
              --advertise-client-urls="https://${name}:2379" \
              --listen-peer-urls=https://0.0.0.0:2380 \
              --initial-advertise-peer-urls="https://${name}:2380" \
              --initial-cluster='etcd1=https://etcd1:2380,etcd2=https://etcd2:2380,etcd3=https://etcd3:2380' \
              --initial-cluster-state=new \
              --initial-cluster-token=hhs-p218-i12-ci \
              --client-cert-auth=true \
              --trusted-ca-file=/certs/ca.pem \
              --cert-file=/certs/server.pem \
              --key-file=/certs/server-key.pem \
              --peer-client-cert-auth=true \
              --peer-trusted-ca-file=/certs/ca.pem \
              --peer-cert-file=/certs/server.pem \
              --peer-key-file=/certs/server-key.pem
          }

          start_member etcd1 12379 "$PWD/.i12-data/etcd1"
          start_member etcd2 22379 "$PWD/.i12-data/etcd2"
          start_member etcd3 32379 "$PWD/.i12-data/etcd3"

          for attempt in $(seq 1 40); do
            ready=0
            for port in 12379 22379 32379; do
              if curl --fail --silent \
                --cacert .i12-pki/ca.pem \
                --cert .i12-pki/client-old.pem \
                --key .i12-pki/client-old-key.pem \
                "https://127.0.0.1:${port}/health" | grep -q 'true'; then
                ready=$((ready + 1))
              fi
            done
            if [ "$ready" -eq 3 ]; then
              echo PASS218_I12_INITIAL_CLUSTER_READY=1
              exit 0
            fi
            sleep 1
          done
          docker logs etcd1 || true
          docker logs etcd2 || true
          docker logs etcd3 || true
          exit 1

      - name: Prove credential rotation handoff uses a fresh I10 fence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass218.operational_hardening_i11 import (
              Pass218EtcdClusterAuthority,
              Pass218EtcdClusterConfig,
              Pass218EtcdClusterMonitor,
          )
          from hhs_runtime.pass218.authority_maintenance_i12 import (
              Pass218MaintenancePolicy,
              seal_credential_rotation_plan,
              validate_credential_rotation_plan,
          )
          from hashlib import sha256

          endpoints = tuple('${{ env.HHS_PASS218_I12_ENDPOINTS }}'.split(','))
          namespace = '${{ env.HHS_PASS218_I12_NAMESPACE }}'
          root = Path('.i12-pki')

          def config(cert, key):
              return Pass218EtcdClusterConfig.build(
                  endpoints,
                  ca_file=root/'ca.pem',
                  client_cert_file=root/cert,
                  client_key_file=root/key,
                  cluster_name='i12-ci-cluster',
              )

          old_cfg = config('client-old.pem', 'client-old-key.pem')
          old = Pass218EtcdClusterAuthority(old_cfg, namespace=namespace, owner_id='i12-old-writer', host_id='i12-old-host')
          old_probe = Pass218EtcdClusterMonitor(old_cfg, old.client, namespace=namespace).require_quorum_ready()
          old_record = old.acquire()
          assert old_record is not None
          old_fence = old_record['fence_epoch']

          def digest(path):
              return sha256(path.read_bytes()).hexdigest()

          plan = seal_credential_rotation_plan(
              rotation_id='i12-ci-credential-rotation',
              old_ca_sha256=digest(root/'ca.pem'),
              new_ca_sha256=digest(root/'ca.pem'),
              old_client_cert_sha256=digest(root/'client-old.pem'),
              new_client_cert_sha256=digest(root/'client-new.pem'),
              old_client_key_sha256=digest(root/'client-old-key.pem'),
              new_client_key_sha256=digest(root/'client-new-key.pem'),
              preflight_probe_hash72=old_probe['probe_hash72'],
              current_global_fence=old_fence,
          )
          validate_credential_rotation_plan(plan)
          old.release()
          assert old.held is False

          new_cfg = config('client-new.pem', 'client-new-key.pem')
          new = Pass218EtcdClusterAuthority(new_cfg, namespace=namespace, owner_id='i12-new-writer', host_id='i12-new-host')
          new_probe = Pass218EtcdClusterMonitor(new_cfg, new.client, namespace=namespace).require_quorum_ready()
          new_record = new.acquire()
          assert new_record is not None
          assert new_record['fence_epoch'] > old_fence

          contender = Pass218EtcdClusterAuthority(old_cfg, namespace=namespace, owner_id='i12-old-contender', host_id='i12-old-host')
          assert contender.acquire() is None
          assert contender.held is False

          evidence = {
              'old_fence': old_fence,
              'new_fence': new_record['fence_epoch'],
              'old_probe_hash72': old_probe['probe_hash72'],
              'new_probe_hash72': new_probe['probe_hash72'],
              'rotation_plan_hash72': plan['record_hash72'],
              'simultaneous_writer_permitted': False,
          }
          Path('.i12-evidence/credential-rotation.json').write_text(json.dumps(evidence, sort_keys=True, separators=(',', ':')) + '\n')
          new.release()
          print('PASS218_I12_CREDENTIAL_ROTATION_HANDOFF=1')
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Prove live one-member replacement preserves quorum
        run: |
          set -euo pipefail
          export ETCDCTL_API=3
          ETCDCTL="docker exec etcd1 /usr/local/bin/etcdctl --endpoints=https://127.0.0.1:2379 --cacert=/certs/ca.pem --cert=/certs/client-old.pem --key=/certs/client-old-key.pem"
          $ETCDCTL member list -w json > .i12-evidence/member-list-before.json
          OLD_ID=$(python - <<'PY'
          import json
          data=json.load(open('.i12-evidence/member-list-before.json'))
          for member in data['members']:
              if member.get('name') == 'etcd3':
                  print(f"{int(member['ID']):x}")
                  break
          else:
              raise SystemExit('etcd3 member not found')
          PY
          )
          docker stop etcd3
          $ETCDCTL endpoint health
          $ETCDCTL member remove "$OLD_ID"
          $ETCDCTL endpoint health
          $ETCDCTL member add etcd3new --peer-urls=https://etcd3new:2380 > .i12-evidence/member-add.txt
          docker rm etcd3

          docker run -d \
            --name etcd3new \
            --network hhs-p218-i12 \
            -p 32379:2379 \
            -v "$PWD/.i12-pki:/certs:ro" \
            -v "$PWD/.i12-data/etcd3new:/etcd-data" \
            quay.io/coreos/etcd:v3.5.21 \
            /usr/local/bin/etcd \
            --name=etcd3new \
            --data-dir=/etcd-data \
            --listen-client-urls=https://0.0.0.0:2379 \
            --advertise-client-urls=https://etcd3new:2379 \
            --listen-peer-urls=https://0.0.0.0:2380 \
            --initial-advertise-peer-urls=https://etcd3new:2380 \
            --initial-cluster='etcd1=https://etcd1:2380,etcd2=https://etcd2:2380,etcd3new=https://etcd3new:2380' \
            --initial-cluster-state=existing \
            --initial-cluster-token=hhs-p218-i12-ci \
            --client-cert-auth=true \
            --trusted-ca-file=/certs/ca.pem \
            --cert-file=/certs/server.pem \
            --key-file=/certs/server-key.pem \
            --peer-client-cert-auth=true \
            --peer-trusted-ca-file=/certs/ca.pem \
            --peer-cert-file=/certs/server.pem \
            --peer-key-file=/certs/server-key.pem

          for attempt in $(seq 1 40); do
            if curl --fail --silent \
              --cacert .i12-pki/ca.pem \
              --cert .i12-pki/client-new.pem \
              --key .i12-pki/client-new-key.pem \
              https://127.0.0.1:32379/health | grep -q 'true'; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass218.operational_hardening_i11 import Pass218EtcdClusterConfig, Pass218EtcdClusterMonitor, EtcdV3MutualTLSEndpointPoolClient
          from hhs_runtime.pass218.authority_maintenance_i12 import seal_member_replacement_plan, validate_member_replacement_plan

          endpoints=tuple('${{ env.HHS_PASS218_I12_ENDPOINTS }}'.split(','))
          root=Path('.i12-pki')
          cfg=Pass218EtcdClusterConfig.build(endpoints, ca_file=root/'ca.pem', client_cert_file=root/'client-new.pem', client_key_file=root/'client-new-key.pem', cluster_name='i12-ci-cluster')
          client=EtcdV3MutualTLSEndpointPoolClient(cfg)
          monitor=Pass218EtcdClusterMonitor(cfg, client, namespace='${{ env.HHS_PASS218_I12_NAMESPACE }}')
          post=monitor.require_quorum_ready()
          before=json.load(open('.i12-evidence/member-list-before.json'))
          old_id=next(int(m['ID']) for m in before['members'] if m.get('name') == 'etcd3')
          plan=seal_member_replacement_plan(
              replacement_id='i12-ci-etcd3-replacement',
              old_member_id=old_id,
              replacement_member_name='etcd3new',
              replacement_peer_url='https://etcd3new:2380',
              replacement_client_url='https://etcd3new:2379',
              preflight_probe_hash72=post['probe_hash72'],
              expected_member_count=3,
              quorum_size=2,
          )
          validate_member_replacement_plan(plan)
          evidence={'post_probe_hash72':post['probe_hash72'],'reachable_member_count':post['reachable_member_count'],'member_ids':post['member_ids'],'replacement_plan_hash72':plan['record_hash72']}
          Path('.i12-evidence/member-replacement.json').write_text(json.dumps(evidence, sort_keys=True, separators=(',', ':'))+'\n')
          assert post['reachable_member_count'] == 3
          assert post['quorum_ready'] is True
          print('PASS218_I12_LIVE_MEMBER_REPLACEMENT=1')
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Prove bounded recovery and fresh fence after quorum loss
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass218.operational_hardening_i11 import Pass218EtcdClusterAuthority, Pass218EtcdClusterConfig, Pass218EtcdClusterMonitor
          from hhs_runtime.pass218.authority_maintenance_i12 import Pass218BoundedRecoveryController, Pass218MaintenancePolicy
          root=Path('.i12-pki')
          endpoints=tuple('${{ env.HHS_PASS218_I12_ENDPOINTS }}'.split(','))
          namespace='${{ env.HHS_PASS218_I12_NAMESPACE }}'
          cfg=Pass218EtcdClusterConfig.build(endpoints, ca_file=root/'ca.pem', client_cert_file=root/'client-new.pem', client_key_file=root/'client-new-key.pem', cluster_name='i12-ci-cluster')
          authority=Pass218EtcdClusterAuthority(cfg, namespace=namespace, owner_id='i12-recovery-predecessor', host_id='i12-recovery-host')
          monitor=Pass218EtcdClusterMonitor(cfg, authority.client, namespace=namespace)
          probe=monitor.require_quorum_ready()
          record=authority.acquire()
          assert record is not None
          fence=record['fence_epoch']
          authority.release()
          Path('.i12-evidence/recovery-predecessor.json').write_text(json.dumps({'fence':fence,'probe_hash72':probe['probe_hash72']},sort_keys=True)+'\n')
          PY

          docker stop etcd2 etcd3new
          python - <<'PY'
          from pathlib import Path
          from hhs_runtime.pass218.operational_hardening_i11 import Pass218EtcdClusterConfig, Pass218EtcdClusterMonitor, EtcdV3MutualTLSEndpointPoolClient, Pass218OperationalQuorumUnavailable
          root=Path('.i12-pki')
          cfg=Pass218EtcdClusterConfig.build(tuple('${{ env.HHS_PASS218_I12_ENDPOINTS }}'.split(',')), ca_file=root/'ca.pem', client_cert_file=root/'client-new.pem', client_key_file=root/'client-new-key.pem', cluster_name='i12-ci-cluster')
          monitor=Pass218EtcdClusterMonitor(cfg, EtcdV3MutualTLSEndpointPoolClient(cfg), namespace='${{ env.HHS_PASS218_I12_NAMESPACE }}')
          probe=monitor.probe()
          assert probe['quorum_ready'] is False
          print('PASS218_I12_QUORUM_LOSS_FAIL_CLOSED=1')
          PY

          docker start etcd2
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cacert .i12-pki/ca.pem --cert .i12-pki/client-new.pem --key .i12-pki/client-new-key.pem https://127.0.0.1:22379/health | grep -q true; then break; fi
            sleep 1
          done

          python - <<'PY'
          import json
          from pathlib import Path
          from hhs_runtime.pass218.operational_hardening_i11 import Pass218EtcdClusterAuthority, Pass218EtcdClusterConfig, Pass218EtcdClusterMonitor
          from hhs_runtime.pass218.authority_maintenance_i12 import Pass218BoundedRecoveryController, Pass218MaintenancePolicy, validate_recovery_status
          root=Path('.i12-pki')
          endpoints=tuple('${{ env.HHS_PASS218_I12_ENDPOINTS }}'.split(','))
          namespace='${{ env.HHS_PASS218_I12_NAMESPACE }}'
          predecessor=json.loads(Path('.i12-evidence/recovery-predecessor.json').read_text())
          cfg=Pass218EtcdClusterConfig.build(endpoints, ca_file=root/'ca.pem', client_cert_file=root/'client-new.pem', client_key_file=root/'client-new-key.pem', cluster_name='i12-ci-cluster')
          authority=Pass218EtcdClusterAuthority(cfg, namespace=namespace, owner_id='i12-recovery-successor', host_id='i12-recovery-host')
          monitor=Pass218EtcdClusterMonitor(cfg, authority.client, namespace=namespace)
          probe=monitor.require_quorum_ready()
          controller=Pass218BoundedRecoveryController(Pass218MaintenancePolicy.build(expected_member_count=3,max_automated_recovery_attempts=2))
          controller.record_authority_loss(predecessor_global_fence=predecessor['fence'], cluster_probe_hash72=predecessor['probe_hash72'])
          controller.begin_attempt(writer_authority_held=False)
          record=authority.acquire()
          assert record is not None
          assert record['fence_epoch'] > predecessor['fence']
          status=controller.record_recovered_fence(recovered_global_fence=record['fence_epoch'], cluster_probe_hash72=probe['probe_hash72'])
          validate_recovery_status(status)
          assert status['requires_new_global_fence'] is False
          assert status['recovery_can_mint_authority'] is False
          evidence={'predecessor_fence':predecessor['fence'],'recovered_fence':record['fence_epoch'],'recovery_status_hash72':status['record_hash72']}
          Path('.i12-evidence/bounded-recovery.json').write_text(json.dumps(evidence,sort_keys=True,separators=(',',':'))+'\n')
          authority.release()
          print('PASS218_I12_BOUNDED_RECOVERY_NEW_FENCE=1')
          print(json.dumps(evidence,sort_keys=True))
          PY

      - name: Exercise snapshot retention artifact
        run: |
          set -euo pipefail
          docker exec etcd1 /usr/local/bin/etcdctl \
            --endpoints=https://127.0.0.1:2379 \
            --cacert=/certs/ca.pem \
            --cert=/certs/client-new.pem \
            --key=/certs/client-new-key.pem \
            snapshot save /etcd-data/pass218-i12-snapshot.db
          docker cp etcd1:/etcd-data/pass218-i12-snapshot.db .i12-evidence/pass218-i12-snapshot.db
          docker run --rm -v "$PWD/.i12-evidence:/evidence" quay.io/coreos/etcd:v3.5.21 \
            /usr/local/bin/etcdutl snapshot status /evidence/pass218-i12-snapshot.db -w json \
            > .i12-evidence/snapshot-status.json
          test -s .i12-evidence/pass218-i12-snapshot.db
          test -s .i12-evidence/snapshot-status.json
          sha256sum .i12-evidence/pass218-i12-snapshot.db
          cat .i12-evidence/snapshot-status.json

      - name: Upload Iteration 12 operational evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass218-iteration12-production-maintenance-evidence
          path: .i12-evidence
          if-no-files-found: error
