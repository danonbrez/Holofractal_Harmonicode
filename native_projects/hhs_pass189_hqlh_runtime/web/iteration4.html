<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pass 189 · Iteration 4</title><style>body{margin:0;background:#061017;color:#e8f7ff;font:15px system-ui}main{max-width:1100px;margin:auto;padding:18px}header,.card{border:1px solid #294556;border-radius:14px;background:#091720;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}.metric{background:#0d1b25;padding:11px;border-radius:9px}.metric b{display:block;color:#72e7ff;font-size:22px}button,input,textarea{box-sizing:border-box;width:100%;border:1px solid #315064;background:#07131c;color:#e8f7ff;border-radius:8px;padding:10px}button{cursor:pointer;font-weight:700}.warn{color:#ffbf69}pre{white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}</style></head><body><main><header><h1>Pass 189 · Iteration 4</h1><p>Driver provenance, quarantine, conformance, dual promotion, revocation, and rollback authority.</p><p class="warn">Real hardware packages remain non-executable. This surface only promotes built-in software test drivers to execution.</p></header><section class="card"><div id="metrics" class="grid"></div></section><section class="card"><button id="refresh">Refresh authority state</button><pre id="output">Loading…</pre></section></main><script>async function refresh(){const r=await fetch('/api/pass189/i4/status');const d=await r.json();document.getElementById('metrics').innerHTML=['events','trust_roots','packages','quarantined','conformant','promoted','active_drivers','hardware_candidates'].map(k=>`<div class="metric"><small>${k.replaceAll('_',' ')}</small><b>${d[k]??0}</b></div>`).join('');document.getElementById('output').textContent=JSON.stringify(d,null,2)}document.getElementById('refresh').onclick=refresh;refresh()</script></body></html>
