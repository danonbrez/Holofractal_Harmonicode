name: Apply Pass 176 Live DOM Repair

on:
  push:
    branches:
      - agent/pass176-frozen-ide-stabilization
    paths:
      - '.github/workflows/pass176-live-dom-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pass176-live-dom-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass176-frozen-ide-stabilization
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preserve advanced runtime DOM and remove duplicate lifecycle binding
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          recovery = Path('applications/holofractal_harmonizer/src/production-recovery.mjs')
          old_visibility = '''function detachAdvancedSurfaces() {
            if (detachedAdvanced.length) return;
            const selectors = [
              '#ide-repository-explorer', '.ide-registry-explorer', '.lifecycle-control-window',
              '#ide-pass175-processor', '#ide-pass175-terminal', '.ide-object-space-window',
            ];
            for (const selector of selectors) {
              for (const node of document.querySelectorAll(selector)) {
                if (node.closest('#hhs-app-command-bar')) continue;
                const marker = document.createComment(`hhs-pass176:${selector}`);
                node.parentNode?.insertBefore(marker, node);
                detachedAdvanced.push({ node, marker });
                node.remove();
              }
            }
          }

          function restoreAdvancedSurfaces() {
            while (detachedAdvanced.length) {
              const { node, marker } = detachedAdvanced.shift();
              marker.parentNode?.insertBefore(node, marker);
              marker.remove();
            }
          }'''
          new_visibility = '''function detachAdvancedSurfaces() {
            if (detachedAdvanced.length) return;
            const selectors = [
              '#ide-repository-explorer', '.ide-registry-explorer', '.lifecycle-control-window',
              '#ide-pass175-processor', '#ide-pass175-terminal', '.ide-object-space-window',
            ];
            for (const selector of selectors) {
              for (const node of document.querySelectorAll(selector)) {
                if (node.closest('#hhs-app-command-bar')) continue;
                detachedAdvanced.push({
                  node,
                  hidden: Boolean(node.hidden),
                  ariaHidden: node.getAttribute('aria-hidden'),
                });
                node.hidden = true;
                node.setAttribute('aria-hidden', 'true');
                node.dataset.hhsPass176AdvancedHidden = 'true';
              }
            }
          }

          function restoreAdvancedSurfaces() {
            while (detachedAdvanced.length) {
              const { node, hidden, ariaHidden } = detachedAdvanced.shift();
              node.hidden = hidden;
              if (ariaHidden === null) node.removeAttribute('aria-hidden');
              else node.setAttribute('aria-hidden', ariaHidden);
              delete node.dataset.hhsPass176AdvancedHidden;
            }
          }'''
          replace_once(recovery, old_visibility, new_visibility, 'live DOM visibility repair')

          visual = Path('applications/holofractal_harmonizer/src/visual-ide.mjs')
          old_selector = """    ['#ide-run', 'run'],
              ['#ide-run-lifecycle', 'lifecycle'],
              ['#ide-replay', 'replay'],"""
          new_selector = """    ['#ide-run', 'run'],
              ['#ide-replay', 'replay'],"""
          replace_once(visual, old_selector, new_selector, 'duplicate lifecycle listener removal')
          replace_once(
              visual,
              "        required('#ide-run-lifecycle').onclick = null;\n",
              '',
              'detached lifecycle requirement removal',
          )
          PY

      - name: Validate repaired source and tests
        run: |
          set -euo pipefail
          node --check applications/holofractal_harmonizer/src/production-recovery.mjs
          node --check applications/holofractal_harmonizer/src/visual-ide.mjs
          cd applications/holofractal_harmonizer
          timeout 300s node --test tests/pass176-stability.test.mjs
          timeout 600s npm test

      - name: Commit repair and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pass176-live-dom-repair.yml
          git add applications/holofractal_harmonizer/src/production-recovery.mjs applications/holofractal_harmonizer/src/visual-ide.mjs
          git diff --cached --check
          git commit -m 'Preserve live IDE DOM during Pass 176 workspace switching'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:agent/pass176-frozen-ide-stabilization; then
              exit 0
            fi
            git pull --rebase origin agent/pass176-frozen-ide-stabilization
            sleep $((attempt * 2))
          done
          exit 1
