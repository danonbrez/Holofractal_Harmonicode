name: Pass 219 Universal Quantization Constraint Audit

on:
  pull_request:
    paths:
      - 'HHS_PASS_219_APPEND_ONLY_LO_SHU_DYADIC_QUADRATIC_RECIPROCITY_QUANTIZATION_AMENDMENT_1_7_0.md'
      - 'docs/pass219/APPENDIX_G_UNIVERSAL_QUANTIZATION_CONSTRAINT_ENFORCEMENT_LAW.md'
      - 'docs/whitepapers/HARMONICODE_LO_SHU_DYADIC_QUADRATIC_RECIPROCITY_PHASE_RING_THEOREM.md'
      - 'hhs_runtime/pass219_quantization_constraint_reference_v1.py'
      - 'tests/test_hhs_pass219_quantization_constraint_law.py'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_python/runtime/hhs_exact_ctypes_bridge.py'
      - '.github/workflows/pass219-universal-quantization-constraint-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-quantization-constraint-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Build exact shared ABI
        run: make c-abi
      - name: Run UQCEL correspondence audit
        run: python -m pytest -q tests/test_hhs_pass219_quantization_constraint_law.py
