name: Pass219 HHCQ Temporal Cubic Phase8

on:
  push:
    branches:
      - agent/pass219-hhcq-temporal-cubic-phase8-20260907
    paths:
      - 'hhs_runtime/include/hhs_pass219_hhcq_temporal_cubic_1_28.h'
      - 'hhs_runtime/c/hhs_pass219_hhcq_temporal_cubic_1_28.inc'
      - 'hhs_runtime/c/hhs_pass219_hhcq_temporal_regret_1_28.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_hhcq_temporal_cubic_1_28.c'
      - 'benchmarks/pass219/hhcq_temporal_cubic_phase8_benchmark.cpp'
      - 'docs/operations/restart/PASS_219_HHCQ_TEMPORAL_CUBIC_PHASE8_RESTART.md'
      - '.github/workflows/pass219-hhcq-temporal-cubic-phase8.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phase8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
    steps:
      - name: Check out Phase8 branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build exact ABI
        run: |
          set -o pipefail
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Compile and run strict Phase8 C invariants
        run: |
          set -o pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_hhcq_temporal_cubic_1_28.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-phase8-test
          /tmp/pass219-phase8-test

      - name: Reuse frozen Phase3 authenticated hydrated-weight artifact
        uses: actions/download-artifact@v4
        with:
          name: pass219-core-dynamic-circuit-experiment
          path: /tmp/pass219-phase3-artifact
          github-token: ${{ github.token }}
          repository: danonbrez/Holofractal_Harmonicode
          run-id: 34138427959

      - name: Verify frozen Phase3 frame binary
        run: |
          FRAME="$(find /tmp/pass219-phase3-artifact -name PASS_219_PHASE3_HYDRATED_WEIGHT_FRAMES.bin -print -quit)"
          test -n "$FRAME"
          test -s "$FRAME"
          echo '63d0f8816d4c04e10eb5d9644c9c60015b8cdd3b1235f114b3f1821ef08a3433  '"$FRAME" | sha256sum -c -
          printf '%s\n' "$FRAME" > /tmp/pass219-phase3-frame-path
          sha256sum "$FRAME" > /tmp/pass219-phase3-frame.sha256

      - name: Compile and run Phase8 temporal cubic benchmark
        run: |
          set -o pipefail
          mkdir -p artifacts/pass219/phase8
          FRAME="$(cat /tmp/pass219-phase3-frame-path)"
          c++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/hhcq_temporal_cubic_phase8_benchmark.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-phase8-benchmark
          /tmp/pass219-phase8-benchmark "$FRAME" \
            | tee artifacts/pass219/phase8/hhcq_temporal_cubic.json
          cp /tmp/pass219-phase3-frame.sha256 artifacts/pass219/phase8/phase3_frame.sha256

      - name: Validate Phase8 evidence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/pass219/phase8/hhcq_temporal_cubic.json')
          d = json.loads(p.read_text())
          assert d['schema'] == 'HHS_PASS219_HHCQ_TEMPORAL_CUBIC_PHASE8_V1'
          assert d['phase3_frame_binary_sha256'] == '63d0f8816d4c04e10eb5d9644c9c60015b8cdd3b1235f114b3f1821ef08a3433'
          assert d['summary_records'] == 529
          assert d['local_samples'] == 4761
          assert d['phase5_exact_roundtrip_checks'] == 4761
          assert d['lane_local_container_identity_checks'] == 19044
          assert d['resolution_diversity'] == 35
          assert d['target_lane_diversity'] == 4
          assert len(d['target_lane_counts']) == 4 and sum(d['target_lane_counts']) == 4761
          assert d['training_local_samples'] == 3456
          assert d['heldout_local_samples'] == 1305
          assert d['training_unique_digest_count'] == 352
          assert d['heldout_unique_digest_count'] == 137
          assert d['train_heldout_digest_overlap'] == 0
          assert d['tuning_fit_samples'] > 0 and d['tuning_validation_samples'] > 0
          assert len(d['temporal_direction_counts_minus_zero_plus']) == 3
          assert len(d['root_direction_counts_minus_zero_plus']) == 3
          assert sum(d['temporal_direction_counts_minus_zero_plus']) == 4761
          assert sum(d['root_direction_counts_minus_zero_plus']) == 4761
          assert 0 <= d['z72_max_root_count'] <= 72
          assert d['phase7_selected_regret_quantum_units'] > 0
          assert d['phase8_selected_regret_quantum_units'] > 0
          assert d['phase7_selected_training_epochs'] in {4,8,12,16}
          assert d['phase8_selected_training_epochs'] in {4,8,12,16}
          assert d['fixed_policy_state_bytes'] == 112
          assert d['phase7_prediction_replay_equal'] is True
          assert d['phase8_prediction_replay_equal'] is True
          assert d['compact_temporal_cubic_exact_integer'] is True
          assert d['canonical_radical_or_float_solver_used'] is False
          assert d['symbolic_cardano_branch_count'] == 3
          assert d['z72_root_count_not_forced_three'] is True
          assert d['phase5_resolution_locked_during_learning'] is True
          assert d['fixed_size_policy_state'] is True
          assert d['candidate_only'] is True
          assert d['canonical_authority_changed'] is False
          assert d['floating_point_authority'] is False
          assert d['classification'] in {
              'TEMPORAL_BEATS_PHASE7_AND_FIXED',
              'TEMPORAL_BEATS_PHASE7_ONLY',
              'TEMPORAL_PHASE7_REGRET_PARITY',
              'TEMPORAL_REGRESSION_VS_PHASE7',
          }
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Record Phase8 summary
        if: always()
        run: |
          {
            echo '### Pass219 HHCQ temporal cubic Phase8'
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            if test -f artifacts/pass219/phase8/hhcq_temporal_cubic.json; then
              echo '```json'
              cat artifacts/pass219/phase8/hhcq_temporal_cubic.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass219-hhcq-temporal-cubic-phase8
          path: artifacts/pass219/phase8
          if-no-files-found: warn
