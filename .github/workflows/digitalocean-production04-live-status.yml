name: DigitalOcean Production 04 Live Status

on:
  push:
    branches:
      - ops/digitalocean-network-recovery-20260925
    paths:
      - '.github/workflows/digitalocean-production04-live-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
    steps:
      - name: Read production-04 bootstrap status
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "${HHS_SSH_PRIVATE_KEY}" > "$HOME/.ssh/key"
          chmod 0600 "$HOME/.ssh/key"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          159.65.178.254 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH5i+oF94fHuX4ucCM1igqqqYbo6FQp11QX8hFmIna83
          EOF
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/key" -o BatchMode=yes -o ConnectTimeout=15             -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts"             root@159.65.178.254 'bash -s' <<'REMOTE'
          set -u
          echo "=== uptime ==="
          uptime || true
          echo "=== bootstrap processes ==="
          ps -eo pid,etime,cmd --sort=etime | grep -E 'apt|dpkg|pip|make|gcc|python|certbot|nginx|hhs_gui|git clone|git fetch' | grep -v grep || true
          echo "=== repository ==="
          if [[ -d /opt/hhs/app/.git ]]; then
            git -C /opt/hhs/app rev-parse HEAD || true
            git -C /opt/hhs/app status --short || true
          else
            echo "repository-not-yet-created"
          fi
          echo "=== artifacts ==="
          test -s /opt/hhs/app/hhs_runtime/builds/libhhs_runtime.so && echo "native-so-present" || true
          test -s /var/lib/hhs/runtime-os/current/index.html && echo "runtime-os-index-present" || true
          ls -la /var/lib/hhs/warm-boot/releases 2>/dev/null | tail -n 8 || true
          echo "=== services ==="
          systemctl is-active hhs.service 2>/dev/null || true
          systemctl is-active nginx 2>/dev/null || true
          systemctl is-active hhs-certbot-renew.timer 2>/dev/null || true
          ss -ltnp 2>/dev/null | grep -E ':(22|80|443|8080)\b' || true
          echo "=== hhs service status ==="
          systemctl status hhs.service --no-pager --full || true
          echo "=== hhs service properties ==="
          systemctl show hhs.service -p ActiveState -p SubState -p Result -p ExecMainStatus -p ExecStartPre -p ExecStart -p User -p Group -p Environment --no-pager || true
          echo "=== hhs service journal ==="
          journalctl -u hhs.service -n 250 --no-pager || true
          echo "=== immutable agent SQL source path contract ==="
          cd /opt/hhs/app
          /opt/hhs/venv/bin/python - <<'PY'
          from hhs_backend.runtime._immutable_agent_source_capsule_v1 import source
          for rel in (
              "hhs_backend/runtime/immutable_agent_sql_index_v1.py",
              "hhs_backend/runtime/immutable_agent_index_hooks_v1.py",
          ):
              print(f"--- {rel} ---")
              decoded = source(rel).decode("utf-8")
              for lineno, line in enumerate(decoded.splitlines(), 1):
                  lower = line.lower()
                  if any(token in lower for token in ("sqlite", "db_path", "database_path", "path(", "environ", "hhs_")):
                      print(f"{lineno}: {line}")
          PY
          echo "=== host tooling ==="
          command -v node || true
          node --version 2>/dev/null || true
          echo "=== current runtime health ==="
          ls -l /var/lib/hhs/data/runtime/hhs_agent_immutable_index.sqlite3* 2>/dev/null || true
          curl -fsS --max-time 5 http://127.0.0.1:8080/api/system/status || true
          echo
          curl -fsS --max-time 5 http://127.0.0.1:8080/api/interface/status || true
          echo
          echo "=== warm boot verify as service user ==="
          runuser -u hhs -- env HHS_DISABLE_C_AUTOBUILD=1 HHS_DATA_DIR=/var/lib/hhs/data HHS_PASS174_STATE_DIR=/var/lib/hhs/pass174 HHS_PASS194_STATE_ROOT=/var/lib/hhs/pass194 HHS_PASS205_DB=/var/lib/hhs/pass205/continuation.sqlite3 HHS_PASS213_SURFACE_STATE_DIR=/var/lib/hhs/pass213/surface HHS_PASS218_STATE_ROOT=/var/lib/hhs/pass218 HHS_PASS219_LANE5_STATE_ROOT=/var/lib/hhs/pass219/lane5 HHS_RUNTIME_BOOTSTRAP_ROOT=/var/lib/hhs/runtime-bootstrap /opt/hhs/venv/bin/python /opt/hhs/app/deployment/digitalocean/warm_boot_manifest.py verify --repo-root /opt/hhs/app --manifest-root /var/lib/hhs/warm-boot/releases || true
          REMOTE

