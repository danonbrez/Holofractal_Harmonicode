name: HHS Immutable Agent SQL Index

on:
  push:
    branches:
      - agent/immutable-agent-sql-index
      - main
    paths:
      - ".github/bootstrap_immutable_agent_index/**"
      - ".github/workflows/hhs-immutable-agent-sql-index.yml"
      - "hhs_backend/runtime/immutable_agent_sql_index_v1.py"
      - "hhs_backend/runtime/immutable_agent_index_hooks_v1.py"
      - "hhs_backend/runtime/live_fastapi_workflow_v1.py"
      - "tests/test_hhs_immutable_agent_sql_index_v1.py"
      - "HHS_IMMUTABLE_AGENT_SQL_INDEX_CONTRACT_V1.md"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  immutable-agent-index:
    runs-on: ubuntu-latest
    env:
      HHS_AGENT_INDEX_DB: ${{ runner.temp }}/hhs-agent-index.sqlite3
      HHS_COGNITION_AUTO_TICK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Materialize staged implementation
        if: ${{ hashFiles('.github/bootstrap_immutable_agent_index/part-*.b64') != '' }}
        shell: bash
        run: |
          cat .github/bootstrap_immutable_agent_index/part-*.b64 \
            | base64 --decode \
            | gzip --decompress > /tmp/bootstrap_immutable_agent_index.py
          python /tmp/bootstrap_immutable_agent_index.py
          rm -rf .github/bootstrap_immutable_agent_index
          git config user.name "hhs-runtime-bot"
          git config user.email "hhs-runtime-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Implement immutable agent SQL evidence index"
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Install Python validation dependencies
        run: |
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest fastapi uvicorn httpx pydantic

      - name: Compile immutable index surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/immutable_agent_sql_index_v1.py \
            hhs_backend/runtime/immutable_agent_index_hooks_v1.py \
            hhs_backend/runtime/live_fastapi_workflow_v1.py

      - name: Validate immutable SQL evidence boundary
        run: python -m pytest -q tests/test_hhs_immutable_agent_sql_index_v1.py

      - name: Validate inherited cognition and server boundaries
        run: |
          python -m pytest -q \
            tests/test_hhs_live_cognition_runtime_v1.py \
            tests/test_hhs_cognition_routes_v1.py \
            tests/test_hhs_server_cognition_boot_v1.py \
            tests/test_hhs_live_kernel_bridge_boundaries_v1.py

      - name: Validate inherited native runtime
        run: make verify-c
