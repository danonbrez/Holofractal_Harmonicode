name: DigitalOcean Network Recovery Probe

on:
  push:
    branches:
      - ops/digitalocean-network-recovery-20260925
    paths:
      - '.github/workflows/digitalocean-network-recovery-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      HHS_SSH_PRIVATE_KEY: ${{ secrets.HHS_DIGITALOCEAN_SSH_PRIVATE_KEY }}
    timeout-minutes: 5
    steps:
      - name: Probe production candidates from GitHub runner
        shell: bash
        run: |
          set -u
          for host in 165.227.220.193 167.99.56.95 165.227.64.72; do
            echo "=== HOST $host ==="
            for port in 22 80 443; do
              if timeout 8 bash -c "cat < /dev/null > /dev/tcp/$host/$port" 2>/dev/null; then
                echo "TCP $host:$port OPEN"
              else
                echo "TCP $host:$port CLOSED_OR_UNREACHABLE"
              fi
            done
            echo "-- route --"
            ip route get "$host" || true
          done
          echo "=== DEPLOY SECRET PUBLIC FINGERPRINT ==="
          install -d -m 0700 /tmp/hhs-secret-key
          printf '%s\n' "${HHS_SSH_PRIVATE_KEY}" > /tmp/hhs-secret-key/private
          chmod 0600 /tmp/hhs-secret-key/private
          ssh-keygen -y -f /tmp/hhs-secret-key/private > /tmp/hhs-secret-key/public
          ssh-keygen -lf /tmp/hhs-secret-key/public
          cat /tmp/hhs-secret-key/public
          cat /tmp/hhs-secret-key/public
          echo "=== CLEAN HOST SSH KEY ==="
          mkdir -p /tmp/hhs-probe
          ssh-keyscan -T 8 -t ed25519 165.227.64.72 > /tmp/hhs-probe/known_hosts
          cat /tmp/hhs-probe/known_hosts
          ssh-keygen -lf /tmp/hhs-probe/known_hosts
