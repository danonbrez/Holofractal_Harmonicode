name: Pass 220 Lane5 Intrinsic Hash States and Native Composition

on:
  pull_request:
    paths:
      - 'hhs_backend/runtime/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.py'
      - 'hhs_backend/runtime/hhs_pass220_holographic_hash216_lane5_bridge_v1.py'
      - 'tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py'
      - 'tests/pass220/test_pass220_lane5_hash216_kernel_composition_policy_v1.py'
      - 'hhs_runtime/hhs_pass220_v7_inherited_native_integration_v1.py'
      - 'tests/pass220/test_pass220_v7_inherited_native_integration_v1.py'
      - '.github/workflows/pass220-lane5-intrinsic-hash-states-native-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lane5-kernel-not-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      HHS_DISABLE_C_AUTOBUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused runtime dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Build and link inherited native VM81 and Lane5 runtime
        run: make c-abi
      - name: Intrinsic state validity without JSON boolean authorization
        run: |
          python -m pytest -q tests/pass220/test_pass220_lane5_hash216_kernel_composition_policy_v1.py
          python -m pytest -q tests/pass220/test_pass220_v7_inherited_native_integration_v1.py -k 'native_hash216_uses_harmonicode_glyphs_not_hex'
      - name: Real native phase and Hash72 vector composition, negative kernel failure
        run: |
          python -m pytest -q tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py \
            -k 'lane5_hash216_gpu_search_uses_native_hashes_and_is_candidate_only or hash216_boolean_metadata_cannot_override_native_lane5_kernel'
      - name: Prevent accidental canonical state promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('hhs_backend/runtime/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.py').read_text()
          assert 'if not candidate.validated' not in src
          assert 'duplicate Hash216 candidate' not in src
          assert 'self.phase.prime_route(tick, matrix, offsets)' in src
          assert 'self.gpu.rank_hash72_vectors(' in src
          assert '"gpu_may_commit_hash72": False' in src
          assert '"gpu_may_commit_hash216": False' in src
          print('HASH72_HASH216_INHERENT_STATE_VALIDITY=PASS')
          print('COMPOSITION_VALIDATION_PATH=NATIVE_LANE5_AND_VM81')
          print('NO_JSON_FLAG_CANONICAL_ADMISSION=PASS')
          PY
