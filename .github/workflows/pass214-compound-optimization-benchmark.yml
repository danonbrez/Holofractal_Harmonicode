name: Pass 214 Compound Optimization Benchmark Authority

on:
  push:
    branches:
      - main
      - agent/pass214-operating-compression-gradient
    paths:
      - 'HHS_PASS_214_REPOSITORY_WIDE_COMPOUND_OPTIMIZATION_BENCHMARK_AUTHORITY.md'
      - 'contracts/pass214/**'
      - 'docs/pass214/**'
      - 'evidence/pass214/**'
      - 'hhs_backend/runtime/hhs_pass214_repository_census_v1.py'
      - 'hhs_backend/runtime/hhs_pass214_callable_conformance_v1.py'
      - 'hhs_backend/runtime/pass214_i2_payload/**'
      - 'tools/pass214_repository_census.py'
      - 'tools/pass214_callable_conformance.py'
      - 'scripts/run_pass214_contract_validation.sh'
      - 'tests/test_hhs_pass214_contract_v2.py'
      - 'tests/test_hhs_pass214_repository_census_v1.py'
      - 'tests/test_hhs_pass214_callable_conformance_v1.py'
      - 'tests/pass214_i2_test_payload/**'
      - '.github/workflows/pass214-compound-optimization-benchmark.yml'

permissions:
  contents: read

jobs:
  iteration2-conformance:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pytest
      - name: Validate Pass 214 Iterations 1 and 2
        run: bash scripts/run_pass214_contract_validation.sh
      - name: Generate immutable Iteration 1 census
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration1"
          python tools/pass214_repository_census.py \
            --repository-root . \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-iteration1" \
            | tee "$RUNNER_TEMP/pass214-iteration1-validation.log"
      - name: Generate Iteration 2 callable conformance graph
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration2"
          python tools/pass214_callable_conformance.py \
            --repository-root . \
            --iteration1-directory "$RUNNER_TEMP/pass214-iteration1" \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-iteration2" \
            | tee "$RUNNER_TEMP/pass214-iteration2-validation.log"
      - name: Retain Pass 214 Iteration 2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass214-iteration2-conformance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pass214-iteration1/*.json
            ${{ runner.temp }}/pass214-iteration2/*.json
            ${{ runner.temp }}/pass214-iteration1-validation.log
            ${{ runner.temp }}/pass214-iteration2-validation.log
          if-no-files-found: error
