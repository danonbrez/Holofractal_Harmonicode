  workflow_dispatch:

concurrency:
  group: hhs-legacy-service-validation-closure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  closure-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workflow parser
        run: python -m pip install --disable-pip-version-check 'pyyaml>=6.0,<7.0'
      - name: Validate frozen dependency-scoped closure
        run: |
          python scripts/validate_legacy_service_workflow_closure_v1.py \
            --output "$RUNNER_TEMP/HHS_LEGACY_SERVICE_VALIDATION_CLOSURE_V1.json"
      - name: Upload closure receipt
        uses: actions/upload-artifact@v4
        with:
          name: hhs-legacy-service-validation-closure-${{ github.run_id }}
          path: ${{ runner.temp }}/HHS_LEGACY_SERVICE_VALIDATION_CLOSURE_V1.json
          if-no-files-found: error
          retention-days: 30
