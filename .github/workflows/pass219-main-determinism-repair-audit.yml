name: Pass 219 Main Determinism Repair Audit

on:
  push:
    branches:
      - agent/pass219-main-determinism-repair-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Compile-check all workflows
        run: "$(go env GOPATH)/bin/actionlint -color"
