name: Pass 220 Native NumPy IEEE P Bridge
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_native_numpy_ieee_p_bridge_v1.py"
      - "tests/pass220/test_pass220_native_numpy_ieee_p_bridge_v1.py"
      - ".github/workflows/pass220-native-numpy-ieee-p-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ieee-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Exact NumPy IEEE/Lo Shu P bridge regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_native_numpy_ieee_p_bridge_v1.py
