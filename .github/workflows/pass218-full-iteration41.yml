name: Pass 218 Full Iteration 41

on:
  push:
    branches:
      - agent/pass218-full-iteration41-manifest-bound-canonical-learning-ingress
  pull_request:
    branches:
      - main
    paths:
      - 'hhs_runtime/pass218/manifest_bound_canonical_learning_ingress_i41.py'
      - 'hhs_backend/runtime_os_pass218_manifest_canonical_learning_ingress_i41.py'
      - 'hhs_backend/runtime_os_application_server.py'
      - 'tests/pass218/test_pass218_iteration41_manifest_bound_canonical_learning_ingress.py'
      - 'scripts/pass218_iteration41_manifest_canonical_learning_ingress_validation.py'
      - 'docs/pass218/PASS_218_ITERATION_41_RESTART.md'
      - '.github/workflows/pass218-full-iteration41.yml'

permissions:
  contents: read

jobs:
  manifest-bound-canonical-learning-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Iteration 41 head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped validation packages
        run: python -m pip install --upgrade pytest fastapi httpx cryptography uvicorn

      - name: Compile cumulative Pass 218 and I40-I41 bindings
        run: |
          python -m py_compile hhs_runtime/pass218/*.py
          python -m py_compile hhs_backend/runtime_os_pass218_manifest_canonical_commit_persistence_i40.py
          python -m py_compile hhs_backend/runtime_os_pass218_manifest_canonical_learning_ingress_i41.py
          python -m py_compile hhs_backend/runtime_os_application_server.py
          python -m py_compile scripts/pass218_iteration41_manifest_canonical_learning_ingress_validation.py
          python -m py_compile tests/pass218/test_pass218_iteration41_manifest_bound_canonical_learning_ingress.py

      - name: Enforce global Pass 218 and I40-I41 no-authoritative-float literals
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = sorted(Path('hhs_runtime/pass218').glob('*.py')) + [
              Path('hhs_backend/runtime_os_pass218_manifest_canonical_commit_persistence_i40.py'),
              Path('hhs_backend/runtime_os_pass218_manifest_canonical_learning_ingress_i41.py'),
          ]
          assert paths
          for path in paths:
              tree = ast.parse(path.read_text('utf-8'))
              floats = [node for node in ast.walk(tree) if isinstance(node, ast.Constant) and isinstance(node.value, float)]
              assert not floats, f'{path}: authoritative float literal(s) found'
          print('PASS218_I41_GLOBAL_NO_FLOAT_LITERAL_AUTHORITY=1')
          PY

      - name: Run focused I41 manifest-bound canonical learning ingress tests
        run: pytest -q tests/pass218/test_pass218_iteration41_manifest_bound_canonical_learning_ingress.py

      - name: Preserve frozen I40 canonical commit persistence semantics
        run: pytest -q tests/pass218/test_pass218_iteration40_manifest_bound_canonical_commit_persistence.py

      - name: Preserve frozen I30 semantic promotion separation
        run: pytest -q tests/pass218/test_pass218_iteration30_atomic_semantic_promotion.py

      - name: Preserve frozen I29 validation semantics
        run: pytest -q tests/pass218/test_pass218_iteration29_hash216_vm5184_validation.py

      - name: Preserve frozen I27 differentiation semantics
        run: pytest -q tests/pass218/test_pass218_iteration27_formal_analogical_differentiation.py

      - name: Preserve frozen I7 durable canonical persistence semantics
        run: pytest -q tests/pass218/test_pass218_iteration7_durable_canonical_persistence.py

      - name: Preserve frozen I6 atomic canonical commit semantics
        run: pytest -q tests/pass218/test_pass218_iteration6_canonical_commit_boundary.py

      - name: Preserve I33 curriculum authority semantics
        run: pytest -q tests/pass218/test_pass218_iteration33_curriculum_advance.py

      - name: Preserve canonical writer-fence semantics
        run: pytest -q tests/pass218/test_pass218_iteration9_multiprocess_canonical_ownership.py

      - name: Preserve inherited Pass205 native continuation ABI
        run: pytest -q tests/test_hhs_pass205_continuation_runtime_v1.py

      - name: Preserve Pass 166 Word2Vec runtime semantics
        run: pytest -q tests/test_hhs_pass166_word2vec_v1.py

      - name: Preserve repository-native creative-writing crawler boundary
        run: pytest -q tests/pass218/test_repository_native_creative_writing_crawler.py

      - name: Emit deterministic I41 canonical learning ingress evidence
        run: PYTHONPATH="$PWD" python scripts/pass218_iteration41_manifest_canonical_learning_ingress_validation.py

      - name: Preserve RuntimeOS production-root acceptance
        run: pytest -q tests/test_runtime_os_production_root.py

      - name: Upload I41 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass218-iteration41-manifest-bound-canonical-learning-ingress-evidence
          path: .i41-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
