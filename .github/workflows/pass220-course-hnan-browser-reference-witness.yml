name: Pass 220 Course HNAN Browser Reference Witness
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_course_hnan_browser_reference_witness_v1.py"
      - "tests/pass220/test_pass220_course_hnan_browser_reference_witness_v1.py"
      - ".github/workflows/pass220-course-hnan-browser-reference-witness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inherited-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Execute unchanged HTML HNAN reference and enforce no native authority
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_course_hnan_browser_reference_witness_v1.py
