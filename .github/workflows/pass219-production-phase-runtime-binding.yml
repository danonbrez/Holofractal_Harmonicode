name: Pass 219 Production Phase Runtime Binding

on:
  workflow_dispatch:
  pull_request:
    paths:
      - hhs_runtime/pass219/production_phase_geometry_binding.py
      - hhs_runtime/pass219/phase_geometry_learning.py
      - hhs_runtime/pass219/recursive_manifold_learning.py
      - hhs_runtime/hhs_pass219_raw5184_octonion_audio_hydration_v1.py
      - hhs_runtime/hhs_pass219_global_raw5184_serialization_hydration_v1.py
      - hhs_runtime/core_sandbox/hhs_octonion_digital_dna_u72_table_v1.py
      - hhs_runtime/pass169/runtime_binding.py
      - tests/pass219/test_pass219_production_phase_geometry_binding.py
      - tests/pass219/test_pass219_phase_geometry_learning.py
      - tests/pass219/test_pass219_recursive_manifold_learning.py
      - tests/pass219/test_pass219_raw5184_octonion_audio_hydration_v1.py
      - contracts/pass219/PASS_219_RML3_PRODUCTION_PHASE_RUNTIME_BINDING_1_0.json
      - .github/workflows/pass219-production-phase-runtime-binding.yml

jobs:
  targeted-rml3-production-phase-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run RML1 RML2 RML3 and I148 dependency-scope validation
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_recursive_manifold_learning.py \
            tests/pass219/test_pass219_phase_geometry_learning.py \
            tests/pass219/test_pass219_production_phase_geometry_binding.py \
            tests/pass219/test_pass219_raw5184_octonion_audio_hydration_v1.py
