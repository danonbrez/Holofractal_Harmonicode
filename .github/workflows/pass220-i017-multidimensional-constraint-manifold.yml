name: Pass 220 I017 Multidimensional Constraint Manifold

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "hhs_runtime/hhs_pass220_lo_shu_normalization_v1.py"
      - "tests/pass220/test_hhs_pass220_lo_shu_normalization_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "whitepapers/HHS_PASS220_MULTIDIMENSIONAL_CONSTRAINT_MANIFOLD_V1.md"
      - "docs/pass220/PASS_220_I017_MULTIDIMENSIONAL_CONSTRAINT_MANIFOLD.md"
      - ".github/workflows/pass220-i017-multidimensional-constraint-manifold.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py"
      - "hhs_runtime/hhs_pass220_palindromic_ordered_phase_v1.py"
      - "tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py"
      - "hhs_runtime/hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py"
      - "hhs_runtime/hhs_pass220_lo_shu_normalization_v1.py"
      - "tests/pass220/test_hhs_pass220_lo_shu_normalization_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "whitepapers/HHS_PASS220_MULTIDIMENSIONAL_CONSTRAINT_MANIFOLD_V1.md"
      - "docs/pass220/PASS_220_I017_MULTIDIMENSIONAL_CONSTRAINT_MANIFOLD.md"
      - ".github/workflows/pass220-i017-multidimensional-constraint-manifold.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run I017 and inherited exact constraint surfaces
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_multidimensional_constraint_manifold_v1.py
          tests/pass220/test_hhs_pass220_palindromic_ordered_phase_v1.py
          tests/pass220/test_hhs_pass220_g41_sudoku_fingerprint_algebra_v1.py
          tests/pass220/test_hhs_pass220_lo_shu_normalization_v1.py
