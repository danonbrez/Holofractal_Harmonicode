name: Pass 219 Lane 5 Nine-Loop Training Specimen 1.71

on:
  pull_request:
    branches: [main]
    paths:
      - 'training_specimens/HHS_NINE_LOOP_FOREIGN_EQUIVALENCE_FEEDBACK_SPECIMEN_1_71.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_TRAINING_SPECIMEN_1_71.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_TRAINING_SPECIMEN_1_71.md'
      - 'hhs_runtime/pass219/lane5_nine_loop_training_specimen_1_71.py'
      - 'hhs_runtime/include/hhs_pass219_lane5_nine_loop_training_specimen_cell_wall_1_71.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_nine_loop_training_specimen_cell_wall_1_71.cpp'
      - 'tests/pass219/test_pass219_lane5_nine_loop_training_specimen_1_71.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_training_specimen_cell_wall_1_71.cpp'
      - 'docs/whitepapers/HHS_LANE5_NINE_LOOP_TRAINING_SPECIMEN_1_71.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'GNUmakefile'
      - '.github/workflows/pass219-lane5-nine-loop-training-specimen-1-71.yml'
  push:
    branches:
      - main
      - agent/pass219-lane5-nine-loop-training-specimen-1-71-20260928
    paths:
      - 'training_specimens/HHS_NINE_LOOP_FOREIGN_EQUIVALENCE_FEEDBACK_SPECIMEN_1_71.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_TRAINING_SPECIMEN_1_71.json'
      - 'contracts/pass219/PASS_219_LANE5_NINE_LOOP_TRAINING_SPECIMEN_1_71.md'
      - 'hhs_runtime/pass219/lane5_nine_loop_training_specimen_1_71.py'
      - 'hhs_runtime/include/hhs_pass219_lane5_nine_loop_training_specimen_cell_wall_1_71.hpp'
      - 'hhs_runtime/cpp/hhs_pass219_lane5_nine_loop_training_specimen_cell_wall_1_71.cpp'
      - 'tests/pass219/test_pass219_lane5_nine_loop_training_specimen_1_71.py'
      - 'tests/pass219/test_pass219_lane5_nine_loop_training_specimen_cell_wall_1_71.cpp'
      - 'docs/whitepapers/HHS_LANE5_NINE_LOOP_TRAINING_SPECIMEN_1_71.md'
      - 'docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md'
      - 'GNUmakefile'
      - '.github/workflows/pass219-lane5-nine-loop-training-specimen-1-71.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nine-loop-training-specimen-1-71:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped test dependency
        run: python -m pip install pytest numpy

      - name: Verify canonical training specimen identity
        run: |
          PYTHONPATH="$PWD" python - <<'PY'
          from hhs_runtime.pass219.lane5_nine_loop_training_specimen_1_71 import (
              SPECIMEN_SHA256,
              build_training_record,
              verify_specimen,
          )

          receipt = verify_specimen()
          record = build_training_record()
          assert receipt["training_specimen_sha256"] == (
              "96a9f686a1ab35c8600ba7a38a367af38339b51a70182c3d7981ee529ff50191"
          )
          assert receipt["training_specimen_sha256"] == SPECIMEN_SHA256
          assert receipt["training_feedback_label_count"] == 13
          assert receipt["learning_objective_count"] == 5
          assert receipt["deviation_feature_count"] == 16
          assert record["dataset_preparation_only"] is True
          assert record["model_weight_update_authority"] is False
          assert record["learning_commit_authority"] is False
          PY

      - name: Run 1.71 and nine-loop parent Python regressions
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/pass219/test_pass219_lane5_nine_loop_training_specimen_1_71.py \
            tests/pass219/test_pass219_lane5_nine_loop_feedback_1_70.py \
            tests/pass219/test_pass219_lane5_nine_loop_large_artifact_1_69.py \
            tests/pass219/test_pass219_lane5_nine_loop_source_attestation_1_68.py \
            tests/pass219/test_pass219_lane5_nine_loop_foreign_equivalence_1_67.py

      - name: Build shared exact VM81 runtime
        run: make -f GNUmakefile c-kernel

      - name: Compile native 1.71 conformance
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_nine_loop_training_specimen_cell_wall_1_71.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -pthread \
            -o /tmp/test_pass219_lane5_nine_loop_training_specimen_1_71

      - name: Run native 1.71 conformance
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: /tmp/test_pass219_lane5_nine_loop_training_specimen_1_71

      - name: Verify dataset-only authority boundary
        run: |
          grep -F '96a9f686a1ab35c8600ba7a38a367af38339b51a70182c3d7981ee529ff50191' \
            contracts/pass219/PASS_219_LANE5_NINE_LOOP_TRAINING_SPECIMEN_1_71.json
          grep -F '"model_weight_update_authority": false' \
            training_specimens/HHS_NINE_LOOP_FOREIGN_EQUIVALENCE_FEEDBACK_SPECIMEN_1_71.json
          grep -F '"learning_commit_authority": false' \
            training_specimens/HHS_NINE_LOOP_FOREIGN_EQUIVALENCE_FEEDBACK_SPECIMEN_1_71.json
          grep -F '"canonical_hash216_authority": false' \
            training_specimens/HHS_NINE_LOOP_FOREIGN_EQUIVALENCE_FEEDBACK_SPECIMEN_1_71.json
