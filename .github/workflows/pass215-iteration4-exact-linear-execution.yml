name: Pass 215 Iteration 4 Exact Linear Execution

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pass215-transformer-ingestion-benchmark
    paths:
      - 'contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v1.py'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v2.py'
      - 'tools/pass215_iteration4_exact_linear_execution.py'
      - 'tests/test_hhs_pass215_iteration4_exact_linear_execution_v1.py'
      - 'scripts/run_pass215_iteration4_validation.sh'
      - 'docs/pass215/**'
      - 'evidence/pass215/**'
      - '.github/workflows/pass215-iteration4-exact-linear-execution.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v1.py'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v2.py'
      - 'tools/pass215_iteration4_exact_linear_execution.py'
      - 'tests/test_hhs_pass215_iteration4_exact_linear_execution_v1.py'
      - 'scripts/run_pass215_iteration4_validation.sh'
      - 'docs/pass215/**'
      - 'evidence/pass215/**'
      - '.github/workflows/pass215-iteration4-exact-linear-execution.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PASS215_I4_MODEL_SHA256: '6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04'

jobs:
  prepare-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: pass215-shared-model-stories15m-q4_0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Restore shared Pass 215 model cache
        id: restore-pass215-model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pass215-model-cache
          key: pass215-shared-model-stories15m-q4_0-6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04
      - name: Populate shared Pass 215 model cache
        if: steps.restore-pass215-model-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/fetch_pass215_authenticated_open_transformer.sh \
            --cache-dir "$RUNNER_TEMP/pass215-model-cache" \
            --expected-sha256 "6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04"
      - name: Upload workflow-scoped Pass 215 model artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass215-shared-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pass215-model-cache/stories15M-q4_0.gguf
          if-no-files-found: error
          retention-days: 1
  iteration4:
    needs: prepare-model
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pytest
      - name: Validate frozen authority and Iteration 2-3 controls
        run: |
          test "$(git hash-object contracts/pass215/PASS_215_BENCHMARK_PROFILE.json)" = "b458d674a75a4cfc64a32b9203dd693e3603576e"
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json').read_text())
          assert contract['inherits']['pass214_authority_root_hash216'] == 'c1d7875acd45f02da75101f5953541b6e1ce8ea3bb2cac39645004ab2509aeb8'
          assert contract['inherits']['pass215_benchmark_profile_root_hash216'] == 'a3079f0f0b94d9fb485970662455482d4dab86e01802ca5bfdef6af3fbb6d85e'
          assert contract['inherits']['iteration2_real_model_evidence_root_hash216'] == '0c18a5055b01bee0401d9ad0b3caba9c5d214d80a6dd809b190e106681b22e70'
          assert contract['inherits']['iteration3_real_model_evidence_root_hash216'] == '61e301f728e426b46dbdd7c435c06b7c7f0065b177d62313152494467ed7d021'
          assert contract['inherits']['iteration3_transformer_layer_dictionary_gain_bytes'] == 0
          assert contract['constraints']['post_hoc_candidate_redefinition_forbidden'] is True
          assert contract['constraints']['full_transformer_layer_forward_executed'] is False
          assert contract['constraints']['runtime_mutation_authority_promoted'] is False
          assert contract['constraints']['canonical_mutation_authorized'] is False
          PY
      - name: Run cumulative Pass 215 Iteration 1-4 validation
        run: bash scripts/run_pass215_iteration4_validation.sh
      - name: Download prepared Pass 215 model artifact
        uses: actions/download-artifact@v4
        with:
          name: pass215-shared-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pass215-model-cache

      - name: Materialize authenticated open transformer
        run: |
          ROOT="$RUNNER_TEMP/pass215-i4"
          bash scripts/fetch_pass215_authenticated_open_transformer.sh \
            --cache-dir "$RUNNER_TEMP/pass215-model-cache" \
            --target-dir "$ROOT" \
            --expected-sha256 "$PASS215_I4_MODEL_SHA256"

      - name: Execute authenticated blk.0 exact linear suite process A
        run: |
          ROOT="$RUNNER_TEMP/pass215-i4"
          python tools/pass215_iteration4_exact_linear_execution.py \
            --container "$ROOT/stories15M-q4_0.gguf" \
            --source-kind public_open_transformer \
            --repo-id ggml-org/tiny-llamas \
            --revision main \
            --expected-sha256 "$PASS215_I4_MODEL_SHA256" \
            --output "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_A.json"
          python tools/pass215_iteration4_exact_linear_execution.py \
            --validate "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_A.json" \
            --output "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_A_VALIDATION.json"
      - name: Execute independent cross-process replay process B
        run: |
          ROOT="$RUNNER_TEMP/pass215-i4"
          python tools/pass215_iteration4_exact_linear_execution.py \
            --container "$ROOT/stories15M-q4_0.gguf" \
            --source-kind public_open_transformer \
            --repo-id ggml-org/tiny-llamas \
            --revision main \
            --expected-sha256 "$PASS215_I4_MODEL_SHA256" \
            --output "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_B.json"
          python tools/pass215_iteration4_exact_linear_execution.py \
            --validate "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_B.json" \
            --output "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_B_VALIDATION.json"
          python tools/pass215_iteration4_exact_linear_execution.py \
            --compare-replay \
              "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_A.json" \
              "$ROOT/PASS_215_ITERATION_4_REAL_EXECUTION_B.json" \
            --output "$ROOT/PASS_215_ITERATION_4_CROSS_PROCESS_REPLAY_VALIDATION.json"
      - name: Enforce real execution claim boundaries and work accounting
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pass215-i4'
          evidence = json.loads((root / 'PASS_215_ITERATION_4_REAL_EXECUTION_A.json').read_text())
          assert evidence['source']['file_sha256'] == os.environ['PASS215_I4_MODEL_SHA256']
          assert evidence['source']['expected_sha256_verified'] is True
          assert evidence['container']['format'] == 'GGUF'
          assert evidence['controls']['iteration2']['evidence_root_hash216'] == '0c18a5055b01bee0401d9ad0b3caba9c5d214d80a6dd809b190e106681b22e70'
          assert evidence['controls']['iteration2']['raw_canonical_incidence_fraction_exact'] == {'numerator': 0, 'denominator': 1}
          assert evidence['controls']['iteration3']['evidence_root_hash216'] == '61e301f728e426b46dbdd7c435c06b7c7f0065b177d62313152494467ed7d021'
          assert evidence['controls']['iteration3']['transformer_layer_dictionary_gain_bytes'] == 0
          assert evidence['controls']['iteration3']['embedding_output_storage_gain_excluded_from_execution_gain'] is True
          aggregate = evidence['aggregate_execution']
          assert aggregate['operator_count'] == 7
          assert aggregate['source_tensor_bytes'] == 559872
          assert aggregate['quantization_blocks'] == 31104
          assert aggregate['logical_weights'] == 995328
          assert aggregate['dense_reference_work']['exact_rational_scale_multiplications'] == 995328
          assert aggregate['factored_reference_work']['exact_rational_scale_multiplications'] == 31104
          assert aggregate['rational_scale_multiplications_avoided_by_factoring'] == 964224
          assert aggregate['dense_to_factored_rational_scale_multiplication_ratio_exact'] == {'numerator': 32, 'denominator': 1}
          assert aggregate['single_region_continuation_work']['executed_work_units_total'] < aggregate['single_region_full_recompute_control_work']['executed_work_units_total']
          assert aggregate['multi_region_continuation_work']['executed_work_units_total'] < aggregate['multi_region_full_recompute_control_work']['executed_work_units_total']
          assert aggregate['semantic_exactness'] is True
          claims = evidence['claims']
          assert claims['authenticated_real_open_transformer_execution_measured'] is True
          assert claims['seven_blk0_linear_operators_executed'] is True
          assert claims['dense_factored_semantic_exactness'] is True
          assert claims['linear_continuation_delta_executed'] is True
          assert claims['full_transformer_layer_forward_executed'] is False
          assert claims['rmsnorm_execution_claimed'] is False
          assert claims['attention_softmax_execution_claimed'] is False
          assert claims['silu_execution_claimed'] is False
          assert claims['canonical_float_interpretation_performed'] is False
          assert claims['dense_forward_replaced'] is False
          assert claims['exact_nonlinear_transformer_operators_implemented'] is False
          assert claims['pass213_compiled_rom_runtime_mutation_performed'] is False
          assert claims['fifty_billion_desktop_feasibility_claimed'] is False
          assert evidence['authority']['runtime_mutation_authority_promoted'] is False
          assert evidence['authority']['canonical_mutation_authorized'] is False
          replay = json.loads((root / 'PASS_215_ITERATION_4_CROSS_PROCESS_REPLAY_VALIDATION.json').read_text())
          assert replay['valid'] is True
          assert replay['separate_process_invocations'] is True
          print('PASS215_I4_SINGLE_DELTA_WORK=' + str(aggregate['single_region_continuation_work']['executed_work_units_total']))
          print('PASS215_I4_SINGLE_FULL_WORK=' + str(aggregate['single_region_full_recompute_control_work']['executed_work_units_total']))
          print('PASS215_I4_MULTI_DELTA_WORK=' + str(aggregate['multi_region_continuation_work']['executed_work_units_total']))
          print('PASS215_I4_MULTI_FULL_WORK=' + str(aggregate['multi_region_full_recompute_control_work']['executed_work_units_total']))
          print('PASS215_I4_SUITE_ROOT=' + evidence['suite_output_root_hash216'])
          print('PASS215_I4_EVIDENCE_ROOT=' + evidence['evidence_root_hash216'])
          PY
      - name: Retain Iteration 4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass215-iteration4-${{ github.run_id }}
          path: |
            contracts/pass215/PASS_215_BENCHMARK_PROFILE.json
            contracts/pass215/PASS_215_ITERATION_1_CONTRACT.json
            contracts/pass215/PASS_215_ITERATION_2_CONTRACT.json
            contracts/pass215/PASS_215_ITERATION_3_CONTRACT.json
            contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json
            docs/pass215/**
            evidence/pass215/**
            ${{ runner.temp }}/pass215-i4/*.json
          if-no-files-found: error
