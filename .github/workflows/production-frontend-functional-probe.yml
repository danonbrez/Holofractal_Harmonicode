name: Production Frontend Functional Probe

on:
  push:
    branches:
      - repair/production-frontend-functional-closure-20261005
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api-functional-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe live frontend execution routes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, ssl, urllib.request, urllib.error, time
          BASE = "https://159.65.178.254"
          ctx = ssl._create_unverified_context()

          def request(method, path, payload=None, timeout=120):
              data = None
              headers = {"accept":"application/json"}
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["content-type"] = "application/json"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              started=time.time()
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=timeout) as res:
                      raw=res.read().decode("utf-8","replace")
                      status=res.status
              except urllib.error.HTTPError as exc:
                  raw=exc.read().decode("utf-8","replace")
                  status=exc.code
              elapsed=round(time.time()-started,3)
              print(json.dumps({"path":path,"method":method,"status":status,"elapsed_s":elapsed,"body_preview":raw[:900]}))
              body=json.loads(raw) if raw else {}
              if status < 200 or status >= 300:
                  raise SystemExit(f"{method} {path} failed HTTP {status}")
              return body

          services=request("GET","/api/runtime/services",timeout=60)
          assert len(services.get("services") or []) == 380

          service_name="agent_economy.agent_algorithm_identity_v1_self_test"
          dispatch=request("POST","/api/runtime/services/dispatch",{"service":service_name,"payload":{}},timeout=120)
          assert dispatch.get("schema") == "HHS_SERVICE_DISPATCH_RECORD_V1", dispatch.get("schema")

          request("POST","/api/runtime/workspace/command",{
              "schema":"HHS_WORKSPACE_COMMAND_ENVELOPE_V1",
              "operation":"project.create",
              "project_id":"project:default",
              "authority_tier":"ADMINISTRATIVE_PROJECT_OPERATION",
              "payload":{"name":"Production Functional Probe"},
              "requires_fastapi_authority":True,
              "frontend_may_commit_runtime_truth":False
          },timeout=120)

          assistant=request("POST","/api/assistant/chat",{
              "thread_id":None,
              "project_id":"project:production-functional-probe",
              "title":"Production Functional Probe",
              "metadata":{"workspace_surface":"production_mobile_control","assistant_mode":"GENERAL_CHAT"},
              "content":"Reply with a concise production functional confirmation.",
              "custom_system_instruction":None,
              "assistant_mode":"GENERAL_CHAT",
              "user_context":None
          },timeout=180)
          assert assistant.get("ok") is True

          html=b"<!doctype html><html><body><h1>HHS functional probe</h1></body></html>"
          quick=request("POST","/api/v1/pass174/sdlc/run",{
              "project_id":None,
              "project_name":"Production Functional Probe",
              "source_name":"index.html",
              "source_modality":"TEXT",
              "source_payload":{"source_b64":base64.b64encode(html).decode(),"mime_type":"text/html","source_size_bytes":len(html)},
              "requested_output":"VALIDATED_ARTIFACT",
              "expression":None,
              "target":"HHS_IR",
              "steps":1,
              "provenance":"RUNTIME_OS_MOBILE_QUICK_BUILD",
              "authorization_scope":"P174_MOBILE_APPLICATION_DEVELOPMENT_PIPELINE",
              "thread":0
          },timeout=240)
          assert quick.get("ok") is True

          print("HHS_PRODUCTION_FRONTEND_API_FUNCTIONAL_PROBE=PASS")
          PY

  live-browser-functional-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend verification runtime
        working-directory: hhs_gui
        run: npm ci
      - name: Install Chromium
        working-directory: hhs_gui
        run: npx playwright install --with-deps chromium
      - name: Execute live browser functions
        env:
          HHS_PRODUCTION_BASE_URL: https://159.65.178.254
          HHS_PRODUCTION_EXPECTED_SHA: 5660cb38e556422f284b394d0ef72b26ca351c1a
          HHS_PRODUCTION_EXPECTED_SERVICE_COUNT: "380"
          HHS_PRODUCTION_BROWSER_IGNORE_HTTPS_ERRORS: "1"
          HHS_PRODUCTION_BROWSER_EVIDENCE_DIR: /tmp/hhs-production-browser-functional
        run: node hhs_gui/scripts/production-live-browser-verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-functional-probe
          path: /tmp/hhs-production-browser-functional
          if-no-files-found: warn
