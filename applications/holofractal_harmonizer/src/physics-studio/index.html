<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HHS Pass 178 Physics Studio</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#060811;color:#eef7ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#15374d,#080b14 45%,#03050a)}
header{padding:18px 22px;border-bottom:1px solid #29425c}main{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 90px)}
aside,section{padding:16px}aside{border-right:1px solid #24364b;background:#09101bcc}
button,select,textarea{width:100%;margin:5px 0;padding:10px;border:1px solid #365574;border-radius:9px;background:#0e1827;color:#eef7ff}
button{background:linear-gradient(135deg,#56d9c8,#719dff);color:#031018;font-weight:800}.card{border:1px solid #2a3e59;border-radius:12px;padding:12px;background:#09111ddd}
pre{white-space:pre-wrap;overflow:auto;max-height:70vh}.chip{display:inline-block;border:1px solid #3a5a7b;border-radius:999px;padding:4px 8px;margin:2px;font-size:.75rem}
canvas{width:100%;height:420px;background:#02040a;border-radius:10px;border:1px solid #263a55}
@media(max-width:850px){main{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #24364b}}
</style></head>
<body><header><h1>Pass 178 Relativistic Quantum Simulation Studio</h1><p>Exact model state → inherited VM81 admission → immutable render packet → visual projection</p></header>
<main><aside>
<div id="chips"></div>
<select id="template"><option value="relativity">Relativistic particle</option><option value="quantum">Quantum Cayley nucleus</option><option value="harmonicode">Harmonicode membrane</option></select>
<button id="load">Load template</button><button id="create">Register + admit</button><button id="step">Single exact step</button><button id="replay">Replay proof</button>
<textarea id="model" rows="18"></textarea>
<small>Browser rendering is projection-only and never feeds values back into simulation authority.</small>
</aside><section>
<div class="card"><h2>Projection viewport</h2><canvas id="view" width="900" height="420"></canvas></div>
<div class="card"><h2>Evidence</h2><pre id="evidence">Loading status…</pre></div>
</section></main><script src="./app.js"></script></body></html>
