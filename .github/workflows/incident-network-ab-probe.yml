name: Incident Dispatch Exact Main Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-network-ab-probe.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch authoritative Exact-Main recovery promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: deb60572fd45e922ae4d9a29a79bcb1bcf2ab93b
        run: |
          set -euo pipefail
          actual=$(gh api repos/danonbrez/Holofractal_Harmonicode/commits/main --jq '.sha')
          [[ "$actual" == "$TARGET_SHA" ]] || {
            echo "main moved: expected=$TARGET_SHA actual=$actual" >&2
            exit 2
          }
          gh workflow run digitalocean-production-main.yml \
            --repo danonbrez/Holofractal_Harmonicode \
            --ref main
          echo "EXACT_MAIN_RECOVERY_DISPATCHED=1"
          echo "EXACT_MAIN_RECOVERY_TARGET=$TARGET_SHA"
