name: Pass 219 Harmonic36 Nested VM

on:
  push:
    branches:
      - agent/pass219-fourth-hydration-lane-36bit-harmonic-vm-i1
    paths:
      - 'hhs_runtime/include/hhs_pass219_harmonic36_nested_vm_1_0.h'
      - 'hhs_runtime/include/hhs_pass219_harmonic36_nested_vm_1_0.hpp'
      - 'hhs_runtime/include/hhs_pass219_harmonic36_default_binding_1_0.h'
      - 'hhs_runtime/include/hhs_pass219_harmonic36_factorization_fabric_1_0.h'
      - 'hhs_runtime/include/hhs_pass219_harmonic36_hash216_rna_binding_1_0.h'
      - 'hhs_runtime/include/hhs_pass219_harmonic36_compression_gpu_fabric_1_0.h'
      - 'hhs_runtime/include/hhs_pass219_harmonic36_branch_knowledge_fabric_1_0.h'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_nested_vm_*.inc'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_default_binding_1_0.inc'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_factorization_fabric_1_0.inc'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_hash216_rna_binding_1_0.inc'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_compression_gpu_fabric_1_0.inc'
      - 'hhs_runtime/c/hhs_pass219_harmonic36_branch_knowledge_fabric_1_0.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_harmonic36_nested_vm_1_0.c'
      - 'tests/pass219/test_pass219_harmonic36_nested_vm_1_0.cpp'
      - 'tests/pass219/test_pass219_harmonic36_default_binding_1_0.c'
      - 'tests/pass219/test_pass219_harmonic36_factorization_fabric_1_0.c'
      - 'tests/pass219/test_pass219_harmonic36_hash216_rna_binding_1_0.c'
      - 'tests/pass219/test_pass219_harmonic36_compression_gpu_fabric_1_0.c'
      - 'tests/pass219/test_pass219_harmonic36_branch_knowledge_fabric_1_0.c'
      - 'hhs_runtime/hhs_pass219_harmonic36_knowledge_graph_bridge_v1.py'
      - 'tests/pass219/test_pass219_harmonic36_knowledge_graph_bridge_v1.py'
      - 'hhs_runtime/hhs_service_registry_v1.py'
      - 'contracts/pass219/PASS_219_MANDATORY_HARMONIC36_DEFAULT_STATE_INTEGRATION_1_0.json'
      - 'docs/pass219/PASS_219_MANDATORY_HARMONIC36_DEFAULT_STATE_INTEGRATION_1_0.md'
      - 'docs/operations/restart/PASS_219_FOURTH_HYDRATION_LANE_36BIT_HARMONIC_VM_I1_RESTART.md'
      - '.github/workflows/pass219-harmonic36-default-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harmonic36-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Strict C11 kernel compile
        run: |
          mkdir -p /tmp/h36
          gcc -x c -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             -c hhs_runtime/c/hhs_pass219_harmonic36_nested_vm_1_0.inc             -o /tmp/h36/core.o
          gcc -x c -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             -c hhs_runtime/c/hhs_pass219_harmonic36_default_binding_1_0.inc             -o /tmp/h36/binding.o

      - name: Exact 5184 nested VM conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_harmonic36_nested_vm_1_0.c             /tmp/h36/core.o             -o /tmp/h36/test-vm
          /tmp/h36/test-vm

      - name: Mandatory default binding conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_harmonic36_default_binding_1_0.c             /tmp/h36/binding.o             -o /tmp/h36/test-binding
          /tmp/h36/test-binding

      - name: C++17 RNA facade conformance
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_harmonic36_nested_vm_1_0.cpp             /tmp/h36/core.o             -o /tmp/h36/test-cpp
          /tmp/h36/test-cpp

      - name: Exact cumulative ABI compile
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/h36/exact-abi.o

      - name: Exact factorization fabric conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_factorization_fabric_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-fabric
          /tmp/h36/test-fabric

      - name: Hash216 RNA binding conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_hash216_rna_binding_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-hash216-rna
          /tmp/h36/test-hash216-rna

      - name: Compression GPU fabric conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_compression_gpu_fabric_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-compression-gpu
          /tmp/h36/test-compression-gpu

      - name: Branch knowledge fabric conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_harmonic36_branch_knowledge_fabric_1_0.c \
            /tmp/h36/exact-abi.o \
            -o /tmp/h36/test-branch-knowledge
          /tmp/h36/test-branch-knowledge

      - name: Canonical Pass128 graph bridge self-test
        run: |
          PYTHONPATH=. python - <<'PY'
          from hhs_runtime.hhs_pass219_harmonic36_knowledge_graph_bridge_v1 import (
              pass219_harmonic36_knowledge_graph_self_test,
          )
          result = pass219_harmonic36_knowledge_graph_self_test()
          assert result["status"] == "PASS"
          assert result["execution_authority"] is False
          assert result["mutation_authority"] is False
          PY

      - name: No canonical floating implementation
        run: |
          if grep -nE '\b(float|double)\b'             hhs_runtime/include/hhs_pass219_harmonic36_nested_vm_1_0.h             hhs_runtime/include/hhs_pass219_harmonic36_nested_vm_1_0.hpp             hhs_runtime/c/hhs_pass219_harmonic36_nested_vm_*.inc; then
            echo "Canonical floating type detected in Harmonic36 kernel"
            exit 1
          fi

      - name: Prove mandatory integration contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              'contracts/pass219/PASS_219_MANDATORY_HARMONIC36_DEFAULT_STATE_INTEGRATION_1_0.json'
          ).read_text())
          required = contract['mandatory_default_state_binding']
          assert required and all(required.values())

          authority = contract['authority']
          assert authority['singleton_vm81_authority_preserved'] is True
          assert authority['independent_vm81_authority'] is False
          assert authority['independent_hash72_authority'] is False
          assert authority['independent_hash216_authority'] is False
          assert authority['floating_point_canonical_authority'] is False

          h = Path('hhs_runtime/include/hhs_runtime_exact_abi.h').read_text()
          c = Path('hhs_runtime/c/hhs_runtime_exact_abi.c').read_text()
          assert 'hhs_pass219_harmonic36_default_binding_1_0.h' in h
          assert 'hhs_pass219_harmonic36_factorization_fabric_1_0.h' in h
          assert 'hhs_pass219_harmonic36_hash216_rna_binding_1_0.h' in h
          assert 'hhs_pass219_harmonic36_compression_gpu_fabric_1_0.h' in h
          assert 'hhs_pass219_harmonic36_branch_knowledge_fabric_1_0.h' in h
          assert 'hhs_pass219_harmonic36_nested_vm_1_0.inc' in c
          assert 'hhs_pass219_harmonic36_default_binding_1_0.inc' in c
          assert 'hhs_pass219_harmonic36_factorization_fabric_1_0.inc' in c
          assert 'hhs_pass219_harmonic36_hash216_rna_binding_1_0.inc' in c
          assert 'hhs_pass219_harmonic36_compression_gpu_fabric_1_0.inc' in c
          assert 'hhs_pass219_harmonic36_branch_knowledge_fabric_1_0.inc' in c
          PY
