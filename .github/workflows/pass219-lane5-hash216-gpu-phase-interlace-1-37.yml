name: Pass 219 Lane 5 Hash216 GPU Phase Interlace 1.37

on:
  push:
    branches:
      - agent/pass219-lane5-hash216-gpu-phase-interlace-1-37-20260913
    paths:
      - 'contracts/pass219/PASS_219_LANE5_HASH216_GPU_PHASE_INTERLACE_OPTIMIZER_1_37.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_python/runtime/hhs_pass219_lane5_phase_interlace_bridge.py'
      - 'hhs_backend/runtime/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.py'
      - 'tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.c'
      - 'tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py'
      - 'docs/operations/restart/PASS_219_LANE5_HASH216_GPU_PHASE_INTERLACE_1_37_RESTART_20260913.md'
      - '.github/workflows/pass219-lane5-hash216-gpu-phase-interlace-1-37.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/pass219/PASS_219_LANE5_HASH216_GPU_PHASE_INTERLACE_OPTIMIZER_1_37.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_python/runtime/hhs_pass219_lane5_phase_interlace_bridge.py'
      - 'hhs_backend/runtime/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.py'
      - 'tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.c'
      - 'tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py'
      - 'docs/operations/restart/PASS_219_LANE5_HASH216_GPU_PHASE_INTERLACE_1_37_RESTART_20260913.md'
      - '.github/workflows/pass219-lane5-hash216-gpu-phase-interlace-1-37.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-pytest

      - name: Static Lane 5 optimizer contract gate
        run: |
          python - <<'PY'
          from pathlib import Path
          contract = Path('contracts/pass219/PASS_219_LANE5_HASH216_GPU_PHASE_INTERLACE_OPTIMIZER_1_37.md').read_text()
          header = Path('hhs_runtime/include/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.h').read_text()
          py = Path('hhs_backend/runtime/hhs_pass219_lane5_hash216_gpu_phase_interlace_1_37.py').read_text()
          for needle in (
              'C = 4 * 5005 = 20020',
              'H216 = H72_0 || H72_1 || H72_2',
              'validated Hash216',
              'GPU may commit Hash72              = FALSE',
              'exact CPU/VM81 replay required     = TRUE',
              'nanosecond-class slot dispatch is not established',
          ):
              assert needle in contract, needle
          for needle in (
              'fixed_full_cycle_20020',
              'prime_matrix_fingerprint_routing',
              'validated_hash216_read_only',
              'hash216_three_hash72_vector_search',
              'pass207_gpu_vector_search_bound',
              'canonical_vm81_mutation_authority',
              'requires_signed_environmental_vm81_admission',
          ):
              assert needle in header, needle
          assert 'rank_hash72_vectors' in py
          assert 'state_root' in py
          assert 'gpu_may_commit_hash216' in py
          print('lane5_hash216_gpu_phase_interlace_static=PASS')
          PY

      - name: Build cumulative exact ABI
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Audit 1.37 exported symbols
        run: |
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_phase_interlace_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_phase_interlace_authority$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_phase_address$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_prime_route$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_mediate_candidate$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_vm81_environment_admit_signed$' /tmp/hhs.symbols

      - name: Run native Lane 5 20,020-cycle contract test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-lane5-phase-interlace
          /tmp/test-lane5-phase-interlace

      - name: Run Hash216 GPU/vector optimizer tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python -m pytest -q \
            tests/pass219/test_pass219_lane5_hash216_gpu_phase_interlace_1_37.py \
            tests/test_hhs_pass207_gpu_driver_v1.py

      - name: Regress inherited Lane 5 authority
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ \
            -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds" \
            -o /tmp/test-lane5-nucleus
          /tmp/test-lane5-nucleus
