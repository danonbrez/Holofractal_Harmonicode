name: Pass 219 Lane 5 Cloaked Tripartite Constraint 1.61

on:
  push:
    branches:
      - pass219/lane5-cloaked-tripartite-constraint-1-61
    paths:
      - 'hhs_runtime/include/hhs_pass219_lane5_cloaked_tripartite_constraint_1_61.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_cloaked_tripartite_constraint_1_61.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_lane5_cloaked_tripartite_constraint_1_61.c'
      - 'tests/pass219/test_pass219_lane5_cloaked_tripartite_stress_1_61.c'
      - 'contracts/pass219/PASS_219_LANE5_CLOAKED_TRIPARTITE_CONSTRAINT_1_61.md'
      - '.github/workflows/pass219-lane5-cloaked-tripartite-constraint-1-61.yml'
  pull_request:
    branches:
      - pass219/lane5-thread-lineage-normalization-1-60
    paths:
      - 'hhs_runtime/include/hhs_pass219_lane5_cloaked_tripartite_constraint_1_61.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_cloaked_tripartite_constraint_1_61.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_lane5_cloaked_tripartite_constraint_1_61.c'
      - 'tests/pass219/test_pass219_lane5_cloaked_tripartite_stress_1_61.c'
      - 'contracts/pass219/PASS_219_LANE5_CLOAKED_TRIPARTITE_CONSTRAINT_1_61.md'
      - '.github/workflows/pass219-lane5-cloaked-tripartite-constraint-1-61.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  lane5-extensive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped tools
        run: python -m pip install --disable-pip-version-check pytest 'cryptography>=45.0,<47.0' fastapi httpx

      - name: Build cumulative exact runtime
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Audit 1.61 exports and hidden authority
        run: |
          set -euo pipefail
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_tripartite_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_tripartite_authority$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_tripartite_verify$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_gateway_admit_raw5184$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_vm81_environment_admit_signed$' /tmp/hhs.symbols
          for forbidden in hhs_exact_vm81_admit_uqcel hhs_exact_pass219_admit_composed hhs_exact_pass219_rna_admit_composed hhs_exact_pass219_vm81_pqc_admit hhs_exact_pass219_vm81_pqc_admit_signed; do
            ! grep -q " ${forbidden}$" /tmp/hhs.symbols
          done

      - name: Static no-float no-parallel-authority audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths = [
              Path('hhs_runtime/include/hhs_pass219_lane5_cloaked_tripartite_constraint_1_61.h'),
              Path('hhs_runtime/c/hhs_pass219_lane5_cloaked_tripartite_constraint_1_61.inc'),
          ]
          text = '\n'.join(p.read_text() for p in paths)
          assert re.search(r'\b(float|double)\b', text) is None
          assert 'hhs_bigint_t' not in text
          assert 'hhs_bigint_div_exact' not in text
          assert 'hhs_hash216_generate_commit' not in text
          assert 'HHSExactBigUIntView' in text
          assert 'hhs_hash216_compute_bytes' in text
          assert 'denominator_cancellation_allowed = 0U' in text
          assert 'division_by_zero_allowed = 0U' in text
          print('tripartite_static_authority_audit=PASS')
          PY

      - name: Compile and run 1.61 native conformance
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_cloaked_tripartite_constraint_1_61.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -o /tmp/t161
          /tmp/t161

      - name: Run 3,583-case exact-domain stress sweep
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_cloaked_tripartite_stress_1_61.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -o /tmp/t161-stress
          /tmp/t161-stress

      - name: Regress native T5184 and raw VM5184
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_t5184_phase_support_1_49.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -o /tmp/t149
          /tmp/t149
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_raw_x86_vm5184_kernel_1_57.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -o /tmp/t157
          /tmp/t157

      - name: Regress exact boundary and zero-bypass gateway
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_exact_boundary_quantum_thermo_1_35.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -o /tmp/t135
          /tmp/t135
          gcc -O2 -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_lane5_zero_bypass_secure_gateway_1_59.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -o /tmp/t159
          /tmp/t159

      - name: Regress native RNA hidden-authority ABI
        run: |
          mkdir -p /tmp/pass219-rna
          bash .github/scripts/build_pass219_exact_internal_archive.sh \
            /tmp/pass219-rna/libhhs_exact_internal.a /tmp/pass219-rna/objects
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_rna_transcription_1_10.c \
            /tmp/pass219-rna/libhhs_exact_internal.a -lcrypto -lstdc++ -lm -pthread \
            -o /tmp/trna-c
          /tmp/trna-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_rna_transcription_1_10.cpp \
            /tmp/pass219-rna/libhhs_exact_internal.a -lcrypto -lstdc++ -lm -pthread \
            -o /tmp/trna-cpp
          /tmp/trna-cpp

      - name: Regress VM81 PQC firewall reference boundary
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_vm81_pqc_firewall_1_30.cpp \
            -Lhhs_runtime/builds -lhhs_runtime \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -o /tmp/tpqc
          /tmp/tpqc

      - name: Run Lane 5 Python regression membrane
        env:
          PYTHONPATH: .
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python -m pytest -q \
            tests/pass219/test_harmonicode_lane5_bigint_transcription_v1.py \
            tests/pass219/test_harmonicode_lane5_reciprocal_phase_boundary_v1.py \
            tests/pass219/test_harmonicode_lane5_ieee754_palindromic_pivot_v1.py \
            tests/pass219/test_harmonicode_lane5_t64_exhaustive_resolution_v1.py \
            tests/pass219/test_harmonicode_lane5_rna_self_ingestion_bytecode_v1.py \
            tests/pass219/test_pass219_lane5_thread_lineage_normalization_1_60.py \
            tests/pass219/test_lane5_linux_api_interposer_1_59.py \
            tests/pass219/test_lane5_zero_bypass_middleware_1_59.py \
            tests/test_hhs_pass219_fibonacci_compression_compliance.py

      - name: Seal extensive validation summary
        run: |
          mkdir -p artifacts/pass219/1.61
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          summary = {
              'schema': 'HHS_PASS219_LANE5_CLOAKED_TRIPARTITE_EVIDENCE_1_61',
              'result': 'PASS',
              'theorem': 'HHS-T5184-005',
              'native_stress_cases': 3583,
              'fixed_width_characters': 5184,
              'max_bigint_input_bytes': 648,
              'exact_cross_product_equalities': 3,
              'denominator_cancellation_allowed': False,
              'division_by_zero_allowed': False,
              'rna_cell_wall_required': True,
              'pqc_witness_required': True,
              'exact_cpu_vm81_replay_required': True,
              'canonical_vm81_mutation_authority': False,
              'canonical_hash72_authority': False,
              'canonical_hash216_commit_authority': False,
              'canonical_persistence_authority': False,
              'floating_point_canonical_authority': False,
          }
          canonical = json.dumps(summary, sort_keys=True, separators=(',', ':')).encode()
          summary['receipt_sha256'] = sha256(canonical).hexdigest()
          Path('artifacts/pass219/1.61/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pass219-lane5-cloaked-tripartite-constraint-1-61
          path: artifacts/pass219/1.61/
          if-no-files-found: error

  openssl-35-positive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build OpenSSL 3.5.0
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl curl ca-certificates
          curl -fsSL --retry 3 --retry-delay 2 https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz -o /tmp/openssl-3.5.0.tar.gz
          tar -C /tmp -xzf /tmp/openssl-3.5.0.tar.gz
          cd /tmp/openssl-3.5.0
          ./Configure --prefix=/tmp/openssl35 --libdir=lib shared no-tests
          make -j2
          make install_sw
          LD_LIBRARY_PATH=/tmp/openssl35/lib /tmp/openssl35/bin/openssl list -signature-algorithms | grep -i 'ML-DSA'

      - name: Build exact ABI against OpenSSL 3.5
        env:
          CFLAGS: -O2 -std=c11 -Wall -Wextra -Ihhs_runtime/include -Ihhs_runtime/c -I/tmp/openssl35/include
          CXXFLAGS: -O2 -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -Ihhs_runtime/c -Inative_projects/hhs_pass188_bott_runtime/include -Inative_projects/hhs_pass189_hqlh_runtime/include -I/tmp/openssl35/include
          LDFLAGS: -L/tmp/openssl35/lib -Wl,-rpath,/tmp/openssl35/lib -lm -lcrypto
          LD_LIBRARY_PATH: /tmp/openssl35/lib
        run: |
          make clean
          make c-abi

      - name: Re-run 1.61 exact closure against PQC-capable runtime
        env:
          LD_LIBRARY_PATH: /tmp/openssl35/lib
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -I/tmp/openssl35/include \
            tests/pass219/test_pass219_lane5_cloaked_tripartite_constraint_1_61.c \
            -Lhhs_runtime/builds -lhhs_runtime -L/tmp/openssl35/lib -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -Wl,-rpath,/tmp/openssl35/lib -o /tmp/t161-pqc
          /tmp/t161-pqc

      - name: Prove secure zero-bypass ML-DSA admission remains downstream
        env:
          LD_LIBRARY_PATH: /tmp/openssl35/lib
          HHS_REQUIRE_PQC_PROVIDER: '1'
        run: |
          gcc -O2 -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include -I/tmp/openssl35/include \
            tests/pass219/test_pass219_lane5_zero_bypass_secure_gateway_1_59.c \
            -Lhhs_runtime/builds -lhhs_runtime -L/tmp/openssl35/lib -lcrypto -lstdc++ -lm \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -Wl,-rpath,/tmp/openssl35/lib -o /tmp/t159-pqc
          /tmp/t159-pqc

      - name: Prove environmental PQC signature boundary
        env:
          LD_LIBRARY_PATH: /tmp/openssl35/lib
        run: |
          c++ -O2 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include -I/tmp/openssl35/include \
            tests/pass219/test_pass219_vm81_pqc_signature_1_31.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -L/tmp/openssl35/lib -lcrypto \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" -Wl,-rpath,/tmp/openssl35/lib \
            -o /tmp/tpqc-signature
          /tmp/tpqc-signature ml
          /tmp/tpqc-signature slh
          /tmp/tpqc-signature constraint
