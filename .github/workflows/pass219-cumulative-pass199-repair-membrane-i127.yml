name: Pass 219 Cumulative Pass 199 Repair Membrane I127

on:
  push:
    branches:
      - agent/pass219-iteration127-pass199-repair-membrane
  pull_request:
    branches: [main]
    paths:
      - 'hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v3.py'
      - 'hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime.py'
      - 'tests/test_hhs_pass199_i127_repair_v1.py'
      - 'tests/test_hhs_pass199_production_projection_v1.py'
      - '.github/workflows/pass199-distributed-calibration-fabric.yml'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass199_1_27.h'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass199_1_27.hpp'
      - 'hhs_runtime/c/hhs_pass219_inherited_pass199_1_27.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/hhs_pass219_cumulative_pass_membrane_i127_pass199.py'
      - 'tests/pass219/test_pass219_inherited_pass199_1_27.c'
      - 'tests/pass219/test_pass219_inherited_pass199_1_27.cpp'
      - 'tests/pass219/test_pass219_cumulative_pass199_membrane_i127.py'
      - 'docs/pass199/PASS_219_I127_INHERITED_EXPOSURE.md'
      - 'docs/operations/restart/PASS_219_I127_PASS199_REPAIR_MEMBRANE_RESTART.md'
      - '.github/workflows/pass219-cumulative-pass199-repair-membrane-i127.yml'

permissions:
  contents: read

jobs:
  inherited-pass199-repair-membrane:
    name: inherited-pass199-repair-membrane (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [exact, synthetic]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && (matrix.target == 'exact' && github.event.pull_request.head.sha || format('refs/pull/{0}/merge', github.event.pull_request.number)) || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install inherited runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Synthesize current main for push validation
        if: github.event_name == 'push' && matrix.target == 'synthetic'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git config user.name hhs-validation
            git config user.email hhs-validation@users.noreply.github.com
            git merge --no-edit origin/main
          fi

      - name: Prove frozen I126 and accepted Pass 199 squash lineage
        run: |
          git merge-base --is-ancestor fca09c16d2e9008de5cd9a09347e14de695e4ef3 HEAD
          git merge-base --is-ancestor 426fe7786abff2e1e4688222a600f5ab39d14a5a HEAD
          git merge-base --is-ancestor c2626fd4886b9e98e511c739b806dfc46863878d HEAD
          test "$(git merge-base 98cda07e391bb19559670be0ed6a4ce073346cd8 HEAD)" = "df50f29fda77d6093d3af40dd1e3896523c4aab5"

      - name: Prove historical Pass 199 identities and immutable V1 V2 provenance
        run: |
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:HHS_PASS_199_DISTRIBUTED_CALIBRATION_FABRIC.md)" = "5ecfcdf3a97df85a896f3948d53b3f47fc349abf"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:hhs_backend/runtime/hhs_pass199_distributed_calibration_fabric_v1.py)" = "d89f3e0e53b3ad21394ddfe95fede3cbc5c3ef2b"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v1.py)" = "81e6d87a04a7a23d5b1531a27208c18610dd6647"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v2.py)" = "fba8a00f5402ab7517edc21cb731ccbe488a226c"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime.py)" = "c2e90f47b6f0a8996e5f5d26ba563f1a53ed17aa"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:.github/workflows/pass199-distributed-calibration-fabric.yml)" = "4d290a9d22b5e1afebd065a51c7c493028b7e5c5"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:hhs_backend/api/pass199_distributed_calibration_routes.py)" = "196832b63877402bd8630a847bba5e214814055f"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:tests/test_hhs_pass199_distributed_calibration_fabric_v1.py)" = "9b124554ab084119e034ecbc21c2b273b9a1ae4a"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:tests/test_hhs_pass199_production_projection_v1.py)" = "8038c45cc555df2aaa62aa817ef5755c0b977617"
          test "$(git rev-parse 426fe7786abff2e1e4688222a600f5ab39d14a5a:docs/pass199/RESTART_RECORD.md)" = "63ef3add2fc334cee11ac012205941bf9897d76e"
          test "$(git hash-object HHS_PASS_199_DISTRIBUTED_CALIBRATION_FABRIC.md)" = "5ecfcdf3a97df85a896f3948d53b3f47fc349abf"
          test "$(git hash-object hhs_backend/runtime/hhs_pass199_distributed_calibration_fabric_v1.py)" = "d89f3e0e53b3ad21394ddfe95fede3cbc5c3ef2b"
          test "$(git hash-object hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v1.py)" = "81e6d87a04a7a23d5b1531a27208c18610dd6647"
          test "$(git hash-object hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v2.py)" = "fba8a00f5402ab7517edc21cb731ccbe488a226c"

      - name: Prove validated repaired Pass 199 production identities
        run: |
          test "$(git rev-parse c2626fd4886b9e98e511c739b806dfc46863878d:hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v3.py)" = "9e0d159f7a3ed5e4a706cb147c50a82949dcd6be"
          test "$(git rev-parse c2626fd4886b9e98e511c739b806dfc46863878d:hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime.py)" = "50f9b9a4530a180e4a29942334f6faf4d8099776"
          test "$(git rev-parse c2626fd4886b9e98e511c739b806dfc46863878d:.github/workflows/pass199-distributed-calibration-fabric.yml)" = "2e0a1b9319893a0a2faeb95f34f9886b6e08590c"
          test "$(git rev-parse c2626fd4886b9e98e511c739b806dfc46863878d:tests/test_hhs_pass199_i127_repair_v1.py)" = "07b4c72039421765746d302a8153c939b2b57862"
          test "$(git rev-parse c2626fd4886b9e98e511c739b806dfc46863878d:tests/test_hhs_pass199_production_projection_v1.py)" = "8e5cb84788f00a573f025b14d5fe1ba1d72a5024"
          test "$(git hash-object hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v3.py)" = "9e0d159f7a3ed5e4a706cb147c50a82949dcd6be"
          test "$(git hash-object hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime.py)" = "50f9b9a4530a180e4a29942334f6faf4d8099776"
          test "$(git hash-object tests/test_hhs_pass199_i127_repair_v1.py)" = "07b4c72039421765746d302a8153c939b2b57862"
          test "$(git hash-object tests/test_hhs_pass199_production_projection_v1.py)" = "8e5cb84788f00a573f025b14d5fe1ba1d72a5024"

      - name: Compile repaired Python and membrane surfaces
        run: |
          python -m py_compile \
            hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v3.py \
            hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime.py \
            hhs_runtime/hhs_pass219_cumulative_pass_membrane_i127_pass199.py \
            tests/test_hhs_pass199_i127_repair_v1.py \
            tests/test_hhs_pass199_production_projection_v1.py \
            tests/pass219/test_pass219_cumulative_pass199_membrane_i127.py

      - name: Reject approximate arithmetic and accidental authority exports
        run: |
          ! grep -Eq '\b(float|double)\b|<math\.h>|\b(sqrt|sin|cos|pow|log|exp)\s*\(' \
            hhs_runtime/include/hhs_pass219_inherited_pass199_1_27.h \
            hhs_runtime/include/hhs_pass219_inherited_pass199_1_27.hpp \
            hhs_runtime/c/hhs_pass219_inherited_pass199_1_27.inc
          ! grep -Eq 'candidate_may_commit[[:space:]]*=[[:space:]]*1|pass219_new_candidate_authority[[:space:]]*=[[:space:]]*1|vm81_mutation_authority[[:space:]]*=[[:space:]]*1' \
            hhs_runtime/include/hhs_pass219_inherited_pass199_1_27.h \
            hhs_runtime/c/hhs_pass219_inherited_pass199_1_27.inc
          if grep -RInE '(^|[^[:alnum:]_])(float\(|Decimal\(|numpy|np\.)' \
            hhs_backend/runtime/hhs_pass199_distributed_calibration_runtime_v3.py; then
            echo 'Approximate canonical arithmetic detected in Pass 199 repair.' >&2
            exit 1
          fi

      - name: Compile cumulative exact ABI and Pass 199 repair conformance
        run: |
          mkdir -p /tmp/pass219-i127-pass199
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            -c hhs_runtime/c/hhs_runtime_exact_abi.c \
            -o /tmp/pass219-i127-pass199/exact.o
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_inherited_pass199_1_27.c \
            /tmp/pass219-i127-pass199/exact.o \
            -o /tmp/pass219-i127-pass199/pass199-c
          /tmp/pass219-i127-pass199/pass199-c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include \
            tests/pass219/test_pass219_inherited_pass199_1_27.cpp \
            /tmp/pass219-i127-pass199/exact.o \
            -o /tmp/pass219-i127-pass199/pass199-cpp
          /tmp/pass219-i127-pass199/pass199-cpp

      - name: Run kernel-derived repaired Pass 199 membrane preflight
        run: PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass199_membrane_i127.py

      - name: Re-run six-finding Pass 199 repair regression
        run: PYTHONPATH="$PWD" python -m unittest -v tests.test_hhs_pass199_i127_repair_v1 tests.test_hhs_pass199_production_projection_v1

      - name: Preserve frozen Pass 200A successor membrane and repair regression
        run: |
          PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass200a_membrane_i126.py
          PYTHONPATH="$PWD" python -m unittest -v tests.test_hhs_pass200a_proof_carrying_optimization_v1
