name: Pass 219 P^x2 Global Reciprocal Manifold 1.64

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/pass219/PASS_219_P_X2_GLOBAL_RECIPROCAL_MANIFOLD_1_64.hhs'
      - 'contracts/pass219/PASS_219_P_X2_RECIPROCAL_CORRECTION_1_64.raw.hhs'
      - 'contracts/pass219/PASS_219_P_X2_GLOBAL_RECIPROCAL_MANIFOLD_1_64.md'
      - 'hhs_runtime/include/hhs_pass219_p_x2_global_reciprocal_manifold_1_64.h'
      - 'hhs_runtime/c/hhs_pass219_p_x2_global_reciprocal_manifold_1_64.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc'
      - 'hhs_runtime/c/hhs_pass219_vm81_environmental_recovery_1_32.inc'
      - 'evidence/pass219/px2_reciprocal_correction_wolfram_20260926_v1.output.json'
      - 'tests/pass219/test_pass219_p_x2_global_reciprocal_manifold_1_64.c'
      - 'tests/pass219/test_pass219_p_x2_global_reciprocal_manifold_1_64.py'
      - '.github/workflows/pass219-px2-global-reciprocal-manifold-1-64.yml'
  push:
    branches:
      - main
      - pass219/hnan-4x4-recursive-gate-20260926
    paths:
      - 'contracts/pass219/PASS_219_P_X2_GLOBAL_RECIPROCAL_MANIFOLD_1_64.hhs'
      - 'contracts/pass219/PASS_219_P_X2_RECIPROCAL_CORRECTION_1_64.raw.hhs'
      - 'contracts/pass219/PASS_219_P_X2_GLOBAL_RECIPROCAL_MANIFOLD_1_64.md'
      - 'hhs_runtime/include/hhs_pass219_p_x2_global_reciprocal_manifold_1_64.h'
      - 'hhs_runtime/c/hhs_pass219_p_x2_global_reciprocal_manifold_1_64.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc'
      - 'hhs_runtime/c/hhs_pass219_vm81_environmental_recovery_1_32.inc'
      - 'evidence/pass219/px2_reciprocal_correction_wolfram_20260926_v1.output.json'
      - 'tests/pass219/test_pass219_p_x2_global_reciprocal_manifold_1_64.c'
      - 'tests/pass219/test_pass219_p_x2_global_reciprocal_manifold_1_64.py'
      - '.github/workflows/pass219-px2-global-reciprocal-manifold-1-64.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  px2-global-reciprocal-manifold:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency-scoped test dependency
        run: python -m pip install pytest

      - name: Validate reciprocal correction proof receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          raw = "((p/q)*(q/p))/(P²-pq)=(q-p))P/(p+q)"
          parsed = "((p/q)*(q/p))/(P²-pq)=((q-p)*P)/(p+q)"
          proof = json.loads(
              Path(
                  "evidence/pass219/"
                  "px2_reciprocal_correction_wolfram_20260926_v1.output.json"
              ).read_text(encoding="utf-8")
          )
          assert proof["status"] == "PASS"
          assert proof["raw_source"] == raw
          assert proof["balanced_ordered_parse"] == parsed
          assert hashlib.sha256(raw.encode()).hexdigest() == proof["raw_source_sha256"]
          assert hashlib.sha256(parsed.encode()).hexdigest() == proof["balanced_parse_sha256"]
          assert proof["projected_lhs"] == "1"
          assert proof["projected_rhs"] == "1"
          assert proof["difference"] == "0"
          assert proof["native_rewrite_authority"] is False
          PY

      - name: Run source and binding regressions
        run: |
          PYTHONPATH="$PWD" python -m pytest -q             tests/pass219/test_pass219_p_x2_global_reciprocal_manifold_1_64.py             tests/pass219/test_pass219_lane5_hnan_global_constraint_1_63.py             tests/pass219/test_pass219_hnan_4x4_recursive_gate_v1.py

      - name: Build shared exact VM81 Runtime
        run: make -f GNUmakefile c-kernel

      - name: Verify callable 1.64 exports
        run: |
          test -s hhs_runtime/builds/libhhs_runtime.so
          nm -D hhs_runtime/builds/libhhs_runtime.so             | grep -F 'hhs_exact_pass219_px2_manifold_verify'
          nm -D hhs_runtime/builds/libhhs_runtime.so             | grep -F 'hhs_exact_pass219_px2_correction_raw_source'
          nm -D hhs_runtime/builds/libhhs_runtime.so             | grep -F 'hhs_exact_pass219_px2_correction_parse_source'

      - name: Compile native 1.64 conformance
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror             -Ihhs_runtime/include             tests/pass219/test_pass219_p_x2_global_reciprocal_manifold_1_64.c             -Lhhs_runtime/builds -lhhs_runtime -lcrypto             -o /tmp/test_pass219_px2_1_64

      - name: Run native 1.64 conformance
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: /tmp/test_pass219_px2_1_64

      - name: Verify both mandatory preflight boundaries
        run: |
          grep -F 'hhs_exact_pass219_px2_manifold_verify'             hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc
          grep -F 'hhs_exact_pass219_px2_manifold_verify'             hhs_runtime/c/hhs_pass219_vm81_environmental_recovery_1_32.inc
          grep -F 'correction_raw_hash_verified'             hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc
          grep -F 'correction_raw_hash_verified'             hhs_runtime/c/hhs_pass219_vm81_environmental_recovery_1_32.inc
