name: Pass 220 NumPy1 Four-Phase A/B

on:
  pull_request:
    branches: [main]
    paths:
      - "hhs_runtime/hhs_pass220_numpy_four_phase_ab_v1.py"
      - "hhs_runtime/hhs_pass220_priority_offset_information_translation_v1.py"
      - "tests/pass220/test_hhs_pass220_numpy_four_phase_ab_v1.py"
      - "tests/pass220/test_hhs_pass220_priority_offset_information_translation_v1.py"
      - "benchmarks/pass220/pass220_numpy_four_phase_ab_v1.py"
      - "benchmarks/pass220/pass220_priority_offset_information_translation_v1.py"
      - "evidence/pass220/hnan_zero_center_information_wolfram_20260928_v1.wl"
      - "evidence/pass220/hnan_zero_center_information_wolfram_20260928_v1.output.json"
      - "docs/whitepapers/HHS_HNAN_ZERO_CENTER_INFORMATION_PRESERVATION_THEOREM_V1.md"
      - "docs/whitepapers/HHS_HNAN_JORDAN_GLOBAL_CONSTRAINT_RESOLUTION_THEOREM_V1.md"
      - "docs/whitepapers/HHS_LANE5_WHITEPAPER_INDEX_V1.md"
      - "evidence/pass220/phase_engine_firing_hnan_composition_20260928_v1.json"
      - ".github/workflows/pass220-numpy1-four-phase-ab.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: |
          pytest -q \
            tests/pass220/test_hhs_pass220_numpy_four_phase_ab_v1.py \
            tests/pass220/test_hhs_pass220_priority_offset_information_translation_v1.py
      - run: |
          python -m benchmarks.pass220.pass220_numpy_four_phase_ab_v1 \
            --output artifacts/pass220/numpy1_four_phase_ab.json \
            --repeats 15
      - run: |
          python -m benchmarks.pass220.pass220_priority_offset_information_translation_v1 \
            --output artifacts/pass220/priority_offset_information_translation.json \
            --repeats 3
      - uses: actions/upload-artifact@v4
        with:
          name: pass220-numpy1-four-phase-ab
          path: |
            artifacts/pass220/numpy1_four_phase_ab.json
            artifacts/pass220/priority_offset_information_translation.json
