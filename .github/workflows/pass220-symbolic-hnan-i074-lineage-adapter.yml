name: Pass 220 Symbolic HNAN I074 Lineage Adapter
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_symbolic_hnan_i074_lineage_adapter_v1.py"
      - "tests/pass220/test_pass220_symbolic_hnan_i074_lineage_adapter_v1.py"
      - ".github/workflows/pass220-symbolic-hnan-i074-lineage-adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbolic-hnan-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Validate ordered symbolic HNAN lineage handoff
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_symbolic_hnan_i074_lineage_adapter_v1.py
