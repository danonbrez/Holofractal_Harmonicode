name: Pass 219 Lane 5 Mediation Proof Binding 1.49

on:
  push:
    branches:
      - repair/pass219-lane5-mediation-proof-binding-1-49-20260925
    paths:
      - 'contracts/pass219/PASS_219_LANE5_MEDIATION_PROOF_BINDING_1_49.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_mediation_proof_binding_1_49.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_mediation_proof_binding_1_49.inc'
      - 'hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_lane5_mediation_proof_binding_1_49.c'
      - 'tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c'
      - '.github/workflows/pass219-lane5-mediation-proof-binding-1-49.yml'
      - 'docs/operations/restart/PASS_219_LANE5_MEDIATION_PROOF_BINDING_1_49_RESTART_20260925.md'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/pass219/PASS_219_LANE5_MEDIATION_PROOF_BINDING_1_49.md'
      - 'hhs_runtime/include/hhs_pass219_lane5_mediation_proof_binding_1_49.h'
      - 'hhs_runtime/c/hhs_pass219_lane5_mediation_proof_binding_1_49.inc'
      - 'hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_lane5_mediation_proof_binding_1_49.c'
      - 'tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c'
      - '.github/workflows/pass219-lane5-mediation-proof-binding-1-49.yml'
      - 'docs/operations/restart/PASS_219_LANE5_MEDIATION_PROOF_BINDING_1_49_RESTART_20260925.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-pytest python3-cryptography

      - name: Static proof-binding contract gate
        run: |
          python - <<'PY'
          from pathlib import Path

          contract = Path('contracts/pass219/PASS_219_LANE5_MEDIATION_PROOF_BINDING_1_49.md').read_text()
          header = Path('hhs_runtime/include/hhs_pass219_lane5_mediation_proof_binding_1_49.h').read_text()
          impl = Path('hhs_runtime/c/hhs_pass219_lane5_mediation_proof_binding_1_49.inc').read_text()
          legacy = Path('hhs_runtime/c/hhs_pass219_lane5_global_holographic_nucleus_1_34.inc').read_text()

          for needle in (
              'Exact VM5184',
              'RNA / C++ cell wall',
              'Hash216',
              'Capability registry',
              'Direct witness route',
              'Global constraint membrane',
              'Derived global zero-sum closure',
              'valid all-true global membrane cannot be substituted',
              'zero-sum witness is **not accepted from the caller**',
              'hhs_exact_pass219_vm81_environment_admit_signed',
          ):
              assert needle in contract, needle

          for needle in (
              'legacy_1_34_proof_flags_authoritative',
              'hash216_sha256_positions_verified',
              'direct_witness_route_recomputed',
              'global_constraint_membrane_recomputed',
              'global_environment_request_bound',
              'exact_zero_sum_residual_vector_derived',
              'HHSExactPass219Lane5ZeroSumClosureWitnessV1 zero_sum_witness',
              'hhs_exact_pass219_lane5_mediation_proof_bind',
          ):
              assert needle in header, needle

          for needle in (
              'hhs_exact_pass219_lane5_direct_witness_route_validate',
              'hhs_exact_pass219_global_membrane_evaluate',
              'hhs_exact_pass219_lane5_mediation_environment_root',
              'hhs_l5pb_zero_sum_all_zero',
              'out_receipt->zero_sum_witness = zero_witness;',
          ):
              assert needle in impl, needle

          for needle in (
              'receipt.hash216_references_validated = 0U;',
              'receipt.capability_registry_validated = 0U;',
              'receipt.exact_vm5184_bound = 0U;',
              'receipt.rna_cell_wall_bound = 0U;',
              'receipt.zero_sum_closure_passed = 0U;',
          ):
              assert needle in legacy, needle

          print('lane5_mediation_proof_binding_static=PASS')
          PY

      - name: Build cumulative exact ABI
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Audit proof-binding exports and singleton canonical mutator
        run: |
          nm -D --defined-only hhs_runtime/builds/libhhs_runtime.so > /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_mediation_proof_binding_version$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_mediation_proof_binding_authority$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_mediation_frame_signature$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_lane5_mediation_hash216_reference_signature
          grep -q ' hhs_exact_pass219_lane5_direct_witness_route_validate$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_global_membrane_evaluate$' /tmp/hhs.symbols
          grep -q ' hhs_exact_pass219_vm81_environment_admit_signed$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_pass219_vm81_pqc_admit$' /tmp/hhs.symbols
          ! grep -q ' hhs_exact_pass219_vm81_pqc_admit_signed$' /tmp/hhs.symbols

      - name: Run native proof-binding positive and negative tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_lane5_mediation_proof_binding_1_49.c             -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -pthread -lm             -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds"             -o /tmp/test-lane5-proof-binding
          /tmp/test-lane5-proof-binding | tee /tmp/lane5-proof-binding.log
          grep -q 'PASS219_LANE5_MEDIATION_PROOF_BINDING_1_49_PASS' /tmp/lane5-proof-binding.log

      - name: Regress legacy Lane 5 identity-binding stage
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic             -Ihhs_runtime/include             tests/pass219/test_pass219_lane5_global_holographic_nucleus_1_34.c             -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -pthread -lm             -Wl,-rpath,"${GITHUB_WORKSPACE}/hhs_runtime/builds"             -o /tmp/test-lane5-nucleus
          /tmp/test-lane5-nucleus

