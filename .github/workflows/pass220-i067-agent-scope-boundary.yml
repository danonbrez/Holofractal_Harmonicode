name: Pass 220 I067 Agent Scope Boundary

on:
  push:
    branches:
      - pass220/i067-agent-scope-boundary-20261002
    paths:
      - "hhs_runtime/hhs_pass220_i067_agent_scope_boundary_v1.py"
      - "tests/pass220/test_hhs_pass220_i067_agent_scope_boundary_v1.py"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS/Pass220/AgentScopeBoundary.lean"
      - "formal/wolfram/pass220_i067_agent_scope_boundary_v1.wl"
      - "evidence/pass220/i067_agent_scope_boundary_wolfram_20261002_v1.output.json"
      - "contracts/pass220/PASS_220_I067_AGENT_SCOPE_BOUNDARY_V1.json"
      - "docs/pass220/PASS_220_I067_AGENT_SCOPE_BOUNDARY.md"
      - "docs/operations/restart/PASS_220_I067_AGENT_SCOPE_BOUNDARY_RESTART_20261002.md"
      - ".github/workflows/pass220-i067-agent-scope-boundary.yml"
      - "lakefile.lean"
      - "lean-toolchain"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_i067_agent_scope_boundary_v1.py"
      - "tests/pass220/test_hhs_pass220_i067_agent_scope_boundary_v1.py"
      - "formal/lean/HHS.lean"
      - "formal/lean/HHS/Pass220/AgentScopeBoundary.lean"
      - "formal/wolfram/pass220_i067_agent_scope_boundary_v1.wl"
      - "evidence/pass220/i067_agent_scope_boundary_wolfram_20261002_v1.output.json"
      - "contracts/pass220/PASS_220_I067_AGENT_SCOPE_BOUNDARY_V1.json"
      - "docs/pass220/PASS_220_I067_AGENT_SCOPE_BOUNDARY.md"
      - "docs/operations/restart/PASS_220_I067_AGENT_SCOPE_BOUNDARY_RESTART_20261002.md"
      - ".github/workflows/pass220-i067-agent-scope-boundary.yml"
      - "lakefile.lean"
      - "lean-toolchain"
  workflow_dispatch:

jobs:
  agent-scope-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run I067 dependency-scoped runtime validation
        run: |
          python -m pytest -q tests/pass220/test_hhs_pass220_i067_agent_scope_boundary_v1.py
          python -m hhs_runtime.hhs_pass220_i067_agent_scope_boundary_v1
      - name: Verify connected Wolfram evidence receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("evidence/pass220/i067_agent_scope_boundary_wolfram_20261002_v1.output.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "PASS"
          assert data["check_count"] == data["pass_count"] == 10
          assert data["failed"] == []
          PY
      - name: Lean 4 build and kernel audit
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: false
          build: true
          test: false
          leanchecker: true
          leanchecker-args: HHS
          axiom-audit: true
          axiom-audit-root: HHS
