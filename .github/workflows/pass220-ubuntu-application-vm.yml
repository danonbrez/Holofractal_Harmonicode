name: Pass 220 Ubuntu Application VM Control Plane

on:
  pull_request:
    paths:
      - "hhs_runtime/pass220/**"
      - "hhs_backend/application_vm_api_server.py"
      - "hhs_runtime/pass190/shell.py"
      - "bin/hhs-vm"
      - "deployment/ubuntu/application_vm/**"
      - "docs/pass220/PASS_220_UBUNTU_APPLICATION_VM_BACKEND_CONTROL_PLANE_V1.md"
      - "tests/pass220/test_pass220_ubuntu_application_vm_control_plane.py"
      - ".github/workflows/pass220-ubuntu-application-vm.yml"
      - ".github/workflows/pass220-ubuntu-application-vm-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-application-vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency-scoped Python requirements
        run: python -m pip install fastapi uvicorn httpx pytest pyyaml
      - name: Compile backend surfaces
        run: |
          python -m py_compile             hhs_runtime/pass220/application_vm_control_plane.py             hhs_runtime/pass220/application_vm_cli.py             hhs_backend/application_vm_api_server.py             hhs_runtime/pass190/shell.py             deployment/ubuntu/application_vm/configure_production_nginx.py             tests/pass220/test_pass220_ubuntu_application_vm_control_plane.py
      - name: Validate shell deployment syntax
        run: |
          bash -n deployment/ubuntu/application_vm/install.sh
          bash -n deployment/ubuntu/application_vm/verify.sh
          sh -n bin/hhs-vm
          python - <<'PY'
          import yaml
          from pathlib import Path
          yaml.compose(Path(".github/workflows/pass220-ubuntu-application-vm-production.yml").read_text())
          print("PASS220_PRODUCTION_WORKFLOW_YAML_VALID")
          PY
      - name: Validate service security boundary
        run: |
          grep -F '127.0.0.1:8720' deployment/ubuntu/application_vm/nginx-hhs-application-vm.conf
          grep -F 'NoNewPrivileges=true' deployment/ubuntu/application_vm/hhs-application-vm.service.template
          grep -F 'frontend_attached' hhs_backend/application_vm_api_server.py
      - name: Run dependency-scoped tests
        run: pytest -q tests/pass220/test_pass220_ubuntu_application_vm_control_plane.py
