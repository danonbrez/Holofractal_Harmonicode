name: Pass 220 I035 Q144 Dyadic Gauge Phase Transport

on:
  push:
    paths:
      - "hhs_runtime/hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py"
      - "hhs_runtime/hhs_pass220_holographic_gauge_dyadic_decoupling_v1.py"
      - "hhs_runtime/hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "tests/pass220/test_hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py"
      - "tests/pass220/test_hhs_pass220_holographic_gauge_dyadic_decoupling_v1.py"
      - "tests/pass220/test_hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "evidence/pass220/i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.wl"
      - "evidence/pass220/i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.output.json"
      - "evidence/pass220/i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.receipt.json"
      - "docs/pass220/PASS_220_I035_Q144_DYADIC_GAUGE_PHASE_TRANSPORT.md"
      - "docs/whitepapers/HARMONICODE_Q144_DYADIC_GAUGE_PHASE_TRANSPORT_THEOREM.md"
      - "docs/operations/restart/PASS_220_I035_Q144_DYADIC_GAUGE_PHASE_TRANSPORT_RESTART.md"
      - ".github/workflows/pass220-i035-q144-dyadic-gauge-phase-transport.yml"
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py"
      - "hhs_runtime/hhs_pass220_holographic_gauge_dyadic_decoupling_v1.py"
      - "hhs_runtime/hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "hhs_runtime/hhs_service_registry_v1.py"
      - "tests/pass220/test_hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py"
      - "tests/pass220/test_hhs_pass220_holographic_gauge_dyadic_decoupling_v1.py"
      - "tests/pass220/test_hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py"
      - "evidence/pass220/i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.wl"
      - "evidence/pass220/i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.output.json"
      - "evidence/pass220/i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.receipt.json"
      - "docs/pass220/PASS_220_I035_Q144_DYADIC_GAUGE_PHASE_TRANSPORT.md"
      - "docs/whitepapers/HARMONICODE_Q144_DYADIC_GAUGE_PHASE_TRANSPORT_THEOREM.md"
      - "docs/operations/restart/PASS_220_I035_Q144_DYADIC_GAUGE_PHASE_TRANSPORT_RESTART.md"
      - ".github/workflows/pass220-i035-q144-dyadic-gauge-phase-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-scoped requirements
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile I035 surfaces
        run: |
          python -m py_compile \
            hhs_runtime/hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py \
            tests/pass220/test_hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py

      - name: Verify connected Wolfram 23 of 23 receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path(
              "evidence/pass220/"
              "i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.wl"
          ).read_text(encoding="utf-8")
          data = json.loads(
              Path(
                  "evidence/pass220/"
                  "i035_q144_dyadic_gauge_phase_transport_wolfram_20260923_v1.output.json"
              ).read_text(encoding="utf-8")
          )
          assert data["status"] == "PASS"
          assert data["check_count"] == data["pass_count"] == 23
          assert data["failed"] == []
          assert data["q144"] == 144
          assert data["g72"] == 72
          assert data["bridge"] == [1, 72]
          assert data["gauge_ratio"] == [1, 1]
          assert data["dyadic_base"] == 2
          assert data["transition_friction"] == 7
          assert data["schema"] in source
          PY

      - name: Run I035 Q144 transport tests
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py

      - name: Run inherited I034 gauge regression
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_holographic_gauge_dyadic_decoupling_v1.py

      - name: Run inherited I021 144-cell phase regression
        env:
          PYTHONPATH: .
        run: >
          python -m pytest -q
          tests/pass220/test_hhs_pass220_144cell_epsilon_lo_shu_closure_v1.py

      - name: Enforce I035 exact phase and authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "hhs_runtime/"
              "hhs_pass220_q144_dyadic_gauge_phase_transport_v1.py"
          ).read_text(encoding="utf-8")

          required = (
              "Q144_CELLS = HARMONIC_CELLS",
              "Q144_HALF_STEPS_PER_G72_TOOTH = 2",
              'Q144_STEP_SOURCE = "2^(1/144)"',
              'PHASE_OPERATOR_SOURCE = "2^(P*a_norm^2/144)"',
              '"canonical_service": False',
              '"canonical_constraint_creation_authority": False',
              '"canonical_constraint_enforcement_authority": False',
              '"canonical_vm81_mutation_authority": False',
              '"canonical_hash72_authority": False',
              '"canonical_hash216_authority": False',
              '"canonical_magnitude_inflation": False',
              '"coefficient_is_canonical_metric_inflation": False',
          )
          for token in required:
              assert token in source, token

          forbidden = ("float(", "Decimal(", "numpy.")
          hits = [token for token in forbidden if token in source]
          assert not hits, hits
          PY
