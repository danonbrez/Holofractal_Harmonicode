name: Apply Pass 176 Editable Template Repair

on:
  push:
    branches: [agent/pass176-frozen-ide-stabilization]
    paths:
      - 'tools/patch_pass176_template_dirty.py'
      - '.github/workflows/pass176-template-dirty-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pass176-frozen-ide-stabilization
          fetch-depth: 0
      - name: Preserve editable unsaved template state
        run: python tools/patch_pass176_template_dirty.py
      - name: Verify affected application gallery test
        working-directory: applications/holofractal_harmonizer
        run: node --test tests/harmonic-geometric-puzzle.test.mjs
      - name: Remove temporary repair machinery and commit
        run: |
          rm tools/patch_pass176_template_dirty.py
          rm .github/workflows/pass176-template-dirty-repair.yml
          git config user.name 'hhs-pass176-stabilization'
          git config user.email 'hhs-pass176-stabilization@users.noreply.github.com'
          git add -A
          git commit -m 'Preserve editable dirty state for generated application projects'
          git push origin HEAD:agent/pass176-frozen-ide-stabilization

# Trigger after workflow registration.
