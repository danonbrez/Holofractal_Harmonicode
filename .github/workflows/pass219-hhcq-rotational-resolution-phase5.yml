name: Pass219 HHCQ Rotational Resolution Phase5

on:
  push:
    branches:
      - agent/pass219-core-dynamic-circuit-20260907
    paths:
      - 'hhs_runtime/include/hhs_pass219_hhcq_rotational_resolution_1_25.h'
      - 'hhs_runtime/c/hhs_pass219_hhcq_rotational_resolution_1_25.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'tests/pass219/test_pass219_hhcq_rotational_resolution_1_25.c'
      - 'benchmarks/pass219/hhcq_rotational_resolution_phase5_benchmark.cpp'
      - 'docs/operations/restart/PASS_219_HHCQ_ROTATIONAL_RESOLUTION_PHASE5_RESTART.md'
      - '.github/workflows/pass219-hhcq-rotational-resolution-phase5.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds

jobs:
  phase5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - name: Build exact ABI
        run: |
          set -o pipefail
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Compile and run focused Phase5 C invariants
        run: |
          set -o pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            tests/pass219/test_pass219_hhcq_rotational_resolution_1_25.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-phase5-test
          /tmp/pass219-phase5-test

      - name: Compile and run Phase5 native benchmark
        run: |
          set -o pipefail
          mkdir -p artifacts/pass219/phase5
          c++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic \
            -Ihhs_runtime/include \
            benchmarks/pass219/hhcq_rotational_resolution_phase5_benchmark.cpp \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lm \
            -o /tmp/pass219-phase5-benchmark
          /tmp/pass219-phase5-benchmark \
            | tee artifacts/pass219/phase5/hhcq_rotational_resolution.json

      - name: Validate Phase5 evidence gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('artifacts/pass219/phase5/hhcq_rotational_resolution.json')
          d = json.loads(p.read_text())
          expected_divisors = [
              5184,2592,1728,1296,864,648,576,432,324,288,
              216,192,162,144,108,96,81,72,64,54,48,36,32,
              27,24,18,16,12,9,8,6,4,3,2,1,
          ]
          assert d['schema'] == 'HHS_PASS219_HHCQ_ROTATIONAL_RESOLUTION_PHASE5_V1'
          assert d['parameter_count'] == 5184
          assert d['phase_modulus'] == 72
          assert d['trinary_step'] == 5
          assert d['selection_count'] == 72 * 72 * 3
          assert d['quotient_phase_coverage'] == 72
          assert d['rotated_phase_coverage'] == 72
          assert d['resolution_count'] == 35
          assert d['roundtrip_resolution_count'] == 35
          assert d['coordinate_identity_checks'] == 35 * 5184
          assert d['divisors'] == expected_divisors
          assert len(d['resolution_selection_counts']) == 35
          assert all(v > 0 for v in d['resolution_selection_counts'])
          assert d['ordered_xz_over_yw_phase_quotient'] is True
          assert d['complete_2a3b_divisor_lattice'] is True
          assert d['dyadic_trinary_dual_primitive'] is True
          assert d['exact_orthogonal_decomposition'] is True
          assert d['candidate_only'] is True
          assert d['canonical_authority_changed'] is False
          assert d['floating_point_authority'] is False
          print(json.dumps(d, indent=2, sort_keys=True))
          PY

      - name: Record Phase5 summary
        if: always()
        run: |
          {
            echo '### Pass219 HHCQ rotational resolution Phase5'
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            if test -f artifacts/pass219/phase5/hhcq_rotational_resolution.json; then
              echo '```json'
              cat artifacts/pass219/phase5/hhcq_rotational_resolution.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Phase5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass219-hhcq-rotational-resolution-phase5
          path: artifacts/pass219/phase5
          if-no-files-found: warn
