name: Pass 220 Runtime OS Native Observation Integration

on:
  push:
    branches:
      - dev/pass220-runtime-os-webgl-v147-native-integration
    paths:
      - 'hhs_runtime/hhs_pass220_gfx4_observation_witness_v1.py'
      - 'hhs_runtime/hhs_pass220_gfx4_decay_matrix_observation_v1.py'
      - 'hhs_gui/rendering/hhs_observation_graph_cache_v1.js'
      - 'hhs_gui/rendering/hhs_native_observation_binding_v1.js'
      - 'hhs_gui/rendering/hhs_webgl_observation_sampler_v1.js'
      - 'hhs_gui/rendering/hhs_native_webgl_frame_presenter_v1.js'
      - 'hhs_gui/rendering/hhs_guarded_observation_transport_v1.js'
      - 'hhs_runtime/hhs_pass220_native_observation_export_v1.py'
      - 'hhs_gui/rendering/hhs_runtime_os_native_observation_bootstrap_v1.js'
      - 'applications/runtime_os/HHS_Alpha_V148_Native_Observation_Bridge.html'
      - 'applications/runtime_os/HHS_Alpha_V149_Server_Owned_VMRC_Observation.html'
      - 'applications/runtime_os/HHS_Alpha_V150_Decay_Pool_Observation.html'
      - 'applications/runtime_os/HHS_Alpha_V151_Admitted_Geometry_WebGL.html'
      - 'applications/runtime_os/HHS_Alpha_V152_Ordered_Physical_Geometry_Observation.html'
      - 'tests/pass220/test_hhs_v148_embedded_native_observation_v1.py'
      - 'tests/pass220/test_hhs_v149_embedded_native_observation_v1.py'
      - 'tests/pass220/test_hhs_v150_decay_pool_preservation_v1.py'
      - 'tests/pass220/test_hhs_v151_admitted_geometry_preservation_v1.py'
      - 'tests/pass220/test_hhs_v152_geometry_preservation_v1.py'
      - 'tests/pass220/test_hhs_v152_local_geometry_observation_v1.cjs'
      - 'tests/pass220/test_hhs_native_webgl_frame_presenter_v1.cjs'
      - 'tests/pass220/test_hhs_v150_decay_pool_observer_v1.cjs'
      - 'tests/pass220/test_hhs_runtime_os_native_observation_bootstrap_v1.cjs'
      - 'hhs_runtime/hhs_service_registry_v1.py'
      - 'tests/pass220/test_hhs_guarded_observation_transport_v1.cjs'
      - 'tests/pass220/test_hhs_pass220_native_observation_export_v1.py'
      - 'tests/pass220/test_hhs_observation_graph_cache_v1.cjs'
      - 'tests/pass220/test_hhs_native_observation_binding_v1.cjs'
      - 'tests/pass220/test_hhs_webgl_observation_sampler_v1.cjs'
      - 'tests/pass220/test_hhs_pass220_gfx4_observation_witness_v1.py'
      - 'tests/pass220/test_hhs_pass220_gfx4_decay_matrix_observation_v1.py'
      - '.github/workflows/pass220-runtime-os-native-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-observation-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile existing Pass 179 C11 packet library (development only)
        run: |
          mkdir -p native_projects/hhs_pass220_gfx1_native_render_commands/build
          cc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror -pedantic \
            -I native_projects/hhs_pass220_gfx1_native_render_commands/include \
            native_projects/hhs_pass220_gfx1_native_render_commands/src/hhs_pass179_render_command_v1.c \
            -o native_projects/hhs_pass220_gfx1_native_render_commands/build/libhhs_pass179_render_command_v1.so
          make -C native_projects/hhs_pass220_gfx1_native_render_commands test
      - name: Compile native observation modules
        run: |
          python -m py_compile \
            hhs_runtime/hhs_pass220_gfx4_observation_witness_v1.py \
            hhs_runtime/hhs_pass220_gfx4_decay_matrix_observation_v1.py \
            hhs_runtime/hhs_pass220_native_observation_export_v1.py
      - name: Verify inherited GFX4 and new decay-binding contracts
        run: |
          python -m pytest -q \
            tests/pass220/test_hhs_pass220_gfx4_vm81_graphics_packet_identity_v1.py \
            tests/pass220/test_hhs_pass220_gfx4_observation_witness_v1.py \
            tests/pass220/test_hhs_pass220_gfx4_decay_matrix_observation_v1.py \
            tests/pass220/test_hhs_pass220_native_observation_export_v1.py \
            tests/pass220/test_hhs_v148_embedded_native_observation_v1.py \
            tests/pass220/test_hhs_v149_embedded_native_observation_v1.py \
            tests/pass220/test_hhs_v150_decay_pool_preservation_v1.py \
            tests/pass220/test_hhs_v151_admitted_geometry_preservation_v1.py \
            tests/pass220/test_hhs_v152_geometry_preservation_v1.py
      - name: Verify presentation-only cache and packet lane binding
        run: |
          node tests/pass220/test_hhs_observation_graph_cache_v1.cjs
          node tests/pass220/test_hhs_native_observation_binding_v1.cjs
          node tests/pass220/test_hhs_webgl_observation_sampler_v1.cjs
          node tests/pass220/test_hhs_guarded_observation_transport_v1.cjs
          node tests/pass220/test_hhs_runtime_os_native_observation_bootstrap_v1.cjs
          node tests/pass220/test_hhs_v150_decay_pool_observer_v1.cjs
          node tests/pass220/test_hhs_native_webgl_frame_presenter_v1.cjs
          node tests/pass220/test_hhs_v152_local_geometry_observation_v1.cjs
