name: Pass 214 Compound Optimization Benchmark Authority

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/pass214-operating-compression-gradient
    paths:
      - 'HHS_PASS_214_REPOSITORY_WIDE_COMPOUND_OPTIMIZATION_BENCHMARK_AUTHORITY.md'
      - 'contracts/pass214/**'
      - 'docs/pass214/**'
      - 'evidence/pass214/**'
      - 'hhs_backend/runtime/hhs_pass214_*'
      - 'hhs_backend/runtime/pass214_i*_payload/**'
      - 'tools/pass214_*'
      - 'scripts/run_pass214_contract_validation.sh'
      - 'tests/test_hhs_pass214_*'
      - 'tests/pass214_i*_test_payload/**'
      - '.github/workflows/pass214-*.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'HHS_PASS_214_REPOSITORY_WIDE_COMPOUND_OPTIMIZATION_BENCHMARK_AUTHORITY.md'
      - 'contracts/pass214/**'
      - 'docs/pass214/**'
      - 'evidence/pass214/**'
      - 'hhs_backend/runtime/hhs_pass214_*'
      - 'hhs_backend/runtime/pass214_i*_payload/**'
      - 'tools/pass214_*'
      - 'scripts/run_pass214_contract_validation.sh'
      - 'tests/test_hhs_pass214_*'
      - 'tests/pass214_i*_test_payload/**'
      - '.github/workflows/pass214-*.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  iterations-1-through-8-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pytest
      - name: Validate Pass 214 Iterations 1 through 8
        run: bash scripts/run_pass214_contract_validation.sh
      - name: Build inherited native C ABI
        run: make c-abi
      - name: Generate immutable Iteration 1 census
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration1"
          python tools/pass214_repository_census.py \
            --repository-root . \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-iteration1" \
            | tee "$RUNNER_TEMP/pass214-iteration1-validation.log"
      - name: Generate Iteration 2 callable conformance graph
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration2"
          python tools/pass214_callable_conformance.py \
            --repository-root . \
            --iteration1-directory "$RUNNER_TEMP/pass214-iteration1" \
            --source-ref HEAD \
            --output-directory "$RUNNER_TEMP/pass214-iteration2" \
            | tee "$RUNNER_TEMP/pass214-iteration2-validation.log"
      - name: Generate exact-head Iteration 4 workload manifest
        run: |
          python tools/pass214_iteration4_manifest.py \
            --repository-root . \
            --output "$RUNNER_TEMP/pass214-iteration4-manifest.json" \
            | tee "$RUNNER_TEMP/pass214-iteration4-manifest.log"
      - name: Execute selected repository-callable oracle
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration4"
          python tools/pass214_callable_oracle.py \
            --repository-root . \
            --iteration2-directory "$RUNNER_TEMP/pass214-iteration2" \
            --manifest "$RUNNER_TEMP/pass214-iteration4-manifest.json" \
            --output-directory "$RUNNER_TEMP/pass214-iteration4" \
            | tee "$RUNNER_TEMP/pass214-iteration4-validation.log"
      - name: Execute Iteration 5 callable corpus
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration5"
          python tools/pass214_iteration5_callable_corpus.py \
            --output-dir "$RUNNER_TEMP/pass214-iteration5" \
            | tee "$RUNNER_TEMP/pass214-iteration5-validation.log"
      - name: Execute Iteration 6 candidate binding report
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration6"
          python tools/pass214_iteration6_candidate_binding.py \
            --output "$RUNNER_TEMP/pass214-iteration6/PASS_214_ITERATION_6_CANDIDATE_BINDING_REPORT.json" \
            | tee "$RUNNER_TEMP/pass214-iteration6-validation.log"
      - name: Generate Iteration 7 live-admission manifest and CI inspection
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration7"
          python tools/pass214_iteration7_manifest.py \
            --output "$RUNNER_TEMP/pass214-iteration7/PASS_214_ITERATION_7_MANIFEST.json" \
            | tee "$RUNNER_TEMP/pass214-iteration7-manifest.log"
          python tools/pass214_iteration7_live_admission.py \
            --mode inspect \
            --output "$RUNNER_TEMP/pass214-iteration7/PASS_214_ITERATION_7_CI_INSPECTION.json" \
            | tee "$RUNNER_TEMP/pass214-iteration7-inspection.log"
      - name: Generate Iteration 8 terminal readiness inspection
        run: |
          mkdir -p "$RUNNER_TEMP/pass214-iteration8"
          python tools/pass214_iteration8_terminal_freeze.py \
            --mode inspect \
            --census-summary "$RUNNER_TEMP/pass214-iteration1/iteration1_summary.json" \
            --compatibility-summary "$RUNNER_TEMP/pass214-iteration2/iteration2_summary.json" \
            --output "$RUNNER_TEMP/pass214-iteration8/PASS_214_ITERATION_8_CI_INSPECTION.json" \
            | tee "$RUNNER_TEMP/pass214-iteration8-inspection.log"
      - name: Enforce non-promoting CI gates
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          i5 = json.loads((root / 'pass214-iteration5' / 'PASS_214_ITERATION_5_CALLABLE_CORPUS_REPORT.json').read_text())
          i6 = json.loads((root / 'pass214-iteration6' / 'PASS_214_ITERATION_6_CANDIDATE_BINDING_REPORT.json').read_text())
          i7 = json.loads((root / 'pass214-iteration7' / 'PASS_214_ITERATION_7_CI_INSPECTION.json').read_text())
          i8 = json.loads((root / 'pass214-iteration8' / 'PASS_214_ITERATION_8_CI_INSPECTION.json').read_text())
          assert i5['status'] == 'PILOT_READY'
          assert i5['policy']['migration_active'] is False
          assert i5['policy']['authority_promoted'] is False
          assert i5['policy']['pass215_authorized'] is False
          assert i6['status'] == 'CANDIDATE_SET_BOUND_ADMISSION_BLOCKED'
          assert i6['policy']['migration_active'] is False
          assert i6['policy']['authority_promoted'] is False
          assert i6['policy']['pass215_authorized'] is False
          assert i7['ready'] is False
          assert i7['migration_active'] is False
          assert i7['authority_promoted'] is False
          assert i7['pass215_authorized'] is False
          assert i8['ready'] is False
          assert i8['terminal_roots_minted'] is False
          assert i8['authority_promoted'] is False
          assert i8['migration_active'] is False
          assert i8['pass215_authorized'] is False
          assert i8['blockers']
          PY
      - name: Retain Pass 214 Iterations 1 through 8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass214-iterations-1-through-8-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pass214-iteration1/*.json
            ${{ runner.temp }}/pass214-iteration2/*.json
            ${{ runner.temp }}/pass214-iteration4/*.json
            ${{ runner.temp }}/pass214-iteration5/*.json
            ${{ runner.temp }}/pass214-iteration6/*.json
            ${{ runner.temp }}/pass214-iteration7/*.json
            ${{ runner.temp }}/pass214-iteration8/*.json
            ${{ runner.temp }}/pass214-iteration4-manifest.json
            ${{ runner.temp }}/pass214-iteration1-validation.log
            ${{ runner.temp }}/pass214-iteration2-validation.log
            ${{ runner.temp }}/pass214-iteration4-manifest.log
            ${{ runner.temp }}/pass214-iteration4-validation.log
            ${{ runner.temp }}/pass214-iteration5-validation.log
            ${{ runner.temp }}/pass214-iteration6-validation.log
            ${{ runner.temp }}/pass214-iteration7-manifest.log
            ${{ runner.temp }}/pass214-iteration7-inspection.log
            ${{ runner.temp }}/pass214-iteration8-inspection.log
            evidence/pass214/PASS_214_ITERATION_3_IMPLEMENTATION_RECORD.json
            evidence/pass214/PASS_214_ITERATION_4_IMPLEMENTATION_RECORD.json
            evidence/pass214/PASS_214_ITERATION_5_IMPLEMENTATION_RECORD.json
            evidence/pass214/PASS_214_ITERATION_6_IMPLEMENTATION_RECORD.json
            evidence/pass214/PASS_214_ITERATION_7_IMPLEMENTATION_RECORD.json
            evidence/pass214/PASS_214_ITERATION_8_IMPLEMENTATION_RECORD.json
          if-no-files-found: error
