name: Pass 220 Executed P Bridge Roundtrip
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_executed_p_bridge_roundtrip_v1.py"
      - "tests/pass220/test_pass220_executed_p_bridge_roundtrip_v1.py"
      - ".github/workflows/pass220-executed-p-bridge-roundtrip.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reversible-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Verify inherited projection codec through cross-modal P routes
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_executed_p_bridge_roundtrip_v1.py
