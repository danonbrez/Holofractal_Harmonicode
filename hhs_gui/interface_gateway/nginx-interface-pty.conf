# HHS interface Ubuntu PTY gateway.
# Include inside the existing TLS server block.

location = /api/interface/ubuntu/pty/status {
    proxy_pass http://127.0.0.1:8787/api/interface/ubuntu/pty/status;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 15s;
}

location = /api/interface/ubuntu/pty/ws {
    proxy_pass http://127.0.0.1:8787/api/interface/ubuntu/pty/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}
