name: Pass 220 Recursive Native HNAN 1.63 Preflight
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_recursive_hnan_native_rule_preflight_v1.py"
      - "tests/pass220/test_pass220_recursive_hnan_native_rule_preflight_v1.py"
      - ".github/workflows/pass220-recursive-hnan-native-rule-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rule-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Fail-closed native HNAN rule preflight adapter regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_recursive_hnan_native_rule_preflight_v1.py
