name: Pass 220 V7 Inherited Native Integration and Lane5 Replay

on:
  pull_request:
    paths:
      - 'hhs_runtime/hhs_pass220_v7_inherited_native_integration_v1.py'
      - 'tests/pass220/test_pass220_v7_inherited_native_integration_v1.py'
      - '.github/workflows/pass220-v7-inherited-native-integration.yml'
      - 'tools/pass220/pass220_ordered_tensor_quotient_native_frontend_probe_v1.c'
      - 'tools/pass220/pass220_v7_quotient_gate_v1.c'
      - 'hhs_runtime/hhs_pass220_v7_ordered_matrix_geometry_v1.py'
      - 'hhs_runtime/hhs_tensor_constraint_admissibility_v1.py'
      - 'tools/pass220/pass220_v7_native_pass159_pure_execution_v1.c'
      - 'tests/pass220/test_pass220_v7_native_pure_inherited_execution_v1.py'
      - 'contracts/pass220/PASS_220_V7_VM81_ORDERED_MATRIX_QUOTIENT_20261009.harmonicode'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inherited-native-v7:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      HHS_DISABLE_C_AUTOBUILD: '1'
      HHS_P220_V7_PASS159_FRONTEND_BIN: /tmp/pass220-v7-pass159-frontend
      HHS_P220_V7_QUOTIENT_GATE_BIN: /tmp/pass220-v7-hnan-quotient-gate
      HHS_P220_V7_PURE_EXEC_BIN: /tmp/pass220-v7-pass159-pure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest fastapi httpx websockets
      - name: Dependency-scoped source, address, negative authority tests
        run: |
          python -m pytest -q tests/pass220/test_pass220_v7_inherited_native_integration_v1.py -k 'not test_native_full_integration_when_binaries_are_provided'
      - name: Build existing native Runtime only once
        run: make c-abi
      - name: Compile inherited Pass159 source-to-VMIR native entrypoint
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Inative_projects/hhs_pass159_harmonicode_toolchain/include \
            -Ihhs_runtime/include \
            tools/pass220/pass220_ordered_tensor_quotient_native_frontend_probe_v1.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm -pthread \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" \
            -o "$HHS_P220_V7_PASS159_FRONTEND_BIN"
      - name: Compile native inherited HNAN and Pass169 quotient-mode membrane
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -DHHS220_V7_CLI -Ihhs_runtime/include \
            tools/pass220/pass220_v7_quotient_gate_v1.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm -pthread \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" \
            -o "$HHS_P220_V7_QUOTIENT_GATE_BIN"
      - name: Compile inherited Pass159 pure-evaluation entrypoint
        run: |
          set -euo pipefail
          cc -O2 -std=c11 -Wall -Wextra -Werror -pedantic \
            -Inative_projects/hhs_pass159_harmonicode_toolchain/include \
            -Ihhs_runtime/include \
            tools/pass220/pass220_v7_native_pass159_pure_execution_v1.c \
            -Lhhs_runtime/builds -lhhs_runtime -lcrypto -lstdc++ -lm -pthread \
            -Wl,-rpath,"$PWD/hhs_runtime/builds" \
            -o "$HHS_P220_V7_PURE_EXEC_BIN"
      - name: Execute source-bound inherited native frontend, pure evaluator, HNAN, public registry and Lane5
        run: |
          set -euo pipefail
          mkdir -p artifacts/pass220/v7-inherited
          python -m hhs_runtime.hhs_pass220_v7_inherited_native_integration_v1 \
            --source contracts/pass220/PASS_220_V7_VM81_ORDERED_MATRIX_QUOTIENT_20261009.harmonicode \
            --frontend "$HHS_P220_V7_PASS159_FRONTEND_BIN" \
            --mode-gate "$HHS_P220_V7_QUOTIENT_GATE_BIN" \
            --pure-binary "$HHS_P220_V7_PURE_EXEC_BIN" \
            --out artifacts/pass220/v7-inherited/native_integration.json \
            | tee artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_INHERITED_PASS159_NATIVE_FRONTEND=VERIFIED artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_INHERITED_PASS219_HNAN_15_RULES=VERIFIED artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_INHERITED_LANE5_NATIVE_CANDIDATE=VERIFIED artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_HASH72_HASH216_STATE_VALIDITY=INTRINSIC artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_LANE5_COMPOSITION_VALIDATION=NATIVE_KERNEL_NOT_JSON artifacts/pass220/v7-inherited/native_integration.txt
          grep -E '^V7_INHERITED_PASS159_PURE_EXEC_STATUS=-?[0-9]+$' artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_QUOTIENT_OPERATOR_SOURCE_BINDING=PENDING artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_TENSOR_STATE_INVALID=0 artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_TENSOR_STATE_BRANCH_RESOLUTION=PENDING artifacts/pass220/v7-inherited/native_integration.txt
          grep -Fx V7_CANONICAL_VM81_COMMIT=0 artifacts/pass220/v7-inherited/native_integration.txt
      - name: Dependency-scoped integration regression using actual native executables
        run: python -m pytest -q tests/pass220/test_pass220_v7_inherited_native_integration_v1.py
      - name: Constrain inherited receipts to the correct source and proof scope
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          src=Path('contracts/pass220/PASS_220_V7_VM81_ORDERED_MATRIX_QUOTIENT_20261009.harmonicode').read_bytes()
          doc=json.loads(Path('artifacts/pass220/v7-inherited/native_integration.json').read_text())
          assert doc["source_sha256"]==hashlib.sha256(src).hexdigest()
          assert doc["source_bytes"]==70
          assert doc["pass169_canonical_632_byte_corpus_receipt_borrowed"] is False
          assert doc["native_tensor_state_routing"]["classification"]=="EVIDENCE_PENDING"
          assert doc["native_tensor_state_routing"]["pending_is_not_contradiction"] is True
          assert doc["source_specific_quotient_operator_binding_present"] is False
          assert doc["native_pure_execution_attempted"] is True
          assert doc["inherited_native_pass159_pure_execution"]["canonical_mutation"] is False
          assert doc["vm81_signed_environmental_commit_performed"] is False
          assert doc["canonical_hash72_hash216_ledger_written"] is False
          assert doc["inherited_native_hnan_and_pass169_intent"]["xy_yx_and_zw_wz_order_inherited"]
          print("V7_PROOF_INHERITANCE_WITH_EXACT_SOURCE_SCOPE_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass220-v7-inherited-native-${{ github.sha }}
          path: artifacts/pass220/v7-inherited/
          if-no-files-found: warn
          retention-days: 90
