name: Pass 219 Cross-Modal Reversible State Manifold

on:
  push:
    branches:
      - main
      - agent/pass219-i146-cross-modal-reversible-state-manifold
    paths:
      - 'hhs_runtime/include/hhs_pass219_cross_modal_reversible_state_1_0.h'
      - 'hhs_runtime/include/hhs_pass219_cross_modal_reversible_state_1_0.hpp'
      - 'hhs_runtime/c/hhs_pass219_cross_modal_reversible_state_1_0.inc'
      - 'hhs_runtime/hhs_pass219_cross_modal_reversible_state_manifold_v1.py'
      - 'hhs_runtime/hhs_pass219_cross_modal_reversible_state_registration_v1.py'
      - 'hhs_runtime/hhs_pass219_mandatory_data_ml_registration_v1.py'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'contracts/pass219/PASS_219_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_1_0.json'
      - 'tests/pass219/test_pass219_cross_modal_reversible_state_1_0.c'
      - 'tests/pass219/test_pass219_cross_modal_reversible_state_1_0.cpp'
      - 'tests/pass219/test_pass219_cross_modal_reversible_state_manifold_v1.py'
      - 'benchmarks/pass219/pass219_cross_modal_reversible_state_benchmark.py'
      - 'docs/pass219/PASS_219_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_1_0.md'
      - 'docs/operations/restart/PASS_219_I146_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_RESTART.md'
      - '.github/workflows/pass219-cross-modal-reversible-state-manifold.yml'
  pull_request:
    branches: [main]
    paths:
      - 'hhs_runtime/include/hhs_pass219_cross_modal_reversible_state_1_0.h'
      - 'hhs_runtime/include/hhs_pass219_cross_modal_reversible_state_1_0.hpp'
      - 'hhs_runtime/c/hhs_pass219_cross_modal_reversible_state_1_0.inc'
      - 'hhs_runtime/hhs_pass219_cross_modal_reversible_state_manifold_v1.py'
      - 'hhs_runtime/hhs_pass219_cross_modal_reversible_state_registration_v1.py'
      - 'hhs_runtime/hhs_pass219_mandatory_data_ml_registration_v1.py'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'contracts/pass219/PASS_219_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_1_0.json'
      - 'tests/pass219/test_pass219_cross_modal_reversible_state_1_0.c'
      - 'tests/pass219/test_pass219_cross_modal_reversible_state_1_0.cpp'
      - 'tests/pass219/test_pass219_cross_modal_reversible_state_manifold_v1.py'
      - 'benchmarks/pass219/pass219_cross_modal_reversible_state_benchmark.py'
      - 'docs/pass219/PASS_219_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_1_0.md'
      - 'docs/operations/restart/PASS_219_I146_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_RESTART.md'
      - '.github/workflows/pass219-cross-modal-reversible-state-manifold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-cross-modal-manifold:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency-scoped test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Parse normative contract
        run: |
          python -m json.tool contracts/pass219/PASS_219_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_1_0.json >/dev/null
          python - <<'PY'
          import json
          p='contracts/pass219/PASS_219_CROSS_MODAL_REVERSIBLE_STATE_MANIFOLD_1_0.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['base_invariants']['addresses'] == 5184
          assert d['state_identity']['ordered_phase_path_is_identity'] is True
          assert d['cross_modal_mapping']['lossless_adapter_roundtrip_required'] is True
          assert d['optimization']['canonical_authority_check_count_may_not_be_reduced'] is True
          PY

      - name: Reject approximate authority in new exact ABI
        run: |
          set -euo pipefail
          ! grep -REn '\b(float|double)\b'             hhs_runtime/include/hhs_pass219_cross_modal_reversible_state_1_0.h             hhs_runtime/include/hhs_pass219_cross_modal_reversible_state_1_0.hpp             hhs_runtime/c/hhs_pass219_cross_modal_reversible_state_1_0.inc

      - name: Compile cumulative exact ABI
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass219-xmodal artifacts/pass219/cross-modal-reversible-state
          gcc -O3 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include             -c hhs_runtime/c/hhs_runtime_exact_abi.c             -o /tmp/pass219-xmodal/exact.o

      - name: Run C conformance
        run: |
          gcc -O3 -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include             tests/pass219/test_pass219_cross_modal_reversible_state_1_0.c             /tmp/pass219-xmodal/exact.o             -o /tmp/pass219-xmodal/test-c
          /tmp/pass219-xmodal/test-c

      - name: Run C++ conformance
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include             tests/pass219/test_pass219_cross_modal_reversible_state_1_0.cpp             /tmp/pass219-xmodal/exact.o             -o /tmp/pass219-xmodal/test-cpp
          /tmp/pass219-xmodal/test-cpp

      - name: Run deterministic branch and mapping tests
        run: |
          python -m pytest -q --tb=short             tests/pass219/test_pass219_cross_modal_reversible_state_manifold_v1.py             tests/pass219/test_pass219_mandatory_data_ml_registration_v1.py
          python tests/pass219/test_pass219_execution_composer_registration_v1.py

      - name: Run exact logical-work benchmark
        run: |
          python benchmarks/pass219/pass219_cross_modal_reversible_state_benchmark.py             artifacts/pass219/cross-modal-reversible-state/benchmark.json
          python - <<'PY'
          import json
          p='artifacts/pass219/cross-modal-reversible-state/benchmark.json'
          d=json.load(open(p, encoding='utf-8'))
          assert d['result'] == 'PASS'
          assert d['aggregate']['exact_work_saved'] > 0
          assert d['proof_requirements']['authority_check_count_reduced'] is False
          assert d['canonical_authority_changed'] is False
          PY

      - name: Build exact runtime library fail closed
        run: |
          set -euo pipefail
          timeout 600s make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Preserve current I146 Pass180 membrane
        env:
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass180_membrane_i146.py

      - uses: actions/upload-artifact@v4
        with:
          name: pass219-cross-modal-reversible-state
          path: artifacts/pass219/cross-modal-reversible-state/*.json
          if-no-files-found: error
