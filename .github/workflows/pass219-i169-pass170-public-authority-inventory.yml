name: Pass 219 I169 Pass170 Public Authority Inventory

on:
  push:
    branches:
      - main
      - agent/pass219-i169-pass170-public-authority-inventory
    paths:
      - 'HHS_PASS_169_COMPLETION_RECEIPT.json'
      - 'HHS_PASS_170_PUBLIC_API_PORT_AUTHORITY_ENFORCEMENT_AND_HIGHER_LEVEL_FUNCTION_DEVELOPMENT_CORRECTION_RUNTIME.md'
      - 'hhs_runtime/pass219/pass170_public_authority_inventory_i169.py'
      - 'tests/pass219/test_pass219_i169_pass170_public_authority_inventory.py'
      - 'contracts/pass219/PASS_219_I169_PASS170_PUBLIC_AUTHORITY_INVENTORY_1_0.json'
      - '.github/workflows/pass219-i169-pass170-public-authority-inventory.yml'
      - 'docs/operations/restart/PASS_219_I169_PASS170_PUBLIC_AUTHORITY_INVENTORY_RESTART.md'
  pull_request:
    branches:
      - main
    paths:
      - 'HHS_PASS_169_COMPLETION_RECEIPT.json'
      - 'HHS_PASS_170_PUBLIC_API_PORT_AUTHORITY_ENFORCEMENT_AND_HIGHER_LEVEL_FUNCTION_DEVELOPMENT_CORRECTION_RUNTIME.md'
      - 'hhs_runtime/pass219/pass170_public_authority_inventory_i169.py'
      - 'tests/pass219/test_pass219_i169_pass170_public_authority_inventory.py'
      - 'contracts/pass219/PASS_219_I169_PASS170_PUBLIC_AUTHORITY_INVENTORY_1_0.json'
      - '.github/workflows/pass219-i169-pass170-public-authority-inventory.yml'
      - 'docs/operations/restart/PASS_219_I169_PASS170_PUBLIC_AUTHORITY_INVENTORY_RESTART.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-i169:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded validation dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Parse contract and compile I169 surfaces
        run: |
          set -euo pipefail
          python -m json.tool contracts/pass219/PASS_219_I169_PASS170_PUBLIC_AUTHORITY_INVENTORY_1_0.json >/dev/null
          python -m py_compile hhs_runtime/pass219/pass170_public_authority_inventory_i169.py
          python -m py_compile tests/pass219/test_pass219_i169_pass170_public_authority_inventory.py

      - name: Run dependency-scoped I169 tests
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/pass219/test_pass219_i169_pass170_public_authority_inventory.py

      - name: Execute read-only repository authority inventory
        run: |
          set -euo pipefail
          mkdir -p artifacts/pass219/i169
          python -m hhs_runtime.pass219.pass170_public_authority_inventory_i169 . \
            --output artifacts/pass219/i169/public_authority_inventory.json
          python -m json.tool artifacts/pass219/i169/public_authority_inventory.json >/dev/null

      - name: Enforce inherited parent and current nonterminal boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/pass219/i169/public_authority_inventory.json').read_text())
          blockers = report['blockers']
          checks = [
              ('schema', report['schema'] == 'HHS_PASS219_I169_PASS170_PUBLIC_AUTHORITY_INVENTORY_V1', report['schema']),
              ('parent_pass169.verified', report['parent_pass169']['verified'] is True, report['parent_pass169']['verified']),
              ('parent_pass169.terminal_verified', report['parent_pass169']['terminal_verified'] is True, report['parent_pass169']['terminal_verified']),
              ('parent_pass169.operation_verified_mask', report['parent_pass169']['operation_verified_mask'] == 4095, report['parent_pass169']['operation_verified_mask']),
              ('inventory_evidence_verified', report['inventory_evidence_verified'] is True, report['inventory_evidence_verified']),
              ('inventory.fastapi_constructor_count>=2', report['inventory']['fastapi_constructor_count'] >= 2, report['inventory']['fastapi_constructor_count']),
              ('canonical_gateway_absent', report['required_surfaces']['canonical_gateway']['present'] is False, report['required_surfaces']['canonical_gateway']['present']),
              ('public_operation_registry_absent', report['required_surfaces']['public_operation_registry']['present'] is False, report['required_surfaces']['public_operation_registry']['present']),
              ('public_network_port_registry_absent', report['required_surfaces']['public_network_port_registry']['present'] is False, report['required_surfaces']['public_network_port_registry']['present']),
          ]
          for blocker in (
              'PASS170_CANONICAL_PUBLIC_GATEWAY_ABSENT',
              'PASS170_PUBLIC_OPERATION_REGISTRY_ABSENT',
              'PASS170_PUBLIC_NETWORK_PORT_REGISTRY_ABSENT',
              'PASS170_MULTIPLE_FASTAPI_CONSTRUCTORS_PRESENT',
          ):
              checks.append((f'blocker:{blocker}', blocker in blockers, blockers))
          checks.extend([
              ('pass170_terminal_contract_verified', report['pass170_terminal_contract_verified'] is False, report['pass170_terminal_contract_verified']),
              ('canonical_state_mutated', report['canonical_state_mutated'] is False, report['canonical_state_mutated']),
              ('new_vm81_authority', report['new_vm81_authority'] is False, report['new_vm81_authority']),
              ('new_hash72_mint_authority', report['new_hash72_mint_authority'] is False, report['new_hash72_mint_authority']),
              ('hash216_persistence_authority', report['hash216_persistence_authority'] is False, report['hash216_persistence_authority']),
              ('floating_point_canonical_authority', report['floating_point_canonical_authority'] is False, report['floating_point_canonical_authority']),
              ('next_boundary', report['next_boundary'] == 'PASS170_CANONICAL_GATEWAY_AND_REGISTRY_REPAIR', report['next_boundary']),
          ])

          failed = []
          for name, ok, observed in checks:
              state = 'PASS' if ok else 'FAIL'
              print(f'{state} {name}: observed={observed!r}')
              if not ok:
                  failed.append({'check': name, 'observed': observed})

          summary = {
              'fastapi_constructor_count': report['inventory']['fastapi_constructor_count'],
              'route_decorator_count': report['inventory']['route_decorator_count'],
              'uvicorn_run_site_count': report['inventory']['uvicorn_run_site_count'],
              'socket_bind_site_count': report['inventory']['socket_bind_site_count'],
              'blockers': blockers,
              'next_boundary': report['next_boundary'],
              'failed_checks': failed,
          }
          print(json.dumps(summary, sort_keys=True))
          if failed:
              raise SystemExit(f'I169 boundary enforcement failed: {json.dumps(failed, sort_keys=True)}')
          PY

      - name: Upload I169 inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pass219-i169-pass170-public-authority-inventory-${{ github.sha }}
          path: artifacts/pass219/i169/public_authority_inventory.json
          if-no-files-found: warn
          retention-days: 90
