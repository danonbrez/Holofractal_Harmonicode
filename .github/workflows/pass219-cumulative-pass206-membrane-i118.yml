name: Pass 219 Cumulative Pass 206 Membrane I118

on:
  pull_request:
    branches:
      - agent/pass219-iteration116-reconciled-main
    paths:
      - 'docs/operations/restart/PASS_219_I118_VALIDATION_PROBE.md'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass206_1_18.h'
      - 'hhs_runtime/include/hhs_pass219_inherited_pass206_1_18.hpp'
      - 'hhs_runtime/c/hhs_pass219_inherited_pass206_1_18.inc'
      - 'hhs_runtime/include/hhs_runtime_exact_abi.h'
      - 'hhs_runtime/c/hhs_runtime_exact_abi.c'
      - 'hhs_runtime/hhs_pass219_cumulative_pass_membrane_i118_pass206.py'
      - 'tests/pass219/test_pass219_inherited_pass206_1_18.c'
      - 'tests/pass219/test_pass219_inherited_pass206_1_18.cpp'
      - 'tests/pass219/test_pass219_cumulative_pass206_membrane_i118.py'
      - '.github/workflows/pass219-cumulative-pass206-membrane-i118.yml'

permissions:
  contents: read

jobs:
  inherited-pass206-membrane:
    name: inherited-pass206-membrane (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [exact, synthetic]
    env:
      HHS_PASS208_GPU_ENABLED: '0'
      HHS_PASS207_GPU_BACKEND: CPU_REFERENCE
      HHS_PASS207_REQUIRE_PHYSICAL_GPU: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'exact' && github.event.pull_request.head.sha || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          fetch-depth: 0
      - name: Prove completed Pass 206 development lineage and approved repair ancestry
        run: |
          git merge-base --is-ancestor 918121aeb6d1c55aa8fbd5d60b15f03c4eb22423 HEAD
          git merge-base --is-ancestor 284bf652d9635cc0c940f79dfe6aff6f8b787c3c HEAD
          git merge-base --is-ancestor 2fe770d68f6e1da172d2c7992a90e31d69577b90 HEAD
          git merge-base --is-ancestor 84e057047e6c3da8753ea500a88193f769e49cca HEAD
          git merge-base --is-ancestor 16d17c1db690116fdc5f5b63ef7a097548685885 HEAD
      - name: Reject approximate authority tokens in Pass 206 stable ABI
        run: |
          python - <<'PY'
          import pathlib,re
          for p in [
              pathlib.Path('hhs_runtime/include/hhs_pass219_inherited_pass206_1_18.h'),
              pathlib.Path('hhs_runtime/include/hhs_pass219_inherited_pass206_1_18.hpp'),
              pathlib.Path('hhs_runtime/c/hhs_pass219_inherited_pass206_1_18.inc'),
          ]:
              m=re.search(r'\b(float|double)\b',p.read_text('utf-8'))
              if m: raise SystemExit(f'forbidden authority token {m.group(1)!r} in {p}')
          PY
      - name: Compile cumulative exact ABI
        run: |
          mkdir -p /tmp/pass219-i118-pass206
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include -c hhs_runtime/c/hhs_runtime_exact_abi.c -o /tmp/pass219-i118-pass206/exact.o
      - name: Run Pass 206 C and C++ conformance
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass206_1_18.c /tmp/pass219-i118-pass206/exact.o -o /tmp/pass219-i118-pass206/c && /tmp/pass219-i118-pass206/c
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass206_1_18.cpp /tmp/pass219-i118-pass206/exact.o -o /tmp/pass219-i118-pass206/cpp && /tmp/pass219-i118-pass206/cpp
      - name: Preserve Pass 207-218 and I114 C ABI
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass207_1_17.c /tmp/pass219-i118-pass206/exact.o -o /tmp/pass219-i118-pass206/test-207 && /tmp/pass219-i118-pass206/test-207
          for pass in 208 209 210 211 212 213 214 215 216 217 218; do
            gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_inherited_pass${pass}_1_16.c /tmp/pass219-i118-pass206/exact.o -o /tmp/pass219-i118-pass206/test-${pass} && /tmp/pass219-i118-pass206/test-${pass}
          done
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Ihhs_runtime/include tests/pass219/test_pass219_rna_execution_composer_1_14.c /tmp/pass219-i118-pass206/exact.o -o /tmp/pass219-i118-pass206/i114 && /tmp/pass219-i118-pass206/i114
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency-scoped packages
        run: python -m pip install --upgrade pytest pytest-asyncio fastapi pydantic httpx cryptography uvicorn sympy jsonschema
      - name: Run Pass 206 membrane preflight
        run: PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass206_membrane_i118.py
      - name: Preserve Pass 206 development completion tests
        run: PYTHONPATH="$PWD" pytest -q --tb=short tests/pass206
      - name: Preserve Pass 207 successor membrane and GPU driver
        run: |
          PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass207_membrane_i117.py
          mkdir -p hhs_runtime/builds
          cc -std=c11 -O3 -Wall -Wextra -Werror -pedantic -fPIC -shared hhs_runtime/c/hhs_pass207_gpu_driver.c -Ihhs_runtime/c -ldl -o hhs_runtime/builds/libhhs_pass207_gpu_driver.so
          PYTHONPATH="$PWD" pytest -q --tb=short tests/test_hhs_pass207_gpu_driver_v1.py
      - name: Preserve Pass 208 successor membrane
        run: PYTHONPATH="$PWD" python tests/pass219/test_pass219_cumulative_pass208_membrane_i116.py
