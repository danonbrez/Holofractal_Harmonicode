name: Pass 219 RML15 Route Reverse Replay

on:
  push:
    paths:
      - 'hhs_runtime/include/hhs_pass219_rml15_route_reverse_replay_1_28.h'
      - 'hhs_runtime/c/hhs_pass219_rml15_route_reverse_replay_1_28.c'
      - 'native_projects/hhs_pass219_rml15_route_reverse_replay/**'
      - 'hhs_runtime/pass219/route_reverse_replay.py'
      - 'tests/pass219/test_pass219_rml15_route_reverse_replay.py'
      - 'contracts/pass219/PASS_219_RML15_ROUTE_REVERSE_REPLAY_1_0.json'
      - '.github/workflows/pass219-rml15-route-reverse-replay.yml'
  pull_request:
    paths:
      - 'hhs_runtime/include/hhs_pass219_rml15_route_reverse_replay_1_28.h'
      - 'hhs_runtime/c/hhs_pass219_rml15_route_reverse_replay_1_28.c'
      - 'native_projects/hhs_pass219_rml15_route_reverse_replay/**'
      - 'hhs_runtime/pass219/route_reverse_replay.py'
      - 'tests/pass219/test_pass219_rml15_route_reverse_replay.py'
      - 'contracts/pass219/PASS_219_RML15_ROUTE_REVERSE_REPLAY_1_0.json'
      - '.github/workflows/pass219-rml15-route-reverse-replay.yml'
  workflow_dispatch:

jobs:
  targeted-rml15-route-reverse-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded validation dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi httpx
      - name: Build RML14 parent and RML15 native reverse successor
        run: make -C native_projects/hhs_pass219_rml15_route_reverse_replay validate
      - name: Validate inherited Pass 188 native Bott runtime
        run: make -C native_projects/hhs_pass188_bott_runtime validate
      - name: Prove canonical hash and frozen reverse/runtime exports remain available
        run: |
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep ' hhs_hash72_compute$'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep ' hhs_hash216_compute$'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep ' hhs_exact_pass219_i163_verify_reverse$'
          nm -D hhs_runtime/builds/libhhs_runtime.so | grep ' hhs_exact_pass219_i168_bind_canonical$'
      - name: Run RML13 through RML15 dependency scope plus frozen I168 regression
        run: |
          PYTHONPATH="$PWD" python -m pytest -q -s \
            tests/pass219/test_pass219_rml13_native_route_witness_binding.py \
            tests/pass219/test_pass219_rml14_route_bound_receipt_successor.py \
            tests/pass219/test_pass219_rml15_route_reverse_replay.py \
            tests/pass219/test_pass219_i168_pass169_general_runtime_binding.py
