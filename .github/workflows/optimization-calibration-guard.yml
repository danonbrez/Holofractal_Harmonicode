name: HHS optimization calibration guard

on:
  pull_request:
    paths:
      - "hhs_backend/runtime/hhs_optimization_calibration_v1.py"
      - "hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py"
      - "hhs_backend/runtime/hhs_pass207_vm81_gpu_runtime_v1.py"
      - "hhs_backend/runtime/hhs_pass208_gpu_branch_manifold_v1.py"
      - "hhs_backend/api/pass205_continuation_routes.py"
      - "deployment/digitalocean/gpu/pass208-gpu.env.example"
      - "deployment/digitalocean/gpu/install.sh"
      - "tests/test_hhs_optimization_calibration_v1.py"
      - ".github/workflows/optimization-calibration-guard.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "hhs_backend/runtime/hhs_optimization_calibration_v1.py"
      - "hhs_backend/runtime/hhs_pass205_continuation_runtime_v1.py"
      - "hhs_backend/runtime/hhs_pass207_vm81_gpu_runtime_v1.py"
      - "hhs_backend/runtime/hhs_pass208_gpu_branch_manifold_v1.py"
      - "hhs_backend/api/pass205_continuation_routes.py"
      - "deployment/digitalocean/gpu/pass208-gpu.env.example"
      - "deployment/digitalocean/gpu/install.sh"
      - "tests/test_hhs_optimization_calibration_v1.py"
      - ".github/workflows/optimization-calibration-guard.yml"

permissions:
  contents: read

jobs:
  exact-calibration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_hhs_optimization_calibration_v1.py
