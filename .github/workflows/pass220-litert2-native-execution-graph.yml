name: Pass 220 LiteRT2 Native Execution Graph

on:
  pull_request:
    paths:
      - 'native_projects/hhs_pass220_litert_native_execution_graph/**'
      - 'hhs_backend/runtime/hhs_pass220_native_litert_execution_graph_v1.py'
      - 'tests/pass220/test_hhs_pass220_litert_native_execution_graph_v1.py'
      - 'contracts/pass220/PASS_220_LITERT2_NATIVE_EXECUTION_GRAPH_V1.json'
      - 'docs/pass220/PASS_220_LITERT2_NATIVE_EXECUTION_GRAPH.md'
      - '.github/workflows/pass220-litert2-native-execution-graph.yml'
  push:
    branches: [main]
    paths:
      - 'native_projects/hhs_pass220_litert_native_execution_graph/**'
      - 'hhs_backend/runtime/hhs_pass220_native_litert_execution_graph_v1.py'
      - 'tests/pass220/test_hhs_pass220_litert_native_execution_graph_v1.py'
      - 'contracts/pass220/PASS_220_LITERT2_NATIVE_EXECUTION_GRAPH_V1.json'
      - 'docs/pass220/PASS_220_LITERT2_NATIVE_EXECUTION_GRAPH.md'
      - '.github/workflows/pass220-litert2-native-execution-graph.yml'

permissions:
  contents: read

jobs:
  litert-native-execution-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install differential-test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'numpy>=1.26,<3.0'
      - name: Compile and run strict C/C++ graph topology kernel
        run: make -C native_projects/hhs_pass220_litert_native_execution_graph clean all test
      - name: Run LiteRT2 graph-to-NumPy1 differential gates
        run: python -m pytest -q tests/pass220/test_hhs_pass220_litert_native_execution_graph_v1.py
