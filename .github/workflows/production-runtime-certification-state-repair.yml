name: Production Runtime Certification State Repair Validation

on:
  push:
    branches:
      - fix/production-runtime-certification-state-20260925
    paths:
      - '.github/workflows/production-runtime-certification-state-repair.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate production certification state repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest
          python -m py_compile hhs_runtime/runtime_lock_certifier_v1.py
          python -m pytest -q tests/test_runtime_lock_certifier_production_state.py
          grep -F 'Environment=HHS_RUNTIME_CERTIFICATION_DIR=/var/lib/hhs/runtime-certification' deploy/digitalocean/hhs-pass196-integrated-environment.service
          grep -F 'ReadWritePaths=/var/lib/hhs' deploy/digitalocean/hhs-pass196-integrated-environment.service
          ! grep -F 'ReadWritePaths=/opt/hhs/app' deploy/digitalocean/hhs-pass196-integrated-environment.service
