name: VM81 Native Development Level 0-1

on:
  push:
    branches:
      - agent/vm81-native-dev-level0-level1
  pull_request:
    paths:
      - native_projects/hhs_vm81_native_development/**
      - tests/test_hhs_vm81_native_development_v1.py
      - hhs_runtime/c/hhs_runtime_abi.c
      - hhs_runtime/c/hhs_runtime_abi.h
      - hhs_runtime/src/hhs_hash216.c
      - hhs_runtime/include/hhs_hash216.h
      - .github/workflows/vm81-native-development-level0-level1.yml

permissions:
  contents: read

jobs:
  level0-level1-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install compatible repository test baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio "fastapi==0.128.2" "starlette==0.50.0"

      - name: Validate deterministic architecture surface
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_architecture_surface_is_deterministic

      - name: Validate VM81 and Hash216 dimensions
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_architecture_dimensions_are_exact

      - name: Validate inherited Pass079 direct ABI count
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_legacy_public_abi_count_matches_pass079

      - name: Validate linked Hash72 and Hash216 ABI discovery count
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_hash72_hash216_linked_abi_count_is_discovered

      - name: Validate current linked ABI remains explicitly unbound
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_current_linked_abi_total_remains_unbound_until_new_registry_layer

      - name: Validate Hash72 compare erratum
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_hash72_compare_schema_erratum_preserves_frozen_c_semantics

      - name: Validate non-authoritative float classification
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_float_surfaces_are_explicitly_non_authoritative

      - name: Validate explicit missing capability ledger
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_missing_capabilities_remain_explicit_and_unclaimed

      - name: Execute exact VM81 public C ABI smoke program
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_direct_c_abi_exact_foundation_smoke

      - name: Execute Hash216 identity smoke program
        run: python -m pytest -q tests/test_hhs_vm81_native_development_v1.py::test_hash216_identity_foundation_smoke

      - name: Generate deterministic architecture surface
        run: |
          python -m native_projects.hhs_vm81_native_development.hhs_vm81_native_development_v1 > "$RUNNER_TEMP/VM81_ARCHITECTURE_SURFACE_LEVEL_0_1.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "VM81_ARCHITECTURE_SURFACE_LEVEL_0_1.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["vm81_cell_count"] == 81
          assert data["hash216_position_count"] == 216
          assert data["implementation_status"] == "FOUNDATION_IMPLEMENTED_TERMINAL_VERIFICATION_NOT_YET_CLAIMED"
          assert data["closure"]["level0_terminal_classification_emitted"] is False
          assert data["closure"]["level1_terminal_classification_emitted"] is False
          print(data["architecture_surface_root_hash72"])
          PY

      - name: Upload Level 0-1 architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: vm81-architecture-surface-level0-level1
          path: ${{ runner.temp }}/VM81_ARCHITECTURE_SURFACE_LEVEL_0_1.json
          if-no-files-found: error
