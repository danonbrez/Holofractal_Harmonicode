name: Pass 218 Full Iteration 3

on:
  push:
    branches:
      - agent/pass218-full-iteration3-source-transaction-membrane
  pull_request:
    branches:
      - main

jobs:
  source-transaction-membrane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile cumulative Pass 218 surfaces
        run: |
          python -m py_compile hhs_runtime/pass218/*.py
          python -m py_compile tools/pass218_iteration1_evidence.py
          python -m py_compile tools/pass218_iteration2_evidence.py
          python -m py_compile tools/pass218_iteration3_evidence.py
      - name: Enforce no authoritative float literals
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          paths = sorted(Path('hhs_runtime/pass218').glob('*.py'))
          assert paths
          for path in paths:
              tree = ast.parse(path.read_text('utf-8'))
              floats = [
                  node for node in ast.walk(tree)
                  if isinstance(node, ast.Constant) and isinstance(node.value, float)
              ]
              assert not floats, f'{path}: authoritative float literal(s) found'
          print('PASS218_I3_NO_FLOAT_LITERAL_AUTHORITY=1')
          PY
      - name: Preserve Iteration 1 exact foundations
        run: pytest -q tests/pass218/test_pass218_iteration1_genesis_curriculum.py
      - name: Preserve Iteration 2 grammar and hydration foundations
        run: pytest -q tests/pass218/test_pass218_iteration2_grammar_narrative_hydration.py
      - name: Run Iteration 3 source transaction membrane tests
        run: pytest -q tests/pass218/test_pass218_iteration3_source_transaction_membrane.py
      - name: Preserve inherited Pass 218 reference crawler evidence
        run: pytest -q tests/pass218/test_repository_native_creative_writing_crawler.py
      - name: Emit repository-native Iteration 3 evidence
        run: python tools/pass218_iteration3_evidence.py
