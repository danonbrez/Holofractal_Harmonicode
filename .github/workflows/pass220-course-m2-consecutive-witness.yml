name: Pass 220 Course M2 Consecutive Integer Witness
on:
  pull_request:
    paths:
      - "hhs_runtime/hhs_pass220_course_m2_consecutive_witness_v1.py"
      - "tests/pass220/test_pass220_course_m2_consecutive_witness_v1.py"
      - "hhs_runtime/hhs_pass220_course_module_gate_provenance_v1.py"
      - "hhs_runtime/hhs_pass220_whitepaper_proof_dependency_binding_v1.py"
      - "hhs_runtime/hhs_pass220_whitepaper_corpus_ingress_v1.py"
      - "contracts/pass220/PASS_220_WHITEPAPER_CORPUS_SOURCE_FREEZE_V1.json"
      - "whitepapers/Harmonicode Algebra - Course"
      - ".github/workflows/pass220-course-m2-consecutive-witness.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-modulus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Execute exact consecutive-integer prerequisites and rejection tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q --tb=short tests/pass220/test_pass220_course_m2_consecutive_witness_v1.py
