name: HHS Hash216 Repository Dependency Index

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'REPOSITORY_HASH216_DEPENDENCY_TREE.md'
      - 'artifacts/repository_index/**'
      - 'docs/repository_index/files/**'

permissions:
  contents: write
  actions: write

jobs:
  deep-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-pytest python3-cryptography

      - name: Build cumulative exact ABI
        run: |
          make clean
          make c-abi
          test -s hhs_runtime/builds/libhhs_runtime.so

      - name: Validate Lane 5 repository hydration knowledge graph 1.69
        run: |
          PYTHONPATH=. pytest -q tests/pass219/test_pass219_lane5_repository_hydration_knowledge_graph_1_69.py

      - name: Deep scan repository through Lane 5 and Hash216
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import html
          import json
          import posixpath
          import re
          import subprocess
          from collections import Counter, defaultdict
          from pathlib import Path, PurePosixPath
          from urllib.parse import quote, unquote

          from hhs_backend.runtime.hhs_pass214_repository_census_v1 import build_repository_census
          from hhs_backend.runtime.hhs_pass219_lane5_repository_capability_reverse_discovery_1_44 import build_repository_capability_reverse_discovery
          from hhs_backend.runtime.hhs_pass219_lane5_repository_hydration_knowledge_graph_1_69 import build_repository_hydration_knowledge_graph, Lane5RepositoryHydrationKnowledgeDatabase
          from hhs_runtime.pass191.repository_hydration import _hash216
          from hhs_verification.pass173.dependency_scanner import DependencyScanner

          ROOT = Path('.').resolve()
          REPO = 'danonbrez/Holofractal_Harmonicode'
          MASTER = 'REPOSITORY_HASH216_DEPENDENCY_TREE.md'
          GRAPH = 'artifacts/repository_index/REPOSITORY_HASH216_DEPENDENCY_GRAPH.json'
          KNOWLEDGE = 'artifacts/repository_index/LANE5_HASH216_HYDRATION_KNOWLEDGE_GRAPH.json'
          DB_RECEIPT = 'artifacts/repository_index/LANE5_HASH216_HYDRATION_DATABASE_RECEIPT.json'
          SHARDS = 'docs/repository_index/files'
          GENERATED = (MASTER, GRAPH, KNOWLEDGE, DB_RECEIPT, SHARDS + '/')
          TEXT = {'.py','.pyi','.c','.h','.cc','.cpp','.cxx','.hpp','.hh','.js','.mjs','.cjs','.jsx','.ts','.tsx','.json','.jsonl','.yaml','.yml','.toml','.ini','.cfg','.md','.rst','.adoc','.html','.htm','.css','.scss','.sh','.bash','.zsh','.ps1','.sql','.txt','.glsl','.wgsl','.vert','.frag','.cmake'}
          NAMES = {'Makefile','GNUmakefile','CMakeLists.txt','Dockerfile'}
          EXT = ('','.py','.pyi','.js','.mjs','.cjs','.jsx','.ts','.tsx','.json','.md','.h','.hpp','.c','.cc','.cpp','.css','.html','.sh','.yaml','.yml','.toml')
          INDEX = ('__init__.py','index.js','index.mjs','index.ts','index.tsx','README.md')
          CINC = re.compile(r'(?m)^\s*#\s*include\s*[<"]([^>"]+)[>"]')
          JSIMP = re.compile(r'(?:\bfrom\s*|\bimport\s*\(|\brequire\s*\()\s*[\'"]([^\'"]+)[\'"]|^\s*import\s*[\'"]([^\'"]+)[\'"]', re.M)
          MDLINK = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          HTMLLINK = re.compile(r'(?:src|href)\s*=\s*[\'"]([^\'"]+)[\'"]', re.I)
          PATHREF = re.compile(r'(?<![A-Za-z0-9_])((?:\.?\.?/)?[A-Za-z0-9_.+@()~-]+(?:/[A-Za-z0-9_.+@()~-]+)+\.[A-Za-z0-9_.+-]+)')

          def git(*args):
              return subprocess.check_output(['git','-C',str(ROOT),*args], text=True).strip()

          def projection(path):
              return path in {MASTER, GRAPH, KNOWLEDGE, DB_RECEIPT} or path.startswith(SHARDS + '/')

          def clean(ref):
              ref = unquote(html.unescape(ref.strip())).strip("'\"<>")
              return ref.split('#',1)[0].split('?',1)[0].replace('\\','/')

          def resolve(src, ref, files, dirs):
              ref = clean(ref)
              if not ref or ref.startswith(('http://','https://','mailto:','data:','javascript:','#')):
                  return None
              bases = [ref.lstrip('/')] if ref.startswith('/') else [posixpath.join(posixpath.dirname(src),ref), ref]
              candidates = []
              for base in bases:
                  base = posixpath.normpath(base)
                  if base == '.' or base.startswith('../'):
                      continue
                  candidates.append(base)
                  if not PurePosixPath(base).suffix:
                      candidates.extend(base + ext for ext in EXT if ext)
                      candidates.extend(base.rstrip('/') + '/' + name for name in INDEX)
                  if base in dirs:
                      candidates.extend(base.rstrip('/') + '/' + name for name in INDEX)
              return next((item for item in candidates if item in files), None)

          def modules(files):
              out = {}
              for path in files:
                  p = PurePosixPath(path)
                  if p.suffix not in {'.py','.pyi'}:
                      continue
                  parts = list(p.with_suffix('').parts)
                  if parts[-1] == '__init__':
                      parts.pop()
                  if not parts:
                      continue
                  out['.'.join(parts)] = path
                  if parts[0] == 'python' and len(parts) > 1:
                      out['.'.join(parts[1:])] = path
              return out

          def modresolve(name, mmap):
              current = name
              while current:
                  if current in mmap:
                      return mmap[current]
                  if '.' not in current:
                      return None
                  current = current.rsplit('.',1)[0]
              return None

          def add(edges, src, target, kind, line, ref):
              if target and target != src:
                  edges.add((src,target,kind,int(line),ref))

          def lineno(text, offset):
              return text.count('\n',0,offset) + 1

          census = build_repository_census(ROOT, source_ref='HEAD')
          summary = census['summary']
          manifest = census['tree_manifest']
          census_rows = {row['path']:row for row in census['path_census']}
          all_blobs = [row for row in manifest if row['object_type']=='blob']
          projection_blobs = [row for row in all_blobs if projection(row['path'])]
          blobs = [row for row in all_blobs if not projection(row['path'])]
          files = {row['path'] for row in blobs}
          dirs = {row['path'] for row in manifest if row['object_type']=='tree'}
          mmap = modules(files)
          basename = defaultdict(list)
          for path in sorted(files):
              basename[PurePosixPath(path).name].append(path)

          edge_set = set()
          external = set()
          scanned = 0
          file_nodes = []

          for entry in sorted(blobs,key=lambda row:row['path']):
              path = entry['path']
              pure = PurePosixPath(path)
              text = None
              if pure.suffix.lower() in TEXT or pure.name in NAMES:
                  if entry.get('size') is None or entry.get('size') <= 8*1024*1024:
                      try:
                          raw = (ROOT/path).read_bytes()
                          if b'\0' not in raw:
                              text = raw.decode('utf-8','surrogateescape')
                      except OSError:
                          pass
              if text is not None:
                  scanned += 1
                  suffix = pure.suffix.lower()
                  if suffix in {'.py','.pyi'}:
                      try:
                          tree = ast.parse(text,filename=path)
                      except (SyntaxError,ValueError):
                          tree = None
                      if tree is not None:
                          package = list(pure.with_suffix('').parts)[:-1]
                          for node in ast.walk(tree):
                              names = []
                              if isinstance(node,ast.Import):
                                  names = [alias.name for alias in node.names]
                              elif isinstance(node,ast.ImportFrom):
                                  base = node.module or ''
                                  if node.level:
                                      keep = max(0,len(package)-(node.level-1))
                                      base = '.'.join(package[:keep]+[x for x in base.split('.') if x])
                                  if base:
                                      names.append(base)
                                  names.extend((base+'.'+alias.name if base else alias.name) for alias in node.names if alias.name!='*')
                              resolved = False
                              for name in names:
                                  target = modresolve(name,mmap)
                                  if target:
                                      add(edge_set,path,target,'PYTHON_IMPORT',getattr(node,'lineno',0),name)
                                      resolved = True
                              if names and not resolved:
                                  external.add((path,names[0].split('.',1)[0],int(getattr(node,'lineno',0))))
                  if suffix in {'.c','.h','.cc','.cpp','.cxx','.hpp','.hh'}:
                      for match in CINC.finditer(text):
                          ref = match.group(1)
                          target = resolve(path,ref,files,dirs)
                          if target is None and len(basename.get(PurePosixPath(ref).name,())) == 1:
                              target = basename[PurePosixPath(ref).name][0]
                          add(edge_set,path,target,'C_CPP_INCLUDE',lineno(text,match.start()),ref)
                  if suffix in {'.js','.mjs','.cjs','.jsx','.ts','.tsx'}:
                      for match in JSIMP.finditer(text):
                          ref = match.group(1) or match.group(2)
                          target = resolve(path,ref,files,dirs)
                          if target:
                              add(edge_set,path,target,'JS_TS_IMPORT',lineno(text,match.start()),ref)
                          elif not ref.startswith(('.','/')):
                              external.add((path,ref.split('/',1)[0],lineno(text,match.start())))
                  if suffix in {'.md','.rst','.adoc'}:
                      for match in MDLINK.finditer(text):
                          rawref = match.group(1).strip()
                          ref = rawref.split()[0] if rawref else ''
                          add(edge_set,path,resolve(path,ref,files,dirs),'DOCUMENT_LINK',lineno(text,match.start()),ref)
                  if suffix in {'.html','.htm'}:
                      for match in HTMLLINK.finditer(text):
                          ref = match.group(1)
                          add(edge_set,path,resolve(path,ref,files,dirs),'HTML_LINK',lineno(text,match.start()),ref)
                  for match in PATHREF.finditer(text):
                      ref = match.group(1)
                      add(edge_set,path,resolve(path,ref,files,dirs),'REPOSITORY_PATH_REFERENCE',lineno(text,match.start()),ref)

              row = census_rows[path]
              body = {'path':path,'mode':entry['mode'],'git_blob':entry['object_id'],'size_bytes':entry.get('size'),'language':row['language'],'disposition':row['disposition'],'origin':row['origin']}
              file_nodes.append({**body,'hash216':_hash216('HHS-REPOSITORY-INDEX-FILE-V1',body)})

          dependency_edges = []
          for source,target,kind,line,reference in sorted(edge_set):
              body = {'from':source,'to':target,'type':kind,'line':line,'reference':reference}
              dependency_edges.append({**body,'hash216':_hash216('HHS-REPOSITORY-DEPENDENCY-EDGE-V1',body)})

          outgoing = Counter(edge['from'] for edge in dependency_edges)
          incoming = Counter(edge['to'] for edge in dependency_edges)
          for node in file_nodes:
              node['outgoing_dependencies'] = outgoing[node['path']]
              node['incoming_dependencies'] = incoming[node['path']]

          directory_paths = {''}
          for path in files:
              parent = PurePosixPath(path).parent
              while parent.as_posix() not in {'.',''}:
                  directory_paths.add(parent.as_posix())
                  parent = parent.parent
          directory_nodes = []
          for path in sorted(directory_paths):
              body = {'path':path,'parent':posixpath.dirname(path) if path else '','kind':'DIRECTORY'}
              directory_nodes.append({**body,'hash216':_hash216('HHS-REPOSITORY-INDEX-DIRECTORY-V1',body)})

          containment_edges = []
          for node in directory_nodes:
              if node['path']:
                  body = {'from':node['parent'],'to':node['path'],'type':'CONTAINS_DIRECTORY'}
                  containment_edges.append({**body,'hash216':_hash216('HHS-REPOSITORY-INDEX-EDGE-V1',body)})
          for path in sorted(files):
              body = {'from':posixpath.dirname(path),'to':path,'type':'CONTAINS_FILE'}
              containment_edges.append({**body,'hash216':_hash216('HHS-REPOSITORY-INDEX-EDGE-V1',body)})

          lane5 = build_repository_capability_reverse_discovery(ROOT)
          bindings = []
          for node in lane5['nodes']:
              path = node.get('declaring_header') if node.get('source_kind')=='NATIVE_EXACT_ABI' else node.get('path') if node.get('source_kind')=='PYTHON_OPERATION_REGISTRY' else None
              if path in files:
                  body = {'from':path,'to':node['node_id'],'type':'DECLARES_LANE5_CAPABILITY_NODE','authority_class':node['authority_class'],'source_kind':node['source_kind']}
                  bindings.append({**body,'hash216':_hash216('HHS-REPOSITORY-LANE5-CAPABILITY-BINDING-V1',body)})
          bindings.sort(key=lambda item:(item['from'],item['to']))

          roots = {
              'file_node_root_hash216':_hash216('HHS-REPOSITORY-INDEX-FILE-ROOT-V1',[x['hash216'] for x in file_nodes]),
              'directory_node_root_hash216':_hash216('HHS-REPOSITORY-INDEX-DIRECTORY-ROOT-V1',[x['hash216'] for x in directory_nodes]),
              'containment_edge_root_hash216':_hash216('HHS-REPOSITORY-INDEX-CONTAINMENT-ROOT-V1',[x['hash216'] for x in containment_edges]),
              'dependency_edge_root_hash216':_hash216('HHS-REPOSITORY-INDEX-DEPENDENCY-ROOT-V1',[x['hash216'] for x in dependency_edges]),
              'lane5_capability_binding_root_hash216':_hash216('HHS-REPOSITORY-INDEX-LANE5-BINDING-ROOT-V1',[x['hash216'] for x in bindings]),
          }
          commit = git('rev-parse','HEAD')
          tree_id = git('rev-parse','HEAD^{tree}')
          roots['graph_root_hash216'] = _hash216('HHS-REPOSITORY-HASH216-FILE-DEPENDENCY-GRAPH-V1',{'commit':commit,'tree':tree_id,'roots':roots,'lane5':lane5['model_root_sha256']})

          graph = {
              'schema':'HHS_REPOSITORY_HASH216_FILE_DEPENDENCY_INDEX_V1',
              'source_commit':commit,
              'source_tree':tree_id,
              'projection_policy':{'read_only_discovery':True,'candidate_only':True,'canonical_vm81_mutation_authority':False,'canonical_hash72_authority':False,'canonical_hash216_authority':False,'automatic_hash216_composition_promotion':False,'automatic_superedge_promotion':False,'self_generated_projection_excluded':[MASTER,GRAPH,KNOWLEDGE,DB_RECEIPT,SHARDS+'/**']},
              'counts':{
                  'tracked_tree_entries':summary['coverage']['tracked_tree_entries'],
                  'tracked_files_total':len(all_blobs),
                  'tracked_files':len(file_nodes),
                  'projection_artifacts_excluded':len(projection_blobs),
                  'tracked_directories':len(directory_nodes),
                  'text_files_scanned':scanned,
                  'pass173_python_import_observations':len(DependencyScanner(ROOT).scan_python_imports((ROOT,))),
                  'file_dependency_edges':len(dependency_edges),
                  'containment_edges':len(containment_edges),
                  'external_dependency_observations':len(external),
                  'lane5_capability_nodes':lane5['counts']['total'],
                  'lane5_capability_bindings':len(bindings),
                  'lane5_canonical_boundaries':lane5['counts']['canonical_boundaries'],
              },
              'roots':roots,
              'pass214_census':{'roots':summary['roots'],'coverage':summary['coverage'],'receipt_hash72':summary['receipt_hash72']},
              'lane5':{'schema':lane5['schema'],'counts':lane5['counts'],'public_catalog_root_hash72':lane5['public_catalog_root_hash72'],'native_export_root_sha256':lane5['native_export_root_sha256'],'python_registry_root_sha256':lane5['python_registry_root_sha256'],'dependency_root_sha256':lane5['dependency_root_sha256'],'model_root_sha256':lane5['model_root_sha256'],'native_receipt':lane5['native_receipt'],'authority':lane5['authority'],'promotion_policy':lane5['promotion_policy']},
              'projection_artifacts':[{'path':x['path'],'git_blob':x['object_id'],'size_bytes':x.get('size')} for x in projection_blobs],
              'directories':directory_nodes,
              'files':file_nodes,
              'containment_edges':containment_edges,
              'dependency_edges':dependency_edges,
              'lane5_capability_bindings':bindings,
              'external_dependencies':[{'source':a,'module':b,'line':c} for a,b,c in sorted(external)],
          }

          paths = {x['path'] for x in file_nodes}
          assert len(paths) == graph['counts']['tracked_files']
          assert all(len(x['hash216'])==216 for x in file_nodes)
          assert all(x['from'] in paths and x['to'] in paths and len(x['hash216'])==216 for x in dependency_edges)
          assert all(len(v)==216 for k,v in roots.items() if k.endswith('_hash216'))
          receipt = lane5['native_receipt']
          assert lane5['counts']['canonical_boundaries'] == 1
          assert receipt['accepted'] is True and receipt['candidate_only'] is True
          for key in ('canonical_vm81_mutation_authority','canonical_hash72_authority','canonical_hash216_authority','canonical_persistence_authority','auto_hash216_composition_promotion','auto_superedge_promotion'):
              assert receipt[key] is False

          out_graph = ROOT/GRAPH
          out_graph.parent.mkdir(parents=True,exist_ok=True)
          out_graph.write_text(json.dumps(graph,sort_keys=True,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          knowledge = build_repository_hydration_knowledge_graph(ROOT, graph, lane5_snapshot=lane5)
          out_knowledge = ROOT/KNOWLEDGE
          out_knowledge.write_text(json.dumps(knowledge,sort_keys=True,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          db_path = Path('/tmp/hhs_lane5_repository_hydration_knowledge.sqlite3')
          for suffix in ('', '-wal', '-shm'):
              candidate = Path(str(db_path) + suffix)
              if candidate.exists(): candidate.unlink()
          with Lane5RepositoryHydrationKnowledgeDatabase(db_path) as knowledge_db:
              database_status = knowledge_db.hydrate(dependency_graph=graph, knowledge_projection=knowledge)
          database_status.pop('database_path', None)
          database_receipt = {
              'schema':'HHS_PASS_219_LANE5_REPOSITORY_HYDRATION_DATABASE_RECEIPT_1_69',
              'source_commit':commit,
              'source_dependency_graph_root_hash216':roots['graph_root_hash216'],
              'projection_root_hash216':knowledge['roots']['projection_root_hash216'],
              'database_status':database_status,
              'database_binary_is_source_authority':False,
              'restart_rehydratable_from_repository_artifacts':True,
          }
          (ROOT/DB_RECEIPT).write_text(json.dumps(database_receipt,sort_keys=True,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          shard_root = ROOT/SHARDS
          if shard_root.exists():
              for old in sorted(shard_root.rglob('*'),reverse=True):
                  if old.is_file() or old.is_symlink(): old.unlink()
                  elif old.is_dir(): old.rmdir()
          shard_root.mkdir(parents=True,exist_ok=True)

          by_source = defaultdict(list)
          groups = defaultdict(list)
          for edge in dependency_edges: by_source[edge['from']].append(edge)
          for node in file_nodes:
              group = node['path'].split('/',1)[0] if '/' in node['path'] else '_root'
              groups[group].append(node)

          def url(path):
              return 'https://github.com/'+REPO+'/blob/'+commit+'/'+quote(path,safe='/._-~()@+')

          shard_paths = {}
          for group,nodes in sorted(groups.items()):
              safe = re.sub(r'[^A-Za-z0-9_.-]+','_',group)
              rel = SHARDS+'/'+safe+'.md'
              shard_paths[group] = rel
              lines = ['# Repository file/dependency shard - '+group,'','Source commit: ['+commit+'](https://github.com/'+REPO+'/commit/'+commit+')','','Every content-bound tracked file in this shard is linked to the exact source commit. Complete 216-symbol identities and edge records are in the machine graph.','']
              parents = defaultdict(list)
              for node in nodes: parents[posixpath.dirname(node['path']) or '/'].append(node)
              for parent,values in sorted(parents.items()):
                  lines += ['## '+parent,'']
                  for node in sorted(values,key=lambda x:x['path']):
                      lines.append('- ['+node['path']+']('+url(node['path'])+') - H216 '+node['hash216'][:24]+'... ; '+node['language']+' ; out '+str(node['outgoing_dependencies'])+' ; in '+str(node['incoming_dependencies']))
                      targets = defaultdict(set)
                      for edge in by_source[node['path']]: targets[edge['to']].add(edge['type'])
                      if targets:
                          lines.append('  - depends on: '+'; '.join('['+p+']('+url(p)+') <sub>'+','.join(sorted(t))+'</sub>' for p,t in sorted(targets.items())))
                  lines.append('')
              (ROOT/rel).write_text('\n'.join(lines).rstrip()+'\n',encoding='utf-8')

          cross = Counter()
          for edge in dependency_edges:
              a = edge['from'].split('/',1)[0] if '/' in edge['from'] else '_root'
              b = edge['to'].split('/',1)[0] if '/' in edge['to'] else '_root'
              if a != b: cross[(a,b)] += 1
          master = ['# HHS Hash216 Repository File & Dependency Tree','','Generated deep index binding Pass 214 Git-tree census, Pass 173 dependency observations, Pass 191 three-Hash72 Hash216 identities, and Lane 5 1.44 capability topology.','', '> Read-only/candidate-only projection. It does not mint canonical VM81/Hash72/Hash216 state or promote Hash216 composition/superedges.','','## Bound repository state','', '- Source commit: ['+commit+'](https://github.com/'+REPO+'/commit/'+commit+')','- Git tree: '+tree_id,'- Tracked tree entries: '+format(graph['counts']['tracked_tree_entries'],','),'- Tracked files in Git tree: '+format(graph['counts']['tracked_files_total'],','),'- Content-bound indexed files: '+format(graph['counts']['tracked_files'],','),'- Projection artifacts excluded from content root: '+format(graph['counts']['projection_artifacts_excluded'],','),'- Text files deep-scanned: '+format(graph['counts']['text_files_scanned'],','),'- Internal dependency edges: '+format(graph['counts']['file_dependency_edges'],','),'- Containment edges: '+format(graph['counts']['containment_edges'],','),'- Lane 5 capability nodes: '+format(graph['counts']['lane5_capability_nodes'],','),'','## Hash216 graph roots','']
          for key in ('file_node_root_hash216','directory_node_root_hash216','containment_edge_root_hash216','dependency_edge_root_hash216','lane5_capability_binding_root_hash216','graph_root_hash216'):
              master += ['### '+key,'',roots[key],'']
          master += ['## Lane 5 evidence binding','', '- Public catalog Hash72: '+lane5['public_catalog_root_hash72'],'- Native export SHA-256: '+lane5['native_export_root_sha256'],'- Python registry SHA-256: '+lane5['python_registry_root_sha256'],'- Dependency SHA-256: '+lane5['dependency_root_sha256'],'- Model SHA-256: '+lane5['model_root_sha256'],'- Native receipt accepted: '+str(receipt['accepted']).lower(),'- Canonical admission boundaries: '+str(lane5['counts']['canonical_boundaries']),'','## Machine graph','', '['+GRAPH+']('+GRAPH+')','','## Lane 5 hydration knowledge graph','', '['+KNOWLEDGE+']('+KNOWLEDGE+')','', '- Capabilities: '+format(knowledge['counts']['capabilities'],','),'- Constructors: '+format(knowledge['counts']['constructors'],','),'- Knowledge relations: '+format(knowledge['counts']['knowledge_edges'],','),'- Projection root Hash216: '+knowledge['roots']['projection_root_hash216'],'- Database hydration receipt: ['+DB_RECEIPT+']('+DB_RECEIPT+')','','## Full file-link shards','','| Shard | Files |','|---|---:|']
          counts = Counter((n['path'].split('/',1)[0] if '/' in n['path'] else '_root') for n in file_nodes)
          for group,rel in sorted(shard_paths.items()): master.append('| ['+group+']('+rel+') | '+format(counts[group],',')+' |')
          master += ['','## Cross-component dependency tree','']
          grouped = defaultdict(list)
          for (a,b),count in cross.items(): grouped[a].append((b,count))
          for a in sorted(grouped):
              master += ['### '+a,'']
              for b,count in sorted(grouped[a],key=lambda x:(-x[1],x[0])): master.append('- -> '+b+': '+format(count,',')+' edges')
              master.append('')
          master += ['## Replay and authority rules','', '- Pass 214 classifies the complete bound Git tree.','- Every internal dependency endpoint resolves to a tracked content-bound file.','- Graph node, edge, and aggregate roots use 216-symbol Pass 191 Hash216 identity.','- Lane 5 1.44 retains exactly one inherited canonical admission boundary and candidate-only native validation.','- Generated projections are excluded from the content-bound source root to avoid self-referential hashing.','']
          (ROOT/MASTER).write_text('\n'.join(master),encoding='utf-8')

          print(json.dumps({'source_commit':commit,'source_tree':tree_id,'tracked_files':graph['counts']['tracked_files'],'dependency_edges':graph['counts']['file_dependency_edges'],'lane5_nodes':graph['counts']['lane5_capability_nodes'],'graph_root_hash216':roots['graph_root_hash216'],'knowledge_capabilities':knowledge['counts']['capabilities'],'knowledge_constructors':knowledge['counts']['constructors'],'knowledge_edges':knowledge['counts']['knowledge_edges'],'knowledge_root_hash216':knowledge['roots']['projection_root_hash216']},sort_keys=True))
          PY

      - name: Replay generated graph deterministically
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hhs_runtime/builds
          HHS_DISABLE_C_AUTOBUILD: '1'
        run: |
          cp REPOSITORY_HASH216_DEPENDENCY_TREE.md /tmp/repository-tree-first.md
          cp artifacts/repository_index/REPOSITORY_HASH216_DEPENDENCY_GRAPH.json /tmp/repository-graph-first.json
          cp artifacts/repository_index/LANE5_HASH216_HYDRATION_KNOWLEDGE_GRAPH.json /tmp/repository-knowledge-first.json
          find docs/repository_index/files -type f -name '*.md' -print0 | sort -z | xargs -0 sha256sum > /tmp/repository-shards-first.sha256
          # Re-run the exact workflow step body by invoking this workflow through its committed source is intentionally
          # replaced here by graph self-verification; determinism is additionally checked on every subsequent main push.
          python - <<'PY'
          import json
          from pathlib import Path
          graph=json.loads(Path('artifacts/repository_index/REPOSITORY_HASH216_DEPENDENCY_GRAPH.json').read_text())
          knowledge=json.loads(Path('artifacts/repository_index/LANE5_HASH216_HYDRATION_KNOWLEDGE_GRAPH.json').read_text())
          database_receipt=json.loads(Path('artifacts/repository_index/LANE5_HASH216_HYDRATION_DATABASE_RECEIPT.json').read_text())
          assert len(graph['roots']['graph_root_hash216']) == 216
          assert len(knowledge['roots']['projection_root_hash216']) == 216
          assert knowledge['source_dependency_graph_root_hash216'] == graph['roots']['graph_root_hash216']
          assert knowledge['authority']['candidate_only'] is True
          assert knowledge['authority']['canonical_hash216_authority'] is False
          assert database_receipt['projection_root_hash216'] == knowledge['roots']['projection_root_hash216']
          assert database_receipt['database_status']['capabilities'] == knowledge['counts']['capabilities']
          assert database_receipt['database_status']['constructors'] == knowledge['counts']['constructors']
          assert graph['lane5']['native_receipt']['accepted'] is True
          assert graph['lane5']['native_receipt']['candidate_only'] is True
          assert graph['counts']['tracked_files'] == len(graph['files'])
          assert graph['counts']['file_dependency_edges'] == len(graph['dependency_edges'])
          print('hash216_repository_graph_self_verify=PASS')
          PY

      - name: Upload deep-index evidence
        uses: actions/upload-artifact@v4
        with:
          name: hhs-hash216-repository-index-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            REPOSITORY_HASH216_DEPENDENCY_TREE.md
            artifacts/repository_index/REPOSITORY_HASH216_DEPENDENCY_GRAPH.json
            artifacts/repository_index/LANE5_HASH216_HYDRATION_KNOWLEDGE_GRAPH.json
            artifacts/repository_index/LANE5_HASH216_HYDRATION_DATABASE_RECEIPT.json
            docs/repository_index/files/*.md

      - name: Dispatch authoritative main refresh
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run repository-hash216-dependency-index.yml --ref main

      - name: Commit generated projection to main
        id: commit_projection
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin main
          remote_head="$(git rev-parse origin/main)"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "::notice title=Stale Hash216 projection skipped::main advanced from $EXPECTED_HEAD to $remote_head; refusing stale generated projection without marking the safe no-op as a workflow failure"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add REPOSITORY_HASH216_DEPENDENCY_TREE.md artifacts/repository_index docs/repository_index/files
          if git diff --cached --quiet; then
            echo 'repository Hash216 index already current'
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh Hash216 repository dependency index'
          git push origin HEAD:main
          committed_sha="$(git rev-parse HEAD)"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "committed_sha=$committed_sha" >> "$GITHUB_OUTPUT"
          echo "HHS_HASH216_GENERATED_MAIN=$committed_sha"

      - name: Dispatch Exact-Main for generated current main
        if: github.event_name != 'pull_request' && steps.commit_projection.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_head"
          gh workflow run digitalocean-production-main.yml --ref main
          echo "HHS_HASH216_EXACT_MAIN_DISPATCHED=$remote_head"
