name: Pass 215 Iteration 4 Primitive Work Authority

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pass215-transformer-ingestion-benchmark
    paths:
      - 'contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json'
      - 'contracts/pass215/PASS_215_ITERATION_4_EXECUTED_WORK_ACCOUNTING_ADDENDUM.json'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v1.py'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v2.py'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v3.py'
      - 'tools/pass215_iteration4_exact_linear_execution_v2.py'
      - 'tests/test_hhs_pass215_iteration4_primitive_work_accounting_v2.py'
      - 'scripts/run_pass215_iteration4_primitive_work_validation.sh'
      - 'docs/pass215/**'
      - 'evidence/pass215/**'
      - '.github/workflows/pass215-iteration4-primitive-work-authority.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json'
      - 'contracts/pass215/PASS_215_ITERATION_4_EXECUTED_WORK_ACCOUNTING_ADDENDUM.json'
      - 'hhs_backend/runtime/hhs_pass215_iteration4_exact_linear_execution_v3.py'
      - 'tools/pass215_iteration4_exact_linear_execution_v2.py'
      - 'tests/test_hhs_pass215_iteration4_primitive_work_accounting_v2.py'
      - 'scripts/run_pass215_iteration4_primitive_work_validation.sh'
      - 'docs/pass215/**'
      - 'evidence/pass215/**'
      - '.github/workflows/pass215-iteration4-primitive-work-authority.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  PASS215_I4_MODEL_SHA256: '6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04'
  PASS215_I4_WORK_ADDENDUM_BLOB: '0a2f1448f565fb3eebfb50845c44404b68e93b8b'

jobs:
  primitive-work-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install pytest
      - name: Validate frozen instrument and work-accounting addendum
        run: |
          test "$(git hash-object contracts/pass215/PASS_215_BENCHMARK_PROFILE.json)" = "b458d674a75a4cfc64a32b9203dd693e3603576e"
          test "$(git hash-object contracts/pass215/PASS_215_ITERATION_4_EXECUTED_WORK_ACCOUNTING_ADDENDUM.json)" = "$PASS215_I4_WORK_ADDENDUM_BLOB"
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json').read_text())
          addendum = json.loads(Path('contracts/pass215/PASS_215_ITERATION_4_EXECUTED_WORK_ACCOUNTING_ADDENDUM.json').read_text())
          assert contract['inherits']['pass215_benchmark_profile_root_hash216'] == 'a3079f0f0b94d9fb485970662455482d4dab86e01802ca5bfdef6af3fbb6d85e'
          assert contract['inherits']['iteration3_real_model_evidence_root_hash216'] == '61e301f728e426b46dbdd7c435c06b7c7f0065b177d62313152494467ed7d021'
          assert contract['constraints']['post_hoc_candidate_redefinition_forbidden'] is True
          assert addendum['first_green_pre_repair_run'] == 31221256596
          assert addendum['preserve_pre_repair_evidence'] is True
          assert addendum['post_hoc_candidate_redefinition'] is False
          assert 'delta_weight_products' in addendum['excluded_capacity_or_attribution_keys']
          assert 'logical_weights' in addendum['excluded_capacity_or_attribution_keys']
          PY
      - name: Run cumulative Iteration 1-4 primitive-work validation
        run: bash scripts/run_pass215_iteration4_primitive_work_validation.sh
      - name: Download and verify authenticated open transformer
        run: |
          ROOT="$RUNNER_TEMP/pass215-i4-authority"
          mkdir -p "$ROOT"
          curl -L --fail --retry 3 --retry-delay 2 \
            -o "$ROOT/stories15M-q4_0.gguf" \
            'https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories15M-q4_0.gguf?download=true'
          echo "$PASS215_I4_MODEL_SHA256  $ROOT/stories15M-q4_0.gguf" | sha256sum -c -
      - name: Execute primitive-work evidence process A
        run: |
          ROOT="$RUNNER_TEMP/pass215-i4-authority"
          python tools/pass215_iteration4_exact_linear_execution_v2.py \
            --container "$ROOT/stories15M-q4_0.gguf" \
            --source-kind public_open_transformer \
            --repo-id ggml-org/tiny-llamas \
            --revision main \
            --expected-sha256 "$PASS215_I4_MODEL_SHA256" \
            --output "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_A.json"
          python tools/pass215_iteration4_exact_linear_execution_v2.py \
            --validate "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_A.json" \
            --output "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_A_VALIDATION.json"
      - name: Execute independent primitive-work replay process B
        run: |
          ROOT="$RUNNER_TEMP/pass215-i4-authority"
          python tools/pass215_iteration4_exact_linear_execution_v2.py \
            --container "$ROOT/stories15M-q4_0.gguf" \
            --source-kind public_open_transformer \
            --repo-id ggml-org/tiny-llamas \
            --revision main \
            --expected-sha256 "$PASS215_I4_MODEL_SHA256" \
            --output "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_B.json"
          python tools/pass215_iteration4_exact_linear_execution_v2.py \
            --validate "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_B.json" \
            --output "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_B_VALIDATION.json"
          python tools/pass215_iteration4_exact_linear_execution_v2.py \
            --compare-replay \
              "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_A.json" \
              "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_B.json" \
            --output "$ROOT/PASS_215_ITERATION_4_PRIMITIVE_WORK_CROSS_PROCESS_VALIDATION.json"
      - name: Enforce authoritative primitive-work accounting and claim boundaries
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'pass215-i4-authority'
          evidence = json.loads((root / 'PASS_215_ITERATION_4_PRIMITIVE_WORK_A.json').read_text())
          accounting = evidence['work_accounting']
          assert accounting['addendum_git_blob_sha1'] == os.environ['PASS215_I4_WORK_ADDENDUM_BLOB']
          assert accounting['pre_repair_evidence_preserved'] is True
          assert accounting['post_hoc_candidate_redefinition'] is False
          aggregate = evidence['aggregate_execution']
          assert aggregate['operator_count'] == 7
          assert aggregate['source_tensor_bytes'] == 559872
          assert aggregate['quantization_blocks'] == 31104
          assert aggregate['logical_weights'] == 995328
          assert aggregate['dense_reference_work']['exact_rational_scale_multiplications'] == 995328
          assert aggregate['factored_reference_work']['exact_rational_scale_multiplications'] == 31104
          assert aggregate['rational_scale_multiplications_avoided_by_factoring'] == 964224
          assert aggregate['dense_to_factored_rational_scale_multiplication_ratio_exact'] == {'numerator': 32, 'denominator': 1}
          assert aggregate['dense_reference_work']['executed_work_units_total'] == 3014112
          assert aggregate['factored_reference_work']['executed_work_units_total'] == 2049888
          assert aggregate['single_region_continuation_work']['executed_work_units_total'] == 11911
          assert aggregate['single_region_full_recompute_control_work']['executed_work_units_total'] == 2049888
          assert aggregate['single_region_executed_work_ratio_exact'] == {'numerator': 2049888, 'denominator': 11911}
          assert aggregate['multi_region_continuation_work']['executed_work_units_total'] == 47644
          assert aggregate['multi_region_full_recompute_control_work']['executed_work_units_total'] == 2049888
          assert aggregate['multi_region_executed_work_ratio_exact'] == {'numerator': 512472, 'denominator': 11911}
          assert aggregate['semantic_exactness'] is True
          assert evidence['controls']['iteration2']['raw_canonical_incidence_fraction_exact'] == {'numerator': 0, 'denominator': 1}
          assert evidence['controls']['iteration3']['transformer_layer_dictionary_gain_bytes'] == 0
          assert evidence['controls']['iteration3']['embedding_output_storage_gain_excluded_from_execution_gain'] is True
          claims = evidence['claims']
          assert claims['authenticated_real_open_transformer_execution_measured'] is True
          assert claims['dense_factored_semantic_exactness'] is True
          assert claims['linear_continuation_delta_executed'] is True
          assert claims['full_transformer_layer_forward_executed'] is False
          assert claims['canonical_float_interpretation_performed'] is False
          assert claims['dense_forward_replaced'] is False
          assert claims['exact_nonlinear_transformer_operators_implemented'] is False
          assert claims['pass213_compiled_rom_runtime_mutation_performed'] is False
          assert evidence['authority']['runtime_mutation_authority_promoted'] is False
          assert evidence['authority']['canonical_mutation_authorized'] is False
          replay = json.loads((root / 'PASS_215_ITERATION_4_PRIMITIVE_WORK_CROSS_PROCESS_VALIDATION.json').read_text())
          assert replay['valid'] is True
          assert replay['separate_process_invocations'] is True
          assert replay['primitive_work_accounting'] is True
          print('PASS215_I4_DENSE_PRIMITIVE_WORK=' + str(aggregate['dense_reference_work']['executed_work_units_total']))
          print('PASS215_I4_FACTORED_PRIMITIVE_WORK=' + str(aggregate['factored_reference_work']['executed_work_units_total']))
          print('PASS215_I4_SINGLE_DELTA_PRIMITIVE_WORK=' + str(aggregate['single_region_continuation_work']['executed_work_units_total']))
          print('PASS215_I4_SINGLE_FULL_PRIMITIVE_WORK=' + str(aggregate['single_region_full_recompute_control_work']['executed_work_units_total']))
          print('PASS215_I4_MULTI_DELTA_PRIMITIVE_WORK=' + str(aggregate['multi_region_continuation_work']['executed_work_units_total']))
          print('PASS215_I4_MULTI_FULL_PRIMITIVE_WORK=' + str(aggregate['multi_region_full_recompute_control_work']['executed_work_units_total']))
          print('PASS215_I4_SUITE_ROOT=' + evidence['suite_output_root_hash216'])
          print('PASS215_I4_AUTHORITY_EVIDENCE_ROOT=' + evidence['evidence_root_hash216'])
          PY
      - name: Retain authoritative Iteration 4 primitive-work evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass215-iteration4-primitive-work-${{ github.run_id }}
          path: |
            contracts/pass215/PASS_215_BENCHMARK_PROFILE.json
            contracts/pass215/PASS_215_ITERATION_1_CONTRACT.json
            contracts/pass215/PASS_215_ITERATION_2_CONTRACT.json
            contracts/pass215/PASS_215_ITERATION_3_CONTRACT.json
            contracts/pass215/PASS_215_ITERATION_4_CONTRACT.json
            contracts/pass215/PASS_215_ITERATION_4_EXECUTED_WORK_ACCOUNTING_ADDENDUM.json
            docs/pass215/**
            evidence/pass215/**
            ${{ runner.temp }}/pass215-i4-authority/*.json
          if-no-files-found: error
